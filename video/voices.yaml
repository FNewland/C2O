# Narration voices, one per language. Change here, re-render; the audio cache
# is keyed on the voice, so nothing stale is reused.
#
# Licences (checked 2026-11-05): Kokoro-82M weights Apache-2.0 (hexgrad),
# kokoro-onnx runtime MIT, espeak-ng (phonemiser, French) GPL-3.0 as a tool
# only. None of them restricts the audio, so videos can be released CC0.
# Do NOT switch to XTTS-v2 (CPML: non-commercial, outputs included) or to
# edge-tts (Microsoft's service terms) for published material.
#
# Since 2026-11-09 both languages are Franz Newland's own voice, cloned with
# Chatterbox Multilingual (Resemble AI, MIT; output watermarked as synthetic)
# from his reference recordings. The recordings are personal and are NOT in
# the repository: put them in $C2O_VIDEO_CACHE/voices/ (franz_en.wav,
# franz_fr.wav; 10-15 s of clean speech each). Chatterbox runs in its own
# virtualenv (`python`), see c2ovideo/cbx_worker.py.
en:
  backend: chatterbox
  ref: franz_en.wav
  python: ~/cbx-venv/bin/python
  lang: en
  exaggeration: 0.5
  cfg_weight: 0.5
fr:
  backend: chatterbox
  ref: franz_fr.wav
  python: ~/cbx-venv/bin/python
  lang: fr
  exaggeration: 0.5
  cfg_weight: 0.5
# Previous synthetic voices (Kokoro, no reference recording needed):
#   en: {backend: kokoro, voice: af_heart, lang: en-us, speed: 1.0}   # bm_george / bm_lewis for British male
#   fr: {backend: kokoro, voice: ff_siwis, lang: fr-fr, speed: 1.0}
# Alternative European French voice (Piper, `pip install piper-tts`):
#   fr:
#     backend: piper
#     model: fr_FR-tom-medium.onnx     # check the model card licence first
#     sample_rate: 22050
