# Acronyms and abbreviations used (or about to be used) in the course videos.
#
# The rule for narration (video/README.md, "Acronyms"): the first time a video
# SAYS an acronym, it says the full form, then the short form the team uses
# ("nominal procedure one, NOM-001 — nom for short"). After that the short form
# is fine. Each video stands alone: learners watch them out of order, so the
# first use is counted per video and per language.
#
#   en / fr     the expansion, as the narrator should say it at first use.
#               The lint looks for its leading words near the first use.
#   short       how operators say the short form aloud (doc only; the
#               pronunciation itself lives in en.yaml / fr.yaml).
#   expand      false: a state word, label or name that needs no expansion
#               (GO, SAFE, NONE, GPS…). Listed so the lint knows it is deliberate.
#   kind        letters | word: whether it is spelled or said as a word.
#
# Sources: sim/docs (OPERATIONS_GUIDE, PUS_SERVICE_REFERENCE, TIME_ARCHITECTURE,
# INSTRUCTOR_GUIDE glossary), design/docs/oer, the i18n glossaries.

# --- procedure card prefixes ------------------------------------------------
NOM:   {en: "nominal procedure", fr: "procédure nominale", short: {en: nom, fr: nom}, kind: word, expand: true}
LEOP:  {en: "launch and early orbit phase", fr: "phase de lancement et de début d’orbite", short: {en: lee-op, fr: Léop}, kind: word, expand: true}
COM:   {en: "commissioning procedure", fr: "procédure de mise en service", short: {en: com, fr: com}, kind: word, expand: true}
CTG:   {en: "contingency procedure", fr: "procédure de contingence", short: {en: contingency, fr: contingence}, kind: word, expand: true}
EMG:   {en: "emergency procedure", fr: "procédure d’urgence", short: {en: emergency, fr: urgence}, kind: word, expand: true}

