# Week 5 — LEOP-005: record the rates, see the AOCS hand itself from DETUMBLE
# to COARSE_SUN live, and check the sun hold; command nothing. From
# card-LEOP-005, frozen in setup so the handover happens on camera. The
# fly-through's tip-off rates are small: the narration says real ones are
# usually larger. Prepares WB-5.5-L005 steps 1, 3 and 4.
id: V-OPS-07
week: 5
audience: all
title:
  en: "LEOP-005: monitoring the autonomous Sun acquisition"
  fr: "LEOP-005 : suivi de l’acquisition autonome du Soleil"
summary:
  en: "This video records the body rates and follows the magnetorquers as they slow the spacecraft. The AOCS then switches to Sun pointing on its own, and the operator checks the Sun-pointing attitude and the resulting increase in power."
  fr: "Cette vidéo relève les vitesses angulaires et suit les magnétocoupleurs pendant qu’ils ralentissent le satellite. Le SCAO passe ensuite de lui-même au pointage solaire, et l’opérateur vérifie l’attitude de pointage solaire et l’augmentation de puissance qui en résulte."
apps:
  mcs: default
fresh_stack: sim
ties:
  worksheets: [WB-5.5-L005, WB-5.5-L005/q1, WB-5.5-L005/q3, WB-5.5-L005/q4]
  cards: [LEOP-005]
sources:
  - sim/configs/eosat1/procedures/leop/sun_acquisition.md (LEOP-005)

setup:
  - api: {app: instructor, method: POST, path: /api/command, json: {type: load_breakpoint, name: card-LEOP-005}}
  - wait: 1
  # freeze at once: the handover comes ~30 s after the rates settle, and must
  # happen on camera. The simulator keeps contact (pass override) meanwhile.
  - api: {app: instructor, method: POST, path: /api/command, json: {type: freeze}}
  - api: {app: instructor, method: POST, path: /api/command, json: {type: override_passes, enabled: true}}
  - api: {app: mcs, method: POST, path: /api/pus-command, json: {service: 3, subtype: 27, data_hex: "0002", name: HK_REQUEST, position: flight_director}}
  - api: {app: instructor, method: POST, path: /api/command, json: {type: step, seconds: 3}}
  - wait: 3
  - goto: {app: mcs, path: "/?lang={lang}&position=flight_director", settle: 4}
  - js: "fetch('/api/logbook', {method: 'DELETE', credentials: 'same-origin'})"
  - reload: 4

steps:
  - id: rates
    title: {en: "Step 1: record the starting rates", fr: "Étape 1 : relever les vitesses de départ"}
    say:
      en: >-
        DETUMBLE has been running since the previous procedure. LEOP-005, a procedure of the
        launch and early orbit phase, sends no commands; it is an observation procedure. On the
        attitude page, the operator records the starting point: the mode and the three body
        rates, roll, pitch and yaw. In this example, the separation left EOSAT-1 rotating very
        slowly. A real separation often leaves rates of a few degrees per second, in which case
        the B-dot magnetic control law needs several tens of minutes, roughly halving the rates
        every ten to fifteen minutes.
      fr: >-
        DETUMBLE est actif depuis la procédure précédente. LEOP-005, une procédure de la phase
        de lancement et de début d’orbite, n’envoie aucune commande : c’est une procédure
        d’observation. Sur la page attitude, l’opérateur relève le point de départ : le mode et
        les trois vitesses angulaires, roulis, tangage et lacet. Dans cet exemple, la séparation
        a laissé EOSAT-1 tourner très lentement. Une séparation réelle laisse souvent quelques
        degrés par seconde ; la loi de commande magnétique B-dot a alors besoin de plusieurs
        dizaines de minutes, et divise les vitesses à peu près par deux toutes les dix à quinze
        minutes.
    do:
      - click: {css: "#rail-aocs"}
      - wait: 2.0
      - highlight: {target: {css: "#page-aocs tr[data-param='0x020F']"}, seconds: 2.5}
      - highlight: {target: {css: "#page-aocs tr[data-param='0x0204']"}, seconds: 2}
      - highlight: {target: {css: "#page-aocs tr[data-param='0x0206']"}, seconds: 2}
    question:
      type: multichoice
      worksheet: WB-5.5-L005/q1
      text:
        en: "The rates are not falling after fifteen minutes of DETUMBLE. What do you look at first?"
        fr: "Les vitesses ne baissent pas après quinze minutes de DETUMBLE. Que regardez-vous d’abord ?"
      options:
        - text: {en: "The measured magnetic field and the magnetometer and magnetorquer enable flags.", fr: "Le champ magnétique mesuré et les indicateurs d’activation du magnétomètre et des magnétocoupleurs."}
          correct: true
          why: {en: "B-dot needs both legs. A zeroed field means it is blind.", fr: "B-dot a besoin des deux. Un champ à zéro signifie qu’il est aveugle."}
        - text: {en: "Command COARSE_SUN to force the spacecraft out of DETUMBLE.", fr: "Commander COARSE_SUN pour forcer la sortie de DETUMBLE."}
          why: {en: "Sun pointing at high rates cannot hold; the card forbids commanding it.", fr: "Le pointage solaire à vitesse élevée ne tient pas ; la fiche interdit de le commander."}
        - text: {en: "The reaction wheel speeds.", fr: "Les vitesses des roues de réaction."}
          why: {en: "The wheels are still disabled at this point.", fr: "Les roues sont encore désactivées à ce stade."}

  - id: handover
    title: {en: "Step 3: the automatic handover", fr: "Étape 3 : le passage automatique"}
    say:
      en: >-
        When all three rates have remained below half a degree per second for thirty seconds,
        the attitude and orbit control system, or AOCS, changes from DETUMBLE to COARSE_SUN,
        coarse Sun pointing, on its own. The operator monitors the mode but does not command the
        change, since the spacecraft performs it autonomously. The operator's task is to observe
        the transition and record the time.
      fr: >-
        Lorsque les trois vitesses sont restées sous un demi-degré par seconde pendant trente
        secondes, le système de contrôle d’attitude et d’orbite, le SCAO, passe de lui-même de
        DETUMBLE à COARSE_SUN, le pointage solaire grossier. L’opérateur surveille le mode mais
        ne commande pas ce changement, que le satellite effectue de façon autonome. Son rôle est
        d’observer la transition et d’en noter l’heure.
    do:
      - api: {app: instructor, method: POST, path: /api/command, json: {type: resume}}
      - highlight: {target: {css: "#page-aocs tr[data-param='0x020F']"}, seconds: 3}
      - wait_for: {target: {css: "#page-aocs tr[data-param='0x020F']:has-text('COARSE')"}, timeout: 90}
      - highlight: {target: {css: "#page-aocs tr[data-param='0x020F']"}, seconds: 3}
    question:
      type: truefalse
      worksheet: WB-5.5-L005/q3
      answer: false
      text:
        en: "Once the rates are low, command AOCS_SET_MODE(mode=3) to enter COARSE_SUN."
        fr: "Une fois les vitesses faibles, commandez AOCS_SET_MODE(mode=3) pour passer en COARSE_SUN."

  - id: hold
    title: {en: "Step 4: Sun pointing", fr: "Étape 4 : le pointage solaire"}
    say:
      en: >-
        In COARSE_SUN, the attitude error, which is the angle between the spacecraft pointing
        and the Sun direction, decreases. Without the reaction wheels, using the magnetorquers
        alone, this is slow and imprecise, and the procedure allows ten minutes for the error to
        fall below fifteen degrees. The operator requests the coarse Sun sensor confidence by
        its parameter number; a value above one half means that the sensors can see the Sun.
      fr: >-
        En COARSE_SUN, l’erreur d’attitude, c’est-à-dire l’angle entre le pointage du satellite
        et la direction du Soleil, diminue. Sans les roues de réaction, avec les seuls
        magnétocoupleurs, c’est lent et imprécis, et la procédure accorde dix minutes pour que
        l’erreur descende sous quinze degrés. L’opérateur demande l’indice de confiance des
        capteurs solaires grossiers par son numéro de paramètre ; une valeur supérieure à un
        demi signifie que les capteurs voient le Soleil.
    do:
      - highlight: {target: {css: "#page-aocs tr[data-param='0x0217']"}, seconds: 3}
      - click: {css: "#rail-cmd"}
      - select: {target: {css: "#cmd-catalog"}, value: GET_PARAM}
      - fill: {target: {css: "#cmd-fields [data-cmd-field='param_id']"}, text: "533"}
      - click: {css: "#cmd-send"}
      - wait: 2.0
      - click: {css: "#rail-aocs"}
      - wait: 1.5
      - highlight: {target: {css: "#page-aocs tr[data-param='0x0215']"}, seconds: 3}
    question:
      type: reflect
      worksheet: WB-5.5-L005/q4
      text:
        en: "The attitude error stays at 20° for ten minutes in COARSE_SUN. What do you check, in what order, before you call anyone?"
        fr: "L’erreur d’attitude reste à 20° pendant dix minutes en COARSE_SUN. Que vérifiez-vous, dans quel ordre, avant d’appeler qui que ce soit ?"

  - id: power
    title: {en: "Step 5: the power gain", fr: "Étape 5 : le gain de puissance"}
    say:
      en: >-
        The purpose of this sequence can be seen on the power page. As the wings turn towards
        the Sun, the generated power increases, and the orbit-average margin, the energy
        generated minus the energy consumed over an orbit, increases with it. During eclipse
        there is nothing to observe, and the procedure instructs the operator to wait for
        eclipse exit and repeat the check.
      fr: >-
        L’objet de cette séquence apparaît sur la page énergie. À mesure que les ailes se
        tournent vers le Soleil, la puissance produite augmente, et avec elle la marge moyenne
        sur l’orbite, c’est-à-dire l’énergie produite moins l’énergie consommée sur une orbite.
        Pendant l’éclipse, il n’y a rien à observer : la procédure demande d’attendre la sortie
        d’éclipse et de refaire la vérification.
    do:
      - click: {css: "#rail-eps"}
      - wait: 2.0
      - highlight: {target: {css: "#eps-flow"}, seconds: 4, point: false}
      - highlight: {target: {css: "#eps-orbit-margin"}, seconds: 3}
