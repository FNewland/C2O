# Week 5 — LEOP-005: watch B-dot damp the rates and the AOCS hand itself to
# COARSE_SUN; command nothing. From card-LEOP-005. To show the whole damping
# in one video the simulator keeps contact (pass override) and runs faster;
# the narration says so. Prepares WB-5.5-L005 steps 1–4.
id: V-OPS-07
week: 5
audience: all
title:
  en: "LEOP-005: sun acquisition, hands off"
  fr: "LEOP-005 : acquisition du Soleil, sans toucher"
summary:
  en: "Record the body rates, watch the magnetorquers slow the spacecraft down, see the AOCS switch itself to sun pointing, and check the sun hold and the power it brings."
  fr: "Relever les vitesses angulaires, regarder les magnéto-coupleurs ralentir le satellite, voir le SCAO passer de lui-même au pointage solaire, et vérifier la tenue au Soleil et la puissance qu’elle apporte."
apps:
  mcs: default
fresh_stack: sim
ties:
  worksheets: [WB-5.5-L005, WB-5.5-L005/q1, WB-5.5-L005/q3, WB-5.5-L005/q4]
  cards: [LEOP-005]
sources:
  - sim/configs/eosat1/procedures/leop/sun_acquisition.md (LEOP-005)

setup:
  - api: {app: instructor, method: POST, path: /api/command, json: {type: load_breakpoint, name: card-LEOP-005}}
  - wait: 2
  - python: {call: "video/c2ovideo/helpers.py:ff_to_pass", app: instructor, kwargs: {planner: "${planner_url}", min_duration: 420, min_elevation: 15, after_aos: 10}}
  - api: {app: mcs, method: POST, path: /api/pus-command, json: {service: 3, subtype: 27, data_hex: "0002", name: HK_REQUEST, position: flight_director}}
  - wait: 3
  - goto: {app: mcs, path: "/?lang={lang}&position=flight_director", settle: 4}
  - js: "fetch('/api/logbook', {method: 'DELETE', credentials: 'same-origin'})"
  - reload: 4

steps:
  - id: rates
    title: {en: "Step 1: record the starting rates", fr: "Étape 1 : relever les vitesses de départ"}
    say:
      en: >-
        DETUMBLE is running from the previous card. This card commands nothing: it observes.
        Open the attitude page and record the starting point: the mode, and the three body
        rates, roll, pitch and yaw. After separation a few degrees per second on each axis is
        normal. These numbers are your baseline.
      fr: >-
        DETUMBLE tourne depuis la fiche précédente. Cette fiche ne commande rien : elle
        observe. Ouvrez la page attitude et relevez le point de départ : le mode, et les trois
        vitesses angulaires, roulis, tangage et lacet. Après la séparation, quelques degrés par
        seconde sur chaque axe, c’est normal. Ces valeurs sont votre référence.
    do:
      - click: {css: "#rail-aocs"}
      - wait: 3.0
      - highlight: {target: {css: "#aocs-att2d"}, seconds: 3, point: false}
      - highlight: {target: {css: "#page-aocs tr[data-param='0x020F']"}, seconds: 2}
      - highlight: {target: {css: "#page-aocs tr[data-param='0x0204']"}, seconds: 2}
      - highlight: {target: {css: "#page-aocs tr[data-param='0x0206']"}, seconds: 2}

  - id: damping
    title: {en: "Step 2: watch the rates fall", fr: "Étape 2 : regarder les vitesses baisser"}
    say:
      en: >-
        B-dot roughly halves the rates every ten to fifteen minutes, so this takes a while.
        To show it in one go, the simulator now keeps the link open and runs twenty times
        faster; in operations you would follow it across several passes. Watch the rates come
        down. If they do not, look at the magnetic field first: a zero means the magnetometer
        dropped out and B-dot is blind.
      fr: >-
        B-point divise à peu près les vitesses par deux toutes les dix à quinze minutes : cela
        prend du temps. Pour le montrer d’un seul tenant, le simulateur garde maintenant la
        liaison ouverte et tourne vingt fois plus vite ; en exploitation, vous le suivriez sur
        plusieurs passages. Regardez les vitesses baisser. Si elles ne baissent pas, regardez
        d’abord le champ magnétique : un zéro signifie que le magnétomètre a décroché et que
        B-point est aveugle.
    do:
      - api: {app: instructor, method: POST, path: /api/command, json: {type: override_passes, enabled: true}}
      - api: {app: instructor, method: POST, path: /api/command, json: {type: set_speed, value: 20}}
      - wait: 4
      - highlight: {target: {css: "#page-aocs tr[data-param='0x0204']"}, seconds: 3}
      - highlight: {target: {css: "#page-aocs tr[data-param='0x0277']"}, seconds: 3}
    question:
      type: multichoice
      worksheet: WB-5.5-L005/q1
      text:
        en: "Why does this card command nothing during the damping?"
        fr: "Pourquoi cette fiche ne commande-t-elle rien pendant l’amortissement ?"
      options:
        - text: {en: "B-dot runs on board; the operator's job is to confirm it works and to step in only if it does not.", fr: "B-point tourne à bord ; le rôle de l’opérateur est de confirmer qu’il fonctionne et d’intervenir seulement s’il ne fonctionne pas."}
          correct: true
          why: {en: "The off-nominal section says what to check if the rates stop falling.", fr: "La section hors nominal dit quoi vérifier si les vitesses cessent de baisser."}
        - text: {en: "Commands are refused in DETUMBLE.", fr: "Les commandes sont refusées en DETUMBLE."}
          why: {en: "They are accepted; there is simply nothing to command.", fr: "Elles sont acceptées ; il n’y a simplement rien à commander."}
        - text: {en: "The transmitter is off during DETUMBLE.", fr: "L’émetteur est éteint pendant DETUMBLE."}
          why: {en: "The link has nothing to do with the attitude mode.", fr: "La liaison n’a rien à voir avec le mode d’attitude."}

  - id: handover
    title: {en: "Step 3: the automatic handover", fr: "Étape 3 : le passage automatique"}
    say:
      en: >-
        When all three rates have stayed below half a degree per second for thirty seconds,
        the AOCS switches itself from DETUMBLE to COARSE_SUN. Do not command that mode: you
        would be asking for something the spacecraft does on its own. Your job is to see it
        happen, and to find it in the event log.
      fr: >-
        Quand les trois vitesses sont restées sous un demi-degré par seconde pendant trente
        secondes, le SCAO passe de lui-même de DETUMBLE à COARSE_SUN. Ne commandez pas ce
        mode : vous demanderiez ce que le satellite fait tout seul. Votre rôle est de le voir
        se produire, et de le retrouver dans le journal des événements.
    do:
      - wait_for: {target: {css: "#page-aocs tr[data-param='0x020F']:has-text('COARSE')"}, timeout: 240}
      - api: {app: instructor, method: POST, path: /api/command, json: {type: set_speed, value: 1}}
      - highlight: {target: {css: "#page-aocs tr[data-param='0x020F']"}, seconds: 3}
      - click: {css: "[data-bd='events']"}
      - wait: 1.0
      - highlight: {target: {css: "#bdp-events :text-matches('COARSE', 'i')"}, seconds: 3}
    question:
      type: truefalse
      worksheet: WB-5.5-L005/q3
      answer: false
      text:
        en: "Once the rates are low, command AOCS_SET_MODE(mode=3) to enter COARSE_SUN."
        fr: "Une fois les vitesses faibles, commandez AOCS_SET_MODE(mode=3) pour passer en COARSE_SUN."

  - id: hold
    title: {en: "Step 4: the sun hold, and the power", fr: "Étape 4 : la tenue au Soleil, et la puissance"}
    say:
      en: >-
        In COARSE_SUN the attitude error converges towards the Sun; within fifteen degrees is
        enough here, since there are no wheels yet, only magnetorquers. The coarse sun sensors
        report how confident they are that they see the Sun. And the reason for all of this is
        on the power page: with the wings facing the Sun, generation climbs well above what the
        tumbling spacecraft gave.
      fr: >-
        En COARSE_SUN, l’erreur d’attitude converge vers le Soleil ; à quinze degrés près,
        cela suffit ici, puisqu’il n’y a pas encore de roues, seulement les magnéto-coupleurs.
        Les capteurs solaires grossiers indiquent leur confiance de voir le Soleil. Et la raison
        de tout cela se trouve sur la page énergie : ailes face au Soleil, la production monte
        bien au-dessus de ce que donnait le satellite en rotation.
    do:
      - highlight: {target: {css: "#page-aocs tr[data-param='0x0217']"}, seconds: 3}
      - click: {css: "#rail-eps"}
      - wait: 2.0
      - highlight: {target: {css: "#eps-flow"}, seconds: 4, point: false}
    question:
      type: reflect
      worksheet: WB-5.5-L005/q4
      text:
        en: "The attitude error stays at 20° for ten minutes in COARSE_SUN. What do you check, in what order, before you call anyone?"
        fr: "L’erreur d’attitude reste à 20° pendant dix minutes en COARSE_SUN. Que vérifiez-vous, dans quel ordre, avant d’appeler qui que ce soit ?"
