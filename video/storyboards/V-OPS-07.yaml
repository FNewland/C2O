# Week 5 — LEOP-005: record the rates, see the AOCS hand itself from DETUMBLE
# to COARSE_SUN live, and check the sun hold; command nothing. From
# card-LEOP-005, frozen in setup so the handover happens on camera. The
# fly-through's tip-off rates are small: the narration says real ones are
# usually larger. Prepares WB-5.5-L005 steps 1, 3 and 4.
id: V-OPS-07
week: 5
audience: all
hold: "AOCS model: the sun hold and the NOMINAL pointing do not converge (docs/plan_2026-11/AOCS_COARSE_SUN_MTQ_ONLY.md)"
title:
  en: "LEOP-005: sun acquisition, hands off"
  fr: "LEOP-005 : acquisition du Soleil, sans toucher"
summary:
  en: "Record the body rates, watch the magnetorquers slow the spacecraft down, see the AOCS switch itself to sun pointing, and check the sun hold and the power it brings."
  fr: "Relever les vitesses angulaires, regarder les magnétocoupleurs ralentir le satellite, voir le SCAO passer de lui-même au pointage solaire, et vérifier la tenue au Soleil et la puissance qu’elle apporte."
apps:
  mcs: default
fresh_stack: sim
ties:
  worksheets: [WB-5.5-L005, WB-5.5-L005/q1, WB-5.5-L005/q3, WB-5.5-L005/q4]
  cards: [LEOP-005]
sources:
  - sim/configs/eosat1/procedures/leop/sun_acquisition.md (LEOP-005)

setup:
  - api: {app: instructor, method: POST, path: /api/command, json: {type: load_breakpoint, name: card-LEOP-005}}
  - wait: 1
  # freeze at once: the handover comes ~30 s after the rates settle, and must
  # happen on camera. The simulator keeps contact (pass override) meanwhile.
  - api: {app: instructor, method: POST, path: /api/command, json: {type: freeze}}
  - api: {app: instructor, method: POST, path: /api/command, json: {type: override_passes, enabled: true}}
  - api: {app: mcs, method: POST, path: /api/pus-command, json: {service: 3, subtype: 27, data_hex: "0002", name: HK_REQUEST, position: flight_director}}
  - api: {app: instructor, method: POST, path: /api/command, json: {type: step, seconds: 3}}
  - wait: 3
  - goto: {app: mcs, path: "/?lang={lang}&position=flight_director", settle: 4}
  - js: "fetch('/api/logbook', {method: 'DELETE', credentials: 'same-origin'})"
  - reload: 4

steps:
  - id: rates
    title: {en: "Step 1: record the starting rates", fr: "Étape 1 : relever les vitesses de départ"}
    say:
      en: >-
        DETUMBLE is running from the previous card. This launch and early orbit phase card,
        LEOP-005, commands nothing: it observes. Open the attitude page and record the starting
        point: the mode, and the three body rates, roll, pitch and yaw. In this run the
        separation left EOSAT-1 turning very slowly. A real separation often leaves a few
        degrees per second, and then B-dot, the magnetic braking law, needs tens of minutes,
        roughly halving the rates every ten to fifteen.
      fr: >-
        DETUMBLE tourne depuis la fiche précédente. Cette fiche de la phase de lancement et de
        début d’orbite, LEOP-005, ne commande rien : elle observe. Ouvrez la page attitude et
        relevez le point de départ : le mode, et les trois vitesses angulaires, roulis, tangage
        et lacet. Dans ce déroulé, la séparation a laissé EOSAT-1 tourner très lentement. Une
        vraie séparation laisse souvent quelques degrés par seconde, et B-dot, la loi de
        freinage magnétique, a alors besoin de dizaines de minutes, en divisant à peu près les
        vitesses par deux toutes les dix à quinze.
    do:
      - click: {css: "#rail-aocs"}
      - wait: 2.0
      - highlight: {target: {css: "#page-aocs tr[data-param='0x020F']"}, seconds: 2.5}
      - highlight: {target: {css: "#page-aocs tr[data-param='0x0204']"}, seconds: 2}
      - highlight: {target: {css: "#page-aocs tr[data-param='0x0206']"}, seconds: 2}
    question:
      type: multichoice
      worksheet: WB-5.5-L005/q1
      text:
        en: "The rates are not falling after fifteen minutes of DETUMBLE. What do you look at first?"
        fr: "Les vitesses ne baissent pas après quinze minutes de DETUMBLE. Que regardez-vous d’abord ?"
      options:
        - text: {en: "The measured magnetic field and the magnetometer and magnetorquer enable flags.", fr: "Le champ magnétique mesuré et les indicateurs d’activation du magnétomètre et des magnétocoupleurs."}
          correct: true
          why: {en: "B-dot needs both legs. A zeroed field means it is blind.", fr: "B-dot a besoin des deux. Un champ à zéro signifie qu’il est aveugle."}
        - text: {en: "Command COARSE_SUN to force the spacecraft out of DETUMBLE.", fr: "Commander COARSE_SUN pour forcer la sortie de DETUMBLE."}
          why: {en: "Sun pointing at high rates cannot hold; the card forbids commanding it.", fr: "Le pointage solaire à vitesse élevée ne tient pas ; la fiche interdit de le commander."}
        - text: {en: "The reaction wheel speeds.", fr: "Les vitesses des roues de réaction."}
          why: {en: "The wheels are still disabled at this point.", fr: "Les roues sont encore désactivées à ce stade."}

  - id: handover
    title: {en: "Step 3: the automatic handover", fr: "Étape 3 : le passage automatique"}
    say:
      en: >-
        When all three rates have stayed below half a degree per second for thirty seconds,
        the attitude and orbit control system, the AOCS, switches itself from DETUMBLE to
        COARSE_SUN, coarse sun pointing. Watch the mode. Do not command
        it: you would be asking for something the spacecraft does on its own. Your job is to
        see it happen and log the time.
      fr: >-
        Quand les trois vitesses sont restées sous un demi-degré par seconde pendant trente
        secondes, le système de contrôle d’attitude et d’orbite, le SCAO, passe de lui-même de
        DETUMBLE à COARSE_SUN, le pointage solaire grossier. Surveillez le mode. Ne le
        commandez pas : vous demanderiez ce que le satellite fait tout seul. Votre rôle est de
        le voir se produire et d’en noter l’heure.
    do:
      - api: {app: instructor, method: POST, path: /api/command, json: {type: resume}}
      - highlight: {target: {css: "#page-aocs tr[data-param='0x020F']"}, seconds: 3}
      - wait_for: {target: {css: "#page-aocs tr[data-param='0x020F']:has-text('COARSE')"}, timeout: 90}
      - highlight: {target: {css: "#page-aocs tr[data-param='0x020F']"}, seconds: 3}
    question:
      type: truefalse
      worksheet: WB-5.5-L005/q3
      answer: false
      text:
        en: "Once the rates are low, command AOCS_SET_MODE(mode=3) to enter COARSE_SUN."
        fr: "Une fois les vitesses faibles, commandez AOCS_SET_MODE(mode=3) pour passer en COARSE_SUN."

  - id: hold
    title: {en: "Step 4: the sun hold", fr: "Étape 4 : la tenue au Soleil"}
    say:
      en: >-
        In COARSE_SUN the attitude error, the angle between the pointing and the Sun, shrinks.
        With no wheels yet, only
        magnetorquers, it is slow and rough: the card allows ten minutes to get within fifteen
        degrees. Ask for the coarse sun sensors' confidence by parameter number: above one half,
        they see the Sun.
      fr: >-
        En COARSE_SUN, l’erreur d’attitude, l’angle entre le pointage et le Soleil, diminue.
        Sans roues, avec les seuls
        magnétocoupleurs, c’est lent et approximatif : la fiche accorde dix minutes pour
        descendre sous quinze degrés. Demandez la confiance des capteurs solaires grossiers par
        son numéro de paramètre : au-dessus d’un demi, ils voient le Soleil.
    do:
      - highlight: {target: {css: "#page-aocs tr[data-param='0x0217']"}, seconds: 3}
      - click: {css: "#rail-cmd"}
      - select: {target: {css: "#cmd-catalog"}, value: GET_PARAM}
      - fill: {target: {css: "#cmd-fields [data-cmd-field='param_id']"}, text: "533"}
      - click: {css: "#cmd-send"}
      - wait: 2.0
      - click: {css: "#rail-aocs"}
      - wait: 1.5
      - highlight: {target: {css: "#page-aocs tr[data-param='0x0215']"}, seconds: 3}
    question:
      type: reflect
      worksheet: WB-5.5-L005/q4
      text:
        en: "The attitude error stays at 20° for ten minutes in COARSE_SUN. What do you check, in what order, before you call anyone?"
        fr: "L’erreur d’attitude reste à 20° pendant dix minutes en COARSE_SUN. Que vérifiez-vous, dans quel ordre, avant d’appeler qui que ce soit ?"

  - id: power
    title: {en: "Step 5: what it brings", fr: "Étape 5 : ce que cela apporte"}
    say:
      en: >-
        The reason for all of this is on the power page. As the wings turn to the Sun,
        generation climbs and the orbit-average margin, energy in minus energy out over an
        orbit, moves up with it. In eclipse there is
        nothing to see: the card says to wait for eclipse exit and check again.
      fr: >-
        La raison de tout cela se trouve sur la page énergie. À mesure que les ailes se tournent
        vers le Soleil, la production monte, et avec elle la marge moyenne sur l’orbite,
        l’énergie qui entre moins celle qui sort sur une orbite. En
        éclipse, il n’y a rien à voir : la fiche dit d’attendre la sortie d’éclipse et de
        vérifier à nouveau.
    do:
      - click: {css: "#rail-eps"}
      - wait: 2.0
      - highlight: {target: {css: "#eps-flow"}, seconds: 4, point: false}
      - highlight: {target: {css: "#eps-orbit-margin"}, seconds: 3}
