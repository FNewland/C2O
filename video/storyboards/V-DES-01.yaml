# Design concept — the Canadian space landscape a university mission works in:
# the agency, the industry, the niche strategy, and the regulators and launch
# route a CubeSat meets. Animated page video/explainers/landscape.html.
# Whole design team. Facts checked against primary sources on 2026-11-06:
# RSSSA administered by Global Affairs Canada; Controlled Goods Program by
# PSPC; Bill C-28 (Canadian Space Launch Act) at second reading on
# 2026-10-23; sector revenue and jobs from the CSA State of the Canadian
# Space Sector Report 2025 (2024 data). Textbook ch. 2 corrected to match.
id: V-DES-01
week: 1
audience: all
title:
  en: "The Canadian space landscape"
  fr: "Le paysage spatial canadien"
summary:
  en: "Who is who in Canadian space and what that means for a university mission: the Canadian Space Agency, the industry tiers and Canada's niche strategy, where funding comes from, the regulators a CubeSat meets, and how it gets to orbit."
  fr: "Qui fait quoi dans le spatial canadien, et ce que cela implique pour une mission universitaire : l’Agence spatiale canadienne, les niveaux de l’industrie et la stratégie de niche du Canada, les sources de financement, les organismes de réglementation qu’un CubeSat rencontre, et le chemin vers l’orbite."
apps:
  viz: default
fresh_stack: viz
ties: {}
sources:
  - design/docs/oer/chapters/02_canadian_ecosystem.md
  - https://www.canada.ca/en/space-agency/news/2026/05/state-of-the-canadian-space-sector-report-2025-strength-and-growth-of-canadas-space-economy.html
  - https://international.gc.ca/world-monde/issues_development-enjeux_developpement/peace_security-paix_securite/RSSSA-guide-LSTS.aspx?lang=eng
  - https://openparliament.ca/bills/45-1/C-28/

setup:
  - goto: {app: viz, path: "/video/explainers/landscape.html?lang={lang}", settle: 1.5}

steps:
  - id: agency
    title: {en: "The agency", fr: "L’agence"}
    say:
      en: >-
        Every Canadian space mission operates within a wider national context. At its centre is
        the Canadian Space Agency, or CSA, based in Saint-Hubert, Quebec. The agency sets space
        policy, manages the national programmes and funds a large share of the work. Canada does
        not have its own launch vehicle, so it works through international partnerships,
        including the International Space Station, the Artemis lunar programme and data
        agreements with the European Space Agency.
      fr: >-
        Toute mission spatiale canadienne s’inscrit dans un contexte national plus large. Au
        centre se trouve l’Agence spatiale canadienne, l’ASC, située à Saint-Hubert, au Québec.
        L’Agence définit la politique spatiale, gère les programmes nationaux et finance une
        grande partie des travaux. Le Canada ne dispose pas de son propre lanceur : il travaille
        donc dans le cadre de partenariats internationaux, notamment la Station spatiale
        internationale, le programme lunaire Artemis et des accords de données avec l’Agence
        spatiale européenne.
    do:
      - js: "EX.play('agency', ${say})"

  - id: industry
    title: {en: "The industry", fr: "L’industrie"}
    say:
      en: >-
        The Canadian space industry is organised in tiers. Prime contractors integrate complete
        systems and operate constellations. Subsystem suppliers build the units. Small companies
        and start-ups provide specialised technology, data and services. Universities carry out
        research and train the future workforce, often by building small satellites. In 2024 the
        sector generated revenue of about five billion dollars and supported more than
        twenty-eight thousand jobs.
      fr: >-
        L’industrie spatiale canadienne s’organise en niveaux. Les maîtres d’œuvre intègrent des
        systèmes complets et exploitent des constellations. Les fournisseurs de sous-systèmes
        construisent les équipements. Les petites entreprises et les jeunes pousses fournissent
        des technologies spécialisées, des données et des services. Les universités mènent des
        recherches et forment la main-d’œuvre de demain, souvent en construisant de petits
        satellites. En 2024, le secteur a généré environ cinq milliards de dollars de revenus et
        soutenu plus de vingt-huit mille emplois.
    do:
      - js: "EX.play('industry', ${say})"

  - id: niche
    title: {en: "Areas of specialisation", fr: "Les domaines de spécialisation"}
    say:
      en: >-
        Canada does not attempt to cover every area of space activity. Instead, it has developed
        world-class capability in a small number of fields, namely space robotics, radar Earth
        observation, instruments and small satellites, and it contributes these capabilities in
        exchange for access to much larger programmes. The robotic arms on the International
        Space Station are the best-known example. For a Canadian mission, this means that
        partners and suppliers in these fields are readily available.
      fr: >-
        Le Canada ne cherche pas à couvrir tous les domaines de l’activité spatiale. Il a plutôt
        développé une capacité de premier plan dans un petit nombre de domaines, à savoir la
        robotique spatiale, l’observation radar de la Terre, les instruments et les petits
        satellites, et il apporte ces capacités en échange d’un accès à des programmes bien plus
        importants. Les bras robotiques de la Station spatiale internationale en sont l’exemple
        le plus connu. Pour une mission canadienne, cela signifie que des partenaires et des
        fournisseurs dans ces domaines sont facilement accessibles.
    do:
      - js: "EX.play('niche', ${say})"

  - id: mission
    title: {en: "Where your mission fits", fr: "La place de votre mission"}
    say:
      en: >-
        Consider a university CubeSat within this landscape. It buys units and services from
        industry, and it is funded through a small number of routes: Canadian Space Agency
        grants and technology development programmes, research council and infrastructure
        funding, and, for companies, the National Research Council's support for small
        businesses. Each funding route has its own calendar, which in turn determines the
        project schedule.
      fr: >-
        Prenons un CubeSat universitaire dans ce paysage. Il achète des équipements et des
        services à l’industrie, et son financement passe par un petit nombre de voies : les
        subventions et les programmes de développement technologique de l’Agence spatiale
        canadienne, les fonds des conseils de recherche et d’infrastructure et, pour les
        entreprises, l’aide du Conseil national de recherches aux petites entreprises. Chaque
        voie de financement a son propre calendrier, qui détermine à son tour celui du projet.
    do:
      - js: "EX.play('mission', ${say})"

  - id: regulators
    title: {en: "The regulators", fr: "Les organismes de réglementation"}
    say:
      en: >-
        Canada does not have a single space law, so a mission deals with several regulators,
        each applying its own legislation. Innovation, Science and Economic Development Canada
        licenses the radio equipment and files the mission's frequencies with the International
        Telecommunication Union. Global Affairs Canada licenses any satellite that images the
        Earth and issues export permits. Public Services and Procurement Canada administers the
        Controlled Goods Program. These processes should be started early, since frequency
        coordination alone can take several years.
      fr: >-
        Le Canada n’a pas de loi spatiale unique : une mission traite donc avec plusieurs
        organismes de réglementation, chacun appliquant sa propre législation. Innovation,
        Sciences et Développement économique Canada délivre les licences des équipements radio
        et dépose les fréquences de la mission auprès de l’Union internationale des
        télécommunications. Affaires mondiales Canada délivre la licence de tout satellite qui
        image la Terre ainsi que les licences d’exportation. Services publics et
        Approvisionnement Canada administre le Programme des marchandises contrôlées. Ces
        démarches doivent être engagées tôt, car la coordination des fréquences peut à elle
        seule prendre plusieurs années.
    do:
      - js: "EX.play('regulators', ${say})"
    question:
      type: multichoice
      text:
        en: "Your CubeSat carries a camera that images the Earth. Which licence does that add, and from whom?"
        fr: "Votre CubeSat embarque une caméra qui image la Terre. Quelle licence cela ajoute-t-il, et auprès de qui ?"
      options:
        - text: {en: "An operating licence under the Remote Sensing Space Systems Act, from Global Affairs Canada.", fr: "Une licence d’exploitation au titre de la Loi sur les systèmes de télédétection spatiale, auprès d’Affaires mondiales Canada."}
          correct: true
          why: {en: "Operating an Earth-imaging system from Canada needs an RSSSA licence; Global Affairs administers the Act.", fr: "Exploiter depuis le Canada un système qui image la Terre exige une licence LSTS ; Affaires mondiales applique la loi."}
        - text: {en: "A second radio licence from ISED.", fr: "Une seconde licence radio auprès d’ISDE."}
          why: {en: "The radio licence covers the transmitters, whatever the payload.", fr: "La licence radio couvre les émetteurs, quelle que soit la charge utile."}
        - text: {en: "None: imaging is only regulated for commercial missions.", fr: "Aucune : l’imagerie n’est réglementée que pour les missions commerciales."}
          why: {en: "The Act applies to anyone operating such a system from Canada, university missions included.", fr: "La loi s’applique à quiconque exploite un tel système depuis le Canada, missions universitaires comprises."}

  - id: launch
    title: {en: "Launch access", fr: "L’accès au lancement"}
    say:
      en: >-
        The final consideration is the launch. Canadian satellites are launched from other
        countries, on foreign launch vehicles and under the regulations of the launching state,
        and the export permits must be obtained before the spacecraft is shipped. A Canadian
        Space Launch Act, which would allow Transport Canada to license launches from Canadian
        territory, was introduced in April 2026 and is still before Parliament. Its progress
        should be followed, as it may change the options available to the team.
      fr: >-
        Le dernier point concerne le lancement. Les satellites canadiens sont lancés depuis
        d’autres pays, sur des lanceurs étrangers et selon la réglementation de l’État de
        lancement, et les licences d’exportation doivent être obtenues avant l’expédition du
        satellite. Une loi canadienne sur les lancements spatiaux, qui permettrait à Transports
        Canada d’autoriser des lancements depuis le territoire canadien, a été déposée en avril
        2026 et est toujours à l’étude au Parlement. Il convient d’en suivre l’évolution, car
        elle pourrait modifier les options offertes à l’équipe.
    do:
      - js: "EX.play('launch', ${say})"
    question:
      type: reflect
      text:
        en: "List the licences and permits your own mission will need, who issues each one, and at which review gate you should have applied."
        fr: "Dressez la liste des licences et autorisations dont votre mission aura besoin, de l’organisme qui délivre chacune, et de la revue à laquelle vous devriez en avoir fait la demande."
