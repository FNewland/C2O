# Week 3 — SpaceCDF interfaces at spacecraft level: the block diagram and its
# links, the Interfaces tab (proposed and accepted links, interface
# requirements), the N² chart in Diagrams (diagram and table), and the ICD.
# Prepares LW-2.4/C and the decision record D-2.4-INTERFACES. Follows V-DES-06.
id: V-SCDF-05
week: 7
audience: all
title:
  en: "Interfaces and the N² chart in SpaceCDF"
  fr: "Les interfaces et la matrice N² dans SpaceCDF"
summary:
  en: "Work with interfaces in SpaceCDF: drill down to the spacecraft, review the links the tool proposes and the interface requirements they create, read the N² chart, and see what the interface control document still needs."
  fr: "Travailler les interfaces dans SpaceCDF : descendre jusqu’au satellite, examiner les liens proposés par l’outil et les exigences d’interface qu’ils créent, lire la matrice N², et voir ce qui manque encore au document de contrôle d’interface."
apps:
  spacecdf: default
ties:
  worksheets: [LW-2.4/C]
  decisions: [D-2.4-INTERFACES]
sources:
  - design/frontend/src/diagrams/DiagramsView.tsx (N² chart)
  - design/frontend/src/workbench/InterfacesPanel.tsx
  - design/docs/oer/chapters/08_architecture_interfaces_budgets.md (§ 8.2, 8.3)

setup:
  - python: {call: "video/c2ovideo/helpers.py:seed_spacecdf_eosat", app: spacecdf, save: study}
  - goto: {app: spacecdf, path: "/?study=${study}&lang={lang}", settle: 2}
  - fill: {target: "input", text: {en: "Ava (Systems)", fr: "Ava (Systèmes)"}}
  - click: {target: {role: button, name: Join, exact: true}, instant: true}
  - wait: 2

steps:
  - id: drill
    title: {en: "Opening the spacecraft level", fr: "Le niveau satellite"}
    say:
      en: >-
        Interfaces exist between blocks at the same level of the architecture. At mission level
        there is only one block, so the user must move down the hierarchy: the mission, then the
        space segment, then the spacecraft, EOSAT-1, each opened with a double-click. The
        subsystems are now the blocks, and the lines between them are the links: power, data,
        mechanical, thermal and timing.
      fr: >-
        Les interfaces relient des blocs situés au même niveau de l’architecture. Au niveau
        mission, il n’y a qu’un bloc : il faut donc descendre dans la hiérarchie, en ouvrant par
        double-clic la mission, puis le segment spatial, puis le satellite, EOSAT-1. Les
        sous-systèmes sont maintenant les blocs, et les traits qui les relient sont les liens :
        énergie, données, mécanique, thermique et synchronisation.
    do:
      - click: {role: tab, name: Blocks, exact: true}
      - wait: 1
      - dblclick: {text: {en: "EOSAT mission", fr: "EOSAT mission"}, exact: true}
      - wait: 1.5
      - dblclick: {text: {en: "Space Segment", fr: "Segment spatial"}, exact: true}
      - wait: 1.5
      - dblclick: {text: {en: "EOSAT-1", fr: "EOSAT-1"}, exact: true}
      - wait: 2

  - id: interfaces
    title: {en: "Proposed and accepted links", fr: "Liens proposés et acceptés"}
    say:
      en: >-
        The Interfaces tab lists the links that SpaceCDF proposes for a spacecraft of this type,
        and the systems engineer accepts, edits or rejects each one. Every accepted link
        identifies a provider and a consumer and generates interface requirements, such as the
        regulated twenty-eight point eight volt supply from the power subsystem to the payload.
        Both teams must agree to each interface, and the provider and consumer fields record
        that agreement.
      fr: >-
        L’onglet Interfaces liste les liens que SpaceCDF propose pour un satellite de ce type,
        et l’ingénieur système accepte, modifie ou rejette chacun d’eux. Chaque lien accepté
        désigne un fournisseur et un consommateur et génère des exigences d’interface, comme
        l’alimentation régulée de vingt-huit virgule huit volts fournie par le sous-système
        énergie à la charge utile. Les deux équipes doivent approuver chaque interface, et les
        champs fournisseur et consommateur consignent cet accord.
    do:
      - click: {role: tab, name: Interfaces, exact: true}
      - wait: 1.5
      - highlight: {target: {role: button, name: "Propose links"}, seconds: 2}
      - highlight: {target: {css: "text=IR-PWR-001"}, seconds: 2.5}

  - id: n2
    title: {en: "The N² chart", fr: "La matrice N²"}
    say:
      en: >-
        The Diagrams tab generates the N-squared chart from these links. The units are placed on
        the diagonal, and each cell shows what the unit in that row provides to the unit in that
        column: P for power, D for data, M for mechanical and Th for thermal. The row of the
        electrical power subsystem, or EPS, shows that it supplies almost every unit. The column
        of the on-board computer shows that it receives data from every unit, and the structure
        supports all of them and conducts their heat.
      fr: >-
        L’onglet Schémas génère la matrice N² à partir de ces liens. Les équipements sont placés
        sur la diagonale, et chaque case indique ce que l’équipement de la ligne fournit à celui
        de la colonne : P pour l’énergie, D pour les données, M pour la mécanique et Th pour la
        thermique. La ligne du sous-système énergie, l’EPS, montre qu’il alimente presque tous
        les équipements. La colonne de l’ordinateur de bord montre qu’il reçoit des données de
        chaque équipement, et la structure les porte tous et conduit leur chaleur.
    do:
      - click: {role: tab, name: Diagrams, exact: true}
      - wait: 1.5
      - click: {css: "[data-testid=dgm-entry-n2]"}
      - wait: 2.5
      - highlight: {target: {text: {en: "EPS 3", fr: "EPS 3"}, exact: true}, seconds: 3}
      - highlight: {target: {text: {en: "OBC 11", fr: "OBC 11"}, exact: true}, seconds: 3}
    question:
      type: multichoice
      worksheet: LW-2.4/C
      text:
        en: "In an N² chart, the cell in the reaction wheel's row and the computer's column says D. What does it mean?"
        fr: "Dans une matrice N², la case de la ligne de la roue de réaction et de la colonne de l’ordinateur indique D. Qu’est-ce que cela veut dire ?"
      options:
        - text: {en: "The wheel sends data to the computer.", fr: "La roue envoie des données à l’ordinateur."}
          correct: true
          why: {en: "Row sends, column receives.", fr: "La ligne envoie, la colonne reçoit."}
        - text: {en: "The computer sends data to the wheel.", fr: "L’ordinateur envoie des données à la roue."}
          why: {en: "That is the cell in the computer's row and the wheel's column.", fr: "C’est la case de la ligne de l’ordinateur et de la colonne de la roue."}
        - text: {en: "The wheel and the computer share a data bus, in no particular direction.", fr: "La roue et l’ordinateur partagent un bus de données, sans sens particulier."}
          why: {en: "N² cells are directional: each half of the matrix is one direction.", fr: "Les cases N² ont un sens : chaque moitié de la matrice correspond à une direction."}

  - id: table
    title: {en: "Diagram or table", fr: "Schéma ou tableau"}
    say:
      en: >-
        The Table view presents the same links as a list that can be sorted and checked. The
        chart is complete at this level, with no missing links. Both views can be exported,
        either as an image for a report or as part of the interface requirements document.
      fr: >-
        La vue Tableau présente les mêmes liens sous forme de liste triable et vérifiable. La
        matrice est complète à ce niveau, sans lien manquant. Les deux vues peuvent être
        exportées, en image pour un rapport ou dans le document d’exigences d’interface.
    do:
      - click: {role: tab, name: Table, exact: true}
      - wait: 2
      - click: {role: tab, name: Diagram, exact: true}
      - wait: 1.5

  - id: icd
    title: {en: "The interface control document", fr: "Le document de contrôle d’interface"}
    say:
      en: >-
        The interface control document, or ICD, tab is where the details of each link are
        defined. The battery bus already has its voltage, but most links do not yet have an
        exchange item specifying what is transferred, at what rate and through which connector.
        Completing these details turns the N-squared chart into an agreement that both teams can
        design to. The team then records decision D two point four, Interfaces: which interfaces
        were accepted, edited or rejected, and why.
      fr: >-
        L’onglet du document de contrôle d’interface, l’ICD, permet de définir les détails de
        chaque lien. Le bus batterie porte déjà sa tension, mais la plupart des liens n’ont pas
        encore d’élément échangé précisant ce qui transite, à quel débit et par quel connecteur.
        En complétant ces détails, la matrice N² devient un accord sur lequel les deux équipes
        peuvent concevoir. L’équipe consigne ensuite la décision D deux point quatre, Interfaces
        : celles qui ont été acceptées, modifiées ou rejetées, et pourquoi.
    do:
      - click: {role: tab, name: ICD, exact: true}
      - wait: 2
      - highlight: {target: {css: "tr:has-text('rail_voltage')"}, seconds: 3}
    question:
      type: reflect
      worksheet: LW-2.4/C
      text:
        en: "Pick one data interface on your spacecraft. Write its exchange item: what is sent, how often, over which bus, and who owns each end."
        fr: "Choisissez une interface de données de votre satellite. Écrivez son élément échangé : ce qui est envoyé, à quelle fréquence, par quel bus, et à qui appartient chaque extrémité."
