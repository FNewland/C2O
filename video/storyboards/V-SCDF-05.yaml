# Week 3 — SpaceCDF interfaces at spacecraft level: the block diagram and its
# links, the Interfaces tab (proposed and accepted links, interface
# requirements), the N² chart in Diagrams (diagram and table), and the ICD.
# Prepares LW-2.4/C and the decision record D-2.4-INTERFACES. Follows V-DES-06.
id: V-SCDF-05
week: 3
audience: all
title:
  en: "Interfaces and the N² chart in SpaceCDF"
  fr: "Les interfaces et la matrice N² dans SpaceCDF"
summary:
  en: "Work with interfaces in SpaceCDF: drill down to the spacecraft, review the links the tool proposes and the interface requirements they create, read the N² chart, and see what the interface control document still needs."
  fr: "Travailler les interfaces dans SpaceCDF : descendre jusqu’au satellite, examiner les liens proposés par l’outil et les exigences d’interface qu’ils créent, lire la matrice N², et voir ce qui manque encore au document de contrôle d’interface."
apps:
  spacecdf: default
ties:
  worksheets: [LW-2.4/C]
  decisions: [D-2.4-INTERFACES]
sources:
  - design/frontend/src/diagrams/DiagramsView.tsx (N² chart)
  - design/frontend/src/workbench/InterfacesPanel.tsx
  - design/docs/oer/chapters/08_architecture_interfaces_budgets.md (§ 8.2, 8.3)

setup:
  - python: {call: "video/c2ovideo/helpers.py:seed_spacecdf_eosat", app: spacecdf, save: study}
  - goto: {app: spacecdf, path: "/?study=${study}&lang={lang}", settle: 2}
  - fill: {target: "input", text: {en: "Ava (Systems)", fr: "Ava (Systèmes)"}}
  - click: {target: {role: button, name: Join, exact: true}, instant: true}
  - wait: 2

steps:
  - id: drill
    title: {en: "Down to the spacecraft", fr: "Jusqu’au satellite"}
    say:
      en: >-
        Interfaces live between blocks at the same level. At mission level there is only one
        block, so drill down: double-click the mission, then the space segment, then the
        spacecraft, EOSAT-1. Now its subsystems are the blocks, and the lines between them are
        the links: power, data, mechanical, thermal, timing.
      fr: >-
        Les interfaces relient des blocs d’un même niveau. Au niveau mission, il n’y a qu’un
        bloc : descendez donc. Double-cliquez sur la mission, puis sur le segment spatial, puis
        sur le satellite, EOSAT-1. Ses sous-systèmes sont maintenant les blocs, et les traits
        entre eux sont les liens : énergie, données, mécanique, thermique, synchronisation.
    do:
      - click: {role: tab, name: Blocks, exact: true}
      - wait: 1
      - dblclick: {text: {en: "EOSAT mission", fr: "EOSAT mission"}, exact: true}
      - wait: 1.5
      - dblclick: {text: {en: "Space Segment", fr: "Segment spatial"}, exact: true}
      - wait: 1.5
      - dblclick: {text: {en: "EOSAT-1", fr: "EOSAT-1"}, exact: true}
      - wait: 2

  - id: interfaces
    title: {en: "Proposed and accepted links", fr: "Liens proposés et acceptés"}
    say:
      en: >-
        Open the Interfaces tab. SpaceCDF proposes the links a spacecraft like this needs, and
        the system engineer accepts, edits or rejects each one. Every accepted link names its
        provider and its consumer, and creates interface requirements, such as the regulated
        twenty-eight point eight volt rail from the power subsystem to the payload. Both teams
        must agree to it: that is what the provider and consumer boxes record.
      fr: >-
        Ouvrez l’onglet Interfaces. SpaceCDF propose les liens dont un tel satellite a besoin, et
        l’ingénieur système accepte, modifie ou rejette chacun. Chaque lien accepté nomme son
        fournisseur et son consommateur, et crée des exigences d’interface, comme le bus régulé
        de vingt-huit virgule huit volts de l’énergie vers la charge utile. Les deux équipes
        doivent l’accepter : c’est ce qu’enregistrent les cases fournisseur et consommateur.
    do:
      - click: {role: tab, name: Interfaces, exact: true}
      - wait: 1.5
      - highlight: {target: {role: button, name: "Propose links"}, seconds: 2}
      - highlight: {target: {css: "text=IR-PWR-001"}, seconds: 2.5}

  - id: n2
    title: {en: "The N² chart", fr: "La matrice N²"}
    say:
      en: >-
        The Diagrams tab draws the N² chart from these links. The units sit on the diagonal; each
        cell holds what the row sends to the column: P for power, D for data, M for mechanical,
        Th for thermal. Read across the row of the electrical power subsystem, the EPS: it powers almost everything. Read down the
        computer's column: data arrives from every unit. And the structure carries and conducts
        heat for all of them.
      fr: >-
        L’onglet Schémas dessine la matrice N² à partir de ces liens. Les équipements sont sur la
        diagonale ; chaque case contient ce que la ligne envoie à la colonne : P pour l’énergie,
        D pour les données, M pour la mécanique, Th pour la thermique. Lisez la ligne du sous-système énergie, l’EPS :
        il alimente presque tout. Lisez la colonne de l’ordinateur : les données arrivent de
        chaque équipement. Et la structure porte et conduit la chaleur de tous.
    do:
      - click: {role: tab, name: Diagrams, exact: true}
      - wait: 1.5
      - click: {css: "[data-testid=dgm-entry-n2]"}
      - wait: 2.5
      - highlight: {target: {text: {en: "EPS 3", fr: "EPS 3"}, exact: true}, seconds: 3}
      - highlight: {target: {text: {en: "OBC 11", fr: "OBC 11"}, exact: true}, seconds: 3}
    question:
      type: multichoice
      worksheet: LW-2.4/C
      text:
        en: "In an N² chart, the cell in the reaction wheel's row and the computer's column says D. What does it mean?"
        fr: "Dans une matrice N², la case de la ligne de la roue de réaction et de la colonne de l’ordinateur indique D. Qu’est-ce que cela veut dire ?"
      options:
        - text: {en: "The wheel sends data to the computer.", fr: "La roue envoie des données à l’ordinateur."}
          correct: true
          why: {en: "Row sends, column receives.", fr: "La ligne envoie, la colonne reçoit."}
        - text: {en: "The computer sends data to the wheel.", fr: "L’ordinateur envoie des données à la roue."}
          why: {en: "That is the cell in the computer's row and the wheel's column.", fr: "C’est la case de la ligne de l’ordinateur et de la colonne de la roue."}
        - text: {en: "The wheel and the computer share a data bus, in no particular direction.", fr: "La roue et l’ordinateur partagent un bus de données, sans sens particulier."}
          why: {en: "N² cells are directional: each half of the matrix is one direction.", fr: "Les cases N² ont un sens : chaque moitié de la matrice correspond à une direction."}

  - id: table
    title: {en: "Diagram or table", fr: "Schéma ou tableau"}
    say:
      en: >-
        Switch to Table to see the same links as a list you can sort and check. The chart is
        complete for this level: nothing is missing. Both views export, as a picture for your
        report or as part of the interface requirements document.
      fr: >-
        Passez en Tableau pour voir les mêmes liens sous forme de liste à trier et vérifier. La
        matrice est complète pour ce niveau : rien ne manque. Les deux vues s’exportent, en image
        pour votre rapport ou dans le document d’exigences d’interface.
    do:
      - click: {role: tab, name: Table, exact: true}
      - wait: 2
      - click: {role: tab, name: Diagram, exact: true}
      - wait: 1.5

  - id: icd
    title: {en: "The interface control document", fr: "Le document de contrôle d’interface"}
    say:
      en: >-
        The ICD tab is where each link gets its details. The battery bus already carries its
        voltage, but most links still have no exchange item: what flows, at what rate, over
        which connector. Filling these in is how the N² chart becomes an agreement both teams
        can build to. Then record decision D two point four, Interfaces: which you accepted,
        edited or rejected, and why.
      fr: >-
        L’onglet ICD est l’endroit où chaque lien reçoit ses détails. Le bus batterie porte déjà
        sa tension, mais la plupart des liens n’ont pas encore d’élément échangé : ce qui passe, à
        quel débit, par quel connecteur. C’est en les remplissant que la matrice N² devient un
        accord sur lequel les deux équipes peuvent construire. Consignez ensuite la décision D
        deux point quatre, Interfaces : celles acceptées, modifiées ou rejetées, et pourquoi.
    do:
      - click: {role: tab, name: ICD, exact: true}
      - wait: 2
      - highlight: {target: {css: "tr:has-text('rail_voltage')"}, seconds: 3}
    question:
      type: reflect
      worksheet: LW-2.4/C
      text:
        en: "Pick one data interface on your spacecraft. Write its exchange item: what is sent, how often, over which bus, and who owns each end."
        fr: "Choisissez une interface de données de votre satellite. Écrivez son élément échangé : ce qui est envoyé, à quelle fréquence, par quel bus, et à qui appartient chaque extrémité."
