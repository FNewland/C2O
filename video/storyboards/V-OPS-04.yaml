# Week 5 — LEOP-001 Step 5a (clear beacon mode, LOW rung) and LEOP-002 (initial
# health check): the card that only observes. Starts from card-LEOP-001 with the
# first part of LEOP-001 (contact, boot, HK enables) already flown through the
# MCS API, so the video picks up where V-OPS-02 stops. Prepares WB-5.5-L002.
id: V-OPS-04
week: 10
audience: all
title:
  en: "Leaving beacon mode and the first health check"
  fr: "Sortie du mode balise et premier bilan de santé"
summary:
  en: "This video completes LEOP-001 by clearing beacon mode and changing to the LOW data rate. It then runs LEOP-002, in which each housekeeping report is requested and read against the procedure card, and the operator confirms that the units which should be off are off."
  fr: "Cette vidéo termine LEOP-001 en levant le mode balise et en passant au débit LOW. Elle déroule ensuite LEOP-002 : chaque rapport de servitude est demandé et lu par rapport à la fiche de procédure, et l’opérateur confirme que les équipements qui doivent être éteints le sont."
apps:
  mcs: default
fresh_stack: sim
ties:
  worksheets: [WB-5.5-L002, WB-5.5-L002/q1, WB-5.5-L002/q2]
  cards: [LEOP-001, LEOP-002]
sources:
  - sim/configs/eosat1/procedures/leop/first_acquisition.md (LEOP-001 Step 5a)
  - sim/configs/eosat1/procedures/leop/initial_health_check.md (LEOP-002)
  - sim/tests/test_acceptance/test_leop_commissioning_flythrough.py (the same command path)

setup:
  - api: {app: instructor, method: POST, path: /api/command, json: {type: load_breakpoint, name: card-LEOP-001}}
  - wait: 2
  - python: {call: "video/c2ovideo/helpers.py:ff_to_pass", app: instructor, kwargs: {planner: "${planner_url}", min_duration: 420, min_elevation: 15, after_aos: 10}}
  # LEOP-001 Steps 2–5, as in V-OPS-02: connection test, boot, HK SIDs 3/4/6
  - api: {app: mcs, method: POST, path: /api/pus-command, json: {service: 17, subtype: 1, data_hex: "", name: CONNECTION_TEST, position: flight_director}}
  - wait: 3
  - api: {app: mcs, method: POST, path: /api/pus-command, json: {service: 8, subtype: 1, data_hex: "37", name: OBC_BOOT_APP, position: flight_director}}
  - wait: 13
  - api: {app: mcs, method: POST, path: /api/pus-command, json: {service: 3, subtype: 5, data_hex: "0003", name: HK_ENABLE, position: flight_director}}
  - api: {app: mcs, method: POST, path: /api/pus-command, json: {service: 3, subtype: 5, data_hex: "0004", name: HK_ENABLE, position: flight_director}}
  - api: {app: mcs, method: POST, path: /api/pus-command, json: {service: 3, subtype: 5, data_hex: "0006", name: HK_ENABLE, position: flight_director}}
  - wait: 3
  - goto: {app: mcs, path: "/?lang={lang}&position=flight_director", settle: 4}
  - js: "fetch('/api/logbook', {method: 'DELETE', credentials: 'same-origin'})"
  - reload: 4

steps:
  - id: refused
    title: {en: "Why LOW is refused", fr: "Pourquoi LOW est refusé"}
    say:
      en: >-
        The application software is running, but the downlink is still at the SAFE rate of one
        kilobit per second, the slowest and most robust rate. If the operator selects LOW at
        this point, the spacecraft rejects the command. The failure notice in the event list
        identifies the condition that is not met: beacon mode is still latched, and booting the
        application does not clear it. This is intentional. The SAFE rate is the link of last
        resort, and the spacecraft does not leave it unless commanded to.
      fr: >-
        Le logiciel applicatif est en marche, mais la liaison descendante est encore au débit
        SAFE d’un kilobit par seconde, le plus lent et le plus robuste. Si l’opérateur
        sélectionne LOW à ce stade, le satellite rejette la commande. L’avis d’échec dans la
        liste des événements indique la condition non remplie : le mode balise est toujours
        verrouillé, et le démarrage de l’application ne le lève pas. C’est voulu. Le débit SAFE
        est la liaison de dernier recours, et le satellite ne le quitte que sur commande.
    do:
      - click: {css: "#rail-cmd"}
      - select: {target: {css: "#cmd-catalog"}, value: TTC_SET_DATA_RATE}
      - wait: 0.6
      - select: {target: {css: "#cmd-fields [data-cmd-field='rate']"}, value: "0"}
      - click: {css: "#cmd-send:not(.hide), #cmd-send-crit:not(.hide)"}
      - wait: 2.5
      - highlight: {target: {css: "#cmd-verif-stepper"}, seconds: 3}
      # the S1.8 notice is also an S5 event: open the event list on it
      - click: {css: "[data-bd='events']"}
      - wait_for: {target: {css: "#bdp-events :text-matches('beacon', 'i')"}, timeout: 15}
      - highlight: {target: {css: "#bdp-events :text-matches('beacon', 'i')"}, seconds: 4}
    question:
      type: multichoice
      text:
        en: "TTC_SET_DATA_RATE comes back with an S1.8 failure (service 1, request verification: execution failed). What do you do first?"
        fr: "TTC_SET_DATA_RATE revient avec un échec S1.8 (service 1, vérification des requêtes : échec d’exécution). Que faites-vous d’abord ?"
      options:
        - text: {en: "Read the failure notice: it names the gate that is not met.", fr: "Lire l’avis d’échec : il nomme la condition non remplie."}
          correct: true
          why: {en: "Every ladder gate reports the same code, 0x0007. Only the notice tells them apart.", fr: "Toutes les conditions de l’échelle renvoient le même code, 0x0007. Seul l’avis les distingue."}
        - text: {en: "Send it again until it is accepted.", fr: "La renvoyer jusqu’à ce qu’elle soit acceptée."}
          why: {en: "The gate is still there: it will be refused every time.", fr: "La condition est toujours là : elle sera refusée à chaque fois."}
        - text: {en: "Reboot the on-board computer.", fr: "Redémarrer l’ordinateur de bord."}
          why: {en: "Nothing is wrong with the computer; a step was skipped.", fr: "L’ordinateur n’a rien ; une étape a été sautée."}

  - id: beacon
    title: {en: "Step 5a: clear beacon mode, select LOW", fr: "Étape 5a : lever le mode balise, choisir LOW"}
    say:
      en: >-
        Step 5a of LEOP-001, the first procedure of the launch and early orbit phase, or LEOP,
        performs these actions in the correct order. Beacon mode is cleared first, and the
        operator waits for the execution report. The LOW rate of sixteen kilobits per second,
        which is sufficient for all routine housekeeping, is then selected. This time the
        command is accepted and executed. The faster HIGH rate is reserved for data downlinks
        later in the mission, after the antenna has been deployed.
      fr: >-
        L’étape 5a de LEOP-001, la première procédure de la phase de lancement et de début
        d’orbite, la LEOP, effectue ces actions dans le bon ordre. Le mode balise est d’abord
        levé, et l’opérateur attend le rapport d’exécution. Le débit LOW de seize kilobits par
        seconde, suffisant pour toutes les données de servitude courantes, est ensuite
        sélectionné. Cette fois, la commande est acceptée et exécutée. Le débit HIGH, plus
        rapide, est réservé aux transmissions de données plus tard dans la mission, après le
        déploiement de l’antenne.
    do:
      - select: {target: {css: "#cmd-catalog"}, value: TTC_SET_BEACON_MODE}
      - wait: 0.6
      - fill: {target: {css: "#cmd-fields [data-cmd-field='on']"}, text: "0"}
      - click: {css: "#cmd-send:not(.hide), #cmd-send-crit:not(.hide)"}
      - wait: 3.0
      - select: {target: {css: "#cmd-catalog"}, value: TTC_SET_DATA_RATE}
      - wait: 0.6
      - select: {target: {css: "#cmd-fields [data-cmd-field='rate']"}, value: "0"}
      - click: {css: "#cmd-send:not(.hide), #cmd-send-crit:not(.hide)"}
      - wait: 2.0
      - highlight: {target: {css: "#cmd-verif-stepper"}, seconds: 3}

  - id: card2
    title: {en: "LEOP-002: a card that only observes", fr: "LEOP-002 : une fiche qui ne fait qu’observer"}
    say:
      en: >-
        The next procedure is LEOP-002, the initial health check. It does not power any
        equipment or change any mode; it is a check only. It verifies the subsystems that are
        powered at this stage, namely power, thermal, the on-board computer and the radio, and
        confirms that all other equipment is still off. The values recorded now become the
        baseline for the mission and the reference for all later readings.
      fr: >-
        La procédure suivante est LEOP-002, le bilan de santé initial. Elle ne met aucun
        équipement sous tension et ne change aucun mode : il s’agit uniquement d’une
        vérification. Elle contrôle les sous-systèmes alimentés à ce stade, à savoir l’énergie,
        le thermique, l’ordinateur de bord et la radio, et confirme que tous les autres
        équipements sont encore éteints. Les valeurs relevées maintenant deviennent la référence
        de la mission pour tous les relevés ultérieurs.
    do:
      - click: {css: "#rail-proc"}
      - select: {target: {css: "#proc-source"}, value: ops}
      - wait: 0.8
      - select: {target: {css: "#proc-type"}, value: leop/initial_health_check.md}
      - wait: 2.0
      - scroll: {css: "#proc-doc"}
      - highlight: {target: {css: "#proc-doc"}, seconds: 3, point: false}

  - id: eps
    title: {en: "Step 1: power housekeeping", fr: "Étape 1 : servitude énergie"}
    say:
      en: >-
        Step 1 requests the power housekeeping report, structure identifier one, or SID one,
        which is then read on the power page. The bus voltage should be between twenty-nine
        point six and thirty-four point six volts, and the battery state of charge above fifty
        percent. Power generation may read zero: if the eclipse flag is set, the spacecraft is
        in the Earth's shadow and this is expected. The operator notes it and repeats the check
        after eclipse exit.
      fr: >-
        L’étape 1 demande le rapport de servitude énergie, identifiant de structure un, ou SID
        un, que l’on lit ensuite sur la page énergie. La tension du bus doit être comprise entre
        vingt-neuf virgule six et trente-quatre virgule six volts, et l’état de charge de la
        batterie supérieur à cinquante pour cent. La puissance générée peut afficher zéro : si
        l’indicateur d’éclipse est levé, le satellite est dans l’ombre de la Terre et c’est
        normal. L’opérateur le note et refait la vérification après la sortie d’éclipse.
    do:
      - click: {css: "#rail-cmd"}
      - select: {target: {css: "#cmd-catalog"}, value: HK_REQUEST}
      - fill: {target: {css: "#cmd-fields [data-cmd-field='sid']"}, text: "1"}
      - click: {css: "#cmd-send"}
      - wait: 2.0
      - click: {css: "#rail-eps"}
      - wait: 1.5
      - highlight: {target: {css: "#page-eps tr[data-param='0x0105']"}, seconds: 2.5}
      - highlight: {target: {css: "#page-eps tr[data-param='0x0101']"}, seconds: 2.5}
      - highlight: {target: {css: "#page-eps tr[data-param='0x0107']"}, seconds: 2.5}
    question:
      type: truefalse
      worksheet: WB-5.5-L002/q1
      answer: false
      text:
        en: "eps.power_gen reads 0 W during Step 1. The solar arrays have failed: call NO-GO."
        fr: "eps.power_gen affiche 0 W pendant l’étape 1. Les panneaux solaires sont en panne : NO-GO."

  - id: dark
    title: {en: "Step 2: units that should be off", fr: "Étape 2 : équipements qui doivent être éteints"}
    say:
      en: >-
        The same report contains the on-off status of every power line. For equipment that is
        not yet powered, step 2 is the relevant health check: the reaction wheels, the payload
        and its cooler, and the propulsion system must all read zero. The attitude and payload
        reports should not be requested at this stage, because they are not enabled and their
        units are off. A line that reads one has been switched on out of sequence, and this must
        be logged as an anomaly.
      fr: >-
        Le même rapport contient l’état marche-arrêt de chaque ligne d’alimentation. Pour les
        équipements pas encore alimentés, l’étape 2 constitue le bilan de santé pertinent : les
        roues de réaction, la charge utile et son refroidisseur, ainsi que le système de
        propulsion, doivent tous afficher zéro. Il ne faut pas demander les rapports d’attitude
        ou de charge utile à ce stade, car ils ne sont pas activés et leurs unités sont
        éteintes. Une ligne qui affiche un a été allumée hors séquence, et cela doit être
        consigné comme anomalie.
    do:
      - highlight: {target: {css: "#page-eps tr[data-param='0x0117']"}, seconds: 2.5}
      - highlight: {target: {css: "#page-eps tr[data-param='0x0113']"}, seconds: 2.5}
      - highlight: {target: {css: "#page-eps tr[data-param='0x014A']"}, seconds: 2.5}

  - id: record
    title: {en: "Record each step", fr: "Consigner chaque étape"}
    say:
      en: >-
        On the card, the operator captures the values and marks each step GO. Steps 3 to 5 apply
        the same checks to thermal, the on-board computer and the radio. Step 6 is the health
        assessment for the Flight Director: every powered subsystem is nominal and all other
        equipment is off. Only then can the team proceed to deploy the solar wings, in LEOP-004.
      fr: >-
        Sur la fiche, l’opérateur relève les valeurs et marque chaque étape GO. Les étapes 3 à 5
        appliquent les mêmes vérifications au thermique, à l’ordinateur de bord et à la radio.
        L’étape 6 est le bilan de santé destiné au directeur de vol : chaque sous-système
        alimenté est nominal et tous les autres équipements sont éteints. L’équipe peut alors
        seulement passer au déploiement des ailes solaires, dans LEOP-004.
    do:
      - click: {css: "#rail-proc"}
      - wait: 1.0
      - scroll: {css: "#proc-doc section[data-pc-step='s1']"}
      - click: {css: "#proc-doc section[data-pc-step='s1'] [data-pc='capture']"}
      - click: {css: "#proc-doc section[data-pc-step='s1'] [data-pc='tick'][data-r='go']"}
      - scroll: {css: "#proc-doc section[data-pc-step='s2']"}
      - click: {css: "#proc-doc section[data-pc-step='s2'] [data-pc='capture']"}
      - click: {css: "#proc-doc section[data-pc-step='s2'] [data-pc='tick'][data-r='go']"}
      - scroll: {css: "#proc-doc section[data-pc-step='s6']"}
      - highlight: {target: {css: "#proc-doc section[data-pc-step='s6']"}, seconds: 3, point: false}
    question:
      type: reflect
      worksheet: WB-5.5-L002/q2
      text:
        en: "One of the Step 2 line flags reads 1. What do you write in the log, and who do you tell first?"
        fr: "L’un des indicateurs de ligne de l’étape 2 affiche 1. Qu’écrivez-vous dans le journal, et qui prévenez-vous d’abord ?"
