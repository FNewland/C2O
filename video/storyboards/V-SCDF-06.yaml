# Week 4 — SpaceCDF risk register and FMECA: the 5×5 matrix with the
# textbook bands, mitigating a critical risk (likelihood down, status,
# owner), completing a risk's mitigation and owner, and the design-based FMECA
# in Analyses (top risks, critical count, redundancy recommendations).
# Prepares LW-4.3/A, LW-4.3/D and the decision record D-4.3-RISKS. Follows V-DES-11.
id: V-SCDF-06
week: 4
audience: all
title:
  en: "Risk register and FMECA in SpaceCDF"
  fr: "Registre des risques et AMDEC dans SpaceCDF"
summary:
  en: "Manage risk in SpaceCDF: read the five-by-five matrix, mitigate a critical risk and give it an owner, complete a risk's mitigation, then run the FMECA from your design and read its top risks and redundancy recommendations."
  fr: "Gérer les risques dans SpaceCDF : lire la matrice cinq sur cinq, atténuer un risque critique et lui donner un responsable, compléter l’atténuation d’un risque, puis lancer l’AMDEC à partir de votre conception et lire ses principaux risques et ses recommandations de redondance."
apps:
  spacecdf: default
ties:
  worksheets: [LW-4.3/A, LW-4.3/D]
  decisions: [D-4.3-RISKS]
sources:
  - design/frontend/src/workbench/VVPanel.tsx (RiskRegister)
  - design/frontend/src/components/FMECAPanel.tsx
  - design/docs/oer/chapters/15_risk_interfaces_fmeca.md (§ 15.1, 15.2, 15.4)

setup:
  - python: {call: "video/c2ovideo/helpers.py:seed_spacecdf_eosat", app: spacecdf, save: study}
  - goto: {app: spacecdf, path: "/?study=${study}&lang={lang}", settle: 2}
  - fill: {target: "input", text: {en: "Ava (Systems)", fr: "Ava (Systèmes)"}}
  - click: {target: {role: button, name: Join, exact: true}, instant: true}
  - wait: 2

steps:
  - id: matrix
    title: {en: "The risk matrix", fr: "La matrice des risques"}
    say:
      en: >-
        The risk register is found under V and V, Risk Register. The matrix positions each risk
        by likelihood and consequence, using the bands from the textbook: a score of sixteen or
        more is critical, and ten to fifteen is high. This team has identified three risks. Late
        delivery of the S-band licence scores four by four, sixteen, which is critical. Star
        tracker blinding scores twelve, which is high. Battery capacity fade scores six, which
        is medium.
      fr: >-
        Le registre des risques se trouve sous V et V, Registre des risques. La matrice
        positionne chaque risque selon sa vraisemblance et sa conséquence, avec les niveaux
        définis dans le manuel : un score de seize ou plus est critique, et de dix à quinze,
        élevé. Cette équipe a identifié trois risques. Le retard de la licence en bande S
        obtient quatre fois quatre, soit seize, ce qui est critique. L’éblouissement du senseur
        stellaire obtient douze, ce qui est élevé. La perte de capacité de la batterie obtient
        six, ce qui est moyen.
    do:
      - click: {text: "V&V", exact: true}
      - wait: 1.2
      - click: {role: tab, name: "Risk Register", exact: true}
      - wait: 1.5
      - highlight: {target: {css: ".c2o-riskmx"}, seconds: 3}
      - highlight: {target: {css: "tr:has-text('RSK-003')"}, seconds: 3}

  - id: mitigate
    title: {en: "Mitigate the critical risk", fr: "Atténuer le risque critique"}
    say:
      en: >-
        A mitigation has already been defined for the licence risk: filing early with the
        International Telecommunication Union. Once the filing has been made, a late licence
        becomes much less likely, so the likelihood is reduced to two and the score falls to
        eight, which is medium. The risk is marked as Mitigating and assigned an owner, the
        communications engineer. A risk without an owner is a risk that nobody is monitoring.
      fr: >-
        Une atténuation a déjà été définie pour le risque de licence : déposer tôt la demande
        auprès de l’Union internationale des télécommunications. Une fois le dépôt effectué, un
        retard de la licence devient bien moins vraisemblable : la vraisemblance est ramenée à
        deux et le score tombe à huit, ce qui est moyen. Le risque passe à l’état Atténuation et
        reçoit un responsable, l’ingénieur télécommunications. Un risque sans responsable est un
        risque que personne ne surveille.
    do:
      - select: {target: {label: {en: "Likelihood of RSK-003", fr: "Vraisemblance de RSK-003"}, exact: true}, value: "2"}
      - wait: 1.2
      - select: {target: {label: {en: "Status of RSK-003", fr: "Statut de RSK-003"}, exact: true}, value: "mitigating"}
      - wait: 0.8
      - fill: {target: {label: {en: "Owner of RSK-003", fr: "Responsable de RSK-003"}, exact: true}, text: {en: "Kai (Communications)", fr: "Kai (Télécommunications)"}, typed: true, press: Enter}
      - wait: 1.2
      - highlight: {target: {css: ".c2o-riskmx"}, seconds: 2.5}
    question:
      type: multichoice
      worksheet: LW-4.3/A
      text:
        en: "A risk scores likelihood 3 and consequence 5. Which band is it in, and what does the textbook ask of it?"
        fr: "Un risque obtient une vraisemblance de 3 et une conséquence de 5. Dans quelle bande est-il, et que demande le manuel ?"
      options:
        - text: {en: "15: high. Mitigate it, with an owner and a date.", fr: "15 : élevé. L’atténuer, avec un responsable et une date."}
          correct: true
          why: {en: "High is 10–15; critical starts at 16.", fr: "Élevé va de 10 à 15 ; critique commence à 16."}
        - text: {en: "15: critical. Redesign.", fr: "15 : critique. Reconcevoir."}
          why: {en: "Critical is 16–25 in the textbook's bands.", fr: "Critique va de 16 à 25 dans les bandes du manuel."}
        - text: {en: "8: medium. Accept and watch.", fr: "8 : moyen. Accepter et surveiller."}
          why: {en: "The score multiplies: 3 × 5 = 15.", fr: "Le score se multiplie : 3 × 5 = 15."}

  - id: complete
    title: {en: "Complete the register", fr: "Compléter le registre"}
    say:
      en: >-
        The battery capacity fade risk does not yet have a mitigation or an owner. Both are
        entered directly in the register: limit the depth of discharge and monitor every cell,
        with the power engineer as owner. The register is the team's shared record of every
        risk, its score, the action being taken and the person responsible for it.
      fr: >-
        Le risque de perte de capacité de la batterie n’a encore ni atténuation ni responsable.
        Les deux sont saisis directement dans le registre : limiter la profondeur de décharge et
        surveiller chaque cellule, sous la responsabilité de l’ingénieur énergie. Le registre
        est le relevé commun de l’équipe : chaque risque, son score, l’action en cours et la
        personne qui en est responsable.
    do:
      - fill: {target: {label: {en: "Mitigation of RSK-002", fr: "Atténuation de RSK-002"}, exact: true}, text: {en: "Shallow depth of discharge, per-cell monitoring", fr: "Décharge peu profonde, surveillance par cellule"}, typed: true, press: Enter}
      - wait: 1
      - fill: {target: {label: {en: "Owner of RSK-002", fr: "Responsable de RSK-002"}, exact: true}, text: {en: "Lena (Power)", fr: "Lena (Énergie)"}, typed: true, press: Enter}
      - wait: 1.2
      - highlight: {target: {css: "tr:has-text('RSK-002')"}, seconds: 2.5}

  - id: fmeca
    title: {en: "FMECA from the design", fr: "L’AMDEC à partir de la conception"}
    say:
      en: >-
        The register contains the risks the team has identified. The failure modes, effects and
        criticality analysis, or FMECA, looks for those it has not. At mission level, in
        Analyses, the FMECA is run from the study. It lists the failure modes of every element
        in this design and identifies the single points of failure: eight in this case, five of
        them on elements that perform critical functions. The main risks listed below are the
        solar array and antenna deployments and the battery. Six failure modes have a severity
        of four or five, meaning loss of the mission or major degradation.
      fr: >-
        Le registre contient les risques que l’équipe a identifiés. L’analyse des modes de
        défaillance, de leurs effets et de leur criticité, l’AMDEC, recherche ceux qu’elle n’a
        pas identifiés. Au niveau mission, dans Analyses, l’AMDEC se lance depuis l’étude. Elle
        liste les modes de défaillance de chaque élément de cette conception et identifie les
        points de défaillance uniques : huit dans ce cas, dont cinq sur des éléments qui
        assurent des fonctions critiques. Les principaux risques, listés plus bas, sont les
        déploiements du générateur solaire et de l’antenne, ainsi que la batterie. Six modes de
        défaillance ont une gravité de quatre ou cinq, c’est-à-dire une perte de mission ou une
        dégradation majeure.
    do:
      - click: {css: ".c2o-appbar__levels button:first-child"}
      - wait: 1.2
      - click: {role: tab, name: Analyses, exact: true}
      - wait: 1.2
      - click: {css: "button:has-text('FMECA')"}
      - wait: 1.5
      - click: {role: button, name: "Run from study"}
      - wait: 3
      - highlight: {target: {text: {en: "8 single points", fr: "8 points uniques"}}, seconds: 3}
      - scroll: {target: {text: "Top Risks", exact: true}}
      - highlight: {target: {text: "Top Risks", exact: true}, seconds: 3}

  - id: redundancy
    title: {en: "From findings to decisions", fr: "Des constats aux décisions"}
    say:
      en: >-
        The tool then recommends redundancy wherever a single failure would end the mission,
        with the expected reduction in risk for each change. These are proposals rather than
        decisions: a second release mechanism costs little, whereas a redundant battery string
        costs mass and power. The proposals the team accepts are carried into the risk register,
        and the team records decision D four point three, Risks.
      fr: >-
        L’outil recommande ensuite de la redondance partout où une seule panne mettrait fin à la
        mission, avec la réduction de risque attendue pour chaque modification. Il s’agit de
        propositions et non de décisions : un second mécanisme de libération coûte peu, alors
        qu’une chaîne de batterie redondante coûte de la masse et de la puissance. Les
        propositions retenues par l’équipe sont reportées dans le registre des risques, et
        l’équipe consigne la décision D quatre point trois, Risques.
    do:
      - scroll: {target: {text: "Redundancy Recommendations", exact: true}}
      - highlight: {target: {text: "Redundancy Recommendations", exact: true}, seconds: 3}
    question:
      type: reflect
      worksheet: LW-4.3/D
      text:
        en: "Take the top failure mode for your design. Would you add redundancy, change the design, or accept it? What does each option cost?"
        fr: "Prenez le premier mode de défaillance de votre conception. Ajouteriez-vous de la redondance, changeriez-vous la conception, ou l’accepteriez-vous ? Que coûte chaque option ?"
