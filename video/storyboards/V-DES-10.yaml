# Design concept — the link budget (textbook ch. 11): the chain from
# transmitter to margin, decibels, the EOSat-3U S-band downlink waterfall
# (C/N0 83.4 dBHz, Eb/N0 23.4 dB, margin 17.4 dB), margin against data rate
# (3 dB each doubling; 27 Mbit/s power limit; 7.5 Mbit/s channel limit), and
# the data budget (720 against 956 MB/day). Leads into the SpaceCDF link
# budget tool video. Animated page video/explainers/comms.html.
id: V-DES-10
week: 4
audience: all
title:
  en: "The link budget"
  fr: "Le bilan de liaison"
summary:
  en: "Will the signal get through? The chain of gains and losses from transmitter to demodulator, decibels, a complete S-band downlink budget, trading margin for data rate, and the data budget that must close as well."
  fr: "Le signal passera-t-il ? La chaîne des gains et des pertes de l’émetteur au démodulateur, les décibels, un bilan complet de liaison descendante en bande S, l’échange entre marge et débit, et le bilan de données qui doit lui aussi se fermer."
apps:
  viz: default
fresh_stack: viz
ties: {}
sources:
  - design/docs/oer/chapters/11_communications.md (§ 11.1, 11.2, 11.8.1, 11.9)

setup:
  - goto: {app: viz, path: "/video/explainers/comms.html?lang={lang}", settle: 1.5}
  - cursor: hide

steps:
  - id: chain
    title: {en: "The link chain", fr: "La chaîne de liaison"}
    say:
      en: >-
        A link budget determines whether each bit arrives with enough energy, relative to the
        noise, to be decoded correctly. It begins at the transmitter, where the output power,
        the antenna gain and the cable losses give the effective isotropic radiated power. The
        propagation path accounts for most of the losses, through distance, atmospheric
        absorption and pointing errors. The ratio of the ground antenna gain to the system noise
        temperature is the receiver's figure of merit. The demodulator requires a certain energy
        per bit, and the remainder is the link margin, which should be at least three decibels.
      fr: >-
        Un bilan de liaison détermine si chaque bit arrive avec suffisamment d’énergie, par
        rapport au bruit, pour être décodé correctement. Il commence à l’émetteur, où la
        puissance de sortie, le gain d’antenne et les pertes de câble donnent la puissance
        isotrope rayonnée équivalente. Le trajet de propagation représente l’essentiel des
        pertes, par la distance, l’absorption atmosphérique et les erreurs de pointage. Le
        rapport entre le gain de l’antenne au sol et la température de bruit du système
        constitue le facteur de mérite du récepteur. Le démodulateur exige une certaine énergie
        par bit, et le reste constitue la marge de liaison, qui doit être d’au moins trois
        décibels.
    do:
      - js: "EX.play('chain', ${say})"

  - id: decibels
    title: {en: "Decibels", fr: "Les décibels"}
    say:
      en: >-
        The budget is expressed in decibels, because a chain of multiplications then becomes a
        column of additions. Doubling the power adds three decibels, a factor of ten adds ten
        decibels and a factor of one hundred adds twenty. Halving the power subtracts three
        decibels. Two watts corresponds to plus three decibel-watts, and one watt is thirty
        decibels above one milliwatt.
      fr: >-
        Le bilan s’exprime en décibels, car une chaîne de multiplications devient alors une
        colonne d’additions. Doubler la puissance ajoute trois décibels, un facteur dix ajoute
        dix décibels et un facteur cent en ajoute vingt. Diviser la puissance par deux retire
        trois décibels. Deux watts correspondent à plus trois décibels-watts, et un watt se
        situe trente décibels au-dessus d’un milliwatt.
    do:
      - js: "EX.play('decibels', ${say})"

  - id: waterfall
    title: {en: "An S-band downlink", fr: "Une liaison descendante en bande S"}
    say:
      en: >-
        This example is a realistic budget: a two-watt S-band transmitter on a 3U CubeSat at
        five hundred kilometres, with a patch antenna, transmitting one megabit per second to a
        three-metre dish at ten degrees elevation. The path loss over seventeen hundred
        kilometres is one hundred and sixty-four decibels, far larger than any other term. The
        dish gain and the Boltzmann constant term recover most of it. After the data rate and
        the energy per bit required by the modulation and coding are subtracted, the margin is
        seventeen point four decibels, so the link closes comfortably.
      fr: >-
        Cet exemple est un bilan réaliste : un émetteur de deux watts en bande S sur un CubeSat
        3U à cinq cents kilomètres, équipé d’une antenne patch, qui transmet un mégabit par
        seconde vers une antenne de trois mètres à dix degrés d’élévation. L’affaiblissement de
        trajet sur dix-sept cents kilomètres est de cent soixante-quatre décibels, bien
        supérieur à tous les autres termes. Le gain de l’antenne et le terme de la constante de
        Boltzmann en compensent l’essentiel. Après soustraction du débit et de l’énergie par bit
        exigée par la modulation et le codage, la marge est de dix-sept virgule quatre décibels
        : la liaison se ferme confortablement.
    do:
      - js: "EX.play('waterfall', ${say})"
    question:
      type: multichoice
      text:
        en: "The ground station swaps its 3 m dish for one half the diameter. Roughly what happens to the margin?"
        fr: "La station sol remplace son antenne de 3 m par une de diamètre moitié. Qu’arrive-t-il à peu près à la marge ?"
      options:
        - text: {en: "It falls by about 6 dB: gain goes with the area, a quarter of the area is −6 dB.", fr: "Elle baisse d’environ 6 dB : le gain suit la surface, un quart de la surface fait −6 dB."}
          correct: true
          why: {en: "Dish gain grows with diameter squared; 17.4 − 6 still leaves about 11 dB.", fr: "Le gain croît avec le carré du diamètre ; 17,4 − 6 laisse encore environ 11 dB."}
        - text: {en: "It falls by about 3 dB.", fr: "Elle baisse d’environ 3 dB."}
          why: {en: "That would be half the area, not half the diameter.", fr: "Ce serait la moitié de la surface, pas du diamètre."}
        - text: {en: "Nothing: the dish only affects the uplink.", fr: "Rien : l’antenne ne compte que pour la montée."}
          why: {en: "Its gain is the G in G/T on the downlink.", fr: "Son gain est le G du G/T en descente."}

  - id: rate
    title: {en: "Margin buys data rate", fr: "La marge achète du débit"}
    say:
      en: >-
        Surplus margin can be used to increase the data rate, with each doubling of the rate
        costing three decibels. At five megabits per second the margin is still ten decibels,
        and the available power alone would allow about twenty-seven megabits per second before
        the margin reached the three-decibel minimum. However, the channel permitted by the
        radio licence is five megahertz wide and can carry only about seven and a half megabits
        per second. In this case the limit is set by the spectrum allocation rather than by the
        power.
      fr: >-
        La marge excédentaire peut servir à augmenter le débit, chaque doublement du débit
        coûtant trois décibels. À cinq mégabits par seconde, la marge est encore de dix
        décibels, et la puissance disponible permettrait à elle seule environ vingt-sept
        mégabits par seconde avant que la marge n’atteigne le minimum de trois décibels.
        Cependant, le canal autorisé par la licence radio a une largeur de cinq mégahertz et ne
        peut transporter qu’environ sept mégabits et demi par seconde. Dans ce cas, la limite
        est fixée par l’attribution de spectre et non par la puissance.
    do:
      - js: "EX.play('rate', ${say})"

  - id: data
    title: {en: "The data budget", fr: "Le bilan de données"}
    say:
      en: >-
        A link that closes is not sufficient on its own. Each day, the camera collects about
        seven hundred and twenty megabytes after compression, and five passes at five megabits
        per second can return about nine hundred and fifty megabytes. The data budget therefore
        closes with about a third in reserve. If the imaging time were doubled, it would no
        longer close, and the backlog would grow every day. The options would then be to move to
        X-band, add ground stations, increase compression or select which data to transmit.
      fr: >-
        Une liaison qui se ferme ne suffit pas à elle seule. Chaque jour, la caméra collecte
        environ sept cent vingt mégaoctets après compression, et cinq passages à cinq mégabits
        par seconde permettent d’en transmettre environ neuf cent cinquante. Le bilan de données
        se ferme donc avec une réserve d’environ un tiers. Si le temps de prise de vue doublait,
        il ne se fermerait plus, et le retard s’accumulerait chaque jour. Les options seraient
        alors de passer en bande X, d’ajouter des stations sol, d’augmenter la compression ou de
        sélectionner les données à transmettre.
    do:
      - js: "EX.play('data', ${say})"
    question:
      type: reflect
      text:
        en: "For your mission, which closes with less to spare: the link budget or the data budget? What would you change first?"
        fr: "Pour votre mission, lequel se ferme avec le moins de reste : le bilan de liaison ou le bilan de données ? Que changeriez-vous en premier ?"
