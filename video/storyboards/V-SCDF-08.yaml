  - id: missiondef
    title: {en: "The mission definition", fr: "La définition de mission"}
    say:
      en: >-
        The mission definition is the set of values every analysis starts from. It stays editable in
        Traceability, under Mission need. The team leader adds the near-infrared camera and the
        payload controller, with its five-watt peak, and the concept of operations summary, from
        launch and commissioning to the drag sail at the end of life. The node time is entered as
        ten thirty in the evening, the ascending node, because the daylight pass is the descending
        one, at half past ten in the morning. These researched values replace the wizard's
        placeholders.
      fr: >-
        La définition de mission est l’ensemble des valeurs dont partent toutes les analyses. Elle
        reste modifiable dans Traçabilité, sous Besoin de mission. Le chef d’équipe ajoute la caméra
        proche infrarouge et le contrôleur de charge utile, avec sa crête de cinq watts, ainsi que le
        résumé du concept d’opérations, du lancement et de la mise en service jusqu’à la voile de
        traînée en fin de vie. L’heure du nœud est saisie à vingt-deux heures trente, le nœud
        ascendant, car le passage de jour est le passage descendant, à dix heures trente. Ces
        valeurs étudiées remplacent les valeurs provisoires de l’assistant.
    do:
      - js: {en: "__lt('Scene 1.6 · Team leader', 'The researched orbit and payload replace the wizard’s placeholders.')", fr: "__lt('Scène 1.6 · Chef d’équipe', 'L’orbite et la charge utile étudiées remplacent les valeurs provisoires de l’assistant.')"}
      - click: {css: ".c2o-appbar__levels .c2o-tab >> nth=0"}
      - wait: 1
      - click: {role: tab, name: Traceability, exact: true}
      - wait: 1.5
      - click: {css: "[data-testid=edit-mission]"}
      - wait: 1
      - click: {role: button, name: "+ Add payload"}
      - fill: {target: {label: "Payload name", nth: 1}, text: "VNIR camera (Alvium C-1620m, 875/50 nm)"}
      - fill: {target: {label: "Mass (kg)", exact: true, nth: 1}, text: "0.13"}
      - fill: {target: {label: "Average power (W)", nth: 1}, text: "3.8"}
      - fill: {target: {label: "Peak power (W)", nth: 1}, text: "3.8"}
      - fill: {target: {label: "Data rate (Mbit/s)", nth: 1}, text: "13.7"}
      - fill: {target: {label: "Duty cycle (%)", nth: 1}, text: "5"}
      - fill: {target: {label: "Wavelengths (nm)", nth: 1}, text: "875"}
      - click: {role: button, name: "+ Add payload"}
      - fill: {target: {label: "Payload name", nth: 2}, text: "Payload controller, bench and harness"}
      - fill: {target: {label: "Mass (kg)", exact: true, nth: 2}, text: "0.33"}
      - fill: {target: {label: "Average power (W)", nth: 2}, text: "3"}
      - fill: {target: {label: "Peak power (W)", nth: 2}, text: "5"}
      - fill: {target: {label: "Data rate (Mbit/s)", nth: 2}, text: "0"}
      - fill: {target: {label: "Duty cycle (%)", nth: 2}, text: "15"}
      - fill: {target: {label: "ConOps summary"}, text: "LEOP (B-dot detumble, antenna and wing deployment, first contacts) for about 7 days, platform commissioning to day 30 and payload commissioning to day 90 (dark frames, first light, boresight map, cross-calibration with Sentinel-2/Landsat, roll tests, compression check). Nominal operations: nadir standby with scheduled acquisitions of a few minutes per orbit over burns (Jun-Sep), freeze-up (Oct-Dec), break-up (Apr-Jun) and exploratory night SWIR over previous burns (Mar-May), rolling up to ±30 deg for revisit; quicklooks and region-of-interest pairs, losslessly compressed, returned at 38.4 kbps over four UHF stations (about 126 min/day union, 14 windows, 13 MB/day of compressed products); per pass the operators choose delayed housekeeping or payload data. Safe and survival modes on faults or low battery; a stored plan covers 48 h without contact. End of life: drag sail deployed by command, by an OBC-independent 90-day timer or on under-voltage; transmitters off and battery passivated; re-entry about 3.0-3.4 years later from 590 km."}
      - highlight: {target: {label: "LTAN (hh:mm)"}, seconds: 2.5}
      - click: {role: button, name: "Save mission definition"}
      - wait: 2
      - click: {role: button, name: Close, exact: true}
      - wait: 1
      - scroll: {target: {css: "[data-testid=edit-mission]"}}
      - highlight: {target: {css: "main dl, main .c2o-kv, [data-testid=edit-mission] >> xpath=ancestor::*[contains(@class,'c2o-disclosure') or self::details][1]"}, seconds: 4, point: false}
