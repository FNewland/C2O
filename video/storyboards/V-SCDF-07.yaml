# Week 4 — SpaceCDF review gates: the gate profile, the exit criteria with their
# owners and the workflow step that closes each, not-evaluated items, the diagrams
# and decision records a gate expects, closing a gap (a risk mitigation), and the
# go / no-go record. Prepares every gate week (MDR, PRR+SRR, PDR). Follows V-DES-13.
id: V-SCDF-07
week: 2
audience: all
title:
  en: "Review gates in SpaceCDF"
  fr: "Les jalons de revue dans SpaceCDF"
summary:
  en: "Prepare a review with SpaceCDF: choose the gate, read each exit criterion with its owner and the step that closes it, see which items wait for an analysis, close a gap the gate found, and record the go or no-go decision."
  fr: "Préparer une revue avec SpaceCDF : choisir le jalon, lire chaque critère de sortie avec son responsable et l’étape qui le ferme, voir quels points attendent une analyse, combler un manque relevé par le jalon, et consigner la décision go ou no go."
apps:
  spacecdf: default
ties:
  worksheets: []
  decisions: []
sources:
  - design/frontend/src/workbench/VVPanel.tsx (ReviewGates)
  - design/configs/gate_exit_criteria.yaml
  - design/docs/oer/chapters/16_cost_and_reviews.md (§ 16.3)

setup:
  - python: {call: "video/c2ovideo/helpers.py:seed_spacecdf_eosat", app: spacecdf, save: study}
  - goto: {app: spacecdf, path: "/?study=${study}&lang={lang}", settle: 2}
  - fill: {target: "input", text: {en: "Ava (Systems)", fr: "Ava (Systèmes)"}}
  - click: {target: {role: button, name: Join, exact: true}, instant: true}
  - wait: 2

steps:
  - id: gate
    title: {en: "Choose the gate", fr: "Choisir le jalon"}
    say:
      en: >-
        Review gates are found under V and V, Review Gates. The profile determines which reviews
        the course holds: the full sequence of the European Cooperation for Space
        Standardization, or ECSS, the ESA CubeSat sequence, the three C2O gates, or the same
        reviews under their NASA names. The gate is then selected, in this case the Mission
        Definition Review. The margin line shows that, at this gate, budgets carry a system
        margin of twenty percent.
      fr: >-
        Les jalons de revue se trouvent sous V et V, Jalons de revue. Le profil détermine les
        revues que comporte le cours : la séquence complète de la Coopération européenne pour la
        normalisation spatiale, l’ECSS, la séquence CubeSat de l’ESA, les trois jalons C2O, ou
        les mêmes revues sous leurs noms NASA. On sélectionne ensuite le jalon, ici la revue de
        définition de mission. La ligne des marges indique qu’à ce jalon, les bilans portent une
        marge système de vingt pour cent.
    do:
      - click: {text: "V&V", exact: true}
      - wait: 1.2
      - click: {role: tab, name: "Review Gates", exact: true}
      - wait: 2
      - highlight: {target: {label: "Gate profile", exact: true}, seconds: 2.5}
      - highlight: {target: {role: tab, name: MDR, exact: true}, seconds: 2}

  - id: verdict
    title: {en: "The readiness verdict", fr: "Le verdict de préparation"}
    say:
      en: >-
        The verdict is shown first: not ready. Six criteria are mandatory, and only one of them
        is currently met. Each line is an exit criterion and shows the question the reviewers
        will ask, what the tool has found, the position responsible, and the step of the team
        workflow in which the criterion is closed. For example, no stakeholders have yet been
        identified; this is the responsibility of the team leader, in step two.
      fr: >-
        Le verdict s’affiche en premier : pas prête. Six critères sont obligatoires, et un seul
        est rempli pour l’instant. Chaque ligne correspond à un critère de sortie et indique la
        question que poseront les examinateurs, ce que l’outil a constaté, le poste responsable
        et l’étape du travail d’équipe au cours de laquelle le critère est fermé. Par exemple,
        aucune partie prenante n’a encore été identifiée ; c’est la responsabilité du chef
        d’équipe, à l’étape deux.
    do:
      - highlight: {target: {css: ".c2o-criteria__row:has-text('MDR-EC-01')"}, seconds: 2}
      - scroll: {target: {css: ".c2o-criteria__row:has-text('MDR-EC-02')"}}
      - highlight: {target: {css: ".c2o-criteria__row:has-text('MDR-EC-02')"}, seconds: 3.5}

  - id: notyet
    title: {en: "Not evaluated yet", fr: "Pas encore évalué"}
    say:
      en: >-
        Some lines show N/A, meaning not evaluated. They depend on the results of an analysis
        that has not yet been run, such as the mass and power margins from the design loop. The
        button on the line opens the Analyses tab. A gate cannot be passed on a value that has
        not been calculated.
      fr: >-
        Certaines lignes ne sont pas encore évaluées. Elles dépendent des résultats d’une
        analyse qui n’a pas encore été lancée, comme les marges de masse et de puissance de la
        boucle de conception. Le bouton de la ligne ouvre l’onglet Analyses. Un jalon ne peut
        pas être franchi sur une valeur qui n’a pas été calculée.
    do:
      - scroll: {target: {css: ".c2o-criteria__row:has-text('MDR-EC-07')"}}
      - highlight: {target: {css: ".c2o-criteria__row:has-text('MDR-EC-07')"}, seconds: 3.5}

  - id: diagrams
    title: {en: "What the gate expects", fr: "Ce qu’attend le jalon"}
    say:
      en: >-
        Below the criteria are the diagrams required at each gate. The mission timeline and the
        mode diagram are complete. The risk matrix has two gaps: one risk without a mitigation,
        and one critical risk that is still open. Below that are the decision records required
        for this review, each with the position responsible for recording it.
      fr: >-
        Sous les critères figurent les schémas exigés à chaque jalon. La chronologie de mission
        et le schéma des modes sont complets. La matrice des risques présente deux manques : un
        risque sans atténuation et un risque critique encore ouvert. Plus bas figurent les
        décisions à consigner pour cette revue, chacune avec le poste chargé de la consigner.
    do:
      - scroll: {target: {css: "[aria-labelledby='gd-mdr']"}}
      - highlight: {target: {css: "[aria-labelledby='gd-mdr'] li:has-text('5 × 5')"}, seconds: 3.5}
      - scroll: {target: {css: "#gatedec-h"}}
      - highlight: {target: {css: "#gatedec-h"}, seconds: 2}

  - id: close
    title: {en: "Close a gap", fr: "Combler un manque"}
    say:
      en: >-
        One of these gaps can be closed now. In the risk register, the battery capacity fade
        risk is given its mitigation, and on returning to the gate, the missing mitigation no
        longer appears. The critical licence risk remains open, because it requires a decision
        rather than an additional line of text.
      fr: >-
        L’un de ces manques peut être comblé tout de suite. Dans le registre des risques, on
        attribue son atténuation au risque de perte de capacité de la batterie et, de retour au
        jalon, l’atténuation manquante n’apparaît plus. Le risque critique lié à la licence
        reste ouvert, car il exige une décision et non une simple ligne de texte supplémentaire.
    do:
      - click: {role: tab, name: "Risk Register", exact: true}
      - wait: 1.2
      - fill: {target: {label: {en: "Mitigation of RSK-002", fr: "Atténuation de RSK-002"}, exact: true}, text: {en: "Shallow depth of discharge, per-cell monitoring", fr: "Décharge peu profonde, surveillance par cellule"}, typed: true, press: Enter}
      - wait: 1.2
      - click: {role: tab, name: "Review Gates", exact: true}
      - wait: 2
      - scroll: {target: {css: "[aria-labelledby='gd-mdr']"}}
      - highlight: {target: {css: "[aria-labelledby='gd-mdr'] li:has-text('5 × 5')"}, seconds: 3}
    question:
      type: multichoice
      text:
        en: "Four must-pass criteria fail a week before the review. What should the team leader record?"
        fr: "Quatre critères obligatoires échouent une semaine avant la revue. Que doit consigner le chef d’équipe ?"
      options:
        - text: {en: "No go: close the failed criteria first, with an owner and a date for each.", fr: "No go : fermer d’abord les critères en échec, chacun avec un responsable et une date."}
          correct: true
          why: {en: "Must-pass means the review cannot pass without them.", fr: "Obligatoire veut dire que la revue ne peut pas passer sans eux."}
        - text: {en: "Go: hold the review and discuss the failures there.", fr: "Go : tenir la revue et y discuter des échecs."}
          why: {en: "A review held on failed must-pass items cannot pass; it only spends the reviewers' time.", fr: "Une revue tenue avec des critères obligatoires en échec ne peut pas passer ; elle ne fait que prendre le temps des relecteurs."}
        - text: {en: "Switch to a profile with fewer gates.", fr: "Passer à un profil avec moins de jalons."}
          why: {en: "The profile is set by the course, and every profile has a mission definition review.", fr: "Le profil est fixé par le cours, et chaque profil comporte une revue de définition de mission."}

  - id: decide
    title: {en: "The go or no-go decision", fr: "La décision go ou no go"}
    say:
      en: >-
        The go or no-go decision belongs to the team leader. Record go or no-go opens a decision
        record in the logbook, already completed with the verdict, the number of criteria met
        and not met, and the open issues, one for each criterion not met. The rationale,
        explaining why the team has reached its decision, cannot be completed by the tool. When
        all mandatory criteria are met, the review can begin, and passing it saves a baseline of
        the design.
      fr: >-
        La décision go ou no go appartient au chef d’équipe. Consigner la décision go ou no go
        ouvre une fiche de décision dans le journal de bord, déjà remplie avec le verdict, le
        nombre de critères remplis et non remplis, et les points ouverts, un par critère non
        rempli. La justification, qui explique pourquoi l’équipe a pris sa décision, ne peut pas
        être remplie par l’outil. Lorsque tous les critères obligatoires sont remplis, la revue
        peut commencer, et son franchissement enregistre une référence de la conception.
    do:
      - scroll: {target: {css: "button.c2o-lb-record:has-text('go / no')"}}
      - click: {css: "button.c2o-lb-record:has-text('go / no')"}
      - wait: 1.5
      - highlight: {target: {css: "#c2o-logbook"}, seconds: 3}
      - highlight: {target: {css: "#c2o-logbook textarea"}, seconds: 3}
