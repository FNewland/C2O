# Design concept — risk, failure modes and redundancy (textbook ch. 15): the
# risk loop and register, the 5×5 matrix with CubeSat risks and a mitigation,
# one FMECA line (antenna deployment), typical single-point failures, and
# 3-of-4 wheel redundancy (0.941 → 0.998). Links design to ops: the detection
# column becomes telemetry, limits and FDIR.
# Animated page video/explainers/risk.html. Whole design team.
id: V-DES-11
week: 8
audience: all
title:
  en: "Risk, failure modes and redundancy"
  fr: "Risques, modes de défaillance et redondance"
summary:
  en: "How a team manages what could go wrong: the risk loop and register, scoring on the five-by-five matrix, a failure modes, effects and criticality analysis, single-point failures, and what one spare unit buys in reliability."
  fr: "Comment une équipe gère ce qui pourrait mal tourner : la boucle et le registre des risques, la notation sur la matrice cinq sur cinq, une analyse des modes de défaillance, de leurs effets et de leur criticité, les points de défaillance unique, et ce qu’un équipement de rechange apporte en fiabilité."
apps:
  viz: default
fresh_stack: viz
ties: {}
sources:
  - design/docs/oer/chapters/15_risk_interfaces_fmeca.md (§ 15.1, 15.2, 15.4)

setup:
  - goto: {app: viz, path: "/video/explainers/risk.html?lang={lang}", settle: 1.5}
  - cursor: hide

steps:
  - id: process
    title: {en: "The risk management process", fr: "Le processus de gestion des risques"}
    say:
      en: >-
        Risk management is a continuous process that runs throughout the project. Risks are
        identified, then assessed for their likelihood and their consequence, and then mitigated
        by reducing one or the other. They are then monitored to establish whether each risk is
        increasing or decreasing, or whether its trigger has occurred. The risk register
        contains one line per risk, each with an owner and a trend.
      fr: >-
        La gestion des risques est un processus continu qui se poursuit pendant tout le projet.
        Les risques sont identifiés, puis évalués selon leur probabilité et leur conséquence,
        puis atténués en réduisant l’une ou l’autre. Ils sont ensuite suivis afin de déterminer
        si chaque risque augmente ou diminue, ou si son événement déclencheur s’est produit. Le
        registre des risques contient une ligne par risque, chacune avec un responsable et une
        tendance.
    do:
      - js: "EX.play('process', ${say})"

  - id: matrix
    title: {en: "Scoring a risk", fr: "Noter un risque"}
    say:
      en: >-
        Each risk is scored from one to five for likelihood and for consequence, and the two
        scores are multiplied. A score of four or less is low, and the risk is accepted and
        monitored. Between five and nine, the risk is mitigated if the cost is justified;
        between ten and fifteen, it must be mitigated; and at sixteen or above, a redesign is
        required. An antenna that might fail to deploy scores three times four, twelve, which is
        high. A second, independent release mechanism, tested a hundred times on the ground,
        reduces the likelihood to one and the score to four.
      fr: >-
        Chaque risque est noté de un à cinq pour la probabilité et pour la conséquence, et les
        deux notes sont multipliées. Un score de quatre ou moins est faible : le risque est
        accepté et suivi. Entre cinq et neuf, le risque est atténué si le coût est justifié ;
        entre dix et quinze, il doit être atténué ; à partir de seize, une reconception est
        nécessaire. Une antenne susceptible de ne pas se déployer obtient trois fois quatre,
        soit douze, ce qui est élevé. Un second mécanisme de libération indépendant, testé cent
        fois au sol, ramène la probabilité à un et le score à quatre.
    do:
      - js: "EX.play('matrix', ${say})"
    question:
      type: multichoice
      text:
        en: "A risk scores likelihood 4, consequence 2: software trips safe mode spuriously. Which mitigation lowers the score?"
        fr: "Un risque obtient probabilité 4, conséquence 2 : le logiciel déclenche le mode sûr à tort. Quelle mesure abaisse le score ?"
      options:
        - text: {en: "More software testing and a staged upload, which lower the likelihood.", fr: "Plus d’essais du logiciel et un chargement par étapes, qui abaissent la probabilité."}
          correct: true
          why: {en: "Mitigation moves a risk down (likelihood) or left (consequence).", fr: "L’atténuation déplace un risque vers le bas (probabilité) ou vers la gauche (conséquence)."}
        - text: {en: "Writing the risk into the register.", fr: "Inscrire le risque au registre."}
          why: {en: "Recording a risk tracks it; it does not change it.", fr: "Inscrire un risque permet de le suivre ; cela ne le change pas."}
        - text: {en: "Raising the consequence scale so 2 counts as 1.", fr: "Changer l’échelle des conséquences pour que 2 compte comme 1."}
          why: {en: "That hides the risk instead of reducing it.", fr: "Cela cache le risque au lieu de le réduire."}

  - id: fmeca
    title: {en: "One line of an FMECA", fr: "Une ligne d’AMDEC"}
    say:
      en: >-
        A failure modes, effects and criticality analysis, or FMECA, examines each item in turn.
        The function of the antenna is to radiate the communication link. Its failure mode is
        non-deployment, caused by a jammed mechanism, and the effect is the loss of both
        commanding and telemetry, with a severity of five. Detection would be the absence of the
        beacon. The compensating provision is a second release mechanism, a burn wire and
        spring. Without it, this would be criticality one, a single-point failure. The detection
        column of the FMECA later becomes the telemetry, limits and automatic responses used by
        the operators.
      fr: >-
        Une analyse des modes de défaillance, de leurs effets et de leur criticité, l’AMDEC,
        examine chaque élément tour à tour. La fonction de l’antenne est de rayonner la liaison
        de communication. Son mode de défaillance est l’absence de déploiement, due à un
        mécanisme coincé, et l’effet est la perte de la commande et de la télémesure, avec une
        gravité de cinq. La détection se ferait par l’absence de balise. La disposition
        compensatoire est un second mécanisme de libération, un fil à brûler et un ressort. Sans
        lui, la criticité serait de un, un point de défaillance unique. La colonne de détection
        de l’AMDEC devient ensuite la télémesure, les limites et les réponses automatiques
        utilisées par les opérateurs.
    do:
      - js: "EX.play('fmeca', ${say})"

  - id: spf
    title: {en: "Single-point failures", fr: "Points de défaillance unique"}
    say:
      en: >-
        Every CubeSat has single points of failure, typically the on-board computer, the
        battery, the antenna and array deployments, and the power board. The design task is to
        identify them and to protect them: a watchdog and an autonomous safe mode for the
        computer, cell monitoring and a limited depth of discharge for the battery, and two
        release mechanisms for each deployment. Some single points of failure, such as the power
        board, are accepted, provided the justification is recorded.
      fr: >-
        Tout CubeSat comporte des points de défaillance uniques, en général l’ordinateur de
        bord, la batterie, les déploiements de l’antenne et des panneaux, et la carte
        d’alimentation. La tâche de conception consiste à les identifier et à les protéger : un
        chien de garde et un mode sûr autonome pour l’ordinateur, la surveillance des cellules
        et une profondeur de décharge limitée pour la batterie, et deux mécanismes de libération
        pour chaque déploiement. Certains points de défaillance uniques, comme la carte
        d’alimentation, sont acceptés, à condition que la justification soit consignée.
    do:
      - js: "EX.play('spf', ${say})"

  - id: redundancy
    title: {en: "The value of redundancy", fr: "L’apport de la redondance"}
    say:
      en: >-
        Redundancy is where reliability calculations have the greatest effect. Consider reaction
        wheels that each have a ninety-eight percent probability of operating for two years.
        With three wheels, all three must work, giving an overall probability of ninety-four
        percent. Adding a fourth wheel in a pyramid configuration, in which any three wheels can
        control all three axes, raises the probability to ninety-nine point eight percent.
        EOSAT-1 carries four wheels and can maintain fine pointing with three.
      fr: >-
        C’est dans la redondance que les calculs de fiabilité ont le plus d’effet. Prenons des
        roues de réaction dont chacune a une probabilité de quatre-vingt-dix-huit pour cent de
        fonctionner pendant deux ans. Avec trois roues, les trois doivent fonctionner, ce qui
        donne une probabilité globale de quatre-vingt-quatorze pour cent. L’ajout d’une
        quatrième roue en configuration pyramidale, où trois roues quelconques peuvent contrôler
        les trois axes, porte la probabilité à quatre-vingt-dix-neuf virgule huit pour cent.
        EOSAT-1 emporte quatre roues et peut maintenir un pointage fin avec trois.
    do:
      - js: "EX.play('redundancy', ${say})"
    question:
      type: reflect
      text:
        en: "Name your spacecraft's worst single-point failure. Will you protect it, or accept it, and how will the operators detect it if it happens?"
        fr: "Nommez le pire point de défaillance unique de votre satellite. Le protégerez-vous ou l’accepterez-vous, et comment les opérateurs le détecteront-ils s’il survient ?"
