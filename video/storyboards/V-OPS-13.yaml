# Week 6 — a unique task: first light, worked with COM-012 rev 2.0 (WB-5.6-C012).
# Starts from the card's real entry state (breakpoint card-COM-012): payload in
# STANDBY with the cooler at -15 C, AOCS NOMINAL with a tracker in the loop.
# Fine-ready check, FINE_POINT, IMAGING, the capture, the image in memory,
# STANDBY, then the product down over Service 13 at HIGH. Ruled 2026-11-07 as
# one of the three ops videos. No screen shows the image itself (the
# worksheet map lists an image quick-look tool as a deferred gap), so the
# video stops where the operator's part stops: the product is down.
id: V-OPS-13
week: 6
audience: all
title:
  en: "First light: from fine pointing to the first image downlink"
  fr: "Première lumière : du pointage fin à la transmission de la première image"
summary:
  en: "This video records the first image of the mission. It checks that the spacecraft is ready for fine pointing, commands fine pointing, captures the image and confirms that it is stored in memory. The payload is then returned to standby, and the image is transmitted to the ground using Service 13, following the procedure card."
  fr: "Cette vidéo enregistre la première image de la mission. Elle vérifie que le satellite est prêt pour le pointage fin, commande le pointage fin, réalise la prise de vue et confirme que l’image est en mémoire. La charge utile est ensuite remise en attente, et l’image est transmise au sol par le service 13, en suivant la fiche de procédure."
apps:
  mcs: default
fresh_stack: sim
ties:
  worksheets: [WB-5.6-C012, WB-5.6-C012/q1, WB-5.6-C012/q6, WB-5.6-C012/q8]
  cards: [COM-012]
sources:
  - sim/configs/eosat1/procedures/commissioning/first_light.md (COM-012 rev 2.0)
  - sim/configs/eosat1/worksheets/ops_week3.yaml (WB-5.6-C012)

setup:
  - api: {app: instructor, method: POST, path: /api/command, json: {type: load_breakpoint, name: card-COM-012}}
  - wait: 2
  - api: {app: instructor, method: POST, path: /api/command, json: {type: override_passes, enabled: false}, allow_error: true}
  - python: {call: "video/c2ovideo/helpers.py:ff_to_pass", app: instructor, kwargs: {planner: "${planner_url}", min_duration: 540, min_elevation: 15, after_aos: 90}}
  - api: {app: mcs, method: POST, path: /api/pus-command, json: {service: 3, subtype: 27, data_hex: "0002", name: HK_REQUEST, position: flight_director}}
  - api: {app: mcs, method: POST, path: /api/pus-command, json: {service: 3, subtype: 5, data_hex: "0007", name: HK_ENABLE, position: flight_director}}
  - api: {app: mcs, method: POST, path: /api/pus-command, json: {service: 3, subtype: 5, data_hex: "0005", name: HK_ENABLE, position: flight_director}}
  - wait: 4
  - goto: {app: mcs, path: "/?lang={lang}&position=flight_director", settle: 4}
  - js: "fetch('/api/logbook', {method: 'DELETE', credentials: 'same-origin'})"
  - reload: 5

steps:
  - id: ready
    title: {en: "Step 1: the fine-pointing readiness check", fr: "Étape 1 : contrôle de préparation au pointage fin"}
    say:
      en: >-
        This video follows the commissioning procedure COM-012, first light. At the start of the
        procedure the payload is in standby, with the cooler holding the focal plane at minus
        fifteen degrees, and the attitude control system is in NOMINAL mode with a star tracker
        in the loop. Imaging requires FINE_POINT mode, and the spacecraft will reject a
        FINE_POINT command unless all of its preconditions are met. The first step is therefore
        to request the fine-ready check. Each field in the result corresponds to one condition:
        sufficient stars, three wheels available, a converged estimator, low body rates,
        adequate momentum margin and no slew in progress. A value of zero means that all the
        conditions are met.
      fr: >-
        Cette vidéo suit la procédure de mise en service COM-012, première lumière. Au début de
        la procédure, la charge utile est en attente, son refroidisseur maintenant le plan focal
        à moins quinze degrés, et le système de contrôle d’attitude est en mode NOMINAL avec un
        senseur stellaire dans la boucle. L’imagerie exige le mode FINE_POINT, et le satellite
        rejette toute commande FINE_POINT tant que l’ensemble de ses conditions préalables n’est
        pas rempli. La première étape consiste donc à demander le contrôle d’aptitude au
        pointage fin. Chaque champ du résultat correspond à une condition : nombre d’étoiles
        suffisant, trois roues disponibles, estimateur convergé, vitesses angulaires faibles,
        marge de moment cinétique suffisante et aucun basculement en cours. Une valeur nulle
        indique que toutes les conditions sont remplies.
    do:
      - click: {css: "#rail-aocs"}
      - wait_for: {target: {css: "#aocs-quick-list"}, timeout: 20}
      - wait: 1.0
      - click: {css: "#aocs-quick-list button", has_text: {en: "Fine-Ready Check", fr: "Contrôle aptitude FINE"}}
      - wait: 3
      - js: "document.getElementById('aocs-fineready').scrollIntoView({block: 'center'})"
      - wait: 1.0
      - highlight: {target: {css: "#aocs-fineready"}, seconds: 5}
    question:
      type: multichoice
      worksheet: WB-5.6-C012/q1
      text:
        en: "Why send the fine-ready check before commanding FINE_POINT?"
        fr: "Pourquoi envoyer le contrôle d’aptitude avant de commander FINE_POINT ?"
      options:
        - text: {en: "FINE_POINT is refused unless every precondition holds; the mask names the one that does not.", fr: "FINE_POINT est refusé si une condition manque ; le masque nomme celle qui manque."}
          correct: true
          why: {en: "A refused mode command only says no; the mask says why.", fr: "Une commande de mode refusée dit seulement non ; le masque dit pourquoi."}
        - text: {en: "It switches the star tracker into the loop.", fr: "Il fait entrer le senseur stellaire dans la boucle."}
          why: {en: "It only reports; it changes nothing on board.", fr: "Il ne fait que rendre compte ; il ne change rien à bord."}
        - text: {en: "It calibrates the gyros before imaging.", fr: "Il étalonne les gyromètres avant l’imagerie."}
          why: {en: "Gyro calibration is COM-003, long before first light.", fr: "L’étalonnage des gyromètres, c’est COM-003, bien avant la première lumière."}

  - id: fine
    title: {en: "FINE_POINT mode", fr: "Le mode FINE_POINT"}
    say:
      en: >-
        The operator then commands FINE_POINT. The mode changes, and within about thirty seconds
        the pointing error settles to a few hundredths of a degree. The payload will only start
        a capture when the error is below five hundredths of a degree.
      fr: >-
        L’opérateur commande ensuite FINE_POINT. Le mode change et, en une trentaine de
        secondes, l’erreur de pointage se stabilise à quelques centièmes de degré. La charge
        utile ne lance une prise de vue que si l’erreur est inférieure à cinq centièmes de
        degré.
    do:
      - click: {css: "#aocs-quick-list button", has_text: {en: "Fine Point", fr: "Pointage fin"}}
      - wait: 3
      - js: "document.getElementById('att3d').scrollIntoView({block: 'center'})"
      - wait: 1.0
      - highlight: {target: {css: ".ds-card:has(#aocs-stepper)"}, seconds: 3}
      - wait: 8
      - highlight: {target: {css: "#aocs-params"}, seconds: 4, point: false}

  - id: imaging
    title: {en: "Steps 2 to 4: payload to IMAGING", fr: "Étapes 2 à 4 : la charge utile en IMAGING"}
    say:
      en: >-
        On the payload page, the focal plane temperature is minus fifteen and a half degrees,
        which is within its operating band, and the instrument reports that it is ready. Before
        the capture, record the memory used and the image count; these are the reference values
        for checking the result. The payload is then commanded to IMAGING mode.
      fr: >-
        Sur la page de la charge utile, la température du plan focal est de moins quinze degrés
        et demi, ce qui est dans sa plage de fonctionnement, et l’instrument indique qu’il est
        prêt. Avant la prise de vue, notez la mémoire utilisée et le nombre d’images : ce sont
        les valeurs de référence pour vérifier le résultat. La charge utile est ensuite
        commandée en mode IMAGING.
    do:
      - click: {css: "#rail-pld"}
      - wait_for: {target: {css: "#pld-quick-list"}, timeout: 20}
      - wait: 1.5
      - highlight: {target: {css: "#pld-schematic"}, seconds: 4, point: false}
      - js: "document.getElementById('pld-quick-list').scrollIntoView({block: 'center'})"
      - wait: 0.8
      - click: {css: "#pld-quick-list button", has_text: {en: "Imaging", fr: "Prise de vue"}}
      - wait: 4

  - id: capture
    title: {en: "Step 5: the first image", fr: "Étape 5 : la première image"}
    say:
      en: >-
        Step five is the capture itself, sent from the command builder for scene one, with two
        thousand and forty-eight lines. The scan takes about eight seconds. The result is
        confirmed on the payload page: the image count has increased to one, the last scene
        number is one, and the memory used has increased by approximately one megabyte, the size
        of the compressed image.
      fr: >-
        L’étape cinq est la prise de vue elle-même, envoyée depuis le constructeur de commandes
        pour la scène un, avec deux mille quarante-huit lignes. Le balayage dure environ huit
        secondes. Le résultat se vérifie sur la page de la charge utile : le nombre d’images est
        passé à un, le numéro de la dernière scène est un, et la mémoire utilisée a augmenté
        d’environ un mégaoctet, soit la taille de l’image compressée.
    do:
      - click: {css: "#rail-cmd"}
      - select: {target: {css: "#cmd-catalog"}, value: PAYLOAD_CAPTURE}
      - wait: 0.6
      - fill: {target: {css: "#cmd-fields [data-cmd-field='scene_id']"}, text: "1"}
      - fill: {target: {css: "#cmd-fields [data-cmd-field='lines']"}, text: "2048"}
      - click: {css: "#cmd-send:not(.hide), #cmd-send-crit:not(.hide)"}
      - wait: 2.5
      - highlight: {target: {css: "#cmd-verif-stepper"}, seconds: 2.5}
      - wait: 6
      - click: {css: "#rail-pld"}
      - wait: 2
      - highlight: {target: {css: "#pld-schematic"}, seconds: 4, point: false}
      - highlight: {target: {css: "#pld-params"}, seconds: 3, point: false}
    question:
      type: multichoice
      worksheet: WB-5.6-C012/q6
      text:
        en: "payload.mem_used_mb (0x060B) reads 4001 MB after the capture. What does that tell you on its own?"
        fr: "payload.mem_used_mb (0x060B) lit 4001 Mo après la prise de vue. Qu’est-ce que cela vous dit à lui seul ?"
      options:
        - text: {en: "Nothing: it is the total used memory. Only the change from the baseline measures the new image.", fr: "Rien : c’est la mémoire totale utilisée. Seul l’écart à la référence mesure la nouvelle image."}
          correct: true
          why: {en: "That is why step 3 records the baseline before the capture.", fr: "C’est pourquoi l’étape 3 note la référence avant la prise de vue."}
        - text: {en: "The image is 4001 MB.", fr: "L’image fait 4001 Mo."}
          why: {en: "One frame is 4 MB raw, 1-2.7 MB compressed.", fr: "Une image fait 4 Mo brute, 1 à 2,7 Mo compressée."}
        - text: {en: "The memory is nearly full.", fr: "La mémoire est presque pleine."}
          why: {en: "The store is 20 GB; 4 GB is 20 %.", fr: "La mémoire fait 20 Go ; 4 Go, c’est 20 %."}

  - id: standby
    title: {en: "Step 7: back to STANDBY", fr: "Étape 7 : retour en attente"}
    say:
      en: >-
        Once the image is stored, the payload is returned to standby. This also switches off the
        cooler. Its power consumption falls to zero, which makes about fifteen watts available
        to the rest of the spacecraft.
      fr: >-
        Une fois l’image enregistrée, la charge utile est remise en attente. Cette commande
        coupe aussi le refroidisseur : sa consommation tombe à zéro, ce qui libère environ
        quinze watts pour le reste du satellite.
    do:
      - js: "document.getElementById('pld-quick-list').scrollIntoView({block: 'center'})"
      - wait: 0.8
      - click: {css: "#pld-quick-list button", has_text: {en: "Standby", fr: "Attente"}}
      - wait: 4
      - js: "document.getElementById('pld-schematic').scrollIntoView({block: 'center'})"
      - wait: 1.0
      - highlight: {target: {css: "#pld-schematic"}, seconds: 3.5, point: false}

  - id: downlink
    title: {en: "Step 8: transmitting the image", fr: "Étape 8 : transmission de l’image"}
    say:
      en: >-
        Step eight is the downlink. The high-rate link is enabled first: downlink mode on, then
        the HIGH data rate of one hundred and twenty-eight kilobits per second, which appears on
        the status strip. A Service 13 transfer is then opened for scene one. The first report
        gives the transfer identifier, the number of blocks and the checksum calculated by the
        instrument at the time of capture. The transfer progress increases as the blocks arrive.
      fr: >-
        L’étape huit est la transmission au sol. La liaison haut débit est d’abord activée : le
        mode de liaison descendante, puis le débit HIGH de cent vingt-huit kilobits par seconde,
        qui s’affiche dans le bandeau d’état. Un transfert du service 13 est ensuite ouvert pour
        la scène un. Le premier rapport indique l’identifiant du transfert, le nombre de blocs
        et la somme de contrôle calculée par l’instrument au moment de la prise de vue. La
        progression du transfert augmente à mesure que les blocs arrivent.
    do:
      - click: {css: "#rail-ttc"}
      - wait_for: {target: {css: "#ttc-quick-list"}, timeout: 20}
      - js: "document.getElementById('ttc-quick-list').scrollIntoView({block: 'center'})"
      - wait: 0.8
      - click: {css: "#ttc-quick-list button", has_text: {en: "DL Mode ON", fr: "Mode LD ON"}}
      - wait: 1.5
      - click: {css: "#ttc-quick-list button", has_text: {en: "Rate HIGH", fr: "Débit HIGH"}}
      - wait: 4
      - highlight: {target: {css: "#sa-see"}, seconds: 3}
      - click: {css: "#rail-cmd"}
      - select: {target: {css: "#cmd-catalog"}, value: S13_CREATE_TRANSFER}
      - wait: 0.6
      - fill: {target: {css: "#cmd-fields [data-cmd-field='scene_id']"}, text: "1"}
      - fill: {target: {css: "#cmd-fields [data-cmd-field='size_mb']"}, text: "0"}
      - click: {css: "#cmd-send:not(.hide), #cmd-send-crit:not(.hide)"}
      - wait: 3
      - click: {css: "#rail-pld"}
      - wait: 1.5
      - highlight: {target: {css: "#pld-schematic"}, seconds: 3, point: false}
    question:
      type: multichoice
      worksheet: WB-5.6-C012/q8
      text:
        en: "Why does the card open DOWNLINK mode and the HIGH rate before the Service 13 transfer?"
        fr: "Pourquoi la fiche ouvre-t-elle le mode de liaison descendante et le débit HIGH avant le transfert du service 13 ?"
      options:
        - text: {en: "The transfer drains at the active rate: at LOW it would take eight times longer, most of a pass.", fr: "Le transfert se vide au débit actif : en LOW, il prendrait huit fois plus longtemps, l’essentiel d’un passage."}
          correct: true
          why: {en: "128 kbit/s against 16 kbit/s. And the card closes the gate again at the end.", fr: "128 kbit/s contre 16 kbit/s. Et la fiche referme la voie à la fin."}
        - text: {en: "Service 13 is refused at LOW.", fr: "Le service 13 est refusé en LOW."}
          why: {en: "It works at any rate; only the duration changes.", fr: "Il fonctionne à tout débit ; seule la durée change."}
        - text: {en: "HIGH has a better checksum.", fr: "HIGH a une meilleure somme de contrôle."}
          why: {en: "The checksum belongs to the product, not to the rate.", fr: "La somme de contrôle appartient au produit, pas au débit."}

  - id: down
    title: {en: "Transfer complete and verified", fr: "Transfert terminé et vérifié"}
    say:
      en: >-
        After a little over a minute the transfer reaches one hundred percent and is closed. On
        the ground, the product is verified against the checksum from the first report, and the
        payload team inspects the image for correct geometry, the presence of all four bands and
        any striping. The procedure ends by returning the data rate to LOW and disabling the
        high-rate link, which must not be left enabled at the end of the procedure. This
        completes first light.
      fr: >-
        Après un peu plus d’une minute, le transfert atteint cent pour cent et se ferme. Au sol,
        le produit est vérifié à l’aide de la somme de contrôle du premier rapport, et l’équipe
        de la charge utile examine l’image : géométrie correcte, présence des quatre bandes,
        absence de stries. La procédure se termine en remettant le débit à LOW et en désactivant
        la liaison haut débit, qui ne doit pas rester activée en fin de procédure. La première
        lumière est ainsi réalisée.
    do:
      - python: {call: "video/c2ovideo/helpers.py:wait_mcs_param", app: mcs, kwargs: {pid: "0x062E", at_least: 100, timeout_s: 120}}
      - wait: 3
      - highlight: {target: {css: "#pld-schematic"}, seconds: 3, point: false}
      - wait: 3
    question:
      type: reflect
      worksheet: WB-5.6-C012/q9
      text:
        en: "The payload team reports that the first-light image is completely dark. Using the card, what do you check before you blame the instrument?"
        fr: "L’équipe de la charge utile signale que l’image de première lumière est entièrement noire. Avec la fiche, que vérifiez-vous avant de mettre en cause l’instrument ?"
