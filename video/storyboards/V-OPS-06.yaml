# Week 5 — LEOP-007: power the AOCS suite in order and command DETUMBLE.
# From card-LEOP-007 (the card's real entry state) in a pass. Nominal card.
# Prepares WB-5.5-L007 (steps 3, 4, 5).
id: V-OPS-06
week: 10
audience: all
title:
  en: "LEOP-007: AOCS power-on and DETUMBLE"
  fr: "LEOP-007 : mise sous tension du SCAO et mode DETUMBLE"
summary:
  en: "This video powers the attitude and orbit control units and enables their housekeeping. The magnetometer and the magnetorquers are switched on before DETUMBLE is commanded, and the mode is checked against a live magnetic-field measurement."
  fr: "Cette vidéo met sous tension les équipements du SCAO et active leurs données de servitude. Le magnétomètre et les magnétocoupleurs sont allumés avant la commande du mode DETUMBLE, et le mode est vérifié sur une mesure réelle du champ magnétique."
apps:
  mcs: default
fresh_stack: sim
ties:
  worksheets: [WB-5.5-L007, WB-5.5-L007/q3, WB-5.5-L007/q4, WB-5.5-L007/q5]
  cards: [LEOP-007]
sources:
  - sim/configs/eosat1/procedures/leop/sequential_power_on.md (LEOP-007)

setup:
  - api: {app: instructor, method: POST, path: /api/command, json: {type: load_breakpoint, name: card-LEOP-007}}
  - wait: 2
  - python: {call: "video/c2ovideo/helpers.py:ff_to_pass", app: instructor, kwargs: {planner: "${planner_url}", min_duration: 480, min_elevation: 15, after_aos: 10}}
  - api: {app: mcs, method: POST, path: /api/pus-command, json: {service: 3, subtype: 27, data_hex: "0001", name: HK_REQUEST, position: flight_director}}
  - wait: 3
  - goto: {app: mcs, path: "/?lang={lang}&position=flight_director", settle: 4}
  - js: "fetch('/api/logbook', {method: 'DELETE', credentials: 'same-origin'})"
  - reload: 4

steps:
  - id: card
    title: {en: "What this card powers, and what it does not", fr: "Ce que la fiche alimente, et ce qu’elle n’alimente pas"}
    say:
      en: >-
        The solar wings are deployed, but the spacecraft is still tumbling. LEOP-007, a
        procedure of the launch and early orbit phase, brings the attitude and orbit control
        system, or AOCS, into operation one step at a time, with a check after each step. The
        procedure deliberately leaves several units off: the reaction wheels, the payload, the
        camera cooler and the propulsion system are each switched on by a later procedure. Step
        1 checks the power baseline, and step 2 switches on a heater only if a temperature
        requires it.
      fr: >-
        Les ailes solaires sont déployées, mais le satellite tourne encore sur lui-même.
        LEOP-007, une procédure de la phase de lancement et de début d’orbite, met en service le
        système de contrôle d’attitude et d’orbite, le SCAO, AOCS sur la console, une étape à la
        fois, avec une vérification après chaque étape. La procédure laisse volontairement
        plusieurs unités éteintes : les roues de réaction, la charge utile, le refroidisseur de
        la caméra et le système de propulsion sont chacun mis sous tension par une procédure
        ultérieure. L’étape 1 vérifie la référence énergie, et l’étape 2 n’allume un réchauffeur
        que si une température l’exige.
    do:
      - click: {css: "#rail-proc"}
      - select: {target: {css: "#proc-source"}, value: ops}
      - wait: 0.8
      - select: {target: {css: "#proc-type"}, value: leop/sequential_power_on.md}
      - wait: 2.0
      - scroll: {css: "#proc-doc"}
      - highlight: {target: {css: "#proc-doc"}, seconds: 3.5, point: false}

  - id: line
    title: {en: "Step 3: the AOCS line and its housekeeping", fr: "Étape 3 : la ligne SCAO et ses données"}
    say:
      en: >-
        Step 3 switches on power line seven, which supplies the AOCS units. The operator then
        enables the AOCS housekeeping report, structure identifier two, or SID two. Switching on
        a unit does not enable its report, and without this second command the following steps
        would have to be performed without telemetry.
      fr: >-
        L’étape 3 met sous tension la ligne d’alimentation sept, qui alimente les unités du
        SCAO. L’opérateur active ensuite le rapport de servitude du SCAO, identifiant de
        structure deux, ou SID deux. La mise sous tension d’une unité n’active pas son rapport,
        et sans cette seconde commande, les étapes suivantes devraient être menées sans
        télémesure.
    do:
      - click: {css: "#rail-cmd"}
      - select: {target: {css: "#cmd-catalog"}, value: EPS_POWER_ON}
      - wait: 0.5
      - fill: {target: {css: "#cmd-fields [data-cmd-field='line_index']"}, text: "7"}
      - click: {css: "#cmd-send"}
      - wait: 2.0
      - select: {target: {css: "#cmd-catalog"}, value: HK_ENABLE}
      - wait: 0.5
      - fill: {target: {css: "#cmd-fields [data-cmd-field='sid']"}, text: "2"}
      - click: {css: "#cmd-send"}
      - wait: 2.0
      - highlight: {target: {css: "#cmd-verif-stepper"}, seconds: 2.5}

  - id: legs
    title: {en: "Step 4: magnetometer and magnetorquers", fr: "Étape 4 : magnétomètre et magnétocoupleurs"}
    say:
      en: >-
        DETUMBLE, the mode that reduces the tumble, uses the B-dot control law, where B stands
        for the magnetic field and dot for its rate of change. The magnetometer measures how the
        Earth's field rotates relative to the spacecraft body, and the magnetorquers, which are
        electromagnetic rods, generate torque to oppose that rotation. Both units must therefore
        be switched on first: the magnetometer, device five two one, and then the magnetorquers.
        The GPS receiver is also started at this point, because the time and orbit procedures
        will need its first position fix later.
      fr: >-
        DETUMBLE, le mode qui amortit la rotation, utilise la loi de commande B-dot, où B
        désigne le champ magnétique et dot sa dérivée. Le magnétomètre mesure la rotation du
        champ terrestre par rapport à la structure du satellite, et les magnétocoupleurs, des
        barreaux électromagnétiques, produisent un couple qui s’oppose à cette rotation. Les
        deux unités doivent donc être allumées en premier : le magnétomètre, l’équipement cinq
        deux un, puis les magnétocoupleurs. Le récepteur GPS est également démarré à ce stade,
        car les procédures de temps et d’orbite auront besoin de son premier point de position
        plus tard.
    do:
      - select: {target: {css: "#cmd-catalog"}, value: S2_AOCS_MAGNETOMETER}
      - wait: 0.5
      - fill: {target: {css: "#cmd-fields [data-cmd-field='device_id']"}, text: "521"}
      - fill: {target: {css: "#cmd-fields [data-cmd-field='state']"}, text: "1"}
      - click: {css: "#cmd-send"}
      - wait: 2.0
      - select: {target: {css: "#cmd-catalog"}, value: MTQ_ENABLE}
      - wait: 0.5
      - fill: {target: {css: "#cmd-fields [data-cmd-field='enable']"}, text: "1"}
      - click: {css: "#cmd-send"}
      - wait: 2.0
      - select: {target: {css: "#cmd-catalog"}, value: S2_AOCS_GPS_RECEIVER}
      - wait: 0.5
      - fill: {target: {css: "#cmd-fields [data-cmd-field='device_id']"}, text: "527"}
      - fill: {target: {css: "#cmd-fields [data-cmd-field='state']"}, text: "1"}
      - click: {css: "#cmd-send"}
      - wait: 2.0
    question:
      type: multichoice
      worksheet: WB-5.5-L007/q4
      text:
        en: "What happens if you command DETUMBLE before the magnetometer is on?"
        fr: "Que se passe-t-il si vous commandez DETUMBLE avant d’allumer le magnétomètre ?"
      options:
        - text: {en: "The mode is entered but B-dot has no field to work from: the rates do not come down.", fr: "Le mode est pris mais B-dot n’a pas de champ sur lequel travailler : les vitesses ne baissent pas."}
          correct: true
          why: {en: "That is why the card checks the mode against a live field reading, not just the mode number.", fr: "C’est pourquoi la fiche vérifie le mode sur une mesure réelle du champ, pas seulement sur le numéro du mode."}
        - text: {en: "Nothing: the AOCS switches the magnetometer on by itself.", fr: "Rien : le SCAO allume lui-même le magnétomètre."}
          why: {en: "Units are switched on by command, never by a mode change here.", fr: "Les unités s’allument par commande, jamais par un changement de mode ici."}
        - text: {en: "The reaction wheels take over.", fr: "Les roues de réaction prennent le relais."}
          why: {en: "The wheels stay disabled until COM-004.", fr: "Les roues restent désactivées jusqu’à COM-004."}

  - id: detumble
    title: {en: "Step 5: DETUMBLE and the magnetic-field check", fr: "Étape 5 : DETUMBLE et contrôle du champ magnétique"}
    say:
      en: >-
        The operator then commands DETUMBLE, mode two, and the command is accepted and executed.
        On the attitude page the mode shows DETUMBLE, but the important check is the magnetic
        field: its magnitude must be between five thousand and seventy thousand nanotesla. A
        reading of zero means that the magnetometer is not providing data to the control law,
        regardless of the mode displayed. The operator also records the body rates, the rotation
        rate about each axis, which the next procedure monitors as they decrease.
      fr: >-
        L’opérateur commande ensuite DETUMBLE, le mode deux, et la commande est acceptée puis
        exécutée. Sur la page attitude, le mode indique DETUMBLE, mais la vérification
        importante porte sur le champ magnétique : sa norme doit être comprise entre cinq mille
        et soixante-dix mille nanoteslas. Une valeur nulle signifie que le magnétomètre ne
        fournit pas de données à la loi de commande, quel que soit le mode affiché. L’opérateur
        relève aussi les vitesses angulaires, c’est-à-dire la vitesse de rotation autour de
        chaque axe, que la procédure suivante surveille pendant leur décroissance.
    do:
      - select: {target: {css: "#cmd-catalog"}, value: AOCS_SET_MODE}
      - wait: 0.5
      - select: {target: {css: "#cmd-fields [data-cmd-field='mode']"}, value: "2"}
      - click: {css: "#cmd-send:not(.hide), #cmd-send-crit:not(.hide)"}
      - wait: 2.0
      - highlight: {target: {css: "#cmd-verif-stepper"}, seconds: 2.5}
      - click: {css: "#rail-aocs"}
      - wait: 4.0
      - highlight: {target: {css: "#page-aocs tr[data-param='0x020F']"}, seconds: 2.5}
      - highlight: {target: {css: "#page-aocs tr[data-param='0x0277']"}, seconds: 3}
      - highlight: {target: {css: "#page-aocs tr[data-param='0x0204']"}, seconds: 2.5}
    question:
      type: truefalse
      worksheet: WB-5.5-L007/q5
      answer: false
      text:
        en: "aocs.mode reads 2 (DETUMBLE), so Step 5 is GO."
        fr: "aocs.mode affiche 2 (DETUMBLE) : l’étape 5 est donc GO."

  - id: record
    title: {en: "Recording the result and the next card", fr: "Consigner le résultat et la fiche suivante"}
    say:
      en: >-
        On the card, the operator captures the values and marks steps 3 to 5 GO. Step 6 confirms
        the power state at the end of the procedure: the payload, cooler and propulsion lines
        are still off, and the wheels are still disabled. No further commands are sent for some
        time. LEOP-005 monitors the B-dot law as it slows the spacecraft, until the AOCS changes
        to Sun pointing on its own.
      fr: >-
        Sur la fiche, l’opérateur relève les valeurs et marque les étapes 3 à 5 GO. L’étape 6
        confirme l’état d’alimentation en fin de procédure : les lignes de la charge utile, du
        refroidisseur et de la propulsion sont toujours éteintes, et les roues toujours
        désactivées. Aucune autre commande n’est envoyée pendant un certain temps. LEOP-005
        surveille la loi B-dot pendant qu’elle ralentit le satellite, jusqu’à ce que le SCAO
        passe de lui-même au pointage solaire.
    do:
      - click: {css: "#rail-proc"}
      - wait: 1.0
      - scroll: {css: "#proc-doc section[data-pc-step='s3']"}
      - click: {css: "#proc-doc section[data-pc-step='s3'] [data-pc='capture']"}
      - click: {css: "#proc-doc section[data-pc-step='s3'] [data-pc='tick'][data-r='go']"}
      - scroll: {css: "#proc-doc section[data-pc-step='s5']"}
      - click: {css: "#proc-doc section[data-pc-step='s5'] [data-pc='capture']"}
      - click: {css: "#proc-doc section[data-pc-step='s5'] [data-pc='tick'][data-r='go']"}
      - scroll: {css: "#proc-doc section[data-pc-step='s6']"}
      - highlight: {target: {css: "#proc-doc section[data-pc-step='s6']"}, seconds: 3, point: false}
