# Design concept — architecture, interfaces and budgets: the block diagram,
# the N² matrix and an interface conflict (I²C against RS-422), the Phase A
# mass budget with both margin levels (Table 8.3), how the margins compound,
# and the power budget by mode with its orbit average (Table 8.4).
# Animated page video/explainers/budgets.html. Whole design team.
id: V-DES-06
week: 5
audience: all
title:
  en: "Architecture, interfaces and budgets"
  fr: "Architecture, interfaces et bilans"
summary:
  en: "Will the design close? Draw the block diagram, list every interface in an N-squared matrix and catch the conflicts, then build the mass budget with its two levels of margin and the power budget mode by mode."
  fr: "La conception se ferme-t-elle ? Dessiner le schéma fonctionnel, lister chaque interface dans une matrice N carré et repérer les conflits, puis établir le bilan de masse avec ses deux niveaux de marge et le bilan de puissance mode par mode."
apps:
  viz: default
fresh_stack: viz
ties: {}
sources:
  - design/docs/oer/chapters/08_architecture_interfaces_budgets.md (§ 8.2–8.4, Tables 8.1, 8.3, 8.4)

setup:
  - goto: {app: viz, path: "/video/explainers/budgets.html?lang={lang}", settle: 1.5}
  - cursor: hide

steps:
  - id: blocks
    title: {en: "The block diagram", fr: "Le schéma fonctionnel"}
    say:
      en: >-
        Before any sizing is carried out, the spacecraft is represented as a set of blocks: the
        payload, power, the on-board computer, attitude control, the radio, thermal control and
        the structure. The connections between the blocks are then added. Power is distributed
        from the power subsystem, data passes through the on-board computer, and the radio links
        the spacecraft to the ground. Each connection is an interface, and each interface
        requires agreement between two teams.
      fr: >-
        Avant tout dimensionnement, le satellite est représenté sous forme de blocs : la charge
        utile, l’énergie, l’ordinateur de bord, le contrôle d’attitude, la radio, le contrôle
        thermique et la structure. On ajoute ensuite les liaisons entre les blocs. L’énergie est
        distribuée par le sous-système énergie, les données transitent par l’ordinateur de bord
        et la radio relie le satellite au sol. Chaque liaison est une interface, et chaque
        interface exige un accord entre deux équipes.
    do:
      - js: "EX.play('blocks', ${say})"

  - id: n2
    title: {en: "The N-squared matrix", fr: "La matrice N carré"}
    say:
      en: >-
        The N-squared matrix lists all the interfaces. The subsystems are placed on the
        diagonal, and each of the other cells shows what the subsystem in that row provides to
        the one in that column. Both sides of each cell are then compared. In this example, the
        on-board computer sends wheel commands over an I two C bus, but the wheel selected by
        the attitude team uses RS four twenty-two. This is an interface conflict. The options
        are to select a different wheel, add a converter or change the computer, and the
        decision must be recorded.
      fr: >-
        La matrice N carré liste toutes les interfaces. Les sous-systèmes sont placés sur la
        diagonale, et chacune des autres cases indique ce que le sous-système de la ligne
        fournit à celui de la colonne. On compare ensuite les deux côtés de chaque case. Dans
        cet exemple, l’ordinateur de bord envoie les commandes des roues sur un bus I deux C,
        mais la roue choisie par l’équipe d’attitude utilise le RS quatre cent vingt-deux. Il
        s’agit d’un conflit d’interface. Les options sont de choisir une autre roue, d’ajouter
        un convertisseur ou de changer d’ordinateur, et la décision doit être consignée.
    do:
      - js: "EX.play('n2', ${say})"

  - id: mass
    title: {en: "The mass budget", fr: "Le bilan de masse"}
    say:
      en: >-
        Budgets show whether the design closes. The starting point is the current best estimate
        of the mass of each subsystem, three point six eight kilograms in total. A maturity
        margin is added to each item, twenty percent for new equipment, followed by a system
        margin appropriate to the phase, twenty percent in Phase A. The result is five point
        three kilograms against a launch allocation of six kilograms, leaving zero point seven
        kilograms, or eleven point seven percent, in reserve. This is shown in amber.
      fr: >-
        Les bilans indiquent si la conception se ferme. Le point de départ est la meilleure
        estimation actuelle de la masse de chaque sous-système, soit trois virgule six huit
        kilogrammes au total. On ajoute à chaque équipement une marge de maturité, vingt pour
        cent pour un équipement neuf, puis une marge système adaptée à la phase, vingt pour cent
        en phase A. Le résultat est de cinq virgule trois kilogrammes pour une allocation de
        lancement de six kilogrammes, ce qui laisse une réserve de zéro virgule sept kilogramme,
        soit onze virgule sept pour cent. Ce résultat s’affiche en orange.
    do:
      - js: "EX.play('mass', ${say})"
    question:
      type: multichoice
      text:
        en: "In Phase B, the system margin drops from 20 % to 15 %, but nothing else changes. What happens to this budget's margin against the allocation?"
        fr: "En phase B, la marge système passe de 20 % à 15 %, sans autre changement. Qu’arrive-t-il à la marge de ce bilan face à l’allocation ?"
      options:
        - text: {en: "It grows: 4.42 × 1.15 = 5.08 kg, leaving 0.92 kg, about 15 %.", fr: "Elle augmente : 4,42 × 1,15 = 5,08 kg, il reste 0,92 kg, environ 15 %."}
          correct: true
          why: {en: "Released system margin becomes margin against the allocation, if the estimates did not grow.", fr: "La marge système libérée devient de la marge face à l’allocation, si les estimations n’ont pas augmenté."}
        - text: {en: "It shrinks, because the system margin is smaller.", fr: "Elle diminue, puisque la marge système est plus petite."}
          why: {en: "A smaller held margin means less mass is booked above the estimate.", fr: "Une marge réservée plus petite signifie moins de masse comptée au-dessus de l’estimation."}
        - text: {en: "Nothing: the system margin only applies in Phase A.", fr: "Rien : la marge système ne s’applique qu’en phase A."}
          why: {en: "It applies in every phase, at a smaller value each time (Table 8.3).", fr: "Elle s’applique à chaque phase, avec une valeur plus petite à chaque fois (tableau 8.3)."}

  - id: compound
    title: {en: "Combining margins", fr: "Le cumul des marges"}
    say:
      en: >-
        The two margins are multiplied together. In Phase A, with new equipment, one point two
        multiplied by one point two gives about forty-four percent above the best estimate. In
        Phase C, with mostly flight-proven equipment, the total is about sixteen percent, and in
        Phase D, with measured masses, about five percent. Margin is released only as estimates
        are replaced by measurements, and never simply because a budget would not otherwise
        close.
      fr: >-
        Les deux marges se multiplient. En phase A, avec des équipements neufs, un virgule deux
        multiplié par un virgule deux donne environ quarante-quatre pour cent au-dessus de la
        meilleure estimation. En phase C, avec des équipements surtout éprouvés en vol, le total
        est d’environ seize pour cent, et en phase D, avec des masses mesurées, d’environ cinq
        pour cent. La marge n’est libérée qu’à mesure que les mesures remplacent les
        estimations, et jamais simplement parce qu’un bilan ne se fermerait pas autrement.
    do:
      - js: "EX.play('compound', ${say})"

  - id: power
    title: {en: "The power budget", fr: "Le bilan de puissance"}
    say:
      en: >-
        Power is budgeted mode by mode, because not all equipment operates at the same time: two
        watts in safe mode, four in nominal mode, eight during imaging, ten during a downlink
        and three and a half in eclipse. When each mode is weighted by its share of the orbit,
        the orbit-average power is four point six three watts. The solar array must provide this
        on average, and the battery must supply the eclipse load.
      fr: >-
        La puissance est budgétée mode par mode, car tous les équipements ne fonctionnent pas en
        même temps : deux watts en mode sûr, quatre en mode nominal, huit pendant la prise de
        vue, dix pendant une transmission et trois et demi en éclipse. Lorsque chaque mode est
        pondéré par sa part de l’orbite, la puissance moyenne sur l’orbite est de quatre virgule
        six trois watts. Le générateur solaire doit fournir cette puissance en moyenne, et la
        batterie doit assurer la charge pendant l’éclipse.
    do:
      - js: "EX.play('power', ${say})"
    question:
      type: reflect
      text:
        en: "Find one cell of your team's N-squared matrix where the two sides could disagree. What would you compare, and who owns the decision?"
        fr: "Trouvez une case de la matrice N carré de votre équipe où les deux côtés pourraient être en désaccord. Que compareriez-vous, et à qui revient la décision ?"
