# Concept explainer — the life of a telecommand and its service 1 reports:
# accepted, started, completed, or refused, and why a completion is still not
# the card's check. Animated page video/explainers/tc-life.html (served by
# `stack up viz`). Team audience: every seat sends commands and reads S1.
# Avoids the WB-5.4-Q categories (no limits/SID or pass-timing questions).
id: V-CON-06
week: 4
audience: all
title:
  en: "The life of a telecommand, from acceptance to completion"
  fr: "La vie d’une télécommande, de l’acceptation à l’exécution"
summary:
  en: "This video describes what happens between sending a telecommand and checking its result on the procedure card. It covers the acceptance checks on board, the reports returned by service one (accepted, started, completed, or rejected with a failure notice), commands that take time to execute, and why a completed command must still be confirmed in telemetry."
  fr: "Cette vidéo décrit ce qui se passe entre l’envoi d’une télécommande et la vérification de son résultat sur la fiche de procédure. Elle traite des contrôles d’acceptation à bord, des rapports renvoyés par le service un (acceptée, démarrée, terminée, ou rejetée avec un motif), des commandes dont l’exécution prend du temps, et de la raison pour laquelle une commande terminée doit encore être confirmée en télémesure."
apps:
  viz: default
fresh_stack: viz
ties: {}
sources:
  - sim/docs/PUS_SERVICE_REFERENCE.md (Service 1; failure reports and the failure notice)
  - sim/packages/smo-simulator/src/smo_simulator/engine.py (_dispatch_tc, deferred completion)
  - design/docs/oer/chapters/17_ground_segment.md (§ 17.3)

setup:
  - goto: {app: viz, path: "/video/explainers/tc-life.html?lang={lang}", settle: 1.5}

steps:
  - id: send
    title: {en: "Sending the command", fr: "L’envoi de la commande"}
    say:
      en: >-
        When the operator presses Send on the command page, the telecommand, or TC, is
        transmitted as a single packet on the uplink. In this example it is a request to change
        the telemetry rate, service eight, function sixty-five. The spacecraft then responds
        through service one, request verification, of the packet utilisation standard, PUS. The
        row at the bottom is the verification row that appears on the console for every command
        sent.
      fr: >-
        Lorsque l’opérateur appuie sur Envoyer dans la page de commande, la télécommande, ou TC,
        est transmise en un seul paquet sur la liaison montante. Dans cet exemple, il s’agit
        d’une demande de changement du débit de télémesure, service huit, fonction
        soixante-cinq. Le satellite répond ensuite par le service un, vérification des requêtes,
        de la norme d’utilisation des paquets, PUS. La ligne du bas est la ligne de vérification
        qui s’affiche sur la console pour chaque commande envoyée.
    do:
      - js: "EX.play('send', ${say})"

  - id: accept
    title: {en: "Acceptance: four checks", fr: "Acceptation : quatre contrôles"}
    say:
      en: >-
        Before anything is executed, the on-board computer checks the packet. It verifies that
        the command is permitted by the software currently running, whether the bootloader or
        the application; that the data bus can reach the target unit; that the service, subtype
        and length are valid; and that the target unit is powered. All four checks pass, so the
        spacecraft returns telemetry, TM, one comma one, acceptance success. Acceptance means
        only that the command has been admitted; it has not yet been executed.
      fr: >-
        Avant toute exécution, l’ordinateur de bord contrôle le paquet. Il vérifie que la
        commande est autorisée par le logiciel en cours d’exécution, chargeur d’amorçage ou
        application ; que le bus de données peut atteindre l’unité cible ; que le service, le
        sous-type et la longueur sont valides ; et que l’unité cible est alimentée. Les quatre
        contrôles réussissent : le satellite renvoie donc la télémesure, TM, un virgule un,
        acceptation réussie. L’acceptation signifie seulement que la commande a été admise ;
        elle n’a pas encore été exécutée.
    do:
      - js: "EX.play('accept', ${say})"

  - id: reject
    title: {en: "Acceptance failure: report 1,2", fr: "Échec d’acceptation : rapport 1,2"}
    say:
      en: >-
        If a check fails, the response is one comma two, acceptance failure, with a failure
        code. In this case the target unit is not powered, which gives code four. Since nothing
        has been executed, no start or completion report will follow, and the operator should
        not wait for one. The cause is corrected, here by powering the line, and the command is
        sent again.
      fr: >-
        Si un contrôle échoue, la réponse est un virgule deux, échec d’acceptation, avec un code
        d’échec. Ici, l’unité cible n’est pas alimentée, ce qui donne le code quatre. Comme rien
        n’a été exécuté, aucun rapport de démarrage ou de fin ne suivra, et l’opérateur ne doit
        pas en attendre. On corrige la cause, ici en alimentant la ligne, puis on renvoie la
        commande.
    do:
      - js: "EX.play('reject', ${say})"
    question:
      type: multichoice
      text:
        en: "Your command comes back TM(1,2) with code 0x0004. What do you expect next?"
        fr: "Votre commande revient en TM(1,2) avec le code 0x0004. À quoi vous attendez-vous ensuite ?"
      options:
        - text: {en: "Nothing more for this command: it never ran. Find out why the unit is unpowered before sending again.", fr: "Plus rien pour cette commande : elle ne s’est jamais exécutée. Trouvez pourquoi l’unité n’est pas alimentée avant de renvoyer."}
          correct: true
          why: {en: "A refusal at acceptance ends the command: no 1,3 and no 1,7.", fr: "Un refus à l’acceptation clôt la commande : ni 1,3 ni 1,7."}
        - text: {en: "A TM(1,7) once the unit warms up.", fr: "Un TM(1,7) une fois l’unité en température."}
          why: {en: "Nothing is queued: the spacecraft dropped the command.", fr: "Rien n’est mis en attente : le satellite a abandonné la commande."}
        - text: {en: "A TM(1,3) when the next pass starts.", fr: "Un TM(1,3) au début du prochain passage."}
          why: {en: "Refused commands are not stored for later.", fr: "Les commandes refusées ne sont pas gardées pour plus tard."}

  - id: execute
    title: {en: "Started, then completed: 1,3 and 1,7", fr: "Démarrée, puis terminée : 1,3 et 1,7"}
    say:
      en: >-
        An accepted command starts immediately, and the report one comma three, execution
        started, is returned. A rate change is fast, so one comma seven, execution completed,
        follows straight away, and the three verification stages are shown in green. The last
        field, verified in telemetry, is not filled by any report. It corresponds to the check
        in the procedure, carried out on a telemetry parameter, and it remains the operator's
        responsibility.
      fr: >-
        Une commande acceptée démarre immédiatement, et le rapport un virgule trois, exécution
        démarrée, est renvoyé. Un changement de débit est rapide : un virgule sept, exécution
        terminée, suit donc aussitôt, et les trois étapes de vérification s’affichent en vert.
        La dernière case, vérifiée en télémesure, n’est remplie par aucun rapport. Elle
        correspond à la vérification prévue par la procédure, effectuée sur un paramètre de
        télémesure, et elle reste de la responsabilité de l’opérateur.
    do:
      - js: "EX.play('execute', ${say})"

  - id: fail
    title: {en: "Execution failure and its failure notice", fr: "Échec d’exécution et son motif"}
    say:
      en: >-
        In the next example, the HIGH rate is requested while the transmitter is not in downlink
        mode. The command is accepted and started, but then fails with one comma eight, code
        seven. Several different conditions share code seven, so the code alone does not
        identify which one caused the failure. EOSAT-1 therefore adds a failure notice, a text
        message from the on-board software, which here states that HIGH requires downlink mode.
        The notice, rather than the code, identifies the cause.
      fr: >-
        Dans l’exemple suivant, le débit HIGH est demandé alors que l’émetteur n’est pas en mode
        liaison descendante. La commande est acceptée et démarrée, puis échoue avec un virgule
        huit, code sept. Plusieurs conditions différentes partagent le code sept : le code seul
        ne permet donc pas de savoir laquelle a provoqué l’échec. EOSAT-1 ajoute un avis
        d’échec, un message en clair du logiciel de bord, qui indique ici que le débit HIGH
        exige le mode liaison descendante. C’est l’avis, et non le code, qui identifie la cause.
    do:
      - js: "EX.play('fail', ${say})"

  - id: deferred
    title: {en: "Commands that take time", fr: "Les commandes qui prennent du temps"}
    say:
      en: >-
        Some commands start an action that takes time to complete. Booting the application
        software includes a ten-second image check, deploying the solar arrays takes about
        thirty seconds, and a gyroscope calibration arc lasts five minutes. For these commands,
        one comma three is returned immediately, but one comma seven is held until the action is
        complete. An amber row that has not yet completed does not indicate a fault. The
        operator waits for completion, and must not send the next command while a boot is in
        progress.
      fr: >-
        Certaines commandes lancent une action qui prend du temps. Le démarrage du logiciel
        applicatif comprend une vérification de l’image de dix secondes, le déploiement des
        panneaux solaires prend environ trente secondes et un arc d’étalonnage des gyromètres
        dure cinq minutes. Pour ces commandes, un virgule trois est renvoyé immédiatement, mais
        un virgule sept n’arrive qu’à la fin de l’action. Une ligne orange non terminée
        n’indique pas une panne. L’opérateur attend la fin de l’action et ne doit pas envoyer la
        commande suivante pendant un démarrage.
    do:
      - js: "EX.play('deferred', ${say})"
    question:
      type: truefalse
      answer: false
      text:
        en: "OBC_BOOT_APP shows 1,1 and 1,3 but no 1,7 after five seconds, so the boot has failed and you should send it again."
        fr: "OBC_BOOT_APP affiche 1,1 et 1,3 mais pas de 1,7 au bout de cinq secondes : le démarrage a échoué et il faut le renvoyer."

  - id: verify
    title: {en: "Verifying the result in telemetry", fr: "Vérifier le résultat en télémesure"}
    say:
      en: >-
        The final example shows why telemetry verification is required. The operator commands
        DETUMBLE, the report one comma seven is received, and the mode reads DETUMBLE, so the
        command has done what was requested. However, if the magnetometer is off, the measured
        field is zero and the control law has no effect. For this reason the procedure checks
        the magnetic field rather than the report. Acceptance means that the command was
        admitted, and completion means that it was executed; only telemetry confirms that the
        spacecraft is behaving as intended.
      fr: >-
        Le dernier exemple montre pourquoi la vérification en télémesure est nécessaire.
        L’opérateur commande DETUMBLE, le rapport un virgule sept est reçu et le mode indique
        DETUMBLE : la commande a donc fait ce qui était demandé. Cependant, si le magnétomètre
        est éteint, le champ mesuré est nul et la loi de commande n’a aucun effet. C’est
        pourquoi la procédure vérifie le champ magnétique plutôt que le rapport. L’acceptation
        signifie que la commande a été admise, et la fin d’exécution qu’elle a été exécutée ;
        seule la télémesure confirme que le satellite se comporte comme prévu.
    do:
      - js: "EX.play('verify', ${say})"
    question:
      type: reflect
      text:
        en: "Pick one step on your next card. Which report tells you the command ran, and which telemetry value tells you it worked?"
        fr: "Choisissez une étape de votre prochaine fiche. Quel rapport vous dit que la commande s’est exécutée, et quelle valeur de télémesure vous dit qu’elle a marché ?"
