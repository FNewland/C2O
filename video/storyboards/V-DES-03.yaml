# Design concept — from need to concept of operations: the problem statement,
# WHAT before HOW, the measure chain from need to TPM, a trade study with its
# sensitivity, and the ConOps (modes, duty cycle, orbit-average power, data
# balance). Animated page video/explainers/needs.html. Whole design team.
# Trade numbers are illustrative: buy-the-data wins 0.79 to 0.52; training
# would need a 31 % weight (0.4 / 1.3) before the own-CubeSat option wins.
id: V-DES-03
week: 1
audience: all
title:
  en: "From need to concept of operations"
  fr: "Du besoin au concept d’opérations"
summary:
  en: "Start from the problem, not the spacecraft: a good problem statement, what versus how, the chain from stakeholder need to tracked design parameter, a trade study and its sensitivity, and the concept of operations that sizes power and data."
  fr: "Partir du problème, pas du satellite : un bon énoncé de problème, le quoi et le comment, la chaîne du besoin au paramètre suivi, une étude de compromis et sa sensibilité, et le concept d’opérations qui dimensionne l’énergie et les données."
apps:
  viz: default
fresh_stack: viz
ties: {}
sources:
  - design/docs/oer/chapters/04_mission_needs_conops.md (§ 4.1, 4.3, 4.5, 4.6, 4.8)

setup:
  - goto: {app: viz, path: "/video/explainers/needs.html?lang={lang}", settle: 1.5}
  - cursor: hide

steps:
  - id: problem
    title: {en: "Start from the problem", fr: "Partir du problème"}
    say:
      en: >-
        One of the most common failures in mission design is solving the wrong problem. A
        statement such as "we need a six-unit CubeSat at five hundred kilometres" is not a
        problem statement but a solution. A problem statement answers four questions: what is
        missing, who is affected, what the consequences are for them, and which constraints
        apply, such as budget and schedule.
      fr: >-
        L’une des erreurs les plus courantes en conception de mission consiste à résoudre le
        mauvais problème. Une phrase comme « il nous faut un CubeSat six unités à cinq cents
        kilomètres » n’est pas un énoncé de problème, mais une solution. Un énoncé de problème
        répond à quatre questions : ce qui manque, qui est touché, quelles en sont les
        conséquences pour ces personnes et quelles contraintes s’appliquent, comme le budget et
        le calendrier.
    do:
      - js: "EX.play('problem', ${say})"

  - id: whathow
    title: {en: "What before how", fr: "Le quoi avant le comment"}
    say:
      en: >-
        At this stage the team records what is needed, not how it will be achieved: ten-metre
        imagery rather than a fifteen-centimetre telescope, and a five-day revisit rather than a
        twelve-satellite constellation. The solution-level choices are not wrong, but they
        belong to Phases A and B. Fixing them too early rules out options that might serve the
        users better, such as purchasing existing data.
      fr: >-
        À ce stade, l’équipe consigne ce qui est nécessaire, et non la façon de l’obtenir : une
        imagerie à dix mètres plutôt qu’un télescope de quinze centimètres, et une revisite de
        cinq jours plutôt qu’une constellation de douze satellites. Les choix de solution ne
        sont pas erronés, mais ils relèvent des phases A et B. Les figer trop tôt écarte des
        options qui pourraient mieux servir les utilisateurs, comme l’achat de données
        existantes.
    do:
      - js: "EX.play('whathow', ${say})"

  - id: chain
    title: {en: "From need to tracked parameter", fr: "Du besoin au paramètre suivi"}
    say:
      en: >-
        A chain of measures connects the need to the design. The users assess a measure of
        effectiveness, here the proportion of crop assessments delivered on time. This leads to
        a mission objective and to a measure of performance that the systems engineer can
        verify: a ground sample distance, or GSD, of ten metres or better. That measure becomes
        a requirement, and the design team then tracks a technical performance measure, such as
        the mass of the imager against its allocation, in every phase.
      fr: >-
        Une chaîne de mesures relie le besoin à la conception. Les utilisateurs évaluent une
        mesure d’efficacité, ici la proportion de bilans de cultures livrés à temps. On en
        déduit un objectif de mission et une mesure de performance que l’ingénieur système peut
        vérifier : une distance d’échantillonnage au sol, ou GSD, de dix mètres ou mieux. Cette
        mesure devient une exigence, et l’équipe de conception suit ensuite une mesure de
        performance technique, comme la masse de l’imageur par rapport à son allocation, à
        chaque phase.
    do:
      - js: "EX.play('chain', ${say})"

  - id: trade
    title: {en: "A trade study", fr: "Une étude de compromis"}
    say:
      en: >-
        Choices between options are made through a trade study, which defines the decision, at
        least three genuine alternatives, the evaluation criteria, weights that sum to one, and
        the scores. In this example, the weighted scores favour buying commercial imagery, well
        ahead of a dedicated CubeSat or an aerial survey. This is the most important trade of
        all, because it asks whether the need requires a space mission at all.
      fr: >-
        Le choix entre plusieurs options se fait au moyen d’une étude de compromis, qui définit
        la décision, au moins trois options réelles, les critères d’évaluation, des poids dont
        la somme vaut un, et les notes. Dans cet exemple, les scores pondérés favorisent l’achat
        d’images commerciales, nettement devant un CubeSat dédié ou un relevé aérien. C’est le
        compromis le plus important, car il pose la question de savoir si le besoin exige
        réellement une mission spatiale.
    do:
      - js: "EX.play('trade', ${say})"
    question:
      type: multichoice
      text:
        en: "Why must a trade study's weights be agreed before the alternatives are scored?"
        fr: "Pourquoi faut-il fixer les poids d’une étude de compromis avant de noter les options ?"
      options:
        - text: {en: "Weights set after seeing the scores tend to be bent toward the option someone already prefers.", fr: "Des poids fixés après avoir vu les notes ont tendance à favoriser l’option que quelqu’un préfère déjà."}
          correct: true
          why: {en: "The weights say what matters; set late, they quietly decide the answer.", fr: "Les poids disent ce qui compte ; fixés trop tard, ils décident discrètement de la réponse."}
        - text: {en: "The scores cannot be normalised until the weights exist.", fr: "On ne peut pas normaliser les notes tant que les poids n’existent pas."}
          why: {en: "Scores are normalised per criterion, independently of the weights.", fr: "Les notes se normalisent par critère, indépendamment des poids."}
        - text: {en: "It makes the weights add up to one.", fr: "Cela garantit que la somme des poids fait un."}
          why: {en: "Normalising does that, whenever the weights are set.", fr: "C’est la normalisation qui le garantit, quel que soit le moment."}

  - id: sensitivity
    title: {en: "Is the answer robust?", fr: "La réponse est-elle robuste ?"}
    say:
      en: >-
        The robustness of the result is then tested. As the weight given to training value is
        increased, the totals change, and the dedicated CubeSat becomes the preferred option
        only when training accounts for about thirty-one percent of the total weight. If the
        sponsor's real objective is to train engineers, this should be stated explicitly, and
        the weights agreed before the scores are seen.
      fr: >-
        On évalue ensuite la robustesse du résultat. Lorsque le poids attribué à la valeur de
        formation augmente, les totaux évoluent, et le CubeSat dédié ne devient l’option
        préférée que lorsque la formation représente environ trente et un pour cent du poids
        total. Si l’objectif réel du commanditaire est de former des ingénieurs, il faut
        l’indiquer explicitement et fixer les poids avant que les notes ne soient connues.
    do:
      - js: "EX.play('sensitivity', ${say})"

  - id: conops
    title: {en: "The concept of operations", fr: "Le concept d’opérations"}
    say:
      en: >-
        The concept of operations, or ConOps, describes how the mission will operate: its
        phases, its modes and the flow of data. A safe mode, Sun-pointing at minimum load,
        provides the baseline, and imaging and downlink add load to it. When one orbit is laid
        out with the duty cycle of each mode, the orbit-average power, here about five watts,
        sizes the solar array, and the thirty-five-minute eclipse sizes the battery. The same
        principle applies to data: the daily downlink capacity must cover the data collected
        each day.
      fr: >-
        Le concept d’opérations, ou ConOps, décrit le fonctionnement de la mission : ses phases,
        ses modes et le parcours des données. Un mode sûr, pointé vers le Soleil à charge
        minimale, constitue la référence, et la prise de vue et la transmission s’y ajoutent.
        Lorsqu’on déroule une orbite avec le cycle de service de chaque mode, la puissance
        moyenne sur l’orbite, ici environ cinq watts, dimensionne le générateur solaire, et
        l’éclipse de trente-cinq minutes dimensionne la batterie. Le même principe s’applique
        aux données : la capacité de transmission quotidienne doit couvrir les données
        collectées chaque jour.
    do:
      - js: "EX.play('conops', ${say})"
    question:
      type: reflect
      text:
        en: "Write your mission's problem statement in four lines: what is missing, who is affected, what it costs them, and what limits apply."
        fr: "Rédigez l’énoncé de problème de votre mission en quatre lignes : ce qui manque, qui est touché, ce que cela leur coûte, et quelles limites s’appliquent."
