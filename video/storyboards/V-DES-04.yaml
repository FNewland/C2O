# Design concept — writing requirements: anatomy of a shall statement, the
# requirement types, SMART and the implementation trap, splitting compound
# requirements, traceability up/down/across, and verification methods.
# Animated page video/explainers/requirements.html. Whole design team.
id: V-DES-04
week: 4
audience: all
title:
  en: "Writing requirements"
  fr: "Rédiger des exigences"
summary:
  en: "How to write a requirement that can be verified: the shall statement, the five types, the SMART screen and the implementation trap, splitting compound requirements, traceability, and choosing a verification method."
  fr: "Comment rédiger une exigence vérifiable : l’énoncé avec « doit », les cinq types, le filtre SMART et le piège de la mise en œuvre, la scission des exigences composées, la traçabilité, et le choix d’une méthode de vérification."
apps:
  viz: default
fresh_stack: viz
ties: {}
sources:
  - design/docs/oer/chapters/05_requirements.md (§ 5.2–5.5)

setup:
  - goto: {app: viz, path: "/video/explainers/requirements.html?lang={lang}", settle: 1.5}
  - cursor: hide

steps:
  - id: shall
    title: {en: "Anatomy of a requirement", fr: "Anatomie d’une exigence"}
    say:
      en: >-
        A requirement is a formal, verifiable statement of what the system must do or how well
        it must do it. It identifies the subject, uses the word shall, gives a measurable
        threshold with a value and a unit, and states the conditions. For example: the payload
        shall achieve a ground sample distance, or GSD, of ten metres or better, at nadir, from
        the operational orbit. Shall denotes a binding requirement, should denotes a goal, and
        will denotes a statement of fact.
      fr: >-
        Une exigence est un énoncé formel et vérifiable de ce que le système doit faire ou du
        niveau de performance attendu. Elle désigne le sujet, emploie le verbe devoir, donne un
        seuil mesurable avec une valeur et une unité, et précise les conditions. Par exemple :
        la charge utile doit atteindre une distance d’échantillonnage au sol, ou GSD, de dix
        mètres ou mieux, au nadir, depuis l’orbite opérationnelle. « Doit » exprime une
        obligation, « devrait » un objectif et « va » un simple constat.
    do:
      - js: "EX.play('shall', ${say})"

  - id: types
    title: {en: "Five kinds of requirement", fr: "Cinq types d’exigences"}
    say:
      en: >-
        There are five types of requirement. Functional requirements state what the system does,
        and performance requirements state how well it does it. Interface requirements define
        the agreements at a boundary, such as a regulated bus voltage. Constraints are limits
        imposed from outside, such as the total mass, and environmental requirements state what
        the system must withstand, such as launch loads. Interface requirements are the one case
        where a specific value is appropriate, because both parties have agreed to it.
      fr: >-
        Il existe cinq types d’exigences. Les exigences fonctionnelles indiquent ce que fait le
        système, et les exigences de performance, à quel niveau il le fait. Les exigences
        d’interface définissent les accords à une frontière, comme la tension d’un bus régulé.
        Les contraintes sont des limites imposées de l’extérieur, comme la masse totale, et les
        exigences d’environnement indiquent ce à quoi le système doit résister, comme les
        charges au lancement. Les exigences d’interface sont le seul cas où une valeur précise
        est appropriée, car les deux parties l’ont acceptée.
    do:
      - js: "EX.play('types', ${say})"

  - id: smart
    title: {en: "The SMART criteria", fr: "Les critères SMART"}
    say:
      en: >-
        A useful first check is SMART: specific, measurable, achievable, relevant and traceable.
        A common error is a requirement such as: the spacecraft shall use triple-junction
        gallium arsenide cells. This specifies a technology, which is a design choice. The
        requirement should instead state the purpose of the cells, for example: the power
        subsystem shall generate at least fifteen watts at end of life from no more than half a
        square metre of array.
      fr: >-
        Un premier contrôle utile est SMART : spécifique, mesurable, atteignable, pertinente et
        traçable. Une erreur fréquente est une exigence telle que : le satellite doit utiliser
        des cellules à l’arséniure de gallium à triple jonction. Elle impose une technologie, ce
        qui relève d’un choix de conception. L’exigence doit plutôt exprimer la fonction des
        cellules, par exemple : le sous-système énergie doit produire au moins quinze watts en
        fin de vie, avec au plus un demi-mètre carré de panneaux.
    do:
      - js: "EX.play('smart', ${say})"
    question:
      type: multichoice
      text:
        en: "Which is a requirement rather than a design choice?"
        fr: "Lequel est une exigence plutôt qu’un choix de conception ?"
      options:
        - text: {en: "The TT&C system shall receive commands with a bit error rate of 10⁻⁶ or better.", fr: "Le TT&C doit recevoir les télécommandes avec un taux d’erreur binaire de 10⁻⁶ ou mieux."}
          correct: true
          why: {en: "It states how well, with a number, and leaves the protocol and radio open.", fr: "Elle dit à quel niveau, avec un nombre, et laisse le protocole et la radio ouverts."}
        - text: {en: "The spacecraft shall use the AX.25 protocol.", fr: "Le satellite doit utiliser le protocole AX.25."}
          why: {en: "That prescribes an implementation.", fr: "Cela impose une mise en œuvre."}
        - text: {en: "The spacecraft shall be a 3U CubeSat.", fr: "Le satellite doit être un CubeSat 3U."}
          why: {en: "That prescribes a form factor; require the mass and the deployer envelope instead.", fr: "Cela impose un format ; exigez plutôt la masse et l’enveloppe du déployeur."}

  - id: split
    title: {en: "One concern per requirement", fr: "Un sujet par exigence"}
    say:
      en: >-
        The word and often indicates a compound requirement. The statement that the system shall
        provide ten-metre imagery with a five-day revisit and twenty-four-hour latency contains
        three requirements. If it is not met, it is unclear which part has failed. It should be
        split into three requirements, each with its own identifier, so that each can be
        verified independently and the team knows exactly what needs to be corrected.
      fr: >-
        Le mot « et » signale souvent une exigence composée. L’énoncé selon lequel le système
        doit fournir une imagerie à dix mètres avec une revisite de cinq jours et une latence de
        vingt-quatre heures contient trois exigences. S’il n’est pas satisfait, on ne sait pas
        quelle partie est en défaut. Il faut le scinder en trois exigences, chacune avec son
        identifiant, afin que chacune puisse être vérifiée indépendamment et que l’équipe sache
        exactement ce qu’il faut corriger.
    do:
      - js: "EX.play('split', ${say})"

  - id: trace
    title: {en: "Traceability", fr: "La traçabilité"}
    say:
      en: >-
        Requirements form a hierarchy: the need, followed by mission, system, subsystem and
        component requirements. Each requirement is traced in three directions: upwards to its
        parent, which explains why it exists; downwards to its children, which shows how it is
        decomposed; and across to a verification method, which shows how compliance will be
        demonstrated. The traceability matrix records all three, and the objective is complete
        coverage.
      fr: >-
        Les exigences forment une hiérarchie : le besoin, puis les exigences de mission,
        système, sous-système et composant. Chaque exigence est tracée dans trois directions :
        vers le haut, vers son parent, qui explique sa raison d’être ; vers le bas, vers ses
        enfants, qui montrent sa décomposition ; et latéralement, vers une méthode de
        vérification, qui montre comment la conformité sera démontrée. La matrice de traçabilité
        consigne les trois, et l’objectif est une couverture complète.
    do:
      - js: "EX.play('trace', ${say})"

  - id: verify
    title: {en: "How it will be verified", fr: "Comment la vérifier"}
    say:
      en: >-
        There are four principal verification methods, analysis, test, inspection and review of
        design, together with demonstration. Mass is verified by weighing the spacecraft.
        Pointing is simulated and then confirmed on a test bench. Link margin is verified by
        analysis, since a full test would require the satellite to be in orbit. Launch loads
        require a vibration test, data latency is demonstrated in an end-to-end rehearsal, and a
        redundant power path is confirmed by review of the schematics.
      fr: >-
        Il existe quatre méthodes de vérification principales, l’analyse, l’essai, l’inspection
        et la revue de conception, auxquelles s’ajoute la démonstration. La masse se vérifie en
        pesant le satellite. Le pointage est simulé, puis confirmé sur un banc d’essai. La marge
        de liaison se vérifie par analyse, car un essai complet exigerait que le satellite soit
        en orbite. Les charges au lancement exigent un essai de vibration, la latence des
        données se démontre lors d’une répétition de bout en bout et un chemin d’alimentation
        redondant se confirme par la revue des schémas.
    do:
      - js: "EX.play('verify', ${say})"
    question:
      type: reflect
      text:
        en: "Take one of your team's requirements. Name its parent, one child, and the verification method you would assign, and why."
        fr: "Prenez une exigence de votre équipe. Nommez son parent, un enfant, et la méthode de vérification que vous lui attribueriez, et pourquoi."
