# Design concept — the systems engineering process: why sequential design fails
# late, the V and traceability, the ECSS phases and their review gates, the
# system margin released phase by phase (textbook Table 8.3, now also
# SpaceCDF's ladder), and concurrent design on one shared model.
# Animated page video/explainers/seprocess.html. Whole design team.
id: V-DES-02
week: 1
audience: all
title:
  en: "The systems engineering process"
  fr: "Le processus d’ingénierie système"
summary:
  en: "How a space mission is engineered: why late problems cost the most, the V and its traceability, the lifecycle phases and their review gates, why margins shrink as a design matures, and how concurrent design puts every discipline on one shared model."
  fr: "Comment on conçoit une mission spatiale : pourquoi les problèmes tardifs coûtent le plus, le V et sa traçabilité, les phases du cycle de vie et leurs revues, pourquoi les marges diminuent à mesure que la conception mûrit, et comment la conception concourante réunit toutes les disciplines sur un seul modèle partagé."
apps:
  viz: default
fresh_stack: viz
ties: {}
sources:
  - design/docs/oer/chapters/01_concurrent_design.md (§ 1.1–1.5)
  - design/docs/oer/chapters/08_architecture_interfaces_budgets.md (§ 8.4.2, Table 8.3)
  - design/configs/margin_policy.yaml (system_margin_ladder)

setup:
  - goto: {app: viz, path: "/video/explainers/seprocess.html?lang={lang}", settle: 1.5}

steps:
  - id: sequential
    title: {en: "Why late is expensive", fr: "Pourquoi tard coûte cher"}
    say:
      en: >-
        For several decades, spacecraft were designed one discipline at a time: the payload team
        completed its work and passed it to the power team, then to attitude control, then to
        communications, and so on. Each handover concealed assumptions. Problems emerged late,
        during integration or at a review, and the cost of correcting an error increases by
        roughly a factor of ten in each phase it passes through undetected. An error discovered
        in orbit can cost a thousand times more than it would have cost at the concept stage.
      fr: >-
        Pendant plusieurs décennies, les satellites ont été conçus une discipline après l’autre
        : l’équipe de la charge utile terminait son travail et le transmettait à l’équipe
        énergie, puis au contrôle d’attitude, puis aux télécommunications, et ainsi de suite.
        Chaque transmission dissimulait des hypothèses. Les problèmes apparaissaient tard,
        pendant l’intégration ou lors d’une revue, et le coût de correction d’une erreur est
        multiplié environ par dix à chaque phase qu’elle traverse sans être détectée. Une erreur
        découverte en orbite peut coûter mille fois plus qu’au stade du concept.
    do:
      - js: "EX.play('sequential', ${say})"

  - id: vee
    title: {en: "The V and traceability", fr: "Le V et la traçabilité"}
    say:
      en: >-
        Systems engineering organises the work in the form of a V. The left side of the V is
        decomposition: the mission need, then the requirements, the architecture, the subsystems
        and the components. The right side is integration and verification, at the same levels
        in reverse order. The V is a map rather than a timeline, since each level on the left
        has a corresponding verification on the right. Each requirement specifies how it will be
        verified, whether by analysis, test, inspection or review, and this pairing is known as
        traceability.
      fr: >-
        L’ingénierie système organise le travail sous la forme d’un V. La branche gauche du V
        correspond à la décomposition : le besoin de mission, puis les exigences,
        l’architecture, les sous-systèmes et les composants. La branche droite correspond à
        l’intégration et à la vérification, aux mêmes niveaux, dans l’ordre inverse. Le V est
        une carte plutôt qu’un calendrier, car chaque niveau de gauche a sa vérification
        correspondante à droite. Chaque exigence précise comment elle sera vérifiée, par
        analyse, essai, inspection ou revue, et ce couplage s’appelle la traçabilité.
    do:
      - js: "EX.play('vee', ${say})"
    question:
      type: multichoice
      text:
        en: "A requirement says the battery shall hold 120 Wh at end of life. What must it have before the design can be called traceable?"
        fr: "Une exigence dit que la batterie doit contenir 120 Wh en fin de vie. Que lui faut-il pour que la conception soit dite traçable ?"
      options:
        - text: {en: "A verification method, and the activity on the right of the V that will carry it out.", fr: "Une méthode de vérification, et l’activité à droite du V qui la réalisera."}
          correct: true
          why: {en: "Traceability pairs each requirement with how and where it will be verified.", fr: "La traçabilité associe chaque exigence à la façon et à l’endroit où elle sera vérifiée."}
        - text: {en: "A supplier for the battery.", fr: "Un fournisseur pour la batterie."}
          why: {en: "A supplier is a design choice, not the verification of the requirement.", fr: "Un fournisseur est un choix de conception, pas la vérification de l’exigence."}
        - text: {en: "A launch date.", fr: "Une date de lancement."}
          why: {en: "Schedule is managed separately from traceability.", fr: "Le calendrier se gère à part de la traçabilité."}

  - id: phases
    title: {en: "Phases and review gates", fr: "Phases et revues"}
    say:
      en: >-
        Over time, a mission progresses through a series of phases. In the standards of the
        European Cooperation for Space Standardization, or ECSS, Phase zero defines the need,
        Phase A assesses feasibility, Phases B and C define the design in increasing detail,
        Phase D covers manufacture and qualification, Phase E is operations and Phase F is
        disposal. Each phase ends at a review, such as the mission definition review, or MDR,
        the preliminary design review, or PDR, and the critical design review, or CDR. At each
        review, a board decides whether the project may proceed.
      fr: >-
        Au fil du temps, une mission franchit une série de phases. Dans les normes de la
        Coopération européenne pour la normalisation spatiale, l’ECSS, la phase zéro définit le
        besoin, la phase A évalue la faisabilité, les phases B et C définissent la conception de
        façon de plus en plus détaillée, la phase D couvre la fabrication et la qualification,
        la phase E l’exploitation et la phase F le retrait de service. Chaque phase se termine
        par une revue, comme la revue de définition de la mission, la MDR, la revue de
        conception préliminaire, la PDR, et la revue critique de conception, la CDR. À chaque
        revue, un comité décide si le projet peut se poursuivre.
    do:
      - js: "EX.play('phases', ${say})"

  - id: margins
    title: {en: "Margins shrink as the design matures", fr: "Les marges diminuent quand la conception mûrit"}
    say:
      en: >-
        In the early phases, masses and power consumption are not known accurately, so the team
        holds a system margin in addition to every estimate: twenty percent in the first phases,
        fifteen percent in Phase B, ten percent at the critical design review and five percent
        during production. As the design matures and estimates are replaced by measurements, the
        margin is released. A budget that closes only by using the margin intended for the next
        phase should be treated as a warning, not as a pass.
      fr: >-
        Dans les premières phases, les masses et les puissances ne sont pas connues avec
        précision : l’équipe conserve donc une marge système en plus de chaque estimation, vingt
        pour cent dans les premières phases, quinze pour cent en phase B, dix pour cent à la
        revue critique de conception et cinq pour cent pendant la production. À mesure que la
        conception mûrit et que les mesures remplacent les estimations, la marge est libérée. Un
        bilan qui ne se ferme qu’en utilisant la marge prévue pour la phase suivante doit être
        considéré comme un avertissement, et non comme une réussite.
    do:
      - js: "EX.play('margins', ${say})"

  - id: concurrent
    title: {en: "Concurrent design", fr: "La conception concourante"}
    say:
      en: >-
        Concurrent design addresses the problems of the sequential approach. All disciplines
        work at the same time on a single shared model, and each parameter is owned by one
        position. When the power engineer changes the solar array, the structures engineer sees
        the effect on mass immediately, and when a budget is exceeded, the conflict is flagged
        at once and resolved by the systems engineer. This is the approach used in SpaceCDF, and
        the one each team will follow to design its mission.
      fr: >-
        La conception concourante répond aux problèmes de l’approche séquentielle. Toutes les
        disciplines travaillent en même temps sur un seul modèle partagé, et chaque paramètre
        appartient à un poste. Lorsque l’ingénieur énergie modifie le générateur solaire,
        l’ingénieur structure en voit immédiatement l’effet sur la masse, et lorsqu’un bilan est
        dépassé, le conflit est signalé aussitôt et arbitré par l’ingénieur système. C’est
        l’approche utilisée dans SpaceCDF, et celle que chaque équipe suivra pour concevoir sa
        mission.
    do:
      - js: "EX.play('concurrent', ${say})"
    question:
      type: reflect
      text:
        en: "Name one parameter your position will own in SpaceCDF, and one other position whose budget it changes."
        fr: "Nommez un paramètre que votre poste détiendra dans SpaceCDF, et un autre poste dont il modifie le bilan."
