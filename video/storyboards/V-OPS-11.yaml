# Week 5 — a complex task: no S-band telemetry at AOS, worked with CTG-019 rev 1.1
# (WB-A-CTG-019). The power amplifier was left OFF at the end of the previous pass
# (set up off camera), so the auto-TX hold-down cannot cure it: the blind HK request
# powers the ttc_tx line and nothing comes back. The UHF beacon, which keeps
# transmitting when the S-band is silent, carries ttc.pa_on = 0, and the card's
# Step 2 note sends the operator straight to Step 4 (rulings 2026-11-07).
id: V-OPS-11
week: 5
audience: all
title:
  en: "No telemetry at acquisition of signal: tracing the fault"
  fr: "Pas de télémesure à l’acquisition du signal : localiser la panne"
summary:
  en: "In this video, the pass begins but no S-band signal is received. The operator rules out the ground segment, sends a blind housekeeping request that also switches on the transmitter, reads the UHF beacon and restores the downlink using the power amplifier, following the contingency card."
  fr: "Dans cette vidéo, le passage commence mais aucun signal en bande S n’est reçu. L’opérateur écarte le segment sol, envoie en aveugle une demande de servitude qui allume aussi l’émetteur, lit la balise UHF et rétablit la liaison descendante au moyen de l’amplificateur de puissance, en suivant la fiche de contingence."
apps:
  mcs: default
fresh_stack: sim
ties:
  worksheets: [WB-A-CTG-019, WB-A-CTG-019/q1, WB-A-CTG-019/q2, WB-A-CTG-019/q4, WB-A-CTG-019/q6]
  cards: [CTG-019]
sources:
  - sim/configs/eosat1/procedures/contingency/no_telemetry_at_pass.md (CTG-019 rev 1.1)
  - sim/configs/eosat1/simulation.yaml (ttc.auto_tx_hold_s)
  - sim/configs/eosat1/telemetry/hk_structures.yaml (SID 11 beacon carries ttc.pa_on)

setup:
  - api: {app: instructor, method: POST, path: /api/command, json: {type: load_breakpoint, name: card-END}}
  - wait: 2
  - api: {app: instructor, method: POST, path: /api/command, json: {type: override_passes, enabled: false}, allow_error: true}
  # the previous pass: housekeeping, then the PA is switched off before LOS (the fault)
  - python: {call: "video/c2ovideo/helpers.py:ff_to_pass", app: instructor, kwargs: {planner: "${planner_url}", min_duration: 300, min_elevation: 5, after_aos: 15}}
  - api: {app: mcs, method: POST, path: /api/pus-command, json: {service: 3, subtype: 27, data_hex: "0001", name: HK_REQUEST, position: flight_director}}
  - wait: 4
  - api: {app: mcs, method: POST, path: /api/pus-command, json: {service: 8, subtype: 1, data_hex: "43", name: TTC_PA_OFF, position: flight_director}}
  - wait: 4
  # the pass of the video: a long one, a few seconds after AOS
  - python: {call: "video/c2ovideo/helpers.py:ff_to_pass", app: instructor, kwargs: {planner: "${planner_url}", min_duration: 540, min_elevation: 15, after_aos: 8}}
  - goto: {app: mcs, path: "/?lang={lang}&position=ttc", settle: 4}
  - js: "fetch('/api/logbook', {method: 'DELETE', credentials: 'same-origin'})"
  - reload: 5

steps:
  - id: silent
    title: {en: "No signal at acquisition", fr: "Aucun signal à l’acquisition"}
    say:
      en: >-
        This is acquisition of signal, the start of a pass. The overview should now be updating
        with new housekeeping data, but it is not: the subsystem blocks are stale, and their
        last values are an orbit old. The status strip reports that data is late. A signal is
        reaching the ground, but it is not the S-band telemetry. This situation is covered by
        the contingency procedure CTG-019, no telemetry at pass start, which is led by the TT&C
        operator.
      fr: >-
        Nous sommes à l’acquisition du signal, au début d’un passage. La vue d’ensemble devrait
        se mettre à jour avec de nouvelles données de servitude, mais ce n’est pas le cas : les
        blocs des sous-systèmes sont périmés et leurs dernières valeurs datent d’une orbite. Le
        bandeau d’état signale un retard. Un signal parvient au sol, mais ce n’est pas la
        télémesure en bande S. Cette situation relève de la procédure de contingence CTG-019,
        absence de télémesure en début de passage, menée par l’opérateur TT&C.
    do:
      - wait: 1.0
      - highlight: {target: {css: "#sa-see"}, seconds: 3}
      - wait: 1.0
      - highlight: {target: {css: "#ovr-power-card"}, seconds: 3, point: false}
      - click: {css: "#rail-proc"}
      - select: {target: {css: "#proc-source"}, value: ops}
      - wait: 1.0
      - select: {target: {css: "#proc-type"}, value: contingency/no_telemetry_at_pass.md}
      - wait_for: {target: {css: "#proc-doc h4"}, timeout: 20}
      - wait: 1.0

  - id: ground
    title: {en: "Step 1: rule out the ground", fr: "Étape 1 : écarter le sol"}
    say:
      en: >-
        Step one checks the ground segment. On the TT&C page, the station receiver measures a
        strong signal of about minus one hundred and nineteen dBm. The note under the key
        parameters explains that this is the ultra-high frequency, or UHF, beacon, a separate
        radio, and not the S-band. The antenna is therefore tracking and the station receive
        chain is working. The lock status next to it is stale because it is carried in the
        S-band housekeeping, which is the data that is missing. The ground segment is nominal,
        so the fault is on board.
      fr: >-
        L’étape un vérifie le segment sol. Sur la page TT&C, le récepteur de la station mesure
        un signal fort, d’environ moins cent dix-neuf dBm. La note sous les paramètres clés
        précise qu’il s’agit de la balise en ultra-haute fréquence, UHF, une radio distincte, et
        non de la bande S. L’antenne poursuit donc le satellite et la chaîne de réception de la
        station fonctionne. L’état de verrouillage, à côté, est périmé, car il est transmis dans
        les données de servitude en bande S, qui sont précisément celles qui manquent. Le
        segment sol est nominal : la panne se trouve à bord.
    do:
      - click: {css: "#rail-ttc"}
      - wait_for: {target: {css: "#ttc-stepper"}, timeout: 20}
      - wait: 1.5
      - scroll: {css: "#ttc-station-note"}
      - highlight: {target: {css: "#ttc-station-note"}, seconds: 4}
      - highlight: {target: {css: ".ds-card:has(#ttc-stepper)"}, seconds: 3}
    question:
      type: multichoice
      worksheet: WB-A-CTG-019/q1
      text:
        en: "The station measures a strong signal, but no S-band housekeeping arrives. What is the station hearing?"
        fr: "La station mesure un signal fort, mais aucune servitude en bande S n’arrive. Qu’entend la station ?"
      options:
        - text: {en: "The UHF beacon, which transmits whenever the S-band is silent.", fr: "La balise UHF, qui émet dès que la bande S se tait."}
          correct: true
          why: {en: "The key parameters say where the reading comes from. A strong beacon also tells you the ground chain works.", fr: "Les paramètres clés disent d’où vient la mesure. Une balise forte montre aussi que la chaîne sol fonctionne."}
        - text: {en: "The S-band downlink, too weak to decode.", fr: "La liaison descendante en bande S, trop faible pour être décodée."}
          why: {en: "Minus 118 dBm is a strong signal, and the note names the UHF beacon.", fr: "Moins 118 dBm est un signal fort, et la note nomme la balise UHF."}
        - text: {en: "Interference near the station.", fr: "Un brouillage près de la station."}
          why: {en: "Interference does not decode into beacon packets, and the beacon packets are arriving.", fr: "Un brouillage ne se décode pas en paquets de balise, et les paquets de balise arrivent."}

  - id: blind
    title: {en: "Step 2: the blind request", fr: "Étape 2 : la demande en aveugle"}
    say:
      en: >-
        In step two, with no telemetry available to confirm any action, the Flight Director
        authorises blind commanding, which the operator arms and then confirms. Every command is
        now marked as blind in the log. The operator sends a housekeeping request for the power
        report, structure identifier one, or SID one. Any command accepted by the spacecraft
        also switches on the transmitter power line for five minutes, through the auto-transmit
        hold-down. This single request therefore serves as the test, and the operator allows
        thirty seconds for a response.
      fr: >-
        À l’étape deux, faute de télémesure pour confirmer quoi que ce soit, le directeur de vol
        autorise la commande en aveugle, que l’opérateur arme puis confirme. Chaque commande est
        désormais marquée en aveugle dans le journal. L’opérateur envoie une demande de
        servitude pour le rapport d’énergie, identifiant de structure un, ou SID un. Toute
        commande acceptée par le satellite met aussi sous tension la ligne d’alimentation de
        l’émetteur pendant cinq minutes, grâce au maintien automatique de l’émission. Cette
        seule demande sert donc de test, et l’opérateur laisse trente secondes pour une réponse.
    do:
      - scroll: {css: "#ttc-blind-btn"}
      - click: {css: "#ttc-blind-btn"}
      - wait: 1.2
      - click: {css: "#ttc-blind-btn"}
      - wait: 1.0
      - highlight: {target: {css: "#ttc-blind-status"}, seconds: 2.5}
      - click: {css: "#rail-cmd"}
      - select: {target: {css: "#cmd-catalog"}, value: HK_REQUEST}
      - fill: {target: {css: "#cmd-fields [data-cmd-field='sid']"}, text: "1"}
      - click: {css: "#cmd-send:not(.hide), #cmd-send-crit:not(.hide)"}
      - wait: 2.5
      - highlight: {target: {css: "#cmd-verif-stepper"}, seconds: 3}

  - id: nothing
    title: {en: "No response", fr: "Aucune réponse"}
    say:
      en: >-
        The verification status stops at sent, because the acceptance and execution reports
        would be returned on the same downlink that is silent. A blind command can never be
        confirmed by its own reports. After thirty seconds the power report has not arrived, and
        the blocks are still stale. This result rules out one cause: the command has switched on
        the transmitter power line, so the power line is not the fault. If telemetry had
        returned, the operator would identify the cause from it and go to step six. Since it has
        not, the fault lies further along the chain.
      fr: >-
        L’état de vérification s’arrête à « envoyée », car les rapports d’acceptation et
        d’exécution reviendraient par la même liaison descendante, qui est muette. Une commande
        en aveugle ne peut jamais être confirmée par ses propres rapports. Au bout de trente
        secondes, le rapport d’énergie n’est pas arrivé et les blocs sont toujours périmés. Ce
        résultat écarte une cause : la commande a mis sous tension la ligne d’alimentation de
        l’émetteur, la ligne n’est donc pas en cause. Si la télémesure était revenue,
        l’opérateur en aurait déduit la cause et serait passé à l’étape six. Comme elle n’est
        pas revenue, la panne se situe plus loin dans la chaîne.
    do:
      - highlight: {target: {css: "#cmd-verif-stepper"}, seconds: 3}
      - wait: 8
      - click: {css: "#rail-ovr"}
      - wait: 1.5
      - highlight: {target: {css: "#ovr-power-card"}, seconds: 3, point: false}
      - wait: 2
    question:
      type: multichoice
      worksheet: WB-A-CTG-019/q2
      text:
        en: "The blind HK request was sent 30 s ago and no S-band telemetry has come back. What does that rule out?"
        fr: "La demande HK en aveugle est partie il y a 30 s et aucune télémesure en bande S n’est revenue. Qu’est-ce que cela écarte ?"
      options:
        - text: {en: "The transmitter's power line: the accepted command switched it on.", fr: "La ligne d’alimentation de l’émetteur : la commande acceptée l’a mise sous tension."}
          correct: true
          why: {en: "The auto-TX hold-down powers ttc_tx for 300 s on any accepted TC. A separate power-on command would add nothing.", fr: "Le maintien automatique alimente ttc_tx pendant 300 s à chaque TC acceptée. Une commande de mise sous tension séparée n’apporterait rien."}
        - text: {en: "The power amplifier.", fr: "L’amplificateur de puissance."}
          why: {en: "The hold-down powers the line, not the amplifier. That is a later step.", fr: "Le maintien alimente la ligne, pas l’amplificateur. C’est une étape suivante."}
        - text: {en: "Nothing: wait for the next pass.", fr: "Rien : attendre le passage suivant."}
          why: {en: "The card is worked in this pass, while the spacecraft can hear you.", fr: "La fiche se traite pendant ce passage, tant que le satellite vous entend."}

  - id: beacon
    title: {en: "Read the beacon", fr: "Lire la balise"}
    say:
      en: >-
        The note in step two refers to the UHF beacon. Its packet is the only one that still
        arrives when the S-band is silent, and it confirms that the on-board computer is
        running. It also carries one diagnostic: whether the power amplifier is on. On the TT&C
        page this value reads zero, so the amplifier is off. In that case the note directs the
        operator straight to step four.
      fr: >-
        La note de l’étape deux renvoie à la balise UHF. Son paquet est le seul qui arrive
        encore quand la bande S est muette, et il confirme que l’ordinateur de bord fonctionne.
        Il transporte aussi un diagnostic : l’état de l’amplificateur de puissance. Sur la page
        TT&C, cette valeur est à zéro : l’amplificateur est donc coupé. Dans ce cas, la note
        renvoie l’opérateur directement à l’étape quatre.
    do:
      - click: {css: "#rail-proc"}
      - wait_for: {target: {css: "#proc-doc h4"}, timeout: 20}
      - scroll: {target: {text: {en: "The UHF beacon (HK SID 11", fr: "La balise UHF (HK SID 11"}}}
      - highlight: {target: {text: {en: "The UHF beacon (HK SID 11", fr: "La balise UHF (HK SID 11"}}, seconds: 3.5}
      - click: {css: "#rail-ttc"}
      - wait_for: {target: {css: "#ttc-equip .eq"}, timeout: 20}
      - wait: 1.0
      - highlight: {target: {css: "#ttc-equip .eq:has-text('PA ON')"}, seconds: 4}

  - id: paon
    title: {en: "Step 4: the power amplifier", fr: "Étape 4 : l’amplificateur de puissance"}
    say:
      en: >-
        In step four, the operator sends the power amplifier on command, PA on, blind. The
        command is accepted, the amplifier switches on, and within a few seconds telemetry
        frames are received again: the status strip turns green and every block is updated. From
        this point the operator continues to send a housekeeping request every minute, because
        the hold-down lasts five minutes from the last accepted command.
      fr: >-
        À l’étape quatre, l’opérateur envoie en aveugle la commande de mise en marche de
        l’amplificateur de puissance, PA ON. La commande est acceptée, l’amplificateur démarre
        et, en quelques secondes, les trames de télémesure sont de nouveau reçues : le bandeau
        d’état passe au vert et chaque bloc se met à jour. À partir de ce moment, l’opérateur
        continue d’envoyer une demande de servitude chaque minute, car le maintien dure cinq
        minutes après la dernière commande acceptée.
    do:
      - click: {css: "#rail-cmd"}
      - select: {target: {css: "#cmd-catalog"}, value: TTC_PA_ON}
      - wait: 0.6
      - click: {css: "#cmd-send:not(.hide), #cmd-send-crit:not(.hide)"}
      - wait: 2.0
      - highlight: {target: {css: "#cmd-verif-stepper"}, seconds: 2.5}
      - wait: 3
      - highlight: {target: {css: "#sa-see"}, seconds: 3}
    question:
      type: multichoice
      worksheet: WB-A-CTG-019/q4
      text:
        en: "The beacon reads ttc.pa_on = 0. Why go straight to step 4 instead of switching transponders first?"
        fr: "La balise lit ttc.pa_on = 0. Pourquoi passer directement à l’étape 4 au lieu de basculer d’abord de transpondeur ?"
      options:
        - text: {en: "The beacon already names the cause: the amplifier is off, and the receiver hears us.", fr: "La balise nomme déjà la cause : l’amplificateur est coupé, et le récepteur nous entend."}
          correct: true
          why: {en: "A transponder switch would test a unit nothing points at, and a cold-redundant switch can leave you on a unit you cannot see.", fr: "Un basculement testerait un équipement que rien ne met en cause, et en redondance froide il peut vous laisser sur un équipement que vous ne voyez pas."}
        - text: {en: "Step 3 is only for the first pass after launch.", fr: "L’étape 3 ne sert qu’au premier passage après le lancement."}
          why: {en: "Step 3 is for a transponder fault, at any time.", fr: "L’étape 3 traite une panne de transpondeur, à tout moment."}
        - text: {en: "The beacon is more reliable than the S-band.", fr: "La balise est plus fiable que la bande S."}
          why: {en: "Reliability is not the point: what matters is the parameter it carries.", fr: "La fiabilité n’est pas la question : ce qui compte, c’est le paramètre qu’elle transporte."}

  - id: verify
    title: {en: "Step 6: verify and log", fr: "Étape 6 : vérifier et consigner"}
    say:
      en: >-
        Step six verifies the result rather than assuming it. The lock status shows that frames
        are being received, the amplifier status reads one, and the station now measures the
        S-band signal directly, with adequate margin. The operator records which step restored
        the link, step four, because the amplifier was off. The reason the amplifier was off
        must be investigated before the next pass, and that question is recorded in the anomaly
        ticket.
      fr: >-
        L’étape six vérifie le résultat au lieu de le supposer. L’état de verrouillage montre
        que les trames sont reçues, l’état de l’amplificateur est à un, et la station mesure
        maintenant directement le signal en bande S, avec une marge suffisante. L’opérateur
        consigne l’étape qui a rétabli la liaison, l’étape quatre, puisque l’amplificateur était
        coupé. La raison de cette coupure doit être recherchée avant le passage suivant, et
        cette question est inscrite dans la fiche d’anomalie.
    do:
      - click: {css: "#rail-ttc"}
      - wait_for: {target: {css: "#ttc-equip .eq"}, timeout: 20}
      - wait: 1.5
      - scroll: {css: "#ttc-stepper"}
      - highlight: {target: {css: ".ds-card:has(#ttc-stepper)"}, seconds: 2.5}
      - highlight: {target: {css: "#ttc-equip .eq:has-text('PA ON')"}, seconds: 2.5}
      - scroll: {css: "#ttc-station-note"}
      - highlight: {target: {css: "#ttc-station-note"}, seconds: 3}
    question:
      type: reflect
      worksheet: WB-A-CTG-019/q6
      text:
        en: "The same silent pass, but the beacon reads ttc.pa_on = 1. Walk through what you would send next, and what you could and could not learn from it."
        fr: "Le même passage muet, mais la balise lit ttc.pa_on = 1. Décrivez ce que vous enverriez ensuite, et ce que vous pourriez ou non en apprendre."
