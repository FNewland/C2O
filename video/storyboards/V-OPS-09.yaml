# Week 5 — LEOP-003: check the GPS fix, read the position and altitude against
# the check band, and declare the end of LEOP. From card-LEOP-003. Nominal card.
# Prepares WB-5.5-L003 steps 1, 2 and 7.
id: V-OPS-09
week: 10
audience: all
title:
  en: "LEOP-003: orbit check and the end of LEOP"
  fr: "LEOP-003 : vérification de l’orbite et fin de la LEOP"
summary:
  en: "This video checks that the GPS solution is valid and reads the position and altitude against the expected range. It compares the orbit with the launch provider’s prediction, and then declares the start of commissioning by telecommand."
  fr: "Cette vidéo vérifie que la solution GPS est valide et lit la position et l’altitude par rapport à la plage attendue. Elle compare l’orbite à la prévision du lanceur, puis déclare le début de la mise en service par télécommande."
apps:
  mcs: default
fresh_stack: sim
ties:
  worksheets: [WB-5.5-L003, WB-5.5-L003/q1, WB-5.5-L003/q2, WB-5.5-L003/q7]
  cards: [LEOP-003]
sources:
  - sim/configs/eosat1/procedures/leop/initial_orbit_determination.md (LEOP-003)

setup:
  - api: {app: instructor, method: POST, path: /api/command, json: {type: load_breakpoint, name: card-LEOP-003}}
  - wait: 2
  - python: {call: "video/c2ovideo/helpers.py:ff_to_pass", app: instructor, kwargs: {planner: "${planner_url}", min_duration: 420, min_elevation: 15, after_aos: 10}}
  - api: {app: mcs, method: POST, path: /api/pus-command, json: {service: 3, subtype: 27, data_hex: "0004", name: HK_REQUEST, position: flight_director}}
  - wait: 3
  - goto: {app: mcs, path: "/?lang={lang}&position=flight_director", settle: 4}
  - js: "fetch('/api/logbook', {method: 'DELETE', credentials: 'same-origin'})"
  - reload: 4

steps:
  - id: fix
    title: {en: "Step 1: GPS solution quality", fr: "Étape 1 : qualité de la solution GPS"}
    say:
      en: >-
        This is the last procedure of the launch and early orbit phase, LEOP. The GPS receiver,
        switched on in LEOP-007, has had time to acquire satellites. The operator requests its
        navigation report, structure identifier twelve, or SID twelve, and reads three values on
        the attitude page. The fix type must be at least two, which is a three-dimensional fix;
        at least four satellites must be tracked; and the dilution of precision is recorded. If
        the fix is not valid, none of the following checks can be relied on.
      fr: >-
        Voici la dernière procédure de la phase de lancement et de début d’orbite, la LEOP. Le
        récepteur GPS, allumé dans LEOP-007, a eu le temps d’acquérir des satellites.
        L’opérateur demande son rapport de navigation, identifiant de structure douze, ou SID
        douze, et lit trois valeurs sur la page attitude. Le type de point doit valoir au moins
        deux, soit un point en trois dimensions ; au moins quatre satellites doivent être suivis
        ; et la dilution de précision est consignée. Si le point n’est pas valide, aucune des
        vérifications suivantes n’est fiable.
    do:
      - click: {css: "#rail-cmd"}
      - select: {target: {css: "#cmd-catalog"}, value: HK_REQUEST}
      - fill: {target: {css: "#cmd-fields [data-cmd-field='sid']"}, text: "12"}
      - click: {css: "#cmd-send"}
      - wait: 2.0
      - click: {css: "#rail-aocs"}
      - wait: 2.0
      - highlight: {target: {css: "#page-aocs tr[data-param='0x0274']"}, seconds: 2.5}
      - highlight: {target: {css: "#page-aocs tr[data-param='0x0276']"}, seconds: 2}
      - highlight: {target: {css: "#page-aocs tr[data-param='0x0275']"}, seconds: 2}

  - id: position
    title: {en: "Step 2: position and the check band", fr: "Étape 2 : position et bande de contrôle"}
    say:
      en: >-
        Latitude, longitude and altitude are not included in the routine report, so each is
        requested by its parameter number. The altitude must lie within the check band of four
        hundred and ninety-five to five hundred and forty kilometres. A value outside this band
        means that either the fix or the insertion orbit delivered by the launch vehicle is
        wrong, and Flight Dynamics must be informed before any other action is taken.
      fr: >-
        La latitude, la longitude et l’altitude ne figurent pas dans le rapport courant :
        chacune est donc demandée par son numéro de paramètre. L’altitude doit se situer dans la
        bande de contrôle, de quatre cent quatre-vingt-quinze à cinq cent quarante kilomètres.
        Une valeur hors de cette bande signifie que le point ou l’orbite d’injection livrée par
        le lanceur est erroné, et la dynamique du vol doit en être informée avant toute autre
        action.
    do:
      - click: {css: "#rail-cmd"}
      - select: {target: {css: "#cmd-catalog"}, value: GET_PARAM}
      - fill: {target: {css: "#cmd-fields [data-cmd-field='param_id']"}, text: "528"}
      - click: {css: "#cmd-send"}
      - wait: 1.2
      - fill: {target: {css: "#cmd-fields [data-cmd-field='param_id']"}, text: "529"}
      - click: {css: "#cmd-send"}
      - wait: 1.2
      - fill: {target: {css: "#cmd-fields [data-cmd-field='param_id']"}, text: "530"}
      - click: {css: "#cmd-send"}
      - wait: 1.5
      - click: {css: "#rail-aocs"}
      - wait: 1.5
      - highlight: {target: {css: "#page-aocs tr[data-param='0x0212']"}, seconds: 3}
    question:
      type: multichoice
      worksheet: WB-5.5-L003/q2
      text:
        en: "The GPS altitude reads 552 km. What do you do?"
        fr: "L’altitude GPS affiche 552 km. Que faites-vous ?"
      options:
        - text: {en: "NO-GO on Step 2: it is outside the 495–540 km check band. Tell Flight Dynamics and re-check the fix.", fr: "NO-GO à l’étape 2 : elle est hors de la bande de contrôle de 495 à 540 km. Prévenez la dynamique du vol et revérifiez le point."}
          correct: true
          why: {en: "The band is there to catch a bad fix or a bad insertion before elements are computed.", fr: "La bande sert à détecter un mauvais point ou une mauvaise injection avant le calcul des éléments."}
        - text: {en: "GO: 552 km is a normal low Earth orbit.", fr: "GO : 552 km, c’est une orbite basse normale."}
          why: {en: "Normal for LEO, but not for this mission's insertion.", fr: "Normal en orbite basse, mais pas pour l’injection de cette mission."}
        - text: {en: "Command a manoeuvre to lower the orbit.", fr: "Commander une manœuvre pour abaisser l’orbite."}
          why: {en: "Nothing is uploaded on this card; the propulsion line is off.", fr: "Rien n’est envoyé au satellite dans cette fiche ; la ligne propulsion est éteinte."}

  - id: compare
    title: {en: "Steps 3 to 6: state vector and comparison", fr: "Étapes 3 à 6 : vecteur d’état et comparaison"}
    say:
      en: >-
        Step 3 reads the full position and velocity in the same way, as six parameters. Their
        magnitudes must be consistent with a near-circular low orbit: about six thousand nine
        hundred kilometres from the centre of the Earth, and about seven and a half kilometres
        per second. Flight Dynamics converts them into orbital elements and compares them with
        the launch vehicle prediction: inclination, eccentricity, and the local time of the
        ascending node, or LTAN, which is the local solar time at which the spacecraft crosses
        the equator heading north. A second fix ten minutes later confirms that the solution is
        repeatable.
      fr: >-
        L’étape 3 lit de la même façon la position et la vitesse complètes, soit six paramètres.
        Leurs normes doivent être cohérentes avec une orbite basse quasi circulaire : environ
        six mille neuf cents kilomètres du centre de la Terre et environ sept kilomètres et demi
        par seconde. La dynamique du vol les convertit en éléments orbitaux et les compare à la
        prévision du lanceur : inclinaison, excentricité et heure locale du nœud ascendant,
        LTAN, c’est-à-dire l’heure solaire locale à laquelle le satellite franchit l’équateur
        vers le nord. Un second point, dix minutes plus tard, confirme que la solution est
        reproductible.
    do:
      - click: {css: "#rail-proc"}
      - select: {target: {css: "#proc-source"}, value: ops}
      - wait: 0.8
      - select: {target: {css: "#proc-type"}, value: leop/initial_orbit_determination.md}
      - wait: 2.0
      - scroll: {css: "#proc-doc section[data-pc-step='s3']"}
      - highlight: {target: {css: "#proc-doc section[data-pc-step='s3']"}, seconds: 3, point: false}
      - scroll: {css: "#proc-doc section[data-pc-step='s4']"}
      - highlight: {target: {css: "#proc-doc section[data-pc-step='s4']"}, seconds: 3, point: false}

  - id: end
    title: {en: "Step 7: the end of LEOP", fr: "Étape 7 : la fin de la LEOP"}
    say:
      en: >-
        The final step is the responsibility of the Flight Director, who polls every position
        for GO or NO-GO and then declares the end of LEOP by telecommand, setting mission phase
        five, commissioning. The commissioning procedures follow, beginning with the checkout of
        the power subsystem.
      fr: >-
        La dernière étape relève du directeur de vol, qui interroge chaque poste pour obtenir un
        GO ou un NO-GO, puis déclare la fin de la LEOP par télécommande, en passant à la phase
        de mission cinq, la mise en service. Les procédures de mise en service suivent, en
        commençant par la recette du sous-système énergie.
    do:
      - scroll: {css: "#proc-doc section[data-pc-step='s7']"}
      - highlight: {target: {css: "#proc-doc section[data-pc-step='s7']"}, seconds: 3.5, point: false}
    question:
      type: reflect
      worksheet: WB-5.5-L003/q7
      text:
        en: "Before you poll for the end of LEOP, which position would you ask first, and what would make you say NO-GO?"
        fr: "Avant le tour de GO pour la fin de la LEOP, quel poste interrogeriez-vous en premier, et qu’est-ce qui vous ferait dire NO-GO ?"
