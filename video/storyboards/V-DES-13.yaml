# Design concept — cost and design reviews (textbook ch. 16): estimate
# accuracy by method and phase, the EOSat-3U parametric cost breakdown
# (490 k€, launch 200), confidence levels and reserve, SRR gate criteria and
# outcomes, the review board and how to present. Ties to SpaceCDF reviews.
# Animated page video/explainers/reviews.html. Whole design team.
id: V-DES-13
week: 6
audience: all
title:
  en: "Cost and design reviews"
  fr: "Coûts et revues de conception"
summary:
  en: "How much will it cost, and how sure are you? Estimating methods and their accuracy, where a CubeSat's money goes, confidence levels and reserve, and how a review gate and an independent board decide go, no go, or go with actions."
  fr: "Combien cela coûtera-t-il, et avec quelle certitude ? Les méthodes d’estimation et leur précision, où va l’argent d’un CubeSat, les niveaux de confiance et la réserve, et comment une revue et un comité indépendant décident : go, no go, ou go avec actions."
apps:
  viz: default
fresh_stack: viz
ties: {}
sources:
  - design/docs/oer/chapters/16_cost_and_reviews.md (§ 16.1, 16.4, 16.5, 16.6)

setup:
  - goto: {app: viz, path: "/video/explainers/reviews.html?lang={lang}", settle: 1.5}
  - cursor: hide

steps:
  - id: methods
    title: {en: "Estimating cost", fr: "Estimer le coût"}
    say:
      en: >-
        Like the mass estimate, the cost estimate becomes more accurate as the design matures.
        In the early phases, a parametric estimate based on past missions is accurate to within
        thirty to fifty percent. When a comparable mission is available, an estimate by analogy
        improves this to twenty to forty percent. Once supplier quotes and labour estimates are
        available, a bottom-up estimate is accurate to within ten to twenty percent. The three
        methods are used in succession, not as alternatives.
      fr: >-
        Comme l’estimation de masse, l’estimation de coût gagne en précision à mesure que la
        conception mûrit. Dans les premières phases, une estimation paramétrique fondée sur des
        missions passées est précise à trente à cinquante pour cent près. Lorsqu’une mission
        comparable est disponible, une estimation par analogie ramène cette incertitude à vingt
        à quarante pour cent. Une fois les devis des fournisseurs et les estimations de
        main-d’œuvre connus, une estimation ascendante est précise à dix à vingt pour cent près.
        Les trois méthodes s’utilisent successivement, et non comme des options concurrentes.
    do:
      - js: "EX.play('methods', ${say})"

  - id: breakdown
    title: {en: "Cost breakdown", fr: "La répartition des coûts"}
    say:
      en: >-
        This parametric estimate for a 3U Earth observation CubeSat gives a total of about four
        hundred and ninety thousand euros. The launch alone accounts for two hundred thousand,
        the largest single item, followed by the payload, the attitude control system and three
        years of operations. All the flight hardware together accounts for only about a third of
        the total. The bottom-up estimate was seven percent lower, because parametric models
        include their own contingency.
      fr: >-
        Cette estimation paramétrique pour un CubeSat 3U d’observation de la Terre donne un
        total d’environ quatre cent quatre-vingt-dix mille euros. Le lancement représente à lui
        seul deux cent mille euros, le poste le plus important, suivi de la charge utile, du
        système de contrôle d’attitude et de trois années d’exploitation. L’ensemble du matériel
        de vol ne représente qu’environ un tiers du total. L’estimation ascendante s’est révélée
        inférieure de sept pour cent, car les modèles paramétriques intègrent leur propre
        provision pour aléas.
    do:
      - js: "EX.play('breakdown', ${say})"

  - id: confidence
    title: {en: "Confidence and reserve", fr: "Confiance et réserve"}
    say:
      en: >-
        A single value conceals the uncertainty in an estimate, so the commitment is made at a
        stated confidence level. The fifty percent point, the cost that is not exceeded in half
        of cases, is the baseline. NASA commits at the seventy percent level, about one point
        two times the baseline, and proposals often use the eighty percent level, about one
        point three times. The difference is the cost reserve. It is held by the project manager
        and released when a risk in the register actually occurs.
      fr: >-
        Une valeur unique masque l’incertitude d’une estimation : l’engagement se prend donc à
        un niveau de confiance déclaré. Le point à cinquante pour cent, le coût qui n’est pas
        dépassé dans la moitié des cas, constitue la référence. La NASA s’engage au niveau de
        soixante-dix pour cent, environ un virgule deux fois la référence, et les propositions
        retiennent souvent le niveau de quatre-vingts pour cent, environ un virgule trois fois.
        La différence constitue la réserve de coûts. Elle est détenue par le chef de projet et
        libérée lorsqu’un risque du registre se réalise effectivement.
    do:
      - js: "EX.play('confidence', ${say})"

  - id: gates
    title: {en: "A review gate", fr: "Une revue"}
    say:
      en: >-
        A review gate is a set of criteria, each supported by evidence. At the system
        requirements review, between Phases A and B, the requirements must be baselined, the
        concept of operations, or ConOps, must cover every phase, the architecture trades must
        be complete, every budget must close with margin, the risk register must be in place,
        and cost and schedule must be estimated. Some criteria are mandatory and others are
        recommended. The review board decides on one of three outcomes, go, go with actions, or
        no go, and every action is assigned an owner and a due date.
      fr: >-
        Une revue est un ensemble de critères, chacun étayé par des preuves. À la revue des
        exigences système, entre les phases A et B, les exigences doivent être figées, le
        concept d’opérations, ou ConOps, doit couvrir chaque phase, les compromis d’architecture
        doivent être terminés, chaque bilan doit se fermer avec marge, le registre des risques
        doit être en place, et le coût et le calendrier doivent être estimés. Certains critères
        sont obligatoires, d’autres recommandés. Le comité de revue choisit l’une de trois
        issues, go, go avec actions ou no go, et chaque action reçoit un responsable et une
        échéance.
    do:
      - js: "EX.play('gates', ${say})"
    question:
      type: multichoice
      text:
        en: "At the system requirements review your power budget closes, but the risk register has not been started. What is the likely outcome?"
        fr: "À la revue des exigences système, votre bilan de puissance se ferme, mais le registre des risques n’existe pas. Quelle issue est probable ?"
      options:
        - text: {en: "No go, or go with actions: a must-pass criterion has failed.", fr: "No go, ou go avec actions : un critère obligatoire a échoué."}
          correct: true
          why: {en: "A risk register with mitigations is a must-pass criterion at this gate.", fr: "Un registre des risques avec atténuations est obligatoire à cette revue."}
        - text: {en: "Go: the budgets are what matter at this gate.", fr: "Go : ce sont les bilans qui comptent à cette revue."}
          why: {en: "Every must-pass criterion counts, not just the budgets.", fr: "Chaque critère obligatoire compte, pas seulement les bilans."}
        - text: {en: "Go, with the register due at the critical design review.", fr: "Go, avec le registre attendu à la revue critique."}
          why: {en: "That would leave a must-pass gap for two phases.", fr: "Cela laisserait un manque obligatoire pendant deux phases."}

  - id: board
    title: {en: "The review board", fr: "Le comité de revue"}
    say:
      en: >-
        The review board is independent, made up of people who were not involved in the design,
        because they can see issues that the team may no longer notice. A chair ensures that
        every criterion is addressed, and the reviewers examine the systems view, the technical
        choices, the risks and the operations. When presenting to a board, the team should state
        its conclusion first, then present the evidence and its assumptions. Where an answer is
        not known, the team should say so and take an action. Reviews in SpaceCDF follow the
        same approach.
      fr: >-
        Le comité de revue est indépendant : il réunit des personnes qui n’ont pas participé à
        la conception, car elles peuvent voir des problèmes que l’équipe ne remarque plus. Un
        président veille à ce que chaque critère soit traité, et les examinateurs étudient la
        vue système, les choix techniques, les risques et l’exploitation. Lorsqu’elle présente
        devant un comité, l’équipe doit d’abord énoncer sa conclusion, puis présenter les
        preuves et ses hypothèses. Lorsqu’elle ne connaît pas une réponse, elle doit le dire et
        prendre une action. Les revues dans SpaceCDF suivent la même démarche.
    do:
      - js: "EX.play('board', ${say})"
    question:
      type: reflect
      text:
        en: "Which reviewer question from this video would your team find hardest to answer today, and what evidence would you need to answer it?"
        fr: "Quelle question d’examinateur de cette vidéo votre équipe aurait-elle le plus de mal à traiter aujourd’hui, et quelle preuve lui faudrait-il ?"
