# Week 2 — from mission need to the first decision records (SpaceCDF wizard).
# Prepares LW-1.4 parts A–E and the decision records D-1.4-PROBLEM / -OBJECTIVES / -SPACE.
id: V-SCDF-01
week: 2
audience: all
title:
  en: "From mission need to decision record"
  fr: "Du besoin de mission à la fiche de décision"
summary:
  en: "This video starts a study in SpaceCDF. It shows how to state the problem, identify the stakeholders and objectives, assess the alternatives and record the reasons for each decision in the logbook."
  fr: "Cette vidéo démarre une étude dans SpaceCDF. Elle montre comment énoncer le problème, identifier les parties prenantes et les objectifs, évaluer les solutions possibles et consigner dans le journal de bord les raisons de chaque décision."
apps:
  spacecdf: default
ties:
  worksheets: [LW-1.4/A, LW-1.4/B, LW-1.4/C, LW-1.4/E]
  decisions: [D-1.4-PROBLEM, D-1.4-SPACE]
sources:
  - design/docs/oer/chapters (§4.1 mission need, §4.2 stakeholders and objectives)
  - design/configs/worksheets/learner_workbook.yaml (LW-1.4)

setup:
  - goto: {app: spacecdf, path: "/?lang={lang}"}
  - fill: {target: "input", text: {en: "Ava (Team leader)", fr: "Ava (cheffe d’équipe)"}}
  - click: {target: {role: button, name: Join, exact: true}, instant: true}
  - wait_for: {role: button, name: Create New Mission}

steps:
  - id: home
    title: {en: "SpaceCDF and your logbook", fr: "SpaceCDF et votre journal de bord"}
    say:
      en: >-
        This is SpaceCDF. CDF stands for concurrent design facility, an environment in which all
        the engineering disciplines work on a single design at the same time. Each study in this
        course begins here. Create New Mission takes the team through four steps: the problem,
        the stakeholders, the alternatives and a first architecture. Throughout the process, the
        tool records what the team chose, and the logbook records the reasons for each choice.
      fr: >-
        Voici SpaceCDF. Le sigle CDF désigne un centre de conception concourante, un
        environnement dans lequel toutes les disciplines d’ingénierie travaillent sur une même
        conception en même temps. Chaque étude de ce cours commence ici. Créer une mission guide
        l’équipe en quatre étapes : le problème, les parties prenantes, les solutions de
        rechange et une première architecture. Tout au long du processus, l’outil enregistre les
        choix de l’équipe, et le journal de bord en consigne les raisons.
    do:
      - highlight: {target: {role: button, name: Create New Mission}, seconds: 3}
      - highlight: {target: {role: button, name: Logbook}, seconds: 2.5}

  - id: problem
    title: {en: "Step 1: the problem statement", fr: "Étape 1 : l’énoncé du problème"}
    say:
      en: >-
        The first step asks what problem the mission addresses. A good problem statement
        identifies the gap, who is affected by it, and the consequences if no action is taken.
        It does not yet specify a satellite. The example team is concerned that wildfires in the
        boreal forest are detected too late. The operational context describes when and how the
        mission products will be used.
      fr: >-
        La première étape demande quel problème la mission doit résoudre. Un bon énoncé du
        problème identifie le manque, les personnes touchées et les conséquences de l’inaction.
        Il ne précise pas encore de satellite. L’équipe de l’exemple constate que les feux de la
        forêt boréale sont détectés trop tard. Le contexte opérationnel décrit quand et comment
        les produits de la mission seront utilisés.
    do:
      - click: {role: button, name: Create New Mission}
      - type: {target: {label: Mission Name}, text: BorealWatch-1}
      - type:
          target: {css: "textarea >> nth=0"}
          delay_ms: 14
          text:
            en: "Wildfires in Canada's boreal forest are detected hours after ignition, when they already cover more than 10 ha. Current satellites pass at the wrong time and their pixels miss small fires."
            fr: "Les feux de la forêt boréale canadienne sont détectés des heures après leur départ, lorsqu’ils couvrent déjà plus de 10 ha. Les satellites actuels passent au mauvais moment et leurs pixels ne voient pas les petits feux."
      - type:
          target: {css: "textarea >> nth=1"}
          delay_ms: 14
          text:
            en: "Fire agencies receive hotspot alerts within 30 minutes of acquisition, May to September, 48 to 62° N."
            fr: "Les agences de lutte contre les feux reçoivent les alertes dans les 30 minutes suivant l’acquisition, de mai à septembre, entre 48 et 62° N."
    question:
      type: multichoice
      worksheet: LW-1.4/B
      text:
        en: "Which of these is a problem statement, not a solution?"
        fr: "Lequel de ces énoncés est un énoncé de problème, et non une solution ?"
      options:
        - text: {en: "Small boreal wildfires are found hours late, so they grow before crews arrive.", fr: "Les petits feux boréaux sont repérés avec des heures de retard et grandissent avant l’arrivée des équipes."}
          correct: true
          why: {en: "It names the gap, who is affected and the impact, and no hardware.", fr: "Il nomme le manque, qui est touché et l’impact, sans matériel."}
        - text: {en: "Build a 6U CubeSat with a thermal infrared camera.", fr: "Construire un CubeSat 6U avec une caméra infrarouge thermique."}
          why: {en: "That is already a solution: it skips the alternatives.", fr: "C’est déjà une solution : elle saute les solutions de rechange."}
        - text: {en: "Launch on the next rideshare to sun-synchronous orbit.", fr: "Lancer au prochain vol partagé vers une orbite héliosynchrone."}
          why: {en: "A launch choice, not a need.", fr: "Un choix de lancement, pas un besoin."}

  - id: record
    title: {en: "Record the decision", fr: "Consigner la décision"}
    say:
      en: >-
        Next to the form is the Record decision button. It opens the logbook at decision D one
        point four, Problem, with the statement already entered as the choice. The record
        identifies the part of the workbook it addresses and the place in SpaceCDF where the
        relevant information can be found. The rationale must be written by the team: why this
        statement was chosen, and what was left out of scope.
      fr: >-
        À côté du formulaire se trouve le bouton Consigner la décision. Il ouvre le journal de
        bord sur la décision D un point quatre, Problème, avec l’énoncé déjà repris comme choix.
        La fiche indique la partie du cahier de travail à laquelle elle répond et l’endroit de
        SpaceCDF où trouver les informations utiles. La justification doit être rédigée par
        l’équipe : pourquoi cet énoncé a été retenu, et ce qui a été exclu du périmètre.
    do:
      - click: {css: "[data-decision='D-1.4-PROBLEM']"}
      - wait_for: {css: "#c2o-logbook"}
      - highlight: {target: {css: "#c2o-logbook .c2o-lb-dec-ws, #c2o-logbook :text-matches('Worksheet 1.4|Fiche 1.4')"}, seconds: 3}
      - type:
          target: {placeholder: "Why this option? What made the runner-up lose? What would change your mind?"}
          delay_ms: 12
          text:
            en: "Late detection is the shared pain of all three agencies we interviewed. We left smoke forecasting out of scope: it needs a different sensor."
            fr: "La détection tardive est le problème commun aux trois agences interrogées. Nous laissons la prévision de la fumée hors du périmètre : elle demande un autre capteur."

  - id: save
    title: {en: "Saving the logbook", fr: "Enregistrer le journal de bord"}
    say:
      en: >-
        The record is then saved. It is private to the user and stored in this browser, and the
        server deletes it forty-eight hours after the last entry. At the end of each session,
        the logbook should therefore be downloaded, either as Markdown, a plain-text format, or
        as printable HTML, and kept with the workbook. The Worksheets tab lists the worksheet
        sections that correspond to the current step.
      fr: >-
        La fiche est ensuite enregistrée. Elle est privée et conservée dans ce navigateur, et le
        serveur la supprime quarante-huit heures après la dernière saisie. À la fin de chaque
        séance, il faut donc télécharger le journal de bord, en Markdown, un format texte
        simple, ou en HTML imprimable, et le conserver avec le cahier de travail. L’onglet des
        fiches liste les sections du cahier qui correspondent à l’étape en cours.
    do:
      - click: {role: button, name: Save decision record}
      - wait: 0.8
      - highlight: {target: {css: "#c2o-logbook .c2o-logbook__foot"}, seconds: 3}
      - click: {target: {within: "#c2o-logbook", role: tab, name: Worksheets}}
      - wait: 1.5
      - click: {role: button, name: Close the logbook}

  - id: stakeholders
    title: {en: "Step 2: stakeholders and objectives", fr: "Étape 2 : parties prenantes et objectifs"}
    say:
      en: >-
        The second step identifies the stakeholders and their needs. Each stakeholder is named
        by role: who funds the mission, who uses its products, who operates it and who regulates
        it. The team then writes at least two objectives, each with a priority and, most
        importantly, a means of measurement. An objective that cannot be measured cannot be
        verified at the review.
      fr: >-
        La deuxième étape identifie les parties prenantes et leurs besoins. Chaque partie
        prenante est désignée par son rôle : qui finance la mission, qui en utilise les
        produits, qui l’exploite et qui la réglemente. L’équipe rédige ensuite au moins deux
        objectifs, chacun avec une priorité et, surtout, un moyen de mesure. Un objectif qui ne
        peut pas être mesuré ne peut pas être vérifié lors de la revue.
    do:
      - click: {role: button, name: "Next →"}
      - fill: {target: {label: "Stakeholder 1: name / organisation"}, text: {en: "Canadian Space Agency", fr: "Agence spatiale canadienne"}}
      - select: {target: {label: "Stakeholder 1: role"}, value: sponsor}
      - fill: {target: {label: "Stakeholder 1: key need"}, text: {en: "Low-cost demonstration of wildfire monitoring", fr: "Démonstration à faible coût de la surveillance des feux"}}
      - click: {role: button, name: "+ Add stakeholder"}
      - fill: {target: {label: "Stakeholder 2: name / organisation"}, text: {en: "Provincial wildfire agencies", fr: "Agences provinciales de lutte contre les feux"}}
      - select: {target: {label: "Stakeholder 2: role"}, value: user}
      - fill: {target: {label: "Stakeholder 2: key need"}, text: {en: "Alerts within 30 minutes, May to September", fr: "Alertes en moins de 30 minutes, de mai à septembre"}}
      - type: {target: {label: "Objective 1", exact: true}, delay_ms: 12, text: {en: "Detect active fires of 0.1 ha or larger in the boreal zone", fr: "Détecter les feux actifs de 0,1 ha ou plus dans la zone boréale"}}
      - fill: {target: {label: "Objective 1: how to measure"}, text: {en: "Detection probability ≥ 90 % for a 0.1 ha fire; pixel ≤ 60 m", fr: "Probabilité de détection ≥ 90 % pour un feu de 0,1 ha ; pixel ≤ 60 m"}}
      - click: {role: button, name: "+ Add objective"}
      - select: {target: {label: "Objective 2: priority"}, value: primary}
      - fill: {target: {label: "Objective 2", exact: true}, text: {en: "Deliver alerts within 30 minutes of acquisition", fr: "Livrer les alertes dans les 30 minutes suivant l’acquisition"}}
      - fill: {target: {label: "Objective 2: how to measure"}, text: {en: "Median latency ≤ 30 min", fr: "Latence médiane ≤ 30 min"}}
      - highlight: {target: {css: "[data-decision='D-1.4-OBJECTIVES']"}, seconds: 2.5}
    question:
      type: truefalse
      worksheet: LW-1.4/C
      answer: false
      text:
        en: "An objective without a way to measure it can still be verified at the preliminary design review (PDR)."
        fr: "Un objectif sans méthode de mesure peut tout de même être vérifié à la revue de conception préliminaire (PDR)."

  - id: alternatives
    title: {en: "Step 3: assessing alternatives", fr: "Étape 3 : évaluer les solutions possibles"}
    say:
      en: >-
        The third step asks whether the need actually requires a new space mission. The team
        compares the alternatives, such as purchasing existing data, aircraft, ground-based
        sensors or a dedicated spacecraft, selects one, and explains in the justification why
        the others are not sufficient. The team then records decision D one point four, Space.
        The architecture step is covered in the next session.
      fr: >-
        La troisième étape demande si le besoin exige réellement une nouvelle mission spatiale.
        L’équipe compare les solutions de rechange, comme l’achat de données existantes, les
        avions, les capteurs au sol ou un engin spatial dédié, en retient une et explique dans
        la justification pourquoi les autres ne suffisent pas. L’équipe consigne ensuite la
        décision D un point quatre, Espace. L’étape de l’architecture est traitée à la séance
        suivante.
    do:
      - click: {role: button, name: "Next →"}
      - wait: 1.0
      - highlight: {target: {css: "main :text-matches('#3|#4')"}, seconds: 2.4, point: false}
      - click: {css: "button:has-text('new_satellite'), [role=button]:has-text('new_satellite')"}
      - type:
          target: {css: "textarea >> nth=0"}
          delay_ms: 12
          text:
            en: "No existing source has a thermal band at 60 m or better with an afternoon pass over 48–62° N; aircraft cannot cover the whole boreal zone every day."
            fr: "Aucune source existante n’offre une bande thermique de 60 m ou mieux avec un passage l’après-midi entre 48 et 62° N ; les avions ne couvrent pas toute la zone boréale chaque jour."
      - highlight: {target: {css: "[data-decision='D-1.4-SPACE']"}, seconds: 3}
    question:
      type: reflect
      worksheet: LW-1.4/E
      text:
        en: "Which non-space alternative came closest for your own mission, and why did it lose? Write one or two sentences, then copy them into Part E of your workbook."
        fr: "Pour votre propre mission, quelle solution non spatiale s’est approchée le plus, et pourquoi a-t-elle perdu ? Écrivez une ou deux phrases, puis reportez-les dans la partie E de votre cahier."
