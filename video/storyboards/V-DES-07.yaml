# Design concept — sizing the solar array and the battery (textbook § 9.2,
# 9.3, EOSat-3U worked example): end-of-life array power from the worst
# sunlit mode plus the eclipse recharge, degradation and temperature to
# beginning of life, area; battery energy from eclipse load and depth of
# discharge, cycle life, and the battery failure modes operators guard against.
# Animated page video/explainers/power.html. Whole design team; power position.
id: V-DES-07
week: 3
audience: all
title:
  en: "Sizing the array and the battery"
  fr: "Dimensionner panneaux et batterie"
summary:
  en: "How big must the solar array and the battery be? The array carries the worst sunlit mode and refills the battery in the same sunlit arc; ageing and heat raise the starting power; depth of discharge sets the battery size and its life."
  fr: "Quelle taille pour les panneaux et la batterie ? Les panneaux portent le pire mode éclairé et rechargent la batterie dans le même arc éclairé ; vieillissement et chaleur augmentent la puissance de départ ; la profondeur de décharge fixe la taille de la batterie et sa durée de vie."
apps:
  viz: default
fresh_stack: viz
ties: {}
sources:
  - design/docs/oer/chapters/09_power_and_thermal.md (§ 9.2, 9.3)

setup:
  - goto: {app: viz, path: "/video/explainers/power.html?lang={lang}", settle: 1.5}
  - cursor: hide

steps:
  - id: eol
    title: {en: "What the array must deliver", fr: "Ce que les panneaux doivent fournir"}
    say:
      en: >-
        The solar array generates power only in sunlight, about fifty-nine minutes of each
        orbit. During that time it must supply the most demanding sunlit mode, here a ten-watt
        downlink, rather than the average load. Within the same sunlit period it must also
        recharge the battery with the energy used during eclipse, three and a half watts for
        thirty-six minutes, through a charge and discharge path that loses about a fifth of the
        energy. Eleven point one watts plus two point seven gives a requirement of about
        thirteen point eight watts at end of life.
      fr: >-
        Le générateur solaire ne produit de l’énergie qu’au soleil, environ cinquante-neuf
        minutes par orbite. Pendant ce temps, il doit alimenter le mode éclairé le plus
        exigeant, ici une transmission de dix watts, et non la charge moyenne. Pendant la même
        période d’ensoleillement, il doit aussi recharger la batterie de l’énergie consommée
        pendant l’éclipse, trois watts et demi pendant trente-six minutes, par un chemin de
        charge et de décharge qui perd environ un cinquième de l’énergie. Onze virgule un watts
        plus deux virgule sept donnent un besoin d’environ treize virgule huit watts en fin de
        vie.
    do:
      - js: "EX.play('eol', ${say})"

  - id: area
    title: {en: "From power to area", fr: "De la puissance à la surface"}
    say:
      en: >-
        This is the end-of-life value. Radiation degrades the cells by about two and a half
        percent per year, and the cells produce less power at higher temperature, so at the
        beginning of life the array must provide about sixteen watts. Each square metre of cells
        at twenty-nine and a half percent efficiency, allowing for the incidence angle, the gaps
        between cells and the cover glass, provides about three hundred watts. The required area
        is therefore about five hundredths of a square metre, which is one deployable panel of
        twenty-three centimetres by twenty-three centimetres.
      fr: >-
        Il s’agit de la valeur de fin de vie. Le rayonnement dégrade les cellules d’environ deux
        et demi pour cent par an, et les cellules produisent moins à température élevée : en
        début de vie, le générateur doit donc fournir environ seize watts. Chaque mètre carré de
        cellules à vingt-neuf et demi pour cent de rendement, compte tenu de l’angle
        d’incidence, des espaces entre cellules et du verre de protection, fournit environ trois
        cents watts. La surface nécessaire est donc d’environ cinq centièmes de mètre carré,
        soit un panneau déployable de vingt-trois centimètres sur vingt-trois.
    do:
      - js: "EX.play('area', ${say})"
    question:
      type: multichoice
      text:
        en: "The mission is extended from three years to six. What happens to the array size, all else equal?"
        fr: "La mission passe de trois à six ans. Que devient la taille des panneaux, toutes choses égales par ailleurs ?"
      options:
        - text: {en: "It grows: six years of degradation (0.975⁶ ≈ 0.86) means more power at the start.", fr: "Elle augmente : six ans de dégradation (0,975⁶ ≈ 0,86) exigent plus de puissance au départ."}
          correct: true
          why: {en: "The end-of-life need is the same, so the beginning-of-life power rises by about 7 %.", fr: "Le besoin en fin de vie est le même ; la puissance en début de vie augmente d’environ 7 %."}
        - text: {en: "It stays the same: degradation only matters for the battery.", fr: "Elle ne change pas : la dégradation ne concerne que la batterie."}
          why: {en: "Cells lose output with radiation dose every year.", fr: "Les cellules perdent du rendement avec la dose de rayonnement chaque année."}
        - text: {en: "It shrinks, because the cells warm up less over time.", fr: "Elle diminue, car les cellules chauffent moins avec le temps."}
          why: {en: "Cell temperature depends on the orbit and attitude, not on mission length.", fr: "La température des cellules dépend de l’orbite et de l’attitude, pas de la durée de mission."}

  - id: battery
    title: {en: "Sizing the battery", fr: "Dimensionner la batterie"}
    say:
      en: >-
        The battery supplies the eclipse load of three and a half watts for about six tenths of
        an hour, just over two watt-hours. However, each eclipse should use only a quarter of
        the battery capacity, a limit known as the depth of discharge. Dividing by this depth of
        discharge and by the discharge efficiency gives a required capacity of eight point eight
        watt-hours, or ten point six with the Phase A margin. The specification should be at
        least eleven watt-hours, and a twenty watt-hour battery gives the operators additional
        flexibility.
      fr: >-
        La batterie assure la charge d’éclipse de trois watts et demi pendant environ six
        dixièmes d’heure, soit un peu plus de deux wattheures. Cependant, chaque éclipse ne doit
        utiliser qu’un quart de la capacité de la batterie, une limite appelée profondeur de
        décharge. En divisant par cette profondeur de décharge et par le rendement de décharge,
        on obtient une capacité nécessaire de huit virgule huit wattheures, ou de dix virgule
        six avec la marge de phase A. La spécification doit être d’au moins onze wattheures, et
        une batterie de vingt wattheures offre une marge de manœuvre supplémentaire aux
        opérateurs.
    do:
      - js: "EX.play('battery', ${say})"

  - id: dod
    title: {en: "Depth of discharge and life", fr: "Profondeur de décharge et durée de vie"}
    say:
      en: >-
        The reason for this limit is cycle life. Each eclipse is a charge cycle, about sixteen
        and a half thousand cycles over three years. A lithium-ion cell discharged to eighty
        percent lasts a few hundred cycles, whereas at twenty-five percent it lasts about twenty
        thousand. The battery therefore meets the requirement. For a mission of several years, a
        depth of discharge of twenty to thirty percent is a suitable starting point; a six-month
        demonstration mission can use a deeper discharge and a smaller battery.
      fr: >-
        Cette limite s’explique par la durée de vie en cycles. Chaque éclipse correspond à un
        cycle de charge, soit environ seize mille cinq cents cycles en trois ans. Une cellule
        lithium-ion déchargée à quatre-vingts pour cent dure quelques centaines de cycles, alors
        qu’à vingt-cinq pour cent, elle en supporte environ vingt mille. La batterie satisfait
        donc l’exigence. Pour une mission de plusieurs années, une profondeur de décharge de
        vingt à trente pour cent constitue un point de départ adapté ; une mission de
        démonstration de six mois peut accepter une décharge plus profonde et une batterie plus
        petite.
    do:
      - js: "EX.play('dod', ${say})"

  - id: failure
    title: {en: "How batteries fail", fr: "Comment les batteries tombent en panne"}
    say:
      en: >-
        Three failure modes influence both the design and operations. The first is thermal
        runaway, in which overcharging or a short circuit heats a cell faster than it can cool;
        the mitigations are fuses, monitoring of individual cell voltages and thermal cut-offs.
        The second is lithium plating: charging below zero degrees causes permanent damage to a
        cell, which is prevented by a heater, a thermostat and a software lockout. The third is
        cell imbalance, since in a series string the weakest cell limits the whole pack.
        Operators encounter all three in the form of limits and automatic responses.
      fr: >-
        Trois modes de défaillance influencent à la fois la conception et l’exploitation. Le
        premier est l’emballement thermique, dans lequel une surcharge ou un court-circuit
        chauffe une cellule plus vite qu’elle ne peut refroidir ; les parades sont les fusibles,
        la surveillance de la tension de chaque cellule et les coupures thermiques. Le deuxième
        est le dépôt de lithium : une charge sous zéro degré endommage définitivement une
        cellule, ce qu’on évite avec un réchauffeur, un thermostat et un blocage logiciel. Le
        troisième est le déséquilibre entre cellules, car dans une chaîne en série, la cellule
        la plus faible limite l’ensemble du pack. Les opérateurs retrouvent ces trois modes sous
        forme de limites et de réponses automatiques.
    do:
      - js: "EX.play('failure', ${say})"
    question:
      type: reflect
      text:
        en: "Run the array and battery sizing for your own mission's worst sunlit mode, eclipse load and lifetime. Which input moves the answer most?"
        fr: "Refaites le dimensionnement des panneaux et de la batterie avec le pire mode éclairé, la charge d’éclipse et la durée de vie de votre mission. Quelle donnée change le plus le résultat ?"
