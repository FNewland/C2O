# Week 5 — LEOP-006: read the unset on-board clock, compute the offset, set it
# from the ground and check the result. From card-LEOP-006. Nominal card.
# Prepares WB-5.5-L006 steps 2–5.
id: V-OPS-08
week: 11
audience: all
title:
  en: "LEOP-006: set the on-board clock"
  fr: "LEOP-006 : régler l’horloge de bord"
summary:
  en: "Request a time report, read the clock's reference and the offset from ground time, set the clock from the ground, and confirm the new reference and the residual."
  fr: "Demander un rapport de temps, lire la référence de l’horloge et son écart avec le temps sol, régler l’horloge depuis le sol, puis confirmer la nouvelle référence et le résidu."
apps:
  mcs: default
fresh_stack: sim
ties:
  worksheets: [WB-5.5-L006, WB-5.5-L006/q2, WB-5.5-L006/q3, WB-5.5-L006/q5]
  cards: [LEOP-006]
sources:
  - sim/configs/eosat1/procedures/leop/time_sync.md (LEOP-006)
  - sim/docs/plan_2026-08c/TIME_ARCHITECTURE.md

setup:
  - api: {app: instructor, method: POST, path: /api/command, json: {type: load_breakpoint, name: card-LEOP-006}}
  - wait: 2
  - python: {call: "video/c2ovideo/helpers.py:ff_to_pass", app: instructor, kwargs: {planner: "${planner_url}", min_duration: 420, min_elevation: 15, after_aos: 10}}
  - api: {app: mcs, method: POST, path: /api/pus-command, json: {service: 3, subtype: 27, data_hex: "0004", name: HK_REQUEST, position: flight_director}}
  - wait: 3
  - goto: {app: mcs, path: "/?lang={lang}&position=flight_director", settle: 4}
  - js: "fetch('/api/logbook', {method: 'DELETE', credentials: 'same-origin'})"
  - reload: 4

steps:
  - id: unset
    title: {en: "Step 2: a clock that was never set", fr: "Étape 2 : une horloge jamais réglée"}
    say:
      en: >-
        Every packet the spacecraft sends is time-stamped on board, so the on-board time must be
        correct before commissioning begins. The operator opens the page for the packet
        utilisation standard, PUS, at service nine, time management, shown as S9 TIME on the
        console, and requests a time report. Since the boot, the on-board clock has been
        counting from the mission epoch, which is noon on the first of January two thousand, and
        it is therefore years behind the ground clock. The time reference reads NONE and the
        time since the last synchronisation reads never synchronised. This is expected, because
        the clock has not yet been set.
      fr: >-
        Chaque paquet émis par le satellite est daté à bord : l’heure de bord doit donc être
        correcte avant le début de la mise en service. L’opérateur ouvre la page de la norme
        d’utilisation des paquets, PUS, au service neuf, gestion du temps, affichée S9 TIME sur
        la console, et demande un rapport de temps. Depuis le démarrage, l’horloge de bord
        compte à partir de l’époque de la mission, le premier janvier deux mille à midi, et elle
        a donc des années de retard sur l’horloge sol. La référence de temps indique NONE et le
        temps depuis la dernière synchronisation indique jamais synchronisée. C’est normal,
        puisque l’horloge n’a pas encore été réglée.
    do:
      - click: {css: "#rail-diag"}
      - wait: 0.8
      - click: {css: "[data-diag='s9']"}
      - wait: 1.0
      - click: {css: "#s9-report"}
      - wait: 2.5
      - highlight: {target: {css: "#diag-s9 table"}, seconds: 4, point: false}
    question:
      type: multichoice
      worksheet: WB-5.5-L006/q2
      text:
        en: "The time reference reads NONE and the offset is years. What does that tell you?"
        fr: "La référence de temps indique NONE et l’écart se compte en années. Qu’est-ce que cela vous apprend ?"
      options:
        - text: {en: "The clock has never been set: it counts from its epoch since boot. Expected at this point.", fr: "L’horloge n’a jamais été réglée : elle compte depuis son époque depuis le démarrage. Normal à ce stade."}
          correct: true
          why: {en: "NONE means never set; GROUND or HOLDOVER would mean drift since a set.", fr: "NONE signifie jamais réglée ; GROUND ou HOLDOVER indiqueraient une dérive depuis un réglage."}
        - text: {en: "The clock has drifted badly: the oscillator has failed.", fr: "L’horloge a fortement dérivé : l’oscillateur est en panne."}
          why: {en: "Drift is measured from a set; there has never been one.", fr: "Une dérive se mesure depuis un réglage ; il n’y en a jamais eu."}
        - text: {en: "The ground clock is wrong.", fr: "L’horloge sol est fausse."}
          why: {en: "The ground clock is the reference the card trusts.", fr: "L’horloge sol est la référence à laquelle la fiche se fie."}

  - id: delta
    title: {en: "Step 3: the offset, light time included", fr: "Étape 3 : l’écart, temps de propagation compris"}
    say:
      en: >-
        Step 3 calculates the offset: the on-board time minus the ground time, corrected for the
        one-way light time, which is the time the report took to reach the ground. The console
        displays both values. In low Earth orbit the light time is only a few milliseconds, well
        below the one-second accuracy this procedure requires, but the method is the same for
        any mission. The Flight Director approves the correction before it is sent.
      fr: >-
        L’étape 3 calcule l’écart : le temps de bord moins le temps sol, corrigé du temps de
        propagation, c’est-à-dire le temps mis par le rapport pour atteindre le sol. La console
        affiche les deux valeurs. En orbite basse, le temps de propagation n’est que de quelques
        millisecondes, bien en dessous de la précision d’une seconde exigée par cette procédure,
        mais la méthode est la même pour toute mission. Le directeur de vol approuve la
        correction avant son envoi.
    do:
      - highlight: {target: {css: "#s9-owlt"}, seconds: 3}
      - highlight: {target: {css: "#s9-dt"}, seconds: 3}

  - id: set
    title: {en: "Step 4: set the clock", fr: "Étape 4 : régler l’horloge"}
    say:
      en: >-
        The operator then sends the time update, S9 subtype one, set time. The Sync time to
        ground button calculates the on-board time code from the ground clock at the moment the
        command is sent, because a time entered earlier would already be out of date. The code
        sent counts from the mission epoch. A Unix timestamp, which counts from nineteen
        seventy, would place the spacecraft clock decades out.
      fr: >-
        L’opérateur envoie ensuite la mise à l’heure, S9 sous-type un, réglage de l’heure. Le
        bouton Synchro sur le sol calcule le code temporel de bord à partir de l’horloge sol au
        moment de l’envoi, car une heure saisie plus tôt serait déjà périmée. Le code envoyé
        compte depuis l’époque de la mission. Un horodatage Unix, qui compte depuis mille neuf
        cent soixante-dix, décalerait l’horloge du satellite de plusieurs décennies.
    do:
      - highlight: {target: {css: "#s9-sync"}, seconds: 2}
      - click: {css: "#s9-sync"}
      - wait: 1.5
      - highlight: {target: {css: "#s9-preview"}, seconds: 3.5}

  - id: verify
    title: {en: "Step 5: check the result", fr: "Étape 5 : vérifier le résultat"}
    say:
      en: >-
        A second time report is then requested. The reference now reads GROUND, the time since
        synchronisation restarts from zero, and the offset is a fraction of a second, within the
        one-second threshold. The operator records the residual. Step 6a must not be omitted: it
        enables the GPS navigation report, structure identifier twelve, or SID twelve, without
        which the next procedure would have no navigation data. Once the receiver has a position
        fix, the clock can be disciplined, that is, continuously adjusted, to GPS time, and
        initial orbit determination completes the launch and early orbit phase, LEOP.
      fr: >-
        Un second rapport de temps est ensuite demandé. La référence indique maintenant GROUND,
        le temps depuis la synchronisation repart de zéro, et l’écart n’est plus qu’une fraction
        de seconde, sous le seuil d’une seconde. L’opérateur consigne le résidu. L’étape 6a ne
        doit pas être omise : elle active le rapport de navigation GPS, identifiant de structure
        douze, ou SID douze, sans lequel la procédure suivante n’aurait aucune donnée de
        navigation. Dès que le récepteur dispose d’un point, l’horloge peut être asservie,
        c’est-à-dire ajustée en continu, au temps GPS, et la restitution d’orbite initiale clôt
        la phase de lancement et de début d’orbite, la LEOP.
    do:
      - click: {css: "#s9-report"}
      - wait: 3.0
      - highlight: {target: {css: "#diag-s9 table"}, seconds: 4, point: false}
    question:
      type: truefalse
      worksheet: WB-5.5-L006/q5
      answer: true
      text:
        en: "After the set, the time reference should read GROUND and the residual offset be below 1 s."
        fr: "Après le réglage, la référence de temps doit indiquer GROUND et l’écart résiduel être inférieur à 1 s."
