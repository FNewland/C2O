# Concept explainer — what a packet is, what the PUS services are, and how
# housekeeping reports work (requested vs enabled; powering a unit does not
# switch its report on). Animated page video/explainers/packets.html.
# Team audience. No embedded question asks which SID carries a parameter
# (WB-5.4-Q has a "limits and SIDs" category).
id: V-CON-05
week: 8
audience: all
title:
  en: "Packets, services and housekeeping"
  fr: "Paquets, services et données de servitude"
summary:
  en: "Everything on the link is a packet: its headers, the application ID that tells bootloader from application, the service and subtype that say what a packet is, its on-board time stamp, and the housekeeping reports, requested once or enabled to repeat."
  fr: "Tout ce qui passe sur la liaison est un paquet : ses en-têtes, l’identifiant d’application qui distingue le chargeur d’amorçage de l’application, le service et le sous-type qui disent ce qu’est un paquet, sa date de bord, et les rapports de servitude, demandés une fois ou activés pour se répéter."
apps:
  viz: default
fresh_stack: viz
ties: {}
sources:
  - sim/docs/PUS_SERVICE_REFERENCE.md (Service Overview; Service 3)
  - sim/packages/smo-common/src/smo_common/protocol/ecss_packet.py (header sizes, CUC, epoch)
  - design/docs/oer/chapters/17_ground_segment.md (§ 17.3)

setup:
  - goto: {app: viz, path: "/video/explainers/packets.html?lang={lang}", settle: 1.5}

steps:
  - id: packet
    title: {en: "The structure of a packet", fr: "La structure d’un paquet"}
    say:
      en: >-
        Every telecommand sent to the spacecraft and every report it returns is a packet: a
        CCSDS space packet, defined by the Consultative Committee for Space Data Systems and
        used by almost every mission. A packet has four parts: a primary header, a secondary
        header, the data field, and finally a cyclic redundancy check, or CRC, two octets that
        allow the receiver to reject a packet that has been corrupted in transmission.
      fr: >-
        Chaque télécommande envoyée au satellite et chaque rapport qu’il renvoie est un paquet :
        un paquet spatial CCSDS, défini par le Comité consultatif pour les systèmes de données
        spatiales et utilisé par presque toutes les missions. Un paquet comprend quatre parties
        : un en-tête primaire, un en-tête secondaire, le champ de données et, enfin, un contrôle
        de redondance cyclique, ou CRC, deux octets qui permettent au récepteur de rejeter un
        paquet altéré pendant la transmission.
    do:
      - js: "EX.play('packet', ${say})"

  - id: primary
    title: {en: "The primary header", fr: "L’en-tête primaire"}
    say:
      en: >-
        The primary header is six octets long. It indicates whether the packet is telemetry, TM,
        sent to the ground, or a telecommand, TC, sent to the spacecraft. It also carries the
        application process identifier, or APID, which identifies the on-board source. On
        EOSAT-1, zero zero two is the bootloader and zero zero one is the application software,
        so a change in traffic from two to one shows that the computer has booted. A sequence
        count increases by one with each packet, so a gap in the count means that a packet has
        been lost.
      fr: >-
        L’en-tête primaire compte six octets. Il indique si le paquet est de la télémesure, TM,
        envoyée au sol, ou une télécommande, TC, envoyée au satellite. Il contient aussi
        l’identifiant de processus applicatif, ou APID, qui désigne la source à bord. Sur
        EOSAT-1, zéro zéro deux correspond au chargeur d’amorçage et zéro zéro un au logiciel
        applicatif : le passage du trafic de deux à un montre donc que l’ordinateur a démarré.
        Un compteur de séquence augmente d’une unité à chaque paquet : une interruption dans le
        compte signifie qu’un paquet a été perdu.
    do:
      - js: "EX.play('primary', ${say})"
    question:
      type: multichoice
      text:
        en: "During first contact the packets switch from APID 0x002 to APID 0x001. What does that tell you?"
        fr: "Au premier contact, les paquets passent de l’APID 0x002 à l’APID 0x001. Qu’est-ce que cela vous apprend ?"
      options:
        - text: {en: "The on-board computer has left the bootloader and the application software is running.", fr: "L’ordinateur de bord a quitté le chargeur d’amorçage et le logiciel d’application tourne."}
          correct: true
          why: {en: "0x002 is the bootloader's APID, 0x001 the application's.", fr: "0x002 est l’APID du chargeur, 0x001 celui de l’application."}
        - text: {en: "A second ground station has taken over the pass.", fr: "Une seconde station sol a pris le relais du passage."}
          why: {en: "The APID names the sender on board, not the station.", fr: "L’APID désigne l’émetteur à bord, pas la station."}
        - text: {en: "Packets were lost.", fr: "Des paquets ont été perdus."}
          why: {en: "Loss shows as a gap in the sequence count.", fr: "Une perte se voit comme un trou dans le compteur de séquence."}

  - id: secondary
    title: {en: "The secondary header: type and time", fr: "L’en-tête secondaire : type et heure"}
    say:
      en: >-
        The secondary header is defined by the packet utilisation standard, PUS, published by
        the European Cooperation for Space Standardization, or ECSS. Its main fields are the
        service and the subtype, two numbers that identify the type of packet; three comma
        twenty-five, for example, is a housekeeping report. Telemetry packets also carry a time
        stamp from the spacecraft clock, giving the on-board time in seconds and fractions of a
        second since the mission epoch. This is why the clock-setting procedure is important.
      fr: >-
        L’en-tête secondaire est défini par la norme d’utilisation des paquets, PUS, publiée par
        la Coopération européenne pour la normalisation spatiale, ou ECSS. Ses principaux champs
        sont le service et le sous-type, deux nombres qui identifient le type de paquet ; trois
        virgule vingt-cinq, par exemple, est un rapport de servitude. Les paquets de télémesure
        portent aussi une date fournie par l’horloge du satellite, qui donne le temps de bord en
        secondes et fractions de seconde depuis l’époque de la mission. C’est pourquoi la
        procédure de mise à l’heure est importante.
    do:
      - js: "EX.play('secondary', ${say})"

  - id: services
    title: {en: "The services", fr: "Les services"}
    say:
      en: >-
        A service is a family of related packets, and the procedures in this course use about a
        dozen of them. Service one verifies every command. Service three handles housekeeping.
        Service eight runs on-board functions and covers most of the commands sent. Service nine
        sets the time. Service twelve monitors parameters on board, and service nineteen
        responds to events. A procedure step written as three comma twenty-seven therefore means
        service three, subtype twenty-seven.
      fr: >-
        Un service est une famille de paquets apparentés, et les procédures de ce cours en
        utilisent une douzaine. Le service un vérifie chaque commande. Le service trois gère les
        données de servitude. Le service huit exécute des fonctions de bord et couvre la plupart
        des commandes envoyées. Le service neuf règle l’heure. Le service douze surveille des
        paramètres à bord, et le service dix-neuf réagit aux événements. Une étape de procédure
        notée trois virgule vingt-sept signifie donc service trois, sous-type vingt-sept.
    do:
      - js: "EX.play('services', ${say})"

  - id: hk
    title: {en: "Housekeeping: one structure per subsystem", fr: "Servitude : une structure par sous-système"}
    say:
      en: >-
        Housekeeping, or HK, is the routine health data of the spacecraft. Each subsystem has
        its own report structure, designated by a structure identifier, or SID, and each is
        generated at its own rate: power every second, attitude every four seconds and thermal
        once a minute. The beacon report is the only one the bootloader sends. The data field of
        each report contains the parameters displayed on the console pages.
      fr: >-
        Les données de servitude, ou HK, sont les données de santé courantes du satellite.
        Chaque sous-système possède sa propre structure de rapport, désignée par un identifiant
        de structure, ou SID, et chacune est générée à son propre rythme : l’énergie chaque
        seconde, l’attitude toutes les quatre secondes et le thermique une fois par minute. Le
        rapport de balise est le seul qu’envoie le chargeur d’amorçage. Le champ de données de
        chaque rapport contient les paramètres affichés sur les pages de la console.
    do:
      - js: "EX.play('hk', ${say})"

  - id: request
    title: {en: "Single requests and periodic reports", fr: "Demandes ponctuelles et rapports périodiques"}
    say:
      en: >-
        A report can be obtained in two ways. A request, three comma twenty-seven, returns a
        single snapshot immediately and nothing further. Enabling the report, three comma five,
        makes it repeat automatically at its own rate until it is disabled. Procedures request a
        report when they need a single current reading, and enable it when the following steps
        depend on it.
      fr: >-
        Un rapport peut être obtenu de deux façons. Une demande, trois virgule vingt-sept,
        renvoie immédiatement un seul instantané, sans suite. L’activation du rapport, trois
        virgule cinq, le fait revenir automatiquement à son propre rythme jusqu’à sa
        désactivation. Les procédures demandent un rapport lorsqu’elles ont besoin d’une seule
        lecture à jour, et l’activent lorsque les étapes suivantes en dépendent.
    do:
      - js: "EX.play('request', ${say})"

  - id: power
    title: {en: "A powered unit is not necessarily reporting", fr: "Un équipement alimenté ne transmet pas forcément"}
    say:
      en: >-
        New teams frequently overlook one point: switching on a unit does not enable its report.
        After the attitude units are powered, structure two remains silent, and the attitude
        page continues to show old or missing values. A separate command is required, the
        housekeeping enable for SID two. Once it is sent, the reports arrive and the following
        steps can be verified.
      fr: >-
        Les nouvelles équipes négligent souvent un point : la mise sous tension d’une unité
        n’active pas son rapport. Une fois les unités d’attitude alimentées, la structure deux
        reste muette, et la page attitude continue d’afficher des valeurs anciennes ou absentes.
        Une commande distincte est nécessaire : l’activation de la servitude pour le SID deux.
        Une fois cette commande envoyée, les rapports arrivent et les étapes suivantes peuvent
        être vérifiées.
    do:
      - js: "EX.play('power', ${say})"
    question:
      type: truefalse
      answer: false
      text:
        en: "Once EPS_POWER_ON has powered a unit's line, that unit's housekeeping report starts on its own."
        fr: "Une fois la ligne d’une unité alimentée par EPS_POWER_ON, le rapport de servitude de cette unité démarre tout seul."
