# Week 2 — SpaceCDF Requirements tab: the SMART check and its findings, making
# a requirement measurable (threshold), linking an orphan to its parent, a
# flow-down, and the traceability view. Prepares LW-2.1/B and LW-2.1/C and
# the decision records D-2.1-QUALITY and D-2.1-FLOWDOWN. Follows V-DES-04.
id: V-SCDF-04
week: 2
audience: all
title:
  en: "Requirements in SpaceCDF"
  fr: "Les exigences dans SpaceCDF"
summary:
  en: "Check your requirements in SpaceCDF: run the SMART check and read its findings, add a threshold so a requirement becomes measurable, link an orphan to its parent, flow a requirement down, and follow the chain in the traceability view."
  fr: "Vérifier vos exigences dans SpaceCDF : lancer le contrôle SMART et lire ses constats, ajouter un seuil pour rendre une exigence mesurable, rattacher une orpheline à son parent, décliner une exigence, et suivre la chaîne dans la vue de traçabilité."
apps:
  spacecdf: default
ties:
  worksheets: [LW-2.1/B, LW-2.1/C]
  decisions: [D-2.1-QUALITY, D-2.1-FLOWDOWN]
sources:
  - design/frontend/src/workbench/RequirementsPanel.tsx
  - design/packages/spacecdf-server/src/spacecdf_server/services/requirement_engine.py (validate_smart)
  - design/docs/oer/chapters/05_requirements.md (§ 5.2–5.4)

setup:
  - python: {call: "video/c2ovideo/helpers.py:seed_spacecdf_eosat", app: spacecdf, save: study}
  - goto: {app: spacecdf, path: "/?study=${study}&lang={lang}", settle: 2}
  - fill: {target: "input", text: {en: "Ava (Systems)", fr: "Ava (Systèmes)"}}
  - click: {target: {role: button, name: Join, exact: true}, instant: true}
  - wait: 2

steps:
  - id: tab
    title: {en: "The Requirements tab", fr: "L’onglet Exigences"}
    say:
      en: >-
        The Requirements tab lists one requirement per line, with its identifier, its type, the
        text, the verification method, its status and the parent requirement from which it is
        derived. This study contains one mission requirement, three system requirements and two
        subsystem requirements. The systems engineer is responsible for this list.
      fr: >-
        L’onglet Exigences présente une exigence par ligne, avec son identifiant, son type, le
        texte, la méthode de vérification, son état et l’exigence parente dont elle découle.
        Cette étude comprend une exigence de mission, trois exigences système et deux exigences
        de sous-système. L’ingénieur système est responsable de cette liste.
    do:
      - click: {role: tab, name: Requirements, exact: true}
      - wait: 1.2
      - highlight: {target: {css: ".c2o-reqs__row:has-text('SR-002')"}, seconds: 3}

  - id: smart
    title: {en: "Run the SMART check", fr: "Lancer le contrôle SMART"}
    say:
      en: >-
        The SMART Check button tests each requirement: whether it uses the word shall, whether
        it has a measurable threshold, and whether it traces to an objective or a parent
        requirement. Under each line, the tool states what is missing. Most of these
        requirements are not measurable: the value appears in the text, but not as a threshold
        the tools can check. In addition, SR-003, the mass limit, is an orphan, because nothing
        records why it exists.
      fr: >-
        Le bouton Contrôle SMART teste chaque exigence : emploie-t-elle le mot « doit »,
        comporte-t-elle un seuil mesurable, et se rattache-t-elle à un objectif ou à une
        exigence parente ? Sous chaque ligne, l’outil indique ce qui manque. La plupart de ces
        exigences ne sont pas mesurables : la valeur figure dans le texte, mais pas sous forme
        de seuil que les outils peuvent vérifier. De plus, SR-003, la limite de masse, est
        orpheline, car rien n’indique pourquoi elle existe.
    do:
      - click: {role: button, name: "SMART Check"}
      - wait: 2
      - highlight: {target: {css: ".c2o-reqs__row:has-text('SR-001') + .c2o-reqs__smart"}, seconds: 2.5}
      - highlight: {target: {css: ".c2o-reqs__row:has-text('SR-003')"}, seconds: 3}

  - id: threshold
    title: {en: "Make it measurable", fr: "La rendre mesurable"}
    say:
      en: >-
        The operator edits SR-003. The text remains unchanged, and a testable threshold is
        added: less than or equal to twelve kilograms, verified by inspection, that is, by
        weighing the spacecraft. Once the change is saved, the mass budget can be checked
        automatically against this requirement.
      fr: >-
        L’opérateur modifie SR-003. Le texte reste inchangé, et un seuil vérifiable est ajouté :
        inférieur ou égal à douze kilogrammes, vérifié par inspection, c’est-à-dire par la pesée
        du satellite. Une fois la modification enregistrée, le bilan de masse peut être comparé
        automatiquement à cette exigence.
    do:
      - click: {role: button, name: edit, exact: true, within: ".c2o-reqs__row:has-text('SR-003')"}
      - wait: 0.8
      - select: {target: {label: Operator, exact: true}, value: "<="}
      - fill: {target: {label: Threshold, exact: true}, text: "12", typed: true}
      - highlight: {target: {label: "Verification method", exact: true, within: "form[aria-label^='Edit'], form[aria-label^='Modifier']"}, seconds: 2}
      - click: {role: button, name: Save, exact: true, within: "form[aria-label^='Edit'], form[aria-label^='Modifier']"}
      - wait: 2

  - id: parent
    title: {en: "Link the orphan", fr: "Rattacher l’orpheline"}
    say:
      en: >-
        SR-003 is then given a parent. The mass limit is set by the launch opportunity, which
        supports the mission requirement, so it is linked to MR-001. The check runs again
        automatically, and SR-003 now passes. Every requirement below mission level should trace
        upwards in this way; an orphan requirement is either missing its justification or should
        not be in the specification.
      fr: >-
        On attribue ensuite un parent à SR-003. La limite de masse découle de l’occasion de
        lancement, qui sert l’exigence de mission : elle est donc rattachée à MR-001. Le
        contrôle se relance automatiquement et SR-003 est maintenant conforme. Toute exigence
        sous le niveau mission doit remonter ainsi ; une exigence orpheline soit manque de
        justification, soit n’a pas sa place dans la spécification.
    do:
      - click: {css: ".c2o-reqs__row:has-text('SR-003') .c2o-reqs__orphan"}
      - wait: 0.8
      - fill: {target: {role: textbox, within: "[role=dialog]"}, text: "MR-001", typed: true}
      - click: {role: button, name: OK, exact: true, within: "[role=dialog]"}
      - wait: 3
      - highlight: {target: {css: ".c2o-reqs__row:has-text('SR-003')"}, seconds: 3}
    question:
      type: multichoice
      worksheet: LW-2.1/B
      text:
        en: "SR-001 says “downlink 2 GB of payload data per day”, but the check says it is not measurable. What fixes that?"
        fr: "SR-001 dit « transmettre 2 Go de données de charge utile par jour », mais le contrôle la dit non mesurable. Qu’est-ce qui corrige cela ?"
      options:
        - text: {en: "Add the threshold: ≥ 2 GB per day, so tools can check the data budget against it.", fr: "Ajouter le seuil : ≥ 2 Go par jour, pour que les outils puissent y comparer le bilan de données."}
          correct: true
          why: {en: "A number in the text is for people; the threshold is what the analyses can test.", fr: "Un nombre dans le texte est pour les personnes ; le seuil est ce que les analyses peuvent tester."}
        - text: {en: "Change the verification method to Test.", fr: "Changer la méthode de vérification pour Essai."}
          why: {en: "The method says how it will be verified, not what the pass mark is.", fr: "La méthode dit comment elle sera vérifiée, pas quel est le seuil de réussite."}
        - text: {en: "Mark it Approved.", fr: "La marquer Approuvée."}
          why: {en: "Status records a review decision; it does not make the requirement measurable.", fr: "L’état consigne une décision de revue ; il ne rend pas l’exigence mesurable."}

  - id: flowdown
    title: {en: "Flow a requirement down", fr: "Décliner une exigence"}
    say:
      en: >-
        Requirements are flowed down to lower levels. The Flow button on SR-002, the pointing
        accuracy requirement, creates a new requirement already marked as derived from SR-002:
        in this case, the attitude knowledge that the star tracker must provide, verified by
        test. The requirement tree grows one level at a time, and each child requirement retains
        the link to the parent that justifies it.
      fr: >-
        Les exigences se déclinent vers les niveaux inférieurs. Le bouton Décliner sur SR-002,
        l’exigence de précision de pointage, crée une nouvelle exigence déjà marquée comme
        dérivée de SR-002 : ici, la connaissance d’attitude que doit fournir le senseur
        stellaire, vérifiée par essai. L’arbre des exigences se développe un niveau à la fois,
        et chaque exigence enfant conserve le lien vers le parent qui la justifie.
    do:
      - click: {role: button, name: "flow ↓", exact: true, within: ".c2o-reqs__row:has-text('SR-002')"}
      - wait: 0.8
      - fill:
          target: {label: "Requirement text", exact: true, within: "form[aria-label='Add requirement'], form[aria-label='Ajouter une exigence']"}
          text:
            en: "The AOCS shall know the attitude to 0.02° (3σ)."
            fr: "Le SCAO doit connaître l’attitude à 0,02° (3σ)."
          typed: true
      - select: {target: {label: "Verification method", exact: true, within: "form[aria-label='Add requirement'], form[aria-label='Ajouter une exigence']"}, value: "T"}
      - click: {role: button, name: Add, exact: true, within: "form[aria-label='Add requirement'], form[aria-label='Ajouter une exigence']"}
      - wait: 2

  - id: trace
    title: {en: "Follow the chain", fr: "Suivre la chaîne"}
    say:
      en: >-
        The Traceability tab presents the whole V: the objectives, the chain of requirements,
        the elements and functions that satisfy them, and the verification method for each.
        Requirements without an objective are listed, which shows where the chain is broken.
        Back in the Requirements tab, the team records the quality decision: which requirements
        were rewritten, split or removed, and why.
      fr: >-
        L’onglet Traçabilité présente l’ensemble du V : les objectifs, la chaîne des exigences,
        les éléments et fonctions qui les satisfont, et la méthode de vérification de chacune.
        Les exigences sans objectif sont listées, ce qui montre où la chaîne est rompue. De
        retour dans l’onglet Exigences, l’équipe consigne la décision de qualité : quelles
        exigences ont été réécrites, scindées ou supprimées, et pourquoi.
    do:
      - click: {role: tab, name: Traceability, exact: true}
      - wait: 1.5
      - highlight: {target: {text: "V-Model Traceability", exact: true}, seconds: 3}
      - click: {role: tab, name: Requirements, exact: true}
      - wait: 1.0
      - click: {role: button, name: "SMART Check"}
      - wait: 1.5
      - highlight: {target: {css: "[role=status] button"}, seconds: 2.5}
    question:
      type: reflect
      worksheet: LW-2.1/C
      text:
        en: "Pick one of your system requirements. Name its parent, one child it flows down to, and the threshold that makes it measurable."
        fr: "Choisissez une de vos exigences système. Nommez son parent, un enfant vers lequel elle se décline, et le seuil qui la rend mesurable."
