# Week 5 — mass and power budgets with margins, power by mode and energy per orbit,
# on an EOSAT-1-like study seeded through the API. Prepares LW-2.4 A, B, E and
# the decision records D-2.4-MASS / D-2.4-POWER.
id: V-SCDF-02
week: 4
audience: all
title:
  en: "Budgets, margins and energy per orbit"
  fr: "Bilans, marges et énergie par orbite"
summary:
  en: "Read the mass and power budgets with their maturity and system margins, set allocations, then check power by mode and the energy balance over one orbit."
  fr: "Lire les bilans de masse et de puissance avec leurs marges de maturité et de système, fixer les allocations, puis vérifier la puissance par mode et le bilan d’énergie sur une orbite."
apps:
  spacecdf: default
ties:
  worksheets: [LW-2.4/A, LW-2.4/B, LW-2.4/E]
  decisions: [D-2.4-MASS, D-2.4-POWER]
sources:
  - design/tests/test_api/diagram_seed.py (the EOSAT-1-like study)
  - design/configs/margin_policy.yaml (textbook Table 8.3 ladder: 20 / 15 / 10 %)
  - design/docs/oer/chapters/08_architecture_interfaces_budgets.md (§ 8.4.2, Table 8.3)

setup:
  - python: {call: "video/c2ovideo/helpers.py:seed_spacecdf_eosat", app: spacecdf, save: study}
  - goto: {app: spacecdf, path: "/?study=${study}&lang={lang}", settle: 2}
  - fill: {target: "input", text: {en: "Ava (Systems)", fr: "Ava (Systèmes)"}}
  - click: {target: {role: button, name: Join, exact: true}, instant: true}
  - wait: 2

steps:
  - id: mass
    title: {en: "The mass budget and its margins", fr: "Le bilan de masse et ses marges"}
    say:
      en: >-
        The Budget tab shows the mass budget. The bar represents the current best estimate of
        the mass. The hatched section is the maturity margin: each component carries a margin
        that reflects how well it is known, ranging from a catalogue item with flight heritage
        to a new design. In addition, there is a system margin held by the team as a whole, set
        at twenty percent at the first review, the mission definition review, or MDR, as given
        in Table 8.3 of the textbook.
      fr: >-
        L’onglet Bilans présente le bilan de masse. La barre représente la meilleure estimation
        actuelle de la masse. La partie hachurée correspond à la marge de maturité : chaque
        composant porte une marge qui reflète son degré de connaissance, d’un article de
        catalogue ayant déjà volé à une conception nouvelle. S’y ajoute une marge système
        détenue par l’équipe dans son ensemble, fixée à vingt pour cent lors de la première
        revue, la revue de définition de la mission, ou MDR, conformément au tableau 8.3 du
        manuel.
    do:
      - click: {role: tab, name: Budget}
      - wait: 1.0
      - highlight: {target: {css: "main [class*='bar'] >> nth=0"}, seconds: 3, point: false}
      - highlight: {target: {css: "main :text-matches('System margin at|Marge système à')"}, seconds: 3}
    question:
      type: multichoice
      worksheet: LW-2.4/A
      text:
        en: "The system margin is 20 % at the mission definition review (MDR). What happens to it at later reviews?"
        fr: "La marge système est de 20 % à la revue de définition de la mission (MDR). Que devient-elle aux revues suivantes ?"
      options:
        - text: {en: "It shrinks as the estimates mature: 15 % at the preliminary design review (PDR), 10 % at the critical design review (CDR).", fr: "Elle diminue à mesure que les estimations mûrissent : 15 % à la revue de conception préliminaire (PDR), 10 % à la revue critique de conception (CDR)."}
          correct: true
          why: {en: "Table 8.3: 20 % in Phases 0 and A (MDR, PRR), 15 % in Phase B (SRR, PDR), 10 % at CDR, 5 % in Phase D.", fr: "Tableau 8.3 : 20 % en phases 0 et A (MDR, PRR), 15 % en phase B (SRR, PDR), 10 % à la CDR, 5 % en phase D."}
        - text: {en: "It stays at 20 % until launch.", fr: "Elle reste à 20 % jusqu’au lancement."}
          why: {en: "Margins are released as uncertainty falls.", fr: "Les marges sont libérées à mesure que l’incertitude baisse."}
        - text: {en: "It grows, because more equipment is added later.", fr: "Elle augmente, car on ajoute de l’équipement plus tard."}
          why: {en: "Added equipment raises the estimate, not the margin.", fr: "L’équipement ajouté augmente l’estimation, pas la marge."}

  - id: allocate
    title: {en: "Allocations", fr: "Les allocations"}
    say:
      en: >-
        An estimate states the current mass of the design, whereas an allocation states the mass
        that each element is permitted. The Allocate function assigns each unallocated element
        its estimate plus ten percent, which the team then uses as the starting point for
        negotiation. When an estimate exceeds its allocation, the bar shows this immediately.
      fr: >-
        Une estimation indique la masse actuelle de la conception, alors qu’une allocation
        indique la masse autorisée pour chaque élément. La fonction Allouer attribue à chaque
        élément non alloué son estimation plus dix pour cent, qui sert ensuite de point de
        départ à la négociation au sein de l’équipe. Lorsqu’une estimation dépasse son
        allocation, la barre le signale immédiatement.
    do:
      - click: {css: "main button:has-text('+10 %')"}
      - wait: 1.5
      - highlight: {target: {css: "main :text-matches('By element|Par élément')"}, seconds: 3}

  - id: power
    title: {en: "Power: orbit average and peak", fr: "Puissance : moyenne orbitale et crête"}
    say:
      en: >-
        The Power view adds two important values: the orbit-average power, averaged over
        sunlight and eclipse, which determines the energy balance, and the peak power, which
        sizes the power distribution. The solar array itself is sized on the most demanding
        sunlit mode. All these values are derived from the operating modes. The team records the
        reasons for the choice of modes and margin as decision D two point four, Power.
      fr: >-
        La vue Puissance ajoute deux valeurs importantes : la puissance moyenne sur l’orbite,
        moyennée sur l’ensoleillement et l’éclipse, qui détermine le bilan d’énergie, et la
        puissance de crête, qui dimensionne la distribution de puissance. Le générateur solaire,
        lui, est dimensionné sur le mode ensoleillé le plus exigeant. Toutes ces valeurs
        découlent des modes de fonctionnement. L’équipe consigne les raisons du choix des modes
        et de la marge dans la décision D deux point quatre, Puissance.
    do:
      - click: {role: tab, name: Power, exact: true}
      - wait: 1.2
      - highlight: {target: {css: "main :text-matches('Orbit average|Moyenne orbitale')"}, seconds: 3}
      - highlight: {target: {css: "[data-decision='D-2.4-POWER']"}, seconds: 2.5}

  - id: modes
    title: {en: "Power by mode", fr: "Puissance par mode"}
    say:
      en: >-
        The Modes tab shows the origin of these values. The power-by-mode table lists every unit
        in every mode, with its power and its state: off, standby, on or peak. For example, the
        imager draws sixteen watts only in imaging mode, and the transceiver reaches a peak of
        nineteen watts during downlink. The power budget is derived from this table.
      fr: >-
        L’onglet Modes montre l’origine de ces valeurs. Le tableau de puissance par mode liste
        chaque unité dans chaque mode, avec sa puissance et son état : éteinte, en veille,
        allumée ou en crête. Par exemple, l’imageur ne consomme seize watts qu’en mode imagerie,
        et l’émetteur-récepteur atteint une crête de dix-neuf watts en liaison descendante. Le
        bilan de puissance est établi à partir de ce tableau.
    do:
      - click: {role: tab, name: Modes, exact: true}
      - wait: 1.0
      - click: {role: tab, name: Power by mode}
      - wait: 1.5
      - highlight: {target: {css: "main table >> nth=0"}, seconds: 3.5, point: false}

  - id: energy
    title: {en: "Energy per orbit", fr: "Énergie par orbite"}
    say:
      en: >-
        The energy-per-orbit view completes the analysis. For each mode, it compares the load,
        including margins, with the power the array generates in the attitude used in that mode,
        and determines whether the spacecraft could remain in that mode for a complete orbit.
        The nominal mode is sustainable. The imaging and downlink modes are not, because they
        discharge the battery; this is acceptable for a few minutes but not for a full orbit.
        This check corresponds to Part E of the worksheet, the budget health check.
      fr: >-
        La vue d’énergie par orbite complète l’analyse. Pour chaque mode, elle compare la
        charge, marges comprises, à la puissance produite par le générateur dans l’attitude
        propre à ce mode, et détermine si le satellite pourrait rester dans ce mode pendant une
        orbite complète. Le mode nominal est tenable. Les modes imagerie et liaison descendante
        ne le sont pas, car ils déchargent la batterie ; c’est acceptable pendant quelques
        minutes, mais pas pendant une orbite entière. Cette vérification correspond à la partie
        E de la fiche, le contrôle de l’état des bilans.
    do:
      - click: {role: tab, name: Energy per orbit}
      - wait: 1.5
      - wait: 1.0
      - highlight: {target: {css: "main table >> nth=0"}, seconds: 4, point: false}
    question:
      type: reflect
      worksheet: LW-2.4/E
      text:
        en: "In your own design, which budget has the least margin today, and what is the first change you would try?"
        fr: "Dans votre propre conception, quel bilan a le moins de marge aujourd’hui, et quelle est la première modification que vous essaieriez ?"
