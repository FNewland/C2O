# Design concept — choosing an orbit: altitude, period, speed and the
# Sun-synchronous inclination; eclipse against beta; the 400/500/600 km trade
# (lifetime, disposal rule, passes, resolution, dose); ground track, swath and
# station contact; radiation and the South Atlantic Anomaly.
# Animated page video/explainers/orbit.html. Whole design team.
# Numbers computed from the textbook's constants (ch. 7): 500 km gives
# T 94.6 min, v 7.61 km/s, i 97.40°, beta* 68.0°, eclipse at beta 0 37.8 %
# (35.8 min), 23.7° track shift, 7.4 min longest pass at a 10° mask.
# EOSAT-1 orbit from sim/configs/eosat1/orbit.yaml (513 km, 97.39°, LTAN ~10:00).
id: V-DES-05
week: 2
audience: all
title:
  en: "Choosing an orbit"
  fr: "Choisir une orbite"
summary:
  en: "What the orbit decides: period and speed, Sun-synchronous orbits, eclipse and the beta angle, the altitude trade between lifetime, debris rules, links, resolution and radiation, ground coverage and passes, and the South Atlantic Anomaly."
  fr: "Ce que l’orbite décide : période et vitesse, orbites héliosynchrones, éclipse et angle bêta, le compromis d’altitude entre durée de vie, règles sur les débris, liaisons, résolution et rayonnement, couverture au sol et passages, et l’Anomalie de l’Atlantique Sud."
apps:
  viz: default
fresh_stack: viz
ties: {}
sources:
  - design/docs/oer/chapters/07_orbit_and_environment.md (§ 7.1–7.4, 7.6)
  - sim/configs/eosat1/orbit.yaml

setup:
  - goto: {app: viz, path: "/video/explainers/orbit.html?lang={lang}", settle: 1.5}

steps:
  - id: size
    title: {en: "Altitude, period and speed", fr: "Altitude, période et vitesse"}
    say:
      en: >-
        The orbit is the most far-reaching early design decision: it reaches every subsystem. For
        a circular orbit, the altitude sets everything else. At five hundred kilometres, one orbit
        takes about ninety-five minutes, at seven point six kilometres per second. Tilt the orbit
        to ninety-seven point four degrees, and the Earth's equatorial bulge turns the orbit plane
        once a year, so the satellite crosses the equator at the same local time every day: a
        Sun-synchronous orbit. EOSAT-1 flies one, at about five hundred and thirteen kilometres.
      fr: >-
        L’orbite est la décision de conception la plus lourde de conséquences au début : elle
        touche tous les sous-systèmes. Pour une orbite circulaire, l’altitude fixe tout le reste.
        À cinq cents kilomètres, une orbite dure environ quatre-vingt-quinze minutes, à sept
        virgule six kilomètres par seconde. Inclinez l’orbite à quatre-vingt-dix-sept virgule
        quatre degrés, et le renflement équatorial de la Terre fait tourner le plan de l’orbite
        une fois par an : le satellite passe l’équateur chaque jour à la même heure locale. C’est
        une orbite héliosynchrone. EOSAT-1 en suit une, à environ cinq cent treize kilomètres.
    do:
      - js: "EX.play('size', ${say})"

  - id: eclipse
    title: {en: "Eclipse and the beta angle", fr: "L’éclipse et l’angle bêta"}
    say:
      en: >-
        How long the satellite spends in the Earth's shadow depends on beta, the angle between the
        Sun and the orbit plane. With the Sun in the plane, beta zero, the eclipse is longest:
        thirty-eight percent of the orbit, about thirty-six minutes at five hundred kilometres.
        Beyond about sixty-eight degrees, the orbit never enters the shadow. EOSAT-1 sits near
        minus thirty degrees, with about thirty-four minutes. Size the battery for beta zero,
        unless you know your orbit never gets there.
      fr: >-
        Le temps passé dans l’ombre de la Terre dépend de bêta, l’angle entre le Soleil et le
        plan de l’orbite. Avec le Soleil dans le plan, bêta nul, l’éclipse est la plus longue :
        trente-huit pour cent de l’orbite, environ trente-six minutes à cinq cents kilomètres.
        Au-delà d’environ soixante-huit degrés, l’orbite n’entre jamais dans l’ombre. EOSAT-1 se
        trouve vers moins trente degrés, avec environ trente-quatre minutes. Dimensionnez la
        batterie pour bêta nul, sauf si vous savez que votre orbite n’y arrive jamais.
    do:
      - js: "EX.play('eclipse', ${say})"
    question:
      type: multichoice
      text:
        en: "A dawn–dusk Sun-synchronous orbit has beta near 90°. What does that do to the power design?"
        fr: "Une orbite héliosynchrone aube-crépuscule a un bêta proche de 90°. Quel effet sur la conception énergétique ?"
      options:
        - text: {en: "Almost no eclipse, so the battery is sized by other loads, not by a long shadow every orbit.", fr: "Presque pas d’éclipse : la batterie se dimensionne sur d’autres charges, pas sur une longue ombre à chaque orbite."}
          correct: true
          why: {en: "Beyond beta* (about 68° at 500 km) the orbit stays sunlit.", fr: "Au-delà de bêta* (environ 68° à 500 km), l’orbite reste éclairée."}
        - text: {en: "The longest possible eclipse, so the biggest battery.", fr: "L’éclipse la plus longue possible, donc la plus grosse batterie."}
          why: {en: "That is beta = 0, the Sun in the orbit plane.", fr: "C’est le cas bêta = 0, le Soleil dans le plan de l’orbite."}
        - text: {en: "Nothing: eclipse depends only on altitude.", fr: "Rien : l’éclipse ne dépend que de l’altitude."}
          why: {en: "Altitude sets the worst case; beta decides how close each orbit comes to it.", fr: "L’altitude fixe le pire cas ; bêta décide à quel point chaque orbite s’en approche."}

  - id: altitude
    title: {en: "The altitude trade", fr: "Le compromis d’altitude"}
    say:
      en: >-
        No altitude wins everything. Lower is better for resolution, radiation and debris rules:
        at four hundred kilometres, drag brings a CubeSat down in about nine months. But a short
        life may not meet the mission. At six hundred kilometres the passes are longer, but the
        satellite stays up for decades and needs a way to deorbit. Five hundred kilometres sits
        right on the five-year disposal line, and where the Sun is in its cycle decides which
        side.
      fr: >-
        Aucune altitude ne gagne partout. Plus bas, c’est mieux pour la résolution, le
        rayonnement et les règles sur les débris : à quatre cents kilomètres, la traînée fait
        rentrer un CubeSat en neuf mois environ. Mais une vie courte peut ne pas suffire à la
        mission. À six cents kilomètres, les passages sont plus longs, mais le satellite reste en
        orbite des décennies et doit pouvoir se désorbiter. Cinq cents kilomètres se trouve
        exactement sur la limite des cinq ans, et c’est le cycle solaire qui décide de quel côté.
    do:
      - js: "EX.play('altitude', ${say})"

  - id: coverage
    title: {en: "Ground track and passes", fr: "Trace au sol et passages"}
    say:
      en: >-
        While the satellite goes round, the Earth turns beneath it, so each track lands about
        twenty-four degrees further west. The camera only sees a narrow swath, so revisit is
        roughly the track spacing divided by the swath, times the period: days, for one
        satellite. A ground station sees the satellite only while it is inside a circle around the
        station: at five hundred kilometres, at most about seven minutes, four to six times a day.
      fr: >-
        Pendant que le satellite tourne, la Terre tourne sous lui : chaque trace tombe environ
        vingt-quatre degrés plus à l’ouest. La caméra ne voit qu’une fauchée étroite : la revisite
        vaut à peu près l’écart entre les traces divisé par la fauchée, fois la période. Des
        jours, pour un seul satellite. Une station sol ne voit le satellite que lorsqu’il est
        dans un cercle autour d’elle : à cinq cents kilomètres, au plus sept minutes environ,
        quatre à six fois par jour.
    do:
      - js: "EX.play('coverage', ${say})"

  - id: radiation
    title: {en: "Radiation", fr: "Le rayonnement"}
    say:
      en: >-
        Radiation dose rises steeply with altitude. Below about six hundred kilometres,
        off-the-shelf electronics can last a three-year mission behind modest shielding. But over
        South America the inner radiation belt dips low: the South Atlantic Anomaly. There, expect
        bit flips, latch-ups and noisy detector frames, and design for them with error detection
        and correction memory, EDAC, a watchdog and latch-up protection.
      fr: >-
        La dose de rayonnement augmente fortement avec l’altitude. Sous six cents kilomètres
        environ, l’électronique du commerce peut tenir une mission de trois ans derrière un
        blindage modeste. Mais au-dessus de l’Amérique du Sud, la ceinture de radiation intérieure
        descend bas : c’est l’Anomalie de l’Atlantique Sud. Attendez-vous à des inversions de
        bits, des verrouillages et des images bruitées, et concevez en conséquence : mémoire à
        détection et correction d’erreurs, l’EDAC, chien de garde et protection contre le
        verrouillage.
    do:
      - js: "EX.play('radiation', ${say})"
    question:
      type: reflect
      text:
        en: "For your mission's altitude, state the natural lifetime, whether you meet the five-year disposal rule, and the worst-case eclipse you will size the battery for."
        fr: "Pour l’altitude de votre mission, indiquez la durée de vie naturelle, si vous respectez la règle des cinq ans, et l’éclipse au pire cas pour laquelle vous dimensionnerez la batterie."
