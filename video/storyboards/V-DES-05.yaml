# Design concept — choosing an orbit: altitude, period, speed and the
# Sun-synchronous inclination; eclipse against beta; the 400/500/600 km trade
# (lifetime, disposal rule, passes, resolution, dose); ground track, swath and
# station contact; radiation and the South Atlantic Anomaly.
# Animated page video/explainers/orbit.html. Whole design team.
# Numbers computed from the textbook's constants (ch. 7): 500 km gives
# T 94.6 min, v 7.61 km/s, i 97.40°, beta* 68.0°, eclipse at beta 0 37.8 %
# (35.8 min), 23.7° track shift, 7.4 min longest pass at a 10° mask.
# EOSAT-1 orbit from sim/configs/eosat1/orbit.yaml (513 km, 97.39°, LTAN ~10:00).
id: V-DES-05
week: 6
audience: all
title:
  en: "Choosing an orbit"
  fr: "Choisir une orbite"
summary:
  en: "What the orbit decides: period and speed, Sun-synchronous orbits, eclipse and the beta angle, the altitude trade between lifetime, debris rules, links, resolution and radiation, ground coverage and passes, and the South Atlantic Anomaly."
  fr: "Ce que l’orbite décide : période et vitesse, orbites héliosynchrones, éclipse et angle bêta, le compromis d’altitude entre durée de vie, règles sur les débris, liaisons, résolution et rayonnement, couverture au sol et passages, et l’Anomalie de l’Atlantique Sud."
apps:
  viz: default
fresh_stack: viz
ties: {}
sources:
  - design/docs/oer/chapters/07_orbit_and_environment.md (§ 7.1–7.4, 7.6)
  - sim/configs/eosat1/orbit.yaml

setup:
  - goto: {app: viz, path: "/video/explainers/orbit.html?lang={lang}", settle: 1.5}
  - cursor: hide

steps:
  - id: size
    title: {en: "Altitude, period and speed", fr: "Altitude, période et vitesse"}
    say:
      en: >-
        The choice of orbit is the early design decision with the widest consequences, because
        it affects every subsystem. For a circular orbit, the altitude determines most of the
        other parameters. At five hundred kilometres, one orbit takes about ninety-five minutes
        at a speed of seven point six kilometres per second. At an inclination of ninety-seven
        point four degrees, the Earth's equatorial bulge rotates the orbit plane once a year, so
        that the satellite crosses the equator at the same local time every day. This is a
        Sun-synchronous orbit, and EOSAT-1 operates in one at about five hundred and thirteen
        kilometres.
      fr: >-
        Le choix de l’orbite est la décision de conception initiale dont les conséquences sont
        les plus étendues, car il touche tous les sous-systèmes. Pour une orbite circulaire,
        l’altitude détermine la plupart des autres paramètres. À cinq cents kilomètres, une
        orbite dure environ quatre-vingt-quinze minutes, à une vitesse de sept virgule six
        kilomètres par seconde. Avec une inclinaison de quatre-vingt-dix-sept virgule quatre
        degrés, le renflement équatorial de la Terre fait tourner le plan de l’orbite une fois
        par an, de sorte que le satellite franchit l’équateur chaque jour à la même heure
        locale. C’est une orbite héliosynchrone, et EOSAT-1 en suit une à environ cinq cent
        treize kilomètres.
    do:
      - js: "EX.play('size', ${say})"

  - id: eclipse
    title: {en: "Eclipse and the beta angle", fr: "L’éclipse et l’angle bêta"}
    say:
      en: >-
        The time the satellite spends in the Earth's shadow depends on the beta angle, which is
        the angle between the direction of the Sun and the orbit plane. When the Sun lies in the
        orbit plane, at a beta angle of zero, the eclipse is longest: thirty-eight percent of
        the orbit, or about thirty-six minutes at five hundred kilometres. Above about
        sixty-eight degrees, the orbit does not enter the shadow at all. EOSAT-1 operates near
        minus thirty degrees, with eclipses of about thirty-four minutes. The battery should be
        sized for a beta angle of zero, unless it is certain that the orbit never reaches it.
      fr: >-
        Le temps passé par le satellite dans l’ombre de la Terre dépend de l’angle bêta,
        c’est-à-dire l’angle entre la direction du Soleil et le plan de l’orbite. Lorsque le
        Soleil se trouve dans le plan de l’orbite, avec un angle bêta nul, l’éclipse est la plus
        longue : trente-huit pour cent de l’orbite, soit environ trente-six minutes à cinq cents
        kilomètres. Au-delà d’environ soixante-huit degrés, l’orbite n’entre plus du tout dans
        l’ombre. EOSAT-1 se situe vers moins trente degrés, avec des éclipses d’environ
        trente-quatre minutes. La batterie doit être dimensionnée pour un angle bêta nul, à
        moins d’être certain que l’orbite ne l’atteint jamais.
    do:
      - js: "EX.play('eclipse', ${say})"
    question:
      type: multichoice
      text:
        en: "A dawn–dusk Sun-synchronous orbit has beta near 90°. What does that do to the power design?"
        fr: "Une orbite héliosynchrone aube-crépuscule a un bêta proche de 90°. Quel effet sur la conception énergétique ?"
      options:
        - text: {en: "Almost no eclipse, so the battery is sized by other loads, not by a long shadow every orbit.", fr: "Presque pas d’éclipse : la batterie se dimensionne sur d’autres charges, pas sur une longue ombre à chaque orbite."}
          correct: true
          why: {en: "Beyond beta* (about 68° at 500 km) the orbit stays sunlit.", fr: "Au-delà de bêta* (environ 68° à 500 km), l’orbite reste éclairée."}
        - text: {en: "The longest possible eclipse, so the biggest battery.", fr: "L’éclipse la plus longue possible, donc la plus grosse batterie."}
          why: {en: "That is beta = 0, the Sun in the orbit plane.", fr: "C’est le cas bêta = 0, le Soleil dans le plan de l’orbite."}
        - text: {en: "Nothing: eclipse depends only on altitude.", fr: "Rien : l’éclipse ne dépend que de l’altitude."}
          why: {en: "Altitude sets the worst case; beta decides how close each orbit comes to it.", fr: "L’altitude fixe le pire cas ; bêta décide à quel point chaque orbite s’en approche."}

  - id: altitude
    title: {en: "The altitude trade", fr: "Le compromis d’altitude"}
    say:
      en: >-
        No single altitude is best in every respect. A lower altitude is better for resolution,
        radiation and compliance with debris rules: at four hundred kilometres, atmospheric drag
        brings a CubeSat down in about nine months, although such a short lifetime may not
        satisfy the mission. At six hundred kilometres, passes are longer, but the satellite
        remains in orbit for decades and requires a means of deorbiting. Five hundred kilometres
        lies close to the five-year disposal limit, and the phase of the solar cycle determines
        on which side of it the mission falls.
      fr: >-
        Aucune altitude n’est la meilleure à tous égards. Une altitude plus basse est préférable
        pour la résolution, le rayonnement et le respect des règles sur les débris : à quatre
        cents kilomètres, la traînée atmosphérique fait rentrer un CubeSat en neuf mois environ,
        mais une durée de vie aussi courte peut ne pas suffire à la mission. À six cents
        kilomètres, les passages sont plus longs, mais le satellite reste en orbite pendant des
        décennies et doit disposer d’un moyen de désorbitation. Cinq cents kilomètres se situe
        près de la limite de retrait de cinq ans, et c’est la phase du cycle solaire qui
        détermine de quel côté de cette limite se trouve la mission.
    do:
      - js: "EX.play('altitude', ${say})"

  - id: coverage
    title: {en: "Ground track and passes", fr: "Trace au sol et passages"}
    say:
      en: >-
        While the satellite orbits, the Earth rotates beneath it, so each successive ground
        track is shifted about twenty-four degrees further west. Because the camera covers only
        a narrow swath, the revisit time is approximately the track spacing divided by the swath
        width, multiplied by the orbital period, which amounts to several days for a single
        satellite. A ground station can communicate with the satellite only while it is within a
        circle around the station: at five hundred kilometres, for at most about seven minutes,
        four to six times a day.
      fr: >-
        Pendant que le satellite décrit son orbite, la Terre tourne sous lui : chaque trace au
        sol successive est donc décalée d’environ vingt-quatre degrés vers l’ouest. Comme la
        caméra ne couvre qu’une fauchée étroite, le temps de revisite est approximativement égal
        à l’écart entre les traces divisé par la largeur de la fauchée, multiplié par la période
        orbitale, soit plusieurs jours pour un seul satellite. Une station sol ne peut
        communiquer avec le satellite que lorsqu’il se trouve dans un cercle autour d’elle : à
        cinq cents kilomètres, pendant sept minutes au plus, quatre à six fois par jour.
    do:
      - js: "EX.play('coverage', ${say})"

  - id: radiation
    title: {en: "Radiation", fr: "Le rayonnement"}
    say:
      en: >-
        The radiation dose increases rapidly with altitude. Below about six hundred kilometres,
        commercial off-the-shelf electronics can survive a three-year mission with modest
        shielding. Over South America, however, the inner radiation belt comes closer to the
        Earth, in a region known as the South Atlantic Anomaly. In this region, bit flips,
        latch-ups and noisy detector frames should be expected, and the design must account for
        them with error detection and correction memory, or EDAC, a watchdog and latch-up
        protection.
      fr: >-
        La dose de rayonnement augmente rapidement avec l’altitude. Sous six cents kilomètres
        environ, l’électronique commerciale peut supporter une mission de trois ans avec un
        blindage modeste. Au-dessus de l’Amérique du Sud, cependant, la ceinture de radiation
        intérieure se rapproche de la Terre, dans une région appelée l’Anomalie de l’Atlantique
        Sud. Dans cette région, il faut s’attendre à des inversions de bits, à des verrouillages
        et à des images bruitées, et la conception doit en tenir compte avec une mémoire à
        détection et correction d’erreurs, ou EDAC, un chien de garde et une protection contre
        le verrouillage.
    do:
      - js: "EX.play('radiation', ${say})"
    question:
      type: reflect
      text:
        en: "For your mission's altitude, state the natural lifetime, whether you meet the five-year disposal rule, and the worst-case eclipse you will size the battery for."
        fr: "Pour l’altitude de votre mission, indiquez la durée de vie naturelle, si vous respectez la règle des cinq ans, et l’éclipse au pire cas pour laquelle vous dimensionnerez la batterie."
