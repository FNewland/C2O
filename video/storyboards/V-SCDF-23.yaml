  - id: reliability
    title: {en: "Reliability and the FMEA", fr: "La fiabilité et l’AMDE"}
    say:
      en: >-
        Cost and risk, acting as product assurance, builds the reliability block diagram. The
        target is judged over the twelve months of science operations the mission promises after
        commissioning, not over the three-year design life: zero point eight. The diagram gives
        about zero point eight eight. Then the failure modes and effects analysis, the FMEA, is
        proposed: the failure modes of each unit, including the failure of the drag sail to deploy,
        which the second, independent release circuit addresses.
      fr: >-
        Le poste coût et risques, au titre de l’assurance produit, construit le diagramme de
        fiabilité. L’objectif se juge sur les douze mois d’opérations scientifiques que la mission
        promet après la mise en service, et non sur la durée de vie de conception de trois ans :
        zéro virgule huit. Le diagramme donne environ zéro virgule quatre-vingt-huit. Puis l’analyse
        des modes de défaillance et de leurs effets, l’AMDE, est proposée : les modes de défaillance
        de chaque équipement, y compris l’échec du déploiement de la voile, que traite le second
        circuit de libération indépendant.
    do:
      - js: {en: "__lt('Scene 6.7 · Cost & risk with Systems', 'The reliability target is judged over the twelve months of science the mission promises, not the design life.')", fr: "__lt('Scène 6.7 · Coût et risques, avec Systèmes', 'L’objectif de fiabilité se juge sur les douze mois de science promis, pas sur la durée de vie de conception.')"}
      - select: {target: {css: "[data-testid=active-seat]"}, value: cost_engineer}
      - wait: 1.5
      - click: {css: ".c2o-appbar__levels .c2o-tab >> nth=4"}
      - wait: 1
      - click: {role: tab, name: Traceability, exact: true}
      - wait: 2
      - scroll: {target: {role: button, name: "Build the block diagram"}}
      - click: {role: button, name: "Build the block diagram"}
      - wait: 4
      - highlight: {target: {css: "[data-testid=reliability-evidence]"}, seconds: 3.5}
      - click: {role: button, name: "Propose the FMEA"}
      - wait: 4
      - click: {role: button, name: "FMEA worksheet"}
      - wait: 1.5
      - highlight: {target: {role: button, name: "FMEA worksheet"}, seconds: 3}

  - id: thermal
    title: {en: "The thermal nodal model", fr: "Le modèle thermique nodal"}
    say:
      en: >-
        Thermal builds the nodal model: one node per unit and panel, the conductive and radiative
        couplings, and the hot and cold cases taken from the orbit and the season. The first solve
        shows where heat is missing in the cold case: units below their limits. The model sizes the
        heaters, the team takes them, and the model is solved again. Every unit is now inside its
        design range, including the short-wave infrared camera and the battery, which must stay
        above zero degrees while it charges.
      fr: >-
        Le poste thermique construit le modèle nodal : un nœud par équipement et par panneau, les
        couplages conductifs et radiatifs, et les cas chaud et froid tirés de l’orbite et de la
        saison. La première résolution montre où la chaleur manque dans le cas froid : des
        équipements sous leurs limites. Le modèle dimensionne les réchauffeurs, l’équipe les
        retient, et le modèle est résolu à nouveau. Chaque équipement est maintenant dans sa plage
        de conception, y compris la caméra infrarouge à ondes courtes et la batterie, qui doit
        rester au-dessus de zéro degré pendant la charge.
    do:
      - js: {en: "__lt('Scene 6.8 · Thermal', 'The cold case shows where heat is missing; the model sizes the heaters and checks again.')", fr: "__lt('Scène 6.8 · Thermique', 'Le cas froid montre où la chaleur manque ; le modèle dimensionne les réchauffeurs et vérifie à nouveau.')"}
      - select: {target: {css: "[data-testid=active-seat]"}, value: thermal_engineer}
      - wait: 1.5
      - click: {css: ".c2o-appbar__levels .c2o-tab >> nth=4"}
      - wait: 1
      - click: {role: tab, name: Traceability, exact: true}
      - wait: 2
      - scroll: {target: {role: button, name: "Build the model"}}
      - click: {role: button, name: "Build the model"}
      - wait: 3
      - click: {role: button, name: Solve, exact: true}
      - wait: 5
      - highlight: {target: {css: "[data-testid=thermal-summary]"}, seconds: 3.5}
      - click: {role: button, name: "Take the sized heaters"}
      - wait: 3
      - click: {role: button, name: Solve, exact: true}
      - wait: 5
      - highlight: {target: {css: "[data-testid=thermal-summary]"}, seconds: 4}
