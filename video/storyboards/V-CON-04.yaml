# Concept explainer — on-board fault detection, isolation and recovery: the
# FDIR hierarchy, then one nominal chain end to end (S12 monitor on the wheel
# momentum envelope → S5 event → S19 rule 2001 → S8 desaturation → S1, then
# the monitor clears). Animated page video/explainers/fdir.html.
# Team audience, deeper for fdir_systems. Uses the momentum-management chain
# (a nominal function) on purpose: no scored fault scenario's recovery is shown.
id: V-CON-04
week: 7
audience: all
title:
  en: "On-board fault detection, isolation and recovery"
  fr: "Détection, isolation et reprise des pannes à bord"
summary:
  en: "This video explains how the spacecraft protects itself through successive layers of fault detection, isolation and recovery. It follows one chain from start to finish: a parameter crosses its monitoring limit, an event is raised, an event-action rule starts an on-board function, and a report confirms that the condition has cleared."
  fr: "Cette vidéo explique comment le satellite se protège au moyen de niveaux successifs de détection, d’isolation et de reprise des pannes. Elle suit une chaîne de bout en bout : un paramètre franchit sa limite de surveillance, un événement est émis, une règle événement-action lance une fonction de bord, et un rapport confirme le retour à la normale."
apps:
  viz: default
fresh_stack: viz
ties: {}
sources:
  - design/docs/oer/chapters/18_operations_and_fdir.md (§ 18.3.2 FDIR hierarchy)
  - sim/docs/PUS_SERVICE_REFERENCE.md (Service 12; Service 19)
  - sim/configs/eosat1/monitoring/s12_definitions.yaml (0x02BA, 70 %)
  - sim/configs/eosat1/monitoring/s19_rules.yaml (ea_id 2001 → func 1)
  - sim/configs/eosat1/procedures/commissioning/fdir_configuration.md (COM-008)

setup:
  - goto: {app: viz, path: "/video/explainers/fdir.html?lang={lang}", settle: 1.5}

steps:
  - id: hierarchy
    title: {en: "Layers of protection", fr: "Des niveaux de protection"}
    say:
      en: >-
        A spacecraft cannot wait for the next pass to protect itself, so fault detection,
        isolation and recovery, or FDIR, is organised in layers. At the lowest level is the
        hardware: a watchdog resets a processor within milliseconds. Above it are the unit, the
        subsystem and the system levels, each slower to respond but with a wider view. The
        ground segment, the operations team, is the highest level. A fault that cannot be
        resolved at one level is passed to the next.
      fr: >-
        Un satellite ne peut pas attendre le passage suivant pour se protéger : la détection,
        l’isolation et la reprise des pannes, la FDIR, est donc organisée en niveaux. Au niveau
        le plus bas se trouve le matériel : un chien de garde réinitialise un processeur en
        quelques millisecondes. Au-dessus viennent les niveaux de l’unité, du sous-système et du
        système, chacun plus lent à réagir mais avec une vue plus large. Le segment sol,
        l’équipe d’exploitation, constitue le niveau le plus élevé. Une panne qui ne peut être
        résolue à un niveau est transmise au suivant.
    do:
      - js: "EX.play('hierarchy', ${say})"

  - id: monitor
    title: {en: "A monitor crosses its limit", fr: "Un moniteur franchit sa limite"}
    say:
      en: >-
        This example follows one chain from start to finish. The reaction wheels accumulate
        angular momentum while they maintain the attitude. Service twelve, on-board monitoring,
        tracks this momentum as a proportion of the wheels' capacity, with a limit at seventy
        percent. When the value crosses the limit, the monitor sends a single report, twelve
        comma nine, at the moment of crossing. It does not repeat the report while the value
        remains above the limit.
      fr: >-
        Cet exemple suit une chaîne du début à la fin. Les roues de réaction accumulent du
        moment cinétique en maintenant l’attitude. Le service douze, la surveillance de bord,
        suit ce moment cinétique en proportion de la capacité des roues, avec une limite à
        soixante-dix pour cent. Lorsque la valeur franchit la limite, le moniteur envoie un seul
        rapport, douze virgule neuf, au moment du franchissement. Il ne répète pas ce rapport
        tant que la valeur reste au-dessus de la limite.
    do:
      - js: "EX.play('monitor', ${say})"

  - id: chain
    title: {en: "Event, event-action rule and function", fr: "Événement, règle événement-action et fonction"}
    say:
      en: >-
        The limit crossing generates a service five event. Service nineteen, event-action,
        contains rules that respond to specific events. Rule two thousand and one responds to
        this event by running a single service eight function, wheel desaturation, which uses
        the magnetorquers to remove the stored momentum. The function is verified through
        service one, like any command sent from the ground, and the attitude mode changes to
        DESAT. No action was required from the ground.
      fr: >-
        Le franchissement de la limite génère un événement du service cinq. Le service dix-neuf,
        événement-action, contient des règles qui réagissent à des événements précis. La règle
        deux mille un réagit à cet événement en lançant une seule fonction du service huit, la
        désaturation des roues, qui utilise les magnétocoupleurs pour évacuer le moment
        cinétique stocké. La fonction est vérifiée par le service un, comme toute commande
        envoyée depuis le sol, et le mode d’attitude passe en DESAT. Aucune action n’a été
        nécessaire au sol.
    do:
      - js: "EX.play('chain', ${say})"

  - id: clear
    title: {en: "Return within the limit", fr: "Retour dans la limite"}
    say:
      en: >-
        When the momentum falls back below the limit, the monitor sends its second and final
        report, twelve comma ten, indicating a return to nominal. The whole episode therefore
        produces two reports, one at each crossing. If the spacecraft was out of contact at the
        time, the stored telemetry and the event log still provide a complete record at the next
        pass.
      fr: >-
        Lorsque le moment cinétique repasse sous la limite, le moniteur envoie son second et
        dernier rapport, douze virgule dix, qui signale le retour à la normale. L’épisode
        complet produit donc deux rapports, un à chaque franchissement. Si le satellite était
        hors contact à ce moment, la télémesure stockée et le journal des événements en
        fournissent malgré tout un relevé complet au passage suivant.
    do:
      - js: "EX.play('clear', ${say})"

  - id: onerule
    title: {en: "Each rule starts one function", fr: "Chaque règle lance une fonction"}
    say:
      en: >-
        Each rule runs exactly one function, with no arguments. Any response that requires
        several steps is implemented as an on-board control procedure, under service eighteen.
        The ground can enable or disable each rule individually, and the FDIR commissioning
        procedure does exactly that, rule by rule, once each protected subsystem has been
        checked out.
      fr: >-
        Chaque règle lance exactement une fonction, sans argument. Toute réponse qui demande
        plusieurs étapes est réalisée sous forme de procédure de contrôle de bord, au titre du
        service dix-huit. Le sol peut activer ou désactiver chaque règle individuellement, et la
        procédure de mise en service de la FDIR le fait précisément, règle par règle, après la
        vérification de chaque sous-système protégé.
    do:
      - js: "EX.play('onerule', ${say})"
    question:
      type: truefalse
      answer: false
      text:
        en: "An S19 event-action rule can run a short sequence of commands, such as power a line and then switch a mode."
        fr: "Une règle événement-action S19 peut lancer une courte séquence de commandes, par exemple alimenter une ligne puis changer de mode."

  - id: ground
    title: {en: "The role of the ground", fr: "Le rôle du sol"}
    say:
      en: >-
        At the console, the operator sees the result: an alarm, the events, a new mode and the
        service one reports. Before sending any command, the operator must establish what the
        spacecraft has already done and why. Every autonomous action is visible in telemetry and
        can be reversed by command. Acting against the on-board automation without understanding
        it is a common way for a minor event to become an anomaly.
      fr: >-
        À la console, l’opérateur voit le résultat : une alarme, les événements, un nouveau mode
        et les rapports du service un. Avant d’envoyer toute commande, l’opérateur doit établir
        ce que le satellite a déjà fait et pourquoi. Toute action autonome est visible en
        télémesure et peut être annulée par commande. Agir contre l’automatisme de bord sans le
        comprendre est une façon courante de transformer un événement mineur en anomalie.
    do:
      - js: "EX.play('ground', ${say})"
    question:
      type: reflect
      text:
        en: "You arrive at AOS and the attitude mode reads DESAT, which nobody commanded. What do you read, and in what order, before you say anything on the loop?"
        fr: "Au début du passage, le mode d’attitude indique DESAT, que personne n’a commandé. Que lisez-vous, et dans quel ordre, avant de parler sur la boucle ?"
