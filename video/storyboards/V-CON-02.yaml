# Concept explainer — EOSAT-1's energy balance through one orbit: sunlight and
# eclipse, generation, load, the battery as the buffer, and the orbit-average
# margin, with real numbers from the production EPS model
# (video/explainers/data/energy_orbit.json, made by gen_energy_orbit.py from
# sim/tools/power_budget.py). Animated page video/explainers/energy.html.
# Team audience: the numbers are eps_tcs's, but every seat's request is paid
# from this budget. Prepares LEOP-004 (V-OPS-05), the SpaceCDF power budget
# (V-SCDF-02) and every load-related card.
id: V-CON-02
week: 5
audience: all
title:
  en: "Energy balance through an orbit"
  fr: "Le bilan énergétique sur une orbite"
summary:
  en: "One orbit of EOSAT-1, drawn from the simulator's own power model: when the arrays generate, what the spacecraft uses, how the battery carries the eclipse, and why the orbit-average margin, not the instantaneous power, tells you whether you are gaining energy."
  fr: "Une orbite d’EOSAT-1, tirée du modèle d’énergie du simulateur : quand les panneaux produisent, ce que le satellite consomme, comment la batterie passe l’éclipse, et pourquoi c’est la marge moyenne sur l’orbite, et non la puissance instantanée, qui dit si vous gagnez de l’énergie."
apps:
  viz: default
fresh_stack: viz
ties:
  cards: [LEOP-004]
sources:
  - video/explainers/data/energy_orbit.json (sim/tools/power_budget.py, nominal profile, EOL)
  - design/docs/oer/chapters/09_power_and_thermal.md (§ 9.1, § 9.3)
  - design/docs/oer/chapters/07_orbit_and_environment.md (§ 7.1.2 eclipse and beta angle)

setup:
  - goto: {app: viz, path: "/video/explainers/energy.html?lang={lang}", settle: 1.0}
  - wait_for: {target: {css: "body[data-ready='1']"}, timeout: 15}

steps:
  - id: orbit
    title: {en: "Sunlight and eclipse", fr: "Ensoleillement et éclipse"}
    say:
      en: >-
        This diagram shows one orbit of EOSAT-1, viewed from above, with the Sun to the right.
        Each orbit lasts about ninety-four and a half minutes, and on this date about
        thirty-four minutes of each orbit are spent in the Earth's shadow, in eclipse. The
        eclipse duration depends on the beta angle, which is the angle between the direction of
        the Sun and the orbit plane. Here it is about thirty degrees.
      fr: >-
        Ce schéma présente une orbite d’EOSAT-1, vue de dessus, avec le Soleil à droite. Chaque
        orbite dure environ quatre-vingt-quatorze minutes et demie, et à cette date, environ
        trente-quatre minutes de chaque orbite se passent dans l’ombre de la Terre, en éclipse.
        La durée de l’éclipse dépend de l’angle bêta, c’est-à-dire l’angle entre la direction du
        Soleil et le plan de l’orbite. Ici, il est d’environ trente degrés.
    do:
      - js: "EX.play('orbit', ${say})"

  - id: generation
    title: {en: "Power generation", fr: "La production d’énergie"}
    say:
      en: >-
        In sunlight the solar arrays generate between about sixty and seventy-four watts, for
        arrays at the end of their design life. As soon as the spacecraft enters the shadow,
        generation falls to zero and remains there until eclipse exit. There is no gradual
        transition: the arrays are either illuminated or not.
      fr: >-
        Au soleil, les panneaux solaires produisent entre soixante et soixante-quatorze watts
        environ, pour des panneaux en fin de vie. Dès que le satellite entre dans l’ombre, la
        production tombe à zéro et y reste jusqu’à la sortie d’éclipse. Il n’y a pas de
        transition progressive : les panneaux sont éclairés ou ne le sont pas.
    do:
      - js: "EX.play('generation', ${say})"

  - id: load
    title: {en: "Power consumption", fr: "La consommation"}
    say:
      en: >-
        The spacecraft consumes power continuously, for the on-board computer, the attitude
        control, the heaters and the radio. In nominal operations this amounts to about twenty
        to thirty watts. The peaks correspond to the transmitter being switched on during passes
        over the ground stations. Imaging, the cooler for the camera focal plane and propulsion
        would all add to this load.
      fr: >-
        Le satellite consomme de l’énergie en permanence, pour l’ordinateur de bord, le contrôle
        d’attitude, les réchauffeurs et la radio. En exploitation nominale, cela représente
        environ vingt à trente watts. Les pics correspondent à la mise en marche de l’émetteur
        pendant les passages au-dessus des stations sol. L’imagerie, le refroidisseur du plan
        focal de la caméra et la propulsion s’ajouteraient tous à cette charge.
    do:
      - js: "EX.play('load', ${say})"

  - id: battery
    title: {en: "The battery during eclipse", fr: "La batterie pendant l’éclipse"}
    say:
      en: >-
        The difference between generation and consumption either charges or discharges the
        battery. In sunlight, the battery charges and its state of charge rises towards full. In
        eclipse, the battery is the only source of power, and its state of charge falls, in this
        case by about ten percent. The lowest point, which defines the depth of discharge,
        occurs at eclipse exit.
      fr: >-
        La différence entre la production et la consommation charge ou décharge la batterie. Au
        soleil, la batterie se charge et son état de charge remonte vers le plein. En éclipse,
        la batterie est la seule source d’énergie, et son état de charge baisse, ici d’environ
        dix pour cent. Le point le plus bas, qui définit la profondeur de décharge, se situe à
        la sortie d’éclipse.
    do:
      - js: "EX.play('battery', ${say})"

  - id: average
    title: {en: "The orbit-average margin", fr: "La marge moyenne sur l’orbite"}
    say:
      en: >-
        Over a complete orbit, the arrays generate about seventy-one watt-hours and the
        spacecraft consumes about thirty-six. The difference, about thirty-five watt-hours, is
        the orbit-average margin. A positive margin means that the battery ends each orbit at
        least as fully charged as it started. This is the value checked by the power procedures.
      fr: >-
        Sur une orbite complète, les panneaux produisent environ soixante et onze wattheures et
        le satellite en consomme environ trente-six. La différence, environ trente-cinq
        wattheures, constitue la marge moyenne sur l’orbite. Une marge positive signifie que la
        batterie termine chaque orbite au moins aussi chargée qu’au départ. C’est la valeur que
        vérifient les procédures énergie.
    do:
      - js: "EX.play('average', ${say})"

  - id: instant
    title: {en: "Instantaneous power in eclipse", fr: "La puissance instantanée en éclipse"}
    say:
      en: >-
        A common error is to judge the energy balance from instantaneous values. In the middle
        of an eclipse, the power page shows zero generation and the battery discharging at about
        twenty watts. This may appear alarming, but it is normal. Whether the spacecraft is
        gaining or losing energy is determined over the orbit, not at a single moment. The
        relevant indicators are the state of charge at eclipse exit and the orbit-average
        margin.
      fr: >-
        Une erreur fréquente consiste à juger le bilan d’énergie sur des valeurs instantanées.
        En plein milieu d’une éclipse, la page énergie affiche une production nulle et une
        batterie qui se décharge à environ vingt watts. Cela peut paraître inquiétant, mais
        c’est normal. C’est sur l’orbite, et non à un instant donné, que l’on détermine si le
        satellite gagne ou perd de l’énergie. Les indicateurs pertinents sont l’état de charge à
        la sortie d’éclipse et la marge moyenne sur l’orbite.
    do:
      - js: "EX.play('instant', ${say})"
    question:
      type: multichoice
      text:
        en: "Mid-eclipse, the power page shows 0 W generated and the battery discharging at 20 W. What do you conclude?"
        fr: "En pleine éclipse, la page énergie affiche 0 W produits et une batterie qui se décharge à 20 W. Que concluez-vous ?"
      options:
        - text: {en: "Nothing yet: that is normal in eclipse. Judge the state of charge at eclipse exit and the orbit-average margin.", fr: "Rien pour l’instant : c’est normal en éclipse. Jugez l’état de charge à la sortie d’éclipse et la marge moyenne sur l’orbite."}
          correct: true
          why: {en: "In the shadow the battery is the only source; the balance is judged over the orbit.", fr: "Dans l’ombre, la batterie est la seule source ; le bilan se juge sur l’orbite."}
        - text: {en: "The arrays have failed: call the Flight Director.", fr: "Les panneaux sont en panne : appelez le directeur de vol."}
          why: {en: "Zero generation in eclipse is expected; an array fault shows in sunlight.", fr: "Une production nulle en éclipse est attendue ; une panne de panneau se voit au soleil."}
        - text: {en: "Shed loads now to stop the discharge.", fr: "Délestez tout de suite pour arrêter la décharge."}
          why: {en: "Shedding is for a negative orbit balance or a low state of charge, not for a normal eclipse.", fr: "Le délestage sert quand le bilan sur l’orbite est négatif ou l’état de charge bas, pas pour une éclipse normale."}

  - id: levers
    title: {en: "Factors that affect the margin", fr: "Les facteurs qui influent sur la marge"}
    say:
      en: >-
        The margin depends on two factors. It decreases when the load increases, for example
        with imaging, the focal plane cooler, a longer transmitter on-time, or heaters in cold
        conditions. It also decreases when generation falls, for example if the wings are still
        stowed, the beta angle is less favourable, the cells have aged, or the spacecraft is
        pointed away from the Sun. Every request from every position is paid for from this
        single budget, which is managed by the electrical power and thermal control position,
        EPS and TCS.
      fr: >-
        La marge dépend de deux facteurs. Elle diminue quand la charge augmente, par exemple
        avec l’imagerie, le refroidisseur du plan focal, un émetteur allumé plus longtemps ou
        des réchauffeurs par temps froid. Elle diminue aussi quand la production baisse, par
        exemple si les ailes sont encore repliées, si l’angle bêta est moins favorable, si les
        cellules ont vieilli ou si le satellite est pointé loin du Soleil. Chaque demande de
        chaque poste est prélevée sur ce budget unique, géré par le poste du sous-système
        énergie et du contrôle thermique, EPS et TCS.
    do:
      - js: "EX.play('levers', ${say})"
    question:
      type: reflect
      text:
        en: "Your position wants to add something to the next pass. What does it cost in watts, for how long, and does it happen in sunlight or in eclipse?"
        fr: "Votre poste veut ajouter quelque chose au prochain passage. Combien cela coûte-t-il en watts, pendant combien de temps, et est-ce au soleil ou en éclipse ?"
