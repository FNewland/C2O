# Week 2–3 — NOM-001 Pass Startup in the MCS, with the procedure card as the workbook.
# Prepares WB-5.4-N001 (confirm each step) before the first scored pass.
id: V-OPS-01
week: 9
audience: all
title:
  en: "NOM-001: working through a procedure card"
  fr: "NOM-001 : dérouler une fiche de procédure"
summary:
  en: "This video opens procedure NOM-001, Pass Startup, in mission control. It shows how to compare expected and live values, how to record GO, NO-GO and deviations, and where each recorded step appears in the workbook."
  fr: "Cette vidéo ouvre la procédure NOM-001, Ouverture de passage, dans le centre de contrôle. Elle montre comment comparer les valeurs attendues et les valeurs en direct, comment consigner GO, NO-GO et les écarts, et où chaque étape consignée apparaît dans le cahier de travail."
apps:
  mcs: default
# restart simulator + MCS before each take (python -m c2ovideo stack)
fresh_stack: sim
ties:
  worksheets: [WB-5.4-N001, WB-5.4-N001/q1, WB-5.4-N001/q2, WB-5.4-N001/q8]
  cards: [NOM-001]
sources:
  - sim/configs/eosat1/procedures/nominal/startup.md (NOM-001)
  - sim/configs/eosat1/worksheets/ops_week3.yaml (WB-5.4-N001)

setup:
  # the class starts at the next pass: run the simulator fast to AOS, then real time;
  # the battery is set to 48 % so Step 2 really fails on screen
  - api: {app: instructor, method: POST, path: /api/command, json: {type: override_passes, enabled: true}, allow_error: true}
  - python: {call: "video/c2ovideo/helpers.py:ff_to_pass", app: instructor, kwargs: {planner: "${planner_url}", min_duration: 480, after_aos: 20}}
  - api: {app: instructor, method: POST, path: /api/command, json: {type: set_battery_soc, soc_pct: 48.8}}
  - goto: {app: mcs, path: "/?lang={lang}&position=flight_director", settle: 4}
  - js: "fetch('/api/logbook', {method: 'DELETE', credentials: 'same-origin'})"
  - reload: 4

steps:
  - id: console
    title: {en: "The Flight Director's console", fr: "Le poste du directeur de vol"}
    say:
      en: >-
        This is the EOSAT-1 mission control system, seen from the Flight Director's position.
        The status strip at the top of the screen summarises four things: whether the spacecraft
        is visible, whether a link is established, whether it is healthy, and what is scheduled
        next. Every pass begins with the same nominal procedure, NOM-001, Pass Startup.
      fr: >-
        Voici le système de contrôle de mission d’EOSAT-1, vu du poste du directeur de vol. Le
        bandeau d’état, en haut de l’écran, résume quatre éléments : si le satellite est
        visible, si la liaison est établie, s’il est en bon état et ce qui est prévu ensuite.
        Chaque passage commence par la même procédure nominale, NOM-001, Ouverture de passage.
    do:
      - wait: 1.5
      - highlight: {target: {css: "header, .mcs-strip, #strip"}, seconds: 3.5, point: false}

  - id: open
    title: {en: "Open the card", fr: "Ouvrir la fiche"}
    say:
      en: >-
        Procedures are opened from the procedures page, PRC. Select Ops procedure, then NOM-001.
        The procedure runner steps through the procedure, and below it is the procedure card.
        The card is the operator's working copy rather than a reference copy of the manual: each
        box ticked on it is saved to the logbook as the procedure progresses.
      fr: >-
        Les procédures s’ouvrent depuis la page des procédures, PRC. Sélectionnez Procédure
        d’exploitation, puis NOM-001. L’exécuteur déroule la procédure et, en dessous, se trouve
        la fiche de procédure. Cette fiche est la copie de travail de l’opérateur, et non une
        copie de référence du manuel : chaque case cochée est enregistrée dans le journal de
        bord au fil de la procédure.
    do:
      - click: {css: "#rail-proc"}
      - select: {target: {css: "#proc-source"}, value: ops}
      - wait: 1.0
      - select: {target: {css: "#proc-type"}, value: nominal/startup.md}
      - wait: 2.5
      - scroll: {css: "#proc-doc"}
      - highlight: {target: {css: "#proc-doc"}, seconds: 3, point: false}

  - id: prereq
    title: {en: "Prerequisites first", fr: "D’abord les prérequis"}
    say:
      en: >-
        The prerequisites come first, and they are part of the procedure. The antenna must be
        tracking, the pass plan loaded, the flight dynamics orbit prediction up to date, and the
        Flight Director on the voice loop. Each item is ticked only after it has been checked.
      fr: >-
        Les prérequis viennent en premier et font partie intégrante de la procédure. L’antenne
        doit suivre le satellite, le plan de passage doit être chargé, la prévision d’orbite de
        la dynamique du vol doit être à jour et le directeur de vol doit être sur la boucle
        vocale. Chaque élément n’est coché qu’après vérification.
    do:
      - check: {css: "#proc-doc li[data-key='p1'] input.pc-pre"}
      - check: {css: "#proc-doc li[data-key='p2'] input.pc-pre"}
      - check: {css: "#proc-doc li[data-key='p3'] input.pc-pre"}
      - check: {css: "#proc-doc li[data-key='p4'] input.pc-pre"}

  - id: step1
    title: {en: "Step 1: expected and live values", fr: "Étape 1 : valeurs attendues et en direct"}
    say:
      en: >-
        Step one verifies the on-board computer, the OBC. The table shows three columns side by
        side: the value the card expects, the live telemetry value, and the value captured by
        the operator. A green tick indicates that the live value satisfies the check. Capturing
        the values records them in the logbook, so that it is possible to show afterwards what
        was displayed when the GO was given.
      fr: >-
        La première étape vérifie l’ordinateur de bord, l’OBC. Le tableau présente trois
        colonnes côte à côte : la valeur attendue par la fiche, la valeur de télémesure en
        direct et la valeur relevée par l’opérateur. Une coche verte indique que la valeur en
        direct satisfait la vérification. Le relevé des valeurs les enregistre dans le journal
        de bord, ce qui permet de montrer ensuite ce qui était affiché au moment du GO.
    do:
      - scroll: {css: "#proc-doc section[data-pc-step='s1']"}
      - highlight: {target: {css: "#proc-doc section[data-pc-step='s1'] table.pc-vals"}, seconds: 3.5}
      - click: {css: "#proc-doc section[data-pc-step='s1'] [data-pc='capture']"}
      - click: {css: "#proc-doc section[data-pc-step='s1'] [data-pc='tick'][data-r='go']"}
    question:
      type: multichoice
      worksheet: WB-5.4-N001/q1
      text:
        en: "At Step 1, obdh.mode reads 1 instead of 0. What does the card tell the Flight Director to do?"
        fr: "À l’étape 1, obdh.mode vaut 1 au lieu de 0. Que la fiche demande-t-elle au directeur de vol ?"
      options:
        - text: {en: "Abort the pass and run contingency procedure CTG-010, OBC Recovery.", fr: "Interrompre le passage et exécuter la procédure de contingence CTG-010, Récupération de l’OBC."}
          correct: true
          why: {en: "That is the GO/NO-GO line of Step 1.", fr: "C’est la ligne GO/NO-GO de l’étape 1."}
        - text: {en: "Carry on to Step 2 and note it in the handover.", fr: "Passer à l’étape 2 et le noter dans la relève."}
          why: {en: "A NO-GO is not a note to carry forward.", fr: "Un NO-GO n’est pas une simple note à reporter."}
        - text: {en: "Send HK_REQUEST(sid=4) again until it reads 0.", fr: "Renvoyer HK_REQUEST(sid=4) jusqu’à lire 0."}
          why: {en: "Repeating the request does not change the mode.", fr: "Répéter la requête ne change pas le mode."}

  - id: nogo
    title: {en: "A NO-GO with a reason", fr: "Un NO-GO motivé"}
    say:
      en: >-
        In this example, step two fails: the battery state of charge is just below fifty
        percent, which is under the threshold. The operator records the deviation in the note
        field and selects NO-GO. A NO-GO with a stated reason is much more useful to the next
        shift than a step left blank. Where the decision required judgement, Record decision
        opens a decision record linked to this step.
      fr: >-
        Dans cet exemple, l’étape deux échoue : l’état de charge de la batterie est légèrement
        inférieur à cinquante pour cent, sous le seuil. L’opérateur consigne l’écart dans le
        champ de note et sélectionne NO-GO. Un NO-GO accompagné de sa raison est bien plus utile
        à l’équipe suivante qu’une étape laissée vide. Lorsque la décision a demandé du
        jugement, Consigner la décision ouvre une fiche de décision liée à cette étape.
    do:
      - scroll: {css: "#proc-doc section[data-pc-step='s2']"}
      - highlight: {target: {css: "#proc-doc section[data-pc-step='s2'] table.pc-vals"}, seconds: 2.5, point: false}
      - type:
          target: {css: "#proc-doc section[data-pc-step='s2'] .pc-note"}
          delay_ms: 16
          text:
            en: "SoC 49 % at AOS, below the 50 % check. FD informed; imaging cancelled for this pass."
            fr: "SoC 49 % à l’AOS, sous le seuil de 50 %. DV informé ; imagerie annulée pour ce passage."
      - click: {css: "#proc-doc section[data-pc-step='s2'] [data-pc='tick'][data-r='nogo']"}
      - highlight: {target: {css: "#proc-doc section[data-pc-step='s2'] [data-pc='decision']"}, seconds: 2.5}
    question:
      type: truefalse
      worksheet: WB-5.4-N001/q2
      answer: false
      text:
        en: "If a check fails but the pass must go on, it is better to leave the step blank than to record a NO-GO."
        fr: "Si une vérification échoue mais que le passage doit continuer, il vaut mieux laisser l’étape vide que consigner un NO-GO."

  - id: workbook
    title: {en: "The record in the workbook", fr: "L’enregistrement dans le cahier de travail"}
    say:
      en: >-
        The Workbook tab of the logbook shows worksheet N001 with the same steps, the same GO
        and NO-GO results and the same notes, because the procedure card and the worksheet are a
        single record. At the end of the session, download the logbook in Markdown or as
        printable HTML. It is deleted from the server forty-eight hours after the last entry.
      fr: >-
        L’onglet Cahier de travail du journal de bord présente la fiche N001 avec les mêmes
        étapes, les mêmes résultats GO et NO-GO et les mêmes notes, car la fiche de procédure et
        la fiche du cahier forment un seul enregistrement. En fin de séance, téléchargez le
        journal en Markdown ou en HTML imprimable. Il est supprimé du serveur quarante-huit
        heures après la dernière saisie.
    do:
      - click: {css: "#proc-doc [data-pc='workbook']"}
      - wait: 2.0
      - highlight: {target: {css: "#c2o-logbook"}, seconds: 3, point: false}
      - highlight: {target: {css: "#c2o-logbook [data-lb='dl-md']"}, seconds: 2.5}
    question:
      type: reflect
      worksheet: WB-5.4-N001/q8
      text:
        en: "In your own words: what would the next shift need from your Step 2 note to carry on safely? Keep it to two lines, then copy it under “Off-nominal items observed”."
        fr: "Avec vos mots : de quoi l’équipe suivante aurait-elle besoin dans votre note de l’étape 2 pour continuer en sécurité ? Deux lignes au plus, puis reportez-les sous « Anomalies observées »."
