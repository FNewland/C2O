# Design concept — thermal control in a vacuum (textbook § 9.4): heat in and
# out, coatings and alpha/epsilon, the EOSat-3U single-node hot and cold cases
# (+91 °C screening, -53 °C steady but only ~8 °C drop in one eclipse),
# temperature margins and the battery example, the thermal toolbox.
# Animated page video/explainers/thermal.html. Whole design team; EPS/TCS.
id: V-DES-08
week: 3
audience: all
title:
  en: "Thermal control in a vacuum"
  fr: "Le contrôle thermique dans le vide"
summary:
  en: "How a spacecraft stays within its temperature limits with no air to cool it: the heat coming in and going out, coatings, the hot and cold design cases, temperature margins, and the toolbox of insulation, heaters and heat pipes."
  fr: "Comment un satellite reste dans ses limites de température sans air pour le refroidir : la chaleur qui entre et qui sort, les revêtements, les cas chaud et froid, les marges de température, et la boîte à outils : isolation, réchauffeurs et caloducs."
apps:
  viz: default
fresh_stack: viz
ties: {}
sources:
  - design/docs/oer/chapters/09_power_and_thermal.md (§ 9.4)

setup:
  - goto: {app: viz, path: "/video/explainers/thermal.html?lang={lang}", settle: 1.5}
  - cursor: hide

steps:
  - id: environment
    title: {en: "The thermal environment", fr: "L’environnement thermique"}
    say:
      en: >-
        In orbit there is no air, so there is no convection and fans cannot be used. Heat comes
        from four sources: direct sunlight, sunlight reflected by the Earth, the Earth's own
        infrared emission, and the electronics, since almost every watt the spacecraft consumes
        is eventually dissipated as heat. Heat can leave the spacecraft in only one way, by
        radiation from its outer surfaces to deep space. Inside the spacecraft, heat must be
        conducted to those surfaces.
      fr: >-
        En orbite, il n’y a pas d’air : il n’y a donc pas de convection et les ventilateurs sont
        inutilisables. La chaleur provient de quatre sources : le rayonnement solaire direct, la
        lumière solaire réfléchie par la Terre, l’émission infrarouge propre de la Terre et
        l’électronique, puisque presque chaque watt consommé par le satellite finit par être
        dissipé en chaleur. La chaleur ne peut quitter le satellite que d’une seule façon, par
        rayonnement de ses surfaces extérieures vers l’espace. À l’intérieur du satellite, elle
        doit être conduite jusqu’à ces surfaces.
    do:
      - js: "EX.play('environment', ${say})"

  - id: coatings
    title: {en: "Coatings", fr: "Les revêtements"}
    say:
      en: >-
        Two properties describe a surface: alpha, the fraction of sunlight it absorbs, and
        epsilon, its ability to radiate in the infrared. Their ratio determines the temperature
        at which the surface operates. White paint absorbs little and radiates well, so it
        remains cool and is used on radiators. Gold tape absorbs sunlight and radiates very
        little, so it remains warm and is used for insulation. Ultraviolet radiation darkens
        white paint over the years, so a radiator operates at a higher temperature at end of
        life.
      fr: >-
        Deux propriétés caractérisent une surface : alpha, la fraction de lumière solaire
        qu’elle absorbe, et epsilon, sa capacité à rayonner dans l’infrarouge. Leur rapport
        détermine la température de fonctionnement de la surface. La peinture blanche absorbe
        peu et rayonne bien : elle reste froide et s’utilise sur les radiateurs. Le ruban doré
        absorbe la lumière solaire et rayonne très peu : il reste chaud et s’utilise pour
        l’isolation. Le rayonnement ultraviolet fonce la peinture blanche au fil des années, de
        sorte qu’un radiateur fonctionne à une température plus élevée en fin de vie.
    do:
      - js: "EX.play('coatings', ${say})"

  - id: cases
    title: {en: "Hot case and cold case", fr: "Cas chaud et cas froid"}
    say:
      en: >-
        The design must withstand both extremes. The hot case combines full sunlight, an active
        downlink and degraded coatings. A single-node model of this 3U CubeSat gives a total
        heat input of fifty-four watts and predicts ninety-one degrees. This should be treated
        as a screening warning rather than a result, since a model with several nodes gives
        forty to fifty-five degrees. The cold case combines eclipse and safe mode, with less
        than eight watts of heat input and a steady-state temperature of minus fifty-three
        degrees. However, the eclipse lasts only thirty-six minutes, during which the spacecraft
        cools by about eight degrees.
      fr: >-
        La conception doit résister aux deux extrêmes. Le cas chaud combine plein soleil,
        transmission en cours et revêtements dégradés. Un modèle à un seul nœud de ce CubeSat 3U
        donne un apport de chaleur total de cinquante-quatre watts et prévoit quatre-vingt-onze
        degrés. Il faut y voir une alerte de présélection plutôt qu’un résultat, car un modèle à
        plusieurs nœuds donne quarante à cinquante-cinq degrés. Le cas froid combine éclipse et
        mode sûr, avec un apport de chaleur inférieur à huit watts et une température
        d’équilibre de moins cinquante-trois degrés. Cependant, l’éclipse ne dure que trente-six
        minutes, pendant lesquelles le satellite se refroidit d’environ huit degrés.
    do:
      - js: "EX.play('cases', ${say})"
    question:
      type: multichoice
      text:
        en: "Which coating properties make the cold case most conservative?"
        fr: "Quelles propriétés de revêtement rendent le cas froid le plus prudent ?"
      options:
        - text: {en: "Beginning-of-life properties, when white paint absorbs the least sunlight.", fr: "Celles du début de vie, quand la peinture blanche absorbe le moins de lumière solaire."}
          correct: true
          why: {en: "Lowest absorptance means least heat in: the coldest prediction.", fr: "L’absorptance la plus faible donne le moins de chaleur entrante : la prévision la plus froide."}
        - text: {en: "End-of-life properties, after ultraviolet darkening.", fr: "Celles de fin de vie, après le noircissement par les ultraviolets."}
          why: {en: "Darkened paint absorbs more: that is the hot case.", fr: "Une peinture noircie absorbe plus : c’est le cas chaud."}
        - text: {en: "It makes no difference in eclipse.", fr: "Cela ne change rien en éclipse."}
          why: {en: "The cold case also covers the sunlit part of a cold orbit and the start of eclipse.", fr: "Le cas froid couvre aussi la partie éclairée d’une orbite froide et l’entrée en éclipse."}

  - id: margins
    title: {en: "Temperature margins", fr: "Les marges de température"}
    say:
      en: >-
        Thermal models are uncertain, so a margin is kept between the predicted temperature and
        the limit: in this course, five degrees in operation, ten degrees for acceptance testing
        and fifteen degrees for qualification. In this example, the battery is predicted to
        reach minus eight degrees against a limit of minus ten, which leaves a margin of only
        two degrees. This is insufficient, and the options are to add a half-watt heater
        controlled by a thermostat set at minus five degrees, or to insulate the battery pack.
      fr: >-
        Les modèles thermiques sont incertains : on conserve donc une marge entre la température
        prévue et la limite, dans ce cours cinq degrés en fonctionnement, dix degrés pour les
        essais de recette et quinze degrés pour la qualification. Dans cet exemple, la batterie
        devrait atteindre moins huit degrés pour une limite de moins dix, ce qui ne laisse
        qu’une marge de deux degrés. C’est insuffisant, et les options sont d’ajouter un
        réchauffeur d’un demi-watt commandé par un thermostat réglé à moins cinq degrés, ou
        d’isoler le pack de batterie.
    do:
      - js: "EX.play('margins', ${say})"

  - id: toolbox
    title: {en: "Thermal control methods", fr: "Les moyens de contrôle thermique"}
    say:
      en: >-
        Only a few thermal control methods are available. Coatings are selected for each face of
        the spacecraft. Multi-layer insulation consists of blankets of thin reflective films,
        although on a CubeSat with many connectors its performance is considerably lower than in
        theory. Heaters are thin foils rated from half a watt to a few watts. Heat pipes or
        thermal straps carry heat to a radiator. Most CubeSats in low orbit need only coatings
        and a battery heater, and every watt of heater power must be taken from the eclipse
        power budget.
      fr: >-
        Les moyens de contrôle thermique sont peu nombreux. Les revêtements sont choisis pour
        chaque face du satellite. L’isolation multicouche est constituée de couvertures de films
        minces réfléchissants, mais sur un CubeSat comportant de nombreux connecteurs, ses
        performances sont nettement inférieures à la théorie. Les réchauffeurs sont de minces
        films d’une puissance d’un demi-watt à quelques watts. Les caloducs et les tresses
        thermiques transportent la chaleur vers un radiateur. La plupart des CubeSats en orbite
        basse n’ont besoin que de revêtements et d’un réchauffeur de batterie, et chaque watt de
        chauffage doit être prélevé sur le bilan d’énergie de l’éclipse.
    do:
      - js: "EX.play('toolbox', ${say})"
    question:
      type: reflect
      text:
        en: "Which unit on your spacecraft has the narrowest temperature range, and what will keep it inside that range in the cold case?"
        fr: "Quel équipement de votre satellite a la plage de température la plus étroite, et qu’est-ce qui l’y maintiendra dans le cas froid ?"
