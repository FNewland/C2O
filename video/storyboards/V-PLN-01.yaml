# Week 3 — the mission planner: passes, eclipses, ground track, an imaging
# activity and the constraint check. Prepares WB-5.3-PP (Day 1 pass plan).
id: V-PLN-01
week: 9
audience: all
title:
  en: "Plan a pass in the mission planner"
  fr: "Planifier un passage dans le planificateur de mission"
summary:
  en: "Read the next 24 hours: passes, eclipses and predicted battery charge; follow the ground track; schedule an imaging activity and check it against the constraints."
  fr: "Lire les 24 prochaines heures : passages, éclipses et charge prévue de la batterie ; suivre la trace au sol ; programmer une activité d’imagerie et la vérifier par rapport aux contraintes."
apps:
  planner: default
# the planner's 24 h starts at the simulator's epoch: same passes in both takes
fresh_stack: sim
ties:
  worksheets: [WB-5.3-PP, WB-5.3-PP/q1, WB-5.3-PP/q3, WB-5.3-PP/q7]
sources:
  - sim/configs/eosat1/worksheets/ops_week3.yaml (WB-5.3-PP)
  - sim/configs/eosat1/planning/ (activity types, imaging_pass)

setup:
  - goto: {app: planner, path: "/?lang={lang}", settle: 5}

steps:
  - id: horizon
    title: {en: "The next 24 hours", fr: "Les 24 prochaines heures"}
    say:
      en: >-
        The mission planner displays the next twenty-four hours on a single time axis. The top
        row shows eclipses, which last about thirty-four minutes in each ninety-five-minute
        orbit. Below it is one row per ground station, showing every pass. The bottom row shows
        the predicted battery state of charge, taking the planned activities into account. Every
        planned activity is assessed against this curve.
      fr: >-
        Le planificateur de mission présente les vingt-quatre prochaines heures sur un seul axe
        du temps. La première ligne indique les éclipses, qui durent environ trente-quatre
        minutes sur chaque orbite de quatre-vingt-quinze minutes. En dessous figure une ligne
        par station sol, avec chaque passage. La dernière ligne présente l’état de charge prévu
        de la batterie, compte tenu des activités planifiées. Chaque activité planifiée est
        évaluée par rapport à cette courbe.
    do:
      - wait: 1.0
      - highlight: {target: {css: "#panel-overview svg"}, seconds: 4, point: false}

  - id: contact
    title: {en: "The next contact", fr: "Le prochain contact"}
    say:
      en: >-
        The panel on the right shows the next contact: the ground station, the time of
        acquisition of signal, or AOS, the duration of the pass and its maximum elevation above
        the horizon. A short, low pass leaves little time for commanding, so the duration should
        be checked before a procedure is scheduled in it. The contacts table further down lists
        every pass together with its time of loss of signal, or LOS.
      fr: >-
        Le panneau de droite indique le prochain contact : la station sol, l’heure d’acquisition
        du signal, ou AOS, la durée du passage et son élévation maximale au-dessus de l’horizon.
        Un passage court et bas laisse peu de temps pour commander : il faut donc vérifier la
        durée avant d’y programmer une procédure. Le tableau des contacts, plus bas, liste
        chaque passage avec son heure de perte du signal, ou LOS.
    do:
      - highlight: {target: {css: "#factAos"}, seconds: 3.5}
      - scroll: {css: "#panel-contacts"}
      - highlight: {target: {css: "#contactsBody tr >> nth=0"}, seconds: 3}
    question:
      type: blanks
      worksheet: WB-5.3-PP/q3
      intro:
        en: "The next pass over Iqaluit starts at about 12:14 UTC (coordinated universal time) and lasts 8 minutes."
        fr: "Le prochain passage au-dessus d’Iqaluit commence vers 12:14 UTC (temps universel coordonné) et dure 8 minutes."
      text:
        en: "Its loss of signal is at about *12:22* UTC (hh:mm)."
        fr: "Sa perte du signal a lieu vers *12:22* UTC (hh:mm)."

  - id: track
    title: {en: "Ground track and eclipse", fr: "Trace au sol et éclipse"}
    say:
      en: >-
        The ground track shows the position of the spacecraft over the previous ninety minutes
        and its predicted position over the next ninety. The shaded section of the track is in
        eclipse. The values beside it describe the orbit: the period, the inclination and the
        beta angle, which is the angle between the orbit plane and the direction of the Sun. The
        beta angle determines the length of the eclipses, and therefore the energy available in
        each orbit.
      fr: >-
        La trace au sol présente la position du satellite au cours des quatre-vingt-dix
        dernières minutes et sa position prévue pour les quatre-vingt-dix prochaines. La partie
        ombrée de la trace correspond à l’éclipse. Les valeurs à côté décrivent l’orbite : la
        période, l’inclinaison et l’angle bêta, c’est-à-dire l’angle entre le plan de l’orbite
        et la direction du Soleil. L’angle bêta détermine la durée des éclipses, et donc
        l’énergie disponible sur chaque orbite.
    do:
      - scroll: {css: "#panel-map"}
      - highlight: {target: {css: "#groundTrackMap"}, seconds: 4, point: false}
      - highlight: {target: {css: "#bbBeta"}, seconds: 2.5}

  - id: imaging
    title: {en: "Schedule an imaging activity", fr: "Programmer une activité d’imagerie"}
    say:
      en: >-
        The imaging opportunities list shows the targets the spacecraft will pass over, with the
        capture time, the access duration, the off-nadir angle, which is the camera tilt from
        the vertical, and the Sun elevation. In this example one opportunity is scheduled. The
        activity begins before the capture time, because the detector cooler needs about eight
        minutes to reach its operating temperature.
      fr: >-
        La liste des opportunités d’imagerie présente les cibles que le satellite survolera,
        avec l’heure de prise de vue, la durée d’accès, l’angle de dépointage, c’est-à-dire
        l’inclinaison de la caméra par rapport à la verticale, et l’élévation du Soleil. Dans
        cet exemple, une opportunité est programmée. L’activité commence avant l’heure de prise
        de vue, car le refroidisseur du détecteur a besoin d’environ huit minutes pour atteindre
        sa température de fonctionnement.
    do:
      - scroll: {css: "#panel-imaging"}
      - highlight: {target: {css: "#imagingOpportunitiesPanel tr:visible:has-text('Gulf Stream')"}, seconds: 3, point: false}
      - click: {css: "#imagingOpportunitiesPanel tr:visible:has-text('Gulf Stream') button"}
      - wait: 1.5
    question:
      type: multichoice
      worksheet: WB-5.3-PP/q7
      text:
        en: "Why does the imaging activity start several minutes before the capture time?"
        fr: "Pourquoi l’activité d’imagerie commence-t-elle plusieurs minutes avant l’heure de prise de vue ?"
      options:
        - text: {en: "The focal plane array (FPA) cooler has to cool the detector before it can image.", fr: "Le refroidisseur du plan focal (FPA) doit refroidir le détecteur avant la prise de vue."}
          correct: true
          why: {en: "The cooler is off in STANDBY; imaging preparation switches it on.", fr: "Le refroidisseur est arrêté en STANDBY ; la préparation de l’imagerie l’allume."}
        - text: {en: "The spacecraft must wait for the next eclipse.", fr: "Le satellite doit attendre la prochaine éclipse."}
          why: {en: "Imaging needs the target sunlit, not an eclipse.", fr: "L’imagerie demande une cible éclairée, pas une éclipse."}
        - text: {en: "The ground station needs time to acquire the signal.", fr: "La station sol a besoin de temps pour acquérir le signal."}
          why: {en: "Imaging does not need a station in view.", fr: "L’imagerie ne demande pas de station en visibilité."}

  - id: check
    title: {en: "Check the constraints", fr: "Vérifier les contraintes"}
    say:
      en: >-
        Before anything is uploaded, the constraint check is run. It evaluates the plan against
        power, attitude, thermal and data volume constraints, and reports any conflict between
        activities. A plan is ready only when the schedule is valid and all constraints are
        satisfied. The result is the team's Day 1 pass plan, which the other team then reviews.
      fr: >-
        Avant tout envoi, on lance la vérification des contraintes. Elle évalue le plan au
        regard des contraintes d’énergie, d’attitude, de thermique et de volume de données, et
        signale tout conflit entre activités. Un plan n’est prêt que lorsque le programme est
        valide et que toutes les contraintes sont respectées. Le résultat est le plan de passage
        du jour 1 de l’équipe, que l’autre équipe examine ensuite.
    do:
      - scroll: {css: "#btnValidateConstraints"}
      - click: {css: "#btnValidateConstraints"}
      - wait: 2.5
      - highlight: {target: {css: "#constraintsResult"}, seconds: 3.5, point: false}
