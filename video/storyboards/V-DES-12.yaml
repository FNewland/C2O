# Design concept — verification and validation (textbook ch. 14): verified
# against validated (the GSD example), the proto-flight environmental test
# sequence, random vibration levels, the thermal vacuum profile, and the
# verification matrix with a waiver; the operations rehearsal as validation.
# Animated page video/explainers/vv.html. Whole design team.
id: V-DES-12
week: 7
audience: all
title:
  en: "Verification and validation"
  fr: "Vérification et validation"
summary:
  en: "Built right, or built the right thing? The difference between verification and validation, the environmental test sequence a CubeSat goes through, vibration and thermal vacuum levels, and the matrix that tracks every requirement to closure."
  fr: "Bien construit, ou la bonne chose construite ? La différence entre vérification et validation, la séquence d’essais d’environnement d’un CubeSat, les niveaux de vibration et de vide thermique, et la matrice qui suit chaque exigence jusqu’à sa clôture."
apps:
  viz: default
fresh_stack: viz
ties: {}
sources:
  - design/docs/oer/chapters/14_verification_validation.md (§ 14.1, 14.3, 14.4)

setup:
  - goto: {app: viz, path: "/video/explainers/vv.html?lang={lang}", settle: 1.5}
  - cursor: hide

steps:
  - id: vv
    title: {en: "Verification and validation", fr: "Vérification et validation"}
    say:
      en: >-
        Verification determines whether the system has been built correctly, by checking the
        design against the requirements, and it is carried out by the engineering team.
        Validation determines whether the right system has been built, by checking it against
        the stakeholders' needs, and it is carried out by the users and operators. A camera can
        meet its ten-metre requirement with a measured nine point two metres, and so be
        verified, but still fail to satisfy users who needed five metres to distinguish between
        crops. In that case it is not validated.
      fr: >-
        La vérification détermine si le système a été correctement construit, en comparant la
        conception aux exigences, et elle est menée par l’équipe d’ingénierie. La validation
        détermine si l’on a construit le bon système, en le comparant aux besoins des parties
        prenantes, et elle est menée par les utilisateurs et les opérateurs. Une caméra peut
        satisfaire son exigence de dix mètres avec une valeur mesurée de neuf virgule deux
        mètres, et donc être vérifiée, sans pour autant répondre aux besoins des utilisateurs, à
        qui il fallait cinq mètres pour distinguer les cultures. Dans ce cas, elle n’est pas
        validée.
    do:
      - js: "EX.play('vv', ${say})"

  - id: sequence
    title: {en: "The test sequence", fr: "La séquence d’essais"}
    say:
      en: >-
        Before launch, the spacecraft is exposed to the environments it will encounter, in a
        fixed sequence: sine vibration, random vibration, thermal vacuum and electromagnetic
        compatibility. A functional test is performed before and after each environmental test,
        so that any damage can be attributed to a specific test. The test levels are set by the
        deployer or launch vehicle provider.
      fr: >-
        Avant le lancement, le satellite est soumis aux environnements qu’il rencontrera, dans
        un ordre fixe : vibrations sinusoïdales, vibrations aléatoires, vide thermique et
        compatibilité électromagnétique. Un essai fonctionnel est réalisé avant et après chaque
        essai d’environnement, afin de pouvoir attribuer tout dommage à un essai précis. Les
        niveaux d’essai sont fixés par le fournisseur du déployeur ou du lanceur.
    do:
      - js: "EX.play('sequence', ${say})"

  - id: vibration
    title: {en: "Random vibration", fr: "La vibration aléatoire"}
    say:
      en: >-
        Random vibration is specified as a spectrum giving the vibration level at each
        frequency, rising to a plateau between eighty and five hundred hertz. The area under the
        curve gives the overall level, six point eight g r m s for workmanship testing. A
        proto-flight unit, which is the unit that will fly, is tested three decibels higher, at
        twice the spectral level, which gives nine point six g r m s, for one minute on each
        axis.
      fr: >-
        Les vibrations aléatoires se spécifient par un spectre qui donne le niveau de vibration
        à chaque fréquence, avec un plateau entre quatre-vingts et cinq cents hertz. L’aire sous
        la courbe donne le niveau global, six virgule huit g efficaces pour l’essai de
        fabrication. Une unité protovol, c’est-à-dire l’unité qui volera, est essayée trois
        décibels plus haut, soit deux fois le niveau spectral, ce qui donne neuf virgule six g
        efficaces, pendant une minute sur chaque axe.
    do:
      - js: "EX.play('vibration', ${say})"
    question:
      type: multichoice
      text:
        en: "Why does the functional test come both before and after each environmental test?"
        fr: "Pourquoi l’essai fonctionnel vient-il avant et après chaque essai d’environnement ?"
      options:
        - text: {en: "So any damage can be pinned to the environment that caused it.", fr: "Pour attribuer tout dommage à l’environnement qui l’a causé."}
          correct: true
          why: {en: "A failure found only at the end could have come from any of the tests.", fr: "Une panne trouvée seulement à la fin pourrait venir de n’importe lequel des essais."}
        - text: {en: "To let the hardware cool down between tests.", fr: "Pour laisser le matériel refroidir entre les essais."}
          why: {en: "Cooling is a test-facility matter; the functional test checks performance.", fr: "Le refroidissement relève du banc ; l’essai fonctionnel vérifie les performances."}
        - text: {en: "Because the launcher requires a fixed number of power cycles.", fr: "Parce que le lanceur exige un nombre fixe de mises sous tension."}
          why: {en: "The launcher sets levels, not the functional test schedule.", fr: "Le lanceur fixe des niveaux, pas le calendrier des essais fonctionnels."}

  - id: tvac
    title: {en: "Thermal vacuum", fr: "Le vide thermique"}
    say:
      en: >-
        In thermal vacuum testing, the spacecraft is cycled between hot and cold conditions in a
        chamber at a pressure below one hundred-thousandth of a millibar. A proto-flight test
        extends ten degrees beyond the predicted maximum and minimum temperatures, for four
        cycles that begin and end hot, and each extreme is held for at least one hour while a
        full functional test is carried out. The test confirms the thermal margins of the
        design.
      fr: >-
        Lors de l’essai en vide thermique, le satellite subit des cycles entre conditions
        chaudes et froides dans une chambre à une pression inférieure à un cent-millième de
        millibar. Un essai protovol va dix degrés au-delà des températures maximale et minimale
        prévues, sur quatre cycles qui commencent et se terminent à chaud, et chaque extrême est
        maintenu au moins une heure pendant un essai fonctionnel complet. L’essai confirme les
        marges thermiques de la conception.
    do:
      - js: "EX.play('tvac', ${say})"

  - id: matrix
    title: {en: "The verification matrix", fr: "La matrice de vérification"}
    say:
      en: >-
        The verification matrix lists every requirement, the methods by which it will be
        verified and its current status. Most requirements are closed by test or analysis, and
        some remain open until a test has been performed. A requirement that cannot be met
        requires a formally approved and recorded waiver; it must never simply be left
        unaddressed. Data latency is closed by demonstration, and the operations rehearsal in
        the simulator is such a demonstration, as well as a first validation of the concept of
        operations.
      fr: >-
        La matrice de vérification liste chaque exigence, les méthodes par lesquelles elle sera
        vérifiée et son état actuel. La plupart des exigences sont fermées par essai ou par
        analyse, et certaines restent ouvertes jusqu’à la réalisation d’un essai. Une exigence
        qui ne peut pas être satisfaite exige une dérogation formellement approuvée et consignée
        ; elle ne doit jamais être simplement laissée de côté. La latence des données se ferme
        par démonstration, et la répétition d’exploitation dans le simulateur constitue une
        telle démonstration, ainsi qu’une première validation du concept d’opérations.
    do:
      - js: "EX.play('matrix', ${say})"
    question:
      type: reflect
      text:
        en: "Pick one of your requirements that only users or operators could validate. How, and when, would you find out it is the right requirement?"
        fr: "Choisissez une de vos exigences que seuls des utilisateurs ou des opérateurs pourraient valider. Comment, et quand, sauriez-vous que c’est la bonne exigence ?"
