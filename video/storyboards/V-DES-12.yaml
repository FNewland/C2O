# Design concept — verification and validation (textbook ch. 14): verified
# against validated (the GSD example), the proto-flight environmental test
# sequence, random vibration levels, the thermal vacuum profile, and the
# verification matrix with a waiver; the operations rehearsal as validation.
# Animated page video/explainers/vv.html. Whole design team.
id: V-DES-12
week: 5
audience: all
title:
  en: "Verification and validation"
  fr: "Vérification et validation"
summary:
  en: "Built right, or built the right thing? The difference between verification and validation, the environmental test sequence a CubeSat goes through, vibration and thermal vacuum levels, and the matrix that tracks every requirement to closure."
  fr: "Bien construit, ou la bonne chose construite ? La différence entre vérification et validation, la séquence d’essais d’environnement d’un CubeSat, les niveaux de vibration et de vide thermique, et la matrice qui suit chaque exigence jusqu’à sa clôture."
apps:
  viz: default
fresh_stack: viz
ties: {}
sources:
  - design/docs/oer/chapters/14_verification_validation.md (§ 14.1, 14.3, 14.4)

setup:
  - goto: {app: viz, path: "/video/explainers/vv.html?lang={lang}", settle: 1.5}

steps:
  - id: vv
    title: {en: "Built right, or the right thing?", fr: "Bien construit, ou la bonne chose ?"}
    say:
      en: >-
        Verification asks: did we build the system right? It checks the design against the
        requirements, and the engineering team does it. Validation asks: did we build the right
        system? It checks against what the stakeholders needed, and users and operators do it. A
        camera can meet its ten-metre requirement at nine point two, verified, and still fail the
        users, who needed five metres to tell crops apart. Not validated.
      fr: >-
        La vérification demande : a-t-on bien construit le système ? Elle compare la conception
        aux exigences, et c’est l’équipe d’ingénierie qui la fait. La validation demande : a-t-on
        construit le bon système ? Elle compare aux besoins des parties prenantes, et ce sont les
        utilisateurs et les opérateurs qui la font. Une caméra peut tenir son exigence de dix
        mètres avec neuf virgule deux, vérifiée, et décevoir pourtant les utilisateurs, à qui il
        fallait cinq mètres pour distinguer les cultures. Non validée.
    do:
      - js: "EX.play('vv', ${say})"

  - id: sequence
    title: {en: "The test sequence", fr: "La séquence d’essais"}
    say:
      en: >-
        Before launch, the spacecraft goes through the environments it will meet, in a fixed
        order: sine vibration, random vibration, thermal vacuum, electromagnetic compatibility. A
        functional test comes before and after each one, so that if something breaks, you know
        which test broke it. The deployer or launcher sets the binding levels.
      fr: >-
        Avant le lancement, le satellite traverse les environnements qu’il rencontrera, dans un
        ordre fixe : vibration sinusoïdale, vibration aléatoire, vide thermique, compatibilité
        électromagnétique. Un essai fonctionnel vient avant et après chacun : si quelque chose
        casse, on sait quel essai l’a cassé. Le déployeur ou le lanceur fixe les niveaux
        contraignants.
    do:
      - js: "EX.play('sequence', ${say})"

  - id: vibration
    title: {en: "Random vibration", fr: "La vibration aléatoire"}
    say:
      en: >-
        Random vibration is specified as a spectrum: how much shaking at each frequency, rising to
        a plateau between eighty and five hundred hertz. The area under the curve gives the
        overall level, six point eight g r m s for workmanship. A proto-flight unit, the one that
        will fly, is tested three decibels higher, twice the spectrum: nine point six, for one
        minute on each axis.
      fr: >-
        La vibration aléatoire se spécifie par un spectre : combien de secousses à chaque
        fréquence, avec un plateau entre quatre-vingts et cinq cents hertz. L’aire sous la courbe
        donne le niveau global, six virgule huit g efficaces pour le niveau de fabrication. Une
        unité proto-vol, celle qui volera, est essayée trois décibels plus haut, deux fois le
        spectre : neuf virgule six, pendant une minute sur chaque axe.
    do:
      - js: "EX.play('vibration', ${say})"
    question:
      type: multichoice
      text:
        en: "Why does the functional test come both before and after each environmental test?"
        fr: "Pourquoi l’essai fonctionnel vient-il avant et après chaque essai d’environnement ?"
      options:
        - text: {en: "So any damage can be pinned to the environment that caused it.", fr: "Pour attribuer tout dommage à l’environnement qui l’a causé."}
          correct: true
          why: {en: "A failure found only at the end could have come from any of the tests.", fr: "Une panne trouvée seulement à la fin pourrait venir de n’importe lequel des essais."}
        - text: {en: "To let the hardware cool down between tests.", fr: "Pour laisser le matériel refroidir entre les essais."}
          why: {en: "Cooling is a test-facility matter; the functional test checks performance.", fr: "Le refroidissement relève du banc ; l’essai fonctionnel vérifie les performances."}
        - text: {en: "Because the launcher requires a fixed number of power cycles.", fr: "Parce que le lanceur exige un nombre fixe de mises sous tension."}
          why: {en: "The launcher sets levels, not the functional test schedule.", fr: "Le lanceur fixe des niveaux, pas le calendrier des essais fonctionnels."}

  - id: tvac
    title: {en: "Thermal vacuum", fr: "Le vide thermique"}
    say:
      en: >-
        In thermal vacuum the spacecraft cycles between hot and cold in a chamber at less than a
        hundred-thousandth of a millibar. A proto-flight test goes ten degrees beyond the
        predicted maximum and minimum, four times, starting and ending hot, and holds each extreme
        for at least an hour, with a full functional test there. These are the design's thermal
        margins, put to the test.
      fr: >-
        En vide thermique, le satellite passe du chaud au froid dans une chambre à moins d’un
        cent-millième de millibar. Un essai proto-vol va dix degrés au-delà du maximum et du
        minimum prévus, quatre fois, en commençant et en finissant à chaud, et tient chaque
        extrême au moins une heure, avec un essai fonctionnel complet. Ce sont les marges
        thermiques de la conception, mises à l’épreuve.
    do:
      - js: "EX.play('tvac', ${say})"

  - id: matrix
    title: {en: "The verification matrix", fr: "La matrice de vérification"}
    say:
      en: >-
        The verification matrix lists every requirement, the methods that will verify it, and its
        status. Most close by test or analysis; some stay open until a test is run. A requirement
        that cannot be met needs a waiver, approved and recorded, never silence. And data latency
        is closed by demonstration: your operations rehearsal in the simulator is exactly that,
        and a first validation of your concept of operations.
      fr: >-
        La matrice de vérification liste chaque exigence, les méthodes qui la vérifieront, et son
        état. La plupart se ferment par essai ou par analyse ; certaines restent ouvertes jusqu’à
        un essai. Une exigence qui ne peut être tenue demande une dérogation, approuvée et
        consignée, jamais le silence. Et la latence des données se ferme par démonstration :
        votre répétition d’opérations dans le simulateur, c’est exactement cela, et une première
        validation de votre concept d’opérations.
    do:
      - js: "EX.play('matrix', ${say})"
    question:
      type: reflect
      text:
        en: "Pick one of your requirements that only users or operators could validate. How, and when, would you find out it is the right requirement?"
        fr: "Choisissez une de vos exigences que seuls des utilisateurs ou des opérateurs pourraient valider. Comment, et quand, sauriez-vous que c’est la bonne exigence ?"
