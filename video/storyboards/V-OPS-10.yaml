# Week 5 — a complex task: under-voltage in a pass, worked with CTG-001 (WB-A-CTG-001).
# The bus drops below the 28.4 V flag; the spacecraft has already shed the payload
# (tiered on-board shedder, CTG-001 ruling 2026-11-07); the operator checks before
# commanding, reads the card's branch, holds and monitors; the instructor speeds
# time and the spacecraft restores the line at 28.9 V.
id: V-OPS-10
week: 5
audience: all
title:
  en: "Under-voltage: confirming the cause before shedding loads"
  fr: "Sous-tension : confirmer la cause avant de délester"
summary:
  en: "In this video, the bus voltage falls below its limit during a pass. The operator reads the alarm, identifies the loads the spacecraft has already shed, follows the relevant branch of CTG-001 and monitors the situation. The spacecraft then restores the load line as the battery recovers."
  fr: "Dans cette vidéo, la tension du bus passe sous sa limite pendant un passage. L’opérateur lit l’alarme, identifie les charges que le satellite a déjà délestées, suit la branche correspondante de CTG-001 et surveille la situation. Le satellite rétablit ensuite la ligne à mesure que la batterie se recharge."
apps:
  mcs: default
fresh_stack: sim
ties:
  worksheets: [WB-A-CTG-001, WB-A-CTG-001/q1, WB-A-CTG-001/q2, WB-A-CTG-001/q7]
  cards: [CTG-001]
sources:
  - sim/configs/eosat1/procedures/contingency/undervoltage_loadshed.md (CTG-001 rev 1.2)
  - sim/configs/eosat1/simulation.yaml (eps.load_shed.levels_v, auto_restore)

setup:
  - api: {app: instructor, method: POST, path: /api/command, json: {type: load_breakpoint, name: card-END}}
  - wait: 2
  - api: {app: instructor, method: POST, path: /api/command, json: {type: override_passes, enabled: false}, allow_error: true}
  - python: {call: "video/c2ovideo/helpers.py:ff_to_pass", app: instructor, kwargs: {planner: "${planner_url}", min_duration: 420, min_elevation: 15, after_aos: 20}}
  - api: {app: mcs, method: POST, path: /api/pus-command, json: {service: 3, subtype: 27, data_hex: "0001", name: HK_REQUEST, position: flight_director}}
  - wait: 3
  - goto: {app: mcs, path: "/?lang={lang}&position=flight_director", settle: 4}
  - js: "fetch('/api/logbook', {method: 'DELETE', credentials: 'same-origin'})"
  - reload: 5

steps:
  - id: calm
    title: {en: "A sunlit pass", fr: "Un passage au soleil"}
    say:
      en: >-
        This is a pass over Iqaluit, in sunlight. The power diagram on the overview shows the
        solar arrays supplying the bus and the battery charging. The instructor then drains the
        battery to simulate a fault; the cause, whether a failed cell or an unusually long
        eclipse, is not important at this stage. The operator monitors the power block.
      fr: >-
        Il s’agit d’un passage au-dessus d’Iqaluit, au soleil. Le schéma d’énergie de la vue
        d’ensemble montre les générateurs solaires qui alimentent le bus et la batterie en
        charge. L’instructeur vide ensuite la batterie pour simuler une panne ; la cause,
        cellule défaillante ou éclipse anormalement longue, n’a pas d’importance à ce stade.
        L’opérateur surveille le bloc énergie.
    do:
      - wait: 1.0
      - highlight: {target: {css: "#ovr-power-card"}, seconds: 3, point: false}
      - wait: 4
      - api: {app: instructor, method: POST, path: /api/command, json: {type: failure_inject, subsystem: eps, failure: undervoltage, onset: step, magnitude: 1.0, soc_pct: 57}}
      - wait: 3

  - id: alarm
    title: {en: "Read the alarm", fr: "Lire l’alarme"}
    say:
      en: >-
        Two alarms appear on the bus voltage, which reads twenty-eight point three volts, below
        the limit of twenty-eight point four. One alarm comes from the on-board monitoring and
        the other from the ground limit. Both refer to the same procedure: the contingency
        procedure CTG-001, under-voltage load shedding. The operator acknowledges the alarms,
        which confirms that they have been seen and that the operator is responsible for them.
      fr: >-
        Deux alarmes apparaissent sur la tension du bus, qui affiche vingt-huit virgule trois
        volts, sous la limite de vingt-huit virgule quatre. L’une provient de la surveillance de
        bord, l’autre de la limite au sol. Les deux renvoient à la même procédure : la procédure
        de contingence CTG-001, le délestage sur sous-tension. L’opérateur acquitte les alarmes,
        ce qui confirme qu’elles ont été vues et qu’il en assume la responsabilité.
    do:
      - wait_for: {target: {css: "#alarms-btn"}, timeout: 30}
      - click: {css: "#alarms-btn"}
      - wait_for: {target: {css: "#alarm-drawer.open div[data-id] [data-act='ack']"}, timeout: 40}
      - highlight: {target: {css: "#alarm-drawer.open div[data-id]:has-text('bus_voltage')"}, seconds: 4, point: false}
      - click: {css: "#alarm-drawer.open div[data-id]:has-text('bus_voltage') [data-act='ack']"}
      - wait: 1.5

  - id: check
    title: {en: "Check before you command", fr: "Vérifier avant de commander"}
    say:
      en: >-
        The first rule of the procedure is to read the telemetry before sending any command. The
        power page shows that the spacecraft has already acted: the payload line is off, the
        load-shed sequence is at level one, and the event list reports load shed stage one.
        Sending a payload off command now would serve no purpose. All other loads are still on,
        and the battery is charging.
      fr: >-
        La première règle de la procédure est de lire la télémesure avant d’envoyer la moindre
        commande. La page énergie montre que le satellite a déjà agi : la ligne de la charge
        utile est coupée, la séquence de délestage est au niveau un et la liste des événements
        signale le délestage de niveau un. Envoyer maintenant une commande de coupure de la
        charge utile ne servirait à rien. Toutes les autres charges sont encore alimentées, et
        la batterie se charge.
    do:
      - click: {css: "[data-page='eps']"}
      - wait_for: {target: {css: "#eps-flow svg, #eps-flow *"}, timeout: 20}
      - wait: 1.5
      - highlight: {target: {css: ".ds-card:has(#eps-flow)"}, seconds: 3, point: false}
      - highlight: {target: {css: ".ds-card:has(#eps-stepper)"}, seconds: 2.5}
      - highlight: {target: {css: ".ds-card:has(#eps-events)"}, seconds: 2.5}
    question:
      type: multichoice
      worksheet: WB-A-CTG-001/q1
      text:
        en: "The bus is under its limit. What do you do before sending any shed command?"
        fr: "Le bus est sous sa limite. Que faites-vous avant d’envoyer une commande de délestage ?"
      options:
        - text: {en: "Read the line states: the spacecraft may already have shed some loads.", fr: "Lire l’état des lignes : le satellite a peut-être déjà délesté certaines charges."}
          correct: true
          why: {en: "On-board FDIR acts in a second; the ground sheds only what is still on.", fr: "La FDIR de bord agit en une seconde ; le sol ne déleste que ce qui est encore alimenté."}
        - text: {en: "Send every shed command at once, to be safe.", fr: "Envoyer toutes les commandes de délestage d’un coup, par sécurité."}
          why: {en: "Shedding the transmitter can cost you the link you need to recover.", fr: "Couper l’émetteur peut vous faire perdre la liaison dont vous avez besoin pour rétablir."}
        - text: {en: "Wait for the next pass and see whether it clears.", fr: "Attendre le passage suivant pour voir si cela se résorbe."}
          why: {en: "In eclipse the battery keeps draining; the card is worked in this pass.", fr: "En éclipse, la batterie continue de se vider ; la fiche se traite pendant ce passage."}

  - id: card
    title: {en: "What the card says", fr: "Ce que dit la fiche"}
    say:
      en: >-
        The procedure is opened from the alarm row. Its objective explains the physics: load
        shedding does not raise the bus voltage, because the bus voltage follows the battery
        state of charge. What shedding changes is the rate at which the voltage falls. Each
        check in the procedure therefore asks whether the bus voltage has fallen to the next
        threshold.
      fr: >-
        La procédure s’ouvre depuis la ligne d’alarme. Son objectif en explique la physique : le
        délestage ne relève pas la tension du bus, car celle-ci suit l’état de charge de la
        batterie. Ce que le délestage modifie, c’est la vitesse à laquelle la tension baisse.
        Chaque vérification de la procédure demande donc si la tension du bus est descendue au
        seuil suivant.
    do:
      - js: "(() => { const d = document.getElementById('alarm-drawer'); if (!d.classList.contains('open')) document.getElementById('alarms-btn').click(); })()"
      - wait: 1.0
      - click: {css: "#alarm-drawer.open div[data-id]:has-text('bus_voltage') a.proc"}
      - wait_for: {target: {css: "#proc-doc h4"}, timeout: 20}
      - wait: 1.5
      - scroll: {target: {text: {en: "Shedding does not lift the bus", fr: "Le délestage ne relève pas le bus"}}}
      - highlight: {target: {text: {en: "Shedding does not lift the bus", fr: "Le délestage ne relève pas le bus"}}, seconds: 4}

  - id: decide
    title: {en: "Holding and monitoring", fr: "Maintenir et surveiller"}
    say:
      en: >-
        Step two concerns the payload, which the spacecraft has already switched off. The check
        is whether the bus voltage is above twenty-eight point four volts. Here it is rising
        again, because the spacecraft is in sunlight and the battery is charging. The result is
        GO: the procedure holds at this level and moves directly to monitoring. In eclipse the
        voltage would still be falling, and the operator would assess the next threshold, the
        cooler, at twenty-seven point eight volts.
      fr: >-
        L’étape deux concerne la charge utile, que le satellite a déjà coupée. La vérification
        consiste à savoir si la tension du bus est supérieure à vingt-huit virgule quatre volts.
        Ici, elle remonte, car le satellite est au soleil et la batterie se charge. Le résultat
        est un GO : la procédure se maintient à ce niveau et passe directement à la
        surveillance. En éclipse, la tension baisserait encore, et l’opérateur examinerait le
        seuil suivant, le refroidisseur, à vingt-sept virgule huit volts.
    do:
      - scroll: {target: {text: {en: "Shed Load Priority 1", fr: "Délester la charge de priorité 1"}}}
      - highlight: {target: {text: {en: "Shed Load Priority 1", fr: "Délester la charge de priorité 1"}}, seconds: 3}
      - scroll: {target: {text: {en: "Step 6: Monitor Recovery", fr: "Surveiller le rétablissement"}}}
      - highlight: {target: {text: {en: "Step 6: Monitor Recovery", fr: "Surveiller le rétablissement"}}, seconds: 3}
    question:
      type: multichoice
      worksheet: WB-A-CTG-001/q2
      text:
        en: "The payload is off and the bus reads 28.35 V, rising slowly in sunlight. What next?"
        fr: "La charge utile est coupée et le bus lit 28,35 V, en lente hausse au soleil. Et ensuite ?"
      options:
        - text: {en: "Hold at this level and monitor: the fall has stopped.", fr: "Maintenir ce niveau et surveiller : la baisse s’est arrêtée."}
          correct: true
          why: {en: "Each check asks whether the bus is still falling towards the next level. It is not.", fr: "Chaque vérification demande si le bus descend encore vers le niveau suivant. Ce n’est pas le cas."}
        - text: {en: "Shed the cooler: the bus is still under 28.4 V.", fr: "Délester le refroidisseur : le bus est encore sous 28,4 V."}
          why: {en: "Shedding does not lift the bus; only charging does. The cooler would buy nothing here.", fr: "Délester ne relève pas le bus ; seule la charge le fait. Le refroidisseur n’apporterait rien ici."}
        - text: {en: "Restore the payload: the bus is rising.", fr: "Rétablir la charge utile : le bus remonte."}
          why: {en: "Restore waits for 29.0 V and 50 % charge, with the bus stable.", fr: "Le rétablissement attend 29,0 V et 50 % de charge, avec un bus stable."}

  - id: recover
    title: {en: "Recovery", fr: "Le rétablissement"}
    say:
      en: >-
        Monitoring consists of a housekeeping request every minute and continuous observation of
        the bus voltage. To save time in this video, the instructor increases the simulation
        speed. The battery charges and the bus voltage rises. At twenty-eight point nine volts
        the spacecraft restores the payload line automatically. The last step of the procedure
        then commands only the loads that are still off, one at a time, while confirming that
        the bus voltage remains above the shedding threshold.
      fr: >-
        La surveillance consiste en une demande de servitude chaque minute et en une observation
        continue de la tension du bus. Pour gagner du temps dans cette vidéo, l’instructeur
        accélère la simulation. La batterie se charge et la tension du bus remonte. À vingt-huit
        virgule neuf volts, le satellite rétablit automatiquement la ligne de la charge utile.
        La dernière étape de la procédure ne commande alors que les charges encore coupées, une
        à la fois, en vérifiant que la tension du bus reste au-dessus du seuil de délestage.
    do:
      - click: {css: "[data-page='eps']"}
      - wait: 1.5
      - api: {app: instructor, method: POST, path: /api/command, json: {type: set_speed, value: 10}}
      - highlight: {target: {css: ".ds-card:has(#eps-flow)"}, seconds: 0.1, point: false}
      # ~4.5 min of simulated charging: the line comes back at 28.9 V, before LOS
      - wait: 30
      - api: {app: instructor, method: POST, path: /api/command, json: {type: set_speed, value: 1}}
      - highlight: {target: {css: ".ds-card:has(#eps-stepper)"}, seconds: 2.5}
    question:
      type: reflect
      worksheet: WB-A-CTG-001/q7
      text:
        en: "The same fault hits just after the spacecraft enters eclipse. Walk through what you would read, and when you would shed the next level."
        fr: "La même panne survient juste après l’entrée en éclipse. Décrivez ce que vous liriez, et à quel moment vous délesteriez le niveau suivant."
