# Design concept — structure, propulsion and data handling (textbook ch. 12):
# launch loads and what fails, margin of safety and first frequency, the
# rocket equation for a 600 km deorbit (cold gas, green mono, electrospray,
# whole-system mass), the on-board computer, radiation and storage sizing.
# Animated page video/explainers/structure.html. Whole design team.
id: V-DES-14
week: 6
audience: all
title:
  en: "Structure, propulsion and data handling"
  fr: "Structure, propulsion et gestion de bord"
summary:
  en: "Surviving launch, moving in orbit and keeping the data: launch loads and margins of safety, stiffness, the rocket equation and why whole systems must be compared, and the on-board computer, radiation and storage sizing."
  fr: "Survivre au lancement, manœuvrer en orbite et garder les données : charges de lancement et marges de sécurité, raideur, l’équation de la fusée et pourquoi comparer des systèmes entiers, et l’ordinateur de bord, le rayonnement et le dimensionnement du stockage."
apps:
  viz: default
fresh_stack: viz
ties: {}
sources:
  - design/docs/oer/chapters/12_structures_propulsion_obdh.md (§ 12.1, 12.2, 12.3)

setup:
  - goto: {app: viz, path: "/video/explainers/structure.html?lang={lang}", settle: 1.5}
  - cursor: hide

steps:
  - id: loads
    title: {en: "Launch loads", fr: "Les charges de lancement"}
    say:
      en: >-
        Launch is the most severe environment the spacecraft will experience. Thrust and
        aerodynamic loads produce six to twelve g along its axis. The low-frequency modes of the
        launch vehicle cause slow vibration, acoustic noise causes rapid vibration of five to
        fifteen g r m s, and separation events produce shocks of hundreds to thousands of g. In
        vibration testing, the primary structure rarely fails. Failures are more often found in
        the solder joints of tall components, in hold-down and hinge mechanisms, in lenses, and
        in harnesses that chafe against an edge.
      fr: >-
        Le lancement constitue l’environnement le plus sévère que subira le satellite. La
        poussée et les charges aérodynamiques produisent six à douze g le long de son axe. Les
        modes basse fréquence du lanceur provoquent des vibrations lentes, le bruit acoustique
        des vibrations rapides de cinq à quinze g efficaces, et les séparations des chocs de
        plusieurs centaines à plusieurs milliers de g. Lors des essais de vibration, la
        structure primaire cède rarement. Les défaillances se situent plus souvent dans les
        soudures des composants hauts, les mécanismes de maintien et les charnières, les
        lentilles et les faisceaux qui frottent contre une arête.
    do:
      - js: "EX.play('loads', ${say})"

  - id: margin
    title: {en: "Strength and stiffness", fr: "Résistance et raideur"}
    say:
      en: >-
        For strength, every load case must show a positive margin of safety, defined as the
        allowable stress divided by the product of the design stress and a factor of safety,
        minus one. A 3U rail at nine g carries about one hundred and ten newtons, which produces
        a very low stress in aluminium, so its margin is very large. For stiffness, the first
        natural frequency must remain above the limit set by the launch vehicle, usually forty
        hertz. The structure alone has a first mode near three hundred and thirty hertz, so in
        practice the first mode is usually determined by a heavy unit mounted on a bracket.
      fr: >-
        Pour la résistance, chaque cas de charge doit présenter une marge de sécurité positive,
        définie comme la contrainte admissible divisée par le produit de la contrainte de calcul
        et d’un coefficient de sécurité, moins un. Un rail de 3U à neuf g supporte environ cent
        dix newtons, ce qui produit une contrainte très faible dans l’aluminium : sa marge est
        donc très importante. Pour la raideur, la première fréquence propre doit rester
        au-dessus de la limite fixée par le lanceur, généralement quarante hertz. La structure
        seule a un premier mode vers trois cent trente hertz : en pratique, le premier mode est
        donc généralement déterminé par un équipement lourd monté sur une ferrure.
    do:
      - js: "EX.play('margin', ${say})"

  - id: propulsion
    title: {en: "The rocket equation", fr: "L’équation de la fusée"}
    say:
      en: >-
        Deorbiting from six hundred kilometres requires a velocity change of about one hundred
        and twelve metres per second. According to the rocket equation, the propellant mass
        increases exponentially with the ratio of this velocity change to the exhaust velocity.
        A cold-gas system needs about a kilogram of propellant. A green monopropellant needs a
        quarter of that, but the complete system has a mass of three kilograms. An electrospray
        thruster gives the lowest total mass, but the manoeuvre takes several months. Complete
        systems should be compared, not only their propellant. At five hundred kilometres,
        EOSat-3U needs no propulsion, because atmospheric drag brings it down.
      fr: >-
        Désorbiter depuis six cents kilomètres exige un changement de vitesse d’environ cent
        douze mètres par seconde. Selon l’équation de la fusée, la masse d’ergols augmente de
        façon exponentielle avec le rapport entre ce changement de vitesse et la vitesse
        d’éjection. Un système à gaz froid nécessite environ un kilogramme d’ergols. Un monergol
        vert en demande quatre fois moins, mais le système complet a une masse de trois
        kilogrammes. Un propulseur à électronébulisation donne la masse totale la plus faible,
        mais la manœuvre dure plusieurs mois. Il faut comparer des systèmes complets, et pas
        seulement leurs ergols. À cinq cents kilomètres, EOSat-3U n’a pas besoin de propulsion,
        car la traînée atmosphérique le fait rentrer.
    do:
      - js: "EX.play('propulsion', ${say})"
    question:
      type: multichoice
      text:
        en: "Why can the propulsion option with the least propellant still be the heaviest choice?"
        fr: "Pourquoi l’option de propulsion avec le moins d’ergols peut-elle être le choix le plus lourd ?"
      options:
        - text: {en: "Tanks, valves, heaters and electronics can outweigh the propellant saved.", fr: "Réservoirs, vannes, réchauffeurs et électronique peuvent peser plus que les ergols économisés."}
          correct: true
          why: {en: "Green monopropellant: 0.25 kg of propellant, but about 3 kg of system.", fr: "Monergol vert : 0,25 kg d’ergols, mais environ 3 kg de système."}
        - text: {en: "Higher specific impulse always means a heavier thruster.", fr: "Une impulsion spécifique plus élevée signifie toujours un propulseur plus lourd."}
          why: {en: "Electrospray has the highest Isp here and the lightest system.", fr: "L’électronébulisation a ici l’Isp le plus élevé et le système le plus léger."}
        - text: {en: "The rocket equation adds the dry mass twice.", fr: "L’équation de la fusée compte deux fois la masse sèche."}
          why: {en: "It uses dry mass once, to scale the propellant.", fr: "Elle n’utilise la masse sèche qu’une fois, pour proportionner les ergols."}

  - id: obdh
    title: {en: "Computer and storage", fr: "Ordinateur et stockage"}
    say:
      en: >-
        The on-board computer usually runs a real-time operating system, which is deterministic
        and compact and keeps tasks separate. In orbit, energetic particles can flip bits and
        cause latch-up in circuits, so the memory uses error detection and correction, or EDAC,
        a watchdog resets the processor if it stops responding, and current limiters protect
        against latch-up. Data storage should be sized for adverse conditions: seven hundred and
        twenty megabytes per day, for three days without a complete downlink, with a factor of
        two margin. This leads to a specification of eight gigabytes of storage.
      fr: >-
        L’ordinateur de bord fonctionne généralement sous un système d’exploitation temps réel,
        déterministe et compact, qui isole les tâches les unes des autres. En orbite, des
        particules énergétiques peuvent inverser des bits et provoquer le verrouillage de
        circuits : la mémoire utilise donc une détection et correction d’erreurs, ou EDAC, un
        chien de garde réinitialise le processeur s’il cesse de répondre, et des limiteurs de
        courant protègent contre le verrouillage. Le stockage des données doit être dimensionné
        pour des conditions défavorables : sept cent vingt mégaoctets par jour, pendant trois
        jours sans transmission complète, avec une marge d’un facteur deux. On aboutit ainsi à
        une spécification de huit gigaoctets de mémoire.
    do:
      - js: "EX.play('obdh', ${say})"
    question:
      type: reflect
      text:
        en: "Does your mission need propulsion at all? Justify it from your altitude, lifetime and the disposal rule."
        fr: "Votre mission a-t-elle besoin de propulsion ? Justifiez-le par votre altitude, votre durée de vie et la règle de retrait."
