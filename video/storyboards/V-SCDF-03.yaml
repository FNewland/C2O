# Week 6 — the SpaceCDF link budget tool (Analyses › Link budget): the
# downlink term by term at the worst-case slant range, margin traded for data
# rate, a smaller ground dish, the uplink, and Apply to Design. Prepares
# LW-3.3/B and the decision record D-3.3-LINK. Follows the concept video
# V-DES-10 (same S-band numbers: margin 17.5 dB at 1 Mbit/s, 1695 km).
id: V-SCDF-03
week: 7
audience: all
title:
  en: "The link budget tool"
  fr: "L’outil de bilan de liaison"
summary:
  en: "Use SpaceCDF's link budget, term by term: read the downlink at the worst-case range, trade margin for data rate, test a smaller ground antenna, check the uplink, and apply the result to the design."
  fr: "Utiliser le bilan de liaison de SpaceCDF, terme par terme : lire la liaison descendante à la distance la plus défavorable, échanger de la marge contre du débit, essayer une antenne sol plus petite, vérifier la liaison montante, et appliquer le résultat à la conception."
apps:
  spacecdf: default
ties:
  worksheets: [LW-3.3/B]
  decisions: [D-3.3-LINK]
sources:
  - design/frontend/src/components/LinkBudgetTool.tsx
  - design/docs/oer/chapters/11_communications.md (§ 11.2, 11.4.1, 11.8.1)
  - design/tests/test_api/diagram_seed.py (the EOSAT-1-like study)

setup:
  - python: {call: "video/c2ovideo/helpers.py:seed_spacecdf_eosat", app: spacecdf, save: study}
  - goto: {app: spacecdf, path: "/?study=${study}&lang={lang}", settle: 2}
  - fill: {target: "input", text: {en: "Kai (Communications)", fr: "Kai (Télécommunications)"}}
  - click: {target: {role: button, name: Join, exact: true}, instant: true}
  - wait: 2

steps:
  - id: open
    title: {en: "Open the link budget", fr: "Ouvrir le bilan de liaison"}
    say:
      en: >-
        The link budget is in the Analyses tab, under Link budget. The inputs are on the left:
        the transmitter, the propagation path and the ground receiver. The budget is set out
        term by term on the right, in the same form as chapter eleven of the textbook. The slant
        range is initially set to the worst case, which is the distance to a ground station at
        ten degrees elevation: about seventeen hundred kilometres from a five-hundred-kilometre
        orbit.
      fr: >-
        Le bilan de liaison se trouve dans l’onglet Analyses, sous Bilan de liaison. Les données
        d’entrée sont à gauche : l’émetteur, le trajet de propagation et le récepteur au sol. Le
        bilan est présenté terme par terme à droite, sous la même forme qu’au chapitre onze du
        manuel. La distance oblique est d’abord réglée sur le cas le plus défavorable, soit la
        distance jusqu’à une station sol à dix degrés d’élévation : environ dix-sept cents
        kilomètres depuis une orbite à cinq cents kilomètres.
    do:
      - click: {role: tab, name: Analyses}
      - wait: 1.0
      - click: {css: "[data-where='analyses:link_budget']"}
      - wait: 1.2
      - scroll: {target: {text: "Link Budget Calculator", exact: true}}
      - highlight: {target: {label: "Slant Range (km)", exact: true}, seconds: 3}

  - id: read
    title: {en: "Reading the budget", fr: "Lire le bilan"}
    say:
      en: >-
        The budget is read from the top. A two-watt transmitter, a six-decibel patch antenna and
        the cable losses give an effective isotropic radiated power of seven and a half
        decibel-watts. The free-space path loss removes one hundred and sixty-four decibels. The
        figure of merit of the ground station, its gain-to-noise-temperature ratio, recovers
        most of this loss. After accounting for the data rate and the requirement of the
        modulation scheme, the margin is seventeen and a half decibels. Any margin above three
        decibels closes the link.
      fr: >-
        Le bilan se lit de haut en bas. Un émetteur de deux watts, une antenne patch de six
        décibels et les pertes de câble donnent une puissance isotrope rayonnée équivalente de
        sept décibels-watts et demi. L’affaiblissement en espace libre retire cent
        soixante-quatre décibels. Le facteur de mérite de la station sol, le rapport entre son
        gain et sa température de bruit, compense l’essentiel de cette perte. Compte tenu du
        débit et de l’exigence du schéma de modulation, la marge est de dix-sept décibels et
        demi. Toute marge supérieure à trois décibels permet de fermer la liaison.
    do:
      - highlight: {target: {css: "tr:has-text('EIRP')"}, seconds: 2.5}
      - highlight: {target: {css: "tr:has-text('Free Space Path Loss'), tr:has-text('Affaiblissement')"}, seconds: 2.5}
      - highlight: {target: {css: "tr:has-text('G/T')"}, seconds: 2.5}
      - highlight: {target: {css: "tr:has-text('LINK MARGIN'), tr:has-text('MARGE DE LIAISON')"}, seconds: 3}

  - id: rate
    title: {en: "Trading margin for data rate", fr: "Échanger la marge contre du débit"}
    say:
      en: >-
        A margin this large represents unused capacity. When the data rate is increased from one
        to five megabits per second, the margin falls by seven decibels, to about ten and a
        half, since each doubling of the data rate costs three decibels. The link then delivers
        more data per pass while retaining a comfortable margin.
      fr: >-
        Une marge aussi importante représente une capacité inutilisée. Lorsque le débit passe
        d’un à cinq mégabits par seconde, la marge baisse de sept décibels, à environ dix et
        demi, puisque chaque doublement du débit coûte trois décibels. La liaison transmet alors
        davantage de données par passage tout en conservant une marge confortable.
    do:
      - fill: {target: {label: "Data Rate (bps)", exact: true}, text: "5000000", settle: 1.0}
      - highlight: {target: {css: "tr:has-text('LINK MARGIN'), tr:has-text('MARGE DE LIAISON')"}, seconds: 3}
    question:
      type: multichoice
      worksheet: LW-3.3/B
      text:
        en: "At 5 Mbit/s the margin is about 10.5 dB. Roughly what is it at 10 Mbit/s?"
        fr: "À 5 Mbit/s, la marge est d’environ 10,5 dB. Que vaut-elle à peu près à 10 Mbit/s ?"
      options:
        - text: {en: "About 7.5 dB: doubling the rate costs 3 dB.", fr: "Environ 7,5 dB : doubler le débit coûte 3 dB."}
          correct: true
          why: {en: "10 log10(2) ≈ 3 dB less energy per bit.", fr: "10 log10(2) ≈ 3 dB d’énergie par bit en moins."}
        - text: {en: "About 5 dB: half the margin.", fr: "Environ 5 dB : la moitié de la marge."}
          why: {en: "Decibels subtract; they do not halve.", fr: "Les décibels se soustraient ; ils ne se divisent pas par deux."}
        - text: {en: "Still 10.5 dB: the rate does not enter the budget.", fr: "Toujours 10,5 dB : le débit n’entre pas dans le bilan."}
          why: {en: "Eb/N0 = C/N0 − 10 log10(rate).", fr: "Eb/N0 = C/N0 − 10 log10(débit)."}

  - id: dish
    title: {en: "A smaller ground station", fr: "Une station sol plus petite"}
    say:
      en: >-
        The ground segment can be tested in the same way. A university station might use a
        one-and-a-half-metre dish instead of a three-metre dish, which has a quarter of the area
        and therefore six decibels less gain. With the receive gain set to twenty-nine decibels,
        the margin falls to about four and a half decibels. The link still closes, but with
        little reserve for a poor pass. A result of this kind should be recorded, together with
        the options that were considered.
      fr: >-
        Le segment sol peut être évalué de la même façon. Une station universitaire peut
        utiliser une antenne d’un mètre et demi au lieu de trois mètres, soit un quart de la
        surface et donc six décibels de gain en moins. Avec un gain de réception réglé à
        vingt-neuf décibels, la marge tombe à environ quatre décibels et demi. La liaison se
        ferme encore, mais avec peu de réserve pour un passage défavorable. Un résultat de ce
        type doit être consigné, avec les options envisagées.
    do:
      - fill: {target: {label: "RX Antenna Gain (dBi)", exact: true}, text: "29", settle: 1.0}
      - highlight: {target: {css: "tr:has-text('LINK MARGIN'), tr:has-text('MARGE DE LIAISON')"}, seconds: 3}

  - id: uplink
    title: {en: "The uplink", fr: "La liaison montante"}
    say:
      en: >-
        The Uplink button reverses the direction of the link. The ground station now transmits
        twenty watts into a large dish, an effective radiated power of about forty-six
        decibel-watts, towards a small patch antenna on the spacecraft, at only a few kilobits
        per second. The margin is very large. For a small satellite the limiting link is almost
        always the downlink rather than the command uplink. The uplink calculation here is a
        what-if analysis and does not change the design.
      fr: >-
        Le bouton Montante inverse le sens de la liaison. C’est maintenant la station sol qui
        émet vingt watts dans une grande antenne, soit une puissance rayonnée d’environ
        quarante-six décibels-watts, vers une petite antenne patch sur le satellite, à quelques
        kilobits par seconde seulement. La marge est très importante. Pour un petit satellite,
        la liaison limitante est presque toujours la liaison descendante, et non la liaison
        montante des télécommandes. Le calcul de la liaison montante est ici une analyse de
        sensibilité et ne modifie pas la conception.
    do:
      - click: {role: button, name: "Uplink (Ground→Space)"}
      - wait: 1.0
      - highlight: {target: {css: "tr:has-text('EIRP')"}, seconds: 2.5}
      - highlight: {target: {css: "tr:has-text('LINK MARGIN'), tr:has-text('MARGE DE LIAISON')"}, seconds: 2.5}

  - id: apply
    title: {en: "Apply to the design", fr: "Appliquer à la conception"}
    say:
      en: >-
        Returning to the downlink restores the previous settings. Apply to Design writes the
        link parameters into the shared model, so that the design loop, the data budget and the
        other positions all use the same link. The team then records decision D three point
        three, Link: the margin accepted, with the antenna, transmit power and ground station
        chosen, and the reasons for that choice.
      fr: >-
        Le retour à la liaison descendante rétablit les réglages précédents. Appliquer à la
        conception enregistre les paramètres de liaison dans le modèle partagé, afin que la
        boucle de conception, le bilan de données et les autres postes utilisent tous la même
        liaison. L’équipe consigne ensuite la décision D trois point trois, Liaison : la marge
        retenue, avec l’antenne, la puissance d’émission et la station sol choisies, et les
        raisons de ce choix.
    do:
      - click: {role: button, name: "Downlink (Space→Ground)"}
      - wait: 1.0
      - highlight: {target: {role: button, name: "Apply to Design"}, seconds: 2.5}
      - click: {role: button, name: "Apply to Design"}
      - wait: 1.5
    question:
      type: reflect
      worksheet: LW-3.3/B
      text:
        en: "Which ground station will your mission use, and what margin does your downlink have at 10° elevation with it?"
        fr: "Quelle station sol votre mission utilisera-t-elle, et quelle marge votre liaison descendante a-t-elle avec elle à 10° d’élévation ?"
