# Week 5 — LEOP-004: deploy the solar wings and read the energy balance before
# and after on the EPS power flow. Starts from card-LEOP-004 (the card's real
# entry state) in a pass. Nominal card: nothing here is a scored-run recovery.
id: V-OPS-05
week: 10
audience: all
title:
  en: "LEOP-004: solar array deployment and the energy balance"
  fr: "LEOP-004 : déploiement des panneaux solaires et bilan d’énergie"
summary:
  en: "This video reads the power flow with only the body-mounted panels, deploys both solar array wings and confirms their deployment. It then shows the effect of the deployment on the orbit-average energy balance."
  fr: "Cette vidéo lit le flux de puissance avec les seuls panneaux de structure, déploie les deux ailes du générateur solaire et confirme leur déploiement. Elle montre ensuite l’effet du déploiement sur le bilan d’énergie moyen sur l’orbite."
apps:
  mcs: default
fresh_stack: sim
ties:
  cards: [LEOP-004]
sources:
  - sim/configs/eosat1/procedures/leop/solar_array_verification.md (LEOP-004)
  - sim/packages/smo-common/src/smo_common/ui/viz/powerflow.js (the power flow)

setup:
  - api: {app: instructor, method: POST, path: /api/command, json: {type: load_breakpoint, name: card-LEOP-004}}
  - wait: 2
  - python: {call: "video/c2ovideo/helpers.py:ff_to_pass", app: instructor, kwargs: {planner: "${planner_url}", min_duration: 480, min_elevation: 15, after_aos: 10}}
  # any accepted command re-arms the transmitter (auto-TX hold-down)
  - api: {app: mcs, method: POST, path: /api/pus-command, json: {service: 3, subtype: 27, data_hex: "0001", name: HK_REQUEST, position: flight_director}}
  - wait: 3
  - goto: {app: mcs, path: "/?lang={lang}&position=flight_director", settle: 4}
  - js: "fetch('/api/logbook', {method: 'DELETE', credentials: 'same-origin'})"
  - reload: 4

steps:
  - id: before
    title: {en: "Body panels only", fr: "Les panneaux de structure seuls"}
    say:
      en: >-
        This is LEOP-004, a procedure of the launch and early orbit phase, and the solar wings
        are still stowed. The power page shows the power flow from the arrays through the bus,
        the common supply line, to the loads and the battery, with the width of each line
        proportional to the power. Only the body-mounted panels are illuminated, and they
        provide a few watts. The projection on the right shows the orbit-average margin, which
        is the energy generated minus the energy consumed over a complete orbit. It is negative,
        which means that the battery would discharge if nothing changed.
      fr: >-
        Voici LEOP-004, une procédure de la phase de lancement et de début d’orbite, et les
        ailes solaires sont encore repliées. La page énergie présente le flux de puissance, des
        générateurs au bus, la ligne d’alimentation commune, puis aux charges et à la batterie,
        la largeur de chaque trait étant proportionnelle à la puissance. Seuls les panneaux
        fixés sur la structure sont éclairés, et ils fournissent quelques watts. La projection à
        droite indique la marge moyenne sur l’orbite, c’est-à-dire l’énergie produite moins
        l’énergie consommée sur une orbite complète. Elle est négative : la batterie se
        déchargerait si rien ne changeait.
    do:
      - click: {css: "#rail-eps"}
      - wait: 1.5
      - highlight: {target: {css: "#eps-flow"}, seconds: 4, point: false}
      - highlight: {target: {css: "#eps-orbit-margin"}, seconds: 4}
    question:
      type: multichoice
      text:
        en: "Before deployment the orbit-average margin is negative. What does that tell you?"
        fr: "Avant le déploiement, la marge moyenne sur l’orbite est négative. Qu’est-ce que cela vous apprend ?"
      options:
        - text: {en: "Over a full orbit the loads take more energy than the arrays give: the battery loses charge every orbit.", fr: "Sur une orbite entière, les charges prennent plus d’énergie que n’en donnent les générateurs : la batterie perd de la charge à chaque orbite."}
          correct: true
          why: {en: "It is a balance over the orbit, eclipse included, not an instant reading.", fr: "C’est un bilan sur l’orbite, éclipse comprise, pas une mesure instantanée."}
        - text: {en: "The battery is discharging right now.", fr: "La batterie se décharge en ce moment."}
          why: {en: "Look at the flow: in sunlight it is still charging. The margin is about the whole orbit.", fr: "Regardez le flux : au soleil, elle se charge encore. La marge porte sur toute l’orbite."}
        - text: {en: "One of the wings has failed.", fr: "L’une des ailes est en panne."}
          why: {en: "They are not deployed yet: that is the point of this card.", fr: "Elles ne sont pas encore déployées : c’est l’objet de cette fiche."}

  - id: deploy
    title: {en: "Step 0: deploy both solar array wings", fr: "Étape 0 : déployer les deux ailes solaires"}
    say:
      en: >-
        Step 0 deploys both wings with a single command, wing code two. This is a critical,
        irreversible command, so the console asks for confirmation before sending it. The
        release takes up to forty-five seconds: the wing status first shows deploying and then
        deployed. The operator monitors the array regulator, which displays the total generated
        power, during the deployment.
      fr: >-
        L’étape 0 déploie les deux ailes en une seule commande, code d’aile deux. Il s’agit
        d’une commande critique et irréversible : la console demande donc une confirmation avant
        de l’envoyer. Le déploiement prend jusqu’à quarante-cinq secondes : l’état des ailes
        indique d’abord en cours, puis déployé. L’opérateur surveille le régulateur des
        générateurs, qui affiche la puissance totale produite, pendant le déploiement.
    do:
      - click: {css: "#rail-cmd"}
      - select: {target: {css: "#cmd-catalog"}, value: EPS_DEPLOY_WING}
      - wait: 0.6
      - fill: {target: {css: "#cmd-fields [data-cmd-field='wing']"}, text: "2"}
      - click: {css: "#cmd-send:not(.hide), #cmd-send-crit:not(.hide)"}
      - wait: 1.0
      - highlight: {target: {css: "#cmd-verif-stepper"}, seconds: 3}
      - click: {css: "#rail-eps"}
      - wait: 1.0
      - highlight: {target: {css: "#eps-flow"}, seconds: 4, point: false}

  - id: confirm
    title: {en: "Steps 1 to 3: confirm each wing", fr: "Étapes 1 à 3 : confirmer chaque aile"}
    say:
      en: >-
        An increase in generated power does not by itself confirm the deployment. The operator
        requests the power housekeeping report, structure identifier one, or SID one, and reads
        the wing status, where a value of three means that both wings are deployed. The wing
        currents are not included in the routine report, so the card requests each one by
        parameter number: hex one four six for the plus Y wing and hex one four seven for the
        minus Y wing. In sunlight, both wings must deliver current. Until these parameters are
        requested, the wings on the power flow show no data.
      fr: >-
        Une hausse de la puissance produite ne confirme pas à elle seule le déploiement.
        L’opérateur demande le rapport de servitude énergie, identifiant de structure un, ou SID
        un, et lit l’état des ailes, la valeur trois signifiant que les deux ailes sont
        déployées. Les courants des ailes ne figurent pas dans le rapport courant : la fiche
        demande donc chacun par son numéro de paramètre, un quatre six hexadécimal pour l’aile
        plus Y et un quatre sept hexadécimal pour l’aile moins Y. Au soleil, les deux ailes
        doivent débiter du courant. Tant que ces paramètres n’ont pas été demandés, les ailes du
        flux de puissance n’affichent aucune donnée.
    do:
      - wait: 18
      - click: {css: "#rail-cmd"}
      - select: {target: {css: "#cmd-catalog"}, value: HK_REQUEST}
      - fill: {target: {css: "#cmd-fields [data-cmd-field='sid']"}, text: "1"}
      - click: {css: "#cmd-send"}
      - wait: 1.5
      - select: {target: {css: "#cmd-catalog"}, value: GET_PARAM}
      - fill: {target: {css: "#cmd-fields [data-cmd-field='param_id']"}, text: "326"}
      - click: {css: "#cmd-send"}
      - wait: 1.2
      - fill: {target: {css: "#cmd-fields [data-cmd-field='param_id']"}, text: "327"}
      - click: {css: "#cmd-send"}
      - wait: 1.5
      - click: {css: "#rail-eps"}
      - wait: 1.0
      - highlight: {target: {css: "#page-eps tr[data-param='0x0144']"}, seconds: 2.5}
      - highlight: {target: {css: "#page-eps tr[data-param='0x0146']"}, seconds: 2}
      - highlight: {target: {css: "#page-eps tr[data-param='0x0147']"}, seconds: 2}

  - id: after
    title: {en: "The energy balance after", fr: "Le bilan d’énergie après"}
    say:
      en: >-
        The power flow now shows the power from each wing, and total generation has increased.
        The margin, however, fluctuates around zero, because the spacecraft is still tumbling
        and the wings face the Sun only part of the time. The energy generated and consumed over
        the current orbit, shown in watt-hours at the bottom, indicates whether the battery will
        end the orbit with more or less charge. Deploying the wings is therefore not sufficient
        on its own; the next procedure, Sun acquisition, points them towards the Sun.
      fr: >-
        Le flux de puissance affiche maintenant la puissance de chaque aile, et la production
        totale a augmenté. La marge, en revanche, oscille autour de zéro, car le satellite
        tourne encore sur lui-même et les ailes ne font face au Soleil qu’une partie du temps.
        L’énergie produite et consommée sur l’orbite en cours, affichée en wattheures en bas,
        indique si la batterie finira l’orbite plus ou moins chargée. Le déploiement des ailes
        ne suffit donc pas à lui seul ; la procédure suivante, l’acquisition du Soleil, les
        oriente vers le Soleil.
    do:
      - scroll: {css: "#eps-flow"}
      - highlight: {target: {css: "#eps-flow"}, seconds: 3.5, point: false}
      - highlight: {target: {css: "#eps-orbit-margin"}, seconds: 3.5}
    question:
      type: truefalse
      answer: false
      text:
        en: "If the arrays give 20 W in sunlight, the spacecraft can run 20 W of loads all orbit long."
        fr: "Si les générateurs donnent 20 W au soleil, le satellite peut alimenter 20 W de charges pendant toute l’orbite."

  - id: card
    title: {en: "Record it on the card", fr: "Le consigner sur la fiche"}
    say:
      en: >-
        On the card, the operator captures the values and marks step 0 GO. Two checks are
        completed later in the pass or during the next one: the power profile through an
        eclipse, when generation falls to zero and the battery supplies all the loads, and the
        symmetry of the two wing currents, which must agree within fifteen percent.
      fr: >-
        Sur la fiche, l’opérateur relève les valeurs et marque l’étape 0 GO. Deux vérifications
        sont effectuées plus tard dans le passage ou au passage suivant : le profil de puissance
        pendant une éclipse, lorsque la production tombe à zéro et que la batterie alimente
        toutes les charges, et la symétrie des courants des deux ailes, qui doivent concorder à
        quinze pour cent près.
    do:
      - click: {css: "#rail-proc"}
      - select: {target: {css: "#proc-source"}, value: ops}
      - wait: 0.8
      - select: {target: {css: "#proc-type"}, value: leop/solar_array_verification.md}
      - wait: 2.0
      - scroll: {css: "#proc-doc section[data-pc-step='s0']"}
      - click: {css: "#proc-doc section[data-pc-step='s0'] [data-pc='capture']"}
      - click: {css: "#proc-doc section[data-pc-step='s0'] [data-pc='tick'][data-r='go']"}
      - wait: 1.0
      - scroll: {css: "#proc-doc section[data-pc-step='s5']"}
      - highlight: {target: {css: "#proc-doc section[data-pc-step='s5']"}, seconds: 3, point: false}
