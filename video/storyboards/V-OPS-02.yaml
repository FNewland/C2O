# Week 4 — LEOP-001 walkthrough before the standalone LEOP run.
# Starts from the card's real entry state (breakpoint card-LEOP-001, made by
# sim/tools/card_breakpoints.py from the acceptance fly-through) and flies the
# first command path by hand: blind uplink, bootloader check, application boot.
# Prepares WB-5.5-L001 q2, q4, q5 and the log line q9.
id: V-OPS-02
week: 9
audience: all
title:
  en: "LEOP-001: first contact and OBC boot"
  fr: "LEOP-001 : premier contact et démarrage de l’OBC"
summary:
  en: "From a silent spacecraft in its bootloader to an application running and housekeeping on: the blind first uplink, the bootloader check and the boot, card in hand."
  fr: "D’un satellite muet dans son chargeur d’amorçage à une application qui tourne et des données de servitude activées : la première montée en aveugle, la vérification du chargeur et le démarrage, fiche en main."
apps:
  mcs: default
# restart simulator + MCS before each take (python -m c2ovideo stack)
fresh_stack: sim
ties:
  worksheets: [WB-5.5-L001, WB-5.5-L001/q2, WB-5.5-L001/q5, WB-5.5-L001/q9]
  cards: [LEOP-001]
sources:
  - sim/configs/eosat1/procedures/leop/first_acquisition.md (LEOP-001)
  - sim/tests/test_acceptance/test_leop_commissioning_flythrough.py (entry state)

setup:
  - api: {app: instructor, method: POST, path: /api/command, json: {type: load_breakpoint, name: card-LEOP-001}}
  - wait: 2
  - python: {call: "video/c2ovideo/helpers.py:ff_to_pass", app: instructor, kwargs: {planner: "${planner_url}", min_duration: 300, min_elevation: 10, after_aos: 10}}
  - goto: {app: mcs, path: "/?lang={lang}&position=flight_director", settle: 4}
  - js: "fetch('/api/logbook', {method: 'DELETE', credentials: 'same-origin'})"
  - reload: 4

steps:
  - id: silent
    title: {en: "No signal from the spacecraft", fr: "Aucun signal du satellite"}
    say:
      en: >-
        EOSAT-1 has just separated from the launch vehicle. Only the receiver and the on-board
        computer, the OBC, are powered. The OBC is still running its bootloader, the small
        start-up program that runs before the main flight software. The transmitter is off and
        the on-board clock has not been set, so the ground station receives nothing. LEOP-001 is
        the first procedure of the launch and early orbit phase, or LEOP, and its purpose is to
        establish two-way communication with the spacecraft. It is executed manually: commands
        are sent from the Commanding page and each check is recorded on the card.
      fr: >-
        EOSAT-1 vient de se séparer du lanceur. Seuls le récepteur et l’ordinateur de bord,
        l’OBC, sont alimentés. L’OBC exécute encore son chargeur d’amorçage, le petit programme
        de démarrage qui précède le logiciel de vol principal. L’émetteur est éteint et
        l’horloge de bord n’a pas été réglée : la station sol ne reçoit donc rien. LEOP-001 est
        la première procédure de la phase de lancement et de début d’orbite, la LEOP, et son
        objet est d’établir une communication bidirectionnelle avec le satellite. Elle s’exécute
        manuellement : les commandes sont envoyées depuis la page Commande et chaque
        vérification est consignée sur la fiche.
    do:
      - click: {css: "#rail-proc"}
      - select: {target: {css: "#proc-source"}, value: ops}
      - wait: 0.8
      - select: {target: {css: "#proc-type"}, value: leop/first_acquisition.md}
      - wait: 2.0
      - scroll: {css: "#proc-doc"}
      - highlight: {target: {css: "#proc-doc"}, seconds: 3, point: false}

  - id: uplink
    title: {en: "Step 2: the blind first uplink", fr: "Étape 2 : la première montée en aveugle"}
    say:
      en: >-
        Because there is no downlink yet, the first command is sent without confirmation, during
        the scheduled pass. The connection test is one of the few commands the bootloader
        accepts. When the spacecraft accepts it, the auto-transmit hold-down switches the
        transmitter on for five minutes. The reports from service one, request verification,
        shown as S1 on the console, confirm that the command was accepted and then executed. The
        status strip now shows that the spacecraft is visible.
      fr: >-
        Comme il n’y a pas encore de liaison descendante, la première commande est envoyée sans
        confirmation, pendant le passage prévu. Le test de connexion fait partie des quelques
        commandes acceptées par le chargeur d’amorçage. Lorsque le satellite l’accepte, le
        maintien automatique de l’émetteur l’allume pour cinq minutes. Les rapports du service
        un, vérification des requêtes, affichés S1 sur la console, confirment que la commande a
        été acceptée, puis exécutée. Le bandeau d’état indique maintenant que le satellite est
        visible.
    do:
      - click: {css: "#rail-cmd"}
      - select: {target: {css: "#cmd-catalog"}, value: CONNECTION_TEST}
      - click: {css: "#cmd-send"}
      - wait: 2.0
      - highlight: {target: {css: "#cmd-verif-stepper"}, seconds: 3}
      - wait: 2.0
      - highlight: {target: {css: "header"}, seconds: 3, point: false}
    question:
      type: multichoice
      worksheet: WB-5.5-L001/q2
      text:
        en: "Why can the first uplink be sent while the ground still hears nothing?"
        fr: "Pourquoi peut-on envoyer la première montée alors que le sol n’entend encore rien ?"
      options:
        - text: {en: "Any accepted command powers the transmitter (auto-TX hold-down), so the answer follows the command.", fr: "Toute commande acceptée allume l’émetteur (maintien automatique de l’émission) : la réponse suit la commande."}
          correct: true
          why: {en: "That is why the card sends it blind, inside the scheduled pass.", fr: "C’est pourquoi la fiche l’envoie en aveugle, pendant le passage prévu."}
        - text: {en: "The transmitter is already on after separation.", fr: "L’émetteur est déjà allumé après la séparation."}
          why: {en: "At cold boot only the receiver and the OBC are powered.", fr: "Au démarrage à froid, seuls le récepteur et l’OBC sont alimentés."}
        - text: {en: "The ground station locks on the UHF beacon first.", fr: "La station sol s’accroche d’abord à la balise UHF."}
          why: {en: "The card does not rely on the beacon to open the S-band link.", fr: "La fiche ne compte pas sur la balise pour ouvrir la liaison en bande S."}

  - id: bootloader
    title: {en: "Step 4: confirm the bootloader", fr: "Étape 4 : confirmer le chargeur d’amorçage"}
    say:
      en: >-
        Before the boot, the operator confirms the starting state by requesting the beacon
        housekeeping report, structure identifier eleven, or SID eleven. Housekeeping is the
        routine health data, and this is the only report the bootloader sends. It includes the
        software image parameter, which identifies the program that is running. A value of zero
        means the bootloader.
      fr: >-
        Avant le démarrage, l’opérateur confirme l’état de départ en demandant le rapport de
        servitude de la balise, identifiant de structure onze, ou SID onze. Les données de
        servitude sont les données de santé courantes, et ce rapport est le seul qu’envoie le
        chargeur d’amorçage. Il contient le paramètre d’image logicielle, qui identifie le
        programme en cours d’exécution. La valeur zéro correspond au chargeur d’amorçage.
    do:
      - select: {target: {css: "#cmd-catalog"}, value: HK_REQUEST}
      - fill: {target: {css: "#cmd-fields [data-cmd-field='sid']"}, text: "11"}
      - click: {css: "#cmd-send"}
      - wait: 2.5

  - id: boot
    title: {en: "Step 5: boot the application", fr: "Étape 5 : démarrer l’application"}
    say:
      en: >-
        The operator then commands the boot of the application image. The computer verifies the
        integrity of the image over a period of ten seconds. The acceptance report arrives
        immediately, but the boot is complete only when the execution report arrives at the end
        of that period. Until then the computer is still running the bootloader and rejects
        other commands, so the operator waits for the execution report before sending the next
        command.
      fr: >-
        L’opérateur commande ensuite le démarrage de l’image applicative. L’ordinateur vérifie
        l’intégrité de l’image pendant dix secondes. Le rapport d’acceptation arrive
        immédiatement, mais le démarrage n’est terminé qu’à la réception du rapport d’exécution,
        à la fin de cette période. D’ici là, l’ordinateur exécute encore le chargeur d’amorçage
        et rejette les autres commandes : l’opérateur attend donc le rapport d’exécution avant
        d’envoyer la commande suivante.
    do:
      - select: {target: {css: "#cmd-catalog"}, value: OBC_BOOT_APP}
      - click: {css: "#cmd-send:not(.hide), #cmd-send-crit:not(.hide)"}
      - wait: 1.5
      - highlight: {target: {css: "#cmd-verif-stepper"}, seconds: 4}
      - wait: 9.0
    question:
      type: truefalse
      worksheet: WB-5.5-L001/q5
      answer: false
      text:
        en: "As soon as OBC_BOOT_APP is accepted (S1.1), you can send the next command."
        fr: "Dès qu’OBC_BOOT_APP est acceptée (S1.1), on peut envoyer la commande suivante."

  - id: hk
    title: {en: "Enabling housekeeping", fr: "Activer les données de servitude"}
    say:
      en: >-
        The application software starts with only two housekeeping reports enabled, power and
        beacon. The others must be enabled by command: SID three for thermal, SID four for the
        on-board computer and SID six for the radio. Switching on a subsystem does not enable
        its report; that always requires a separate command.
      fr: >-
        Le logiciel applicatif démarre avec seulement deux rapports de servitude activés :
        l’énergie et la balise. Les autres doivent être activés par commande : le SID trois pour
        le thermique, le SID quatre pour l’ordinateur de bord et le SID six pour la radio. La
        mise sous tension d’un sous-système n’active pas son rapport ; il faut toujours une
        commande distincte.
    do:
      - select: {target: {css: "#cmd-catalog"}, value: HK_ENABLE}
      - fill: {target: {css: "#cmd-fields [data-cmd-field='sid']"}, text: "3"}
      - click: {css: "#cmd-send"}
      - wait: 1.5
      - fill: {target: {css: "#cmd-fields [data-cmd-field='sid']"}, text: "4"}
      - click: {css: "#cmd-send"}
      - wait: 1.5
      - fill: {target: {css: "#cmd-fields [data-cmd-field='sid']"}, text: "6"}
      - click: {css: "#cmd-send"}
      - wait: 1.0

  - id: card
    title: {en: "Record it on the card", fr: "Le consigner sur la fiche"}
    say:
      en: >-
        On the card, each step is recorded by capturing the values and marking GO. Step 5a,
        which clears beacon mode and changes to the LOW data rate, follows and is covered in a
        separate short video. Step 8 then asks for the log entry: the time of first contact, the
        first accepted command and the boot time. This entry is recorded in the workbook and
        included in the shift handover.
      fr: >-
        Sur la fiche, chaque étape est consignée en relevant les valeurs et en marquant GO.
        L’étape 5a, qui lève le mode balise et passe au débit LOW, vient ensuite et fait l’objet
        d’une courte vidéo distincte. L’étape 8 demande enfin l’entrée de journal : l’heure du
        premier contact, la première commande acceptée et l’heure du démarrage. Cette entrée est
        consignée dans le cahier de travail et reprise dans la relève de quart.
    do:
      - click: {css: "#rail-proc"}
      - wait: 1.0
      - scroll: {css: "#proc-doc section[data-pc-step='s2']"}
      - click: {css: "#proc-doc section[data-pc-step='s2'] [data-pc='capture']"}
      - click: {css: "#proc-doc section[data-pc-step='s2'] [data-pc='tick'][data-r='go']"}
      - scroll: {css: "#proc-doc section[data-pc-step='s5']"}
      - click: {css: "#proc-doc section[data-pc-step='s5'] [data-pc='capture']"}
      - click: {css: "#proc-doc section[data-pc-step='s5'] [data-pc='tick'][data-r='go']"}
      - scroll: {css: "#proc-doc section[data-pc-step='s8']"}
      - highlight: {target: {css: "#proc-doc section[data-pc-step='s8']"}, seconds: 3, point: false}
    question:
      type: reflect
      worksheet: WB-5.5-L001/q9
      text:
        en: "Write the Step 8 log line for this pass as you would say it on the loop: AOS time, first accepted command, application boot time."
        fr: "Rédigez la ligne de journal de l’étape 8 pour ce passage, comme vous la diriez sur la boucle : heure d’AOS, première commande acceptée, heure de démarrage de l’application."
