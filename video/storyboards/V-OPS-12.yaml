# Week 6 — a hard task: the fine pointing handover, from the LEOP sun hold to
# wheel-controlled NOMINAL with a star tracker up (COM-004 Steps 1-1b, then
# COM-003 Step 3). Starts from the card's real entry state (breakpoint
# card-COM-004). Ruled 2026-11-07 as one of the three ops videos. The slew
# from the sun hold to nadir can start anywhere up to 180 deg (121 deg on this
# pass); it was invisible until 2026-11-08, when 0x0217 was packed x1000 and
# read 0.0 above 65.5 deg.
id: V-OPS-12
week: 6
audience: all
title:
  en: "Transition from Sun pointing to nadir fine pointing"
  fr: "Passage du pointage solaire au pointage fin nadir"
summary:
  en: "This video takes the spacecraft out of the LEOP Sun-pointing attitude. The reaction wheels are enabled and NOMINAL mode is commanded, and the video explains the step change in attitude error caused by the new reference. It then follows the slew to nadir and starts a star tracker."
  fr: "Cette vidéo fait sortir le satellite de l’attitude de pointage solaire de la LEOP. Les roues de réaction sont activées et le mode NOMINAL est commandé, et la vidéo explique le saut de l’erreur d’attitude dû à la nouvelle référence. Elle suit ensuite le basculement vers le nadir et démarre un senseur stellaire."
apps:
  mcs: default
fresh_stack: sim
ties:
  cards: [COM-004, COM-003]
sources:
  - sim/configs/eosat1/procedures/commissioning/aocs_actuator_checkout.md (COM-004 rev 2.1, Steps 1-1b)
  - sim/configs/eosat1/procedures/commissioning/aocs_sensor_calibration.md (COM-003 Step 3)
  - sim/configs/eosat1/telemetry/hk_structures.yaml (0x0217 x100 since 2026-11-08)

setup:
  - api: {app: instructor, method: POST, path: /api/command, json: {type: load_breakpoint, name: card-COM-004}}
  - wait: 2
  - api: {app: instructor, method: POST, path: /api/command, json: {type: override_passes, enabled: false}, allow_error: true}
  - python: {call: "video/c2ovideo/helpers.py:ff_to_pass", app: instructor, kwargs: {planner: "${planner_url}", min_duration: 540, min_elevation: 15, after_aos: 8}}
  - api: {app: mcs, method: POST, path: /api/pus-command, json: {service: 3, subtype: 27, data_hex: "0002", name: HK_REQUEST, position: flight_director}}
  - wait: 3
  - goto: {app: mcs, path: "/?lang={lang}&position=aocs", settle: 4}
  - js: "fetch('/api/logbook', {method: 'DELETE', credentials: 'same-origin'})"
  - reload: 5

steps:
  - id: hold
    title: {en: "The sun hold", fr: "Le maintien solaire"}
    say:
      en: >-
        Commissioning has started. The spacecraft is still in the attitude it reached during the
        launch and early orbit phase, or LEOP: coarse Sun pointing, in which the magnetorquers
        keep the solar arrays facing the Sun using only the Sun sensors and the magnetometer.
        The attitude error shown here, about seven degrees, is measured relative to the Sun. The
        reaction wheels are powered but disabled, and no star tracker is switched on. The
        spacecraft will not leave this attitude on its own; the operator must command the
        change.
      fr: >-
        La mise en service a commencé. Le satellite se trouve toujours dans l’attitude atteinte
        pendant la phase de lancement et de début d’orbite, la LEOP : le pointage solaire
        grossier, dans lequel les magnétocoupleurs maintiennent les panneaux solaires face au
        Soleil à l’aide des seuls capteurs solaires et du magnétomètre. L’erreur d’attitude
        affichée ici, environ sept degrés, est mesurée par rapport au Soleil. Les roues de
        réaction sont alimentées mais désactivées, et aucun senseur stellaire n’est allumé. Le
        satellite ne quittera pas cette attitude de lui-même : c’est à l’opérateur de commander
        le changement.
    do:
      - click: {css: "#rail-aocs"}
      - wait_for: {target: {css: "#att3d"}, timeout: 20}
      - wait: 1.5
      - highlight: {target: {css: "#att3d"}, seconds: 3.5, point: false}
      - highlight: {target: {css: "#aocs-params"}, seconds: 3, point: false}
      - highlight: {target: {css: "#aocs-equip"}, seconds: 3, point: false}

  - id: wheels
    title: {en: "Step 1: enable the wheels", fr: "Étape 1 : activer les roues"}
    say:
      en: >-
        This is step one of the commissioning procedure COM-004. The wheels were left disabled
        when the bootloader started, and powering their line does not enable them. This
        separation is intentional: switching on a power line must never return attitude control
        to a wheel unintentionally. The operator enables the four wheels one at a time and
        observes their speeds begin to change as the control loop takes them over.
      fr: >-
        Voici l’étape un de la procédure de mise en service COM-004. Les roues sont restées
        désactivées au démarrage du chargeur d’amorçage, et la mise sous tension de leur ligne
        ne les active pas. Cette séparation est voulue : la mise sous tension d’une ligne ne
        doit jamais rendre involontairement le contrôle d’attitude à une roue. L’opérateur
        active les quatre roues une à une et observe leurs vitesses commencer à varier à mesure
        que la boucle de contrôle les prend en charge.
    do:
      - scroll: {css: "#aocs-quick-list"}
      - click: {css: "#aocs-quick-list button", has_text: {en: "RW0 On", fr: "RW0 marche"}}
      - wait: 1.2
      - click: {css: "#aocs-quick-list button", has_text: {en: "RW1 On", fr: "RW1 marche"}}
      - wait: 1.2
      - click: {css: "#aocs-quick-list button", has_text: {en: "RW2 On", fr: "RW2 marche"}}
      - wait: 1.2
      - click: {css: "#aocs-quick-list button", has_text: {en: "RW3 On", fr: "RW3 marche"}}
      - wait: 3
      - highlight: {target: {css: "#aocs-equip"}, seconds: 3.5, point: false}
    question:
      type: multichoice
      text:
        en: "The aocs_wheels power line is on. Why must the wheels still be enabled one by one?"
        fr: "La ligne d’alimentation aocs_wheels est sous tension. Pourquoi faut-il encore activer les roues une à une ?"
      options:
        - text: {en: "Power and enable are separate on purpose: a power switch must never give a wheel attitude authority.", fr: "Alimentation et activation sont séparées exprès : une mise sous tension ne doit jamais donner l’autorité d’attitude à une roue."}
          correct: true
          why: {en: "COM-004 Step 1: powering the line energises the drive electronics only.", fr: "COM-004, étape 1 : alimenter la ligne n’alimente que l’électronique de commande."}
        - text: {en: "The wheels need a warm-up before they spin.", fr: "Les roues ont besoin de chauffer avant de tourner."}
          why: {en: "Nothing in the card waits for temperature here.", fr: "Rien dans la fiche n’attend une température ici."}
        - text: {en: "Only one wheel can be powered at a time.", fr: "Une seule roue peut être alimentée à la fois."}
          why: {en: "One line feeds all four; the enables are per wheel.", fr: "Une seule ligne alimente les quatre ; l’activation se fait roue par roue."}

  - id: nominal
    title: {en: "Step 1b: command NOMINAL", fr: "Étape 1b : commander NOMINAL"}
    say:
      en: >-
        Step one b commands NOMINAL mode. The attitude error immediately increases from seven
        degrees to more than one hundred and twenty. The spacecraft has not moved; the reference
        has changed. NOMINAL mode points the imager at nadir, directly towards the Earth, while
        the spacecraft is still facing the Sun, so the error now represents the full slew that
        remains to be performed.
      fr: >-
        L’étape un b commande le mode NOMINAL. L’erreur d’attitude passe aussitôt de sept degrés
        à plus de cent vingt. Le satellite n’a pas bougé : c’est la référence qui a changé. Le
        mode NOMINAL pointe l’imageur vers le nadir, directement vers la Terre, alors que le
        satellite fait encore face au Soleil ; l’erreur représente donc tout le basculement qui
        reste à effectuer.
    do:
      - click: {css: "#aocs-quick-list button", has_text: {en: "Nominal", fr: "Nominal"}}
      - wait: 3
      - scroll: {css: "#aocs-params"}
      - highlight: {target: {css: "#aocs-params"}, seconds: 4, point: false}
      - highlight: {target: {css: ".ds-card:has(#aocs-stepper)"}, seconds: 2.5}
    question:
      type: multichoice
      text:
        en: "After NOMINAL is commanded, aocs.att_error jumps from 7 deg to 122 deg. What happened?"
        fr: "Après la commande NOMINAL, aocs.att_error saute de 7 deg à 122 deg. Que s’est-il passé ?"
      options:
        - text: {en: "The reference changed from the Sun to nadir; the attitude did not move.", fr: "La référence est passée du Soleil au nadir ; l’attitude n’a pas bougé."}
          correct: true
          why: {en: "The error is always measured against the active mode's reference.", fr: "L’erreur se mesure toujours par rapport à la référence du mode actif."}
        - text: {en: "The wheels kicked the spacecraft off its attitude.", fr: "Les roues ont fait perdre son attitude au satellite."}
          why: {en: "The rates stay small; only the reference jumped.", fr: "Les vitesses restent faibles ; seule la référence a sauté."}
        - text: {en: "The error is invalid until a star tracker is on.", fr: "L’erreur n’est pas valide tant qu’aucun senseur stellaire n’est allumé."}
          why: {en: "The coarse sensors are enough to see 120 degrees.", fr: "Les capteurs grossiers suffisent pour voir 120 degrés."}

  - id: slew
    title: {en: "The slew to nadir", fr: "Le basculement vers le nadir"}
    say:
      en: >-
        The wheels rotate the spacecraft at a fraction of a degree per second, so the slew takes
        several minutes, and the instructor increases the simulation speed to save time. The
        model shows the imager turning towards the Earth, the attitude error decreasing and the
        wheels absorbing the angular momentum. The procedure requires the error to be below five
        degrees before any wheel test is performed.
      fr: >-
        Les roues font tourner le satellite à une fraction de degré par seconde : le basculement
        prend donc plusieurs minutes, et l’instructeur accélère la simulation pour gagner du
        temps. Le modèle montre l’imageur qui se tourne vers la Terre, l’erreur d’attitude qui
        diminue et les roues qui absorbent le moment cinétique. La procédure exige une erreur
        inférieure à cinq degrés avant tout essai de roue.
    do:
      - js: "document.getElementById('att3d').scrollIntoView({block: 'center'})"
      - wait: 0.8
      - python: {call: "video/c2ovideo/helpers.py:fast_until_aocs_error", app: instructor, kwargs: {below: 4.0, speed: 10, timeout_s: 75}}
      - api: {app: mcs, method: POST, path: /api/pus-command, json: {service: 3, subtype: 27, data_hex: "0002", name: HK_REQUEST, position: flight_director}}
      - wait: 3
      - highlight: {target: {css: "#aocs-params"}, seconds: 3, point: false}

  - id: tracker
    title: {en: "COM-003: a star tracker", fr: "COM-003 : un senseur stellaire"}
    say:
      en: >-
        At this point the attitude is known only approximately, from the Sun direction and the
        magnetic field. The next procedure, COM-003, brings a star tracker into the control
        loop: both trackers are powered, and tracker one is selected. Each tracker takes about a
        minute to start and identify the star field. The operator first checks that the Sun is
        outside the fifteen-degree exclusion zone of each tracker, which is shown on the
        display, and then waits for the star count.
      fr: >-
        À ce stade, l’attitude n’est connue que de façon approximative, par la direction du
        Soleil et le champ magnétique. La procédure suivante, COM-003, fait entrer un senseur
        stellaire dans la boucle de contrôle : les deux senseurs sont alimentés et le senseur un
        est sélectionné. Chaque senseur met environ une minute à démarrer et à identifier le
        champ d’étoiles. L’opérateur vérifie d’abord que le Soleil se trouve hors de la zone
        d’exclusion de quinze degrés de chaque senseur, indiquée à l’écran, puis attend le
        nombre d’étoiles.
    do:
      - scroll: {css: "#aocs-quick-list"}
      - click: {css: "#aocs-quick-list button", has_text: {en: "ST1 On", fr: "ST1 marche"}}
      - wait: 1.2
      - click: {css: "#aocs-quick-list button", has_text: {en: "ST2 On", fr: "ST2 marche"}}
      - wait: 1.2
      - click: {css: "#aocs-quick-list button", has_text: {en: "ST Select 1", fr: "Sélection ST 1"}}
      - wait: 2
      - js: "document.getElementById('att3d').scrollIntoView({block: 'center'})"
      - wait: 0.8
      - highlight: {target: {css: "#att3d"}, seconds: 4, point: false}
      - wait: 20
      # tracker one boots in ~60 s; SID 2 carries its star count (0x0241)
      - python: {call: "video/c2ovideo/helpers.py:wait_mcs_param", app: mcs, kwargs: {pid: "0x0241", at_least: 5, timeout_s: 90}}

  - id: tracking
    title: {en: "Tracking", fr: "En poursuite"}
    say:
      en: >-
        About a minute after power-on, tracker one reports more than the five stars required by
        the procedure. The handover is complete: the wheels maintain nadir pointing, and the
        attitude can now be determined to within arcseconds. The next steps are the calibration
        of the gyroscopes against the star tracker, and then the fine pointing required for
        imaging.
      fr: >-
        Environ une minute après la mise sous tension, le senseur un indique plus que les cinq
        étoiles exigées par la procédure. Le transfert est terminé : les roues maintiennent le
        pointage au nadir, et l’attitude peut désormais être déterminée à quelques secondes
        d’arc près. Les étapes suivantes sont l’étalonnage des gyromètres par rapport au senseur
        stellaire, puis le pointage fin nécessaire à l’imagerie.
    do:
      - wait_for: {target: {css: "#aocs-equip"}, timeout: 20}
      - scroll: {css: "#aocs-equip"}
      - wait: 6
      - highlight: {target: {css: "#aocs-equip .eq:has-text('ST1')"}, seconds: 3.5}
      - highlight: {target: {css: "#aocs-params"}, seconds: 3, point: false}
    question:
      type: reflect
      text:
        en: "Why does the card bring the star tracker up only after the slew to nadir, and not in the sun hold?"
        fr: "Pourquoi la fiche ne démarre-t-elle le senseur stellaire qu’après le basculement vers le nadir, et pas dans le maintien solaire ?"
