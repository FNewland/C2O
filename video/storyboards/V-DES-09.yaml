# Design concept — attitude determination and control (textbook ch. 10): the
# closed loop, architecture by pointing requirement, disturbance torques on a
# 3U at 500 km (residual dipole dominates), wheel momentum and desaturation,
# and why a magnetorquer has no torque along B.
# Animated page video/explainers/aocs.html. Whole design team; AOCS position.
# EOSAT-1 hardware from sim/configs/eosat1/subsystems/aocs.yaml.
id: V-DES-09
week: 4
audience: all
title:
  en: "Attitude determination and control"
  fr: "Détermination et contrôle d’attitude"
summary:
  en: "How a spacecraft knows where it points and turns itself: the control loop, choosing an architecture from the pointing requirement, the disturbance torques it fights, how wheels fill with momentum, and why magnetorquers can dump momentum but not point."
  fr: "Comment un satellite sait où il pointe et se tourne : la boucle de contrôle, le choix d’une architecture selon l’exigence de pointage, les couples perturbateurs, comment les roues se chargent en moment cinétique, et pourquoi les magnéto-coupleurs peuvent le vider mais pas pointer."
apps:
  viz: default
fresh_stack: viz
ties: {}
sources:
  - design/docs/oer/chapters/10_aocs.md (§ 10.1–10.3, 10.5)
  - sim/configs/eosat1/subsystems/aocs.yaml

setup:
  - goto: {app: viz, path: "/video/explainers/aocs.html?lang={lang}", settle: 1.5}
  - cursor: hide

steps:
  - id: loop
    title: {en: "The control loop", fr: "La boucle de contrôle"}
    say:
      en: >-
        The attitude and orbit control system, or AOCS, performs two functions. Determination
        establishes where the spacecraft is pointing, and control turns it to the required
        attitude. Together they form a closed loop. A controller converts the difference between
        the commanded and the estimated attitude into a torque demand, the actuators apply that
        torque, and the spacecraft rotates while disturbance torques act against it. The sensors
        measure the result with some noise, and an estimator, usually a Kalman filter, combines
        their measurements into an estimate of attitude and rate.
      fr: >-
        Le système de contrôle d’attitude et d’orbite, le SCAO, remplit deux fonctions. La
        détermination établit où pointe le satellite, et le contrôle l’oriente vers l’attitude
        voulue. Ensemble, elles forment une boucle fermée. Un contrôleur convertit l’écart entre
        l’attitude commandée et l’attitude estimée en une demande de couple, les actionneurs
        appliquent ce couple et le satellite tourne, tandis que des couples perturbateurs s’y
        opposent. Les capteurs mesurent le résultat avec un certain bruit, et un estimateur,
        généralement un filtre de Kalman, combine leurs mesures en une estimation de l’attitude
        et de la vitesse angulaire.
    do:
      - js: "EX.play('loop', ${say})"

  - id: architecture
    title: {en: "Pointing requirements and architecture", fr: "Exigences de pointage et architecture"}
    say:
      en: >-
        The required pointing accuracy determines the hardware. For accuracies coarser than five
        degrees, a passive magnet is sufficient. Between two and five degrees, magnetorquers are
        used with a magnetometer and Sun sensors. Down to about a tenth of a degree, reaction
        wheels are needed, and for finer accuracy, wheels are combined with a star tracker, at a
        cost of close to a kilogram and several watts. EOSAT-1 carries four reaction wheels, a
        star tracker and magnetorquers, because its camera must point at specific targets.
      fr: >-
        La précision de pointage requise détermine le matériel. Pour une précision moins fine
        que cinq degrés, un aimant passif suffit. Entre deux et cinq degrés, on utilise des
        magnétocoupleurs avec un magnétomètre et des capteurs solaires. Jusqu’à environ un
        dixième de degré, il faut des roues de réaction, et pour une précision plus fine, on
        associe les roues à un senseur stellaire, au prix de près d’un kilogramme et de
        plusieurs watts. EOSAT-1 emporte quatre roues de réaction, un senseur stellaire et des
        magnétocoupleurs, car sa caméra doit viser des cibles précises.
    do:
      - js: "EX.play('architecture', ${say})"

  - id: disturbances
    title: {en: "Disturbance torques", fr: "Les couples perturbateurs"}
    say:
      en: >-
        Four disturbance torques act on a satellite in low Earth orbit: solar radiation
        pressure, atmospheric drag, the gravity gradient, and the interaction between the
        Earth's magnetic field and the residual magnetic dipole of the spacecraft's own wiring
        and motors. On a CubeSat built from commercial components, the magnetic torque is
        typically more than ten times larger than the others. Twisted-pair wiring, careful
        harness routing and demagnetised components can reduce it by a factor of five.
      fr: >-
        Quatre couples perturbateurs agissent sur un satellite en orbite basse : la pression de
        radiation solaire, la traînée atmosphérique, le gradient de gravité, et l’interaction
        entre le champ magnétique terrestre et le dipôle magnétique résiduel des câbles et des
        moteurs du satellite. Sur un CubeSat construit à partir de composants du commerce, le
        couple magnétique est généralement plus de dix fois supérieur aux autres. Des paires
        torsadées, un routage soigné du faisceau et des composants démagnétisés peuvent le
        réduire d’un facteur cinq.
    do:
      - js: "EX.play('disturbances', ${say})"

  - id: momentum
    title: {en: "Momentum saturation", fr: "La saturation des roues"}
    say:
      en: >-
        A reaction wheel rotates the spacecraft by spinning up in the opposite direction. When
        it counteracts a constant disturbance, however, it continues to accumulate momentum
        until it reaches its maximum speed and can no longer provide control. This condition is
        called saturation. A small wheel with a capacity of ten millinewton-metre-seconds
        saturates in about one orbit. When the stored momentum reaches about eighty percent, the
        magnetorquers are used to remove it, a process called desaturation. Imaging should not
        be scheduled during desaturation, because it disturbs the pointing.
      fr: >-
        Une roue de réaction fait tourner le satellite en accélérant dans le sens opposé.
        Lorsqu’elle compense une perturbation constante, cependant, elle continue d’accumuler du
        moment cinétique jusqu’à atteindre sa vitesse maximale, et ne peut alors plus assurer le
        contrôle. Cet état s’appelle la saturation. Une petite roue d’une capacité de dix
        millinewtons-mètres-secondes sature en une orbite environ. Lorsque le moment stocké
        atteint environ quatre-vingts pour cent, les magnétocoupleurs servent à l’évacuer :
        c’est la désaturation. Il ne faut pas programmer de prise de vue pendant la
        désaturation, car elle perturbe le pointage.
    do:
      - js: "EX.play('momentum', ${say})"
    question:
      type: multichoice
      text:
        en: "Halving the residual magnetic dipole of this 3U would do what to the time between desaturations?"
        fr: "Diviser par deux le dipôle magnétique résiduel de ce 3U ferait quoi au temps entre deux désaturations ?"
      options:
        - text: {en: "Roughly double it, since that dipole is almost all the disturbance.", fr: "Le doubler à peu près, puisque ce dipôle fait presque toute la perturbation."}
          correct: true
          why: {en: "Time to saturate = wheel capacity ÷ disturbance torque.", fr: "Temps de saturation = capacité de la roue ÷ couple perturbateur."}
        - text: {en: "Nothing: desaturation is scheduled once per orbit regardless.", fr: "Rien : la désaturation est prévue une fois par orbite quoi qu’il arrive."}
          why: {en: "It is triggered by wheel speed, which fills at the disturbance rate.", fr: "Elle est déclenchée par la vitesse des roues, qui se remplissent au rythme de la perturbation."}
        - text: {en: "Halve it, because the magnetorquers would be weaker.", fr: "Le diviser par deux, car les magnéto-coupleurs seraient plus faibles."}
          why: {en: "The residual dipole is unwanted; the magnetorquer dipole is commanded separately.", fr: "Le dipôle résiduel est indésirable ; celui des magnéto-coupleurs est commandé à part."}

  - id: magnetorquer
    title: {en: "The limits of magnetorquers", fr: "Les limites des magnétocoupleurs"}
    say:
      en: >-
        A magnetorquer is a coil. A current through the coil creates a magnetic dipole, and the
        Earth's magnetic field exerts a torque on it equal to the cross product of the dipole
        and the field. The torque therefore always lies in the plane perpendicular to the field,
        and at any instant no torque can be produced about the field direction. As the satellite
        moves around its orbit, the field direction changes, so that over time torque can be
        applied about every axis. This is sufficient to stop a tumble or to empty the wheels
        over the course of an orbit, but not to provide precise pointing.
      fr: >-
        Un magnétocoupleur est une bobine. Le courant qui la traverse crée un dipôle magnétique,
        sur lequel le champ magnétique terrestre exerce un couple égal au produit vectoriel du
        dipôle et du champ. Ce couple se situe donc toujours dans le plan perpendiculaire au
        champ, et à aucun instant on ne peut produire de couple autour de la direction du champ.
        À mesure que le satellite parcourt son orbite, la direction du champ change, de sorte
        qu’au fil du temps, un couple peut être appliqué autour de chaque axe. Cela suffit pour
        arrêter une rotation ou vider les roues au cours d’une orbite, mais pas pour assurer un
        pointage précis.
    do:
      - js: "EX.play('magnetorquer', ${say})"
    question:
      type: reflect
      text:
        en: "What is your mission's pointing requirement, which architecture does it call for, and what does that cost in mass and power?"
        fr: "Quelle est l’exigence de pointage de votre mission, quelle architecture appelle-t-elle, et qu’est-ce que cela coûte en masse et en puissance ?"
