name: "FPA Cooler Failure"
difficulty: INTERMEDIATE
duration_s: 1500
briefing: |
  The FPA cooler will fail at T+120s while in imaging mode.
  The operator must detect the rising FPA temperature and transition
  the payload to standby before data quality degrades.
events:
  # NOTE: this used to carry an `eps/solar_array_partial magnitude: 0.0`
  # event. `magnitude` on that failure is the OUTPUT LOSS fraction, so 0.0
  # means "wing perfectly healthy" — the event loaded, fired and changed
  # nothing. The scenario is about the FPA cooler; the dead EPS event is gone.
  - time_offset_s: 120
    action: inject
    params:
      subsystem: payload
      failure: cooler_failure
      magnitude: 1.0

expected_responses:
  - category: detect
    description: "Detect rising FPA temperature"
  - category: isolate
    description: "Identify cooler failure"
  - category: recover
    description: "Transition payload to standby or off"
    tc: ["PAYLOAD_SET_MODE(mode=0|1)", "EPS_PAYLOAD_MODE(mode=0|1)", "EPS_POWER_OFF(line_index=3)"]
    within_s: 600

# Commands that make things worse: each entry costs its penalty once
# (percentage points) if sent after the fault (scenario_scoring.py).
harmful_commands:
  - tc: "PAYLOAD_SET_MODE(mode=2|3)"
    reason: "Starts imaging or calibration with the FPA cooler failed"
    penalty: 10
