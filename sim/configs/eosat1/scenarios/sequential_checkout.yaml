name: "Sequential Subsystem Checkout"
difficulty: INTERMEDIATE
duration_s: 2400
briefing: |
  Application software is running and antennas are deployed.
  The spacecraft is in LEOP phase (phase 4). Operators must
  perform the sequential power-on of all subsystems following
  procedure LEOP-007, then transition to COMMISSIONING phase.

initial_conditions:
  spacecraft_phase: 4  # LEOP
  override_passes: true  # Continuous contact for checkout

events: []

expected_responses:
  - category: command
    id: htr_bat
    description: "Enable battery heater (power_line_on htr_bat)"
    tc: "EPS_POWER_ON(line_index=5)"
    state: "eps.pl_htr_bat == 1"
    within_s: 600
  - category: command
    id: wheels_on
    description: "Enable reaction wheels (power_line_on aocs_wheels)"
    tc: "EPS_POWER_ON(line_index=7)"
    state: "eps.pl_aocs_wheels == 1"
    within_s: 900
  - category: command
    id: detumble
    description: "Command AOCS DETUMBLE mode"
    tc: "AOCS_SET_MODE(mode=2)"
    within_s: 1200
    after: "wheels_on"
  - category: detect
    description: "Verify body rates decreasing"
  - category: command
    id: payload_stby
    description: "Enable payload in standby mode"
    tc: ["PAYLOAD_SET_MODE(mode=1)", "EPS_PAYLOAD_MODE(mode=1)"]
    within_s: 1800
  - category: command
    description: "Enable and activate FPA cooler"
    tc: ["FPA_COOLER(on=1)", "EPS_FPA_COOLER(on=1)"]
    within_s: 2100
    after: "payload_stby"
  - category: detect
    description: "GO/NO-GO all positions nominal"
  - category: command
    description: "Transition to COMMISSIONING phase"
    tc: "SYS_SET_MISSION_PHASE(phase=5)"
    within_s: 2400
    after: "detumble"
