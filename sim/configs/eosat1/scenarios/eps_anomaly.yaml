name: "Solar Array Degradation"
difficulty: INTERMEDIATE
duration_s: 2400
briefing: |
  Solar Array A will gradually degrade over 10 minutes starting at T+300s.
  The operator must detect the power imbalance, identify the affected array,
  and take appropriate action to maintain power budget.
events:
  - time_offset_s: 300
    action: inject
    params:
      subsystem: eps
      failure: solar_array_partial
      magnitude: 0.7
      onset: gradual
      onset_duration_s: 600
      array: A

expected_responses:
  - category: detect
    description: "Detect power generation drop on SA-A"
  - category: isolate
    description: "Identify SA-A as the degraded string: read the string yields 0x014C/0x014D (CTG-009 step 1)"
    tc: ["GET_PARAM(param_id=0x014C)", "GET_PARAM(param_id=0x014D)"]
    within_s: 900
  - category: recover
    description: "Decide from the yield and the power balance (CTG-009 step 4): with string A at about 30 % imaging is no longer sustainable, so put the payload in STANDBY or OFF (left on, the bus-voltage load shed takes it off later)"
    tc: ["PAYLOAD_SET_MODE(mode=0|1)", "EPS_PAYLOAD_MODE(mode=0|1)", "EPS_POWER_OFF(line_index=3)"]
    within_s: 1500
