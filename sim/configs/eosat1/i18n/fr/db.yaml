- key: "scn:aocs_actuator_stuck:name"
  en: "Reaction Wheel Stuck at Speed"
  en_hash: "d882bc28234b0931"
  fr: "Roue de réaction bloquée en vitesse"
- key: "scn:aocs_actuator_stuck:briefing"
  en: "Reaction wheel 1 (RW-1, index 0) experiences a seizure at T+120s — the bearing\nlocks and the wheel stops responding to torque commands while retaining its current\nspeed. The three remaining wheels must compensate, causing momentum to accumulate.\nThe operator must detect the stuck wheel from telemetry (speed not responding to\ncommands, temperature rising), disable wheel 1, reconfigure AOCS to three-wheel\nmode, and perform a momentum dump using the magnetorquers to prevent remaining\nwheel saturation."
  en_hash: "8e8fedcd12d34c8b"
  fr: "La roue de réaction 1 (RW-1, indice 0) se grippe à T+120s — le roulement\nse bloque et la roue ne répond plus aux commandes de couple tout en conservant sa vitesse\nactuelle. Les trois roues restantes doivent compenser, ce qui accumule du moment cinétique.\nL'opérateur doit détecter la roue bloquée d'après la télémesure (vitesse insensible aux\ncommandes, température en hausse), désactiver la roue 1, reconfigurer l'AOCS en mode\n3 roues et effectuer un déchargement du moment cinétique au moyen des magnétocoupleurs\npour éviter la saturation des roues restantes."
- key: "scn:aocs_sensor_cascade:name"
  en: "Cascading Sensor Failure"
  en_hash: "4ef4b88701406b7c"
  fr: "Défaillance de capteurs en cascade"
- key: "scn:aocs_sensor_cascade:briefing"
  en: "A cascading sequence of AOCS sensor failures tests the operator's diagnostic and\nrecovery skills. At T+60s star tracker 1 fails — the onboard FDIR should auto-switch\nto ST2 but the operator must verify. At T+180s the +X coarse sun sensor head fails,\ndegrading the composite sun vector. At T+300s magnetometer A fails, requiring the\noperator to manually switch to magnetometer B. The operator must track each failure,\nassess cumulative impact on attitude determination, and decide whether the remaining\nsensor suite is adequate for mission operations or requires fallback to safe mode.\nAt T+600s the IMU starts to drift: a 0.05 deg/s bias appears on all three gyro\nchannels — ~1800x the 0.1 deg/h bias instability the MEKF is built from. The\nteaching point is that this is SURVIVABLE while the star tracker is healthy: the\nfilter's bias state absorbs a constant offset, and the operator sees the fault\nonly as a step in the innovation-rejection counter (0x02C2) and as gyro_bias_x/y/z\n(0x0270-0x0272) diverging from the estimate. It becomes mission-ending the moment\nthe tracker is also lost before the filter has re-converged, because ECLIPSE and\nevery propagate-only phase then drift at 0.05 deg/s = 3 deg/min."
  en_hash: "062950a50207e191"
  fr: "Une suite de défaillances en cascade des capteurs AOCS met à l'épreuve les compétences de\ndiagnostic et de reprise de l'opérateur. À T+60s, le senseur stellaire 1 tombe en panne — la FDIR de bord devrait basculer\nautomatiquement sur ST2, mais l'opérateur doit le vérifier. À T+180s, la tête +X du senseur solaire grossier tombe en panne,\ndégradant le vecteur Soleil composite. À T+300s, le magnétomètre A tombe en panne, ce qui oblige\nl'opérateur à basculer manuellement sur le magnétomètre B. L'opérateur doit suivre chaque défaillance,\névaluer l'impact cumulé sur la détermination d'attitude et décider si l'ensemble de capteurs restant\nsuffit aux opérations de mission ou s'il faut se replier en mode survie.\nÀ T+600s, l'IMU commence à dériver : un biais de 0.05 deg/s apparaît sur les trois voies\ngyroscopiques — ~1800x l'instabilité de biais de 0.1 deg/h sur laquelle le MEKF est construit. Le\npoint pédagogique est que la situation est SURVIVABLE tant que le senseur stellaire est sain : l'état de biais\ndu filtre absorbe un décalage constant, et l'opérateur ne voit le défaut\nque comme une marche du compteur de rejets d'innovation (0x02C2) et comme l'écart entre gyro_bias_x/y/z\n(0x0270-0x0272) et l'estimation. Elle devient fatale à la mission dès que\nle senseur est lui aussi perdu avant que le filtre ait reconvergé, car ECLIPSE et\nchaque phase de propagation seule dérivent alors à 0.05 deg/s = 3 deg/min."
- key: "scn:aocs_star_tracker_failure:name"
  en: "Star Tracker Failure"
  en_hash: "c1bff6cbb693dea5"
  fr: "Panne du senseur stellaire"
- key: "scn:aocs_star_tracker_failure:briefing"
  en: "Star tracker 1 experiences a hardware failure at T+120s, going blind.\nThe operator must detect the failure, switch to the redundant unit,\nand verify attitude recovery in degraded mode."
  en_hash: "04f093b63ec1009f"
  fr: "Le senseur stellaire 1 subit une panne matérielle à T+120s et devient aveugle.\nL'opérateur doit détecter la panne, basculer sur l'unité redondante\net vérifier le rétablissement de l'attitude en mode dégradé."
- key: "scn:aocs_wheel_failure:name"
  en: "Reaction Wheel Seizure"
  en_hash: "248362044f5c0369"
  fr: "Grippage d'une roue de réaction"
- key: "scn:aocs_wheel_failure:briefing"
  en: "Reaction wheel 3 experiences bearing seizure at T+200s. Speed drops to zero,\ntemperature rises. The operator must disable the failed wheel, reconfigure\nto 3-wheel mode, and manage momentum with relaxed pointing."
  en_hash: "2a35bbaf26ca5a28"
  fr: "Le roulement de la roue de réaction 3 se grippe à T+200s. La vitesse tombe à zéro,\nla température monte. L'opérateur doit désactiver la roue défaillante, reconfigurer\nen mode 3 roues et gérer le moment cinétique avec un pointage assoupli."
- key: "scn:debris_impact_hermes3:name"
  en: "Debris Impact — HERMES-3 SA-2B (corrected)"
  en_hash: "8f809de3e8c106c1"
  fr: "Impact de débris — HERMES-3 SA-2B (corrigé)"
- key: "scn:debris_impact_hermes3:briefing"
  en: "A debris fragment strikes HERMES-3 at T+00:00, destroying ~31% of the -Y solar\nwing (SA-2B panel). The strike triggers a cascading failure across EPS, AOCS,\nTCS, TTC and OBDH that must be stabilised within the contact window before\nautonomous FDIR safes the spacecraft at T+22 min.\n\nOperators must: triage EPS root cause within 90 s, isolate SA-2B, desaturate\nRW-2 before 6000 RPM, restore heaters once bus ≥ 23 V, and return to nominal\nmode before battery SoC falls below 60%."
  en_hash: "1901b31cf6ac1754"
  fr: "Un fragment de débris frappe HERMES-3 à T+00:00 et détruit ~31 % de l'aile solaire -Y\n(panneau SA-2B). L'impact déclenche une défaillance en cascade sur l'EPS, l'AOCS,\nle TCS, le TTC et l'OBDH, qu'il faut stabiliser pendant la fenêtre de visibilité avant que\nla FDIR autonome ne mette le satellite en sécurité à T+22 min.\n\nLes opérateurs doivent : identifier la cause première côté EPS en 90 s, isoler SA-2B, désaturer\nRW-2 avant 6000 RPM, rétablir les réchauffeurs dès que le bus est ≥ 23 V, et revenir en mode\nnominal avant que le SoC batterie ne tombe sous 60 %."
- key: "scn:eps_anomaly:name"
  en: "Solar Array Degradation"
  en_hash: "4d57cbaeb6f2f5e7"
  fr: "Dégradation du générateur solaire"
- key: "scn:eps_anomaly:briefing"
  en: "Solar Array A will gradually degrade over 10 minutes starting at T+300s.\nThe operator must detect the power imbalance, identify the affected array,\nand take appropriate action to maintain power budget."
  en_hash: "7805adacfe97d1fa"
  fr: "Le générateur solaire A se dégrade progressivement pendant 10 minutes à partir de T+300s.\nL'opérateur doit détecter le déséquilibre de puissance, identifier le générateur affecté\net prendre les mesures appropriées pour tenir le bilan de puissance."
- key: "scn:eps_overcurrent:name"
  en: "LCL Overcurrent Trip"
  en_hash: "4a188a6e5f4c7a57"
  fr: "Disjonction LCL sur surintensité"
- key: "scn:eps_overcurrent:briefing"
  en: "An overcurrent condition develops on the TT&C transmitter power line at\nT+180s, causing the LCL to trip and the downlink to drop out mid-pass. The\noperator must detect the tripped line, diagnose the cause, and decide\nwhether to reset the trip flag and re-enable."
  en_hash: "00cbfb4e827fcf6a"
  fr: "Une surintensité apparaît sur la ligne d'alimentation de l'émetteur TT&C à\nT+180s ; le LCL disjoncte et la liaison descendante décroche en plein passage.\nL'opérateur doit détecter la ligne disjonctée, diagnostiquer la cause et décider\ns'il faut réarmer l'indicateur de disjonction et réactiver la ligne."
- key: "scn:eps_progressive_load_shed:name"
  en: "Progressive Load Shedding During Extended Eclipse"
  en_hash: "f7cd4b32e8a09a4d"
  fr: "Délestage progressif pendant une éclipse prolongée"
- key: "scn:eps_progressive_load_shed:briefing"
  en: "The spacecraft enters an extended eclipse with battery at 70% SoC. As eclipse\ncontinues, battery depletes through successive thresholds (50%, 35%, 25%, 15%).\nAt each threshold the operator must shed loads in priority order — payload first,\nthen FPA cooler, then TTC transmitter, then AOCS reaction wheels — to arrest the\ndecline before FDIR triggers emergency safe mode. Once the spacecraft exits eclipse,\nthe operator must monitor battery recovery and restore loads in reverse priority\norder, verifying power budget stability at each step."
  en_hash: "3cdf10deb8dd89db"
  fr: "Le satellite entre dans une éclipse prolongée avec une batterie à 70 % de SoC. À mesure que l'éclipse\nse prolonge, la batterie se vide en franchissant des seuils successifs (50 %, 35 %, 25 %, 15 %).\nÀ chaque seuil, l'opérateur doit délester les charges par ordre de priorité — charge utile d'abord,\npuis refroidisseur FPA, puis émetteur TTC, puis roues de réaction AOCS — pour enrayer la\nbaisse avant que la FDIR ne déclenche le mode survie d'urgence. Une fois le satellite sorti d'éclipse,\nl'opérateur doit surveiller la recharge de la batterie et rétablir les charges dans l'ordre de priorité\ninverse, en vérifiant la stabilité du bilan de puissance à chaque étape."
- key: "scn:eps_sada_stuck:name"
  en: "Solar Array Drive Seized"
  en_hash: "7987a89f56a3ae3a"
  fr: "Entraînement du générateur solaire grippé"
- key: "scn:eps_sada_stuck:briefing"
  en: "The solar array drive assembly seizes at T+180s. The shaft stops where it\nis, so the wing normal no longer tracks the sun: the drive angle telemetry\n(0x0133) goes flat while the two wing currents (0x0146 / 0x0147) develop a\n|sin(phase)| ripple as the sun walks past the frozen normal. Orbit-average\nwing yield falls by roughly a third and the battery no longer fully recharges\neach sunlit pass.\n\nThe operator must distinguish a seized drive from an array degradation (the\ndrive angle is the discriminator — degradation does not freeze it), take the\npower budget down to fit the reduced generation, and confirm the SoC trend\nstabilises."
  en_hash: "1db9750b61a0d6ee"
  fr: "L'ensemble d'entraînement du générateur solaire se grippe à T+180s. L'arbre s'arrête là où il\nse trouve, si bien que la normale de l'aile ne suit plus le Soleil : la télémesure d'angle d'entraînement\n(0x0133) devient plate tandis que les deux courants d'aile (0x0146 / 0x0147) présentent une\nondulation en |sin(phase)| à mesure que le Soleil défile devant la normale figée. La production\nmoyenne des ailes sur l'orbite baisse d'environ un tiers et la batterie ne se recharge plus complètement\nà chaque passage éclairé.\n\nL'opérateur doit distinguer un entraînement grippé d'une dégradation du générateur (l'angle\nd'entraînement est le discriminant — une dégradation ne le fige pas), réduire le\nbilan de puissance pour l'adapter à la production réduite, et confirmer que la tendance du SoC\nse stabilise."
- key: "scn:eps_solar_panel_loss:name"
  en: "Solar Panel Loss"
  en_hash: "4995a1339f96bb4a"
  fr: "Perte d'un panneau solaire"
- key: "scn:eps_solar_panel_loss:briefing"
  en: "During nominal sunlit operations, the +X solar panel suffers partial degradation\nat T+120s (50% output loss). The operator must detect the per-panel current drop\nand identify the affected face. At T+600s the +Y panel is lost completely, further\nreducing power generation. The operator must recalculate the power budget, determine\nwhether the remaining panels can sustain nominal operations, and shed loads if\nnecessary to maintain a positive energy balance over the orbit."
  en_hash: "8e732929ec1c246d"
  fr: "Pendant les opérations nominales en éclairement, le panneau solaire +X subit une dégradation partielle\nà T+120s (perte de 50 % de production). L'opérateur doit détecter la chute de courant par panneau\net identifier la face affectée. À T+600s, le panneau +Y est entièrement perdu, ce qui réduit\nencore la production de puissance. L'opérateur doit recalculer le bilan de puissance, déterminer\nsi les panneaux restants peuvent soutenir les opérations nominales, et délester les charges si\nnécessaire pour maintenir un bilan énergétique positif sur l'orbite."
- key: "scn:eps_undervoltage:name"
  en: "Battery Depletion During Eclipse"
  en_hash: "9d3624aba45e3d3e"
  fr: "Épuisement de la batterie pendant l'éclipse"
- key: "scn:eps_undervoltage:briefing"
  en: "An extended eclipse with high power consumption causes battery depletion.\nBus voltage drops below thresholds starting at T+300s. The operator must\nexecute load shedding before FDIR triggers safe mode."
  en_hash: "50feb8d863ce7518"
  fr: "Une éclipse prolongée avec une forte consommation épuise la batterie.\nLa tension bus passe sous les seuils à partir de T+300s. L'opérateur doit\nexécuter le délestage avant que la FDIR ne déclenche le mode survie."
- key: "scn:first_contact:name"
  en: "First Contact"
  en_hash: "3d1ce8409c53fb9a"
  fr: "Premier contact"
- key: "scn:first_contact:briefing"
  en: "Spacecraft has completed separation timer and OBC is running\nbootloader firmware. The first ground station pass over Iqaluit\nis beginning. Operators must establish RF link, verify beacon\ntelemetry, boot application software, set the onboard clock,\nand begin initial checkout.\n\nThis scenario starts at phase 3 (BOOTLOADER_OPS) with the\nspacecraft in view of Iqaluit ground station."
  en_hash: "fd1d2e127582fc22"
  fr: "Le satellite a terminé la minuterie de séparation et l'OBC exécute le\nmicrologiciel du chargeur d'amorçage. Le premier passage au-dessus de la station sol d'Iqaluit\ncommence. Les opérateurs doivent établir la liaison RF, vérifier la télémesure\nde la balise, amorcer le logiciel applicatif, régler l'horloge de bord\net commencer la vérification initiale.\n\nCe scénario démarre en phase 3 (BOOTLOADER_OPS), avec le\nsatellite en visibilité de la station sol d'Iqaluit."
- key: "scn:fpa_overtemp:name"
  en: "FPA Cooler Failure"
  en_hash: "d9ef5b18ef42e54f"
  fr: "Panne du refroidisseur FPA"
- key: "scn:fpa_overtemp:briefing"
  en: "The FPA cooler will fail at T+120s while in imaging mode.\nThe operator must detect the rising FPA temperature and transition\nthe payload to standby before data quality degrades."
  en_hash: "aa9040c7c352c767"
  fr: "Le refroidisseur FPA tombe en panne à T+120s en mode prise de vue.\nL'opérateur doit détecter la hausse de température du FPA et passer\nla charge utile en attente avant que la qualité des données ne se dégrade."
- key: "scn:gs_antenna_failure:name"
  en: "Ground Station Antenna Failure"
  en_hash: "2d40a8e019005bfa"
  fr: "Panne d'antenne de station sol"
- key: "scn:gs_antenna_failure:briefing"
  en: "A nominal pass is in progress at Iqaluit ground station. At T+120s the\nground station antenna suffers a mechanical failure, causing the received\nsignal level to drop by approximately 30 dB — effectively simulating a\ncomplete antenna loss. The spacecraft RF chain is healthy; the failure is\nentirely on the ground side. The operator must recognise that the loss of\nsignal is a ground station issue (not spacecraft), coordinate with the\nFlight Director to switch to an alternate station (Troll), and arrange\nfor mission replanning around the lost contact window."
  en_hash: "d193539d4578fbf3"
  fr: "Un passage nominal est en cours à la station sol d'Iqaluit. À T+120s,\nl'antenne de la station sol subit une panne mécanique et le niveau du signal\nreçu chute d'environ 30 dB — ce qui simule en pratique une\nperte complète de l'antenne. La chaîne RF du satellite est saine ; la panne se situe\nentièrement côté sol. L'opérateur doit reconnaître que la perte du\nsignal est un problème de station sol (et non du satellite), se coordonner avec la\ndirection du vol pour basculer sur une autre station (Troll), et organiser\nla replanification de la mission autour de la fenêtre de visibilité perdue."
- key: "scn:gs_rf_degradation:name"
  en: "Ground Station RF Chain Degradation"
  en_hash: "53c45ec809c4769a"
  fr: "Dégradation de la chaîne RF de la station sol"
- key: "scn:gs_rf_degradation:briefing"
  en: "During a routine pass, the ground station LNA begins degrading due to\na failing pre-amplifier. Simultaneously, the antenna tracking accuracy\ndegrades due to a servo motor issue. The operator must diagnose whether\nthe signal degradation is from the space segment (spacecraft PA/antenna)\nor the ground segment (LNA/tracking), and take appropriate action.\n\nThis scenario requires the RF bridge in FRAME mode. The ground failures\nare injected via the Radio UI API, while space segment failures use\nthe instructor interface.\n\nStart with: SMO_RF_MODE=FRAME ./start.sh"
  en_hash: "3e748a4ec130cd8f"
  fr: "Pendant un passage de routine, le LNA de la station sol commence à se dégrader à cause\nd'un préamplificateur défaillant. Simultanément, la précision de poursuite de l'antenne\nse dégrade à cause d'un problème de servomoteur. L'opérateur doit diagnostiquer si\nla dégradation du signal provient du segment spatial (PA/antenne du satellite)\nou du segment sol (LNA/poursuite), et prendre les mesures appropriées.\n\nCe scénario exige le pont RF en mode FRAME. Les pannes sol\nsont injectées via l'API de l'interface radio, tandis que les pannes du segment spatial passent par\nl'interface instructeur.\n\nDémarrer avec : SMO_RF_MODE=FRAME ./start.sh"
- key: "scn:gs_tracking_loss:name"
  en: "Ground Antenna Tracking Loss During Critical Pass"
  en_hash: "7a5adb638c1dcc97"
  fr: "Perte de poursuite de l'antenne sol pendant un passage critique"
- key: "scn:gs_tracking_loss:briefing"
  en: "During a critical data downlink pass, the ground station antenna tracking\nsystem fails completely, causing total loss of signal. The operator must\ndetect the loss, diagnose it as a ground issue (not spacecraft), attempt\nto restore tracking, and if unsuccessful, plan recovery for the next pass.\n\nCombined with a spacecraft transponder that has been commanded to high-power\nmode, the operator must also manage the PA thermal budget since the spacecraft\ncontinues transmitting even without ground reception.\n\nStart with: SMO_RF_MODE=FRAME ./start.sh"
  en_hash: "1e94e6ec8bdff0a8"
  fr: "Pendant un passage critique de liaison descendante de données, le système de poursuite de l'antenne\nde la station sol tombe complètement en panne, entraînant une perte totale du signal. L'opérateur doit\ndétecter la perte, la diagnostiquer comme un problème sol (et non satellite), tenter\nde rétablir la poursuite et, en cas d'échec, planifier la reprise au passage suivant.\n\nComme le transpondeur du satellite a été commandé en mode haute puissance,\nl'opérateur doit aussi gérer le bilan thermique du PA, puisque le satellite\ncontinue d'émettre même sans réception au sol.\n\nDémarrer avec : SMO_RF_MODE=FRAME ./start.sh"
- key: "scn:nominal_ops:name"
  en: "Nominal Operations"
  en_hash: "5351455c5af19c5c"
  fr: "Opérations nominales"
- key: "scn:nominal_ops:briefing"
  en: "Familiarisation scenario. Monitor nominal spacecraft operations\nthrough one full orbit including eclipse entry/exit and a ground\nstation contact window. No failures will be injected."
  en_hash: "4cb0766c845edce4"
  fr: "Scénario de familiarisation. Surveiller les opérations nominales du satellite\nsur une orbite complète, y compris l'entrée et la sortie d'éclipse et une fenêtre de visibilité\nd'une station sol. Aucune panne ne sera injectée."
- key: "scn:obc_bus_failure:name"
  en: "CAN Bus A Failure"
  en_hash: "372b7adeeccda9a6"
  fr: "Panne du bus CAN A"
- key: "scn:obc_bus_failure:briefing"
  en: "CAN Bus A experiences a failure at T+180s. Equipment on the failed bus\nbecomes unreachable until bus switchover is commanded. The operator must\ndetect missing HK from affected subsystems and command bus switchover."
  en_hash: "77e4e8c44c02e09c"
  fr: "Le bus CAN A tombe en panne à T+180s. Les équipements du bus défaillant\ndeviennent injoignables jusqu'à ce que le basculement de bus soit commandé. L'opérateur doit\ndétecter l'absence de HK des sous-systèmes concernés et commander le basculement de bus."
- key: "scn:obc_clock_drift:name"
  en: "Onboard Clock Drift — GPS Discipline Lost"
  en_hash: "f9be5e9f7a9af3f8"
  fr: "Dérive de l'horloge de bord — asservissement GPS perdu"
- key: "scn:obc_clock_drift:briefing"
  en: "The onboard oscillator starts drifting hard at T+120s — roughly 500 ppm,\nabout 43 seconds per day, against a nominal of ~12 ppm (1 s/day). With GPS\ndiscipline unavailable the OBC clock walks away from UTC, so onboard CUC\ntimestamps, the S11 time-tagged command schedule and the delayed-TM archive\nall start disagreeing with ground time.\n\nThe operator must notice the growing onboard/ground time difference in\ntelemetry, decide whether the fault is in the clock or in the ground\ncorrelation, and re-sync the clock with an S9 time update once the pass\ngives them the uplink to do it."
  en_hash: "9d9bec3b0c3c2111"
  fr: "L'oscillateur de bord se met à dériver fortement à T+120s — environ 500 ppm,\nsoit à peu près 43 secondes par jour, contre ~12 ppm (1 s/jour) en nominal. Sans\nasservissement GPS, l'horloge de l'OBC s'écarte de l'UTC, si bien que les horodatages CUC\nde bord, le planning de commandes datées S11 et l'archive de TM différée\ncommencent tous à diverger du temps sol.\n\nL'opérateur doit remarquer l'écart croissant entre temps bord et temps sol dans la\ntélémesure, déterminer si le défaut vient de l'horloge ou de la corrélation\nsol, et resynchroniser l'horloge par une mise à jour de temps S9 dès que le passage\nlui donne la liaison montante nécessaire."
- key: "scn:obc_crash:name"
  en: "OBC Watchdog Reset to Boot Loader"
  en_hash: "f77ddc6ae8ad6fce"
  fr: "Réinitialisation de l'OBC par chien de garde vers le chargeur d'amorçage"
- key: "scn:obc_crash:briefing"
  en: "The OBC application software crashes at T+60s, triggering a watchdog reset.\nThe OBC drops to boot loader mode with minimal HK. The operator must detect\nthe reboot, verify boot loader HK, and boot the application software."
  en_hash: "1dbc3601bd882082"
  fr: "Le logiciel applicatif de l'OBC plante à T+60s, déclenchant une réinitialisation par chien de garde.\nL'OBC retombe en mode chargeur d'amorçage avec une HK minimale. L'opérateur doit détecter\nle redémarrage, vérifier la HK du chargeur d'amorçage et amorcer le logiciel applicatif."
- key: "scn:obc_watchdog:name"
  en: "OBC Watchdog Reset"
  en_hash: "30f63a5372be157f"
  fr: "Réinitialisation de l'OBC par chien de garde"
- key: "scn:obc_watchdog:briefing"
  en: "A CPU spike at T+120s will cause the OBC watchdog to fire,\ntriggering a reboot into safe mode. The operator must verify\nspacecraft safe mode entry and recover to nominal."
  en_hash: "e0ea048f9e9f9cb1"
  fr: "Un pic de charge CPU à T+120s déclenche le chien de garde de l'OBC,\nprovoquant un redémarrage en mode survie. L'opérateur doit vérifier\nle passage du satellite en mode survie et revenir en nominal."
- key: "scn:obdh_bootloader_recovery:name"
  en: "OBC Stuck in Bootloader"
  en_hash: "573b712a7d287661"
  fr: "OBC bloqué dans le chargeur d'amorçage"
- key: "scn:obdh_bootloader_recovery:briefing"
  en: "The OBC has crashed and rebooted into bootloader mode. Only the beacon\nhousekeeping structure (SID 11 on bootloader APID 0x002) is available, providing limited HK data.\nThe full application software is not running. The operator must verify\nthat the OBC is in bootloader mode, determine the reboot cause, attempt\nto boot the application software via OBC_BOOT_APP (func_id 55), and if\nthat fails, perform a memory integrity check via Service 6 before\nconsidering a memory reload or OBC switchover."
  en_hash: "5c9441a4107f017d"
  fr: "L'OBC a planté et redémarré en mode chargeur d'amorçage. Seule la structure de\nservitude de la balise (SID 11 sur l'APID 0x002 du chargeur d'amorçage) est disponible, ce qui fournit une HK limitée.\nLe logiciel applicatif complet ne s'exécute pas. L'opérateur doit vérifier\nque l'OBC est en mode chargeur d'amorçage, déterminer la cause du redémarrage, tenter\nd'amorcer le logiciel applicatif par OBC_BOOT_APP (func_id 55) et, en cas\nd'échec, effectuer un contrôle d'intégrité mémoire par le service 6 avant\nd'envisager un rechargement mémoire ou un basculement d'OBC."
- key: "scn:obdh_bus_isolation:name"
  en: "CAN Bus A Failure Isolation"
  en_hash: "010f8be8e3dfb264"
  fr: "Isolation d'une panne du bus CAN A"
- key: "scn:obdh_bus_isolation:briefing"
  en: "The OBC loses communication with subsystems on CAN Bus A at T+120s.\nHousekeeping data from subsystems connected via Bus A stops arriving.\nThe operator must detect the missing HK, diagnose the bus failure using\nOBDH bus status telemetry, command a switchover to CAN Bus B via\nOBC_SELECT_BUS (func_id 54), and verify that all subsystem responses\nresume on the redundant bus."
  en_hash: "82eb410f698f9d9b"
  fr: "L'OBC perd la communication avec les sous-systèmes du bus CAN A à T+120s.\nLes données de servitude des sous-systèmes reliés au bus A n'arrivent plus.\nL'opérateur doit détecter l'absence de HK, diagnostiquer la panne de bus à l'aide de\nla télémesure d'état des bus OBDH, commander un basculement sur le bus CAN B par\nOBC_SELECT_BUS (func_id 54), et vérifier que toutes les réponses des sous-systèmes\nreprennent sur le bus redondant."
- key: "scn:payload_corrupt_image:name"
  en: "Image Corruption During Capture"
  en_hash: "1986fb35a6ed2632"
  fr: "Corruption d'images pendant l'acquisition"
- key: "scn:payload_corrupt_image:briefing"
  en: "During an imaging session at T+180s, captured images begin showing\nchecksum errors. The operator must detect the quality degradation,\nassess the cause, and decide whether to continue or abort imaging."
  en_hash: "56c115d7986f42c4"
  fr: "Pendant une séance de prise de vue à T+180s, les images acquises commencent à présenter\ndes erreurs de somme de contrôle. L'opérateur doit détecter la dégradation de qualité,\nen évaluer la cause et décider de poursuivre ou d'abandonner la prise de vue."
- key: "scn:payload_memory_failure:name"
  en: "Payload Memory Segment Corruption"
  en_hash: "3dce128de50fdd61"
  fr: "Corruption d'un segment mémoire de la charge utile"
- key: "scn:payload_memory_failure:briefing"
  en: "A payload memory segment fails at T+120s, reducing available storage.\nThe operator must detect the segment failure, mark it as bad, and\nadjust imaging operations for reduced capacity."
  en_hash: "e3801645dcd2445e"
  fr: "Un segment mémoire de la charge utile tombe en panne à T+120s, réduisant le stockage disponible.\nL'opérateur doit détecter la défaillance du segment, le marquer comme défectueux et\nadapter les opérations de prise de vue à la capacité réduite."
- key: "scn:prop_attitude_loss_mid_burn:name"
  en: "Attitude Loss During Burn"
  en_hash: "7fd2c9acd69634b3"
  fr: "Perte d'attitude pendant une poussée"
- key: "scn:prop_attitude_loss_mid_burn:briefing"
  en: "The headline propulsion-AOCS coupling demonstration. Ten seconds into a\nplanned drag make-up burn the primary star tracker goes blind and reaction\nwheel 2 seizes. The attitude error grows through 1.0 degree — S19 rule\n8001 auto-aborts the burn (PROP_BURN_ABORTED, reason 1) — and the\npartially-delivered delta-V has both a shortfall (cos-theta loss) and a\nlateral component that shows up in the post-burn orbit fit. The crew must\nrecover the attitude per CTG-002, complete post-burn orbit determination\non the partial burn, clear the propulsion state, and re-plan the remainder\nunder NOM-004. A second careless abort latches the propulsion inhibit."
  en_hash: "b25427eb0f024e1e"
  fr: "La démonstration phare du couplage propulsion-AOCS. Dix secondes après le début d'une\npoussée planifiée de compensation de traînée, le senseur stellaire principal devient aveugle et la roue\nde réaction 2 se grippe. L'erreur d'attitude dépasse 1.0 degré — la règle S19\n8001 abandonne automatiquement la poussée (PROP_BURN_ABORTED, raison 1) — et le\ndelta-V partiellement fourni présente à la fois un déficit (perte en cos-thêta) et une\ncomposante latérale qui apparaît dans l'ajustement d'orbite après poussée. L'équipe doit\nrétablir l'attitude selon CTG-002, effectuer la restitution d'orbite après poussée\nsur la poussée partielle, remettre à zéro l'état de la propulsion et replanifier le reliquat\nselon NOM-004. Un second abandon imprudent verrouille l'inhibition de la propulsion."
- key: "scn:prop_burn_eclipse_power:name"
  en: "Manoeuvre Power Conflict at Eclipse"
  en_hash: "67e1a25d044e0688"
  fr: "Conflit énergétique d'une manœuvre en entrée d'éclipse"
- key: "scn:prop_burn_eclipse_power:briefing"
  en: "A conjunction warning forces a debris-avoidance burn on a pass that runs\ninto eclipse entry, on a battery already degraded by a partial array\nfault. A manoeuvre is a POWER activity: the catbed preheat is 12 W for 20\nminutes (4 Wh) on top of platform load, and the arm interlock requires\nSoC > 45% and daylight. Injected at T+300s, the array degradation drags\nthe charge rate down so a carelessly-timed preheat leaves the spacecraft\nbelow the arm threshold at the burn epoch — the arm is refused with the\nSoC bit set in 0x0B15 (or, if forced earlier and SoC collapses to\ncritical, S19 rule 8006 aborts the burn). The crew must re-time the\npreheat and burn inside the daylight/power envelope or brief the Flight\nDirector that the CAM slips one orbit."
  en_hash: "839ddddd2a873d22"
  fr: "Une alerte de conjonction impose une poussée d'évitement de débris lors d'un passage qui\ndéborde sur l'entrée en éclipse, avec une batterie déjà dégradée par un défaut partiel\ndu générateur. Une manœuvre est une activité ÉNERGÉTIQUE : le préchauffage du lit catalytique consomme 12 W pendant 20\nminutes (4 Wh) en plus de la charge de la plateforme, et le verrouillage d'armement exige\nSoC > 45 % et le plein jour. Injectée à T+300s, la dégradation du générateur fait baisser\nle régime de charge, si bien qu'un préchauffage mal synchronisé laisse le satellite\nsous le seuil d'armement à la date de poussée — l'armement est refusé avec le\nbit SoC positionné dans 0x0B15 (ou, s'il a été forcé plus tôt et que le SoC s'effondre jusqu'au\nseuil critique, la règle S19 8006 abandonne la poussée). L'équipe doit recaler le\npréchauffage et la poussée dans l'enveloppe jour/énergie ou informer la direction\ndu vol que la CAM glisse d'une orbite."
- key: "scn:prop_slow_leak:name"
  en: "Propulsion Slow Leak"
  en_hash: "bfd58fb5738d90ee"
  fr: "Fuite lente de la propulsion"
- key: "scn:prop_slow_leak:briefing"
  en: "A micrometeoroid strike on a feed line causes a very slow propellant leak\n(2 mg/s) with a gradual onset over 10 minutes from T+600s. Nothing crosses\nan absolute limit for hours: at this rate the tank loses ~0.1 bar per\nhalf-orbit, buried in sensor noise on any single sample. Only trending\ndiscipline — and the S12 delta monitor on prop.tank_pressure — catches it.\nThe exercise rewards the operator who plots 0x0B01 and 0x0B02 across\npasses instead of watching instantaneous values."
  en_hash: "24b884b09e472f5c"
  fr: "L'impact d'un micrométéoroïde sur une ligne d'alimentation provoque une fuite d'ergol très lente\n(2 mg/s) qui s'installe progressivement sur 10 minutes à partir de T+600s. Rien ne franchit\nde limite absolue pendant des heures : à ce rythme, le réservoir perd ~0.1 bar par\ndemi-orbite, noyé dans le bruit du capteur sur tout échantillon isolé. Seule la rigueur\ndu suivi de tendance — et la surveillance delta S12 sur prop.tank_pressure — la détecte.\nL'exercice récompense l'opérateur qui trace 0x0B01 et 0x0B02 d'un\npassage à l'autre au lieu de regarder les valeurs instantanées."
- key: "scn:prop_underperformance:name"
  en: "Propulsion Thruster Underperformance"
  en_hash: "c57d5115ff283c8d"
  fr: "Sous-performance du propulseur"
- key: "scn:prop_underperformance:briefing"
  en: "Catalyst-bed poisoning has degraded thrust to 55% of prediction. The\ndegradation is injected before the planned drag make-up burn, so the burn\nARMS and COMPLETES normally — in closed-loop dv mode the burn simply runs\n~1.8x longer than predicted (0x0B11 vs 0x0B10), and in timed mode the\nachieved delta-V (0x0B0F) comes up at 55% of commanded. The tell is the\nlive thrust estimate (0x0B09) sitting far below the blowdown prediction\nfor the current tank pressure. Post-burn orbit determination confirms the\nshortfall; the correct response is the NOM-013 deviation: complete the OD,\nre-plan a trim burn under NOM-004 with the measured performance factor,\nand raise a ticket (CTG-028 underperformance path)."
  en_hash: "ab37ed02256ec50f"
  fr: "L'empoisonnement du lit catalytique a réduit la poussée à 55 % de la prévision. La\ndégradation est injectée avant la poussée planifiée de compensation de traînée, si bien que la poussée\ns'ARME et s'ACHÈVE normalement — en mode dv en boucle fermée, la poussée dure simplement\n~1.8x plus longtemps que prévu (0x0B11 vs 0x0B10), et en mode minuté le\ndelta-V obtenu (0x0B0F) n'atteint que 55 % de la commande. L'indice est\nl'estimation de poussée instantanée (0x0B09), très inférieure à la prévision en mode blowdown\npour la pression réservoir actuelle. La restitution d'orbite après poussée confirme le\ndéficit ; la bonne réponse est l'écart NOM-013 : achever la restitution d'orbite,\nreplanifier une poussée de correction selon NOM-004 avec le facteur de performance mesuré,\net ouvrir une fiche d'anomalie (voie sous-performance de CTG-028)."
- key: "scn:prop_valve_stuck_open:name"
  en: "Propulsion Latch Valve Stuck Open"
  en_hash: "6f79cb8553d9923f"
  fr: "Vanne à verrouillage de propulsion bloquée ouverte"
- key: "scn:prop_valve_stuck_open:briefing"
  en: "During routine post-pass housekeeping, latch valve branch A fails stuck\nopen at T+300s and the flow-control valve seat begins to seep — a slow\ncontinuous propellant loss (~20 mg/s). The absolute tank-pressure band\nwill not alarm for a long time; the DELTA (rate) monitor on\nprop.tank_pressure (0x0B01) is what makes the loss visible. The crew must\nrecognise the signature (pressure AND propellant mass falling together),\nisolate per CTG-028, recognise that branch A reports FAULT and did not\nclose, and bound the remaining usable delta-V — the debris-avoidance\nreserve is the number the Flight Director needs."
  en_hash: "f0727ebfc84d4912"
  fr: "Pendant la HK de routine après passage, la branche A des vannes à verrouillage se bloque\nouverte à T+300s et le siège de la vanne de régulation commence à suinter — une perte d'ergol\nlente et continue (~20 mg/s). La bande absolue de pression réservoir\nne déclenchera pas d'alarme avant longtemps ; c'est la surveillance DELTA (vitesse de variation) sur\nprop.tank_pressure (0x0B01) qui rend la perte visible. L'équipe doit\nreconnaître la signature (pression ET masse d'ergol en baisse simultanée),\nisoler selon CTG-028, constater que la branche A signale FAULT et ne s'est pas\nfermée, et borner le delta-V utilisable restant — la réserve d'évitement de débris\nest le chiffre dont la direction du vol a besoin."
- key: "scn:rw_bearing:name"
  en: "Reaction Wheel Bearing Failure"
  en_hash: "f202ca2701c45080"
  fr: "Panne de roulement de roue de réaction"
- key: "scn:rw_bearing:briefing"
  en: "RW-2 bearing will gradually degrade starting at T+180s.\nWheel temperature will rise and speed control will deteriorate.\nThe operator must detect, disable the wheel, and initiate desaturation."
  en_hash: "b19a86e25b720a6e"
  fr: "Le roulement de RW-2 se dégrade progressivement à partir de T+180s.\nLa température de la roue va monter et l'asservissement de vitesse se détériorer.\nL'opérateur doit détecter le problème, désactiver la roue et lancer la désaturation."
- key: "scn:scenario_2_cerise_adcs_fault:name"
  en: "Scenario 2 — CERISE ADCS Gain Fault"
  en_hash: "6add9c5443772835"
  fr: "Scénario 2 — défaut de gain SCAO CERISE"
- key: "scn:scenario_2_cerise_adcs_fault:briefing"
  en: "CERISE-inspired ADCS fault. At T+02:00 a debris impact perturbs EOSAT-1 and,\nin the same event, a latent corruption is written to the Y-axis control-torque\ngain register (torque_gain_y = 10x nominal) — the block that PUS S6 memory\ndump/load manages. While the spacecraft is in SAFE the gain is not applied, so\nthe fault is invisible. Once a control mode is active, the corrupted gain makes\nY-axis pointing control over-aggressive: the axis over-rotates and oscillates\nabout the target (pointing jitter/overshoot in att_error and body-rate\ntelemetry). If the oscillation and the impact disturbance push att_error past\n5 deg, FDIR trips safe_mode_aocs.\n\nOperators must: identify the disturbance at impact, then recognise on recovery\nthat Y-axis pointing is anomalously over-aggressive/oscillatory rather than a\nsensor or wheel-hardware fault. Diagnose by dumping the torque-gain registers\n(AOCS_DUMP_TORQUE_GAINS / S6 MEM_DUMP at 0x20100000) — the Y-axis reads ~10x\nnominal while X and Z read unity. Patch it with AOCS_SET_TORQUE_GAIN_Y\n(S6 MEM_LOAD) back to 1.0, confirm via a re-dump, then return to NOMINAL."
  en_hash: "7e82296a245be697"
  fr: "Défaut SCAO inspiré de CERISE. À T+02:00, un impact de débris perturbe EOSAT-1 et,\ndans le même événement, une corruption latente est écrite dans le registre de gain de couple\nde commande de l'axe Y (torque_gain_y = 10x la valeur nominale) — le bloc que gèrent le vidage/chargement\nmémoire PUS S6. Tant que le satellite est en SAFE, le gain n'est pas appliqué, si bien que\nle défaut est invisible. Dès qu'un mode de commande est actif, le gain corrompu rend la\ncommande de pointage de l'axe Y trop agressive : l'axe dépasse et oscille\nautour de la cible (gigue/dépassement de pointage dans la télémesure att_error et de vitesse\nangulaire). Si l'oscillation et la perturbation de l'impact poussent att_error au-delà de\n5 deg, la FDIR déclenche safe_mode_aocs.\n\nLes opérateurs doivent : identifier la perturbation à l'impact, puis reconnaître lors de la reprise\nque le pointage de l'axe Y est anormalement agressif/oscillant plutôt qu'affecté par un\ndéfaut de capteur ou de roue. Diagnostiquer en vidant les registres de gain de couple\n(AOCS_DUMP_TORQUE_GAINS / S6 MEM_DUMP à 0x20100000) — l'axe Y lit ~10x la valeur\nnominale tandis que X et Z lisent l'unité. Corriger avec AOCS_SET_TORQUE_GAIN_Y\n(S6 MEM_LOAD) pour revenir à 1.0, confirmer par un nouveau vidage, puis revenir en NOMINAL."
- key: "scn:separation:name"
  en: "Post-Separation"
  en_hash: "06b5152d209c1098"
  fr: "Après la séparation"
- key: "scn:separation:briefing"
  en: "Post-separation scenario. Spacecraft has just separated from launch vehicle.\nAll subsystems are powered down except OBC bootloader. Battery is at 95% SoC.\nAOCS is in OFF mode with random tumble rates (~1-2 deg/s) from separation impulse.\nTTC antenna is NOT deployed — only bootloader beacon is active.\nBattery heater is OFF. All temperature zones at ambient (~20°C).\n\nYour mission: Commission the spacecraft for nominal operations.\n1. Monitor separation timer (30 min countdown)\n2. Boot OBC and establish telecommand link\n3. Deploy antenna and verify uplink\n4. Initiate AOCS detumble sequence\n5. Enable thermal control and nominal power loads"
  en_hash: "07ffcbc5ee310326"
  fr: "Scénario après séparation. Le satellite vient de se séparer du lanceur.\nTous les sous-systèmes sont hors tension sauf le chargeur d'amorçage de l'OBC. La batterie est à 95 % de SoC.\nL'AOCS est en mode OFF avec des vitesses de culbutage aléatoires (~1-2 deg/s) dues à l'impulsion de séparation.\nL'antenne TTC n'est PAS déployée — seule la balise du chargeur d'amorçage est active.\nLe réchauffeur batterie est sur OFF. Toutes les zones de température sont à l'ambiante (~20 °C).\n\nVotre mission : recetter le satellite pour les opérations nominales.\n1. Surveiller la minuterie de séparation (compte à rebours de 30 min)\n2. Amorcer l'OBC et établir la liaison de télécommande\n3. Déployer l'antenne et vérifier la liaison montante\n4. Lancer la séquence d'amortissement AOCS\n5. Activer le contrôle thermique et les charges électriques nominales"
- key: "scn:separation_sequence:name"
  en: "Separation Sequence"
  en_hash: "8f84492aff02f9ab"
  fr: "Séquence de séparation"
- key: "scn:separation_sequence:briefing"
  en: "Simulate the full separation sequence from launch vehicle.\nThe spacecraft starts in PRE_SEPARATION phase. A 30-minute\nseparation timer counts down, after which the OBC bootloader\npowers on and begins transmitting a beacon. The first ground\nstation contact occurs at Iqaluit approximately 45 minutes\nafter separation. Operators must establish contact, verify\nbootloader beacon, boot application software, perform initial\nhealth check, and begin sequential power-on of subsystems."
  en_hash: "fbd2b4301cd62922"
  fr: "Simuler la séquence complète de séparation du lanceur.\nLe satellite démarre en phase PRE_SEPARATION. Une minuterie de séparation de 30 minutes\ns'écoule, après quoi le chargeur d'amorçage de l'OBC\ns'allume et commence à émettre une balise. Le premier contact avec une station sol\na lieu à Iqaluit environ 45 minutes\naprès la séparation. Les opérateurs doivent établir le contact, vérifier\nla balise du chargeur d'amorçage, amorcer le logiciel applicatif, effectuer le bilan\nde santé initial et commencer la mise sous tension séquentielle des sous-systèmes."
- key: "scn:sequential_checkout:name"
  en: "Sequential Subsystem Checkout"
  en_hash: "fe5aa390b2322b06"
  fr: "Vérification séquentielle des sous-systèmes"
- key: "scn:sequential_checkout:briefing"
  en: "Application software is running and antennas are deployed.\nThe spacecraft is in LEOP phase (phase 4). Operators must\nperform the sequential power-on of all subsystems following\nprocedure LEOP-007, then transition to COMMISSIONING phase."
  en_hash: "3cdf345ffa76e25f"
  fr: "Le logiciel applicatif s'exécute et les antennes sont déployées.\nLe satellite est en phase LEOP (phase 4). Les opérateurs doivent\neffectuer la mise sous tension séquentielle de tous les sous-systèmes selon\nla procédure LEOP-007, puis passer en phase COMMISSIONING."
- key: "scn:transponder_failure:name"
  en: "Transponder Primary Failure"
  en_hash: "82df11a202492a5e"
  fr: "Panne du transpondeur principal"
- key: "scn:transponder_failure:briefing"
  en: "The primary transponder will fail during AOS at T+300s.\nThe operator must switch to the redundant transponder to\nrestore communications."
  en_hash: "b2884967257265bf"
  fr: "Le transpondeur principal tombe en panne pendant l'AOS à T+300s.\nL'opérateur doit basculer sur le transpondeur redondant pour\nrétablir les communications."
- key: "scn:ttc_no_tm_at_aos:name"
  en: "No Telemetry at AOS"
  en_hash: "c0cf30977123f2d9"
  fr: "Absence de télémesure à l'AOS"
- key: "scn:ttc_no_tm_at_aos:briefing"
  en: "The spacecraft is in nominal mode and a ground station contact window is\nactive. At AOS (T+60s), no telemetry is received despite valid tracking\nand uplink configuration. The operator must systematically diagnose the\nRF chain — checking transponder power lines, PA status, and antenna\ndeployment — and step through recovery actions until telemetry is restored.\nMultiple failure mechanisms may be in play: the TX power line may be off,\nthe PA may be disabled, or the antennas may not be deployed."
  en_hash: "bb18a351d155808c"
  fr: "Le satellite est en mode nominal et une fenêtre de visibilité d'une station sol est\nouverte. À l'AOS (T+60s), aucune télémesure n'est reçue malgré une poursuite\net une configuration de liaison montante valides. L'opérateur doit diagnostiquer méthodiquement la\nchaîne RF — en contrôlant les lignes d'alimentation du transpondeur, l'état du PA et le déploiement\nde l'antenne — et dérouler les actions de reprise jusqu'au rétablissement de la télémesure.\nPlusieurs mécanismes de panne peuvent être en jeu : la ligne d'alimentation TX peut être coupée,\nle PA peut être désactivé, ou les antennes peuvent ne pas être déployées."
- key: "scn:ttc_pa_overheat:name"
  en: "PA Overheat and Auto-Shutdown"
  en_hash: "0be7494e8342a36f"
  fr: "Surchauffe du PA et arrêt automatique"
- key: "scn:ttc_pa_overheat:briefing"
  en: "The power amplifier temperature begins rising at T+120s due to a thermal\ncontrol anomaly. If not addressed, the PA will auto-shutdown at 70C,\ncausing loss of downlink. The operator must monitor, reduce TX power or\nduty cycle, and manage the thermal situation."
  en_hash: "cf92e86434ae46a3"
  fr: "La température de l'amplificateur de puissance commence à monter à T+120s en raison d'une anomalie\nde contrôle thermique. Sans intervention, le PA s'arrêtera automatiquement à 70C,\nentraînant la perte de la liaison descendante. L'opérateur doit surveiller, réduire la puissance TX ou le\nrapport cyclique, et gérer la situation thermique."
- key: "scnresp:aocs_actuator_stuck.0:description"
  en: "Detect RW-1 speed anomaly — speed frozen, not responding to commands"
  en_hash: "494c2b376d99e8c6"
  fr: "Détecter l'anomalie de vitesse de RW-1 — vitesse figée, insensible aux commandes"
- key: "scnresp:aocs_actuator_stuck.1:description"
  en: "Detect RW-1 temperature rising due to bearing seizure"
  en_hash: "04eba07a862f7edb"
  fr: "Détecter la hausse de température de RW-1 due au grippage du roulement"
- key: "scnresp:aocs_actuator_stuck.2:description"
  en: "Confirm wheel 0 is seized by correlating speed freeze with temperature rise"
  en_hash: "db71b7068a520957"
  fr: "Confirmer le grippage de la roue 0 en corrélant le gel de la vitesse et la hausse de température"
- key: "scnresp:aocs_actuator_stuck.3:description"
  en: "Disable wheel 0 (AOCS_DISABLE_WHEEL, S8 func_id 2), continue on three wheels, perform momentum dump"
  en_hash: "149844968b170653"
  fr: "Désactiver la roue 0 (AOCS_DISABLE_WHEEL, S8 func_id 2), poursuivre sur trois roues, effectuer un déchargement du moment cinétique"
- key: "scnresp:aocs_actuator_stuck.4:description"
  en: "Verify stable pointing in 3-wheel mode with relaxed error tolerance"
  en_hash: "d5a6cbcb37daf39c"
  fr: "Vérifier la stabilité du pointage en mode 3 roues avec une tolérance d'erreur assouplie"
- key: "scnresp:aocs_sensor_cascade.0:description"
  en: "Detect ST1 failure (status=4) and verify ST2 acquisition"
  en_hash: "c92e09d743ec6244"
  fr: "Détecter la panne de ST1 (status=4) et vérifier l'acquisition par ST2"
- key: "scnresp:aocs_sensor_cascade.1:description"
  en: "Detect CSS +X head failure from per-head illumination telemetry"
  en_hash: "95b269d7cc16273f"
  fr: "Détecter la panne de la tête CSS +X d'après la télémesure d'éclairement par tête"
- key: "scnresp:aocs_sensor_cascade.2:description"
  en: "Detect magnetometer failure from readings going invalid (single-string unit — no redundant B mag to swap to)"
  en_hash: "ddba44cb9496abc1"
  fr: "Détecter la panne du magnétomètre à partir de mesures devenues invalides (unité unique — pas de magnétomètre B redondant sur lequel basculer)"
- key: "scnresp:aocs_sensor_cascade.3:description"
  en: "Detect the IMU bias from gyro_bias_x/y/z (0x0270-0x0272) diverging from the MEKF estimate, and from the rising ST innovation-rejection count (0x02C2)"
  en_hash: "d4247cdcb091c8d8"
  fr: "Détecter le biais de l'IMU à partir de l'écart entre gyro_bias_x/y/z (0x0270-0x0272) et l'estimation du MEKF, et de la hausse du compteur de rejets d'innovation ST (0x02C2)"
- key: "scnresp:aocs_sensor_cascade.4:description"
  en: "Diagnose each failure independently and assess cumulative impact"
  en_hash: "70b4e87c732d5ac5"
  fr: "Diagnostiquer chaque défaillance séparément et évaluer l'impact cumulé"
- key: "scnresp:aocs_sensor_cascade.5:description"
  en: "Switch to MAG-B, verify adequate sensor suite, or transition to safe mode"
  en_hash: "80f0840cd176c3eb"
  fr: "Basculer sur MAG-B, vérifier que l'ensemble de capteurs est suffisant, ou passer en mode survie"
- key: "scnresp:aocs_sensor_cascade.6:description"
  en: "Recover gyro knowledge: AOCS_EST_RESET warm (S8 func 91) once the bias is bounded, or accept ST-only determination"
  en_hash: "56b96f68416ce734"
  fr: "Rétablir la connaissance gyroscopique : AOCS_EST_RESET tiède (S8 func 91) une fois le biais borné, ou accepter une détermination par ST seul"
- key: "scnresp:aocs_star_tracker_failure.0:description"
  en: "Detect ST1 status change to FAILED and attitude error increase"
  en_hash: "6f0a099efd196113"
  fr: "Détecter le passage de ST1 à l'état FAILED et la hausse de l'erreur d'attitude"
- key: "scnresp:aocs_star_tracker_failure.1:description"
  en: "Identify ST1 hardware failure vs temporary blinding"
  en_hash: "6227db73c060a937"
  fr: "Distinguer une panne matérielle de ST1 d'un éblouissement temporaire"
- key: "scnresp:aocs_star_tracker_failure.2:description"
  en: "Power on ST2, select as primary, verify pointing recovery"
  en_hash: "dfc0d6b6b840031a"
  fr: "Mettre ST2 sous tension, le sélectionner comme principal, vérifier le rétablissement du pointage"
- key: "scnresp:aocs_wheel_failure.0:description"
  en: "Detect RW3 speed anomaly and temperature rise"
  en_hash: "2560be1e3541948c"
  fr: "Détecter l'anomalie de vitesse et la hausse de température de RW3"
- key: "scnresp:aocs_wheel_failure.1:description"
  en: "Confirm bearing failure via speed/temp correlation"
  en_hash: "e41f0f7ade09bbde"
  fr: "Confirmer la panne de roulement par corrélation vitesse/température"
- key: "scnresp:aocs_wheel_failure.2:description"
  en: "Disable RW3, switch to 3-wheel mode, verify pointing"
  en_hash: "4ed8bed3191ddf40"
  fr: "Désactiver RW3, passer en mode 3 roues, vérifier le pointage"
- key: "scnresp:debris_impact_hermes3.0:description"
  en: "Identify EPS as root cause within 90 s — confirm bus < 24 V and power_gen < 900 W. Issue load-shed tier-1 to stop SoC decline."
  en_hash: "62ea3188997915e8"
  fr: "Identifier l'EPS comme cause première en moins de 90 s — confirmer bus < 24 V et power_gen < 900 W. Envoyer le délestage de niveau 1 pour enrayer la baisse du SoC."
- key: "scnresp:debris_impact_hermes3.1:description"
  en: "Isolate SA-2B degraded panel. Command EPS safe mode (S8 func 83, mode 1). If SoC < 80%, limit battery discharge current."
  en_hash: "0650ec67a099f94f"
  fr: "Isoler le panneau dégradé SA-2B. Commander le mode survie EPS (S8 func 83, mode 1). Si SoC < 80 %, limiter le courant de décharge de la batterie."
- key: "scnresp:debris_impact_hermes3.2:description"
  en: "AOCS: monitor RW-2 speed; switch to SUN_SAFE attitude if > 5000 RPM. Desaturate RW-2 before saturation limit."
  en_hash: "1fc5f882e6c72159"
  fr: "AOCS : surveiller la vitesse de RW-2 ; passer en attitude SUN_SAFE si > 5000 RPM. Désaturer RW-2 avant la limite de saturation."
- key: "scnresp:debris_impact_hermes3.3:description"
  en: "TCS: monitor battery temperature. Restore heaters once bus ≥ 23 V sustained."
  en_hash: "7b0eb7a7c08a1646"
  fr: "TCS : surveiller la température de la batterie. Rétablir les réchauffeurs dès que le bus est durablement ≥ 23 V."
- key: "scnresp:debris_impact_hermes3.4:description"
  en: "OBDH: switch active CAN bus (S8 func 54) to restore subsystem telemetry."
  en_hash: "143cd303b28af608"
  fr: "OBDH : basculer le bus CAN actif (S8 func 54) pour rétablir la télémesure des sous-systèmes."
- key: "scnresp:debris_impact_hermes3.5:description"
  en: "TTC: restore TX power once bus ≥ 24 V. Verify uplink margin before further commands."
  en_hash: "1d488aa25fc58ce9"
  fr: "TTC : rétablir la puissance TX dès que le bus est ≥ 24 V. Vérifier la marge de liaison montante avant toute nouvelle commande."
- key: "scnresp:debris_impact_hermes3.6:description"
  en: "Full recovery: bus ≥ 25 V sustained, SoC ≥ 80%, return OBC to NOMINAL mode, restore payload power in stepped intervals, clear all fault flags."
  en_hash: "68638c39f5227e75"
  fr: "Reprise complète : bus durablement ≥ 25 V, SoC ≥ 80 %, retour de l'OBC en mode NOMINAL, rétablissement de l'alimentation de la charge utile par paliers, effacement de tous les indicateurs de défaut."
- key: "scnresp:eps_anomaly.0:description"
  en: "Detect power generation drop on SA-A"
  en_hash: "d2b9b93319230900"
  fr: "Détecter la baisse de production de puissance sur SA-A"
- key: "scnresp:eps_anomaly.1:description"
  en: "Identify SA-A as the degraded array"
  en_hash: "6749b19f26cb6009"
  fr: "Identifier SA-A comme le générateur dégradé"
- key: "scnresp:eps_anomaly.2:description"
  en: "Shed non-essential loads or switch to safe mode"
  en_hash: "f562090f44eadcd6"
  fr: "Délester les charges non essentielles ou passer en mode survie"
- key: "scnresp:eps_overcurrent.0:description"
  en: "Detect overcurrent trip flag and TX power line OFF"
  en_hash: "abbdea69b286b923"
  fr: "Détecter l'indicateur de disjonction sur surintensité et la ligne d'alimentation TX à OFF"
- key: "scnresp:eps_overcurrent.1:description"
  en: "Identify the ttc_tx line as the tripped circuit"
  en_hash: "40b34d6963ea3560"
  fr: "Identifier la ligne ttc_tx comme le circuit disjoncté"
- key: "scnresp:eps_overcurrent.2:description"
  en: "Investigate cause, then reset OC flag and re-enable if safe"
  en_hash: "1f061cb28a17973c"
  fr: "Rechercher la cause, puis réarmer l'indicateur OC et réactiver la ligne si c'est sûr"
- key: "scnresp:eps_progressive_load_shed.0:description"
  en: "Detect battery SoC dropping below 50% and bus voltage declining"
  en_hash: "1da3faee6a71d76e"
