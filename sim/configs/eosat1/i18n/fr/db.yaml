  fr: "Plan du jour : poussée prograde de compensation de traînée de 0.85 m/s pendant ce passage (NOM-004 approuvée). Exécuter selon NOM-013 ; l'instructeur injecte la panne après le début de la poussée."
- key: "scnevt:prop_burn_eclipse_power.1:params.text"
