- key: "tc:TTC_SET_DOWNLINK_MODE:description"
  en: "Enter or leave DOWNLINK / payload-dump mode. This is the gate on the HIGH tier of the TM data-rate ladder (TTC_SET_DATA_RATE): bulk downlink has to be entered deliberately, so an S13 image dump or an S15 delayed- telemetry playback is a planned pass activity rather than something the spacecraft drifts into at 1 Mbps. Leaving DOWNLINK mode does NOT clear the commanded tier — the active tier simply falls back to LOW until DOWNLINK mode is re-entered."
  en_hash: "bf60f432da302344"
  fr: "Entrer en mode DOWNLINK / vidage charge utile ou en sortir. C'est l'autorisation du palier HIGH de l'échelle de débits TM (TTC_SET_DATA_RATE) : la liaison descendante massive doit être engagée délibérément, de sorte qu'un vidage d'images S13 ou une relecture de télémesure différée S15 soit une activité de passage planifiée et non une dérive du satellite à 1 Mbps. Quitter le mode DOWNLINK n'efface PAS le palier commandé — le palier actif retombe simplement sur LOW jusqu'à ce que le mode DOWNLINK soit réactivé."
- key: "tc:TTC_BEACON_TX_ON:description"
  en: "Switch the UHF bootloader beacon TRANSMITTER on. This is the second radio, not a mode of the S-band transponder: separate band (437.5 MHz, in the 435-438 MHz amateur-satellite segment), separate PA (1 W RF), separate deployable dipole and separate link budget. It carries HK SID 11 only, and it keeps carrying it when the S-band prime chain is dead - PA off, ttc_tx line pulled, transponder failed or patch stowed. That independence is the entire reason a spacecraft carries one."
  en_hash: "1f87fb1b21bffa73"
  fr: "Mettre en marche l'ÉMETTEUR de la balise UHF du chargeur d'amorçage. C'est la seconde radio, pas un mode du transpondeur bande S : bande distincte (437.5 MHz, dans le segment amateur-satellite 435-438 MHz), PA distinct (1 W RF), dipôle déployable distinct et bilan de liaison distinct. Elle ne transporte que le SID HK 11, et continue de le transporter lorsque la chaîne principale bande S est hors service - PA éteint, ligne ttc_tx coupée, transpondeur défaillant ou antenne patch repliée. Cette indépendance est l'unique raison pour laquelle un satellite en embarque une."
- key: "tc:TTC_BEACON_TX_OFF:description"
  en: "Switch the UHF bootloader beacon transmitter off. CAUTION: this removes the mission's last independent downlink. With the beacon off, an S-band failure leaves the spacecraft unable to tell the ground that the OBC is alive, and recovery depends entirely on the uplink still working. Use only for RFI de-confliction or a deliberate radio-silence exercise."
  en_hash: "a0073e71ab0af043"
  fr: "Arrêter l'émetteur de la balise UHF du chargeur d'amorçage. ATTENTION : cela supprime la dernière liaison descendante indépendante de la mission. Balise arrêtée, une panne en bande S laisse le satellite incapable d'indiquer au sol que l'OBC est vivant, et la reprise dépend entièrement du bon fonctionnement de la liaison montante. À n'utiliser que pour éviter un brouillage RF ou pour un exercice délibéré de silence radio."
