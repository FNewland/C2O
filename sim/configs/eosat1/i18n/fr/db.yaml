  en_hash: "d6a62867fc3cedcf"
  fr: "Détecter une poussée estimée (0x0B09) / une durée de poussée (0x0B11 vs 0x0B10) incohérentes avec la pression réservoir ; événement PROP_UNDERPERFORMANCE"
- key: "scnresp:prop_underperformance.1:description"
  en: "Post-burn OD: achieved vs commanded dV and observed AOS shift confirm real underperformance, not sensor error"
  en_hash: "45409f628dcd6109"
  fr: "Restitution d'orbite après poussée : dV obtenu vs commandé et décalage d'AOS observé confirment une sous-performance réelle, pas une erreur de capteur"
- key: "scnresp:prop_underperformance.2:description"
  en: "Re-plan a trim burn under NOM-004 with the measured performance factor; ticket catbed degradation"
  en_hash: "3d036f2767c8896a"
  fr: "Replanifier une poussée de correction selon NOM-004 avec le facteur de performance mesuré ; ouvrir une fiche pour la dégradation du lit catalytique"
- key: "scnresp:prop_valve_stuck_open.0:description"
  en: "Detect the 0x0B01 pressure-rate (delta) alarm and PROP_VALVE_FAULT / PROP_LEAK_DETECTED events"
  en_hash: "4b9c0d1cdb7fd6ba"
  fr: "Détecter l'alarme de vitesse de variation de pression (delta) 0x0B01 et les événements PROP_VALVE_FAULT / PROP_LEAK_DETECTED"
- key: "scnresp:prop_valve_stuck_open.1:description"
  en: "PROP_ISO_CLOSE both branches (CTG-028 step 2); recognise branch A state 2 = stuck, isolation partial"
  en_hash: "239f18174481fbb5"
  fr: "PROP_ISO_CLOSE sur les deux branches (CTG-028 étape 2) ; constater que l'état 2 de la branche A = bloquée, isolation partielle"
- key: "scnresp:prop_valve_stuck_open.2:description"
  en: "Bound remaining usable delta-V (0x0B0C corrected for the stuck branch), latch the ground inhibit, ticket"
  en_hash: "d9db1bbba4ea714d"
  fr: "Borner le delta-V utilisable restant (0x0B0C corrigé de la branche bloquée), verrouiller l'inhibition sol, ouvrir une fiche"
- key: "scnresp:rw_bearing.0:description"
  en: "Detect RW-2 temperature anomaly"
  en_hash: "3cd6d4c01a8e4d3a"
  fr: "Détecter l'anomalie de température de RW-2"
- key: "scnresp:rw_bearing.1:description"
  en: "Identify bearing degradation on RW-2"
  en_hash: "c145520cddd7268b"
  fr: "Identifier la dégradation du roulement de RW-2"
- key: "scnresp:rw_bearing.2:description"
  en: "Disable RW-2 and command desaturation"
  en_hash: "bdecd53ff75de195"
  fr: "Désactiver RW-2 et commander la désaturation"
- key: "scnresp:scenario_2_cerise_adcs_fault.0:description"
  en: "At T+02:00 — identify the attitude disturbance at impact (body-rate/gyro signature). Note whether att_error crosses the 5 deg FDIR limit (safe_mode_aocs) given the disturbance. Log the impact event and timestamp."
  en_hash: "6264a3fc400dd4b4"
  fr: "À T+02:00 — identifier la perturbation d'attitude à l'impact (signature vitesse angulaire/gyro). Noter si att_error franchit la limite FDIR de 5 deg (safe_mode_aocs) compte tenu de la perturbation. Consigner l'événement d'impact et son horodatage."
- key: "scnresp:scenario_2_cerise_adcs_fault.1:description"
  en: "During the dwell — monitor aocs.att_error and note the reaction wheels show no mechanical anomaly (the torque-gain corruption is latent while control is inhibited in SAFE)."
  en_hash: "0aca503ee4ec27c5"
  fr: "Pendant l'attente — surveiller aocs.att_error et noter que les roues de réaction ne présentent aucune anomalie mécanique (la corruption du gain de couple reste latente tant que la commande est inhibée en SAFE)."
- key: "scnresp:scenario_2_cerise_adcs_fault.2:description"
  en: "On recovery (control re-enabled) — recognise that Y-axis pointing control is anomalously over-aggressive: the axis overshoots and oscillates about the target (pointing jitter in att_error and body-rate telemetry) instead of settling cleanly. This points to a control-law (gain) fault, not a sensor or wheel hardware failure."
  en_hash: "5c2fbf486d5e16a2"
  fr: "À la reprise (commande réactivée) — reconnaître que la commande de pointage de l'axe Y est anormalement agressive : l'axe dépasse et oscille autour de la cible (gigue de pointage dans la télémesure att_error et de vitesse angulaire) au lieu de se stabiliser proprement. Cela désigne un défaut de loi de commande (gain), et non une panne matérielle de capteur ou de roue."
- key: "scnresp:scenario_2_cerise_adcs_fault.3:description"
  en: "Dump the control-torque gain registers with AOCS_DUMP_TORQUE_GAINS (or S6 MEM_DUMP at base 0x20100000; X/Y/Z at +0/+4/+8). The Y-axis gain reads ~10x nominal while X and Z read unity — isolating the fault to the Y-axis gain register (corrupted driver electronics), not a mechanical wheel fault."
  en_hash: "cba376ebf4f3610f"
  fr: "Vider les registres de gain de couple de commande avec AOCS_DUMP_TORQUE_GAINS (ou S6 MEM_DUMP à la base 0x20100000 ; X/Y/Z à +0/+4/+8). Le gain de l'axe Y lit ~10x la valeur nominale tandis que X et Z lisent l'unité — ce qui isole le défaut dans le registre de gain de l'axe Y (électronique de commande corrompue), et non dans une panne mécanique de roue."
- key: "scnresp:scenario_2_cerise_adcs_fault.4:description"
  en: "Patch the corrupted gain: command AOCS_SET_TORQUE_GAIN_Y (PUS S6 MEM_LOAD) to restore Y to 1.0, then re-dump (AOCS_DUMP_TORQUE_GAINS) to confirm all three axes read unity before re-commanding control."
  en_hash: "8901579b03605cde"
  fr: "Corriger le gain corrompu : commander AOCS_SET_TORQUE_GAIN_Y (PUS S6 MEM_LOAD) pour ramener Y à 1.0, puis refaire un vidage (AOCS_DUMP_TORQUE_GAINS) pour confirmer que les trois axes lisent l'unité avant de commander de nouveau le contrôle d'attitude."
- key: "scnresp:scenario_2_cerise_adcs_fault.5:description"
  en: "Re-establish uplink if degraded — wait for the next AOS pass with adequate link margin (or switch to the redundant RF chain) before uplinking the gain patch."
  en_hash: "4a2ec29b546bc254"
  fr: "Rétablir la liaison montante si elle est dégradée — attendre le passage suivant (AOS) avec une marge de liaison suffisante (ou basculer sur la chaîne RF redondante) avant d'envoyer le correctif de gain."
- key: "scnresp:scenario_2_cerise_adcs_fault.6:description"
  en: "Full recovery: with the Y-axis gain verified nominal and attitude error converging, command the return to NOMINAL and confirm stable pointing on the first control step."
  en_hash: "afa5c4f630bca702"
  fr: "Reprise complète : gain de l'axe Y vérifié nominal et erreur d'attitude en convergence, commander le retour en NOMINAL et confirmer un pointage stable au premier pas de commande."
