- key: "tc:AOCS_BEGIN_ACQUISITION:description"
  en: "Start automated attitude acquisition sequence"
  en_hash: "4557acc8650507d2"
  fr: "Lancer la séquence automatique d'acquisition d'attitude"
- key: "tc:AOCS_GYRO_CALIBRATION:description"
  en: "Start (or abort) an on-board gyro bias calibration. The spacecraft averages the attitude filter's observed gyro bias over a quiet arc with the star tracker in the determination loop, then applies the result as a compensation on the gyro measurement path. Refused with a specific code if the preconditions do not hold (0x0A01 AOCS unpowered, 0x0A02 a gyro unit off, 0x0A03 no star-tracker reference, 0x0A04 body rate too high, 0x0A05 already running). Progress is aocs.gyro_cal_progress (0x02CA) and the estimate lands in aocs.gyro_cal_bias_x/y/z (0x02CB-0x02CD). NOTE the description used to read \"Reset gyro bias estimate\", and that is exactly what the on-board handler did — it zeroed a truth state and returned success without estimating anything."
  en_hash: "1165f67d13d30f2b"
  fr: "Lancer (ou abandonner) un étalonnage à bord du biais gyroscopique. Le satellite moyenne le biais gyroscopique observé par le filtre d'attitude sur un arc calme, avec le senseur stellaire dans la boucle de détermination, puis applique le résultat comme compensation sur la chaîne de mesure gyroscopique. Refusée avec un code spécifique si les préconditions ne sont pas remplies (0x0A01 AOCS non alimenté, 0x0A02 un gyroscope éteint, 0x0A03 pas de référence senseur stellaire, 0x0A04 vitesse angulaire trop élevée, 0x0A05 déjà en cours). L'avancement est donné par aocs.gyro_cal_progress (0x02CA) et l'estimation arrive dans aocs.gyro_cal_bias_x/y/z (0x02CB-0x02CD). REMARQUE : la description indiquait autrefois « Reset gyro bias estimate », et c'est exactement ce que faisait le traitement à bord — il remettait à zéro un état de vérité et renvoyait un succès sans rien estimer."
- key: "tc:AOCS_RW_RAMP_DOWN:description"
  en: "Gracefully reduce reaction wheel speed"
  en_hash: "6b8751a0ca19120a"
  fr: "Réduire progressivement la vitesse de la roue de réaction"
- key: "tc:AOCS_SET_DEADBAND:description"
  en: "Set the FINE-point control deadband (a REAL control deadband since Phase C; also writes the S5 ATTITUDE_ERROR_HIGH event threshold, preserving the historical wiring)"
  en_hash: "6b05e65c6b114161"
  fr: "Régler la bande morte de commande en pointage FINE (une VRAIE bande morte de commande depuis la Phase C ; écrit aussi le seuil de l'événement S5 ATTITUDE_ERROR_HIGH, conservant le câblage historique)"
- key: "tc:AOCS_SET_POINTING_FRAME:description"
