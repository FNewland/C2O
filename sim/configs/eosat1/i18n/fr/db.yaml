- key: "tc:SYS_SET_MISSION_PHASE:description"
  en: "Declare the mission phase. Nothing else advances the phase past 4 (LEOP): the on-board state machine only implements the automatic power-up chain 1->2->3->4 and the reboot revert to 3, so COMMISSIONING (5) and NOMINAL (6) are ground declarations and this is the telecommand that makes them.\nWHAT THE PHASE ACTUALLY GATES — the phase is not a label, it is a live interlock on six mechanisms:\n  * which subsystems tick at all (phases 0-1 tick nothing);\n  * telecommand acceptance — at phase <= 3 the OBC is running the\n    bootloader and only the bootloader command subset is accepted\n    (S17.1, S9.1, S3 beacon HK, S20.1/3, S8.1 funcs 19/20/52-57/61/\n    66/67/69, and this command);\n  * the derived spacecraft mode — sc_mode (and its telemetered copy\n    sat.mode 0x0001) is forced to SAFE at any phase < 6, so the console\n    header cannot read NOMINAL until this command has been sent;\n  * arming of the advanced fault-propagation model, which is disarmed\n    below phase 6 because during LEOP the wheels are legitimately\n    unpowered;\n  * the phase-gated legacy FDIR rules (fdir.yaml `min_phase`);\n  * the propulsion interlock — prop.yaml declares `min_phase: 6`, so\n    with the phase stuck at 4 no burn can ever be armed.\n\nGUARDS. Out-of-range (> 6) is refused with 0x0C01. Phases 0-2 are pre-separation states owned by the launch vehicle and are never ground-commandable, forced or not (0x0C02) — commanding phase 0 would stop the subsystem ticks that carry the uplink and lock the operator out. Entering an application phase (>= 4) while the OBC is running the bootloader is refused with 0x0C03; boot the application first with OBC_BOOT_APP (func 55) and the state machine advances 3->4 by itself. A BACKWARDS transition is refused with 0x0C04 unless the FORCE flag is set: a real mission does not casually go NOMINAL -> LEOP, but an operator rehearsing a regression or unwinding a premature declaration must be able to, so the answer is reject-with-reason plus an explicit opt-in, not a blanket refusal. Every accepted change raises the S5 event MISSION_PHASE_CHANGED (0x0055) carrying the from and to phases."
  en_hash: "fffb5c4c1bb55da1"
  fr: "Déclarer la phase de mission. Rien d'autre ne fait passer la phase au-delà de 4 (LEOP) : la machine d'états de bord n'implémente que l'enchaînement automatique de mise sous tension 1->2->3->4 et le retour à 3 au redémarrage ; COMMISSIONING (5) et NOMINAL (6) sont donc des déclarations sol, et c'est cette télécommande qui les effectue.\nCE QUE LA PHASE CONDITIONNE RÉELLEMENT — la phase n'est pas une étiquette, c'est un verrouillage actif sur six mécanismes :\n  * quels sous-systèmes s'exécutent (aux phases 0-1, aucun) ;\n  * l'acceptation des télécommandes — à la phase <= 3, l'OBC exécute le\n    chargeur d'amorçage et seul le sous-ensemble de commandes du chargeur est accepté\n    (S17.1, S9.1, HK balise S3, S20.1/3, S8.1 funcs 19/20/52-57/61/\n    66/67/69, et cette commande) ;\n  * le mode satellite dérivé — sc_mode (et sa copie télémesurée\n    sat.mode 0x0001) est forcé à SAFE à toute phase < 6, de sorte que l'en-tête\n    de la console ne peut afficher NOMINAL tant que cette commande n'a pas été envoyée ;\n  * l'armement du modèle avancé de propagation de défaillance, désarmé\n    sous la phase 6 parce que, pendant la LEOP, les roues sont légitimement\n    hors tension ;\n  * les règles FDIR historiques conditionnées par la phase (`min_phase` de fdir.yaml) ;\n  * le verrouillage de la propulsion — prop.yaml déclare `min_phase: 6`, donc\n    avec une phase bloquée à 4 aucune poussée ne peut jamais être armée.\n\nGARDE-FOUS. Une valeur hors plage (> 6) est refusée avec 0x0C01. Les phases 0-2 sont des états de pré-séparation gérés par le lanceur et ne sont jamais commandables depuis le sol, forcées ou non (0x0C02) — commander la phase 0 arrêterait l'exécution des sous-systèmes qui portent la liaison montante et couperait l'opérateur du satellite. L'entrée dans une phase applicative (>= 4) alors que l'OBC exécute le chargeur d'amorçage est refusée avec 0x0C03 ; amorcer d'abord l'application avec OBC_BOOT_APP (func 55), et la machine d'états passe d'elle-même de 3 à 4 (3->4). Une transition ARRIÈRE est refusée avec 0x0C04 sauf si l'indicateur FORCE est positionné : une vraie mission ne passe pas à la légère de NOMINAL à LEOP (NOMINAL -> LEOP), mais un opérateur qui répète une régression ou annule une déclaration prématurée doit pouvoir le faire ; la réponse est donc un rejet motivé plus une option explicite, et non un refus général. Chaque changement accepté émet l'événement S5 MISSION_PHASE_CHANGED (0x0055) portant les phases de départ et d'arrivée."
