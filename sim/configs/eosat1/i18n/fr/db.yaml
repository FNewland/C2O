- key: "plan:nominal_ops_day:name"
  en: "Nominal ops day (24 h)"
  en_hash: "ea723d25d712317a"
  fr: "Journée d'opérations nominales (24 h)"
- key: "plan:nominal_ops_day:description"
  en: "Routine payload day: the spacecraft sits at the LOW tier (16 kbps) for routine housekeeping, and earns the HIGH tier (128 kbps) for a stored-data dump on every third pass that clears the 10 deg elevation gate. Two daylight imaging acquisitions and a payload calibration. Every element is anchored to a real pass or a real sunlit arc at load time."
  en_hash: "65249b6144e16941"
  fr: "Journée charge utile de routine : le satellite reste au palier LOW (16 kbps) pour la HK de routine, et obtient le palier HIGH (128 kbps) pour un vidage des données stockées un passage sur trois parmi ceux qui franchissent le seuil d'élévation de 10 deg. Deux acquisitions de jour et un étalonnage de la charge utile. Chaque élément est ancré sur un passage réel ou un arc éclairé réel au chargement."
- key: "plan:downlink_catchup:name"
  en: "Downlink catch-up"
  en_hash: "dd54f9fb484089c3"
  fr: "Rattrapage de liaison descendante"
- key: "plan:downlink_catchup:description"
  en: "Storage-recovery plan: a dump on each of the next eight passes that can hold the HIGH tier, and no new acquisitions. Use when the data budget shows a growing backlog."
  en_hash: "e703d542ee3a01ae"
  fr: "Plan de récupération du stockage : un vidage à chacun des huit prochains passages capables de tenir le palier HIGH, et aucune nouvelle acquisition. À utiliser lorsque le bilan de données montre un arriéré croissant."
- key: "plan:payload_checkout:name"
  en: "Payload checkout"
  en_hash: "f8aacf65d2b5410d"
  fr: "Vérification de la charge utile"
- key: "plan:payload_checkout:description"
  en: "Commissioning-style checkout: HK collection, calibration, one imaging acquisition, then a dump on the next pass to retrieve the product."
  en_hash: "34b076ebd2d7231b"
  fr: "Vérification de type recette : collecte HK, étalonnage, une acquisition, puis un vidage au passage suivant pour récupérer le produit."
