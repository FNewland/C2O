  en_hash: "e3042811202e61f5"
  fr: "ALERTE DE CONJONCTION : seuil Pc rouge. Le FD ordonne une CAM prograde de 0.20 m/s pendant ce passage selon NOM-004/NOM-013. Surveiller le bilan de puissance."
- key: "scnevt:prop_slow_leak.1:params.text"
