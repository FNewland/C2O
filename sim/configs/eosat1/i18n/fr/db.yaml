- key: "fdirstep:aocs_reset.6:description"
  en: "Enter DETUMBLE — with every wheel disabled the magnetorquers are the only actuator left, and DETUMBLE is the magnetic-only rate damper. (Unlike safe_mode_entry / emergency_power_down, mode 2 IS the right target HERE, because steps 2-5 have just removed the wheels this procedure exists to cycle. Those two files commanded mode 2 with the wheels healthy, which threw away the solar-array geometry for nothing; they now command 0x03 COARSE_SUN.)"
  en_hash: "80d9666523e11ff0"
  fr: "Passer en DETUMBLE — toutes les roues étant désactivées, les magnétocoupleurs sont le seul actionneur restant, et DETUMBLE est l'amortisseur de vitesses purement magnétique. (Contrairement à safe_mode_entry / emergency_power_down, le mode 2 EST la bonne cible ICI, car les étapes 2-5 viennent de retirer les roues que cette procédure a pour objet de redémarrer. Ces deux fichiers commandaient le mode 2 avec des roues saines, ce qui sacrifiait inutilement la géométrie du générateur solaire ; ils commandent désormais 0x03 COARSE_SUN.)"
