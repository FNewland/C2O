  en_hash: "ce322f0d9b38ae91"
  fr: "Sélectionner le mode de démarrage du récepteur GPS (froid/tiède/chaud). Définit le profil de temps de première solution utilisé après la mise sous tension du récepteur GPS."
- key: "tc:PROP_SET_BURN:description"
  en: "Load a manoeuvre: delta-V magnitude, direction and cut-off mode. The sim publishes the predicted burn duration (0x0B10) for FDS cross-check before arming. Must precede PROP_ARM by <= 300 s."
  en_hash: "e38f2a8c45778f8c"
  fr: "Charger une manœuvre : norme du delta-V, direction et mode de coupure. La simulation publie la durée de poussée prévue (0x0B10) pour recoupement par le FDS avant armement. Doit précéder PROP_ARM de <= 300 s."
- key: "tc:PROP_ARM:description"
  en: "Arm the propulsion system (two-step: requires PROP_SET_BURN within 300 s and the arm code). Runs all interlocks — catbed >= 180 C, tank pressure band, propellant, AOCS mode/att error, SoC, phase, eclipse, valves; each failure returns a distinct S1(8) code and its bit in 0x0B15."
  en_hash: "f2a80847e92c4ad6"
  fr: "Armer le système propulsif (en deux temps : exige PROP_SET_BURN dans les 300 s et le code d'armement). Exécute tous les verrouillages — lit catalytique >= 180 C, plage de pression réservoir, ergol, mode AOCS/erreur d'attitude, SoC, phase, éclipse, vannes ; chaque échec renvoie un code S1(8) distinct et son bit dans 0x0B15."
- key: "tc:PROP_DISARM:description"
  en: "ARMED -> SAFED; closes the flow-control valve, leaves latch valves"
  en_hash: "61be766b947bbd63"
  fr: "ARMED -> SAFED ; ferme la vanne de régulation, laisse les vannes à verrouillage en l'état"
- key: "tc:PROP_EXECUTE:description"
  en: "ARMED -> FIRING. Rejected (S1.8) when not ARMED. Normally delivered by the S11 time-tagged schedule (NOM-004 step 3)."
  en_hash: "67355a074c4e4bee"
  fr: "ARMED -> FIRING. Rejetée (S1.8) hors de l'état ARMED. Normalement délivrée par le planning daté S11 (NOM-004 étape 3)."
- key: "tc:PROP_ABORT:description"
  en: "FIRING -> SAFED immediately; closes the FCV and latches abort_reason (0x0B14). Partial delta-V already delivered still perturbs the orbit."
  en_hash: "41f8708247567e71"
  fr: "FIRING -> SAFED immédiatement ; ferme la FCV et verrouille abort_reason (0x0B14). Le delta-V partiel déjà fourni perturbe tout de même l'orbite."
- key: "tc:PROP_ISO_OPEN:description"
  en: "Open latch-valve branch(es)"
  en_hash: "4742ead89d4dd550"
  fr: "Ouvrir la ou les branches de vannes à verrouillage"
- key: "tc:PROP_ISO_CLOSE:description"
  en: "Close latch-valve branch(es) — CTG-028 step 2 isolates 'both branches' (branch=2)"
  en_hash: "21ada5a21acc0cb8"
  fr: "Fermer la ou les branches de vannes à verrouillage — l'étape 2 de CTG-028 isole « les deux branches » (branch=2)"
- key: "tc:PROP_SET_LIMITS:description"
  en: "Reconfigure the on-board burn-abort thresholds (also the FDIR configuration hook)"
  en_hash: "b442f51546e651ff"
  fr: "Reconfigurer les seuils d'abandon de poussée à bord (sert aussi de point d'accroche de configuration FDIR)"
- key: "tc:PROP_INHIBIT_SET:description"
  en: "Ground-latched propulsion inhibit (the deployer 'independent inhibits' lesson)"
  en_hash: "3a0770181b526432"
  fr: "Inhibition de la propulsion verrouillée par le sol (la leçon des « inhibitions indépendantes » du déployeur)"
- key: "tc:PROP_INHIBIT_CLR:description"
  en: "Clear both the ground inhibit and an FDIR/double-abort latched inhibit (INHIBIT(3) -> SAFED)"
  en_hash: "3e31c7e8db7e7ce1"
  fr: "Lever à la fois l'inhibition sol et une inhibition verrouillée par la FDIR/un double abandon (INHIBIT(3) -> SAFED)"
- key: "tc:PROP_GET_STATUS:description"
  en: "On-demand propulsion status report -> TM(8,2): state, tank pressure, propellant, catbed, dv remaining, inhibit mask, abort reason"
  en_hash: "c7776150587a33eb"
  fr: "Rapport d'état de la propulsion à la demande -> TM(8,2) : état, pression réservoir, ergol, lit catalytique, dv restant, masque d'inhibition, raison d'abandon"
- key: "tc:EPS_PAYLOAD_MODE:description"
  en: "Set payload power mode"
  en_hash: "ebdfdb0d2b6cf4f8"
  fr: "Régler le mode d'alimentation de la charge utile"
