  fr: "Désactiver le TX"
- key: "fdirstep:ttc_emergency_shutdown.1:description"
  en: "Disable the S-band power amplifier (TTC_PA_OFF)"
  en_hash: "0618f22bfeb9edb5"
  fr: "Désactiver l'amplificateur de puissance bande S (TTC_PA_OFF)"
- key: "fdirstep:ttc_emergency_shutdown.2:name"
  en: "Select Primary Transponder"
  en_hash: "89d0c6812fca4a98"
  fr: "Sélectionner le transpondeur principal"
- key: "fdirstep:ttc_emergency_shutdown.2:description"
  en: "Select the primary transponder. This SWITCHES the active unit; it does not power one off. With the PA already disabled by step 1 the chain is silent either way, and starting recovery from a known unit is the point."
  en_hash: "1433b3e8a21f3675"
  fr: "Sélectionner le transpondeur principal. Cette commande BASCULE l'unité active ; elle n'en met aucune hors tension. Le PA étant déjà désactivé par l'étape 1, la chaîne est silencieuse dans les deux cas, et l'intérêt est de démarrer la reprise depuis une unité connue."
- key: "fdirstep:ttc_emergency_shutdown.3:name"
  en: "Select Redundant Transponder"
  en_hash: "e923d3454057a0d5"
  fr: "Sélectionner le transpondeur redondant"
- key: "fdirstep:ttc_emergency_shutdown.3:description"
  en: "Fall through to the redundant transponder. Its receiver stays live on the non-switchable ttc_rx line, so the spacecraft remains commandable after this card runs — and the UHF beacon transmitter is untouched by every step above, so HK SID 11 keeps arriving and the ground can SEE that the shutdown happened rather than inferring it from silence."
  en_hash: "f841c57d7047b5f9"
  fr: "Passer ensuite sur le transpondeur redondant. Son récepteur reste actif sur la ligne non commutable ttc_rx, si bien que le satellite reste commandable après l'exécution de cette fiche — et l'émetteur de la balise UHF n'est touché par aucune des étapes ci-dessus : le SID HK 11 continue d'arriver et le sol peut CONSTATER que l'arrêt a eu lieu au lieu de le déduire du silence."
- key: "fdirstep:ttc_reduce_power.1:name"
