- key: "tm:aocs.fine_ready:description"
  en: "FINE-entry precondition bitmask (0 = ready): bit0 ST<5 stars, bit1 <3 wheels (a 3-of-4 pyramid still spans R^3 and flies FINE degraded — see aocs.fine_degraded 0x0299; two wheels cannot), bit2 MEKF unconverged, bit3 rates high, bit4 momentum >70%, bit5 propagate-only, bit6 slew not idle 60s"
  en_hash: "894c46c9aa72bffd"
  fr: "Masque des préconditions d'entrée en FINE (0 = prêt) : bit0 ST<5 étoiles, bit1 <3 roues (une pyramide 3 sur 4 couvre encore R^3 et vole en FINE dégradé — voir aocs.fine_degraded 0x0299 ; deux roues ne suffisent pas), bit2 MEKF non convergé, bit3 vitesses élevées, bit4 moment cinétique >70 %, bit5 propagation seule, bit6 basculement non inactif depuis 60s"
- key: "tm:aocs.fidelity_mode:description"
  en: "0=full physics, 1=secular (accel bypass >60x)"
  en_hash: "35c201d460ef890c"
  fr: "0=physique complète, 1=séculaire (contournement en accéléré >60x)"
- key: "tm:aocs.geoloc_err_m:description"
  en: "Altitude x total pointing error — ground geolocation error"
  en_hash: "043e0aff36845d3e"
  fr: "Altitude x erreur de pointage totale — erreur de géolocalisation au sol"
- key: "tm:aocs.power_w:description"
  en: "AOCS suite power draw by mode (COARSE 4 / NOMINAL 9 / FINE 15 W); EPS bills the aocs_wheels line from this"
  en_hash: "09f9f568f3624abe"
  fr: "Consommation de la chaîne AOCS selon le mode (COARSE 4 / NOMINAL 9 / FINE 15 W) ; l'EPS impute la ligne aocs_wheels à partir de cette valeur"
- key: "tm:aocs.gyro_units_on:description"
  en: "Number of gyro units powered (S2 devices 0x0206-0x0208). 0 = the MEKF has no rate reference and coasts on CSS+MAG only"
  en_hash: "ea8329b181ac173c"
  fr: "Nombre de gyroscopes alimentés (équipements S2 0x0206-0x0208). 0 = le MEKF n'a aucune référence de vitesse et se contente de CSS+MAG"
- key: "tm:aocs.gyro_saturated:description"
  en: "1 = at least one gyro channel is at its measurement-range limit (rate knowledge lost on that axis)"
  en_hash: "5651cb5658d9f194"
  fr: "1 = au moins une voie gyroscopique est en butée de gamme de mesure (connaissance de la vitesse perdue sur cet axe)"
- key: "tm:aocs.gyro_bias_injected:description"
  en: "Magnitude of the injected gyro-bias fault (instructor visibility; 0 in a healthy spacecraft)"
  en_hash: "58b23374bb72caf6"
  fr: "Amplitude du défaut de biais gyroscopique injecté (visibilité instructeur ; 0 sur un satellite sain)"
- key: "tm:aocs.commanded_mode:description"
  en: "Operational mode last commanded from ground. Every transient and every automatic demotion resolves its return path against this"
  en_hash: "cca5e3d32a2e0b20"
  fr: "Mode opérationnel commandé en dernier par le sol. Chaque transitoire et chaque rétrogradation automatique résout son chemin de retour par rapport à ce mode"
- key: "tm:aocs.mode_demoted:description"
  en: "1 = the spacecraft is NOT in its commanded mode (transient or automatic demotion in progress)"
  en_hash: "bdd6730c56c9eca3"
  fr: "1 = le satellite N'EST PAS dans son mode commandé (transitoire ou rétrogradation automatique en cours)"
- key: "tm:aocs.fine_degraded:description"
  en: "1 = FINE_POINT is running on a degraded 3-wheel set (permitted per R3, relaxed jitter/deadband spec)"
  en_hash: "502ce84c89c27adf"
  fr: "1 = FINE_POINT fonctionne sur un jeu dégradé de 3 roues (autorisé selon R3, spécifications de gigue/bande morte assouplies)"
- key: "tm:aocs.desat_inhibit:description"
  en: "1 = momentum dumps are inhibited (operator latch, or asserted automatically while the payload is imaging)"
  en_hash: "2368b4cbb734f245"
  fr: "1 = déchargements du moment cinétique inhibés (verrou opérateur, ou activé automatiquement pendant la prise de vue)"
- key: "tm:aocs.h_body_nms:description"
  en: "Magnitude of the stored BODY momentum |A.h_wheel| — the quantity a magnetic dump actually removes"
  en_hash: "9294abf93ceda714"
  fr: "Norme du moment cinétique STOCKÉ en repère satellite |A.h_wheel| — la grandeur qu'un déchargement magnétique retire réellement"
- key: "tm:aocs.desat_ineffective:description"
  en: "1 = the last desaturation timed out without converging (see event AOCS_DESAT_INEFFECTIVE 0x020E)"
  en_hash: "080aa45ac8005b64"
  fr: "1 = la dernière désaturation a expiré sans converger (voir l'événement AOCS_DESAT_INEFFECTIVE 0x020E)"
- key: "tm:aocs.wheels_commissioned:description"
  en: "Latched 1 once >=3 wheels have been simultaneously enabled; cleared by an AOCS power-down. Lets FDIR tell a double wheel failure apart from an uncommissioned bus"
  en_hash: "b536635f64ac829a"
  fr: "Verrouillé à 1 dès que >=3 roues ont été activées simultanément ; remis à zéro par une mise hors tension de l'AOCS. Permet à la FDIR de distinguer une double panne de roue d'un bus non recetté"
- key: "tm:aocs.gyro_cal_state:description"
  en: "Gyro bias calibration state: 0=IDLE, 1=RUNNING, 2=COMPLETE, 3=ABORTED"
  en_hash: "05e5e94f9f7836c1"
  fr: "État de l'étalonnage du biais gyroscopique : 0=IDLE, 1=RUNNING, 2=COMPLETE, 3=ABORTED"
- key: "tm:aocs.gyro_cal_progress:description"
  en: "Gyro bias calibration progress through the averaging arc (0-100)"
  en_hash: "f505ad5c15b256f0"
  fr: "Avancement de l'étalonnage du biais gyroscopique sur l'arc de moyennage (0-100)"
- key: "tm:aocs.gyro_cal_bias_x:description"
  en: "Bias estimated by the LAST completed gyro calibration, X body axis. Compare against aocs.gyro_bias_injected (0x0296) when an instructor has injected a gyro_bias fault"
  en_hash: "d327fcf8bf324f06"
  fr: "Biais estimé par le DERNIER étalonnage gyroscopique achevé, axe X satellite. À comparer avec aocs.gyro_bias_injected (0x0296) lorsqu'un instructeur a injecté un défaut gyro_bias"
- key: "tm:aocs.gyro_cal_bias_y:description"
  en: "Bias estimated by the last completed gyro calibration, Y body axis"
  en_hash: "7f4d99bc61bb4da3"
  fr: "Biais estimé par le dernier étalonnage gyroscopique achevé, axe Y satellite"
- key: "tm:aocs.gyro_cal_bias_z:description"
  en: "Bias estimated by the last completed gyro calibration, Z body axis"
  en_hash: "c6b55c387bb77c05"
  fr: "Biais estimé par le dernier étalonnage gyroscopique achevé, axe Z satellite"
- key: "tm:aocs.gyro_cal_comp_mag:description"
  en: "Magnitude of the gyro bias compensation currently applied on board. Non-zero after a successful calibration; the HARDWARE bias (0x0296) is unchanged — calibration compensates the fault, it does not repair it"
  en_hash: "a605566347fed661"
  fr: "Amplitude de la compensation de biais gyroscopique appliquée à bord. Non nulle après un étalonnage réussi ; le biais MATÉRIEL (0x0296) est inchangé — l'étalonnage compense le défaut, il ne le répare pas"
- key: "tm:aocs.gyro_cal_result:description"
  en: "Outcome of the last gyro calibration attempt: 0=never run, 1=SUCCESS, 2=FAILED/ABORTED"
  en_hash: "3fb77019b8cf72c7"
  fr: "Résultat de la dernière tentative d'étalonnage gyroscopique : 0=jamais exécuté, 1=SUCCESS, 2=FAILED/ABORTED"
- key: "tm:aocs.gyro_cal_reject:description"
  en: "Failure code of the last gyro-calibration refusal or abort (0 = none). 0x0A01 unpowered, 0x0A02 a gyro unit off, 0x0A03 no star-tracker reference, 0x0A04 rate too high, 0x0A05 already running, 0x0A06 preconditions lost mid-run, 0x0A07 abort with nothing running"
  en_hash: "e2c4436fa6ab0fa2"
  fr: "Code d'échec du dernier refus ou abandon d'étalonnage gyroscopique (0 = aucun). 0x0A01 non alimenté, 0x0A02 un gyroscope éteint, 0x0A03 pas de référence senseur stellaire, 0x0A04 vitesse trop élevée, 0x0A05 déjà en cours, 0x0A06 préconditions perdues en cours d'exécution, 0x0A07 abandon sans exécution en cours"
- key: "tm:aocs.gyro_units_mask:description"
  en: "Per-unit gyro power state as a bitmask: bit0 = X unit (S2 device 0x0206), bit1 = Y (0x0207), bit2 = Z (0x0208). 0x07 = all three on. Tells the operator WHICH unit is off, which the 0x0294 count cannot"
  en_hash: "7af0a5751c8a739b"
  fr: "État d'alimentation de chaque gyroscope sous forme de masque : bit0 = gyroscope X (équipement S2 0x0206), bit1 = Y (0x0207), bit2 = Z (0x0208). 0x07 = les trois en marche. Indique à l'opérateur QUEL gyroscope est éteint, ce que le compte 0x0294 ne permet pas"
- key: "tm:aocs.gyro_bias_resid:description"
  en: "Magnitude of the bias still present at the gyro output after on-board compensation. This is what drives GYRO_BIAS_HIGH (0x020B); a successful calibration drives it to zero even while the injected hardware fault persists"
  en_hash: "1b58b4cca7e10f9e"
