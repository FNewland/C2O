  en: "Enable/disable transponder TX"
  en_hash: "c31c57ea0f5fed1f"
  fr: "Activer/désactiver l'émission (TX) du transpondeur"
- key: "tc:EPS_POWER_ON:description"
  en: "Switch power line ON"
  en_hash: "cab806282127e0f2"
  fr: "Mettre une ligne d'alimentation sur ON"
- key: "tc:EPS_POWER_OFF:description"
  en: "Switch power line OFF"
  en_hash: "5149cc55407b3473"
  fr: "Mettre une ligne d'alimentation sur OFF"
- key: "tc:EPS_RESET_OC_FLAG:description"
  en: "Reset overcurrent trip flag and re-enable line"
  en_hash: "7ffe8871bff2ef32"
  fr: "Réarmer l'indicateur de disjonction sur surintensité et réactiver la ligne"
- key: "tc:EPS_SWITCH_LOAD:description"
  en: "Switch individual power load on/off"
  en_hash: "4ad2ad9f3d5127b4"
  fr: "Commuter une charge électrique individuelle (marche/arrêt)"
- key: "tc:EPS_SET_CHARGE_RATE:description"
  en: "Override battery charge rate"
  en_hash: "4a4c8d7dd0b22432"
  fr: "Forcer le régime de charge batterie"
- key: "tc:EPS_SOLAR_ARRAY_DRIVE:description"
  en: "Set the frozen solar array drive angle. Phase B: load-bearing — with SADA tracking active the drive follows the sun automatically and this sets the park angle used if tracking stops; with tracking off the wings generate per the commanded angle (0 = legacy +Y orientation)."
  en_hash: "29aee52208d510e5"
  fr: "Régler l'angle figé d'entraînement du générateur solaire. Phase B : déterminant — avec la poursuite SADA active, l'entraînement suit automatiquement le Soleil et cette valeur fixe l'angle de parcage utilisé si la poursuite s'arrête ; sans poursuite, les ailes produisent selon l'angle commandé (0 = orientation +Y historique)."
- key: "tc:EPS_EMERGENCY_LOAD_SHED:description"
  en: "Immediate load shedding to specified stage"
  en_hash: "b0a183433198b67f"
  fr: "Délestage immédiat jusqu'au niveau spécifié"
- key: "tc:PAYLOAD_SET_MODE:description"
  en: "Set payload mode. Modes 1 (STANDBY), 2 (IMAGING) and 3 (CALIBRATION) all request the FPA cooler; mode 0 releases it. The request now drives BOTH the TCS cooler flag and the EPS `fpa_cooler` power line (2026-08b PL-a) — previously this path set a flag against a dark line and the detector never cooled, so FPA READY (0x0610) stayed NO forever with no error."
  en_hash: "d2e4e72d97b4c663"
  fr: "Régler le mode de la charge utile. Les modes 1 (STANDBY), 2 (IMAGING) et 3 (CALIBRATION) demandent tous le refroidisseur FPA ; le mode 0 le libère. La demande commande désormais À LA FOIS l'indicateur de refroidisseur du TCS et la ligne d'alimentation EPS `fpa_cooler` (2026-08b PL-a) — auparavant, ce chemin positionnait un indicateur sur une ligne non alimentée et le détecteur ne refroidissait jamais, si bien que FPA READY (0x0610) restait à NO indéfiniment sans aucune erreur."
- key: "tc:PAYLOAD_SET_SCENE:description"
  en: "DEPRECATED — pre-set the next scene id. Superseded by PAYLOAD_CAPTURE's own scene_id argument, which overrides this value at capture time; retained for backward compatibility only."
  en_hash: "337caf40312ce140"
  fr: "OBSOLÈTE — prérégler l'identifiant de la prochaine scène. Remplacée par l'argument scene_id propre à PAYLOAD_CAPTURE, qui écrase cette valeur au moment de la prise de vue ; conservée uniquement pour compatibilité ascendante."
- key: "tc:PAYLOAD_CAPTURE:description"
  en: "Trigger one image acquisition. The WHERE is set by the WHEN: schedule this TC with S11.4 at the target overpass. Geolocation is stamped on board from the propagated sub-satellite point at shutter open and returned in the image catalogue — it is not an argument."
  en_hash: "4635b93d29c01572"
  fr: "Déclencher une acquisition d'image. Le OÙ est fixé par le QUAND : programmer cette TC avec S11.4 au survol de la cible. La géolocalisation est apposée à bord à partir du point subsatellite propagé à l'ouverture de l'obturateur et renvoyée dans le catalogue d'images — ce n'est pas un argument."
- key: "tc:PAYLOAD_DOWNLOAD_IMAGE:description"
  en: "Report one stored image product. 2026-08b PL-c: the handler called the model and threw the result away, so no image metadata ever reached the ground on this func. It now answers with a TM(8,2) 20-octet product summary (same layout as PAYLOAD_GET_IMAGE_CATALOG's entries), or an S1.8 refusal if the scene is not in the catalogue."
  en_hash: "5bea9e88b3fe065d"
  fr: "Rapporter un produit image stocké. 2026-08b PL-c : le traitement appelait le modèle et jetait le résultat, si bien qu'aucune métadonnée d'image n'atteignait jamais le sol par cette fonction. Il répond désormais par un résumé de produit TM(8,2) de 20 octets (même format que les entrées de PAYLOAD_GET_IMAGE_CATALOG), ou par un refus S1.8 si la scène n'est pas au catalogue."
- key: "tc:PAYLOAD_DELETE_IMAGE:description"
  en: "Delete specific image from payload memory"
  en_hash: "0facc3a87079aae4"
  fr: "Supprimer une image donnée de la mémoire de la charge utile"
- key: "tc:PAYLOAD_MARK_BAD_SEGMENT:description"
  en: "Mark memory segment as unusable"
  en_hash: "2e6f14d5db01b074"
  fr: "Marquer un segment mémoire comme inutilisable"
- key: "tc:PAYLOAD_GET_IMAGE_CATALOG:description"
  en: "Request the stored image catalogue. 2026-08b PL-c: this now RETURNS something. The handler called the model and discarded the result, so the one command whose entire purpose is to tell the ground what is on board produced no telemetry at all.\nTM(8,2) reply, built like PROP_GET_STATUS (func 118): shown(2) + held(2) + product_mb x100 (4) + free_mb x100 (4), followed by `shown` 20-octet product summaries of scene_id(2) lat(4, 1e-4 deg) lon(4, 1e-4 deg) size_kb(4) lines(2) quality(1, %) status(1, 0=OK/1=PARTIAL/2=CORRUPT) flags(1) segment(1). flags bit 0 = the strip was flown on a 3-wheel (degraded) FINE set, bit 1 = a product checksum has been computed. At most 32 summaries per report; `held` is the true count."
  en_hash: "bf63083e9e3a6b50"
  fr: "Demander le catalogue des images stockées. 2026-08b PL-c : cette commande RENVOIE désormais quelque chose. Le traitement appelait le modèle et ignorait le résultat, si bien que la seule commande dont tout l'objet est d'indiquer au sol ce qui est à bord ne produisait aucune télémesure.\nRéponse TM(8,2), construite comme PROP_GET_STATUS (func 118) : shown(2) + held(2) + product_mb x100 (4) + free_mb x100 (4), suivis de `shown` résumés de produit de 20 octets : scene_id(2) lat(4, 1e-4 deg) lon(4, 1e-4 deg) size_kb(4) lines(2) quality(1, %) status(1, 0=OK/1=PARTIAL/2=CORRUPT) flags(1) segment(1). flags bit 0 = la bande a été acquise avec un jeu FINE à 3 roues (dégradé), bit 1 = une somme de contrôle du produit a été calculée. Au plus 32 résumés par rapport ; `held` est le nombre réel."
- key: "tc:PAYLOAD_SET_BAND_CONFIG:description"
  en: "Set spectral band enable mask"
  en_hash: "f4d61de01992b5fc"
  fr: "Régler le masque d'activation des bandes spectrales"
- key: "tc:PAYLOAD_SET_INTEGRATION_TIME:description"
  en: "Set per-band detector integration times. Fixed point, 0.01 ms/LSB (was 4x float32 = 16 argument octets; now 8). Longer integration raises band SNR ~3 dB per doubling."
  en_hash: "cd7a6e2ee2ccdef9"
  fr: "Régler les temps d'intégration du détecteur par bande. Virgule fixe, 0.01 ms/LSB (auparavant 4x float32 = 16 octets d'arguments ; désormais 8). Une intégration plus longue augmente le RSB de la bande d'environ 3 dB par doublement."
- key: "tc:PAYLOAD_SET_GAIN:description"
  en: "Set detector gain. Fixed point, 0.001x/LSB (was float32). Gain raises reported SNR ~1.5 dB per doubling until saturation."
  en_hash: "7698b0e7d656d271"
  fr: "Régler le gain du détecteur. Virgule fixe, 0.001x/LSB (auparavant float32). Le gain augmente le RSB rapporté d'environ 1.5 dB par doublement jusqu'à saturation."
- key: "tc:PAYLOAD_COOLER_SETPOINT:description"
  en: "Set the FPA thermo-electric cooler regulation setpoint (drives the TCS-owned FPA node). Encoded as unsigned CENTI-KELVIN so a negative Celsius value never requires a two's-complement raw: raw = round((T_degC + 273.15) x 100). -15.00 degC -> 25815 = 0x64D7."
  en_hash: "5486bbc035ea8361"
  fr: "Régler la consigne de régulation du refroidisseur thermoélectrique du FPA (pilote le nœud FPA géré par le TCS). Codée en CENTI-KELVIN non signés afin qu'une valeur Celsius négative n'exige jamais une valeur brute en complément à deux : raw = round((T_degC + 273.15) x 100). -15.00 degC -> 25815 = 0x64D7."
- key: "tc:PAYLOAD_START_CALIBRATION:description"
  en: "Begin a radiometric calibration sequence (dark frame / flat field / both).\nPRECONDITIONS (2026-08b PL-d — the gate is on the OPTICS, not on a mode word; the old rule was \"must be in IMAGING mode\", which required the shutter to be open onto the scene before a dark frame could be asked for). Refused with S1.8 unless:\n\n  * payload mode is 1 STANDBY or 3 CALIBRATION — never 0 OFF and never\n    2 IMAGING (error 0x0024);\n  * the FPA is thermally ready, 0x0610 == 1 (0x0025) — dark current\n    roughly doubles every 6-8 K, so coefficients taken off setpoint\n    describe a different detector;\n  * DARK and BOTH: shutter CLOSED, 0x063C == 0 (0x0026) and the\n    calibration lamp OFF, 0x0615 == 0 (0x0027);\n  * FLAT: shutter OPEN and lamp ON;\n  * the devices involved are powered — FPA 0x0600, shutter 0x0603, and\n    the lamp 0x0602 for FLAT/BOTH (0x0007).\n\nA BOTH run starts in the dark configuration and the on-board sequencer opens the shutter and lights the lamp itself at the DARK -> FLAT transition; no ground step can land between two phases 15 s apart. Changing the optics under a running sequence ABORTS it (event 0x0612, reason at 0x0645) rather than completing over invalid frames.\nCompletion sets the per-band coefficients; 0x0646 cal_valid_mask marks the bands that now have BOTH a bias and a gain, so a DARK run completes an earlier FLAT run and vice versa."
  en_hash: "86ebdf3aa27e928b"
  fr: "Lancer une séquence d'étalonnage radiométrique (image d'obscurité / champ plat / les deux).\nPRÉCONDITIONS (2026-08b PL-d — la condition porte sur l'OPTIQUE, pas sur un mot de mode ; l'ancienne règle était « doit être en mode IMAGING », ce qui exigeait que l'obturateur soit ouvert sur la scène avant de pouvoir demander une image d'obscurité). Refusée avec S1.8 sauf si :\n\n  * le mode de la charge utile est 1 STANDBY ou 3 CALIBRATION — jamais 0 OFF ni\n    2 IMAGING (erreur 0x0024) ;\n  * le FPA est thermiquement prêt, 0x0610 == 1 (0x0025) — le courant d'obscurité\n    double environ tous les 6-8 K, donc des coefficients pris hors consigne\n    décrivent un autre détecteur ;\n  * DARK et BOTH : obturateur CLOSED, 0x063C == 0 (0x0026) et la\n    lampe d'étalonnage OFF, 0x0615 == 0 (0x0027) ;\n  * FLAT : obturateur OPEN et lampe ON ;\n  * les équipements concernés sont alimentés — FPA 0x0600, obturateur 0x0603, et\n    la lampe 0x0602 pour FLAT/BOTH (0x0007).\n\nUne exécution BOTH démarre dans la configuration d'obscurité et le séquenceur de bord ouvre lui-même l'obturateur et allume la lampe à la transition DARK -> FLAT ; aucune action sol ne peut s'intercaler entre deux phases espacées de 15 s. Modifier l'optique pendant une séquence en cours l'ABANDONNE (événement 0x0612, raison en 0x0645) au lieu de l'achever sur des trames invalides.\nL'achèvement fixe les coefficients par bande ; 0x0646 cal_valid_mask marque les bandes qui disposent désormais À LA FOIS d'un biais et d'un gain, de sorte qu'une exécution DARK complète une exécution FLAT antérieure et inversement."
- key: "tc:PAYLOAD_STOP_CALIBRATION:description"
  en: "Abort calibration sequence"
  en_hash: "045892f2357e46d2"
  fr: "Abandonner la séquence d'étalonnage"
- key: "tc:PAYLOAD_SET_COMPRESSION:description"
  en: "Select compression algorithm and ratio override (was a single float32 ratio; the algorithm octet was previously unreachable over the wire)."
  en_hash: "89e01e82493658a4"
  fr: "Sélectionner l'algorithme de compression et forcer le taux (auparavant un seul taux float32 ; l'octet d'algorithme était jusque-là inaccessible par la liaison)."
- key: "tc:PAYLOAD_SELECT_FILTER:description"
  en: "Rotate the filter wheel to a position (2 s per 90 deg step)"
  en_hash: "0d241be0da5a5483"
  fr: "Faire tourner la roue à filtres jusqu'à une position (2 s par pas de 90 deg)"
- key: "tc:PAYLOAD_CYCLE_SHUTTER:description"
  en: "Run a shutter mechanism EXERCISE. This is a mechanism health test, not a way to reach a position — use PAYLOAD_SET_SHUTTER (func 119) for that.\n2026-08b PL-d: `cycles` counts TRANSITIONS of the blade, one per model tick, and the mechanism is driven entirely by the model. Previously the command handler toggled once AND the tick toggled once per remaining count, so cycles=1 moved the blade twice, the shutter always ended where it started, and the shutter could never be commanded closed at all."
  en_hash: "8ea7d7e947dfbac5"
  fr: "Exécuter un EXERCICE du mécanisme d'obturateur. Il s'agit d'un test de santé du mécanisme, pas d'un moyen d'atteindre une position — utiliser pour cela PAYLOAD_SET_SHUTTER (func 119).\n2026-08b PL-d : `cycles` compte les TRANSITIONS du volet, une par pas du modèle, et le mécanisme est entièrement piloté par le modèle. Auparavant, le traitement de la commande basculait une fois ET le pas basculait une fois par unité restante, si bien que cycles=1 déplaçait le volet deux fois, que l'obturateur finissait toujours là où il avait commencé, et qu'il était impossible de commander sa fermeture."
- key: "tc:PAYLOAD_SET_SHUTTER:description"
  en: "Drive the shutter to an ABSOLUTE position.\n2026-08b PL-d: there was no absolute shutter command anywhere in this catalogue — PAYLOAD_CYCLE_SHUTTER was the only shutter TC, and a relative toggle cannot reach a KNOWN state. That is what COM-011 step 2 (\"cycle to CLOSED, verify 0x063C == 0 within 10 s\") needs, what a dark frame needs, and what PAYLOAD_CAPTURE now checks before acquiring.\nIdempotent: commanding CLOSED twice leaves it CLOSED. Refused (0x0007) when the shutter mechanism device 0x0603 is unpowered, and (0x0005) while a PAYLOAD_CYCLE_SHUTTER exercise is running."
  en_hash: "9993a45cb69291c5"
  fr: "Amener l'obturateur à une position ABSOLUE.\n2026-08b PL-d : il n'existait aucune commande d'obturateur absolue dans ce catalogue — PAYLOAD_CYCLE_SHUTTER était la seule TC d'obturateur, et un basculement relatif ne peut pas atteindre un état CONNU. C'est ce dont a besoin l'étape 2 de COM-011 (« cycle to CLOSED, verify 0x063C == 0 within 10 s »), ce dont a besoin une image d'obscurité, et ce que PAYLOAD_CAPTURE vérifie désormais avant l'acquisition.\nIdempotente : commander CLOSED deux fois le laisse CLOSED. Refusée (0x0007) lorsque l'équipement mécanisme d'obturateur 0x0603 n'est pas alimenté, et (0x0005) pendant un exercice PAYLOAD_CYCLE_SHUTTER en cours."
- key: "tc:PAYLOAD_INITIATE_TRANSFER:description"
  en: "Start the on-board image transfer engine for a stored scene — the bridge to the S13_CREATE_TRANSFER ground workflow (textbook section 6.7).\n2026-08b PL-c: raises event 0x0610 TRANSFER_START (promised by a source comment and previously emitted by nothing) and answers with a TM(8,2) report of scene_id(2) + bytes_total(4) + blocks(4) + crc32(4) — the three numbers the ground needs to plan and verify a dump, all of which used to be computed on board and then dropped. The transfer drains at the ACTIVE TM information rate (0x0506) and only while the downlink is up (0x0501), not at the old hard-coded 10 Mbps: it stalls at loss of signal and resumes on the next pass."
  en_hash: "d902f198ec7f26d2"
  fr: "Lancer le moteur de transfert d'images de bord pour une scène stockée — le lien avec le processus sol S13_CREATE_TRANSFER (manuel, section 6.7).\n2026-08b PL-c : émet l'événement 0x0610 TRANSFER_START (promis par un commentaire du code source et jusque-là émis par rien) et répond par un rapport TM(8,2) de scene_id(2) + bytes_total(4) + blocks(4) + crc32(4) — les trois nombres dont le sol a besoin pour planifier et vérifier un vidage, tous auparavant calculés à bord puis abandonnés. Le transfert s'écoule au débit d'information TM ACTIF (0x0506) et seulement tant que la liaison descendante est établie (0x0501), et non plus aux anciens 10 Mbps codés en dur : il se bloque à la perte du signal et reprend au passage suivant."
