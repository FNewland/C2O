- key: "tc:TTC_SET_TX_POWER:description"
  en: "Select an SSPA operating point. Discrete steps only: the RF output of a solid-state PA is a function of the commanded gain state, baseplate temperature and VSWR, and is not a continuous ground-settable quantity. Unknown codes are REJECTED with S1.8 error 0x0003, never clamped. (The old '2 = 8 W' documentation was never executable: set_tx_power rejects anything above pa_max_power_w = 5.0 W.)"
  en_hash: "8b0a29ec4a2c66ac"
  fr: "Sélectionner un point de fonctionnement du SSPA. Pas discrets uniquement : la puissance RF de sortie d'un PA à état solide dépend de l'état de gain commandé, de la température de la semelle et du TOS, et n'est pas une grandeur continue réglable depuis le sol. Les codes inconnus sont REJETÉS avec l'erreur S1.8 0x0003, jamais écrêtés. (L'ancienne documentation « 2 = 8 W » n'a jamais été exécutable : set_tx_power rejette toute valeur au-delà de pa_max_power_w = 5.0 W.)"
