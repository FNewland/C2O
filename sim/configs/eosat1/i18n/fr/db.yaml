- key: "reportsec:anomaly_investigation.timeline_intro:text"
  en: "Every entry below is stamped with **on-board CUC** rendered as UTC.\nNote that S1 verification and S12 transition packets carry no on-board\ntimestamp (tm_builder default CUC 0); those rows are placed by archive\norder between their bracketing timestamped neighbours and are marked ~."
  en_hash: "1484efe0c0dd12af"
  fr: "Chaque entrée ci-dessous est horodatée en **CUC bord** exprimé en UTC.\nLes paquets de vérification S1 et de transition S12 ne portent aucun horodatage\nbord (CUC 0 par défaut de tm_builder) ; ces lignes sont placées selon l'ordre\nd'archivage entre leurs voisines horodatées et marquées ~."
