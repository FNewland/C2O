- key: "tc:TTC_SET_DATA_RATE:description"
  en: "Select a rung of the TM data-rate ladder defined in subsystems/ttc.yaml tm_rate_tiers. Sets data_rate_mode (the COMMANDED tier), which the TTC tick resolves the active tier from, so the commanded tier survives the tick and is authoritative. Three tiers: LOW 16 kbps BPSK conv(7,1/2)+RS — ROUTINE OPERATIONS, and the safe-mode / FDIR fallback; HIGH 128 kbps QPSK RS(255,223) — delayed-telemetry playback and image dumps only; SAFE 1 kbps BPSK conv(7,1/2)+RS — bootloader/contingency lifeline rate (renamed from BEACON, 2026-08c — \"beacon\" always means the UHF whip transmitter now), entered with TTC_SET_BEACON_MODE, not selectable here. LEGACY ENCODING PRESERVED VERBATIM: rate=0 still means \"the low rate\" and rate=1 still means \"the high rate\" — they now select LOW (16 kbps) and HIGH (128 kbps) instead of 1 kbps and 64 kbps, so existing procedures, OBCPs and the FDIR ttc_reduce_power action keep their meaning. Permission rules are enforced by REJECTION with an S1.8 execution failure (error 0x0007), never by silent clamping: HIGH requires a deployed antenna and DOWNLINK/dump mode (TTC_SET_DOWNLINK_MODE), and every tier except SAFE is refused while beacon mode is latched. An unknown tier code gives error 0x0003. There is NO on-board elevation gate (2026-08c): the 10 deg HIGH policy is a GROUND rule — the MCS warns when HIGH is commanded below 10 deg from its own contact geometry, and the planner schedules HIGH dumps above it."
  en_hash: "fd34f24acdc97abc"
  fr: "Sélectionner un échelon de l'échelle de débits TM définie dans tm_rate_tiers de subsystems/ttc.yaml. Positionne data_rate_mode (le palier COMMANDÉ), dont le pas TTC déduit le palier actif ; le palier commandé survit donc au pas et fait foi. Trois paliers : LOW 16 kbps BPSK conv(7,1/2)+RS — OPÉRATIONS DE ROUTINE, et repli en mode survie / FDIR ; HIGH 128 kbps QPSK RS(255,223) — relecture de la télémesure différée et vidages d'images uniquement ; SAFE 1 kbps BPSK conv(7,1/2)+RS — débit de survie du chargeur d'amorçage/des contingences (renommé depuis BEACON, 2026-08c — « beacon » désigne désormais toujours l'émetteur UHF à fouet), activé par TTC_SET_BEACON_MODE, non sélectionnable ici. CODAGE HISTORIQUE CONSERVÉ À L'IDENTIQUE : rate=0 signifie toujours « le débit bas » et rate=1 toujours « le débit haut » — ils sélectionnent désormais LOW (16 kbps) et HIGH (128 kbps) au lieu de 1 kbps et 64 kbps, si bien que les procédures, les OBCP et l'action FDIR ttc_reduce_power existants gardent leur sens. Les règles d'autorisation sont appliquées par REJET avec un échec d'exécution S1.8 (erreur 0x0007), jamais par écrêtage silencieux : HIGH exige une antenne déployée et le mode DOWNLINK/vidage (TTC_SET_DOWNLINK_MODE), et tout palier autre que SAFE est refusé tant que le mode balise est verrouillé. Un code de palier inconnu donne l'erreur 0x0003. Il n'y a AUCUNE condition d'élévation à bord (2026-08c) : la règle HIGH à 10 deg est une règle SOL — le MCS avertit lorsque HIGH est commandé sous 10 deg d'après sa propre géométrie de contact, et le planificateur programme les vidages HIGH au-dessus."
