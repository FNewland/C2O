  en_hash: "c291aee1a5257868"
  fr: "Rapporter le masque des préconditions d'entrée en FINE (0x02C5) en TM(8,130) ; 0 = prêt"
- key: "tc:AOCS_SET_MOM_MGMT:description"
  en: "Configure autonomous momentum management (auto-DESAT thresholds)"
  en_hash: "0922ae2f239941c2"
  fr: "Configurer la gestion autonome du moment cinétique (seuils de DESAT automatique)"
- key: "tc:AOCS_SET_DESAT_INHIBIT:description"
  en: "Inhibit/allow momentum desaturation. A dump drops fine pointing, so it must not pre-empt an imaging strip; the inhibit is also asserted AUTOMATICALLY while payload.mode is IMAGING"
  en_hash: "99b5aa860c7c2b67"
  fr: "Inhiber/autoriser la désaturation. Un déchargement fait perdre le pointage fin ; il ne doit donc pas préempter une bande de prise de vue ; l'inhibition est aussi activée AUTOMATIQUEMENT tant que payload.mode vaut IMAGING"
- key: "tc:AOCS_EST_RESET:description"
  en: "Reinitialise the attitude estimator (after a time jump — see gps_time_sync_recovery)"
  en_hash: "9b651e6d132145c2"
  fr: "Réinitialiser l'estimateur d'attitude (après un saut de temps — voir gps_time_sync_recovery)"
- key: "tc:AOCS_GPS_SET_START_MODE:description"
