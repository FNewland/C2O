- key: "reportsec:pass_report.summary:title"
  en: "Pass summary"
  en_hash: "4bafacba8f8b26cf"
  fr: "Synthèse du passage"
- key: "reportsec:pass_report.summary:text"
  en: "**Station:** {{period.station}}  **AOS:** {{period.start_utc}}  **LOS:** {{period.end_utc}}\n**Duration:** {{period.duration_min}} min\n\nData return {{gaps.received_pct}} % of expected. {{counts.commands.total}} commands\nuplinked, {{counts.commands.rejected}} rejected. {{counts.events.severity_3plus}}\nevents of severity 3 or above.\n\n*Operator: record here what you were trying to achieve this pass, what you actually\nachieved, and what the next shift must pick up. A pass report that only lists numbers\nis not a pass report.*"
  en_hash: "041916d38c6d8d69"
  fr: "**Station :** {{period.station}}  **AOS :** {{period.start_utc}}  **LOS :** {{period.end_utc}}\n**Durée :** {{period.duration_min}} min\n\nRetour de données {{gaps.received_pct}} % de l'attendu. {{counts.commands.total}} commandes\nenvoyées, {{counts.commands.rejected}} rejetées. {{counts.events.severity_3plus}}\névénements de gravité 3 ou plus.\n\n*Opérateur : consignez ici ce que vous cherchiez à accomplir pendant ce passage, ce que vous avez réellement\naccompli, et ce que le quart suivant doit reprendre. Un rapport de passage qui ne fait qu'aligner des chiffres\nn'est pas un rapport de passage.*"
