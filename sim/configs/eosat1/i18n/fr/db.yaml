  en_hash: "c48bb87622d4cffb"
  fr: "Régler le quaternion cible de maintien inertiel (utilisé par le mode INERTIAL 9 et le repère 0)"
- key: "tc:AOCS_SET_TARGET_GEO:description"
  en: "Set a ground target for TARGET_TRACK pointing (off-nadir imaging)"
  en_hash: "9e83a663aa968e55"
  fr: "Définir une cible au sol pour le pointage TARGET_TRACK (prise de vue hors nadir)"
- key: "tc:AOCS_SET_CONTROL_BW:description"
  en: "Override the controller bandwidth/damping (commissioning gain tuning; 0 restores per-mode defaults)"
  en_hash: "4726a55e84a8780e"
  fr: "Forcer la bande passante/l'amortissement du contrôleur (réglage des gains en recette ; 0 rétablit les valeurs par défaut de chaque mode)"
- key: "tc:AOCS_FINE_READY_CHECK:description"
