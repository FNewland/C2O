- key: "tc:S13_CREATE_TRANSFER:description"
  en: "Create a download transfer session for a STORED image product.\n2026-08b PL-c: the session is now bound to a real catalogue entry. A scene that is not in the payload's image catalogue is REFUSED (S1.8 error 0x0003 plus a TM(13,4) NAK) — previously a transfer for scene 9999 against an EMPTY catalogue returned transfer_id 1, 4 MB and ACTIVE, so the ground could open, run and complete the download of an image that had never been taken. Use PAYLOAD_GET_IMAGE_CATALOG (S8 func 32) to see what is actually on board.\nThe session is sized from the product's own COMPRESSED size, so `size_mb` is now advisory: it is ignored whenever the scene is catalogued.\nTM(13,2) response: transfer_id(2) + total_blocks(4) + crc32(4). The last two fields are appended, so a decoder that reads only the transfer id is unaffected; `crc32` is the checksum the instrument computed over the product at capture, and the ground should recompute it over the received blocks — a CORRUPT product (catalogue status 2) will not match, which is how a corrupted image is now diagnosable."
  en_hash: "9532be272b89e05a"
  fr: "Créer une session de transfert de téléchargement pour un produit image STOCKÉ.\n2026-08b PL-c : la session est désormais liée à une véritable entrée du catalogue. Une scène absente du catalogue d'images de la charge utile est REFUSÉE (erreur S1.8 0x0003 plus un NAK TM(13,4)) — auparavant, un transfert pour la scène 9999 avec un catalogue VIDE renvoyait transfer_id 1, 4 MB et ACTIVE, si bien que le sol pouvait ouvrir, dérouler et achever le téléchargement d'une image jamais prise. Utiliser PAYLOAD_GET_IMAGE_CATALOG (S8 func 32) pour voir ce qui est réellement à bord.\nLa session est dimensionnée d'après la taille COMPRESSÉE du produit lui-même ; `size_mb` n'est donc plus qu'indicatif : il est ignoré dès que la scène est cataloguée.\nRéponse TM(13,2) : transfer_id(2) + total_blocks(4) + crc32(4). Les deux derniers champs sont ajoutés en fin, si bien qu'un décodeur qui ne lit que l'identifiant de transfert n'est pas affecté ; `crc32` est la somme de contrôle calculée par l'instrument sur le produit à l'acquisition, et le sol doit la recalculer sur les blocs reçus — un produit CORRUPT (statut catalogue 2) ne correspondra pas, ce qui permet désormais de diagnostiquer une image corrompue."
- key: "tc:S13_DOWNLOAD_SEGMENT:description"
  en: "Request one 1024-byte segment of image data. The bytes are DERIVED from the product (a keyed stream over the catalogue entry's data_seed), so the same segment requested twice is identical and the whole product checksums to the crc32 that S13_CREATE_TRANSFER reported. They used to be a `(segment_num + i) % 256` ramp identical for every scene."
  en_hash: "be8a27b4f6004984"
  fr: "Demander un segment de 1024 octets de données image. Les octets sont DÉRIVÉS du produit (un flux à clé sur le data_seed de l'entrée du catalogue), de sorte que le même segment demandé deux fois est identique et que le produit entier a pour somme de contrôle le crc32 rapporté par S13_CREATE_TRANSFER. Il s'agissait auparavant d'une rampe `(segment_num + i) % 256` identique pour toutes les scènes."
- key: "tc:S13_END_TRANSFER:description"
  en: "Complete transfer session and free resources. 2026-08b PL-c: it now really does free them — a session whose blocks were ALL sent deletes the product and returns its storage (event 0x0614, 0x0647/0x0648 fall). Previously nothing was freed, so a spacecraft could downlink its entire store and still report it full. A partial or aborted session leaves the product on board, which is the \"the pass dropped, re-dump next orbit\" case this service exists for."
  en_hash: "65e2e55e4defe62f"
  fr: "Clore la session de transfert et libérer les ressources. 2026-08b PL-c : elle les libère désormais réellement — une session dont TOUS les blocs ont été envoyés supprime le produit et restitue son espace (événement 0x0614, baisse de 0x0647/0x0648). Auparavant rien n'était libéré, si bien qu'un satellite pouvait transmettre au sol toute sa mémoire et la déclarer encore pleine. Une session partielle ou abandonnée laisse le produit à bord : c'est le cas « le passage a décroché, nouveau vidage à l'orbite suivante » pour lequel ce service existe."
