- key: "aocsmode:OFF:description"
  en: "No attitude control. Sensors and actuators powered down."
  en_hash: "acc661b058b30001"
  fr: "Aucun contrôle d'attitude. Capteurs et actionneurs hors tension."
- key: "aocsmode:SAFE_BOOT:description"
  en: "Post-boot stabilization. Gyro propagation only, no actuation."
  en_hash: "1a0f5f7b032c0708"
  fr: "Stabilisation après amorçage. Propagation gyroscopique seule, aucune actuation."
- key: "aocsmode:DETUMBLE:description"
  en: "Gyro + magnetorquer rate damping. Reduces body rates to <1°/s."
  en_hash: "7e83a30d980f756b"
  fr: "Amortissement des vitesses par gyroscope + magnétocoupleurs. Ramène les vitesses angulaires à <1°/s."
- key: "aocsmode:COARSE_SUN:description"
  en: "Sun-pointing via coarse sun sensors. Prerequisite for nominal."
  en_hash: "7356ea48cf230c26"
  fr: "Pointage solaire au moyen des senseurs solaires grossiers. Prérequis du mode nominal."
- key: "aocsmode:NOMINAL:description"
  en: "Fine-pointing using reaction wheels + star tracker. Imaging capable."
  en_hash: "e0c7abb6991b4149"
  fr: "Pointage fin au moyen des roues de réaction + senseur stellaire. Apte à la prise de vue."
- key: "aocsmode:FINE_POINT:description"
  en: "High-precision 3-axis pointing. Requires all sensors healthy."
  en_hash: "2e6494a4cc41c73c"
  fr: "Pointage 3 axes de haute précision. Exige que tous les capteurs soient sains."
- key: "aocsmode:SLEW:description"
  en: "Quaternion slew manoeuvre between attitudes."
  en_hash: "923a812ce0dc08a9"
  fr: "Manœuvre de basculement par quaternion entre deux attitudes."
- key: "aocsmode:DESAT:description"
  en: "Momentum desaturation via magnetorquers."
  en_hash: "539a5edfb86314e2"
  fr: "Désaturation du moment cinétique par les magnétocoupleurs."
- key: "aocsmode:ECLIPSE:description"
  en: "Eclipse hold. Gyro-only propagation, minimal power consumption."
  en_hash: "cdb278012bf8610e"
  fr: "Maintien en éclipse. Propagation gyroscopique seule, consommation minimale."
- key: "aocsmode:INERTIAL:description"
  en: "Inertial hold at a commanded ECI quaternion (calibration star fields, off-nadir stereo). Appended in Phase C — modes 0-8 are never renumbered."
  en_hash: "42ae235a52773038"
  fr: "Maintien inertiel sur un quaternion ECI commandé (champs d'étoiles d'étalonnage, stéréo hors nadir). Ajouté en Phase C — les modes 0-8 ne sont jamais renumérotés."
- key: "obcp:pass_preparation:description"
