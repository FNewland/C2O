- key: "reportsec:anomaly_investigation.analysis:title"
  en: "8. Analysis, root cause and actions"
  en_hash: "e7eb12b7fab8ff0a"
  fr: "8. Analyse, cause première et actions"
- key: "reportsec:anomaly_investigation.analysis:text"
  en: "**Observed behaviour:**\n**Expected behaviour (design reference):**\n**Candidate causes** (list, each with the evidence that supports or refutes it):\n**Root cause:**\n**Immediate recovery actions taken:**\n**Corrective/preventive actions:**\n**Recurrence check** — re-run this report over a wider period and state whether the\nsignature appears elsewhere."
  en_hash: "825cf1e1422f14a2"
  fr: "**Comportement observé :**\n**Comportement attendu (référence de conception) :**\n**Causes possibles** (liste, chacune avec les éléments qui l'étayent ou la réfutent) :\n**Cause première :**\n**Actions de reprise immédiates :**\n**Actions correctives/préventives :**\n**Contrôle de récurrence** — relancer ce rapport sur une période plus large et indiquer si la\nsignature apparaît ailleurs."
- key: "reportsec:daily_ops_review.exec:title"
  en: "Executive summary"
  en_hash: "b7e884fe280c9dd2"
  fr: "Synthèse"
- key: "reportsec:daily_ops_review.exec:text"
  en: "Spacecraft mode at period start / end. Overall health assessment in one paragraph,\nthen the exceptions. A DOR is read by people who will only read this box — put the\ndecisions here, not the data.\n\nMin SoC {{stats.eps.bat_soc.min}} % at {{stats.eps.bat_soc.min_at}}.\n{{counts.passes}} passes, mean data return {{gaps.received_pct}} %.\n{{counts.events.severity_4}} critical events. {{counts.commands.rejected}} command rejections."
  en_hash: "47942beb2a34aef1"
  fr: "Mode du satellite en début / fin de période. Évaluation globale de l'état de santé en un paragraphe,\npuis les exceptions. Un rapport quotidien est lu par des personnes qui ne liront que cet encadré — placez-y\nles décisions, pas les données.\n\nSoC min {{stats.eps.bat_soc.min}} % à {{stats.eps.bat_soc.min_at}}.\n{{counts.passes}} passages, retour moyen de données {{gaps.received_pct}} %.\n{{counts.events.severity_4}} événements critiques. {{counts.commands.rejected}} rejets de commandes."
