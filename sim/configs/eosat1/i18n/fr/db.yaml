- key: "evt:OBC_TIME_REF_LOST:description"
  en: "GPS fix lost while the clock was disciplined — time reference falls back to HOLDOVER and oscillator drift resumes"
  en_hash: "35cb5b901d17a2c4"
  fr: "Solution GPS perdue alors que l'horloge était asservie — la référence de temps retombe sur HOLDOVER et la dérive de l'oscillateur reprend"
- key: "evt:BOOT_COMPLETE:description"
