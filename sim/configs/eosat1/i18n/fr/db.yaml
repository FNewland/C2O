- key: "evt:AOCS_FAST_LOOP_BYPASSED:description"
  en: "AOCS attitude fast loop bypassed/restored (secular fidelity mode above 60x time acceleration; see aocs.fidelity_mode 0x02C6)"
  en_hash: "09f2af8835f9a252"
  fr: "Boucle rapide d'attitude AOCS contournée/rétablie (mode de fidélité séculaire au-delà d'une accélération du temps de 60x ; voir aocs.fidelity_mode 0x02C6)"
- key: "evt:AOCS_DESAT_INEFFECTIVE:description"
  en: "Desaturation timed out without converging: the dump could not remove the stored body momentum within desaturation.timeout_s. AOCS returns to the pre-desat mode instead of parking in DESAT"
  en_hash: "5568cf92cf46e654"
  fr: "Désaturation expirée sans convergence : le déchargement n'a pas pu retirer le moment cinétique stocké dans desaturation.timeout_s. L'AOCS revient au mode antérieur à la désaturation au lieu de rester en DESAT"
- key: "evt:AOCS_MODE_RESTORED:description"
  en: "AOCS returned to the mode the ground commanded (aocs.commanded_mode 0x0297) after a transient or an automatic demotion"
  en_hash: "9ae59c74c322cb3d"
  fr: "L'AOCS est revenu au mode commandé par le sol (aocs.commanded_mode 0x0297) après un transitoire ou une rétrogradation automatique"
- key: "evt:AOCS_GYRO_CAL_START:description"
  en: "Gyro bias calibration started. Aux text carries the commanded averaging duration; progress is aocs.gyro_cal_progress (0x02CA) and state aocs.gyro_cal_state (0x02C9)"
  en_hash: "04032fd02e608990"
  fr: "Étalonnage du biais gyroscopique lancé. Le texte auxiliaire indique la durée de moyennage commandée ; l'avancement est aocs.gyro_cal_progress (0x02CA) et l'état aocs.gyro_cal_state (0x02C9)"
- key: "evt:AOCS_GYRO_CAL_COMPLETE:description"
  en: "Gyro bias calibration completed. Aux text carries the estimated per-axis bias (also aocs.gyro_cal_bias_x/y/z 0x02CB-0x02CD); the estimate is applied as an on-board compensation, so the residual bias at the gyro output falls to zero while the hardware fault itself is untouched"
  en_hash: "50664420f6530a55"
  fr: "Étalonnage du biais gyroscopique terminé. Le texte auxiliaire indique le biais estimé par axe (aussi aocs.gyro_cal_bias_x/y/z 0x02CB-0x02CD) ; l'estimation est appliquée comme compensation à bord, si bien que le biais résiduel en sortie gyroscope tombe à zéro alors que le défaut matériel lui-même reste intact"
- key: "evt:AOCS_GYRO_CAL_ABORT:description"
  en: "Gyro bias calibration aborted before completion — a precondition was lost (star tracker stopped tracking, a gyro unit was switched off, body rate above the limit) or the operator abandoned it. Reason code in aocs.gyro_cal_reject (0x02D0)"
  en_hash: "ff741865d1267b04"
  fr: "Étalonnage du biais gyroscopique abandonné avant la fin — une précondition a été perdue (senseur stellaire décroché, gyroscope éteint, vitesse angulaire au-delà de la limite) ou l'opérateur l'a abandonné. Code de raison dans aocs.gyro_cal_reject (0x02D0)"
