  fr: "Indice du palier de débit TM COMMANDÉ (TTC_SET_DATA_RATE, S8 func 65). Diffère de 0x0539 dès qu'une autorisation rétrograde le palier actif"
- key: "tm:ttc.tm_symbol_rate:description"
  en: "Symbol rate now on air = active bit rate / bits-per-symbol. 16 kBd at LOW (BPSK), 64 kBd at HIGH (QPSK) — the tier step is visible on the radio"
  en_hash: "b4ff7ea907f55afd"
  fr: "Débit symbole émis = débit binaire actif / bits par symbole. 16 kBd en LOW (BPSK), 64 kBd en HIGH (QPSK) — le changement de palier est visible à la radio"
- key: "tm:ttc.downlink_mode:description"
  en: "DOWNLINK / payload-dump mode (TTC_SET_DOWNLINK_MODE, S8 func 79). 0=off, 1=on. This is the mode gate on the HIGH tier"
  en_hash: "75f127f4a9e88cf3"
  fr: "Mode DOWNLINK / vidage charge utile (TTC_SET_DOWNLINK_MODE, S8 func 79). 0=arrêt, 1=marche. C'est l'autorisation de mode du palier HIGH"
- key: "tm:ttc.time_since_last_tc:description"
  en: "On-board command-loss timer: seconds since the OBC last accepted a telecommand (restarts on every S1.1). At ttc.yaml cmd_loss_switch_timeout_s (24 h) event 0x0514 CMD_LOSS_TIMEOUT fires and S19 ea 4003 switches to the redundant transponder (FDIR TTC-01)"
  en_hash: "f32f547e31cdda35"
  fr: "Minuterie de perte de commande bord : secondes écoulées depuis la dernière télécommande acceptée par l'OBC (remise à zéro à chaque S1.1). À cmd_loss_switch_timeout_s de ttc.yaml (24 h), l'événement 0x0514 CMD_LOSS_TIMEOUT est émis et la règle S19 ea 4003 bascule sur le transpondeur redondant (FDIR TTC-01)"
- key: "tm:ttc.active_gs:description"
  en: "Active ground station: 1-based index into orbit.yaml ground_stations, 0 = out of contact"
  en_hash: "0b978995727b0deb"
  fr: "Station sol active : indice (base 1) dans ground_stations de orbit.yaml, 0 = hors contact"
- key: "tm:ttc.gs_equipment_status:description"
  en: "GS equipment health bitmask, SET bit = healthy: bit0 antenna+tracking, bit1 LNA, bit2 uplink HPA, bit3 reference oscillator+feed. 15 = all healthy"
  en_hash: "35e960f09f01ce02"
  fr: "Masque de santé des équipements de la station sol, bit à 1 = sain : bit0 antenne+poursuite, bit1 LNA, bit2 HPA de liaison montante, bit3 oscillateur de référence+source. 15 = tout sain"
- key: "tm:ttc.tx_active:description"
  en: "S-band prime downlink radiating (0=inhibited, 1=transmitting). AND of: PA on and not in thermal shutdown, transponder alive, EPS ttc_tx line on, station in view. This is the gate on every TM packet except the UHF beacon's SID 11"
  en_hash: "b2050636a5957c15"
  fr: "Liaison descendante principale en bande S en émission (0=inhibée, 1=en émission). ET logique de : PA en marche et hors arrêt thermique, transpondeur vivant, ligne ttc_tx de l'EPS alimentée, station en visibilité. C'est l'autorisation de chaque paquet TM sauf le SID 11 de la balise UHF"
- key: "tm:ttc.tx_gate_status:description"
  en: "Downlink gate breakdown, SET bit = permissive: bit0 PA on, bit1 EPS ttc_tx line on, bit2 station in view, bit3 S-band radiating, bit4 UHF beacon TX commanded on, bit5 UHF beacon radiating, bit6 S-band antenna deployed, bit7 beacon MODE off. 0xDF = transmitting normally"
  en_hash: "14d9116976104587"
  fr: "Détail des autorisations de liaison descendante, bit à 1 = permissif : bit0 PA en marche, bit1 ligne ttc_tx de l'EPS alimentée, bit2 station en visibilité, bit3 bande S en émission, bit4 émission balise UHF commandée, bit5 balise UHF en émission, bit6 antenne bande S déployée, bit7 MODE balise inactif. 0xDF = émission normale"
- key: "tm:ttc.eirp_dbw:description"
  en: "Live S-band EIRP at the COMMANDED PA power = ttc.yaml eirp_dbw + 10*log10(P/pa_ref_power_w). Moves 3.01 dB down at LOW and 3.98 dB up at HIGH — the proof that TTC_SET_TX_POWER (S8 func 68) reaches the link and not just telemetry 0x050D"
  en_hash: "b9885bc307b154cd"
  fr: "PIRE bande S instantanée à la puissance PA COMMANDÉE = eirp_dbw de ttc.yaml + 10*log10(P/pa_ref_power_w). Baisse de 3.01 dB en LOW et monte de 3.98 dB en HIGH — preuve que TTC_SET_TX_POWER (S8 func 68) agit sur la liaison et pas seulement sur la télémesure 0x050D"
- key: "tm:ttc.beacon_tx_on:description"
  en: "UHF beacon transmitter commanded on (TTC_BEACON_TX_ON/OFF, S8 funcs 97/98). 0=off, 1=on"
  en_hash: "288bcf0221e14b46"
  fr: "Émetteur de la balise UHF commandé en marche (TTC_BEACON_TX_ON/OFF, S8 funcs 97/98). 0=arrêt, 1=marche"
- key: "tm:ttc.beacon_active:description"
  en: "UHF beacon actually radiating to a station now (commanded on AND in contact AND its link closes). Independent of ttc.tx_active by construction — that independence is the reason the beacon is a second box"
  en_hash: "f01dbf2a969e9cc8"
  fr: "Balise UHF effectivement en émission vers une station (commandée en marche ET en contact ET liaison bouclée). Indépendant de ttc.tx_active par construction — cette indépendance est la raison d'être de la balise comme second équipement"
- key: "tm:ttc.beacon_link_margin:description"
  en: "UHF beacon link margin against its OWN budget: 437.5 MHz, 1 W into a 0 dBi dipole, 1 kbps, conv+RS, to a -8 dB/K Yagi station. Typically ~27 dB — compare with the S-band LOW rung's ~46 dB and read off where the difference comes from"
  en_hash: "ac4f2d3f45933297"
  fr: "Marge de liaison de la balise UHF par rapport à son PROPRE bilan : 437.5 MHz, 1 W dans un dipôle de 0 dBi, 1 kbps, conv+RS, vers une station Yagi à -8 dB/K. Typiquement ~27 dB — à comparer aux ~46 dB du palier LOW en bande S, et à expliquer"
- key: "tm:ttc.beacon_dl_freq:description"
  en: "UHF beacon downlink frequency (435-438 MHz amateur-satellite segment; 437.5 MHz as flown)"
  en_hash: "83642ef45380087d"
  fr: "Fréquence descendante de la balise UHF (segment amateur-satellite 435-438 MHz ; 437.5 MHz en vol)"
- key: "tm:ttc.beacon_tx_power:description"
  en: "UHF beacon RF output (1.0 W = 30 dBm, EnduroSat UHF Type II typical). 0 W when the beacon transmitter is commanded off"
  en_hash: "6345fe28e6a8d994"
  fr: "Puissance RF de sortie de la balise UHF (1.0 W = 30 dBm, valeur typique EnduroSat UHF Type II). 0 W lorsque l'émetteur de balise est commandé à l'arrêt"
