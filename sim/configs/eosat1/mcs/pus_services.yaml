services:
  s1:
    label: "Request Verification"
    enabled: true
    description: "TC acceptance, execution and completion reports"
  s2:
    label: "Device Access"
    enabled: true
    description: "Direct on/off control of named hardware lines. Used during commissioning and contingency; not used during nominal operations."
  s3:
    label: "Housekeeping"
    enabled: true
    default_interval_s: 4
    max_sids: 32
    description: "Periodic and one-shot housekeeping telemetry collection"
  s5:
    label: "Event Reporting"
    enabled: true
    max_log_entries: 500
    description: "Onboard event detection and reporting by severity"
  s6:
    label: "Memory Management"
    enabled: true
    max_dump_bytes: 4096
    description: "Onboard memory load, dump, and checksum verification"
  s8:
    label: "Function Management"
    enabled: true
    description: "Direct function execution on subsystems"
  s9:
    label: "Time Management"
    enabled: true
    description: "Spacecraft time synchronisation and correlation"
  s11:
    label: "Time-Tagged Scheduling"
    enabled: true
    max_commands: 256
    description: "Deferred command execution at specified UTC times"
  s12:
    label: "Onboard Monitoring"
    enabled: true
    max_definitions: 64
    description: "Parameter limit checking and out-of-limit event generation"
  s13:
    label: "Large Data Transfer"
    enabled: true
    description: "Multi-pass downlink of science data and other large payloads. The operator initiates a transfer via S13_CREATE_TRANSFER then monitors S13_TRANSFER_STATUS."
  s15:
    label: "Onboard Storage"
    enabled: true
    # Single source for the S15 packet stores (2026-11 consistency pass).
    # capacity_packets is the live limit the simulator enforces (engine ->
    # smo_simulator.tm_storage); capacity_bytes is the OBC flash partition
    # in subsystems/memory_map.yaml, sized to hold capacity_packets of the
    # store's largest packet (HK: SID 2 AOCS, 152 octets -> 2.7 MB -> 4 MiB;
    # it was 1 MiB, too small for the 18 000 packets the store really keeps).
    # The Science Store (3) holds the 20-octet image PRODUCT RECORDS that
    # PAYLOAD_CAPTURE writes; the image pixels live in the payload's own
    # 20 GB mass memory (subsystems/payload.yaml total_storage_mb) and are
    # streamed by S13. The 8 MiB here and the 20 GB there are two different
    # memories, not one store quoted twice.
    stores:
      - id: 1
        name: "HK Store"
        capacity_bytes: 4194304
        capacity_packets: 18000
        circular: true
      - id: 2
        name: "Event Store"
        capacity_bytes: 524288
        capacity_packets: 2000
      - id: 3
        name: "Science Store"
        capacity_bytes: 8388608
        capacity_packets: 10000
      - id: 4
        name: "Alarm Store"
        capacity_bytes: 262144
        capacity_packets: 500
    description: "Packet storage and retrieval for downlink scheduling"
  s17:
    label: "Connection Test"
    enabled: true
    description: "Echo-based link connectivity verification"
  s18:
    label: "On-Board Control Procedures"
    enabled: true
    max_procedures: 16
    max_steps_per_procedure: 32
    description: "On-board scripting (OBCP): load, activate, stop and report ordered sequences of delayed self-executed TCs. Boot procedures pre-loaded from configs/eosat1/obcp/."
  s19:
    label: "Event-Action"
    enabled: true
    max_rules: 32
    description: "Autonomous response rules triggered by onboard events"
  s20:
    label: "Parameter Management"
    enabled: true
    description: "Direct read/write of onboard parameter values"
