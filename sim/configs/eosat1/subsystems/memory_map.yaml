memory_regions:
  - name: "Boot ROM"
    start: 0x00000000
    size: 0x10000
    type: readonly
    description: "Primary bootloader, write-protected"
  - name: "Boot Backup"
    start: 0x00010000
    size: 0x10000
    type: readonly
    description: "Backup bootloader copy"
  - name: "Application A"
    start: 0x00100000
    size: 0x80000
    type: flash
    description: "Primary flight software image"
  - name: "Application B"
    start: 0x00180000
    size: 0x80000
    type: flash
    description: "Backup flight software image"
  - name: "Configuration"
    start: 0x00200000
    size: 0x20000
    type: flash
    description: "Onboard parameter tables and configuration"
  # S15 packet-store partitions: sizes = mcs/pus_services.yaml
  # capacity_bytes (single source; tests/test_content/test_sim_consistency.py).
  - name: "HK Store"
    start: 0x00300000
    size: 0x400000
    type: flash
    description: "Housekeeping packet store (S15 Store 1, 18 000 packets)"
  - name: "Event Store"
    start: 0x00700000
    size: 0x80000
    type: flash
    description: "Event log packet store (S15 Store 2, 2 000 packets)"
  - name: "Science Store"
    start: 0x00780000
    size: 0x800000
    type: flash
    description: "Science product-record packet store (S15 Store 3, 10 000 packets); image pixels live in the payload's 20 GB mass memory"
  - name: "Alarm Store"
    start: 0x00F80000
    size: 0x40000
    type: flash
    description: "Alarm history packet store (S15 Store 4, 500 packets)"
  - name: "Scratchpad RAM"
    start: 0x20000000
    size: 0x40000
    type: ram
    description: "General-purpose volatile working memory"
  - name: "Stack/Heap"
    start: 0x20040000
    size: 0x20000
    type: ram
    description: "Application stack and heap allocation"
