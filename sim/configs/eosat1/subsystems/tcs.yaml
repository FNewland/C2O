model: tcs_basic

# Legacy first-order zones. Only the FPA remains one: it is a CONTROLLED
# node (the cooler law in tcs_basic, sink = the payload network node) and its
# C / tau set the cooler's parasitic UA = C / tau = 0.833 W/K (see the cooler
# derivation below). Every other temperature comes from `network:` (2026-11);
# the old panel / battery / thruster zone entries were removed with the
# fixed-sink model they parameterised.
zones:
  - name: fpa
    capacitance_j_per_c: 100
    time_constant_s: 120
    initial_temp_c: -5.0

heaters:
  # Phase B (brief 05 defect 2 / WP-3): setpoints reconciled to the manual
  # (03_tcs.md: ON +5 / OFF +10 C, 8 W). The old ON +1 C sat 9 C below the
  # coldest temperature the battery node could ever reach, so the thermostat
  # could never fire and the heater indicator was static forever.
  - name: battery
    power_w: 8.0
    on_temp_c: 5.0
    off_temp_c: 10.0
  # OBC survival heater (2026-11): ON -10 / OFF -5 C, at the hardware-based
  # yellow-low (-10 C). It used to switch at +5 / +10 C — the old yellow-low
  # — so any heater activity was by construction a yellow alarm, and in the
  # thermal network the nominal OBC (+10..+20 C) never needs it. It earns its
  # keep in long load shed / survival and against a cold soak.
  - name: obc
    power_w: 4.0
    on_temp_c: -10.0
    off_temp_c: -5.0
  # Catbed heater (Phase D): HEATER_THRUSTER (S8 func 42) makes this circuit
  # load-bearing for the first time. MANUAL by default (preheat is an
  # explicit NOM-013 step); HEATER_AUTO_MODE circuit=2 enables the 190/230 C
  # thermostat hold. Powered from the EPS `prop` line; billed from actual
  # heater state (0x041B) like every other heater.
  - name: thruster
    power_w: 12.0
    on_temp_c: 190.0
    off_temp_c: 230.0

fpa_cooler_target_c: -15.0
# ABSOLUTE ceiling on the cooler's heat lift below the ambient sink (K).
#
# 2026-08b: this used to be the WHOLE cooler model — a flat 40 K with no
# coupling to `fpa_cooler_power_w`, so the machine had as much authority at a
# 39 K lift as at a 1 K lift and "the cooler is struggling" was not a state
# the simulator could enter. It is now only the ceiling; the lift ACHIEVABLE
# at any instant is computed from the cooler's efficiency in
# `tcs_basic.TCSBasicModel._fpa_achievable_lift_k`, which carries the full
# derivation and the citations. Summary:
#
#   * -15 C from the +12 C internal sink is a 27 K lift. The FPA node's
#     UA = C/tau = 100/120 = 0.833 W/K, so 22.5 W has to be pumped from 15 W
#     of input: COP 1.50.
#   * A single-stage Bi2Te3 thermoelectric cannot do that. Goldsmid's
#     optimum-current result COP_max = (Tc/dT)(g - Th/Tc)/(g + 1),
#     g = sqrt(1 + Z.Tm), with ZT ~ 0.73 gives COP_max = 0.88 at this lift.
#     The "Peltier envelope" wording elsewhere in the tree is therefore the
#     thing that was wrong, not the mission.
#   * 1.50 is 15.7 % of the Carnot COP (Tc/dT = 9.56), well inside the
#     10-25 % of Carnot that miniature Stirling / free-piston space coolers
#     reach at near-ambient lifts — the class of machine cooled small-sat EO
#     detectors actually fly. The model is that machine, at 23 % of Carnot.
#
# Measured on the fixed model (`_fpa_achievable_lift_k`):
#   sink +12 C idle      32.35 K -> floor -20.35 C   (-20 C setpoint just holds)
#   sink +12 C imaging   31.24 K -> floor -19.24 C   (-20 C setpoint does not)
#   sink +20 C idle      32.83 K -> floor -12.83 C   (-15 C setpoint does not)
# The nominal -15 C keeps ~5 K of margin, so the shipped mission is unchanged;
# the margin is now finite, spendable and VISIBLE at 0x0424 (achievable floor)
# and 0x0425 (margin), mirrored by the payload at 0x064A / 0x064B.
fpa_cooler_max_lift_k: 40.0
# Cooler efficiency model (DISPLAY_REQUESTS_PAYLOAD.md §8.2). These three were
# read by `tcs_basic._fpa_achievable_lift_k` but NOT declared in TCSConfig,
# which is a StrictModel — so putting them here would have been REJECTED by the
# loader and the model's own literals were the live values. TCSConfig now
# declares all three and they are real configuration; the Carnot fraction is
# the knob for a "the cooler is degrading" scenario.
fpa_cooler_power_w: 15.0          # matches subsystems/payload.yaml
fpa_cooler_carnot_fraction: 0.23  # miniature Stirling class, see below
fpa_imaging_load_w: 2.0           # detector/ROIC dissipation while IMAGING

# ---------------------------------------------------------------------------
# FPA THERMAL ENVELOPE — THE SINGLE SOURCE  (DECISIONS §3, ruled in G3-d)
# ---------------------------------------------------------------------------
# TCS owns the FPA node (brief 05 WP-1: the payload *reads* it), so the
# envelope lives here and everything else is DERIVED from it by
# smo_common.config.fpa_envelope.FPAEnvelope:
#
#   monitoring/s12_definitions.yaml   0x0408 warn/alarm, 0x0601 warn
#   mcs/limits.yaml                   0x0408, 0x0601, 0x0617
#   event_thresholds.*.fpa below      TCS warning/alarm events
#   planning/activity_types.yaml      fpa_temp_min_c / fpa_temp_max_c
#   models/tcs_basic.py, payload_basic.py   readiness, over/under-temp events
#   configs/eosat1/manual/03_tcs.md, 06_payload.md, 08_fdir.md
#
# tests/test_content/test_fpa_envelope_single_source.py recomputes every one
# of those and fails if any has drifted. Change a number HERE and propagate;
# never edit a derived band directly.
#
# The numbers below are measured off the corrected model, not remembered.
# Phase B fixed the setpoint bug (the setpoint was used as an additive
# environment offset, so the node asymptoted to ambient-35 K and never to the
# setpoint) and Phase E made the setpoint commandable, so this is the first
# build in which the achievable range is real. 10 000 s of seeded steady
# state, payload in the loop:
#
#   cooler ON  setpoint -15 C   node -15.01 C, sigma 0.138 K
#   cooler ON  setpoint -20 C   node -19.99 C, sigma 0.110 K
#   cooler ON  setpoint   0 C   node  +0.01 C, sigma 0.110 K
#   cooler OFF                  node +11.43 C, sigma 0.902 K, peak +12.41 C
#   detector 0x0601             node - 0.44 K, sigma 0.120 K
fpa_envelope:
  # Commandable regulation envelope. MUST match PAYLOAD_COOLER_SETPOINT
  # (S8 func 36) `range` in commands/tc_catalog.yaml.
  setpoint_min_c: -20.0
  setpoint_max_c: 0.0
  setpoint_default_c: -15.0
  # Measured control performance and uncooled equilibrium.
  control_3sigma_k: 0.5      # measured 0.41 K node / 0.45 K detector
  uncooled_max_c: 12.5       # measured peak +12.41 C, rounded up
  # Offsets down the payload thermal chain: bracket -> cold finger -> die.
  detector_offset_c: -0.5    # 0x0601 payload.fpa_temp
  die_offset_c: 0.5          # 0x0617 payload.detector_temp, above the finger
  # Imaging readiness — a SCIENCE limit, not a health limit. The textbook,
  # the FPA_OVERTEMP event and the planner precondition already agreed on
  # -3 C; the planner's -5 C and the manual's -12 C were the outliers.
  imaging_max_c: -3.0
  # Regulation tolerance, relative to the ACTIVE setpoint. Readiness has to
  # follow a commanded setpoint change; pinning it to -15 is what broke when
  # Phase E made the setpoint commandable.
  ready_band_below_k: 1.0
  ready_band_above_k: 5.0
  # Limit-band construction margins.
  warning_margin_k: 1.5
  alarm_margin_k: 5.0

# ---------------------------------------------------------------------------
# THERMAL NETWORK (2026-11) — docs/plan_2026-11/THERMAL_MODEL.md
# ---------------------------------------------------------------------------
# A lumped-parameter network replaces the fixed-surroundings zone model, in
# which the OBC, battery and thruster relaxed towards a configured +10/+12 C
# "internal sink" whatever was powered (OBC_THERMAL_ANALYSIS.md §4.4). Now:
#
#   C_i dT_i/dt = Q_sun + Q_albedo + Q_earthIR        (external faces, attitude-
#               - eps A sigma T^4                       and eclipse-dependent)
#               + sum G_ij (T_j - T_i)                 conduction
#               + sum (eps A)_ij sigma (T_j^4 - T_i^4)  internal radiation
#               + P_i                                  what the EPS actually delivers
#                                                      to the unit + heaters
#
# so safe mode, a load shed or a dark payload really cools the spacecraft.
# Solver: smo_simulator/models/thermal_network.py (explicit Euler, internally
# sub-stepped to <= 0.4 x the smallest node time constant — stable at any dt).
#
# Sources for the numbers (full table with references in THERMAL_MODEL.md):
#   * TJ GaAs cells with ceria-doped coverglass: alpha 0.91 (AZUR 3G30A
#     datasheet, <= 0.91), eps 0.85 (Spectrolab TNJ datasheet: 0.92 / 0.85).
#   * White paint Z-93: alpha 0.17, eps 0.92 (Henninger, NASA RP-1121, 1984).
#   * Black paint / aperture baffle: alpha 0.90, eps 0.88 (RP-1121 Chemglaze
#     Z306 0.87-0.96 class).
#   * Al 6061 cp 896 J/kg/K; Li-ion 18650 cp ~830-1040 J/kg/K (Maleki et al.
#     1999) -> 900 used.
#   * Masses: the 12.0 kg dry budget (aocs.yaml / prop.yaml), split with the
#     named parts already in the configs (TriScape100 1.1 kg, BPX 0.5 kg,
#     Endurosat wing 1.07 kg each, S-band 0.25 kg, prop module 1.15 kg + 0.4 kg
#     propellant).
#   * Geometry: 6U CDS envelope 100 x 226 x 366 mm (geometry.yaml): +-X faces
#     0.0827 m2, +-Y 0.0366 m2, +-Z 0.0226 m2; cell fractions = eps.yaml cell
#     areas / face areas.
#   * Conductances: engineering estimates for bolted CubeSat joints (0.1-0.5
#     W/K per fastened joint, a few joints per panel / unit), calibrated so
#     the cases in THERMAL_MODEL.md §4 reproduce the design intent.
network:
  # Thermistor measurement noise on the published temperatures (1 sigma).
  # The physics is deterministic; noise lives in the measurement.
  sensor_noise_k: 0.05
  integration:
    stability_fraction: 0.4   # sub-step <= 0.4 x smallest node time constant
    max_step_s: 20.0          # and never more than this
  nodes:
    # Primary structure: 6U frame, rails, mounting decks, brackets, harness
    # (the 12 kg budget minus every unit below = 3.2 kg).
    - {name: structure, mass_kg: 3.2, cp_j_per_kg_k: 896, initial_c: 15}
    # Body panels (wall + PCB + cells, ~5 kg/m2). Published at 0x0400-05.
    - {name: panel_px, mass_kg: 0.42, cp_j_per_kg_k: 900, initial_c: 15}
    - {name: panel_mx, mass_kg: 0.42, cp_j_per_kg_k: 900, initial_c: 15}
    - {name: panel_py, mass_kg: 0.19, cp_j_per_kg_k: 900, initial_c: 15}
    - {name: panel_my, mass_kg: 0.19, cp_j_per_kg_k: 900, initial_c: 15}
    - {name: panel_pz, mass_kg: 0.12, cp_j_per_kg_k: 900, initial_c: 15}
    - {name: panel_mz, mass_kg: 0.15, cp_j_per_kg_k: 900, initial_c: 15, note: "nadir: radiator + imager aperture"}
    # Deployable wings (Endurosat 6U double-deployable, 1.07 kg each).
    - {name: wing_py, mass_kg: 1.07, cp_j_per_kg_k: 900, initial_c: 15}
    - {name: wing_my, mass_kg: 1.07, cp_j_per_kg_k: 900, initial_c: 15}
    # OBC / avionics stack (boards + stack hardware). Published 0x0406.
    - {name: obc, mass_kg: 0.35, cp_j_per_kg_k: 900, initial_c: 15}
    # Battery: GomSpace BPX 0.5 kg x 900 + 0.1 kg Al bracket x 896. 0x0407.
    - {name: battery, capacitance_j_per_k: 540, initial_c: 10}
    # S-band transponder + patch antenna (Endurosat, 0.25 kg + mount).
    - {name: ttc, mass_kg: 0.30, cp_j_per_kg_k: 900, initial_c: 15}
    # Imager (Simera TriScape100, 1.1 kg); the FPA's thermal sink.
    - {name: payload, mass_kg: 1.1, cp_j_per_kg_k: 900, initial_c: 12}
    # AOCS suite: 4 wheels, star trackers, IMU, MTQ electronics (~0.9 kg).
    - {name: aocs, mass_kg: 0.9, cp_j_per_kg_k: 900, initial_c: 15}
    # Propulsion module: 1.15 kg dry x 896 + 0.4 kg propellant x 2000
    # (ADN/HAN green monoprop blends ~2 kJ/kg/K) = 1830 J/K.
    - {name: prop, capacitance_j_per_k: 1830, initial_c: 10}
    # Catalyst bed + heater blanket (Phase D): C 50 J/K; its 0.0417 W/K link
    # to the module gives the 12 W heater ~288 K of authority (unchanged).
    - {name: thruster, capacitance_j_per_k: 50, initial_c: 5}

  # External surfaces: each radiates eps A sigma T^4 to space and absorbs
  # sun (alpha), albedo (alpha) and Earth IR (eps) through the flat-plate
  # Earth view factor. `array_face` = the EPS face whose generated electrical
  # power is taken OUT of the absorbed heat (it leaves as electricity).
  surfaces:
    - {node: panel_px, normal: [1, 0, 0], area_m2: 0.0827, array_face: px,
       coatings: [{fraction: 0.73, alpha: 0.91, epsilon: 0.85},     # cells
                  {fraction: 0.27, alpha: 0.17, epsilon: 0.92}]}    # Z-93 white
    - {node: panel_mx, normal: [-1, 0, 0], area_m2: 0.0827, array_face: mx,
       coatings: [{fraction: 0.73, alpha: 0.91, epsilon: 0.85},
                  {fraction: 0.27, alpha: 0.17, epsilon: 0.92}]}
    - {node: panel_py, normal: [0, 1, 0], area_m2: 0.0366, array_face: py,
       coatings: [{fraction: 0.82, alpha: 0.91, epsilon: 0.85},
                  {fraction: 0.18, alpha: 0.17, epsilon: 0.92}]}
    - {node: panel_my, normal: [0, -1, 0], area_m2: 0.0366, array_face: my,
       coatings: [{fraction: 0.82, alpha: 0.91, epsilon: 0.85},
                  {fraction: 0.18, alpha: 0.17, epsilon: 0.92}]}
    - {node: panel_pz, normal: [0, 0, 1], area_m2: 0.0226, array_face: pz,
       coatings: [{fraction: 0.80, alpha: 0.91, epsilon: 0.85},
                  {fraction: 0.20, alpha: 0.17, epsilon: 0.92}]}
    - {node: panel_mz, normal: [0, 0, -1], area_m2: 0.0226,
       coatings: [{fraction: 0.85, alpha: 0.17, epsilon: 0.92},     # Z-93 radiator
                  {fraction: 0.15, alpha: 0.90, epsilon: 0.88}]}    # aperture/baffle
    # Wings: cells on the front (normal = SADA angle about +Y, same
    # convention as eps_basic._wing_normal), bare PCB on the back. Stowed
    # wings have no view of space (folded on their body face).
    - {node: wing_py, wing: py, side: front, area_m2: 0.143, array_face: wing_py,
       coatings: [{fraction: 0.84, alpha: 0.91, epsilon: 0.85},
                  {fraction: 0.16, alpha: 0.75, epsilon: 0.85}]}
    - {node: wing_py, wing: py, side: back, area_m2: 0.143, alpha: 0.75, epsilon: 0.85}
    - {node: wing_my, wing: my, side: front, area_m2: 0.143, array_face: wing_my,
       coatings: [{fraction: 0.84, alpha: 0.91, epsilon: 0.85},
                  {fraction: 0.16, alpha: 0.75, epsilon: 0.85}]}
    - {node: wing_my, wing: my, side: back, area_m2: 0.143, alpha: 0.75, epsilon: 0.85}

  conductors:   # G [W/K]
    - {a: panel_px, b: structure, g_w_per_k: 1.5}
    - {a: panel_mx, b: structure, g_w_per_k: 1.5}
    - {a: panel_py, b: structure, g_w_per_k: 1.0}
    - {a: panel_my, b: structure, g_w_per_k: 1.0}
    - {a: panel_pz, b: structure, g_w_per_k: 0.6}
    # The nadir (-Z) face is the IMAGER's radiator: it and the imager form a
    # thermal island on low-conductance (titanium / G10) mounts, so the 15 W
    # of the cooler and the bus electronics do not raise the FPA's sink —
    # without that isolation the cooler could not hold -15 C with the payload
    # in STANDBY (cooler running) and the whole bus at +20..+30 C.
    # (2026-11-03: STANDBY no longer runs the cooler; the island still
    # matters while imaging and in the hot case.)
    - {a: panel_mz, b: structure, g_w_per_k: 0.04}
    - {a: wing_py, b: panel_py, g_w_per_k: 0.05, note: "hinges + HDRM"}
    - {a: wing_my, b: panel_my, g_w_per_k: 0.05}
    # Avionics stack on its rails: 3 W of OBC self-heating puts it ~5 K
    # above the structure; the 4 W heater has 6.7 K of authority.
    - {a: obc, b: structure, g_w_per_k: 0.6}
    # Battery on the +Y wall — the anti-sun face for EOSAT-1's negative beta
    # (sun on -Y all year) — on standoffs to the frame, so it runs colder
    # than the electronics and its thermostat cycles (brief 05 WP-3 intent).
    - {a: battery, b: panel_py, g_w_per_k: 0.25}
    - {a: battery, b: structure, g_w_per_k: 0.05}
    - {a: ttc, b: structure, g_w_per_k: 0.8}
    # The imager is bolted to its nadir radiator / baseplate (aperture side)
    # and isolated from the frame.
    - {a: payload, b: panel_mz, g_w_per_k: 1.5}
    - {a: payload, b: structure, g_w_per_k: 0.02}
    - {a: aocs, b: structure, g_w_per_k: 1.0}
    - {a: prop, b: structure, g_w_per_k: 0.4}
    - {a: prop, b: panel_mx, g_w_per_k: 0.3, note: "thruster on -X"}
    - {a: thruster, b: prop, g_w_per_k: 0.0417}

  radiative:    # internal radiation, (eps A)_eff [m2]
    - {a: panel_px, b: structure, ea_m2: 0.03}
    - {a: panel_mx, b: structure, ea_m2: 0.03}
    - {a: panel_py, b: structure, ea_m2: 0.015}
    - {a: panel_my, b: structure, ea_m2: 0.015}
    - {a: panel_pz, b: structure, ea_m2: 0.01}
    - {a: panel_mz, b: structure, ea_m2: 0.003, note: "low-e (VDA) back of the imager radiator"}
    - {a: obc, b: structure, ea_m2: 0.01}

  # Where each EPS line's power becomes heat (shares of I x V as EPS bills
  # it). Heater lines are NOT here: TCS applies its own heater state, so an
  # open-circuit heater bills but does not heat. The catbed heater share of
  # the prop line is likewise applied to `thruster` by TCS.
  dissipation:
    obc: {obc: 0.5, structure: 0.5}   # OBC 3 W + PDU/EPS housekeeping 3 W (eps.yaml)
    ttc_rx: {ttc: 1.0}
    ttc_tx: {ttc: 0.85}               # ~15 % of the DC draw leaves as RF (0.5 W of 5 W, 2 W of 11 W)
    payload: {payload: 1.0}
    fpa_cooler: {structure: 1.0}      # cooler rejects to the frame / heat-pipe saddle
    aocs_wheels: {aocs: 1.0}
    prop: {prop: 1.0}                 # valve drivers (catbed heater -> thruster)
  # Bus load not attributed to a line (measurement noise, an injected bus
  # short) is dissipated here.
  residual_node: structure
  heater_nodes: {battery: battery, obc: obc, thruster: thruster}
  # Battery heat = I^2 R + (1 - charge efficiency) x charge power, read off
  # the live EPS model (eps.yaml internal_r_ohm / charge_efficiency).
  battery_heat: {node: battery}
  fpa: {sink_node: payload}
  wing_panels: {wing_py: panel_py, wing_my: panel_my}
  stowed_wing_contact_w_per_k: 1.0
  # Loads assumed when TCS runs with no EPS in the loop (bare unit-test
  # harness): nominal standby (OBC 6, RX 1.5, AOCS NOMINAL 9, payload idle).
  default_dissipation_w: {obc: 3.0, structure: 3.0, ttc: 1.5, aocs: 9.0, payload: 2.4}

  # Instructor `cold_soak` (FailureSpec in tcs_basic): an extra heat leak
  # G x offset out of the zone — as if its mounting interface were `offset`
  # colder — plus an immediate step of the zone by `offset`. G is the zone's
  # own mounting conductance, so the passive zone settles about `offset`
  # below where it was and its heater recovers P_heater / G of it.
  # Defaults re-derived on this network (THERMAL_MODEL.md §5):
  cold_soak:
    conductance_w_per_k: {battery: 0.30, obc: 0.6, thruster: 0.0417}
    # OBC: the leak G x offset (12 W at -20 K) also drains the frame through
    # the OBC's mount, so the zone moves ~1.4 x the offset. From the nominal
    # OBC with the cooler off (~+15 C) -20 K lands it near -13 C passive
    # (yellow, below the -10 C heater ON point) and the 4 W heater brings it
    # back to the -10/-5 C thermostat band. -25 K (the old default) leaves it
    # yellow even with the heater on; -40 K is red either way. Battery and
    # thruster keep -25 K: their heaters (27 K and 288 K of authority) win it
    # back. Measured: OBC_THERMAL_ANALYSIS.md "After the thermal network".
    default_offset_c: {battery: -25.0, obc: -20.0, thruster: -25.0}

# Event thresholds
#
# The `fpa` rows are DERIVED from fpa_envelope above — do not hand-edit them.
# They used to be [-50, -5] warn / [-60, 0] alarm, which is not a limit band
# at all: it is an imaging-readiness band, and tcs_basic was using it as one
# (`fpa_ready = warn_low <= T <= warn_high`). That conflation is why the FPA
# had five answers. Readiness is now computed from the ACTIVE setpoint plus
# fpa_envelope.imaging_max_c, and these rows carry the health band that
# brackets every legitimate state — cooled anywhere in the command envelope,
# and uncooled.
event_thresholds:
  temperature_warning:
    battery: [0.0, 40.0]    # [low_warn_C, high_warn_C]
    obc: [-10.0, 50.0]     # 2026-11: was [5, 50]; hardware-based (mcs/limits.yaml)
    fpa: [-22.0, 14.0]      # derived: setpoint_min - 3sigma - 1.5 .. uncooled_max + 1.5
  temperature_alarm:
    battery: [-10.0, 50.0]
    obc: [-20.0, 60.0]     # 2026-11: was [-5, 60]
    fpa: [-25.5, 17.5]      # derived: setpoint_min - 3sigma - 5.0 .. uncooled_max + 5.0
  thermal_runaway_rate_deg_per_min: 2.0

param_ids:
  temp_panel_px: 0x0400
  temp_panel_mx: 0x0401
  temp_panel_py: 0x0402
  temp_panel_my: 0x0403
  temp_panel_pz: 0x0404
  temp_panel_mz: 0x0405
  temp_obc: 0x0406
  temp_battery: 0x0407
  temp_fpa: 0x0408
  temp_thruster: 0x0409   # catalyst bed — the propulsion arm interlock reads this
  htr_battery: 0x040A
  htr_obc: 0x040B
  cooler_fpa: 0x040C
  htr_thruster: 0x041B    # Phase D: NOT 0x040D (that id is ttc.pa_backup_temp)
  htr_duty_battery: 0x040E
  htr_duty_obc: 0x040F
  htr_total_power_w: 0x0411
  decontamination_active: 0x0418
  thermal_gradient: 0x0419
