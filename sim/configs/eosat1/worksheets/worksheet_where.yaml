# worksheet_where.yaml — where each workbook question is answered.
#
# Hand-maintained (worksheet screen audit, 2026-11-04). tools/gen_worksheets.py
# reads it, sets `where` on the questions of ops_week3.yaml (the logbook shows
# them as "Where to find this" links) and, with --audit, writes the audit
# table of docs/plan_2026-11/WORKSHEET_SCREEN_AUDIT_OPS.md. Edit here, then:
#
#     python3 tools/gen_worksheets.py && python3 tools/gen_worksheets.py --audit
#
# targets   named places on the screens (tool + page/panel), or in the
#           documentation viewer (path + heading anchor, or a procedure id)
#             tool: mcs        page (rail id), param 0xHHHH (row of the page's
#                              Parameters table), focus (element id), tab (PUS
#                              tab), bd (bottom-drawer tab)
#             tool: planner | orbit | radio | delayed_tm   focus (element id),
#                              path (a page of the tool, e.g. reports)
#             tool: docs       path under configs/eosat1 + anchor, or proc: ID
#           tests/test_content/test_worksheet_where.py checks that every one
#           exists (page, element id, heading anchor, procedure).
# links     open references outside the tools (https only; they open in a new
#           window). Mirrored, with the reason and the check date, in
#           docs/plan_2026-11/EXTERNAL_LINKS.md.
# sheets    per worksheet, per question:
#             key      "step N" (a confirm-each-step row) or the start of the
#                      English question text (without its "N. " number);
#                      a key that matches nothing stops the generator
#             status   screen  — a tool screen shows it (where says which)
#                      manual  — only the manual / a procedure card says it
#                      none    — nothing in the system answers it (fix or
#                                deferred says what happens)
#                      na      — not a lookup: an observation, a decision,
#                                a reflection, a signature, room logistics
#             before   the status before the 2026-11-04 audit, when it changed
#             where    target keys, link keys, param:0xHHHH, or inline places
#             gap, fix, deferred   audit notes (the audit table's columns)
#             auto     false: do not add the parameter rows the question names
#             off_screen  ids the question may name although the operator
#                      dictionary does not carry them (needs a gap)
#           default    applies to every question of the sheet without a key.
# A question that names a parameter (0xHHHH or its name) the operator
# dictionary carries is linked to that parameter's row with no entry; any
# other question needs a status here.

