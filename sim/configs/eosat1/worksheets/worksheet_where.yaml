    label: {en: "Eb/N0 and bit error rate (Wikipedia)", fr: "Eb/N0 et taux d'erreur binaire (Wikipédia, en anglais)"}
  wiki-linkbudget:
    url: https://en.wikipedia.org/wiki/Link_budget
    label: {en: "Link budget (Wikipedia)", fr: "Bilan de liaison (Wikipédia, en anglais)"}
  wiki-dop:
    url: https://en.wikipedia.org/wiki/Dilution_of_precision
    label: {en: "Dilution of precision, PDOP (Wikipedia)", fr: "Dilution de la précision, PDOP (Wikipédia, en anglais)"}
  nasa-soa:
    url: https://www.nasa.gov/smallsat-institute/sst-soa
    label: {en: "NASA — State of the Art of Small Spacecraft Technology", fr: "NASA — état de l'art des technologies des petits satellites (en anglais)"}

sheets:
  # ── WB-5.0 Orientation check (before Monday: the manual) ────────────────
  WB-5.0:
    default: {status: na}
    items:
      "EOSAT-1 platform": {status: manual, where: [doc.overview.bus, nasa-soa]}
      "Orbit altitude": {status: screen, where: [orbit.elements, doc.overview.orbit, esa-orbits]}
      "Orbit inclination": {status: screen, where: [orbit.elements, planner.orbit, doc.overview.orbit]}
      "Local time of ascending node":
        status: screen
        before: manual
        where: [orbit.elements, doc.overview.orbit, wiki-sso]
        gap: "Only the manual gave the LTAN; Orbit tools showed a RAAN 90° off (atan2 arguments swapped), so the LTAN could not be checked from a screen."
        fix: "Orbit tools: RAAN fixed, LTAN shown under Orbit at epoch."
      "Mission band": {status: manual, where: [doc.overview.objectives, doc.payload.chars]}
      "Number of imager bands": {status: manual, where: [doc.payload.chars]}
      "Ground stations": {status: screen, where: [mcs.ttc.gs, doc.overview.gs]}
      "Battery capacity": {status: manual, where: [doc.eps.battery]}
      "Battery chemistry": {status: manual, where: [doc.eps.battery]}
      "Instrument swath": {status: screen, where: [param:0x0619, param:0x0628, doc.payload.chars]}
      "Pointing requirement in NOMINAL": {status: manual, where: [doc.aocs.modes]}
      "Pointing requirement in FINE_POINT": {status: manual, where: [doc.aocs.modes]}
      "Propulsion": {status: manual, where: [doc.orbit.prop]}
      "Flight Director": {status: manual, where: [doc.overview.positions, doc.desk]}
      "SPACON": {status: manual, where: [doc.overview.positions, doc.desk]}
      "AOCS Engineer": {status: manual, where: [doc.overview.positions, doc.desk]}
      "EPS Engineer": {status: manual, where: [doc.overview.positions, doc.desk]}
      "Thermal Engineer": {status: manual, where: [doc.overview.positions, doc.desk]}
      "TT&C Engineer": {status: manual, where: [doc.overview.positions, doc.desk]}
      "Payload Operations": {status: manual, where: [doc.overview.positions, doc.desk]}
      "FDS / Orbit Analyst": {status: manual, where: [doc.overview.positions, doc.desk]}
      "Ground Segment Engineer": {status: manual, where: [doc.overview.positions]}
      "Mission Manager": {status: manual, where: [doc.overview.positions]}

  # ── WB-5.1 Position score cards ─────────────────────────────────────────
  WB-5.1:
    default: {status: na}
    items:
      "Polled positions": {status: screen, where: [mcs.gonogo, doc.desk.gonogo]}
      "Responses recorded": {status: screen, where: [mcs.gonogo]}
      "SoC at eclipse entry": {status: screen, where: [param:0x0101, mcs.eps.eclipse]}
      "Next eclipse duration":
        status: screen
        where: [mcs.eps.eclipse, planner.eclipse, orbit.eclipses]
        gap: "The MCS said only \"eclipse in N min\"; the duration was on the planner. The printed range (33.2–35.2 min) did not say where to read it."
        fix: "MCS EPS page, Projections: Next eclipse (entry–exit, duration), ground propagation. Printed row reworded."
      "Predicted SoC at exit": {status: screen, where: [mcs.eps, param:0x0106, doc.eps.budget]}
      "Cross-check vs the console": {status: screen, where: [mcs.eps.flow], gap: "Was \"vs eclipse model\": the console calls it the power-flow prediction \"at eclipse exit\".", fix: "Reworded to name the screen."}
      "Heater with highest duty": {status: screen, where: [mcs.tcs.equip, param:0x040E, param:0x040F]}
      "Duty": {status: screen, where: [mcs.tcs.equip]}
      "Predicted next-eclipse duty": {status: manual, where: [mcs.trnd, doc.tcs.heater]}
      "Will it saturate": {status: na}
      "Reading": {status: screen, where: [param:0x0217]}
      "In band": {status: screen, where: [param:0x0217, doc.aocs.modes]}
      "Next Iqaluit pass":
        status: screen
        where: [orbit.passes, planner.contacts, planner.nextpass]
        gap: "Orbit tools listed AOS, duration and max elevation only; TCA was only in the planner's next-pass card, LOS only in the planner table."
        fix: "Orbit tools pass list: AOS, TCA and LOS to the second. Printed task now says read, not compute, and names both screens."
      "Agreement with the planner": {status: screen, where: [orbit.passes, planner.contacts], gap: "Named \"MPS\"; the screen is the Mission planner.", fix: "Reworded."}
      "SAFE rate": {status: screen, where: [doc.ttc.ladder, mcs.cmd]}
      "Routine LOW rate": {status: screen, where: [param:0x0506, param:0x0539, doc.ttc.ladder]}
      "Dump HIGH rate": {status: screen, where: [doc.ttc.ladder]}
      "Link margin post-transition": {status: screen, where: [param:0x0503, mcs.ttc.link]}
      "BER reading": {status: screen, where: [param:0x050C, radio.rf, wiki-ebn0]}
      "Station in contact":
        status: screen
        where: [mcs.ttc.gs]
        gap: "Asked for ttc.active_gs (0x0523), which the operator dictionary does not carry (ground scheduling knowledge)."
        fix: "Reworded to the TT&C page's Ground station network, which marks the station in contact."
      "Baseband config": {status: screen, where: [radio.datalink, radio.budget, param:0x053B, doc.ttc.ladder], gap: "\"Baseband config\" named no screen.", fix: "Reworded to the radio view's Data link and Link budget."}
      "Imaging target chosen": {status: screen, where: [planner.imaging]}
      "At setpoint": {status: screen, where: [param:0x0610, mcs.pld.capture]}
      "Monitor selected": {status: screen, where: [mcs.fdir.s12]}
      "Trigger parameter": {status: screen, where: [mcs.fdir.s12]}
      "Threshold": {status: screen, where: [mcs.fdir.s12]}
      "Persistence":
        status: screen
        before: none
        where: [mcs.fdir.s12, doc.fdir.s12]
        gap: "The S12 table had no persistence (repetition) column."
        fix: "FDIR page S12 table: Persistence column (consecutive 1 Hz checks)."
      "Severity":
        status: screen
        before: none
        where: [mcs.fdir.s12]
        gap: "The S12 table had no severity column."
        fix: "FDIR page S12 table: Severity column."
      "Recommended procedure":
        status: screen
        before: none
        where: [mcs.fdir.s12, doc.fdir.matrix]
        gap: "The monitor-to-procedure link existed only on a raised alarm."
        fix: "FDIR page S12 table: Procedure column (alarm_procedures.yaml), a link that opens the card."
      "Bits set": {status: screen, where: [mcs.prp.inhibit]}
      "Gate blocking the arm": {status: screen, where: [mcs.prp.inhibit, doc.orbit.prop]}

  # ── WB-5.3-PP Pass-plan team exercise (planner work) ────────────────────
  WB-5.3-PP:
    default: {status: na}
    items:
      "Target pass": {status: screen, where: [planner.contacts, orbit.passes]}
      "TCA time": {status: screen, where: [orbit.passes, planner.nextpass]}
      "LOS time": {status: screen, where: [orbit.passes, planner.contacts]}
      "Pass duration": {status: screen, where: [planner.contacts, orbit.passes]}
      "Procedures to run": {status: manual, where: [mcs.proc, doc.orbit.sched]}
      "Imaging target ID": {status: screen, where: [planner.imaging, doc.orbit.targets]}
      "Imaging window inside pass": {status: screen, where: [planner.imaging, planner.timeline]}
      "Bands selected": {status: manual, where: [doc.payload.chars]}
      "Predicted ground swath": {status: screen, where: [param:0x0619, doc.payload.chars]}
      "Downlink rate planned": {status: screen, where: [planner.data, doc.ttc.ladder]}
      "Expected downlink duration":
        status: screen
        before: none
        where: [mcs.ttc.dump, planner.data]
        gap: "No screen turned a data volume into a dump time; it was arithmetic on the planner's figures."
        fix: "MCS TTC page, Projections: time to dump the stored image products at LOW and HIGH (payload.product_mb ÷ the rate ladder)."
      "Plausible failure 1": {status: manual, where: [doc.fdir.matrix]}
      "Recovery procedure for failure 1": {status: manual, where: [doc.fdir.matrix]}
      "Plausible failure 2": {status: manual, where: [doc.fdir.matrix]}
      "Recovery procedure for failure 2": {status: manual, where: [doc.fdir.matrix]}

  # ── Day 2 ───────────────────────────────────────────────────────────────
  WB-5.4-N001:
    items:
      "step 5": {status: screen, where: [mcs.pus.s3, mcs.fdir.journal]}
      "step 7": {status: screen, where: [mcs.gonogo, doc.desk.gonogo]}
      "Off-nominal items observed": {status: na}
  WB-5.4-C003:
    items:
      "step 1": {status: na, where: [radio.lock, radio.rf]}
      "step 4": {status: screen, where: [param:0x0501, mcs.ttc.lock]}
      "step 6": {status: screen, where: [mcs.cmdhist, mcs.log]}
      "Step at which link was recovered": {status: na}
      "Anomaly ticket number": {status: na}
  WB-5.4-N012:
    items:
      "Phase and time": {status: screen, where: [param:0x0129, mcs.ovr]}
      "Last completed pass": {status: screen, where: [mcs.next, planner.contacts]}
      "Open anomalies": {status: screen, where: [mcs.fdir.journal, mcs.fdir.s12]}
      "Open work items": {status: screen, where: [mcs.proc]}
      "Next pass": {status: screen, where: [mcs.next, planner.contacts]}
      "Customer commitments active":
        status: screen
        before: none
        where: [planner.sched, planner.imaging]
        gap: "\"Customer commitments\" is a concept no tool has."
        fix: "Reworded: the imaging and downlinks booked in the planner's activity schedule."
      "GO authorisations outstanding": {status: screen, where: [mcs.gonogo]}
      "Voice-loop tone": {status: na, where: [ecss-ops]}
  WB-5.4-VL:
    default: {status: na}
  WB-5.4-FD:
    items:
      "Station · AOS":
        status: screen
        where: [orbit.passes, planner.contacts, celestrak-tle]
        gap: "Asked to compare with the \"MPS\" (the planner) and named a command line, not the page."
        fix: "Reworded to Orbit tools and the planner's Next contacts."
      "Max el":
        status: screen
        where: [orbit.passes, planner.contacts, doc.orbit.passdur]
        fix: "\"from MPS\" reworded to the planner."
      "Formula used": {status: manual, where: [doc.orbit.passdur, wiki-elements]}
      "Longest eclipse in next 24 h":
        status: screen
        before: none
        where: [orbit.eclipses, planner.timeline, doc.orbit.eclipse]
        gap: "No screen listed eclipse durations beyond the next one; the longest of 24 h had to be guessed from the planner's timeline."
        fix: "Orbit tools: Eclipses panel (entry, exit, duration over 24 h, longest marked)."
      "Predicted SoC at exit": {status: screen, where: [mcs.eps.flow, param:0x0101, param:0x0106]}
      "Actual SoC at exit": {status: screen, where: [param:0x0101, mcs.trnd]}
      "Δ": {status: na}
      "Concern?": {status: na}

  # ── Day 3: LEOP ─────────────────────────────────────────────────────────
  WB-5.5-PB:
    default: {status: na}
    items:
      "BP-2": {status: screen, where: [param:0x0129, param:0x0311]}
      "A real Iqaluit pass": {status: screen, where: [planner.contacts, mcs.next]}
      "FD has loaded LEOP procedure pack": {status: screen, where: [mcs.proc]}
      "SPACON has reviewed the FDIR rule set": {status: screen, where: [mcs.fdir.s12, mcs.fdir.s19, doc.fdir.rules]}
      "AOCS has reviewed residual tumble rates": {status: manual, where: [doc.leop.first], gap: "Before first contact there is no AOCS telemetry: the rates are the LEOP guide's prediction.", fix: "Linked to the LEOP guide."}
      "EPS confirms SoC": {status: screen, where: [mcs.eps.flow]}
      "TT&C has confirmed UHF beacon reception":
        status: screen
        before: none
        where: [mcs.pus.s3, mcs.see]
        gap: "Asked for ttc.beacon_active (0x0527 = 1), which the operator dictionary does not carry."
        fix: "Reworded to what the console shows: beacon SID 11 arriving (PUS page, S3 HK, Observed)."
      "Ground Seg has confirmed Iqaluit antenna": {status: screen, where: [radio.datalink, radio.lock, doc.leop.first]}
      "FDS has produced 24-h pass schedule": {status: screen, where: [planner.contacts, orbit.passes]}
  WB-5.5-L001:
    items:
      "step 1": {status: screen, where: [radio.lock, radio.datalink, planner.nextpass]}
      "step 2": {status: screen, where: [mcs.cmdhist, mcs.pus.s3]}
      "step 8": {status: screen, where: [mcs.cmdhist, mcs.events, planner.contacts]}
      "AOS time": {status: screen, where: [mcs.next, planner.contacts]}
      "First accepted TC": {status: screen, where: [mcs.cmdhist]}
      "App boot complete": {status: screen, where: [mcs.events, mcs.obd.sw]}
  WB-5.5-L006:
    items:
      "step 2":
        status: screen
        before: none
        where: [mcs.pus.s9, mcs.pus.owlt, mcs.ttc.gs]
        gap: "The row computed OWLT from ttc.range_km (0x0509), which no HK SID carries and the console does not show."
        fix: "PUS page, S9 TIME: one-way light time from the ground's own geometry; TT&C page, Ground station network: range and OWLT. Printed row and LEOP-006 card reworded."
      "step 3":
        status: screen
        before: none
        where: [mcs.pus.s9, doc.time.correlation]
        gap: "The delta needed OWLT, which no screen gave."
        fix: "PUS page, S9 TIME: Δt = T_obc − (T_ground − OWLT)."
      "step 4": {status: screen, where: [mcs.pus.s9, mcs.cmdhist]}
      "step 5": {status: screen, where: [mcs.pus.s9, param:0x0A13]}
      "step 6": {status: screen, where: [mcs.pus.s9, doc.time.drift]}
  WB-5.5-L002:
    items:
      "step 6": {status: na}
      "Consolidated PASS / FAIL": {status: na}
      "If FAIL, which contingency": {status: manual, where: [doc.fdir.matrix]}
  WB-5.5-L007:
    items:
      "step 4": {status: screen, where: [param:0x025E, mcs.cmdhist]}
      "SoC": {status: screen, where: [param:0x0101, param:0x0407]}
  WB-5.5-L005:
    items:
      "step 6": {status: screen, where: [mcs.aocs, mcs.eps.flow]}
  WB-5.5-L003:
    items:
      "step 1": {status: screen, where: [mcs.aocs.gps, wiki-dop]}
      "step 3":
        status: screen
        where: [mcs.aocs.gpsmag, mcs.aocs.gps]
        gap: "The six components were on screen; the magnitudes the row checks were arithmetic."
        fix: "AOC page, GPS navigation: |r| (km) and |v| (m/s) computed from the downlinked components."
      "step 4":
        status: screen
        before: none
        where: [orbit.sv, orbit.elements, celestrak-tle, wiki-elements]
        gap: "Orbit tools treated the GPS ECEF state as inertial (inclination ~3.5° and period ~3 min off for EOSAT-1) and showed RAAN 90° off, with no LTAN: every check of this row failed or could not be made."
        fix: "Orbit tools: ECEF→ECI with Earth rotation, RAAN/AOP formulas fixed, LTAN shown."
      "step 6": {status: na, where: [orbit.passes]}
      "step 7": {status: screen, where: [mcs.gonogo, param:0x0129, mcs.events]}
  WB-5.5-AT:
    default: {status: na}
    items:
      "Ticket ID": {status: screen, where: [mcs.fdir.journal]}
      "Pass / shift": {status: screen, where: [mcs.next]}
      "Date / UTC time": {status: screen, where: [mcs.fdir.journal]}
      "Triggering parameter": {status: screen, where: [mcs.fdir.journal]}
      "FDIR rule that fired": {status: screen, where: [mcs.fdir.journal, mcs.fdir.s19]}
      "Severity (0–4)": {status: screen, where: [mcs.fdir.state, doc.fdir.alarms]}
      "First-action time": {status: screen, where: [mcs.cmdhist]}
      "Procedure invoked": {status: screen, where: [mcs.proc, mcs.fdir.journal]}
      "Recovery actions taken": {status: screen, where: [mcs.cmdhist, mcs.log]}
      "Open items for next shift": {status: na}
  WB-5.5-GO:
    default: {status: na}
    items:
      "Onboard time set": {status: screen, where: [mcs.pus.s9]}
      "Heater lines energised": {status: screen, where: [param:0x0115, param:0x0116]}
      "AOCS wheels line ON": {status: screen, where: [param:0x0117, mcs.aocs.mode]}
      "Body rates": {status: screen, where: [param:0x0204, param:0x0205, param:0x0206]}
      "Anomaly ticket filed": {status: na}
      "Phase advanced to COMMISSIONING": {status: screen, where: [param:0x0129, mcs.cmdhist]}
  WB-5.5-OBS:
    default: {status: na}
    items:
      "MCS chat": {status: screen, where: [mcs.log]}
      "GO/NO-GO protocol followed": {status: screen, where: [mcs.gonogo]}
      "Anomaly detection time": {status: screen, where: [mcs.fdir.journal, mcs.cmdhist]}
      "Command discipline": {status: screen, where: [mcs.cmdhist]}
      "Procedure adherence": {status: na, where: [ecss-ops]}
  WB-5.5-HO:
    default: {status: na}
    items:
      "Current parameter values": {status: screen, where: [mcs.ovr]}
      "Current procedure state": {status: screen, where: [mcs.proc]}
      "Console page left open":
        status: screen
        before: none
        where: [mcs.ovr]
        gap: "Asked for a \"pinned widget\": neither console has pinned widgets."
        fix: "Reworded: the console page and panel left open for the next operator."
      "Time": {status: screen, where: [mcs.ovr]}
  WB-5.5-DB:
    default: {status: na}

  # ── Day 4: commissioning ────────────────────────────────────────────────
  WB-5.6-PB:
    default: {status: na}
    items:
      "All 13 commissioning procedures": {status: screen, where: [mcs.proc]}
      "Payload Ops has reviewed": {status: manual, where: [{tool: docs, proc: COM-009, label: {en: "Procedure COM-009", fr: "Procédure COM-009"}}, {tool: docs, proc: COM-012, label: {en: "Procedure COM-012", fr: "Procédure COM-012"}}]}
      "First Light target candidate": {status: screen, where: [planner.imaging]}
  WB-5.6-C001:
    items:
      "step 4": {status: screen, where: [param:0x0107, param:0x0101, param:0x0105, mcs.eps.eclipse]}
      "step 5": {status: screen, where: [param:0x0107, param:0x0101, mcs.eps.eclipse]}
      "step 6":
        status: screen
        where: [mcs.eps.margin, mcs.eps.flow, doc.eps.budget]
        gap: "The orbit balance was in Wh (power flow, This orbit); the row asks for a margin in W."
        fix: "EPS page, Projections: orbit-average margin (W)."
      "GO COM-002": {status: na}
  WB-5.6-C002:
    items:
      "step 2": {status: screen, where: [mcs.trnd, param:0x0406, param:0x0407]}
      "step 3": {status: screen, where: [mcs.trnd, mcs.eps.eclipse]}
      "step 8":
        status: screen
        where: [mcs.trnd, doc.tcs.zones]
        gap: "Trends plots each zone over a chosen window; minimum, maximum and mean are read off the plot or the CSV export."
        fix: "Linked to Trends (24 h window, EXPORT CSV)."
      "GO COM-005": {status: na}
  WB-5.6-C005:
    items:
      "step 4": {status: screen, where: [param:0x020F, mcs.aocs.mode]}
      "step 8": {status: na, where: [mcs.cmdhist, mcs.trnd]}
  WB-5.6-C006:
    items:
      "step 2b": {status: screen, where: [mcs.cmd, mcs.ttc.gs]}
      "step 3": {status: screen, where: [param:0x0501, param:0x0502, param:0x0500]}
      "step 5": {status: screen, where: [param:0x0501, param:0x0502, param:0x0500]}
      "step 7": {status: screen, where: [mcs.ttc.gs, param:0x0503, planner.contacts]}
      "step 8": {status: screen, where: [mcs.ttc.link, doc.ttc.stations, wiki-linkbudget]}
  WB-5.6-C007:
    items:
      "step 8": {status: screen, where: [param:0x0300, mcs.obd.sw]}
      "step 9": {status: na, where: [mcs.obd]}
  WB-5.6-C008:
    items:
      "step 1": {status: screen, where: [mcs.fdir.s12, mcs.pus.s12, ecss-pus]}
  WB-5.6-C009:
    items:
      "step 9": {status: na, where: [mcs.pld]}
      "GO COM-010": {status: na}
  WB-5.6-C010:
    items:
      "step 9": {status: screen, where: [mcs.trnd]}
      "GO COM-011": {status: na}
  WB-5.6-FPA:
    items:
      "T_fpa": {status: screen, where: [param:0x0601, param:0x0602, mcs.trnd]}
  WB-5.6-C011:
    items:
      "step 8": {status: none, where: [doc.payload.storage], gap: "The mean DN of a frame is an image-processing result: no tool reads the downlinked frames.", deferred: "Needs an image quick-look on the ground (a delayed-TM or payload tool); out of this audit's scope."}
      "GO COM-012": {status: na}
  WB-5.6-C012:
    items:
      "step 4": {status: screen, where: [param:0x0600]}
      "If deferred, justification": {status: na}
  WB-5.6-FL:
    default: {status: na}
    items:
      "Image ID": {status: screen, where: [param:0x060C, param:0x0605]}
      "Target name": {status: screen, where: [planner.imaging]}
      "Acquisition UTC": {status: screen, where: [mcs.events]}
      "AOCS mode at acquisition": {status: screen, where: [param:0x020F, mcs.trnd]}
      "FPA temperature at acquisition": {status: screen, where: [param:0x0601, mcs.trnd]}
      "Integration time per band": {status: manual, where: [mcs.cmdhist, doc.payload.chars], gap: "The integration times are what was commanded (command history); no parameter reports them."}
      "Image size": {status: screen, where: [param:0x060B, param:0x0647]}
      "Mean DN per band": {status: none, gap: "Image-processing result; no tool reads the frames.", deferred: "Needs an image quick-look tool."}
      "Cloud cover": {status: none, gap: "Image-processing result; no tool reads the frames.", deferred: "Needs an image quick-look tool."}
  WB-5.6-MA:
    default: {status: na}
    items:
      "First indicator time": {status: screen, where: [mcs.fdir.journal, mcs.cmdhist]}
  WB-5.6-GO:
    default: {status: na}
    items:
      "Phase advanced to COMMISSIONING": {status: screen, where: [param:0x0129, mcs.cmdhist]}
      "EPS checkout complete": {status: na, where: [mcs.eps]}
      "AOCS NOMINAL": {status: screen, where: [param:0x020F, param:0x0217]}
      "FDIR rule set verified": {status: screen, where: [mcs.fdir.s12, mcs.fdir.s19]}
      "First Light image acquired": {status: screen, where: [param:0x0605]}
  WB-5.6-OBS:
    default: {status: na}
  WB-5.6-HO:
    default: {status: na}
    items:
