# worksheet_map.yaml — where each course-workbook worksheet is offered.
#
# Hand-maintained. tools/gen_worksheets.py reads this map, parses the named
# worksheets out of the OrbitNorth Week 3 workbook (EN + FR twin under
# design/docs/course/) and writes ops_week3.yaml next to this file. Edit
# here, then re-run:
#
#     python3 tools/gen_worksheets.py
#
# Only the worksheets listed below are generated. Per worksheet:
#   phase        prep | during | debrief | exercise
#   tools        tools that offer it: mcs, delayed_tm, orbit, radio, docs,
#                instructor, portal
#   procedures   offered when this procedure is open (MCS procedure panel)
#   pages        offered on these MCS pages
#   scenarios    offered for these scenarios (file stem in scenarios/);
#                the instructor briefing/debrief panes use this
#   context_keys offered first when the context carries one of these keys
#                (alarm_id: an alarm is selected; anomaly: a delayed-TM
#                anomaly or report row)
# A worksheet with no procedures, pages or scenarios is offered everywhere
# in its tools.
#
# How the logbook presents it (logbook.js "Workbook" tab):
#   form         anomaly | scorecard | handover | briefing | debrief — a form
#                filled and saved as one logbook record. Sheets without a
#                form are offered question by question; a confirm-each-step
#                sheet becomes the live checklist of its procedure card.
#   instances    true: several filled copies (one per anomaly, per position)
#   prefill      {English question text: key} — the tool fills these from
#                its console state when the form opens (the operator edits
#                or clears them). Keys the MCS knows: ticket_id, pass,
#                alarm_time, param_value, fdir_rule, severity, position,
#                first_action, procedure, procedure_state, params_top3,
#                open_items, now, fdir_active, phase_time, last_pass,
#                open_alarms, next_pass, gonogo_open, gonogo, next_aos.
#                A label that no longer matches a question stops the
#                generator: edit the map when the workbook changes.
#
# Where each question is answered (the logbook's "Where to find this" links)
# and whether the screens answer it at all is the other input,
# worksheet_where.yaml next to this file (worksheet screen audit, 2026-11-04).

source: design/docs/course/orbit_north_week3_workbook.md
source_fr: design/docs/course/fr/orbit_north_week3_workbook.md

worksheets:
  # ── orientation ─────────────────────────────────────────────────────────
  WB-5.0: {phase: prep, tools: [portal, docs]}

  # ── Day 1: position round-robin, pass-plan exercise ─────────────────────
  # (added 2026-11-04 with the worksheet screen audit: these sheets are
  # worked on the screens, so they carry "where to find this" links)
  WB-5.1: {phase: exercise, tools: [mcs, orbit, radio, docs]}
  WB-5.3-PP: {phase: exercise, tools: [mcs, orbit]}

  # ── Day 2: nominal pass, link loss, handover, flight dynamics ───────────
  WB-5.4-N001: {phase: during, tools: [mcs], procedures: [NOM-001]}
  WB-5.4-C003: {phase: during, tools: [mcs, radio], procedures: [CTG-003]}
  WB-5.4-N012:
    phase: during
    tools: [mcs]
    procedures: [NOM-012]
    form: handover
    prefill:
      Phase and time: phase_time
      Last completed pass: last_pass
      Open anomalies: open_alarms
      Open work items: procedure_state
      Next pass: next_pass
      GO authorisations outstanding: gonogo_open
  WB-5.4-FD: {phase: exercise, tools: [orbit]}
  # voice-loop drill: spoken callouts, the scenario values are on the sheet
  WB-5.4-VL: {phase: exercise, tools: [mcs, portal]}

  # ── Day 3: LEOP ─────────────────────────────────────────────────────────
  WB-5.5-PB:
    phase: prep
    tools: [mcs, instructor]
    scenarios: [first_contact, separation, separation_sequence]
    form: briefing
  WB-5.5-L001: {phase: during, tools: [mcs, radio], procedures: [LEOP-001]}
  WB-5.5-L006: {phase: during, tools: [mcs], procedures: [LEOP-006]}
  WB-5.5-L002: {phase: during, tools: [mcs], procedures: [LEOP-002]}
  WB-5.5-L007: {phase: during, tools: [mcs], procedures: [LEOP-007]}
  WB-5.5-L005: {phase: during, tools: [mcs], procedures: [LEOP-005]}
  WB-5.5-L003: {phase: during, tools: [mcs, orbit], procedures: [LEOP-003]}
  WB-5.5-AT:
    phase: during
    tools: [mcs, delayed_tm, radio]
    context_keys: [alarm_id, anomaly]
    form: anomaly
    instances: true
    prefill:
      Ticket ID (auto-assigned): ticket_id
      Pass / shift: pass
      Date / UTC time of first indicator: alarm_time
      Triggering parameter and value: param_value
      FDIR rule that fired (if any): fdir_rule
      Severity (0–4): severity
      First operator to call it (position): position
      First-action time: first_action
      Procedure invoked (ID): procedure
  WB-5.5-GO:
    phase: debrief
    tools: [mcs, instructor]
    form: scorecard
    prefill:
      Notes for debrief: gonogo
  WB-5.5-OBS: {phase: during, tools: [mcs, instructor]}
  WB-5.5-HO:
    phase: during
    tools: [mcs]
    form: handover
    instances: true
    prefill:
      Current parameter values (top 3 mnemonics): params_top3
      Current procedure state (file ID + step): procedure_state
      Open question for next shift: open_items
      Time: now
  WB-5.5-DB:
    phase: debrief
    tools: [mcs, instructor, delayed_tm, orbit, radio, portal]
    form: debrief

  # ── Day 4: commissioning ────────────────────────────────────────────────
  WB-5.6-PB:
    phase: prep
    tools: [mcs, instructor]
    scenarios: [sequential_checkout]
    form: briefing
  WB-5.6-C001: {phase: during, tools: [mcs], procedures: [COM-001]}
  WB-5.6-C002: {phase: during, tools: [mcs], procedures: [COM-002]}
  WB-5.6-C005: {phase: during, tools: [mcs], procedures: [COM-005]}
  WB-5.6-C006: {phase: during, tools: [mcs, radio], procedures: [COM-006]}
  WB-5.6-C007: {phase: during, tools: [mcs], procedures: [COM-007]}
  WB-5.6-C008: {phase: during, tools: [mcs], procedures: [COM-008]}
  WB-5.6-C009: {phase: during, tools: [mcs], procedures: [COM-009]}
  WB-5.6-C010: {phase: during, tools: [mcs], procedures: [COM-010]}
  WB-5.6-FPA: {phase: during, tools: [mcs], procedures: [COM-010]}
  WB-5.6-C011: {phase: during, tools: [mcs], procedures: [COM-011]}
  WB-5.6-C012: {phase: during, tools: [mcs], procedures: [COM-012]}
  WB-5.6-FL: {phase: during, tools: [mcs, delayed_tm], procedures: [COM-012]}
  WB-5.6-MA:
    phase: during
    tools: [mcs, delayed_tm]
    context_keys: [alarm_id, anomaly]
    form: anomaly
  WB-5.6-GO:
    phase: debrief
    tools: [mcs, instructor]
    scenarios: [sequential_checkout]
    form: scorecard
  WB-5.6-OBS: {phase: during, tools: [mcs, instructor]}
  WB-5.6-HO:
    phase: during
    tools: [mcs]
    scenarios: [sequential_checkout]
    form: handover
    instances: true
    prefill:
      Current parameter values (top 3): params_top3
      Current procedure state (file ID + step): procedure_state
      FDIR rules currently active (acknowledged): fdir_active
      Open question for next shift: open_items
      Time: now
  WB-5.6-DB:
    phase: debrief
    tools: [mcs, instructor]
    scenarios: [sequential_checkout]
    form: debrief

  # ── Appendix A: contingency confirm-each-step pages ─────────────────────
  WB-A-CTG-001: {phase: during, tools: [mcs], procedures: [CTG-001]}
  WB-A-CTG-002: {phase: during, tools: [mcs], procedures: [CTG-002]}
  WB-A-CTG-007: {phase: during, tools: [mcs], procedures: [CTG-007]}
  WB-A-CTG-008: {phase: during, tools: [mcs], procedures: [CTG-008]}
  WB-A-CTG-009: {phase: during, tools: [mcs], procedures: [CTG-009], scenarios: [eps_anomaly]}
  WB-A-CTG-010: {phase: during, tools: [mcs], procedures: [CTG-010]}
  WB-A-CTG-012: {phase: during, tools: [mcs], procedures: [CTG-012]}
  WB-A-CTG-015: {phase: during, tools: [mcs, delayed_tm], procedures: [CTG-015]}
  WB-A-CTG-017: {phase: during, tools: [mcs], procedures: [CTG-017]}
  WB-A-CTG-019: {phase: during, tools: [mcs, radio], procedures: [CTG-019]}
  WB-A-CTG-020: {phase: during, tools: [mcs, radio], procedures: [CTG-020]}

  # ── Day 5: review ───────────────────────────────────────────────────────
  # (WB-5.7-CE, the anonymous course evaluation, stays on paper: a logbook
  # record carries the author's name.)
  WB-5.7-WI: {phase: debrief, tools: [instructor, mcs, portal]}
  WB-5.7-FR: {phase: debrief, tools: [mcs, portal]}

  # ── Appendices B and C ──────────────────────────────────────────────────
  WB-B: {phase: debrief, tools: [mcs, instructor]}
  WB-C: {phase: debrief, tools: [portal]}
