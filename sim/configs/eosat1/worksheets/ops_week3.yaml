      fr: 'payload.store_used (0x0604) en hausse ; payload.mem_used_mb (0x060B) en hausse de 1.0–4.0 Mo
        depuis l''étape 3 (une image : 4 Mo brute, 1.0–2.7 Mo compressée ; 0x060B est le total, seule
        la différence compte)'
    step: '6'
    where:
    - tool: mcs
      page: pld
      param: '0x0604'
      label:
        en: MCS › PLD › payload.store_used (0x0604)
        fr: MCS › PLD › payload.store_used (0x0604)
    - tool: mcs
      page: pld
      param: '0x060B'
      label:
        en: MCS › PLD › payload.mem_used_mb (0x060B)
        fr: MCS › PLD › payload.mem_used_mb (0x060B)
  - id: q7
    kind: check
    text:
      en: '7. Back to STANDBY: PAYLOAD_SET_MODE(mode=1)'
      fr: '7. Retour en STANDBY : PAYLOAD_SET_MODE(mode=1)'
    hint:
      en: payload.mode = 1 within 15 s; tcs.cooler_fpa (0x040C) = 0 within 10 s — STANDBY switches the
        cooler off
      fr: payload.mode = 1 en 15 s ; tcs.cooler_fpa (0x040C) = 0 en 10 s — le mode STANDBY arrête le refroidisseur
    step: '7'
    where:
    - tool: mcs
      page: tcs
      param: '0x040C'
      label:
        en: MCS › TCS › tcs.cooler_fpa (0x040C)
        fr: MCS › TCS › tcs.cooler_fpa (0x040C)
    - tool: mcs
      page: pld
      param: '0x0600'
      label:
        en: MCS › PLD › payload.mode (0x0600)
        fr: MCS › PLD › payload.mode (0x0600)
  - id: q8
    kind: check
    text:
      en: '8. Downlink over Service 13: TTC_SET_DOWNLINK_MODE(on=1), TTC_SET_DATA_RATE(rate=1) (HIGH),
        S13_CREATE_TRANSFER(scene_id=1, size_mb=0), S13_REPORT_STATUS(transfer_id=T), S13_END_TRANSFER(transfer_id=T),
        TTC_SET_DATA_RATE(rate=0), TTC_SET_DOWNLINK_MODE(on=0)'
      fr: '8. Vidage par le service 13 : TTC_SET_DOWNLINK_MODE(on=1), TTC_SET_DATA_RATE(rate=1) (HIGH),
        S13_CREATE_TRANSFER(scene_id=1, size_mb=0), S13_REPORT_STATUS(transfer_id=T), S13_END_TRANSFER(transfer_id=T),
        TTC_SET_DATA_RATE(rate=0), TTC_SET_DOWNLINK_MODE(on=0)'
    hint:
      en: ttc.tm_data_rate (0x0506) = 128000 bps; TM(13,2) open report — transfer id, block count and
        CRC-32 recorded; payload.transfer_active (0x062D) = 1, payload.transfer_progress (0x062E) rising,
        then 0x062D = 0; back at 16000 bps with ttc.downlink_mode (0x053C) = 0; CRC-32 OK on the ground
      fr: ttc.tm_data_rate (0x0506) = 128000 bit/s ; rapport d'ouverture TM(13,2) — identifiant du transfert,
        nombre de blocs et CRC-32 consignés ; payload.transfer_active (0x062D) = 1, payload.transfer_progress
        (0x062E) en hausse, puis 0x062D = 0 ; retour à 16000 bit/s avec ttc.downlink_mode (0x053C) = 0
        ; CRC-32 correct au sol
    step: '8'
    where:
    - tool: mcs
      page: ttc
      param: '0x0506'
      label:
        en: MCS › TTC › ttc.tm_data_rate (0x0506)
        fr: MCS › TTC › ttc.tm_data_rate (0x0506)
    - tool: mcs
      page: pld
      param: '0x062D'
      label:
        en: MCS › PLD › payload.transfer_active (0x062D)
        fr: MCS › PLD › payload.transfer_active (0x062D)
    - tool: mcs
      page: pld
      param: '0x062E'
      label:
        en: MCS › PLD › payload.transfer_progress (0x062E)
        fr: MCS › PLD › payload.transfer_progress (0x062E)
    - tool: mcs
      page: ttc
      param: '0x053C'
      label:
        en: MCS › TTC › ttc.downlink_mode (0x053C)
        fr: MCS › TTC › ttc.downlink_mode (0x053C)
  - id: q9
    kind: check
    text:
      en: '9. First Light assessment: AOCS_SET_MODE(mode=4), HK_REQUEST(sid=2), HK_REQUEST(sid=5)'
      fr: '9. Évaluation de la première lumière : AOCS_SET_MODE(mode=4), HK_REQUEST(sid=2), HK_REQUEST(sid=5)'
    hint:
      en: 'aocs.mode = 4 within 30 s; payload.mode = 1; payload.cooler_pwr (0x0602) = 0 (cooler released
        at step 7); payload team: geometry, all four bands, no artefacts, dark current; First Light Report'
      fr: 'aocs.mode = 4 en 30 s ; payload.mode = 1 ; payload.cooler_pwr (0x0602) = 0 (refroidisseur arrêté
        à l''étape 7) ; équipe charge utile : géométrie, quatre bandes présentes, aucun artefact, courant
        d''obscurité ; rapport de première lumière'
    step: '9'
    where:
    - tool: mcs
      page: pld
      param: '0x0602'
      label:
        en: MCS › PLD › payload.cooler_pwr (0x0602)
        fr: MCS › PLD › payload.cooler_pwr (0x0602)
    - tool: mcs
      page: aocs
      param: '0x020F'
      label:
        en: MCS › AOC › aocs.mode (0x020F)
        fr: MCS › AOC › aocs.mode (0x020F)
    - tool: mcs
      page: pld
      param: '0x0600'
      label:
        en: MCS › PLD › payload.mode (0x0600)
        fr: MCS › PLD › payload.mode (0x0600)
  - id: q10
    kind: text
    text:
      en: If deferred, justification
      fr: En cas de report, justification
