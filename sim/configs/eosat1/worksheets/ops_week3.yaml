- id: WB-5.4-N001
  title:
    en: NOM-001 Pass Startup (confirm each step)
    fr: NOM-001 Ouverture de passage (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - NOM-001
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. SPACON: Verify OBC status: HK_REQUEST(sid=4) (S3.27)'
      fr: '1. SPACON : Vérifier l''état de l''OBC : HK_REQUEST(sid=4) (S3.27)'
    hint:
      en: 'obdh.mode (0x0300) = 0 (NOMINAL) and obdh.cpu_load (0x0302) < 80 % within 10 s; obdh.uptime
        (0x0308) consistent with the last known value. obdh.mode ≠ 0: abort the pass, run CTG-010'
      fr: 'obdh.mode (0x0300) = 0 (NOMINAL) et obdh.cpu_load (0x0302) < 80 % en 10 s ; obdh.uptime (0x0308)
        cohérent avec la dernière valeur connue. obdh.mode ≠ 0 : interrompre le passage, exécuter CTG-010'
    step: '1'
  - id: q2
    kind: check
    text:
      en: '2. EPS: Verify EPS health: HK_REQUEST(sid=1)'
      fr: '2. EPS : Vérifier la santé de l''EPS : HK_REQUEST(sid=1)'
    hint:
      en: 'eps.bat_soc (0x0101) > 50 %; eps.bus_voltage (0x0105) > 27.0 V; eps.power_gen (0x0107) > eps.power_cons
        (0x0106). Either limit missed: CTG-005, no payload operations'
      fr: 'eps.bat_soc (0x0101) > 50 % ; eps.bus_voltage (0x0105) > 27.0 V ; eps.power_gen (0x0107) >
        eps.power_cons (0x0106). Une des deux limites non tenue : CTG-005, aucune opération de charge
        utile'
    step: '2'
  - id: q3
    kind: check
    text:
      en: '3. AOCS: Verify AOCS pointing: HK_REQUEST(sid=2)'
      fr: '3. AOCS : Vérifier le pointage AOCS : HK_REQUEST(sid=2)'
    hint:
      en: aocs.mode (0x020F) in {4, 8} (NOMINAL, or ECLIPSE on the shadow side); aocs.att_error (0x0217)
        < 1.0° (allow 400 s to re-converge after a disturbance); aocs.rate_roll (0x0204) and aocs.rate_yaw
        (0x0206) within ±0.05°/s; aocs.rate_pitch (0x0205) in [0.043, 0.083]°/s — nadir tracking carries
        the orbit rate, +0.063°/s
      fr: aocs.mode (0x020F) dans {4, 8} (NOMINAL, ou ECLIPSE côté ombre) ; aocs.att_error (0x0217) <
        1.0° (prévoir 400 s de reconvergence après une perturbation) ; aocs.rate_roll (0x0204) et aocs.rate_yaw
        (0x0206) à ±0.05°/s ; aocs.rate_pitch (0x0205) dans [0.043, 0.083]°/s — le suivi du nadir porte
        la vitesse orbitale, +0.063°/s
    step: '3'
  - id: q4
    kind: check
    text:
      en: '4. TT&C: Establish the link: TTC_SWITCH_PRIMARY (S8.1)'
      fr: '4. TT&C : Établir la liaison : TTC_SWITCH_PRIMARY (S8.1)'
    hint:
      en: 'ttc.link_status (0x0501) = 2 (LOCKED) within 15 s; TT&C page (ground): ttc.rssi (0x0502) >
        −126 dBm, ttc.link_margin (0x0503) > 3.0 dB. No link in 15 s: TTC_SWITCH_REDUNDANT and verify
        again; both fail → TT&C anomaly'
      fr: 'ttc.link_status (0x0501) = 2 (LOCKED) en 15 s ; page TT&C (sol) : ttc.rssi (0x0502) > −126
        dBm, ttc.link_margin (0x0503) > 3.0 dB. Pas de liaison en 15 s : TTC_SWITCH_REDUNDANT et vérifier
        de nouveau ; échec des deux → anomalie TT&C'
    step: '4'
  - id: q5
    kind: check
    text:
      en: '5. SPACON: Full housekeeping collection: HK_REQUEST (S3.27) of SIDs 1 EPS, 2 AOCS, 3 TCS, 4
        OBDH, 5 Payload, 6 TT&C'
      fr: '5. SPACON : Collecte complète des données de servitude : HK_REQUEST (S3.27) des SID 1 EPS,
        2 AOCS, 3 TCS, 4 OBDH, 5 charge utile, 6 TT&C'
    hint:
      en: all six packets within 30 s; no out-of-limit parameter flagged by the MCS limit checker
      fr: les six paquets en 30 s ; aucun paramètre hors limites signalé par le contrôle de limites du
        MCS
    step: '5'
  - id: q6
    kind: check
    text:
      en: '6. Payload: Payload preparation, only if imaging or a downlink is planned: PAYLOAD_SET_MODE(mode=1)
        STANDBY (S8.1 func 26)'
      fr: '6. Charge utile : Préparation de la charge utile, seulement si une prise de vue ou un vidage
        est prévu : PAYLOAD_SET_MODE(mode=1) STANDBY (S8.1 func 26)'
    hint:
      en: payload.mode (0x0600) = 1 within 20 s; tcs.temp_fpa (0x0408) trending down (cooler running);
        payload.store_used (0x0604) < 90 %
      fr: payload.mode (0x0600) = 1 en 20 s ; tcs.temp_fpa (0x0408) en baisse (refroidisseur en marche)
        ; payload.store_used (0x0604) < 90 %
    step: '6'
  - id: q7
    kind: check
    text:
      en: '7. FD: Pass readiness declaration: poll each position GO / NO-GO'
      fr: '7. FD : Déclaration de disponibilité pour le passage : tour de table GO / NO-GO'
    hint:
      en: 'EPS: SoC > 50 %, bus > 27 V, margin positive · AOCS: NOMINAL, error < 1°, rates < 0.05°/s ·
        TT&C: link up, RSSI > −100 dBm, margin > 3 dB · TCS: every zone inside the limits on the TCS page
        · OBDH: NOMINAL, CPU < 80 % · Payload: STANDBY if needed, store < 90 %. Any NO-GO: its off-nominal
        procedure first'
      fr: 'EPS : SoC > 50 %, bus > 27 V, marge positive · AOCS : NOMINAL, erreur < 1°, vitesses < 0.05°/s
        · TT&C : liaison établie, RSSI > −100 dBm, marge > 3 dB · TCS : chaque zone dans les limites de
        la page TCS · OBDH : NOMINAL, CPU < 80 % · Charge utile : STANDBY si nécessaire, mémoire < 90
        %. Tout NO-GO : d''abord sa procédure hors nominal'
    step: '7'
  - id: q8
    kind: text
    text:
      en: Off-nominal items observed
      fr: Éléments hors nominal observés
- id: WB-5.4-C003
  title:
    en: CTG-003 TTC Link Loss Recovery (confirm each step)
    fr: CTG-003 Rétablissement après perte de liaison TTC (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    - radio
    procedures:
    - CTG-003
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. Ground Seg: Confirm the link loss is not a ground issue: antenna tracking, uplink transmitter
        power, receiver lock, Doppler pre-compensation, local RFI or weather'
      fr: '1. Segment sol : Confirmer que la perte de liaison n''est pas un problème sol : poursuite de
        l''antenne, puissance de l''émetteur montant, verrouillage du récepteur, précompensation Doppler,
        brouillage local ou météo'
    hint:
      en: ground fault → resolve locally; ground confirmed nominal → spacecraft-side recovery
      fr: défaut sol → le résoudre sur place ; sol confirmé nominal → reprise côté satellite
    step: '1'
  - id: q2
    kind: check
    text:
      en: '2. TT&C: Re-acquire on the primary transponder: blind HK_REQUEST(sid=6) (S3.27), wait 30 s'
      fr: '2. TT&C : Réacquérir sur le transpondeur principal : HK_REQUEST(sid=6) (S3.27) en aveugle,
        attendre 30 s'
    hint:
      en: 'ttc.link_status (0x0501) = 2 (LOCKED) within 30 s; TT&C page (ground): ttc.rssi (0x0502) >
        −126 dBm. Link back → step 5; no response → step 3'
      fr: 'ttc.link_status (0x0501) = 2 (LOCKED) en 30 s ; page TT&C (sol) : ttc.rssi (0x0502) > −126
        dBm. Liaison revenue → étape 5 ; aucune réponse → étape 3'
    step: '2'
  - id: q3
    kind: check
    text:
      en: '3. TT&C: Switch to the redundant transponder: blind TTC_SWITCH_REDUNDANT (S8.1 func 64), wait
        45 s'
      fr: '3. TT&C : Basculer sur le transpondeur redondant : TTC_SWITCH_REDUNDANT (S8.1 func 64) en aveugle,
        attendre 45 s'
    hint:
      en: ttc.link_status = 2 within 45 s; ttc.mode (0x0500) shows the redundant unit. Link back → step
        5; none → step 4
      fr: ttc.link_status = 2 en 45 s ; ttc.mode (0x0500) indique l'équipement redondant. Liaison revenue
        → étape 5 ; rien → étape 4
    step: '3'
  - id: q4
    kind: check
    text:
      en: '4. TT&C: Second attempt on the primary: blind TTC_SWITCH_PRIMARY (S8.1 func 63), wait 45 s'
      fr: '4. TT&C : Deuxième tentative sur le principal : TTC_SWITCH_PRIMARY (S8.1 func 63) en aveugle,
        attendre 45 s'
    hint:
      en: ttc.link_status = 2 within 45 s. Link back → step 5; still none after both units → step 6
      fr: ttc.link_status = 2 en 45 s. Liaison revenue → étape 5 ; toujours rien après les deux équipements
        → étape 6
    step: '4'
  - id: q5
    kind: check
    text:
      en: '5. TT&C: Verify link quality and subsystem health: HK_REQUEST(sid=6), HK_REQUEST(sid=1), HK_REQUEST(sid=4)'
      fr: '5. TT&C : Vérifier la qualité de la liaison et la santé des sous-systèmes : HK_REQUEST(sid=6),
        HK_REQUEST(sid=1), HK_REQUEST(sid=4)'
    hint:
      en: 'ttc.link_status = 2; TT&C page (ground): ttc.rssi > −126 dBm, ttc.link_margin (0x0503) > 3.0
        dB; active unit ttc.mode (0x0500) recorded; eps.bus_voltage (0x0105) > 27.0 V; obdh.mode (0x0300)
        not SAFE or EMERGENCY. Margin > 3 dB and all nominal → recovered'
      fr: 'ttc.link_status = 2 ; page TT&C (sol) : ttc.rssi > −126 dBm, ttc.link_margin (0x0503) > 3.0
        dB ; équipement actif ttc.mode (0x0500) consigné ; eps.bus_voltage (0x0105) > 27.0 V ; obdh.mode
        (0x0300) ni SAFE ni EMERGENCY. Marge > 3 dB et tout nominal → rétabli'
    step: '5'
  - id: q6
    kind: check
    text:
      en: '6. TT&C: Escalation, no link: log every blind command with its time; notify the Mission Director
        and Flight Dynamics; book the next pass; record the time of the last accepted telecommand (last
        S1.1)'
      fr: '6. TT&C : Escalade, pas de liaison : consigner chaque commande en aveugle avec son heure ;
        prévenir le directeur de mission et la dynamique du vol ; réserver le passage suivant ; noter
        l''heure de la dernière télécommande acceptée (dernier S1.1)'
    hint:
      en: 'first passes planned after T+24 h and T+48 h: the command-loss timer ttc.time_since_last_tc
        (0x053D, FDIR TTC-01) switches to the OTHER transponder 24 h after the last accepted TC (event
        CMD_LOSS_TIMEOUT 0x0514) and again every further 24 h. No link after two consecutive passes →
        EMG-004'
      fr: 'premiers passages prévus après T+24 h et T+48 h : la minuterie de perte de commande ttc.time_since_last_tc
        (0x053D, FDIR TTC-01) bascule sur l''AUTRE transpondeur 24 h après la dernière TC acceptée (événement
        CMD_LOSS_TIMEOUT 0x0514), puis toutes les 24 h suivantes. Sans liaison après deux passages consécutifs
        → EMG-004'
    step: '6'
  - id: q7
    kind: text
    text:
      en: Step at which link was recovered (if any)
      fr: Étape à laquelle la liaison a été rétablie (le cas échéant)
  - id: q8
    kind: text
    text:
      en: Anomaly ticket number
      fr: Numéro de la fiche d'anomalie
