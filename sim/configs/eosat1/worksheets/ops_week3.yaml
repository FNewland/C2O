- id: WB-5.5-L007
  title:
    en: LEOP-007 Sequential Power-On (confirm each step)
    fr: LEOP-007 Mise sous tension séquentielle (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - LEOP-007
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. EPS: Verify EPS baseline: HK_REQUEST(sid=1) (S3.27)'
      fr: '1. EPS : Vérifier l''état de référence de l''EPS : HK_REQUEST(sid=1) (S3.27)'
    hint:
      en: eps.bus_voltage (0x0105) 26–30 V; eps.bat_soc (0x0101) > 60 %; eps.power_gen (0x0107) > 0 W
      fr: eps.bus_voltage (0x0105) 26–30 V ; eps.bat_soc (0x0101) > 60 % ; eps.power_gen (0x0107) > 0
        W
  - id: q2
    kind: check
    text:
      en: '2. EPS: Heaters only if needed: EPS_POWER_ON(line_index=5) (S8.1 func_id 19) if tcs.temp_battery
        (0x0407) < +5 °C; EPS_POWER_ON(line_index=6) if tcs.temp_obc (0x0406) < 0 °C'
      fr: '2. EPS : Réchauffeurs seulement si nécessaire : EPS_POWER_ON(line_index=5) (S8.1 func_id 19)
        si tcs.temp_battery (0x0407) < +5 °C ; EPS_POWER_ON(line_index=6) si tcs.temp_obc (0x0406) < 0
        °C'
    hint:
      en: eps.pl_htr_bat (0x0115) / eps.pl_htr_obc (0x0116) = 1 for each line energised
      fr: eps.pl_htr_bat (0x0115) / eps.pl_htr_obc (0x0116) = 1 pour chaque ligne alimentée
  - id: q3
    kind: check
    text:
      en: '3. EPS / AOCS: Energise the AOCS suite line and enable its HK: EPS_POWER_ON(line_index=7) (func
        19), then HK_ENABLE(sid=2) (S3.5)'
      fr: '3. EPS / AOCS : Alimenter la ligne de la suite AOCS et activer sa HK : EPS_POWER_ON(line_index=7)
        (func 19), puis HK_ENABLE(sid=2) (S3.5)'
    hint:
      en: 'eps.pl_aocs_wheels (0x0117) = 1; SID 2 emitting. The wheels stay DISABLED: aocs.wheels_enabled
        (0x0260) = 0 until COM-004'
      fr: 'eps.pl_aocs_wheels (0x0117) = 1 ; SID 2 émis. Les roues restent DISABLED : aocs.wheels_enabled
        (0x0260) = 0 jusqu''à COM-004'
  - id: q4
    kind: check
    text:
      en: '4. AOCS: Enable the DETUMBLE legs and the GPS receiver: S2_AOCS_MAGNETOMETER(device_id=521,
        state=1), MTQ_ENABLE(enable=1) (S8.1 func_id 9), S2_AOCS_GPS_RECEIVER(device_id=527, state=1)'
      fr: '4. AOCS : Activer les éléments de DETUMBLE et le récepteur GPS : S2_AOCS_MAGNETOMETER(device_id=521,
        state=1), MTQ_ENABLE(enable=1) (S8.1 func_id 9), S2_AOCS_GPS_RECEIVER(device_id=527, state=1)'
    hint:
      en: aocs.mtq_enabled (0x025E) = 1
      fr: aocs.mtq_enabled (0x025E) = 1
  - id: q5
    kind: check
    text:
      en: '5. AOCS: Command DETUMBLE: AOCS_SET_MODE(mode=2) (S8.1 func_id 0) — mode 2 = DETUMBLE'
      fr: '5. AOCS : Commander DETUMBLE : AOCS_SET_MODE(mode=2) (S8.1 func_id 0) — mode 2 = DETUMBLE'
    hint:
      en: aocs.mode (0x020F) = 2; aocs.mag_enabled (0x025C) = 1, field 5–70 µT; aocs.rate_roll/pitch/yaw
        (0x0204–0x0206) decreasing
      fr: aocs.mode (0x020F) = 2 ; aocs.mag_enabled (0x025C) = 1, champ de 5–70 µT ; aocs.rate_roll/pitch/yaw
        (0x0204–0x0206) en baisse
  - id: q6
    kind: check
    text:
      en: '6. EPS: Confirm the exit power state: HK_REQUEST(sid=1)'
      fr: '6. EPS : Confirmer l''état d''alimentation de sortie : HK_REQUEST(sid=1)'
    hint:
      en: eps.pl_payload (0x0113), eps.pl_fpa_cooler (0x0114), eps.pl_prop (0x014A) = 0; power margin
        positive
      fr: eps.pl_payload (0x0113), eps.pl_fpa_cooler (0x0114), eps.pl_prop (0x014A) = 0 ; marge de puissance
        positive
  - id: q7
    kind: check
    text:
      en: '7. SPACON: Log all step times, rates and line currents'
      fr: '7. SPACON : Consigner toutes les heures d''étapes, les vitesses et les courants de ligne'
    hint:
      en: recorded
      fr: consigné
  - id: q8
    kind: text
    text:
      en: Phase (0x0129)
      fr: Phase (0x0129)
  - id: q9
    kind: text
    text:
      en: Wheels enabled (aocs.wheels_enabled 0x0260)
      fr: Roues activées (aocs.wheels_enabled 0x0260)
  - id: q10
    kind: text
    text:
      en: SoC
      fr: SoC
- id: WB-5.5-L005
  title:
    en: LEOP-005 Sun Acquisition (observe, confirm each step)
    fr: LEOP-005 Acquisition du Soleil (observer, confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - LEOP-005
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. Confirm DETUMBLE active and record the rates: HK_REQUEST(sid=2) (S3.27)'
      fr: '1. Confirmer que DETUMBLE est actif et consigner les vitesses : HK_REQUEST(sid=2) (S3.27)'
    hint:
      en: 'aocs.mode (0x020F) = 2 (DETUMBLE); rates roll/pitch/yaw: __/__/__ °/s'
      fr: 'aocs.mode (0x020F) = 2 (DETUMBLE) ; vitesses roulis/tangage/lacet : __/__/__ °/s'
  - id: q2
    kind: check
    text:
      en: '2. Watch B-dot convergence — command nothing. This is slow: the 0.5°/s guard takes ~1 200 s,
        and a full 14°/s separation tumble ~3.5e3 s'
      fr: '2. Suivre la convergence de la loi B-dot — ne rien commander. Elle est lente : le seuil de
        0,5°/s demande environ 1 200 s, et un culbutage de séparation complet de 14°/s environ 3,5e3 s'
    hint:
      en: rates decreasing on all axes; aocs.mag_field_total (0x0277) non-zero
      fr: vitesses en baisse sur tous les axes ; aocs.mag_field_total (0x0277) non nul
  - id: q3
    kind: check
    text:
      en: '3. Observe the automatic handover: rates below 0.5°/s for 30 s → mode 3 by itself. Do not send
        AOCS_SET_MODE(mode=3)'
      fr: '3. Observer le passage automatique : vitesses sous 0,5°/s pendant 30 s → mode 3 de lui-même.
        Ne pas envoyer AOCS_SET_MODE(mode=3)'
    hint:
      en: aocs.mode = 3 (COARSE_SUN) within 1800 s
      fr: aocs.mode = 3 (COARSE_SUN) en 1800 s au plus
  - id: q4
    kind: check
    text:
      en: '4. Verify the sun hold: HK_REQUEST(sid=2) every 60 s for 5 min'
      fr: '4. Vérifier le maintien au Soleil : HK_REQUEST(sid=2) toutes les 60 s pendant 5 min'
    hint:
      en: aocs.att_error (0x0217) < 15°; aocs.css_sun_confidence (0x0215) > 0.5; rates < 0.5°/s
      fr: aocs.att_error (0x0217) < 15° ; aocs.css_sun_confidence (0x0215) > 0,5 ; vitesses < 0,5°/s
  - id: q5
    kind: check
    text:
      en: '5. Verify power balance improved: HK_REQUEST(sid=1)'
      fr: '5. Vérifier l''amélioration du bilan de puissance : HK_REQUEST(sid=1)'
    hint:
      en: 'eps.power_gen (0x0107) > 40 W; margin eps.power_margin_w (0x0135): W'
      fr: 'eps.power_gen (0x0107) > 40 W ; marge eps.power_margin_w (0x0135) : W'
  - id: q6
    kind: check
    text:
      en: '6. Log the final state. The spacecraft stays in COARSE_SUN: no star tracker is powered until
        COM-003'
      fr: '6. Consigner l''état final. Le satellite reste en COARSE_SUN : aucun senseur stellaire n''est
        alimenté avant COM-003'
    hint:
      en: 'error: °'
      fr: 'erreur : °'
- id: WB-5.5-L003
  title:
    en: LEOP-003 Initial Orbit Determination and End of LEOP (confirm each step)
    fr: LEOP-003 Restitution d'orbite initiale et fin de la LEOP (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    - orbit
    procedures:
    - LEOP-003
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. Request the GPS navigation report: HK_REQUEST(sid=12) (S3.27)'
      fr: '1. Demander le rapport de navigation GPS : HK_REQUEST(sid=12) (S3.27)'
    hint:
      en: aocs.gps_fix (0x0274) ≥ 2; aocs.gps_num_sats (0x0276) ≥ 4
      fr: aocs.gps_fix (0x0274) ≥ 2 ; aocs.gps_num_sats (0x0276) ≥ 4
  - id: q2
    kind: check
    text:
      en: '2. Read the position: GET_PARAM(param_id=0x0212) (S20.3) and the ECEF state 0x0231–0x0236'
      fr: '2. Lire la position : GET_PARAM(param_id=0x0212) (S20.3) et l''état ECEF 0x0231–0x0236'
    hint:
      en: aocs.gps_alt 495–540 km
      fr: aocs.gps_alt 495–540 km
  - id: q3
    kind: check
    text:
      en: '3. FDS: compare with the launcher-predicted orbit'
      fr: '3. FDS : comparer à l''orbite prédite par le lanceur'
    hint:
      en: i within 0.2° of 97.39°; e < 0.01; LTAN within 15 min of 10:00
      fr: i à 0,2° près de 97,39° ; e < 0,01 ; LTAN à 15 min près de 10 h 00
  - id: q4
    kind: check
    text:
      en: 4. Send the refined TLE to the ground tools (planner, FDS, stations) — nothing is uploaded to
        the spacecraft
      fr: 4. Transmettre le TLE affiné aux outils sol (planificateur, FDS, stations) — rien n'est envoyé
        au satellite
    hint:
      en: pass predictions refreshed
      fr: prédictions de passage rafraîchies
  - id: q5
    kind: check
    text:
      en: '5. FD: GO/NO-GO poll, then declare COMMISSIONING by telecommand: SYS_SET_MISSION_PHASE(phase=5,
        flags=0) (S8.1 func 120) — nothing on board advances the phase past 4'
      fr: '5. FD : tour de table GO/NO-GO, puis déclarer COMMISSIONING par télécommande : SYS_SET_MISSION_PHASE(phase=5,
        flags=0) (S8.1 func 120) — rien à bord ne fait avancer la phase au-delà de 4'
    hint:
      en: eps.spacecraft_phase (0x0129) = 5 (COMMISSIONING) < 5 s
      fr: eps.spacecraft_phase (0x0129) = 5 (COMMISSIONING) < 5 s
