- id: WB-5.6-C001
  title:
    en: COM-001 EPS Checkout (confirm each step)
    fr: COM-001 Vérification de l'EPS (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - COM-001
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: 1. Baseline bus voltage — HK_REQUEST(sid=1) (S3.27)
      fr: 1. Tension de bus de référence — HK_REQUEST(sid=1) (S3.27)
    hint:
      en: eps.bus_voltage (0x0105) ∈ [27.5, 28.5] V
      fr: eps.bus_voltage (0x0105) ∈ [27.5, 28.5] V
  - id: q2
    kind: check
    text:
      en: 2. Battery V & SoC — GET_PARAM(param_id=0x0100), GET_PARAM(param_id=0x0101) (S20.3)
      fr: 2. Tension et SoC de la batterie — GET_PARAM(param_id=0x0100), GET_PARAM(param_id=0x0101) (S20.3)
    hint:
      en: 'eps.bat_voltage ∈ [26.5, 29.2] V (8S pack: 21.5 V at 0 %, 26.4 V nominal, 29.2 V at 100 %);
        eps.bat_soc > 70 %'
      fr: 'eps.bat_voltage ∈ [26.5, 29.2] V (batterie 8S : 21,5 V à 0 %, 26,4 V en nominal, 29,2 V à 100
        %) ; eps.bat_soc > 70 %'
  - id: q3
    kind: check
    text:
      en: 3. Solar array sunlit performance
      fr: 3. Performances du générateur solaire en phase éclairée
    hint:
      en: eps.power_gen (0x0107) ∈ [40, 65] W (peak whole-spacecraft 88.6 W; wings 0.120 m² each at 267.9
        W/m² EOL)
      fr: eps.power_gen (0x0107) ∈ [40, 65] W (crête de l'ensemble du satellite 88,6 W ; ailes de 0,120
        m² chacune à 267,9 W/m² en fin de vie)
  - id: q4
    kind: check
    text:
      en: 4. Eclipse discharge monitoring
      fr: 4. Surveillance de la décharge en éclipse
    hint:
      en: power_gen ~0 W < 30 s of entry; SoC drop < 1.5 %/min; bus_voltage > 27.0 V mid-eclipse
      fr: power_gen ~0 W < 30 s après l'entrée ; baisse du SoC < 1.5 %/min ; bus_voltage > 27.0 V à mi-éclipse
  - id: q5
    kind: check
    text:
      en: 5. Eclipse exit charge recovery
      fr: 5. Reprise de la charge en sortie d'éclipse
    hint:
      en: power_gen > 35 W < 60 s; SoC rising < 120 s
      fr: power_gen > 35 W < 60 s ; SoC en hausse < 120 s
  - id: q6
    kind: check
    text:
      en: 6. Power budget verification — orbit-average gen > cons
      fr: 6. Vérification du bilan de puissance — production moyenne sur l'orbite > consommation
    hint:
      en: nominal orbit-average load ≈ 28.8 W against ≈ 45.1 W generation at the worst-generation beta,
        β = −31.2° (margin +16.3 W, ratio 1.57; 1.38 while imaging); end-of-eclipse SoC > 50 % on the
        100 Wh pack
      fr: charge nominale moyenne sur l'orbite ≈ 28,8 W pour une production ≈ 45,1 W à l'angle bêta le
        moins productif, β = −31,2° (marge +16,3 W, rapport 1,57 ; 1,38 pendant la prise de vue) ; SoC
        en fin d'éclipse > 50 % sur la batterie de 100 Wh
  - id: q7
    kind: check
    text:
      en: '7. Bus regulation under load transient — record eps.pl_htr_bat (0x0115), then EPS_POWER_ON(line_index=5)
        (S8.1 func_id 19), and EPS_POWER_OFF(line_index=5) (func 20) only if the line was off at entry.
        Not the payload: its line is OFF until COM-009'
      fr: '7. Régulation du bus lors d''un transitoire de charge — consigner eps.pl_htr_bat (0x0115),
        puis EPS_POWER_ON(line_index=5) (S8.1 func_id 19), et EPS_POWER_OFF(line_index=5) (func 20) seulement
        si la ligne était éteinte à l''entrée. Pas la charge utile : sa ligne est OFF jusqu''à COM-009'
    hint:
      en: bus stays in [26.5, 29.5] V, returns to [27.0, 29.0] V; line back to its entry state
      fr: le bus reste dans [26.5, 29.5] V, revient dans [27.0, 29.0] V ; ligne revenue à son état d'entrée
  - id: q8
    kind: check
    text:
      en: GO COM-002
      fr: GO COM-002
- id: WB-5.6-C002
  title:
    en: COM-002 TCS Verification (confirm each step)
    fr: COM-002 Vérification du TCS (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - COM-002
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: 1. Thermal HK — HK_REQUEST(sid=3) (S3.27; SID 3 = TCS, 60 s cadence)
      fr: 1. HK thermique — HK_REQUEST(sid=3) (S3.27 ; SID 3 = TCS, cadence de 60 s)
    hint:
      en: tcs.temp_obc (0x0406) ∈ [−5, +45] °C; tcs.temp_battery (0x0407) ∈ [+5, +35] °C; tcs.temp_fpa
        (0x0408) reported
      fr: tcs.temp_obc (0x0406) ∈ [−5, +45] °C ; tcs.temp_battery (0x0407) ∈ [+5, +35] °C ; tcs.temp_fpa
        (0x0408) remontée
  - id: q2
    kind: check
    text:
      en: 2. Exercise each heater with its line powered — EPS_POWER_ON(line_index=5) then HEATER_BATTERY(on=1)
        / (on=0) (S8.1 func 40); EPS_POWER_ON(line_index=6) then HEATER_OBC(on=1) / (on=0) (func 41);
        switch each line back off only if it was off at entry
      fr: 2. Exercer chaque réchauffeur avec sa ligne alimentée — EPS_POWER_ON(line_index=5) puis HEATER_BATTERY(on=1)
        / (on=0) (S8.1 func 40) ; EPS_POWER_ON(line_index=6) puis HEATER_OBC(on=1) / (on=0) (func 41)
        ; ne recouper chaque ligne que si elle était éteinte à l'entrée
    hint:
      en: eps.pl_htr_bat (0x0115) / eps.pl_htr_obc (0x0116) = 1; zone temperature rising or stable; lines
        restored
      fr: eps.pl_htr_bat (0x0115) / eps.pl_htr_obc (0x0116) = 1 ; température de zone en hausse ou stable
        ; lignes rétablies
  - id: q3
    kind: check
    text:
      en: 3. Read the autonomous battery thermostat thresholds — GET_PARAM(param_id=0x0410), GET_PARAM(param_id=0x0411)
        (S20.3)
      fr: 3. Lire les seuils du thermostat autonome de la batterie — GET_PARAM(param_id=0x0410), GET_PARAM(param_id=0x0411)
        (S20.3)
    hint:
      en: ON at +5 °C, OFF at +10 °C; the card reads them, it does not change them
      fr: mise en marche à +5 °C, arrêt à +10 °C ; la fiche les lit, elle ne les modifie pas
  - id: q4
    kind: check
    text:
      en: 4. Confirm radiator performance via TCS zone response in eclipse
      fr: 4. Confirmer les performances du radiateur d'après la réponse des zones TCS en éclipse
    hint:
      en: zones stable, no runaway
      fr: zones stables, pas d'emballement
  - id: q5
    kind: check
    text:
      en: GO COM-005
      fr: GO COM-005
- id: WB-5.6-C005
  title:
    en: COM-005 AOCS Mode Transitions (confirm each step)
    fr: COM-005 Transitions de modes SCAO (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - COM-005
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. Latch the commanded mode: AOCS_SET_MODE(mode=4) — the AOCS has flown NOMINAL since COM-004'
      fr: '1. Verrouiller le mode commandé : AOCS_SET_MODE(mode=4) — l''AOCS vole en NOMINAL depuis COM-004'
    hint:
      en: aocs.mode (0x020F) = 4 (or 8 in eclipse); aocs.commanded_mode (0x0297) = 4; att_error < 1.0°
      fr: aocs.mode (0x020F) = 4 (ou 8 en éclipse) ; aocs.commanded_mode (0x0297) = 4 ; att_error < 1,0°
  - id: q2
    kind: check
    text:
      en: '2. Read the FINE precondition mask: AOCS_FINE_READY_CHECK (S8.1 func 89)'
      fr: '2. Lire le masque des préconditions FINE : AOCS_FINE_READY_CHECK (S8.1 func 89)'
    hint:
      en: aocs.fine_ready (0x02C5) = 0. Bit 1 = fewer than three wheels — a 3-of-4 set still flies FINE,
        flagged at aocs.fine_degraded (0x0299)
      fr: aocs.fine_ready (0x02C5) = 0. Bit 1 = moins de trois roues — un jeu de 3 roues sur 4 permet
        toujours FINE, signalé par aocs.fine_degraded (0x0299)
  - id: q3
    kind: check
    text:
      en: 3. Transition to FINE_POINT (AOCS_SET_MODE(mode=5)), then back to NOMINAL (AOCS_SET_MODE(mode=4))
      fr: 3. Passer en FINE_POINT (AOCS_SET_MODE(mode=5)), puis revenir en NOMINAL (AOCS_SET_MODE(mode=4))
    hint:
      en: mode = 5 within 30 s; att_error < 0.1° within 300 s; then mode = 4 within 30 s
      fr: mode = 5 dans les 30 s ; att_error < 0,1° dans les 300 s ; puis mode = 4 dans les 30 s
  - id: q4
    kind: check
    text:
      en: '4. INERTIAL and back: AOCS_SET_MODE(mode=9), then AOCS_SET_MODE(mode=4)'
      fr: '4. INERTIAL et retour : AOCS_SET_MODE(mode=9), puis AOCS_SET_MODE(mode=4)'
    hint:
      en: mode 9, then mode 4, each within 30 s
      fr: mode 9, puis mode 4, chacun dans les 30 s
  - id: q5
    kind: check
    text:
      en: 5. Command the COARSE_SUN hold (AOCS_SET_MODE(mode=3)), then wait for the automatic return
      fr: 5. Commander le maintien COARSE_SUN (AOCS_SET_MODE(mode=3)), puis attendre le retour automatique
    hint:
      en: mode 3 and aocs.mode_demoted (0x0298) = 1; then mode 4 by itself within 1800 s and 0x0298 =
        0
      fr: mode 3 et aocs.mode_demoted (0x0298) = 1 ; puis mode 4 de lui-même en 1800 s et 0x0298 = 0
  - id: q6
    kind: check
    text:
      en: '6. Desaturate: AOCS_DESATURATE (S8.1 func 1) — DESAT exits by itself'
      fr: '6. Désaturer : AOCS_DESATURATE (S8.1 func 1) — DESAT se termine d''elle-même'
    hint:
      en: mode 7 (DESAT), then back to 4 within 900 s with no command
      fr: mode 7 (DESAT), puis retour à 4 en 900 s sans commande
- id: WB-5.6-C006
  title:
    en: COM-006 TTC Link Verification (confirm each step)
    fr: COM-006 Vérification de la liaison TTC (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    - radio
    procedures:
    - COM-006
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '0. Configure the S-band chain: EPS_POWER_ON(line_index=2) (func 19), TTC_PA_ON (func 66), TTC_SET_BEACON_MODE(on=0)
        (func 70), TTC_DEPLOY_ANTENNA (func 69)'
      fr: '0. Configurer la chaîne bande S : EPS_POWER_ON(line_index=2) (func 19), TTC_PA_ON (func 66),
        TTC_SET_BEACON_MODE(on=0) (func 70), TTC_DEPLOY_ANTENNA (func 69)'
    hint:
      en: eps.pl_ttc_tx (0x0112) = 1; ttc.pa_on (0x0516) = 1; ttc.beacon_mode (0x0521) = 0; ttc.antenna_deployed
        (0x0520) = 1; ttc.tx_active (0x0525) = 1 (else read ttc.tx_gate_status 0x052B)
      fr: eps.pl_ttc_tx (0x0112) = 1 ; ttc.pa_on (0x0516) = 1 ; ttc.beacon_mode (0x0521) = 0 ; ttc.antenna_deployed
        (0x0520) = 1 ; ttc.tx_active (0x0525) = 1 (sinon lire ttc.tx_gate_status 0x052B)
  - id: q2
    kind: check
    text:
      en: '1. Baseline the primary transponder at LOW: TTC_SET_DATA_RATE(rate=0) (S8.1 func 65)'
      fr: '1. Établir la référence du transpondeur principal à LOW : TTC_SET_DATA_RATE(rate=0) (S8.1 func
        65)'
    hint:
      en: ttc.link_status (0x0501) = 2 (LOCKED); ttc.tm_data_rate (0x0506) = 16000 bps; ttc.tm_tier (0x0539)
        = 1; ttc.link_margin (0x0503) > 6 dB (expect 55–59 dB at 30° — this link is not power-limited)
      fr: ttc.link_status (0x0501) = 2 (LOCKED) ; ttc.tm_data_rate (0x0506) = 16000 bit/s ; ttc.tm_tier
        (0x0539) = 1 ; ttc.link_margin (0x0503) > 6 dB (attendu 55–59 dB à 30° — cette liaison n'est pas
        limitée en puissance)
  - id: q3
    kind: check
    text:
      en: '2. Step to HIGH: TTC_SET_DOWNLINK_MODE(on=1) (func 79) then TTC_SET_DATA_RATE(rate=1) (func
        65)'
      fr: '2. Passer à HIGH : TTC_SET_DOWNLINK_MODE(on=1) (func 79) puis TTC_SET_DATA_RATE(rate=1) (func
        65)'
    hint:
      en: tm_data_rate = 128000 bps; tm_tier = 2; ttc.tm_symbol_rate (0x053B) = 64000 Bd (QPSK); margin
        expect 45–48 dB at 30°
      fr: tm_data_rate = 128000 bit/s ; tm_tier = 2 ; ttc.tm_symbol_rate (0x053B) = 64000 Bd (QPSK) ;
        marge attendue 45–48 dB à 30°
  - id: q4
    kind: check
    text:
      en: '3. Compute the rung step: margin(LOW) − margin(HIGH)'
      fr: '3. Calculer l''écart entre échelons : marge(LOW) − marge(HIGH)'
    hint:
      en: 10.5 ± 0.5 dB. Anything else is a modelling error, not a link problem
      fr: 10.5 ± 0.5 dB. Toute autre valeur est une erreur de modélisation, pas un problème de liaison
  - id: q5
    kind: check
    text:
      en: 4. Below 10° elevation (ttc.contact_elevation 0x050A), attempt HIGH again
      fr: 4. Sous 10° d'élévation (ttc.contact_elevation 0x050A), retenter HIGH
    hint:
      en: Command rejected, S1.8 error 0x0007 naming the elevation gate; rate stays 16000 bps. This is
        correct behaviour, not an anomaly
      fr: Commande rejetée, erreur S1.8 0x0007 indiquant la condition d'élévation ; le débit reste à 16000
        bit/s. C'est le comportement correct, pas une anomalie
  - id: q6
    kind: check
    text:
      en: '5. Safe the link: TTC_SET_DATA_RATE(rate=0), TTC_SET_DOWNLINK_MODE(on=0), TTC_SWITCH_PRIMARY
        (func 63)'
      fr: '5. Mettre la liaison en sécurité : TTC_SET_DATA_RATE(rate=0), TTC_SET_DOWNLINK_MODE(on=0),
        TTC_SWITCH_PRIMARY (func 63)'
    hint:
      en: tm_tier = 1, ttc.tm_tier_cmd (0x053A) = 1, ttc.downlink_mode (0x053C) = 0. Antenna stays deployed
        and the PA stays ON
      fr: tm_tier = 1, ttc.tm_tier_cmd (0x053A) = 1, ttc.downlink_mode (0x053C) = 0. L'antenne reste déployée
        et le PA reste sur ON
  - id: q7
    kind: check
    text:
      en: 6. Record margins at both operational rungs in the shift log
      fr: 6. Consigner les marges aux deux échelons opérationnels dans la main courante
    hint:
      en: recorded
      fr: consigné
- id: WB-5.6-C007
  title:
    en: COM-007 OBDH Checkout (confirm each step)
    fr: COM-007 Vérification de l'OBDH (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - COM-007
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. Verify the watchdog: OBC_DIAGNOSTIC (S8.1 func 61), GET_PARAM(param_id=0x0316) (S20.3).
        (There is no OBC_WATCHDOG_KICK command)'
      fr: '1. Vérifier le chien de garde : OBC_DIAGNOSTIC (S8.1 func 61), GET_PARAM(param_id=0x0316) (S20.3).
        (Il n''existe pas de commande OBC_WATCHDOG_KICK)'
    hint:
      en: 'diagnostic reply: watchdog armed; obdh.last_reboot_cause = 0; obdh.reboot_count (0x030A) unchanged'
      fr: 'réponse du diagnostic : chien de garde armé ; obdh.last_reboot_cause = 0 ; obdh.reboot_count
        (0x030A) inchangé'
  - id: q2
    kind: check
    text:
      en: 2. Read and verify mass-memory usage — HK_REQUEST(sid=4) (S3.27)
      fr: 2. Lire et vérifier l'occupation de la mémoire de masse — HK_REQUEST(sid=4) (S3.27)
    hint:
      en: obdh.mmm_used (0x0303, %) as expected; payload store payload.mem_used_mb (0x060B) of payload.mem_total_mb
        (0x060A)
      fr: obdh.mmm_used (0x0303, %) conforme ; stockage charge utile payload.mem_used_mb (0x060B) sur
        payload.mem_total_mb (0x060A)
  - id: q3
    kind: check
    text:
      en: 3. Baseline the memory error and SEU counters — GET_PARAM(param_id=0x031E), GET_PARAM(param_id=0x0319)
        (S20.3); then the mode excursion OBC_SET_MODE(mode=1), OBC_SET_MODE(mode=0) (func 50)
      fr: 3. Relever comme référence les compteurs d'erreurs mémoire et de SEU — GET_PARAM(param_id=0x031E),
        GET_PARAM(param_id=0x0319) (S20.3) ; puis l'excursion de mode OBC_SET_MODE(mode=1), OBC_SET_MODE(mode=0)
        (func 50)
    hint:
      en: counters not incrementing between reads; obdh.mode (0x0300) back to 0 — the card ends in NOMINAL
      fr: compteurs stables entre deux lectures ; obdh.mode (0x0300) revenu à 0 — la fiche se termine
        en NOMINAL
  - id: q4
    kind: check
    text:
      en: 4. Verify bus A and bus B health
      fr: 4. Vérifier l'état des bus A et B
    hint:
      en: obdh.bus_a_status (0x030F) = 0 and obdh.bus_b_status (0x0310) = 0 (0 = OK); active bus at obdh.active_bus
        (0x030E)
      fr: obdh.bus_a_status (0x030F) = 0 et obdh.bus_b_status (0x0310) = 0 (0 = OK) ; bus actif indiqué
        par obdh.active_bus (0x030E)
- id: WB-5.6-C008
  title:
    en: COM-008 FDIR Configuration (confirm each step)
    fr: COM-008 Configuration de la FDIR (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - COM-008
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: 1. Read the FDIR state — GET_PARAM(param_id=0x0700) (S20.3)
      fr: 1. Lire l'état de la FDIR — GET_PARAM(param_id=0x0700) (S20.3)
    hint:
      en: fdir.level = 0 (0 nominal, 1 caution, 2 warning, 3 critical); fdir.active_alarms (0x0701) =
        0
      fr: fdir.level = 0 (0 nominal, 1 attention, 2 avertissement, 3 critique) ; fdir.active_alarms (0x0701)
        = 0
  - id: q2
    kind: check
    text:
      en: 2. Review the rule set on the FDIR panel against subsystems/fdir.yaml
      fr: 2. Passer en revue le jeu de règles dans le panneau FDIR en le comparant à subsystems/fdir.yaml
    hint:
      en: 'key thresholds confirmed: eps.bus_voltage < 24.5 V, eps.bat_soc < 20 % / < 15 %, aocs.att_error
        > 5° sustained 420 s, obdh.temp > 65 °C'
      fr: 'seuils clés confirmés : eps.bus_voltage < 24.5 V, eps.bat_soc < 20 % / < 15 %, aocs.att_error
        > 5° maintenu 420 s, obdh.temp > 65 °C'
  - id: q3
    kind: check
    text:
      en: 3. Enable/verify the S12 monitoring service — MON_ENABLE (S12.1), MON_REPORT_DEFS (S12.12)
      fr: 3. Activer / vérifier le service de surveillance S12 — MON_ENABLE (S12.1), MON_REPORT_DEFS (S12.12)
    hint:
      en: definition list returned; alarms visible in the MCS
      fr: liste des définitions renvoyée ; alarmes visibles dans le MCS
  - id: q4
    kind: check
    text:
      en: '4. Functional test of the commanded load-shed latch: EPS_EMERGENCY_LOAD_SHED(stage=1) (S8.1
        func 25), then EPS_EMERGENCY_LOAD_SHED(stage=0). Never stage 2 or 3 here — stage 3 sheds ttc_tx'
      fr: '4. Essai fonctionnel du verrouillage de délestage commandé : EPS_EMERGENCY_LOAD_SHED(stage=1)
        (S8.1 func 25), puis EPS_EMERGENCY_LOAD_SHED(stage=0). Jamais l''étage 2 ou 3 ici — l''étage 3
        coupe ttc_tx'
    hint:
      en: 'stage 1: eps.load_shed_stage (0x0134) = 1 and latches, event 0x0106; stage 0: back to 0 and
        no line re-powered'
      fr: 'étage 1 : eps.load_shed_stage (0x0134) = 1 et se verrouille, événement 0x0106 ; étage 0 : retour
        à 0 et aucune ligne réalimentée'
  - id: q5
    kind: check
    text:
      en: '5. Confirm no residual protection state: GET_PARAM(param_id=0x0700), HK_REQUEST(sid=1), HK_REQUEST(sid=4)'
      fr: '5. Confirmer l''absence d''état de protection résiduel : GET_PARAM(param_id=0x0700), HK_REQUEST(sid=1),
        HK_REQUEST(sid=4)'
    hint:
      en: fdir.level = 0; eps.load_shed_stage = 0; obdh.mode (0x0300) = 0 — no OBC-mode excursion
      fr: fdir.level = 0 ; eps.load_shed_stage = 0 ; obdh.mode (0x0300) = 0 — aucune excursion de mode
        de l'OBC
- id: WB-5.6-C009
  title:
    en: COM-009 Payload Power-On (confirm each step)
    fr: COM-009 Mise sous tension de la charge utile (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - COM-009
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: 1. FD GO confirmed
      fr: 1. GO du FD confirmé
    hint:
      en: recorded
      fr: consigné
  - id: q2
    kind: check
    text:
      en: '2. Energise the payload line: EPS_POWER_ON(line_index=3) (S8.1 func_id 19)'
      fr: '2. Alimenter la ligne charge utile : EPS_POWER_ON(line_index=3) (S8.1 func_id 19)'
    hint:
      en: eps.pl_payload (0x0113) = 1 < 5 s; eps.line_current_3 (0x011B) within envelope — standby is
        2.4 W, i.e. ≈ 0.09 A at 28 V (the overcurrent trip on this line is 2.5 A)
      fr: eps.pl_payload (0x0113) = 1 < 5 s ; eps.line_current_3 (0x011B) dans l'enveloppe — l'attente
        consomme 2,4 W, soit ≈ 0.09 A sous 28 V (le seuil de surintensité de cette ligne est de 2.5 A)
  - id: q3
    kind: check
    text:
      en: '3. Command STANDBY: PAYLOAD_SET_MODE(mode=1) (S8.1 func_id 26)'
      fr: '3. Commander STANDBY : PAYLOAD_SET_MODE(mode=1) (S8.1 func_id 26)'
    hint:
      en: 'payload.mode (0x0600) = 1 (STANDBY). Modes: 0 OFF, 1 STANDBY, 2 IMAGING, 3 CALIBRATION'
      fr: 'payload.mode (0x0600) = 1 (STANDBY). Modes : 0 OFF, 1 STANDBY, 2 IMAGING, 3 CALIBRATION'
  - id: q4
    kind: check
    text:
      en: '4. Enable payload HK: HK_ENABLE(sid=5) (S3.5), then HK_REQUEST(sid=5) (S3.27)'
      fr: '4. Activer la HK charge utile : HK_ENABLE(sid=5) (S3.5), puis HK_REQUEST(sid=5) (S3.27)'
    hint:
      en: SID 5 periodic within one 8 s interval; payload.imager_status (0x0611) no fault bits; payload.fpa_temp
        (0x0601) valid, +8 to +14 °C
      fr: SID 5 périodique en moins d'un intervalle de 8 s ; payload.imager_status (0x0611) sans bit de
        défaut ; payload.fpa_temp (0x0601) valide, de +8 à +14 °C
  - id: q5
    kind: check
    text:
      en: 5. Verify storage initialised
      fr: 5. Vérifier que le stockage est initialisé
    hint:
      en: payload.mem_used_mb (0x060B) of payload.mem_total_mb (0x060A) = 20000 MB; payload.product_count
        (0x0648)
      fr: payload.mem_used_mb (0x060B) sur payload.mem_total_mb (0x060A) = 20000 Mo ; payload.product_count
        (0x0648)
  - id: q6
    kind: check
    text:
      en: GO COM-010
      fr: GO COM-010
- id: WB-5.6-C010
  title:
    en: COM-010 FPA Cooler Activation (confirm each step; spans eclipse)
    fr: COM-010 Activation du refroidisseur du FPA (confirmer chaque étape ; s'étend sur une éclipse)
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - COM-010
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: 1. Record the pre-activation state; cooler OFF
      fr: 1. Consigner l'état avant activation ; refroidisseur sur OFF
    hint:
      en: payload.fpa_temp (0x0601) at the uncooled equilibrium +8 to +14 °C; payload.mode (0x0600) =
        1
      fr: payload.fpa_temp (0x0601) à l'équilibre non refroidi, de +8 à +14 °C ; payload.mode (0x0600)
        = 1
  - id: q2
    kind: check
    text:
      en: '2. Enable the cooler: FPA_COOLER(on=1) (S8.1 func_id 43)'
      fr: '2. Activer le refroidisseur : FPA_COOLER(on=1) (S8.1 func_id 43)'
    hint:
      en: tcs.cooler_fpa (0x040C) = 1 and eps.pl_fpa_cooler (0x0114) = 1 — both, or the cooler is not
        actually running
      fr: tcs.cooler_fpa (0x040C) = 1 et eps.pl_fpa_cooler (0x0114) = 1 — les deux, sinon le refroidisseur
        ne fonctionne pas réellement
  - id: q3
    kind: check
    text:
      en: 3. Verify the power draw — HK_REQUEST(sid=1) (S3.27)
      fr: 3. Vérifier la puissance consommée — HK_REQUEST(sid=1) (S3.27)
    hint:
      en: eps.power_cons (0x0106) up 14–16 W; payload.cooler_pwr (0x0602) ≈ 15 W; eps.bus_voltage (0x0105)
        > 27.0 V
      fr: eps.power_cons (0x0106) en hausse de 14–16 W ; payload.cooler_pwr (0x0602) ≈ 15 W ; eps.bus_voltage
        (0x0105) > 27.0 V
  - id: q4
    kind: check
    text:
      en: 4. Monitor the ramp (exponential, not linear — a slower reading at T+5 than at T+2 is expected)
      fr: 4. Surveiller la rampe (exponentielle, non linéaire — une décroissance plus lente à T+5 qu'à
        T+2 est normale)
    hint:
      en: T+2 min < +4 °C; T+5 min < −8 °C
      fr: T+2 min < +4 °C ; T+5 min < −8 °C
  - id: q5
    kind: check
    text:
      en: 5. Monitor settling
      fr: 5. Surveiller la stabilisation
    hint:
      en: T+10 min ∈ [−16.0, −14.0] °C; T+15 min ∈ [−16.0, −15.0] °C. A reading below −16.5 °C is a control
        fault, not an over-performing cooler
      fr: T+10 min ∈ [−16.0, −14.0] °C ; T+15 min ∈ [−16.0, −15.0] °C. Une lecture inférieure à −16.5
        °C est un défaut de régulation, pas un refroidisseur plus performant que prévu
  - id: q6
    kind: check
    text:
      en: 6. Verify readiness and margin
      fr: 6. Vérifier la disponibilité et la marge
    hint:
      en: payload.fpa_ready (0x0610) = 1 (60 s hysteresis); payload.fpa_setpoint (0x0631) = −15.0; payload.cooler_margin_k
        (0x064B) > 0 (expect ≈ +5 K); floor at payload.cooler_floor_c (0x064A)
      fr: payload.fpa_ready (0x0610) = 1 (hystérésis de 60 s) ; payload.fpa_setpoint (0x0631) = −15.0
        ; payload.cooler_margin_k (0x064B) > 0 (attendu ≈ +5 K) ; plancher indiqué par payload.cooler_floor_c
        (0x064A)
  - id: q7
    kind: check
    text:
      en: 7. Hold through eclipse
      fr: 7. Maintenir pendant l'éclipse
    hint:
      en: T_fpa stays in [−16.5, −14.5] °C; bus > 27.0 V
      fr: T_fpa reste dans [−16.5, −14.5] °C ; bus > 27.0 V
  - id: q8
    kind: check
    text:
      en: GO COM-011
      fr: GO COM-011
- id: WB-5.6-C011
  title:
    en: COM-011 Payload Calibration (confirm each step)
    fr: COM-011 Étalonnage de la charge utile (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - COM-011
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. Close the shutter: PAYLOAD_SET_SHUTTER(position=0) (S8.1 func 119)'
      fr: '1. Fermer l''obturateur : PAYLOAD_SET_SHUTTER(position=0) (S8.1 func 119)'
    hint:
      en: payload.shutter_pos (0x063C) = 0 (closed)
      fr: payload.shutter_pos (0x063C) = 0 (fermé)
  - id: q2
    kind: check
    text:
      en: '2. Dark set: PAYLOAD_SET_MODE(mode=1) (func 26), PAYLOAD_CAL_LAMP(on=0) (func 95), PAYLOAD_START_CALIBRATION(mode=0)
        (func 37, 0 = DARK)'
      fr: '2. Série d''obscurité : PAYLOAD_SET_MODE(mode=1) (func 26), PAYLOAD_CAL_LAMP(on=0) (func 95),
        PAYLOAD_START_CALIBRATION(mode=0) (func 37, 0 = DARK)'
    hint:
      en: payload.mode = 3 (CALIBRATION); payload.calibration_active (0x062A) = 1; on completion S5 event
        0x060B CALIBRATION_COMPLETE; payload.dark_frame_cnt (0x0642) > 0
      fr: payload.mode = 3 (CALIBRATION) ; payload.calibration_active (0x062A) = 1 ; à la fin, événement
        S5 0x060B CALIBRATION_COMPLETE ; payload.dark_frame_cnt (0x0642) > 0
  - id: q3
    kind: check
    text:
      en: '3. Flat set: PAYLOAD_SET_SHUTTER(position=1) (func 119), PAYLOAD_CAL_LAMP(on=1) (func 95),
        PAYLOAD_START_CALIBRATION(mode=1) (func 37, 1 = FLAT)'
      fr: '3. Série de champ plat : PAYLOAD_SET_SHUTTER(position=1) (func 119), PAYLOAD_CAL_LAMP(on=1)
        (func 95), PAYLOAD_START_CALIBRATION(mode=1) (func 37, 1 = FLAT)'
    hint:
      en: payload.cal_lamp_on (0x0615) = 1; payload.bias_frame_cnt (0x0643) > 0; lamp back OFF afterwards
      fr: payload.cal_lamp_on (0x0615) = 1 ; payload.bias_frame_cnt (0x0643) > 0 ; lampe ramenée sur OFF
        ensuite
  - id: q4
    kind: check
    text:
      en: 4. Verify the correction set is valid across the four bands
      fr: 4. Vérifier que le jeu de corrections est valide sur les quatre bandes
    hint:
      en: payload.cal_valid_mask (0x0646) bits 0–3 (blue/green/red/nir) all set; payload.snr (0x0616)
        recorded
      fr: payload.cal_valid_mask (0x0646) bits 0–3 (bleu/vert/rouge/PIR) tous positionnés ; payload.snr
        (0x0616) consigné
  - id: q5
    kind: check
    text:
      en: '5. Calibration-site overpass: AOCS_FINE_READY_CHECK (func 89), then AOCS_SET_MODE(mode=5) (func
        0) — FINE_POINT is mode 5'
      fr: '5. Survol du site d''étalonnage : AOCS_FINE_READY_CHECK (func 89), puis AOCS_SET_MODE(mode=5)
        (func 0) — FINE_POINT est le mode 5'
    hint:
      en: aocs.fine_ready (0x02C5) = 0; aocs.mode (0x020F) = 5
      fr: aocs.fine_ready (0x02C5) = 0 ; aocs.mode (0x020F) = 5
  - id: q6
    kind: check
    text:
      en: '6. Return: PAYLOAD_SET_MODE(mode=1) STANDBY, shutter OPEN, AOCS_SET_MODE(mode=4) NOMINAL'
      fr: '6. Retour : PAYLOAD_SET_MODE(mode=1) STANDBY, obturateur OUVERT, AOCS_SET_MODE(mode=4) NOMINAL'
    hint:
      en: payload.mode = 1; payload.shutter_pos = 1; aocs.mode = 4
      fr: payload.mode = 1 ; payload.shutter_pos = 1 ; aocs.mode = 4
  - id: q7
    kind: check
    text:
      en: GO COM-012
      fr: GO COM-012
- id: WB-5.6-C012
  title:
    en: COM-012 First Light (confirm each step)
    fr: COM-012 Première lumière (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - COM-012
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: 1. FD GO for First Light
      fr: 1. GO du FD pour la première lumière
    hint:
      en: recorded
      fr: consigné
  - id: q2
    kind: check
    text:
      en: '2. AOCS to FINE_POINT: AOCS_FINE_READY_CHECK (func 89), AOCS_SET_MODE(mode=5) (func 0)'
      fr: '2. SCAO en FINE_POINT : AOCS_FINE_READY_CHECK (func 89), AOCS_SET_MODE(mode=5) (func 0)'
    hint:
      en: aocs.fine_ready (0x02C5) = 0; aocs.mode (0x020F) = 5
      fr: aocs.fine_ready (0x02C5) = 0 ; aocs.mode (0x020F) = 5
  - id: q3
    kind: check
    text:
      en: 3. Verify the FPA is at temperature
      fr: 3. Vérifier que le FPA est à température
    hint:
      en: payload.fpa_ready (0x0610) = 1; payload.fpa_temp (0x0601) ∈ [−16.5, −14.5] °C
      fr: payload.fpa_ready (0x0610) = 1 ; payload.fpa_temp (0x0601) ∈ [−16.5, −14.5] °C
  - id: q4
    kind: check
    text:
      en: '4. Verify the payload is ready and record the baselines: HK_REQUEST(sid=5) (S3.27)'
      fr: '4. Vérifier que la charge utile est prête et consigner les références : HK_REQUEST(sid=5) (S3.27)'
    hint:
      en: payload.mode (0x0600) = 1; payload.store_used (0x0604) < 97 %; record payload.image_count (0x0605)
        and payload.mem_used_mb (0x060B)
      fr: payload.mode (0x0600) = 1 ; payload.store_used (0x0604) < 97 % ; consigner payload.image_count
        (0x0605) et payload.mem_used_mb (0x060B)
  - id: q5
    kind: check
    text:
      en: '5. Command IMAGING and capture: PAYLOAD_SET_MODE(mode=2) (func 26), then PAYLOAD_CAPTURE(scene_id=1,
        lines=2048) (S8.1 func 28)'
      fr: '5. Commander IMAGING et capturer : PAYLOAD_SET_MODE(mode=2) (func 26), puis PAYLOAD_CAPTURE(scene_id=1,
        lines=2048) (S8.1 func 28)'
    hint:
      en: S1.1 accept + S1.7 complete; S5 event 0x0613 IMAGE_CAPTURED. 2048 lines at 244 Hz = 8.4 s ≈
        59 km along-track at 7.06 km/s
      fr: Acceptation S1.1 + exécution S1.7 ; événement S5 0x0613 IMAGE_CAPTURED. 2048 lignes à 244 Hz
        = 8,4 s ≈ 59 km le long de la trace à 7,06 km/s
  - id: q6
    kind: check
    text:
      en: 6. Verify the product stored
      fr: 6. Vérifier que le produit est stocké
    hint:
      en: payload.mem_used_mb (0x060B) increased; payload.product_count (0x0648) +1; size ≈ 4 MB (image_size_mb,
        the courseware abstraction)
      fr: payload.mem_used_mb (0x060B) en hausse ; payload.product_count (0x0648) +1 ; taille ≈ 4 Mo (image_size_mb,
        l'abstraction pédagogique)
  - id: q7
    kind: check
    text:
      en: '7. Return to STANDBY (PAYLOAD_SET_MODE(mode=1)), then downlink over Service 13: TTC_SET_DOWNLINK_MODE(on=1),
        TTC_SET_DATA_RATE(rate=1), S13_CREATE_TRANSFER(scene_id=1, size_mb=0) … S13_END_TRANSFER(transfer_id=T),
        then back to LOW'
      fr: '7. Revenir en STANDBY (PAYLOAD_SET_MODE(mode=1)), puis transmettre par le service 13 : TTC_SET_DOWNLINK_MODE(on=1),
        TTC_SET_DATA_RATE(rate=1), S13_CREATE_TRANSFER(scene_id=1, size_mb=0) … S13_END_TRANSFER(transfer_id=T),
        puis retour en LOW'
    hint:
      en: 128000 bps; payload.transfer_active (0x062D) = 1, payload.transfer_progress (0x062E) rising,
        then 0x062D = 0; CRC-32 OK on the ground
      fr: 128000 bit/s ; payload.transfer_active (0x062D) = 1, payload.transfer_progress (0x062E) en hausse,
        puis 0x062D = 0 ; CRC-32 correct au sol
  - id: q8
    kind: check
    text:
      en: 8. Quality assessment (next pass if needed)
      fr: 8. Évaluation de la qualité (au passage suivant si nécessaire)
    hint:
      en: mean DN, contrast, geo-registration; payload.last_scene_quality (0x060D); aocs.geoloc_err_m
        (0x02C7)
      fr: DN moyen, contraste, géoréférencement ; payload.last_scene_quality (0x060D) ; aocs.geoloc_err_m
        (0x02C7)
