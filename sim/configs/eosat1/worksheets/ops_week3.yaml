      page: aocs
      param: '0x02AA'
      label:
        en: MCS › AOC › aocs.total_pointing_err_3sig (0x02AA)
        fr: MCS › AOC › aocs.total_pointing_err_3sig (0x02AA)
    - tool: mcs
      page: aocs
      param: '0x0217'
      label:
        en: MCS › AOC › aocs.att_error (0x0217)
        fr: MCS › AOC › aocs.att_error (0x0217)
    - tool: mcs
      page: aocs
      param: '0x0205'
      label:
        en: MCS › AOC › aocs.rate_pitch (0x0205)
        fr: MCS › AOC › aocs.rate_pitch (0x0205)
    - tool: mcs
      bd: cmdhist
      label: *id036
