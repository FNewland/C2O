      en: Comm check completed (all positions readable)
      fr: Vérification des communications effectuée (tous les postes audibles)
  - id: q3
    kind: check
    text:
      en: BP-2 (first_contact.yaml) loaded; spacecraft in phase 3 (BOOTLOADER)
      fr: BP-2 (first_contact.yaml) chargé ; satellite en phase 3 (BOOTLOADER)
