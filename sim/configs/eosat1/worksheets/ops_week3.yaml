- id: WB-5.5-DB
  title:
    en: Day 3 Post-Shift Debrief Reflection
    fr: 'Jour 3 : réflexion de débriefing après le quart'
  phase: debrief
  applies:
    tools:
    - mcs
    - instructor
    - delayed_tm
    - orbit
    - radio
    - portal
    procedures: []
    pages: []
    scenarios: []
