- id: WB-5.6-C001
  title:
    en: COM-001 EPS Checkout (confirm each step)
    fr: COM-001 Vérification de l'EPS (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - COM-001
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: 1. Baseline bus voltage — HK_REQUEST(sid=1) (S3.27)
      fr: 1. Tension de bus de référence — HK_REQUEST(sid=1) (S3.27)
    hint:
      en: eps.bus_voltage (0x0105) ∈ [28.4, 34.0] V (the console's yellow band; the bus is not regulated
        — it follows the battery up to the 33.4 V cap)
      fr: eps.bus_voltage (0x0105) ∈ [28.4, 34.0] V (la bande jaune de la console ; le bus n'est pas régulé
        — il suit la batterie jusqu'au plafond de 33.4 V)
    step: '1'
    where:
    - tool: mcs
      page: eps
      param: '0x0105'
      label:
        en: MCS › EPS › eps.bus_voltage (0x0105)
        fr: MCS › EPS › eps.bus_voltage (0x0105)
  - id: q2
    kind: check
    text:
      en: 2. Battery V & SoC — GET_PARAM(param_id=0x0100), GET_PARAM(param_id=0x0101) (S20.3)
      fr: 2. Tension et SoC de la batterie — GET_PARAM(param_id=0x0100), GET_PARAM(param_id=0x0101) (S20.3)
    hint:
      en: 'eps.bat_voltage (0x0100) ∈ [24.0, 33.6] V (GomSpace BPX 8S-1P, 100 Wh: 24.0 V empty, 28.8 V
        nominal, 33.6 V full); eps.bat_soc (0x0101) > 70 %'
      fr: 'eps.bat_voltage (0x0100) ∈ [24.0, 33.6] V (GomSpace BPX 8S-1P de 100 Wh : 24.0 V vide, 28.8
        V nominal, 33.6 V pleine) ; eps.bat_soc (0x0101) > 70 %'
    step: '2'
    where:
    - tool: mcs
      page: eps
      param: '0x0100'
      label:
        en: MCS › EPS › eps.bat_voltage (0x0100)
        fr: MCS › EPS › eps.bat_voltage (0x0100)
    - tool: mcs
      page: eps
      param: '0x0101'
      label:
        en: MCS › EPS › eps.bat_soc (0x0101)
        fr: MCS › EPS › eps.bat_soc (0x0101)
  - id: q3
    kind: check
    text:
      en: 3. Solar array sunlit performance — HK_REQUEST(sid=1), sunlit and sun-pointed
      fr: 3. Performances du générateur solaire au Soleil — HK_REQUEST(sid=1), éclairé et pointé vers
        le Soleil
    hint:
      en: eps.power_gen (0x0107) ∈ [40, 90] W (88.6 W is the whole-spacecraft peak; about 80 W is normal
        when sun-pointed)
      fr: eps.power_gen (0x0107) ∈ [40, 90] W (88.6 W est la crête de l'ensemble du satellite ; environ
        80 W est normal en pointage solaire)
    step: '3'
    where:
    - tool: mcs
      page: eps
      param: '0x0107'
      label:
        en: MCS › EPS › eps.power_gen (0x0107)
        fr: MCS › EPS › eps.power_gen (0x0107)
  - id: q4
    kind: check
    text:
      en: 4. Eclipse discharge — HK_REQUEST(sid=1) at entry and at mid-eclipse
      fr: 4. Décharge en éclipse — HK_REQUEST(sid=1) à l'entrée et à mi-éclipse
    hint:
      en: eps.power_gen ~0 W within 30 s of entry; eps.bat_soc falling < 1.5 %/min; eps.bus_voltage >
        30.9 V
      fr: eps.power_gen ~0 W dans les 30 s après l'entrée ; eps.bat_soc en baisse de moins de 1.5 %/min
        ; eps.bus_voltage > 30.9 V
    step: '4'
    where:
    - tool: mcs
      page: eps
      param: '0x0107'
      label:
        en: MCS › EPS › eps.power_gen (0x0107)
        fr: MCS › EPS › eps.power_gen (0x0107)
    - tool: mcs
      page: eps
      param: '0x0101'
      label:
        en: MCS › EPS › eps.bat_soc (0x0101)
        fr: MCS › EPS › eps.bat_soc (0x0101)
    - tool: mcs
      page: eps
      param: '0x0105'
      label:
        en: MCS › EPS › eps.bus_voltage (0x0105)
        fr: MCS › EPS › eps.bus_voltage (0x0105)
    - tool: mcs
      page: eps
      focus: eps-eclipse
      label: *id009
  - id: q5
    kind: check
    text:
      en: 5. Eclipse-exit charge recovery — HK_REQUEST(sid=1) at exit + 5 min
      fr: 5. Reprise de charge en sortie d'éclipse — HK_REQUEST(sid=1) à la sortie + 5 min
    hint:
      en: eps.power_gen > 35 W within 60 s of exit; eps.bat_soc rising within 120 s
      fr: eps.power_gen > 35 W dans les 60 s après la sortie ; eps.bat_soc en hausse dans les 120 s
    step: '5'
    where:
    - tool: mcs
      page: eps
      param: '0x0107'
      label:
        en: MCS › EPS › eps.power_gen (0x0107)
        fr: MCS › EPS › eps.power_gen (0x0107)
    - tool: mcs
      page: eps
      param: '0x0101'
      label:
        en: MCS › EPS › eps.bat_soc (0x0101)
        fr: MCS › EPS › eps.bat_soc (0x0101)
    - tool: mcs
      page: eps
      focus: eps-eclipse
      label: *id009
  - id: q6
    kind: check
    text:
      en: 6. Power budget — GET_PARAM(param_id=0x0108); orbit-average generation against consumption
      fr: 6. Bilan de puissance — GET_PARAM(param_id=0x0108) ; production moyenne sur l'orbite comparée
        à la consommation
    hint:
      en: orbit-average generation > consumption; end-of-eclipse SoC > 50 % under nominal load
      fr: production moyenne sur l'orbite > consommation ; SoC en fin d'éclipse > 50 % sous charge nominale
    step: '6'
    where:
    - tool: mcs
      page: eps
      focus: eps-orbit-margin
      label: &id050
        en: MCS › EPS › Projections › Orbit-average margin
        fr: MCS › EPS › Prévisions › Marge moyenne sur l'orbite
    - tool: mcs
      page: eps
      focus: eps-flow
      label: *id030
    - tool: docs
      path: manual/01_eps.md
      anchor: 32-orbit-average-budget-worst-beta-eol
      label: *id043
    - tool: mcs
      page: eps
      param: '0x0108'
      label:
        en: MCS › EPS › eps.eclipse_flag (0x0108)
        fr: MCS › EPS › eps.eclipse_flag (0x0108)
  - id: q7
    kind: check
    text:
      en: '7. Bus regulation under a load transient — record eps.pl_htr_bat (0x0115) first, then EPS_POWER_ON(line_index=5)
        (S8.1 func_id 19), and EPS_POWER_OFF(line_index=5) (func 20) only if the line was off at entry.
        Not the payload: its line is OFF until COM-009'
      fr: '7. Régulation du bus lors d''un transitoire de charge — consigner d''abord eps.pl_htr_bat (0x0115),
        puis EPS_POWER_ON(line_index=5) (S8.1 func_id 19), et EPS_POWER_OFF(line_index=5) (func 20) seulement
        si la ligne était éteinte à l''entrée. Pas la charge utile : sa ligne est OFF jusqu''à COM-009'
    hint:
      en: eps.bus_voltage stays in [30.2, 34.0] V within 5 s and returns to [30.9, 34.0] V within 10 s;
        eps.pl_htr_bat back to its entry value
      fr: eps.bus_voltage reste dans [30.2, 34.0] V en 5 s et revient dans [30.9, 34.0] V en 10 s ; eps.pl_htr_bat
        revenu à sa valeur d'entrée
    step: '7'
    where:
    - tool: mcs
      page: eps
      param: '0x0115'
      label:
        en: MCS › EPS › eps.pl_htr_bat (0x0115)
        fr: MCS › EPS › eps.pl_htr_bat (0x0115)
    - tool: mcs
      page: eps
      param: '0x0105'
      label:
        en: MCS › EPS › eps.bus_voltage (0x0105)
        fr: MCS › EPS › eps.bus_voltage (0x0105)
  - id: q8
    kind: check
    text:
      en: GO COM-002
      fr: GO COM-002
- id: WB-5.6-C002
