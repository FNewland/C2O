- id: WB-A-CTG-001
  title:
    en: CTG-001 Under-Voltage Load Shed
    fr: CTG-001 Délestage sur sous-tension
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - CTG-001
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. EPS: Detect and confirm, and read what FDIR has already shed: HK_REQUEST(sid=1) (S3.27).
        FD authorises; announce "UNDERVOLTAGE — completing load shed from the ground"'
      fr: '1. EPS : Détecter et confirmer, et lire ce que la FDIR a déjà délesté : HK_REQUEST(sid=1) (S3.27).
        Le FD autorise ; annoncer « UNDERVOLTAGE — completing load shed from the ground »'
    hint:
      en: 'eps.uv_flag (0x010E) = 1; record eps.bus_voltage (0x0105, expect < 27.0 V), eps.bat_soc (0x0101),
        eps.bat_voltage (0x0100), eps.power_cons (0x0106), eps.power_gen (0x0107), eps.eclipse_flag (0x0108),
        eps.load_shed_stage (0x0134), and eps.pl_payload (0x0113), eps.pl_fpa_cooler (0x0114), eps.pl_ttc_tx
        (0x0112), eps.pl_aocs_wheels (0x0117): 1 = still ON, 0 = already shed'
      fr: 'eps.uv_flag (0x010E) = 1 ; consigner eps.bus_voltage (0x0105, attendu < 27.0 V), eps.bat_soc
        (0x0101), eps.bat_voltage (0x0100), eps.power_cons (0x0106), eps.power_gen (0x0107), eps.eclipse_flag
        (0x0108), eps.load_shed_stage (0x0134), et eps.pl_payload (0x0113), eps.pl_fpa_cooler (0x0114),
        eps.pl_ttc_tx (0x0112), eps.pl_aocs_wheels (0x0117) : 1 = encore sur ON, 0 = déjà délestée'
    step: '1'
  - id: q2
    kind: check
    text:
      en: '2. EPS: Priority 1, payload OFF (payload line still ON): PAYLOAD_SET_MODE(mode=0) (S8.1 func
        26), HK_REQUEST(sid=5), HK_REQUEST(sid=1) 30 s later'
      fr: '2. EPS : Priorité 1, charge utile sur OFF (ligne de la charge utile encore sur ON) : PAYLOAD_SET_MODE(mode=0)
        (S8.1 func 26), HK_REQUEST(sid=5), HK_REQUEST(sid=1) 30 s plus tard'
    hint:
      en: payload.mode (0x0600) = 0 within 10 s; eps.power_cons down; eps.bus_voltage recorded
      fr: payload.mode (0x0600) = 0 en 10 s ; eps.power_cons en baisse ; eps.bus_voltage consignée
    step: '2'
  - id: q3
    kind: check
    text:
      en: '3. EPS: Priority 2, FPA cooler OFF (cooler line still ON): FPA_COOLER(on=0) (func 43), GET_PARAM(param_id=0x040C),
        HK_REQUEST(sid=3), HK_REQUEST(sid=1) 30 s later'
      fr: '3. EPS : Priorité 2, refroidisseur du FPA sur OFF (ligne du refroidisseur encore sur ON) :
        FPA_COOLER(on=0) (func 43), GET_PARAM(param_id=0x040C), HK_REQUEST(sid=3), HK_REQUEST(sid=1) 30
        s plus tard'
    hint:
      en: tcs.cooler_fpa (0x040C) = 0 within 5 s; eps.power_cons down about 15 W; eps.bus_voltage recorded
      fr: tcs.cooler_fpa (0x040C) = 0 en 5 s ; eps.power_cons en baisse d'environ 15 W ; eps.bus_voltage
        consignée
    step: '3'
  - id: q4
    kind: check
    text:
      en: '4. EPS: Priority 3, transmitter OFF (ttc_tx line still ON): TTC_PA_OFF (func 67), HK_REQUEST(sid=6),
        HK_REQUEST(sid=1) 30 s later'
      fr: '4. EPS : Priorité 3, émetteur sur OFF (ligne ttc_tx encore sur ON) : TTC_PA_OFF (func 67),
        HK_REQUEST(sid=6), HK_REQUEST(sid=1) 30 s plus tard'
    hint:
      en: ttc.pa_on (0x0516) = 0 within 5 s; eps.power_cons down about 20 W; eps.bus_voltage recorded.
        The S-band downlink is now gone; uplink stays
      fr: ttc.pa_on (0x0516) = 0 en 5 s ; eps.power_cons en baisse d'environ 20 W ; eps.bus_voltage consignée.
        La liaison descendante bande S est perdue ; la liaison montante reste
    step: '4'
  - id: q5
    kind: check
    text:
      en: '5. EPS: Priority 4, wheels line OFF (still ON): EPS_POWER_OFF(line_index=7) (func 20), HK_REQUEST(sid=1)
        30 s later'
      fr: '5. EPS : Priorité 4, ligne des roues sur OFF (encore sur ON) : EPS_POWER_OFF(line_index=7)
        (func 20), HK_REQUEST(sid=1) 30 s plus tard'
    hint:
      en: eps.pl_aocs_wheels (0x0117) = 0 within 5 s; eps.bus_voltage recorded. Active attitude control
        is lost
      fr: eps.pl_aocs_wheels (0x0117) = 0 en 5 s ; eps.bus_voltage consignée. Le contrôle d'attitude actif
        est perdu
    step: '5'
  - id: q6
    kind: check
    text:
      en: '5B. EPS: Last resort only, every level taken and the bus still falling — OBC EMERGENCY: OBC_SET_MODE(mode=2)
        (func 50), HK_REQUEST(sid=4)'
      fr: '5B. EPS : Dernier recours seulement, tous les paliers pris et le bus toujours en baisse — OBC
        en EMERGENCY : OBC_SET_MODE(mode=2) (func 50), HK_REQUEST(sid=4)'
    hint:
      en: obdh.mode (0x0300) = 2 within 15 s
      fr: obdh.mode (0x0300) = 2 en 15 s
    step: 5B
  - id: q7
    kind: check
    text:
      en: '6. EPS: Monitor recovery: HK_REQUEST(sid=1) every 60 s'
      fr: '6. EPS : Surveiller le rétablissement : HK_REQUEST(sid=1) toutes les 60 s'
    hint:
      en: eps.bus_voltage and eps.bat_soc trending up; eps.power_gen > 0 W in sunlight; eps.bat_current
        (0x0109) positive (charging). Restore when bus > 28.0 V and SoC > 40 %
      fr: eps.bus_voltage et eps.bat_soc en hausse ; eps.power_gen > 0 W au Soleil ; eps.bat_current (0x0109)
        positif (en charge). Rétablir quand le bus > 28.0 V et le SoC > 40 %
    step: '6'
  - id: q8
    kind: check
    text:
      en: '7. EPS: Restore in reverse priority, bus stable 5 min between loads, each line powered before
        its unit: EPS_POWER_ON(line_index=7) (+ AOCS_SET_MODE(mode=2) only if aocs.mode (0x020F) = 0);
        EPS_POWER_ON(line_index=2) if eps.pl_ttc_tx = 0, then TTC_PA_ON; EPS_POWER_ON(line_index=4) if
        eps.pl_fpa_cooler = 0, then FPA_COOLER(on=1); EPS_POWER_ON(line_index=3) if eps.pl_payload = 0,
        then PAYLOAD_SET_MODE(mode=1)'
      fr: '7. EPS : Rétablir dans l''ordre de priorité inverse, bus stable 5 min entre deux charges, chaque
        ligne alimentée avant son équipement : EPS_POWER_ON(line_index=7) (+ AOCS_SET_MODE(mode=2) seulement
        si aocs.mode (0x020F) = 0) ; EPS_POWER_ON(line_index=2) si eps.pl_ttc_tx = 0, puis TTC_PA_ON ;
        EPS_POWER_ON(line_index=4) si eps.pl_fpa_cooler = 0, puis FPA_COOLER(on=1) ; EPS_POWER_ON(line_index=3)
        si eps.pl_payload = 0, puis PAYLOAD_SET_MODE(mode=1)'
    hint:
      en: eps.pl_aocs_wheels = 1 within 5 s; after each load eps.bus_voltage > 27.5 V and eps.bat_soc
        > 35 %; all loads back, power budget positive
      fr: eps.pl_aocs_wheels = 1 en 5 s ; après chaque charge, eps.bus_voltage > 27.5 V et eps.bat_soc
        > 35 % ; toutes les charges rétablies, bilan de puissance positif
    step: '7'
- id: WB-A-CTG-002
  title:
    en: CTG-002 AOCS Anomaly Recovery
    fr: CTG-002 Reprise après anomalie SCAO
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - CTG-002
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. Assess the AOCS state: HK_REQUEST(sid=2) (S3.27)'
      fr: '1. Évaluer l''état de l''AOCS : HK_REQUEST(sid=2) (S3.27)'
    hint:
      en: aocs.mode (0x020F) and aocs.att_error (0x0217) received within 5 s — telemetry live
      fr: aocs.mode (0x020F) et aocs.att_error (0x0217) reçus en 5 s — télémesure vivante
    step: '1'
  - id: q2
    kind: check
    text:
      en: '2. Wheel health: HK_REQUEST(sid=2)'
      fr: '2. État des roues : HK_REQUEST(sid=2)'
    hint:
      en: aocs.rw1_speed … aocs.rw4_speed (0x0207–0x020A) within ±6000 rpm; aocs.rw1_temp … aocs.rw4_temp
        (0x0218–0x021B) < 60 °C. A wheel ≥ 60 °C or oscillating > ±500 rpm/s → step 3; all nominal → step
        5
      fr: aocs.rw1_speed … aocs.rw4_speed (0x0207–0x020A) à ±6000 tr/min ; aocs.rw1_temp … aocs.rw4_temp
        (0x0218–0x021B) < 60 °C. Une roue ≥ 60 °C ou oscillant de plus de ±500 tr/min/s → étape 3 ; toutes
        nominales → étape 5
    step: '2'
  - id: q3
    kind: check
    text:
      en: '3. Disable the failed wheel: AOCS_DISABLE_WHEEL(wheel_idx=N) (S8.1 func 2)'
      fr: '3. Désactiver la roue défaillante : AOCS_DISABLE_WHEEL(wheel_idx=N) (S8.1 func 2)'
    hint:
      en: its speed decays toward 0 rpm within 30 s; aocs.att_error never above 10°
      fr: sa vitesse décroît vers 0 tr/min en 30 s ; aocs.att_error jamais au-dessus de 10°
    step: '3'
  - id: q4
    kind: check
    text:
      en: '4. Desaturate: AOCS_DESATURATE (S8.1 func 1)'
      fr: '4. Désaturer : AOCS_DESATURATE (S8.1 func 1)'
    hint:
      en: active wheels trend toward 0 rpm within 120 s; aocs.rate_roll, aocs.rate_pitch, aocs.rate_yaw
        (0x0204–0x0206) < 0.5°/s; momentum < 20 % of capacity on every active wheel
      fr: roues actives tendant vers 0 tr/min en 120 s ; aocs.rate_roll, aocs.rate_pitch, aocs.rate_yaw
        (0x0204–0x0206) < 0.5°/s ; moment cinétique < 20 % de la capacité sur chaque roue active
    step: '4'
  - id: q5
    kind: check
    text:
      en: '5. Body rates stable: HK_REQUEST(sid=2)'
      fr: '5. Vitesses angulaires stables : HK_REQUEST(sid=2)'
    hint:
      en: aocs.rate_roll (0x0204), aocs.rate_pitch (0x0205), aocs.rate_yaw (0x0206) < 0.1°/s
      fr: aocs.rate_roll (0x0204), aocs.rate_pitch (0x0205), aocs.rate_yaw (0x0206) < 0.1°/s
    step: '5'
  - id: q6
    kind: check
    text:
      en: '6. Restore NOMINAL: AOCS_SET_MODE(mode=4) (S8.1 func 0)'
      fr: '6. Rétablir NOMINAL : AOCS_SET_MODE(mode=4) (S8.1 func 0)'
    hint:
      en: aocs.mode = 4 within 10 s; aocs.att_error < 1.0° within 120 s → recovered; otherwise step 7
      fr: aocs.mode = 4 en 10 s ; aocs.att_error < 1.0° en 120 s → rétabli ; sinon étape 7
    step: '6'
  - id: q7
    kind: check
    text:
      en: '7. Escalation on a multi-wheel failure only: AOCS_SET_MODE(mode=2) — DETUMBLE'
      fr: '7. Escalade en cas de panne de plusieurs roues seulement : AOCS_SET_MODE(mode=2) — DETUMBLE'
    hint:
      en: aocs.mode = 2 within 5 s; rates trending to 0 within 300 s; not below 2.0°/s in 300 s → EMG-001
      fr: aocs.mode = 2 en 5 s ; vitesses tendant vers 0 en 300 s ; pas sous 2.0°/s en 300 s → EMG-001
    step: '7'
- id: WB-A-CTG-007
  title:
    en: CTG-007 Reaction Wheel Anomaly
    fr: CTG-007 Anomalie de roue de réaction
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - CTG-007
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. Identify the wheel: HK_REQUEST(sid=2) (S3.27)'
      fr: '1. Identifier la roue : HK_REQUEST(sid=2) (S3.27)'
    hint:
      en: aocs.rw1_speed … aocs.rw4_speed (0x0207–0x020A) value and rate of change; aocs.rw1_temp … aocs.rw4_temp
        (0x0218–0x021B). Flag oscillation > ±500 rpm/10 s, speed > 6500 rpm or temperature > 60 °C. More
        than one wheel → CTG-002 step 7
      fr: aocs.rw1_speed … aocs.rw4_speed (0x0207–0x020A) valeur et vitesse de variation ; aocs.rw1_temp
        … aocs.rw4_temp (0x0218–0x021B). Signaler une oscillation de plus de ±500 tr/min/10 s, une vitesse
        > 6500 tr/min ou une température > 60 °C. Plus d'une roue → CTG-002 étape 7
    step: '1'
  - id: q2
    kind: check
    text:
      en: '2. Disable it: AOCS_DISABLE_WHEEL(wheel_idx=N) (S8.1 func 2)'
      fr: '2. La désactiver : AOCS_DISABLE_WHEEL(wheel_idx=N) (S8.1 func 2)'
    hint:
      en: its speed starts decaying within 10 s; aocs.att_error (0x0217) transient ≤ 5°; aocs.rate_roll,
        aocs.rate_pitch, aocs.rate_yaw (0x0204–0x0206) < 1.0°/s
      fr: sa vitesse commence à décroître en 10 s ; transitoire de aocs.att_error (0x0217) ≤ 5° ; aocs.rate_roll,
        aocs.rate_pitch, aocs.rate_yaw (0x0204–0x0206) < 1.0°/s
    step: '2'
  - id: q3
    kind: check
    text:
      en: '3. Three-wheel control: watch the AOCS reconfigure — no command'
      fr: '3. Contrôle à trois roues : observer la reconfiguration de l''AOCS — aucune commande'
    hint:
      en: control loop reconfigured within 15 s; aocs.att_error back below 2.0° within 60 s; the three
        remaining wheels share the momentum
      fr: boucle de contrôle reconfigurée en 15 s ; aocs.att_error de nouveau sous 2.0° en 60 s ; les
        trois roues restantes se partagent le moment cinétique
    step: '3'
  - id: q4
    kind: check
    text:
      en: '4. Desaturate the three: AOCS_DESATURATE (S8.1 func 1)'
      fr: '4. Désaturer les trois : AOCS_DESATURATE (S8.1 func 1)'
    hint:
      en: active wheels toward 0 rpm over 120 s, none above 5000 rpm; rates < 0.5°/s during the manoeuvre;
        done when every wheel < 2000 rpm and rates < 0.2°/s
      fr: roues actives vers 0 tr/min sur 120 s, aucune au-dessus de 5000 tr/min ; vitesses < 0.5°/s pendant
        la manœuvre ; terminé quand chaque roue < 2000 tr/min et les vitesses < 0.2°/s
    step: '4'
  - id: q5
    kind: check
    text:
      en: '5. Stable pointing on three wheels: HK_REQUEST(sid=2) every 60 s for 5 min'
      fr: '5. Pointage stable sur trois roues : HK_REQUEST(sid=2) toutes les 60 s pendant 5 min'
    hint:
      en: aocs.att_error (0x0217) < 1.5° (relaxed from 1.0°); aocs.rate_roll (0x0204), aocs.rate_pitch
        (0x0205), aocs.rate_yaw (0x0206) < 0.1°/s; active wheel temperatures < 55 °C
      fr: aocs.att_error (0x0217) < 1.5° (assoupli depuis 1.0°) ; aocs.rate_roll (0x0204), aocs.rate_pitch
        (0x0205), aocs.rate_yaw (0x0206) < 0.1°/s ; températures des roues actives < 55 °C
    step: '5'
  - id: q6
    kind: check
    text:
      en: '6. NOMINAL on three wheels: AOCS_SET_MODE(mode=4) (S8.1 func 0)'
      fr: '6. NOMINAL sur trois roues : AOCS_SET_MODE(mode=4) (S8.1 func 0)'
    hint:
      en: aocs.mode (0x020F) = 4 within 15 s; aocs.att_error < 1.5° within 120 s
      fr: aocs.mode (0x020F) = 4 en 15 s ; aocs.att_error < 1.5° en 120 s
    step: '6'
  - id: q7
    kind: check
    text:
      en: '7. Wheel recovery, ground-authorised attempt only: AOCS_ENABLE_WHEEL(wheel_idx=N) (S8.1 func
        3)'
      fr: '7. Reprise de la roue, tentative autorisée par le sol seulement : AOCS_ENABLE_WHEEL(wheel_idx=N)
        (S8.1 func 3)'
    hint:
      en: 'smooth spin-up within 30 s, no oscillation → four-wheel control restored; otherwise stay on
        three. Over-temperature: watch it for 2 orbits (recoverable below 45 °C); oscillation: bearing
        analysis; divergence: driver electronics, no re-enable without a patch'
      fr: 'montée en vitesse régulière en 30 s, sans oscillation → contrôle à quatre roues rétabli ; sinon
        rester sur trois. Surchauffe : la surveiller 2 orbites (récupérable sous 45 °C) ; oscillation
        : analyse des roulements ; divergence : électronique de pilotage, pas de réactivation sans correctif'
    step: '7'
- id: WB-A-CTG-008
  title:
    en: CTG-008 Star Tracker Failure
    fr: CTG-008 Panne du senseur stellaire
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - CTG-008
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. Confirm the ST1 failure: HK_REQUEST(sid=2) (S3.27)'
      fr: '1. Confirmer la panne de ST1 : HK_REQUEST(sid=2) (S3.27)'
    hint:
      en: aocs.st1_status (0x0240) = 4 (FAILED) within 15 s; aocs.st1_num_stars (0x0241) = 0; record aocs.mode
        (0x020F), aocs.att_error (0x0217, may be rising) and the body rates (0x0204–0x0206)
      fr: aocs.st1_status (0x0240) = 4 (FAILED) en 15 s ; aocs.st1_num_stars (0x0241) = 0 ; consigner
        aocs.mode (0x020F), aocs.att_error (0x0217, peut augmenter) et les vitesses angulaires (0x0204–0x0206)
    step: '1'
  - id: q2
    kind: check
    text:
      en: '2. Power on ST2: ST2_POWER(on=1) (S8.1 func 5), HK_REQUEST(sid=2)'
      fr: '2. Mettre ST2 sous tension : ST2_POWER(on=1) (S8.1 func 5), HK_REQUEST(sid=2)'
    hint:
      en: 'aocs.st2_status (0x0243) 0 → 1 (BOOT) within 5 s → 2 (TRACKING) within 60 s; still 1 after
        60 s: wait up to 120 s in total'
      fr: 'aocs.st2_status (0x0243) 0 → 1 (BOOT) en 5 s → 2 (TRACKING) en 60 s ; toujours 1 après 60 s
        : attendre jusqu''à 120 s au total'
    step: '2'
  - id: q3
    kind: check
    text:
      en: '3. Select ST2: ST_SELECT(unit=2) (S8.1 func 6; wire encoding 1 = ST1, 2 = ST2), HK_REQUEST(sid=2)
        10 s later'
      fr: '3. Sélectionner ST2 : ST_SELECT(unit=2) (S8.1 func 6 ; codage 1 = ST1, 2 = ST2), HK_REQUEST(sid=2)
        10 s plus tard'
    hint:
      en: aocs.st2_status = 2 (TRACKING, stable) within 15 s; aocs.att_error decreasing; aocs.mode in
        (or back in) the pre-failure mode
      fr: aocs.st2_status = 2 (TRACKING, stable) en 15 s ; aocs.att_error en baisse ; aocs.mode dans (ou
        revenu dans) le mode d'avant la panne
    step: '3'
  - id: q4
    kind: check
    text:
      en: '4. Isolate ST1: ST1_POWER(on=0) (S8.1 func 4), HK_REQUEST(sid=2)'
      fr: '4. Isoler ST1 : ST1_POWER(on=0) (S8.1 func 4), HK_REQUEST(sid=2)'
    hint:
      en: aocs.st1_num_stars (0x0241) = 0 within 15 s; aocs.att_error < 0.1°; aocs.rate_roll and aocs.rate_yaw
        < 0.01°/s; aocs.rate_pitch ∈ [0.053, 0.073]°/s (nadir)
      fr: aocs.st1_num_stars (0x0241) = 0 en 15 s ; aocs.att_error < 0.1° ; aocs.rate_roll et aocs.rate_yaw
        < 0.01°/s ; aocs.rate_pitch ∈ [0.053, 0.073]°/s (nadir)
    step: '4'
  - id: q5
    kind: check
    text:
      en: '5. Fallback, both trackers failed: AOCS_SET_MODE(mode=3) COARSE_SUN (S8.1 func 0), HK_REQUEST(sid=2),
        PAYLOAD_SET_MODE(mode=0)'
      fr: '5. Repli, les deux senseurs en panne : AOCS_SET_MODE(mode=3) COARSE_SUN (S8.1 func 0), HK_REQUEST(sid=2),
        PAYLOAD_SET_MODE(mode=0)'
    hint:
      en: 'aocs.mode = 3 within 20 s; aocs.css_valid (0x0248) = 1; aocs.css_sun_x … aocs.css_sun_z (0x0245–0x0247)
        measured; aocs.att_error < 5°. Tell the FD: fine pointing lost, no imaging'
      fr: 'aocs.mode = 3 en 20 s ; aocs.css_valid (0x0248) = 1 ; aocs.css_sun_x … aocs.css_sun_z (0x0245–0x0247)
        mesurés ; aocs.att_error < 5°. Prévenir le FD : pointage fin perdu, aucune prise de vue'
    step: '5'
  - id: q6
    kind: check
    text:
      en: '6. End of procedure: a final HK_REQUEST(sid=2)'
      fr: '6. Fin de la procédure : un dernier HK_REQUEST(sid=2)'
    hint:
      en: final AOCS state recorded; ST1 failure and ST2 activation in the anomaly report
      fr: état final de l'AOCS consigné ; panne de ST1 et activation de ST2 dans le rapport d'anomalie
    step: '6'
- id: WB-A-CTG-010
  title:
    en: CTG-010 OBDH Watchdog Recovery
    fr: CTG-010 Reprise après chien de garde OBDH
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - CTG-010
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. Confirm the watchdog reset: HK_REQUEST(sid=4) (S3.27)'
      fr: '1. Confirmer la réinitialisation par chien de garde : HK_REQUEST(sid=4) (S3.27)'
    hint:
      en: obdh.reboot_count (0x030A) incremented since the last known value; record obdh.mode (0x0300,
        expect 0) and obdh.cpu_load (0x0302, expect < 70 %)
      fr: obdh.reboot_count (0x030A) incrémenté depuis la dernière valeur connue ; consigner obdh.mode
        (0x0300, attendu 0) et obdh.cpu_load (0x0302, attendu < 70 %)
    step: '1'
  - id: q2
    kind: check
    text:
      en: '1b. Only if obdh.sw_image (0x0311) = 0 (bootloader): OBC_BOOT_APP (S8.1 func 55) — before any
        HK_ENABLE or OBC_SET_MODE'
      fr: '1b. Seulement si obdh.sw_image (0x0311) = 0 (chargeur d''amorçage) : OBC_BOOT_APP (S8.1 func
        55) — avant tout HK_ENABLE ou OBC_SET_MODE'
    hint:
      en: S1.1 + S1.7 within 15 s; obdh.sw_image = 1 within 15 s
      fr: S1.1 + S1.7 en 15 s ; obdh.sw_image = 1 en 15 s
    step: 1b
  - id: q3
    kind: check
    text:
      en: '2. Post-reboot state: HK_REQUEST(sid=4)'
      fr: '2. État après redémarrage : HK_REQUEST(sid=4)'
    hint:
      en: obdh.mode (0x0300) = 0 (NOMINAL; 1 SAFE means re-initialisation found an issue — go on with
        caution); obdh.cpu_load (0x0302) < 70 %
      fr: obdh.mode (0x0300) = 0 (NOMINAL ; 1 SAFE signifie que la réinitialisation a trouvé un problème
        — poursuivre avec prudence) ; obdh.cpu_load (0x0302) < 70 %
    step: '2'
  - id: q4
    kind: check
    text:
      en: '3. All housekeeping: HK_REQUEST (S3.27) of SIDs 1, 2, 3, 4, 5, 6'
      fr: '3. Toutes les données de servitude : HK_REQUEST (S3.27) des SID 1, 2, 3, 4, 5, 6'
    hint:
      en: all six frames within 30 s; no subsystem in an unexpected mode or out of limits (any → its CTG
        card)
      fr: les six trames en 30 s ; aucun sous-système dans un mode inattendu ou hors limites (sinon →
        sa fiche CTG)
    step: '3'
  - id: q5
    kind: check
    text:
      en: '4. Time and data integrity: HK_REQUEST(sid=2) for aocs.gps_fix, SET_TIME(cuc_seconds=T_corrected)
        (S9.1), OBC_GPS_TIME_SYNC (S8.1 func 80), HK_REQUEST(sid=4), REQUEST_TIME (S9.2)'
      fr: '4. Temps et intégrité des données : HK_REQUEST(sid=2) pour aocs.gps_fix, SET_TIME(cuc_seconds=T_corrected)
        (S9.1), OBC_GPS_TIME_SYNC (S8.1 func 80), HK_REQUEST(sid=4), REQUEST_TIME (S9.2)'
    hint:
      en: obdh.time_ref (0x0A13) ≠ 0 (1 GROUND or 2 GPS) within 15 s; T_obc within ±1 s of ground time;
        stored command queue and mass-memory partitions intact
      fr: obdh.time_ref (0x0A13) ≠ 0 (1 GROUND ou 2 GPS) en 15 s ; T_obc à ±1 s du temps sol ; file des
        commandes stockées et partitions de la mémoire de masse intactes
    step: '4'
  - id: q6
    kind: check
    text:
      en: '5. Root-cause indicators: HK_REQUEST(sid=1); review the obdh.cpu_load (0x0302) trend and the
        EPS data before the reset'
      fr: '5. Indices de cause première : HK_REQUEST(sid=1) ; examiner la tendance de obdh.cpu_load (0x0302)
        et les données EPS d''avant la réinitialisation'
    hint:
      en: eps.bus_voltage (0x0105) > 27.0 V; transient (SEU, brief dip) → log it; systemic (repeated high
        CPU, memory errors) → ground software team
      fr: eps.bus_voltage (0x0105) > 27.0 V ; transitoire (SEU, creux bref) → le consigner ; systémique
        (CPU élevée répétée, erreurs mémoire) → équipe logiciel sol
    step: '5'
  - id: q7
    kind: check
    text:
      en: '6. Restore NOMINAL if the OBC is in SAFE: OBC_SET_MODE(mode=0) (S8.1 func 50)'
      fr: '6. Rétablir NOMINAL si l''OBC est en SAFE : OBC_SET_MODE(mode=0) (S8.1 func 50)'
    hint:
      en: obdh.mode (0x0300) = 0 within 10 s; obdh.cpu_load < 70 %; aocs.mode (0x020F) undisturbed
      fr: obdh.mode (0x0300) = 0 en 10 s ; obdh.cpu_load < 70 % ; aocs.mode (0x020F) non perturbé
    step: '6'
- id: WB-A-CTG-012
  title:
    en: CTG-012 Overcurrent Response
    fr: CTG-012 Traitement d'une surintensité
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - CTG-012
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. Identify the tripped line(s): HK_REQUEST(sid=1) (S3.27)'
      fr: '1. Identifier la ou les lignes déclenchées : HK_REQUEST(sid=1) (S3.27)'
    hint:
      en: 'eps.oc_trip_flags (0x010D) decoded: bit N = line N (bits 0–1 are the non-switchable obc and
        ttc_rx)'
      fr: 'eps.oc_trip_flags (0x010D) décodé : bit N = ligne N (les bits 0–1 sont les lignes non commutables
        obc et ttc_rx)'
    step: '1'
  - id: q2
    kind: check
    text:
      en: '2. Per-line current: HK_REQUEST(sid=1)'
      fr: '2. Courant de chaque ligne : HK_REQUEST(sid=1)'
    hint:
      en: 'the tripped line''s current (0x0118–0x011F) near 0 A — the LCL opened it; still elevated =
        persistent fault: do NOT re-enable, escalate. Line status (0x0110–0x0117) OFF; eps.bus_voltage
        (0x0105) > 27.0 V'
      fr: 'courant de la ligne déclenchée (0x0118–0x011F) proche de 0 A — le LCL l''a ouverte ; toujours
        élevé = défaut persistant : ne PAS réactiver, escalader. État de ligne (0x0110–0x0117) sur OFF
        ; eps.bus_voltage (0x0105) > 27.0 V'
    step: '2'
  - id: q3
    kind: check
    text:
      en: '3. Isolate the fault — coordinate with the affected subsystem''s position (TT&C, Payload, EPS/TCS,
        AOCS): known state before the trip? inrush during a mode change or power-on?'
      fr: '3. Isoler le défaut — se coordonner avec la position du sous-système concerné (TT&C, charge
        utile, EPS/TCS, AOCS) : état connu avant le déclenchement ? appel de courant lors d''un changement
        de mode ou d''une mise sous tension ?'
    hint:
      en: likely transient → step 4; hardware damage suspected → HOLD and escalate
      fr: transitoire probable → étape 4 ; dommage matériel soupçonné → HOLD et escalader
    step: '3'
  - id: q4
    kind: check
    text:
      en: '4. Reset the overcurrent flag: EPS_RESET_OC_FLAG(line_index=N) (S8.1 func 21)'
      fr: '4. Réinitialiser l''indicateur de surintensité : EPS_RESET_OC_FLAG(line_index=N) (S8.1 func
        21)'
    hint:
      en: the line's bit of eps.oc_trip_flags (0x010D) clear, and still clear 5 s later
      fr: bit de la ligne dans eps.oc_trip_flags (0x010D) à zéro, et toujours à zéro 5 s plus tard
    step: '4'
  - id: q5
    kind: check
    text:
      en: '5. Re-enable the line: EPS_POWER_ON(line_index=N) (S8.1 func 19)'
      fr: '5. Réactiver la ligne : EPS_POWER_ON(line_index=N) (S8.1 func 19)'
    hint:
      en: line status (0x0110 + N) = 1 within 5 s; line current (0x0118 + N) back to nominal; eps.oc_trip_flags
        still clear after 30 s
      fr: état de ligne (0x0110 + N) = 1 en 5 s ; courant de ligne (0x0118 + N) revenu au nominal ; eps.oc_trip_flags
        toujours à zéro après 30 s
    step: '5'
  - id: q6
    kind: check
    text:
      en: '6. Downstream recovery: HK_REQUEST of the owner''s SID (2 AOCS, 5 Payload, 6 TT&C, 3 heaters)
        and HK_REQUEST(sid=1)'
      fr: '6. Reprise en aval : HK_REQUEST du SID du propriétaire (2 AOCS, 5 charge utile, 6 TT&C, 3 réchauffeurs)
        et HK_REQUEST(sid=1)'
    hint:
      en: the subsystem works again; eps.power_cons (0x0106) shows the load; eps.bus_voltage > 27.0 V
      fr: le sous-système fonctionne de nouveau ; eps.power_cons (0x0106) reflète la charge ; eps.bus_voltage
        > 27.0 V
    step: '6'
- id: WB-A-CTG-015
  title:
    en: CTG-015 Corrupted Image Recovery
    fr: CTG-015 Reprise après image corrompue
  phase: during
  applies:
    tools:
    - mcs
    - delayed_tm
    procedures:
    - CTG-015
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. Detect and quantify: HK_REQUEST(sid=5) (S3.27)'
      fr: '1. Détecter et quantifier : HK_REQUEST(sid=5) (S3.27)'
    hint:
      en: 'payload.checksum_errors (0x0609) delta against the baseline; payload.last_scene_id (0x060C)
        — the affected scene; ground quick-look of its last product: missing lines, streaks, corrupt blocks?;
        payload.image_count (0x0605) recorded'
      fr: 'écart de payload.checksum_errors (0x0609) par rapport à la référence ; payload.last_scene_id
        (0x060C) — la scène touchée ; aperçu sol de son dernier produit : lignes manquantes, traînées,
        blocs corrompus ? ; payload.image_count (0x0605) consigné'
    step: '1'
  - id: q2
    kind: check
    text:
      en: '2. FPA check: HK_REQUEST(sid=5), HK_REQUEST(sid=3)'
      fr: '2. Contrôle du FPA : HK_REQUEST(sid=5), HK_REQUEST(sid=3)'
    hint:
      en: payload.fpa_temp (0x0601) recorded and cross-checked with tcs.temp_fpa (0x0408); payload.fpa_ready
        (0x0610) = 1?; tcs.cooler_fpa (0x040C) = 1? FPA warm (not ready) → step 3; cold and ready → step
        4
      fr: payload.fpa_temp (0x0601) consignée et recoupée avec tcs.temp_fpa (0x0408) ; payload.fpa_ready
        (0x0610) = 1 ? ; tcs.cooler_fpa (0x040C) = 1 ? FPA chaud (non prêt) → étape 3 ; froid et prêt
        → étape 4
    step: '2'
  - id: q3
    kind: check
    text:
      en: '3. FPA warm — abort and cool down: PAYLOAD_SET_MODE(mode=1) (S8.1 func 26), FPA_COOLER(on=1)
        (func 43), GET_PARAM(param_id=0x040C), HK_REQUEST(sid=5) every 60 s, HK_REQUEST(sid=3)'
      fr: '3. FPA chaud — interrompre et refroidir : PAYLOAD_SET_MODE(mode=1) (S8.1 func 26), FPA_COOLER(on=1)
        (func 43), GET_PARAM(param_id=0x040C), HK_REQUEST(sid=5) toutes les 60 s, HK_REQUEST(sid=3)'
    hint:
      en: payload.mode (0x0600) = 1 within 10 s; tcs.cooler_fpa (0x040C) = 1 within 5 s; payload.fpa_temp
        falling until payload.fpa_ready = 1 → step 5
      fr: payload.mode (0x0600) = 1 en 10 s ; tcs.cooler_fpa (0x040C) = 1 en 5 s ; payload.fpa_temp en
        baisse jusqu'à payload.fpa_ready = 1 → étape 5
    step: '3'
  - id: q4
    kind: check
    text:
      en: '4. Memory segments: HK_REQUEST(sid=5)'
      fr: '4. Segments mémoire : HK_REQUEST(sid=5)'
    hint:
      en: payload.mem_segments_bad (0x0612) and payload.store_used (0x0604) recorded. > 0 → CTG-016 marks
        the bad segment first; 0 with a cold FPA → transient (SEU) → step 5
      fr: payload.mem_segments_bad (0x0612) et payload.store_used (0x0604) consignés. > 0 → CTG-016 marque
        d'abord le segment défectueux ; 0 avec un FPA froid → transitoire (SEU) → étape 5
    step: '4'
  - id: q5
    kind: check
    text:
      en: '5. Delete and re-capture: PAYLOAD_DELETE_IMAGE(scene_id=N) (func 30), then PAYLOAD_CAPTURE(scene_id=N,
        lines=L) (func 28) — only with payload.fpa_ready = 1, no unmarked bad segment and aocs.att_error
        (0x0217) < 0.1°'
      fr: '5. Supprimer et acquérir de nouveau : PAYLOAD_DELETE_IMAGE(scene_id=N) (func 30), puis PAYLOAD_CAPTURE(scene_id=N,
        lines=L) (func 28) — seulement avec payload.fpa_ready = 1, aucun segment défectueux non marqué
        et aocs.att_error (0x0217) < 0.1°'
    hint:
      en: 'the delete: payload.store_used falls, payload.image_count (0x0605) −1; the capture: payload.image_count
        +1; payload.checksum_errors (0x0609) does not increase'
      fr: 'suppression : payload.store_used en baisse, payload.image_count (0x0605) −1 ; capture : payload.image_count
        +1 ; payload.checksum_errors (0x0609) n''augmente pas'
    step: '5'
  - id: q6
    kind: check
    text:
      en: '6. Post-capture verification: HK_REQUEST(sid=5)'
      fr: '6. Vérification après acquisition : HK_REQUEST(sid=5)'
    hint:
      en: payload.checksum_errors no further increase; on the ground the new product's CRC32 matches the
        on-board transfer report and the quick-look is clean; payload.store_used within capacity. Log
        scene, error count, root cause (thermal / memory / transient) and result
      fr: payload.checksum_errors sans nouvelle hausse ; au sol, le CRC32 du nouveau produit concorde
        avec le rapport de transfert de bord et l'aperçu est propre ; payload.store_used dans la capacité.
        Consigner scène, nombre d'erreurs, cause première (thermique / mémoire / transitoire) et résultat
    step: '6'
- id: WB-A-CTG-017
  title:
    en: CTG-017 Bus Failure Switchover
    fr: CTG-017 Basculement sur panne de bus
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - CTG-017
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. Detect missing housekeeping: HK_REQUEST (S3.27) of SIDs 1, 2, 3, 4, 5, 6'
      fr: '1. Détecter l''absence de données de servitude : HK_REQUEST (S3.27) des SID 1, 2, 3, 4, 5,
        6'
    hint:
      en: which SIDs answer and which are missing; missing from several subsystems → step 2
      fr: quels SID répondent et lesquels manquent ; absence pour plusieurs sous-systèmes → étape 2
    step: '1'
  - id: q2
    kind: check
    text:
      en: '2. Bus status: HK_REQUEST(sid=4)'
      fr: '2. État des bus : HK_REQUEST(sid=4)'
    hint:
      en: obdh.bus_a_status (0x030F), obdh.bus_b_status (0x0310) (0 OK, 1 ERROR) and obdh.active_bus (0x030E)
        (0 A, 1 B) recorded. Active bus in ERROR → switch; both OK → look at the subsystems instead
      fr: obdh.bus_a_status (0x030F), obdh.bus_b_status (0x0310) (0 OK, 1 ERROR) et obdh.active_bus (0x030E)
        (0 A, 1 B) consignés. Bus actif en ERROR → basculer ; les deux OK → examiner plutôt les sous-systèmes
    step: '2'
  - id: q3
    kind: check
    text:
      en: '3. Switch the bus: OBC_SELECT_BUS(bus=1) from A to B, or OBC_SELECT_BUS(bus=0) from B to A
        (S8.1 func_id 54); HK_REQUEST(sid=4) 15 s later'
      fr: '3. Basculer de bus : OBC_SELECT_BUS(bus=1) de A vers B, ou OBC_SELECT_BUS(bus=0) de B vers
        A (S8.1 func_id 54) ; HK_REQUEST(sid=4) 15 s plus tard'
    hint:
      en: obdh.active_bus (0x030E) shows the new bus; obdh.bus_a_status and obdh.bus_b_status recorded
      fr: obdh.active_bus (0x030E) indique le nouveau bus ; obdh.bus_a_status et obdh.bus_b_status consignés
    step: '3'
  - id: q4
    kind: check
    text:
      en: '4. Verify all housekeeping resumes: HK_REQUEST of SIDs 1–6 again'
      fr: '4. Vérifier la reprise de toutes les données de servitude : HK_REQUEST des SID 1–6 de nouveau'
    hint:
      en: every SID answers within 15 s; values sensible (no stuck values, no zeros); eps.bat_soc (0x0101)
        and eps.bus_voltage (0x0105) recorded; aocs.mode (0x020F) and payload.mode (0x0600) unchanged;
        obdh.cpu_load (0x0302) not high; announce "ALL HK RESTORED"
      fr: chaque SID répond en 15 s ; valeurs cohérentes (ni valeurs figées, ni zéros) ; eps.bat_soc (0x0101)
        et eps.bus_voltage (0x0105) consignés ; aocs.mode (0x020F) et payload.mode (0x0600) inchangés
        ; obdh.cpu_load (0x0302) non élevée ; annoncer « ALL HK RESTORED »
    step: '4'
  - id: q5
    kind: check
    text:
      en: '5. Post-switchover assessment: log the HK-loss time, the failed bus, the gap, the affected
        subsystems and the new bus; stay on the new bus — no switch back without engineering approval
        and testing'
      fr: '5. Évaluation post-basculement : consigner l''heure de la perte des HK, le bus en panne, la
        durée de l''interruption, les sous-systèmes touchés et le nouveau bus ; rester sur le nouveau
        bus — pas de retour sans approbation ni essais de l''ingénierie'
    hint:
      en: failed bus recorded for engineering
      fr: bus en panne consigné pour l'ingénierie
    step: '5'
- id: WB-A-CTG-019
  title:
    en: CTG-019 No Telemetry at Pass Start
    fr: CTG-019 Absence de télémesure en début de passage
  phase: during
  applies:
    tools:
    - mcs
    - radio
    procedures:
    - CTG-019
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. Confirm the ground station is nominal: antenna tracking with valid pointing, uplink transmitter
        on frequency and polarisation, Doppler pre-compensation, no local RFI or weather, receiver on
        the expected downlink frequency'
      fr: '1. Confirmer que la station sol est nominale : poursuite de l''antenne avec un pointage valide,
        émetteur montant sur la bonne fréquence et la bonne polarisation, précompensation Doppler, ni
        brouillage local ni météo, récepteur sur la fréquence descendante attendue'
    hint:
      en: ground nominal → spacecraft-side diagnosis
      fr: sol nominal → diagnostic côté satellite
    step: '1'
  - id: q2
    kind: check
    text:
      en: '2. TT&C TX power line, blind: HK_REQUEST(sid=1) (S3.27), EPS_POWER_ON(line_index=2) (S8.1 func
        19); wait 30 s'
      fr: '2. Ligne d''alimentation TX du TT&C, en aveugle : HK_REQUEST(sid=1) (S3.27), EPS_POWER_ON(line_index=2)
        (S8.1 func 19) ; attendre 30 s'
    hint:
      en: downlink carrier on the ground receiver? signal → step 6; weak carrier → step 4; nothing → step
        3
      fr: porteuse descendante sur le récepteur sol ? signal → étape 6 ; porteuse faible → étape 4 ; rien
        → étape 3
    step: '2'
  - id: q3
    kind: check
    text:
      en: '3. Transponder switch, blind: TTC_SWITCH_REDUNDANT (func 64), wait 45 s; then TTC_SWITCH_PRIMARY
        (func 63)'
      fr: '3. Basculement de transpondeur, en aveugle : TTC_SWITCH_REDUNDANT (func 64), attendre 45 s
        ; puis TTC_SWITCH_PRIMARY (func 63)'
    hint:
      en: carrier on the redundant unit's frequency → step 6; neither unit → step 4
      fr: porteuse sur la fréquence de l'équipement redondant → étape 6 ; aucun des deux → étape 4
    step: '3'
  - id: q4
    kind: check
    text:
      en: '4. PA on, blind: TTC_PA_ON (func 66), wait 15 s; still nothing: TTC_PA_OFF (func 67), 10 s,
        TTC_PA_ON, 15 s'
      fr: '4. PA en marche, en aveugle : TTC_PA_ON (func 66), attendre 15 s ; toujours rien : TTC_PA_OFF
        (func 67), 10 s, TTC_PA_ON, 15 s'
    hint:
      en: downlink carrier after PA ON → step 6; still none → step 5
      fr: porteuse descendante après le PA ON → étape 6 ; toujours rien → étape 5
    step: '4'
  - id: q5
    kind: check
    text:
      en: '5. Antenna, only if its deployment is uncertain or known stowed: TTC_DEPLOY_ANTENNA (func 69)
        — irreversible burn-wire; wait 30 s'
      fr: '5. Antenne, seulement si son déploiement est incertain ou si elle est connue repliée : TTC_DEPLOY_ANTENNA
        (func 69) — fil thermofusible irréversible ; attendre 30 s'
    hint:
      en: 'with any TM: ttc.antenna_deployed (0x0520) = 1 and ttc.antenna_deployment_sensor (0x0536) =
        2; signal 15–25 dB stronger (ttc.antenna_deployment_ready (0x0535) = 0 beforehand means a pyro
        continuity fault: it will not fire). Signal → step 6; none → step 7'
      fr: 'avec de la TM : ttc.antenna_deployed (0x0520) = 1 et ttc.antenna_deployment_sensor (0x0536)
        = 2 ; signal plus fort de 15–25 dB (ttc.antenna_deployment_ready (0x0535) = 0 auparavant signale
        un défaut de continuité pyrotechnique : la commande ne se déclenchera pas). Signal → étape 6 ;
        rien → étape 7'
    step: '5'
  - id: q6
    kind: check
    text:
      en: '6. Verify link quality and subsystem health: HK_REQUEST(sid=6), HK_REQUEST(sid=1), HK_REQUEST(sid=4)'
      fr: '6. Vérifier la qualité de la liaison et la santé des sous-systèmes : HK_REQUEST(sid=6), HK_REQUEST(sid=1),
        HK_REQUEST(sid=4)'
    hint:
      en: 'ttc.link_status (0x0501) = 2; TT&C page (ground): ttc.rssi (0x0502) > −126 dBm, ttc.link_margin
        (0x0503) > 3.0 dB; ttc.pa_on (0x0516) = 1; ttc.pa_temp (0x050F) < 55 °C; ttc.antenna_deployed
        = 1; ttc.carrier_lock (0x0510) = 1; ttc.bit_sync (0x0511) = 1; radio page: ttc.eb_n0 (0x0519)
        > 10 dB; eps.bus_voltage (0x0105) > 27.0 V; eps.pl_ttc_tx (0x0112) = 1; obdh.mode (0x0300) not
        SAFE or EMERGENCY'
      fr: 'ttc.link_status (0x0501) = 2 ; page TT&C (sol) : ttc.rssi (0x0502) > −126 dBm, ttc.link_margin
        (0x0503) > 3.0 dB ; ttc.pa_on (0x0516) = 1 ; ttc.pa_temp (0x050F) < 55 °C ; ttc.antenna_deployed
        = 1 ; ttc.carrier_lock (0x0510) = 1 ; ttc.bit_sync (0x0511) = 1 ; page radio : ttc.eb_n0 (0x0519)
        > 10 dB ; eps.bus_voltage (0x0105) > 27.0 V ; eps.pl_ttc_tx (0x0112) = 1 ; obdh.mode (0x0300)
        ni SAFE ni EMERGENCY'
    step: '6'
  - id: q7
    kind: check
    text:
      en: '7. Escalation, no link: TTC_SET_TX_POWER(level=2) (S8.1 func 68) for the next attempt; log
        every blind command with its time; notify the FD and the Mission Director; book the next pass'
      fr: '7. Escalade, pas de liaison : TTC_SET_TX_POWER(level=2) (S8.1 func 68) pour la tentative suivante
        ; consigner chaque commande en aveugle avec son heure ; prévenir le FD et le directeur de mission
        ; réserver le passage suivant'
    hint:
      en: no link after two consecutive passes → EMG-004 (Loss of Communication)
      fr: sans liaison après deux passages consécutifs → EMG-004 (Perte de communication)
    step: '7'
- id: WB-A-CTG-020
  title:
    en: CTG-020 Ground Station Antenna Failure
    fr: CTG-020 Panne d'antenne de station sol
  phase: during
  applies:
    tools:
    - mcs
    - radio
    procedures:
    - CTG-020
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. Confirm the signal loss is not spacecraft-side. Last frame before the loss: ttc.rssi (0x0502)
        nominal, ttc.link_margin (0x0503) > 3 dB, ttc.pa_on (0x0516) = 1, ttc.pa_temp (0x050F) < 55 °C.
        A sudden drop to the noise floor = equipment. Check antenna tracking, LNA, downconverter, IF/baseband'
      fr: '1. Confirmer que la perte du signal ne vient pas du satellite. Dernière trame avant la perte
        : ttc.rssi (0x0502) nominal, ttc.link_margin (0x0503) > 3 dB, ttc.pa_on (0x0516) = 1, ttc.pa_temp
        (0x050F) < 55 °C. Une chute brutale au plancher de bruit = matériel. Contrôler la poursuite de
        l''antenne, le LNA, le convertisseur abaisseur, la FI et la bande de base'
    hint:
      en: ground equipment failure confirmed or strongly suspected → step 2; spacecraft side suspected
        → CTG-019 or CTG-003
      fr: panne de matériel sol confirmée ou fortement soupçonnée → étape 2 ; côté satellite soupçonné
        → CTG-019 ou CTG-003
    step: '1'
  - id: q2
    kind: check
    text:
      en: '2. Attempt local ground station recovery: antenna controller reset or re-acquisition of the
        track; backup LNA, cables, power supplies — up to 2 min'
      fr: '2. Tenter un rétablissement local de la station sol : réinitialisation du contrôleur d''antenne
        ou réacquisition de la poursuite ; LNA de secours, câbles, alimentations — jusqu''à 2 min'
    hint:
      en: station back → resume and log; not back in 2 min → step 3
      fr: station rétablie → reprendre et consigner ; pas rétablie en 2 min → étape 3
    step: '2'
  - id: q3
    kind: check
    text:
      en: '3. Notify the Flight Director and assess the impact: "GS [station] antenna failure at [time];
        spacecraft healthy and transmitting; ground cannot receive"; pass time left, pending commands,
        urgent data, time-critical operations'
      fr: '3. Informer le directeur de vol et évaluer l''impact : « GS [station] antenna failure at [time]
        ; spacecraft healthy and transmitting ; ground cannot receive » ; temps de passage restant, commandes
        en attente, données urgentes, opérations à échéance'
    hint:
      en: critical operations pending → step 4 now; otherwise → step 5
      fr: opérations critiques en attente → étape 4 tout de suite ; sinon → étape 5
    step: '3'
  - id: q4
    kind: check
    text:
      en: '4. Coordinate an alternate ground station (FD authorises): next windows at the other stations
        of the network, priority booking, orbit elements and frequency plan, matching uplink and downlink
        configuration'
      fr: '4. Coordonner une station sol de secours (le FD autorise) : prochaines fenêtres aux autres
        stations du réseau, réservation prioritaire, éléments orbitaux et plan de fréquences, configuration
        montante et descendante conforme'
    hint:
      en: alternate station coordinated — or none available and the spacecraft safe on its own
      fr: station de secours coordonnée — ou aucune disponible et le satellite en sécurité de lui-même
    step: '4'
  - id: q5
    kind: check
    text:
      en: '5. Replan the contact schedule: drop the failed station until it is repaired, add alternate
        passes, assess the 24–48 h contact time and the on-board imaging, battery and storage plans; notify
        engineering; log the incident'
      fr: '5. Replanifier le programme des contacts : retirer la station en panne jusqu''à sa réparation,
        ajouter des passages de secours, évaluer le temps de contact sur 24–48 h et les plans de bord
        de prise de vue, de batterie et de stockage ; prévenir l''ingénierie ; consigner l''incident'
    hint:
      en: schedule replanned, incident logged
      fr: programme replanifié, incident consigné
    step: '5'
