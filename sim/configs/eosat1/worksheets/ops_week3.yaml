      fr: pass_override = 1 confirmé (param 0x05FF)
  - id: q5
    kind: check
    text:
      en: FD has loaded LEOP procedure pack into procedure panel
      fr: Le FD a chargé le jeu de procédures LEOP dans le panneau de procédures
