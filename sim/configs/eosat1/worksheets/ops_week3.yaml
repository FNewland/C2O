- id: WB-A-CTG-001
  title:
    en: CTG-001 Under-Voltage Load Shed
    fr: CTG-001 Délestage sur sous-tension
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - CTG-001
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. EPS: Confirm eps.bus_voltage (0x0105) below the FDIR undervoltage threshold 24.5 V (in-model
        shed starts at 25.0 V; bus warning 27.0 V, bus critical 25.0 V)'
      fr: '1. EPS : Confirmer que eps.bus_voltage (0x0105) est sous le seuil de sous-tension FDIR de 24.5
        V (le délestage modélisé commence à 25.0 V ; avertissement bus 27.0 V, bus critique 25.0 V)'
    hint:
      en: recorded
      fr: consigné
  - id: q2
    kind: check
    text:
      en: '2. EPS: Report to FD; recommend priority-1 shed'
      fr: '2. EPS : Rendre compte au FD ; recommander le délestage de priorité 1'
    hint:
      en: recommendation logged
      fr: recommandation consignée
  - id: q3
    kind: check
    text:
      en: '3. FD: GO for load shed'
      fr: '3. FD : GO pour le délestage'
    hint:
      en: granted
      fr: accordé
  - id: q4
    kind: check
    text:
      en: '4. EPS: Priority 1 — payload OFF: PAYLOAD_SET_MODE(mode=0) (S8.1 func 26)'
      fr: '4. EPS : Priorité 1 — charge utile coupée : PAYLOAD_SET_MODE(mode=0) (S8.1 func 26)'
    hint:
      en: payload.mode (0x0600) = 0
      fr: payload.mode (0x0600) = 0
  - id: q5
    kind: check
    text:
      en: '5. EPS: Priority 2 — cooler OFF: FPA_COOLER(on=0) (func 43)'
      fr: '5. EPS : Priorité 2 — refroidisseur coupé : FPA_COOLER(on=0) (func 43)'
    hint:
      en: tcs.cooler_fpa (0x040C) = 0
      fr: tcs.cooler_fpa (0x040C) = 0
  - id: q6
    kind: check
    text:
      en: '6. EPS: Priority 3 — PA off: TTC_PA_OFF (func 67). Note the S-band TM stops but the UHF beacon
        survives — it is a separate radio on the non-switchable ttc_rx line, so HK SID 11 keeps arriving'
      fr: '6. EPS : Priorité 3 — PA coupé : TTC_PA_OFF (func 67). Noter que la TM bande S s''arrête mais
        que la balise UHF subsiste — c''est une radio distincte, sur la ligne non commutable ttc_rx, de
        sorte que le SID 11 de HK continue d''arriver'
    hint:
      en: ttc.pa_on (0x0516) = 0, ttc.beacon_active (0x0527) still 1
      fr: ttc.pa_on (0x0516) = 0, ttc.beacon_active (0x0527) toujours à 1
  - id: q7
    kind: check
    text:
      en: '7. EPS: Priority 4 — wheels line off: EPS_POWER_OFF(line_index=7) (func 20)'
      fr: '7. EPS : Priorité 4 — ligne des roues coupée : EPS_POWER_OFF(line_index=7) (func 20)'
    hint:
      en: eps.pl_aocs_wheels (0x0117) = 0
      fr: eps.pl_aocs_wheels (0x0117) = 0
  - id: q8
    kind: check
    text:
      en: '8. EPS: (Last resort) staged shed EPS_EMERGENCY_LOAD_SHED(stage=N) (S8.1 func 25, stages 1–3)
        or OBC_SET_MODE(mode=2) EMERGENCY (func 50)'
      fr: '8. EPS : (Dernier recours) délestage par étages EPS_EMERGENCY_LOAD_SHED(stage=N) (S8.1 func
        25, étages 1–3) ou OBC_SET_MODE(mode=2) EMERGENCY (func 50)'
    hint:
      en: eps.load_shed_stage (0x0134)
      fr: eps.load_shed_stage (0x0134)
  - id: q9
    kind: check
    text:
      en: '9. EPS: Verify SoC stops dropping; bus recovers above 25.5 V (shed threshold + 0.5 V hysteresis;
        auto-restore then walks the lines back one per tick, in reverse shed order)'
      fr: '9. EPS : Vérifier que le SoC cesse de baisser ; le bus remonte au-dessus de 25.5 V (seuil de
        délestage + 0.5 V d''hystérésis ; la remise en service automatique rétablit ensuite les lignes
        une par une à chaque pas de simulation, dans l''ordre inverse du délestage)'
    hint:
      en: 'recovery time: s'
      fr: 'durée de reprise : s'
  - id: q10
    kind: check
    text:
      en: '10. SPACON: Acknowledge FDIR rule; log'
      fr: '10. SPACON : Acquitter la règle FDIR ; consigner'
    hint:
      en: logged
      fr: consigné
  - id: q11
    kind: check
    text:
      en: '11. EPS: File anomaly ticket'
      fr: '11. EPS : Remplir une fiche d''anomalie'
    hint:
      en: 'ticket #'
      fr: fiche n°
- id: WB-A-CTG-002
  title:
    en: CTG-002 AOCS Anomaly Recovery
    fr: CTG-002 Reprise après anomalie SCAO
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - CTG-002
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: 1. Read which sensor / actuator is faulted from the FDIR panel; HK_REQUEST(sid=2) (S3.27)
      fr: 1. Lire dans le panneau FDIR quel capteur / actionneur est en défaut ; HK_REQUEST(sid=2) (S3.27)
    hint:
      en: identified
      fr: identifié
  - id: q2
    kind: check
    text:
      en: '2. Command the sun-safe hold: AOCS_SET_MODE(mode=3) (S8.1 func 0) — mode 3 = COARSE_SUN. (There
        is no SAFE_POINT mode; mode 1 is SAFE_BOOT, a post-boot propagate-only state, not a recovery target)'
      fr: '2. Commander le attente sûre au Soleil : AOCS_SET_MODE(mode=3) (S8.1 func 0) — mode 3 = COARSE_SUN.
        (Il n''existe pas de mode SAFE_POINT ; le mode 1 est SAFE_BOOT, un état de propagation seule après
        amorçage, et non une cible de reprise)'
    hint:
      en: aocs.mode (0x020F) = 3
      fr: aocs.mode (0x020F) = 3
  - id: q3
    kind: check
    text:
      en: 3. Verify the spacecraft is stable
      fr: 3. Vérifier que le satellite est stable
    hint:
      en: rates (0x0204–0x0206) < 0.05°/s; aocs.att_error (0x0217) < 5°; no further alarm
      fr: vitesses (0x0204–0x0206) < 0.05°/s ; aocs.att_error (0x0217) < 5° ; aucune nouvelle alarme
  - id: q4
    kind: check
    text:
      en: '4. If momentum is the problem, dump it: AOCS_DESATURATE (S8.1 func 1) — DESAT is mode 7. Budget
        20–50 min for a full dump; imaging is inhibited and the spacecraft returns to its pre-desat mode'
      fr: '4. Si le moment cinétique est en cause, le décharger : AOCS_DESATURATE (S8.1 func 1) — DESAT
        est le mode 7. Prévoir 20–50 min pour un déchargement complet ; la prise de vue est inhibée et
        le satellite revient ensuite à son mode antérieur à la désaturation'
    hint:
      en: aocs.h_body_mag (0x02B9) falling; aocs.desat_ineffective (0x029C) = 0
      fr: aocs.h_body_mag (0x02B9) en baisse ; aocs.desat_ineffective (0x029C) = 0
  - id: q5
    kind: check
    text:
      en: 5. Follow the specific sub-procedure for the failed component (CTG-007 wheel / CTG-008 star
        tracker)
      fr: 5. Suivre la sous-procédure propre au composant défaillant (CTG-007 roue / CTG-008 senseur stellaire)
    hint:
      en: sub-procedure ID
      fr: ID de la sous-procédure
  - id: q6
    kind: check
    text:
      en: '6. Restore NOMINAL: AOCS_SET_MODE(mode=4); escalate to DETUMBLE (mode=2) only on multi-wheel
        failure'
      fr: '6. Rétablir NOMINAL : AOCS_SET_MODE(mode=4) ; ne remonter jusqu''à DETUMBLE (mode=2) qu''en
        cas de panne de plusieurs roues'
    hint:
      en: aocs.mode = 4
      fr: aocs.mode = 4
  - id: q7
    kind: check
    text:
      en: 7. File anomaly ticket
      fr: 7. Remplir une fiche d'anomalie
    hint:
      en: 'ticket #'
      fr: fiche n°
- id: WB-A-CTG-007
  title:
    en: CTG-007 Reaction Wheel Anomaly
    fr: CTG-007 Anomalie de roue de réaction
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - CTG-007
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: 1. Identify the affected wheel (index 0–3) from speed, current and bearing health
      fr: 1. Identifier la roue concernée (indice 0–3) d'après la vitesse, le courant et l'état du roulement
    hint:
      en: wheel
      fr: roue
  - id: q2
    kind: check
    text:
      en: '2. Disable it: AOCS_DISABLE_WHEEL(wheel_idx=N) (S8.1 func 2)'
      fr: '2. La désactiver : AOCS_DISABLE_WHEEL(wheel_idx=N) (S8.1 func 2)'
    hint:
      en: aocs.rwN_enabled (0x0254–0x0257) = 0; aocs.wheels_enabled (0x0260) = 3
      fr: aocs.rwN_enabled (0x0254–0x0257) = 0 ; aocs.wheels_enabled (0x0260) = 3
  - id: q3
    kind: check
    text:
      en: '3. Desaturate the remaining set: AOCS_DESATURATE (func 1)'
      fr: '3. Désaturer le jeu restant : AOCS_DESATURATE (func 1)'
    hint:
      en: aocs.h_body_mag (0x02B9) falling; allow 20–50 min
      fr: aocs.h_body_mag (0x02B9) en baisse ; prévoir 20–50 min
  - id: q4
    kind: check
    text:
      en: 4. Verify pointing on three wheels. A 3-of-4 subset still spans R³, so FINE_POINT still works
        — flagged, not refused
      fr: '4. Vérifier le pointage sur trois roues. Un sous-ensemble de 3 roues sur 4 engendre toujours
        R³ : FINE_POINT fonctionne toujours — signalé, et non refusé'
    hint:
      en: 'aocs.att_error (0x0217): °; aocs.fine_degraded (0x0299) = 1; aocs.fine_ready (0x02C5) bit 1
        clear'
      fr: 'aocs.att_error (0x0217) : ° ; aocs.fine_degraded (0x0299) = 1 ; bit 1 de aocs.fine_ready (0x02C5)
        à zéro'
  - id: q5
    kind: check
    text:
      en: 5. If pointing acceptable, stay in NOMINAL (AOCS_SET_MODE(mode=4)); else fall back to COARSE_SUN
        (3)
      fr: 5. Si le pointage est acceptable, rester en NOMINAL (AOCS_SET_MODE(mode=4)) ; sinon se replier
        sur COARSE_SUN (3)
    hint:
      en: mode
      fr: mode
  - id: q6
    kind: check
    text:
      en: 6. File anomaly ticket
      fr: 6. Remplir une fiche d'anomalie
    hint:
      en: 'ticket #'
      fr: fiche n°
- id: WB-A-CTG-008
  title:
    en: CTG-008 Star Tracker Failure
    fr: CTG-008 Panne du senseur stellaire
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - CTG-008
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. Confirm the failure: HK_REQUEST(sid=2) (S3.27)'
      fr: '1. Confirmer la panne : HK_REQUEST(sid=2) (S3.27)'
    hint:
      en: aocs.st1_status (0x0240) = 3 (blind) or 4 (failed); rising aocs.est_innov_rej_count (0x02C2)
      fr: aocs.st1_status (0x0240) = 3 (aveuglé) ou 4 (en panne) ; aocs.est_innov_rej_count (0x02C2) en
        hausse
  - id: q2
    kind: check
    text:
      en: '2. Bring up the other head: ST2_POWER(on=1) (S8.1 func 5)'
      fr: '2. Mettre en service l''autre tête : ST2_POWER(on=1) (S8.1 func 5)'
    hint:
      en: aocs.st2_status (0x0243) = 2 (tracking) within its boot time
      fr: aocs.st2_status (0x0243) = 2 (poursuite) dans son temps d'amorçage
  - id: q3
    kind: check
    text:
      en: '3. Select it: ST_SELECT(unit=2) (S8.1 func 6)'
      fr: '3. La sélectionner : ST_SELECT(unit=2) (S8.1 func 6)'
    hint:
      en: aocs.st_selected (0x0244) updated; aocs.est_source (0x02C1) bit 0 still set
      fr: aocs.st_selected (0x0244) mis à jour ; bit 0 de aocs.est_source (0x02C1) toujours positionné
  - id: q4
    kind: check
    text:
      en: '4. Isolate the failed head: ST1_POWER(on=0) (S8.1 func 4)'
      fr: '4. Isoler la tête défaillante : ST1_POWER(on=0) (S8.1 func 4)'
    hint:
      en: aocs.st1_status = 0 (off)
      fr: aocs.st1_status = 0 (éteint)
  - id: q5
    kind: check
    text:
      en: '5. If the attitude solution has diverged, re-initialise it: AOCS_EST_RESET(mode=1) (S8.1 func
        91, warm) — or mode=0 for a cold reset after a time jump'
      fr: '5. Si la solution d''attitude a divergé, la réinitialiser : AOCS_EST_RESET(mode=1) (S8.1 func
        91, à chaud) — ou mode=0 pour une réinitialisation à froid après un saut de temps'
    hint:
      en: aocs.knowledge_err_3sig (0x02A7) settling; innovation rejections stop climbing
      fr: aocs.knowledge_err_3sig (0x02A7) en cours de stabilisation ; les rejets d'innovation cessent
        d'augmenter
  - id: q6
    kind: check
    text:
      en: '6. If both heads are lost, fall back to the sun-safe hold: AOCS_SET_MODE(mode=3) COARSE_SUN,
        and PAYLOAD_SET_MODE(mode=0)'
      fr: '6. Si les deux têtes sont perdues, se replier sur le attente sûre au Soleil : AOCS_SET_MODE(mode=3)
        COARSE_SUN, et PAYLOAD_SET_MODE(mode=0)'
    hint:
      en: aocs.mode (0x020F) = 3; aocs.est_source shows CSS+MAG+gyro, ST bit clear
      fr: aocs.mode (0x020F) = 3 ; aocs.est_source indique CSS+MAG+gyro, bit ST à zéro
  - id: q7
    kind: check
    text:
      en: 7. If a head recovers, restore NOMINAL (AOCS_SET_MODE(mode=4)); else hold COARSE_SUN
      fr: 7. Si une tête est rétablie, revenir en NOMINAL (AOCS_SET_MODE(mode=4)) ; sinon rester en COARSE_SUN
    hint:
      en: mode
      fr: mode
  - id: q8
    kind: check
    text:
      en: 8. File anomaly ticket
      fr: 8. Remplir une fiche d'anomalie
    hint:
      en: 'ticket #'
      fr: fiche n°
- id: WB-A-CTG-010
  title:
    en: CTG-010 OBDH Watchdog Recovery
    fr: CTG-010 Reprise après chien de garde OBDH
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - CTG-010
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. Confirm the reboot: HK_REQUEST(sid=4) (S3.27)'
      fr: '1. Confirmer le redémarrage : HK_REQUEST(sid=4) (S3.27)'
    hint:
      en: obdh.reboot_count (0x030A) incremented; obdh.last_reboot_cause (0x0316) = 1 (watchdog); obdh.uptime
        (0x0308) near zero
      fr: obdh.reboot_count (0x030A) incrémenté ; obdh.last_reboot_cause (0x0316) = 1 (chien de garde)
        ; obdh.uptime (0x0308) proche de zéro
  - id: q2
    kind: check
    text:
      en: '2. If the spacecraft came back in the bootloader (obdh.sw_image 0x0311 = 0), re-boot the application:
        OBC_BOOT_APP (S8.1 func 55)'
      fr: '2. Si le satellite est revenu dans le chargeur d''amorçage (obdh.sw_image 0x0311 = 0), réamorcer
        l''applicatif : OBC_BOOT_APP (S8.1 func 55)'
    hint:
      en: obdh.sw_image = 1 within 15 s
      fr: obdh.sw_image = 1 dans les 15 s
  - id: q3
    kind: check
    text:
      en: '3. Re-enable housekeeping — application boot re-applies default_enabled_sids: [1, 11], so every
        other SID is off again: HK_ENABLE(sid=2/3/4/5/6) (S3.5)'
      fr: '3. Réactiver la télémesure de servitude — l''amorçage applicatif réapplique default_enabled_sids:
        [1, 11], de sorte que tous les autres SID sont à nouveau désactivés : HK_ENABLE(sid=2/3/4/5/6)
        (S3.5)'
    hint:
      en: all required SIDs periodic again
      fr: tous les SID requis de nouveau périodiques
  - id: q4
    kind: check
    text:
      en: '4. Re-synchronise time: SET_TIME(cuc_seconds=T_corrected) (S9.1), verify with REQUEST_TIME
        (S9.2)'
      fr: '4. Resynchroniser le temps : SET_TIME(cuc_seconds=T_corrected) (S9.1), vérifier avec REQUEST_TIME
        (S9.2)'
    hint:
      en: residual < 1.0 s
      fr: résidu < 1.0 s
  - id: q5
    kind: check
    text:
      en: '5. Verify OBC mode; restore NOMINAL if in SAFE: OBC_SET_MODE(mode=0) (S8.1 func 50)'
      fr: '5. Vérifier le mode de l''OBC ; rétablir NOMINAL s''il est en SAFE : OBC_SET_MODE(mode=0) (S8.1
        func 50)'
    hint:
      en: obdh.mode (0x0300) = 0
      fr: obdh.mode (0x0300) = 0
  - id: q6
    kind: check
    text:
      en: 6. Re-apply settings lost in the reset (heater setpoints, S12 limit overrides, TM tier, beacon
        mode)
      fr: 6. Réappliquer les réglages perdus lors de la réinitialisation (consignes des réchauffeurs,
        forçages de limites S12, palier TM, mode balise)
    hint:
      en: settings restored
      fr: réglages rétablis
  - id: q7
    kind: check
    text:
      en: 7. File anomaly ticket
      fr: 7. Remplir une fiche d'anomalie
    hint:
      en: 'ticket #'
      fr: fiche n°
- id: WB-A-CTG-012
  title:
    en: CTG-012 Overcurrent Response
    fr: CTG-012 Traitement d'une surintensité
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - CTG-012
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: 1. Identify the tripped line from eps.oc_trip_flags (0x010D) and the per-line currents eps.line_current_0..7
        (0x0118–0x011F; line 8 is 0x014B)
      fr: 1. Identifier la ligne déclenchée d'après eps.oc_trip_flags (0x010D) et les courants par ligne
        eps.line_current_0..7 (0x0118–0x011F ; la ligne 8 est en 0x014B)
    hint:
      en: line
      fr: ligne
  - id: q2
    kind: check
    text:
      en: 2. Report to FD; note that the FDIR autonomous action has usually already opened the line
      fr: 2. Rendre compte au FD ; noter que l'action autonome de la FDIR a généralement déjà ouvert la
        ligne
    hint:
      en: recorded
      fr: consigné
  - id: q3
    kind: check
    text:
      en: 3. FD GO
      fr: 3. GO du FD
    hint:
      en: granted
      fr: accordé
  - id: q4
    kind: check
    text:
      en: '4. Ensure the line is open: EPS_POWER_OFF(line_index=N) (S8.1 func 20)'
      fr: '4. S''assurer que la ligne est ouverte : EPS_POWER_OFF(line_index=N) (S8.1 func 20)'
    hint:
      en: eps.pl_* status bit = 0
      fr: bit d'état eps.pl_* = 0
  - id: q5
    kind: check
    text:
      en: 5. Verify the line current is 0
      fr: 5. Vérifier que le courant de la ligne vaut 0
    hint:
      en: 'I: A'
      fr: 'I : A'
  - id: q6
    kind: check
    text:
      en: '6. Only after the fault is understood, clear the latch and re-enable: EPS_RESET_OC_FLAG(line_index=N)
        (S8.1 func 21), then EPS_POWER_ON(line_index=N) (func 19)'
      fr: '6. Seulement une fois le défaut compris, effacer le verrou et réactiver : EPS_RESET_OC_FLAG(line_index=N)
        (S8.1 func 21), puis EPS_POWER_ON(line_index=N) (func 19)'
    hint:
      en: eps.oc_trip_flags bit clear; line current back within envelope
      fr: bit de eps.oc_trip_flags à zéro ; courant de la ligne revenu dans l'enveloppe
  - id: q7
    kind: check
    text:
      en: 7. File anomaly ticket; root cause for next shift
      fr: 7. Remplir une fiche d'anomalie ; cause première pour le quart suivant
    hint:
      en: 'ticket #'
      fr: fiche n°
- id: WB-A-CTG-015
  title:
    en: CTG-015 Corrupted Image Recovery
    fr: CTG-015 Reprise après image corrompue
  phase: during
  applies:
    tools:
    - mcs
    - delayed_tm
    procedures:
    - CTG-015
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: 1. Confirm the S5 event 0x0607 IMAGE_CHECKSUM_ERROR and read payload.checksum_errors (0x0609)
      fr: 1. Confirmer l'événement S5 0x0607 IMAGE_CHECKSUM_ERROR et lire payload.checksum_errors (0x0609)
    hint:
      en: event recorded
      fr: événement consigné
  - id: q2
    kind: check
    text:
      en: '2. Check the FPA: HK_REQUEST(sid=5) and (sid=3) (S3.27)'
      fr: '2. Vérifier le FPA : HK_REQUEST(sid=5) et (sid=3) (S3.27)'
    hint:
      en: payload.fpa_temp (0x0601) in band and payload.fpa_ready (0x0610) = 1 at capture time?
      fr: payload.fpa_temp (0x0601) dans la plage et payload.fpa_ready (0x0610) = 1 au moment de la capture
        ?
  - id: q3
    kind: check
    text:
      en: 3. If the FPA was warm, abort to STANDBY (PAYLOAD_SET_MODE(mode=1), func 26), re-enable the
        cooler (FPA_COOLER(on=1), func 43) and wait for fpa_ready
      fr: 3. Si le FPA était chaud, revenir en STANDBY (PAYLOAD_SET_MODE(mode=1), func 26), réactiver
        le refroidisseur (FPA_COOLER(on=1), func 43) et attendre fpa_ready
    hint:
      en: ready = 1
      fr: ready = 1
  - id: q4
    kind: check
    text:
      en: '4. Check memory: payload.mem_segments_bad (0x0612); mark a bad segment with PAYLOAD_MARK_BAD_SEGMENT(segment_id=N)
        (S8.1 func 31)'
      fr: '4. Vérifier la mémoire : payload.mem_segments_bad (0x0612) ; marquer un segment défectueux
        avec PAYLOAD_MARK_BAD_SEGMENT(segment_id=N) (S8.1 func 31)'
    hint:
      en: segments
      fr: segments
  - id: q5
    kind: check
    text:
      en: '5. Delete and re-capture: PAYLOAD_DELETE_IMAGE(scene_id=N) (func 30), then PAYLOAD_CAPTURE(scene_id=N,
        lines=L) (func 28)'
      fr: '5. Supprimer et recapturer : PAYLOAD_DELETE_IMAGE(scene_id=N) (func 30), puis PAYLOAD_CAPTURE(scene_id=N,
        lines=L) (func 28)'
    hint:
      en: 'new scene: ; S5 0x0613 IMAGE_CAPTURED'
      fr: 'nouvelle scène : ; S5 0x0613 IMAGE_CAPTURED'
  - id: q6
    kind: check
    text:
      en: 6. If recurring, investigate FPA temperature or pointing
      fr: 6. En cas de récurrence, examiner la température du FPA ou le pointage
    hint:
      en: finding
      fr: constat
  - id: q7
    kind: check
    text:
      en: 7. File anomaly ticket
      fr: 7. Remplir une fiche d'anomalie
    hint:
      en: 'ticket #'
      fr: fiche n°
- id: WB-A-CTG-017
  title:
    en: CTG-017 Bus Failure Switchover
    fr: CTG-017 Basculement sur panne de bus
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - CTG-017
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. Confirm the bus fault: HK_REQUEST(sid=4) (S3.27)'
      fr: '1. Confirmer le défaut de bus : HK_REQUEST(sid=4) (S3.27)'
    hint:
      en: obdh.bus_a_status (0x030F) = 1 (ERROR); obdh.active_bus (0x030E) = 0 (A)
      fr: obdh.bus_a_status (0x030F) = 1 (ERROR) ; obdh.active_bus (0x030E) = 0 (A)
  - id: q2
    kind: check
    text:
      en: 2. FD GO for bus switchover
      fr: 2. GO du FD pour le basculement de bus
    hint:
      en: granted
      fr: accordé
  - id: q3
    kind: check
    text:
      en: 3. Issue OBC_SELECT_BUS(bus=1) (S8.1 func_id 54) to move to bus B (use bus=0 to go back to A)
      fr: 3. Envoyer OBC_SELECT_BUS(bus=1) (S8.1 func_id 54) pour passer sur le bus B (utiliser bus=0
        pour revenir sur A)
    hint:
      en: S1.1 accept + S1.7 complete
      fr: Acceptation S1.1 + exécution S1.7
  - id: q4
    kind: check
    text:
      en: 4. Verify bus B in use and all housekeeping resumes
      fr: 4. Vérifier que le bus B est utilisé et que toute la télémesure de servitude reprend
    hint:
      en: obdh.active_bus = 1; obdh.bus_b_status (0x0310) = 0; SIDs 1–6 flowing again
      fr: obdh.active_bus = 1 ; obdh.bus_b_status (0x0310) = 0 ; SID 1–6 de nouveau émis
  - id: q5
    kind: check
    text:
      en: 5. File anomaly ticket. Note there is now no bus redundancy left
      fr: 5. Remplir une fiche d'anomalie. Noter qu'il ne reste désormais plus aucune redondance de bus
    hint:
      en: 'ticket #'
      fr: fiche n°
- id: WB-A-CTG-019
  title:
    en: CTG-019 No Telemetry at Pass Start
    fr: CTG-019 Absence de télémesure en début de passage
  phase: during
  applies:
    tools:
    - mcs
    - radio
    procedures:
    - CTG-019
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: 1. Verify the scheduled station and baseband config (five-station network)
      fr: 1. Vérifier la station programmée et la configuration de bande de base (réseau de cinq stations)
    hint:
      en: OK
      fr: OK
  - id: q2
    kind: check
    text:
      en: 2. Verify orbit / pass prediction (could be geometry)
      fr: 2. Vérifier la prédiction d'orbite / de passage (la géométrie peut être en cause)
    hint:
      en: prediction OK
      fr: prédiction OK
  - id: q3
    kind: check
    text:
      en: '3. Blind-command the TX chain: HK_REQUEST(sid=1) (S3.27), EPS_POWER_ON(line_index=2) (func
        19), TTC_PA_ON (func 66)'
      fr: '3. Commander en aveugle la chaîne d''émission : HK_REQUEST(sid=1) (S3.27), EPS_POWER_ON(line_index=2)
        (func 19), TTC_PA_ON (func 66)'
    hint:
      en: eps.pl_ttc_tx (0x0112) = 1; ttc.pa_on (0x0516) = 1 once TM returns
      fr: eps.pl_ttc_tx (0x0112) = 1 ; ttc.pa_on (0x0516) = 1 dès le retour de la TM
  - id: q4
    kind: check
    text:
      en: '4. Blind transponder swap: TTC_SWITCH_REDUNDANT (func 64), then TTC_SWITCH_PRIMARY (func 63)'
      fr: '4. Permuter en aveugle les transpondeurs : TTC_SWITCH_REDUNDANT (func 64), puis TTC_SWITCH_PRIMARY
        (func 63)'
    hint:
      en: ttc.link_status (0x0501) = 2 (LOCKED)
      fr: ttc.link_status (0x0501) = 2 (LOCKED)
  - id: q5
    kind: check
    text:
      en: 5. If the antenna was never deployed, TTC_DEPLOY_ANTENNA (func 69) — irreversible burn-wire
      fr: 5. Si l'antenne n'a jamais été déployée, TTC_DEPLOY_ANTENNA (func 69) — fil thermofusible irréversible
    hint:
      en: ttc.antenna_deployed (0x0520) = 1
      fr: ttc.antenna_deployed (0x0520) = 1
  - id: q6
    kind: check
    text:
      en: '6. Remember the UHF beacon is a separate radio: if HK SID 11 is still arriving while the S-band
        is silent, the fault is in the S-band chain, not the spacecraft'
      fr: '6. Se rappeler que la balise UHF est une radio distincte : si le SID 11 de HK arrive toujours
        alors que la bande S est muette, la panne se situe dans la chaîne bande S, pas dans le satellite'
    hint:
      en: ttc.beacon_active (0x0527)
      fr: ttc.beacon_active (0x0527)
  - id: q7
    kind: check
    text:
      en: 7. If link established, run NOM-001; if no link after two consecutive passes, escalate EMG-004
        (Loss of Communication)
      fr: 7. Si la liaison est établie, exécuter NOM-001 ; sans liaison après deux passages consécutifs,
        passer à EMG-004 (Perte de communication)
    hint:
      en: path
      fr: voie suivie
  - id: q8
    kind: check
    text:
      en: 8. File anomaly ticket
      fr: 8. Remplir une fiche d'anomalie
    hint:
      en: 'ticket #'
      fr: fiche n°
- id: WB-A-CTG-020
  title:
    en: CTG-020 Ground Station Antenna Failure
    fr: CTG-020 Panne d'antenne de station sol
  phase: during
  applies:
    tools:
    - mcs
    - radio
    procedures:
    - CTG-020
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: 1. Confirm the failure is ground-side, not spacecraft-side (ttc.gs_equipment_status 0x0524 bitmask;
        a healthy spacecraft still radiates)
      fr: 1. Confirmer que la panne est côté sol et non côté satellite (masque de bits ttc.gs_equipment_status
        0x0524 ; un satellite sain continue d'émettre)
    hint:
      en: confirmed
      fr: confirmé
  - id: q2
    kind: check
    text:
      en: 2. Attempt local station recovery with the station operator
      fr: 2. Tenter une reprise locale de la station avec l'opérateur de la station
    hint:
      en: result
      fr: résultat
  - id: q3
    kind: check
    text:
      en: 3. Notify FD and Mission Manager; assess the impact on the shift plan
      fr: 3. Informer le FD et le responsable de mission ; évaluer l'impact sur le plan du quart
    hint:
      en: logged
      fr: consigné
  - id: q4
    kind: check
    text:
      en: 4. Re-plan the remaining activities onto the next station in the five-station network; verify
        its baseband and tracking
      fr: 4. Replanifier les activités restantes sur la station suivante du réseau de cinq stations ;
        vérifier sa bande de base et sa poursuite
    hint:
      en: station
      fr: station
  - id: q5
    kind: check
    text:
      en: 5. File anomaly ticket
      fr: 5. Remplir une fiche d'anomalie
    hint:
      en: 'ticket #'
      fr: fiche n°
