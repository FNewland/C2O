  phase: during
  applies:
    tools:
    - mcs
    - radio
    procedures:
    - LEOP-001
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. Ground Seg: Configure GS receiver on the BEACON rung; force pass override in MCS'
      fr: '1. Segment sol : Configurer le récepteur de la station sur le barreau BEACON ; forcer le passage
        dans le MCS'
    hint:
      en: GS = TRACKING_READY; pass_override = 1 (0x05FF)
      fr: GS = TRACKING_READY ; pass_override = 1 (0x05FF)
  - id: q2
    kind: check
    text:
      en: '2. TT&C: Send first uplink: CONNECTION_TEST (S17.1)'
      fr: '2. TT&C : Envoyer la première TC montante : CONNECTION_TEST (S17.1)'
    hint:
      en: S1.1 ack < 10 s; S17.2 < 10 s; eps.pl_ttc_tx (0x0112) = 1 (auto-TX hold-down armed)
      fr: Acquittement S1.1 < 10 s ; S17.2 < 10 s ; eps.pl_ttc_tx (0x0112) = 1 (maintien automatique de
        l'émetteur armé)
  - id: q3
    kind: check
    text:
      en: '3. TT&C: Verify carrier lock and link quality'
      fr: '3. TT&C : Vérifier l''accrochage de la porteuse et la qualité de la liaison'
    hint:
      en: ttc.link_status (0x0501) = 2 (LOCKED) < 30 s; ttc.rssi (0x0502) > −110 dBm; ttc.link_margin
        (0x0503) > 3 dB
      fr: ttc.link_status (0x0501) = 2 (LOCKED) < 30 s ; ttc.rssi (0x0502) > −110 dBm ; ttc.link_margin
        (0x0503) > 3 dB
  - id: q4
    kind: check
    text:
      en: '4. SPACON: Request beacon SID: HK_REQUEST(sid=11) (S3.27)'
      fr: '4. SPACON : Demander le SID balise : HK_REQUEST(sid=11) (S3.27)'
    hint:
      en: Beacon received; obdh.sw_image (0x0311) = 0 (BOOTLOADER) < 10 s
      fr: Balise reçue ; obdh.sw_image (0x0311) = 0 (BOOTLOADER) < 10 s
  - id: q5
    kind: check
    text:
      en: '5. SPACON: Boot OBC into application: OBC_BOOT_APP (S8.1 func_id 55)'
      fr: '5. SPACON : Amorcer l''OBC sur l''applicatif : OBC_BOOT_APP (S8.1 func_id 55)'
    hint:
      en: 'S1.1 ack + S1.7 < 5 s; obdh.sw_image = 1 < 15 s. Boot re-applies default_enabled_sids: [1,
        11] — only SIDs 1 and 11 stream'
      fr: 'Acquittements S1.1 + S1.7 < 5 s ; obdh.sw_image = 1 < 15 s. L''amorçage réapplique default_enabled_sids:
        [1, 11] — seuls les SID 1 et 11 sont émis'
  - id: q6
    kind: check
    text:
      en: '5a. SPACON: Enable the platform SIDs: HK_ENABLE(sid=3), (sid=4), (sid=6) (S3.5)'
      fr: '5a. SPACON : Activer les SID de plateforme : HK_ENABLE(sid=3), (sid=4), (sid=6) (S3.5)'
    hint:
      en: SIDs 3 (60 s), 4 (8 s), 6 (8 s) begin within one structure interval
      fr: Les SID 3 (60 s), 4 (8 s), 6 (8 s) démarrent en moins d'un intervalle de structure
  - id: q7
    kind: check
    text:
      en: '5b. TT&C: Clear the forced beacon tier, then select LOW: TTC_SET_BEACON_MODE(on=0) (S8 func
        70), TTC_SET_DATA_RATE(rate=0) (S8 func 65)'
      fr: '5b. TT&C : Lever le palier balise forcé, puis sélectionner LOW : TTC_SET_BEACON_MODE(on=0)
        (S8 func 70), TTC_SET_DATA_RATE(rate=0) (S8 func 65)'
    hint:
      en: ttc.beacon_mode (0x0521) = 0; ttc.tm_data_rate (0x0506) = 16000 bps; ttc.tm_tier (0x0539) =
        1. Re-configure the ground demod to 16 kBd first
      fr: ttc.beacon_mode (0x0521) = 0 ; ttc.tm_data_rate (0x0506) = 16000 bit/s ; ttc.tm_tier (0x0539)
        = 1. Reconfigurer d'abord le démodulateur sol à 16 kBd
  - id: q8
    kind: check
    text:
      en: '6. SPACON: Synchronise onboard time: SET_TIME(cuc_seconds=T_corrected) (S9.1), then REQUEST_TIME
        (S9.2)'
      fr: '6. SPACON : Synchroniser le temps bord : SET_TIME(cuc_seconds=T_corrected) (S9.1), puis REQUEST_TIME
        (S9.2)'
    hint:
      en: Ack + complete < 5 s; |T_obc − T_gnd| < 1 s
      fr: Acquittement + exécution < 5 s ; |T_obc − T_gnd| < 1 s
  - id: q9
    kind: check
    text:
      en: '7. SPACON: Request EPS HK: HK_REQUEST(sid=1) (S3.27)'
      fr: '7. SPACON : Demander la HK EPS : HK_REQUEST(sid=1) (S3.27)'
    hint:
      en: eps.bus_voltage (0x0105) 26–30 V; eps.bat_soc (0x0101) > 50 %
      fr: eps.bus_voltage (0x0105) 26–30 V ; eps.bat_soc (0x0101) > 50 %
  - id: q10
    kind: check
    text:
      en: '8. TT&C: Log times — AOS, override, first accepted TC, app boot, time-sync residual, HK values'
      fr: '8. TT&C : Consigner les heures — AOS, forçage, première TC acceptée, amorçage applicatif, résidu
        de synchronisation temporelle, valeurs HK'
    hint:
      en: All times recorded
      fr: Toutes les heures consignées
  - id: q11
    kind: text
    text:
      en: AOS time (UTC)
      fr: Heure d'AOS (UTC)
  - id: q12
    kind: text
    text:
      en: Override engaged
      fr: Forçage activé
  - id: q13
    kind: text
    text:
      en: First accepted TC
      fr: Première TC acceptée
  - id: q14
    kind: text
    text:
      en: App boot complete
      fr: Amorçage applicatif terminé
  - id: q15
    kind: text
    text:
      en: Time-sync residual
      fr: Résidu de synchronisation temporelle
  - id: q16
    kind: text
    text:
      en: eps.bus_voltage
      fr: eps.bus_voltage
- id: WB-5.5-L006
  title:
    en: LEOP-006 Time Synchronisation (confirm each step)
    fr: LEOP-006 Synchronisation temporelle (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - LEOP-006
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: 1. HK_REQUEST(sid=4) (S3.27); read onboard time from obdh.obc_time (0x0309)
      fr: 1. HK_REQUEST(sid=4) (S3.27) ; lire le temps bord dans obdh.obc_time (0x0309)
    hint:
      en: timestamp recorded
      fr: horodatage consigné
  - id: q2
    kind: check
    text:
      en: 2. Issue REQUEST_TIME (S9.2) for the TM(9,2) report, and HK_REQUEST(sid=6) for ttc.range_km
        (0x0509) — SID 6 is the structure that carries the slant range
      fr: 2. Envoyer REQUEST_TIME (S9.2) pour le rapport TM(9,2), et HK_REQUEST(sid=6) pour ttc.range_km
        (0x0509) — le SID 6 est la structure qui transporte la distance oblique
    hint:
      en: T_obc recorded; TM(9,2) agrees with 0x0309
      fr: T_obc consigné ; le TM(9,2) concorde avec 0x0309
  - id: q3
    kind: check
    text:
      en: 3. Compute OWLT = ttc.range_km / 299792.458 × 1000 ms (expect 3–22 ms), then Δt = T_obc − (T_gnd
        − OWLT)
      fr: 3. Calculer OWLT = ttc.range_km / 299792.458 × 1000 ms (valeur attendue 3–22 ms), puis Δt =
        T_obc − (T_gnd − OWLT)
    hint:
      en: 'OWLT (ms): Δt (s)'
      fr: 'OWLT (ms) : Δt (s)'
  - id: q4
    kind: check
    text:
      en: 4. Issue SET_TIME(cuc_seconds=T_corrected) (S9.1) — the argument goes inside the backticks;
        a bare SET_TIME packs cuc_seconds = 0, an epoch reset
      fr: 4. Envoyer SET_TIME(cuc_seconds=T_corrected) (S9.1) — l'argument se place à l'intérieur des
        backticks ; un SET_TIME nu encode cuc_seconds = 0, soit une remise à zéro de l'époque
    hint:
      en: ack + complete < 5 s, no S1.2
      fr: acquittement + exécution < 5 s, pas de S1.2
  - id: q5
    kind: check
    text:
      en: 5. REQUEST_TIME (S9.2) again; verify residual < 1.0 s vs ground reference (LEOP threshold; NOM-008
        tightens it in nominal ops)
      fr: 5. Renvoyer REQUEST_TIME (S9.2) ; vérifier un résidu < 1.0 s par rapport à la référence sol
        (seuil LEOP ; NOM-008 le resserre en opérations nominales)
    hint:
      en: residual (s)
      fr: résidu (s)
  - id: q6
    kind: check
    text:
      en: 6. Enable GPS navigation HK HK_ENABLE(sid=12) (S3.5); once aocs.gps_fix (0x0274) ≥ 2, discipline
        the clock with OBC_GPS_TIME_SYNC (S8.1 func 80) — ground set first, GPS second
      fr: 6. Activer la HK de navigation GPS HK_ENABLE(sid=12) (S3.5) ; dès que aocs.gps_fix (0x0274)
        ≥ 2, asservir l'horloge avec OBC_GPS_TIME_SYNC (S8.1 func 80) — réglage sol d'abord, GPS ensuite
    hint:
      en: obdh.time_ref (0x0A13) = 2 (GPS) within 15 s; no fix yet → next contact
      fr: obdh.time_ref (0x0A13) = 2 (GPS) en 15 s ; pas encore de point → contact suivant
