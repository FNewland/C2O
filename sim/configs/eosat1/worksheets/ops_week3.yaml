      en: '2. EPS: Heater lines only as needed: read tcs.temp_battery (0x0407) and tcs.temp_obc (0x0406)
        from SID 3; EPS_POWER_ON(line_index=5) (S8.1 func 19) only if the battery is below +5 °C; EPS_POWER_ON(line_index=6)
        only if the OBC zone is below −10 °C (its heater ON point)'
      fr: '2. EPS : Lignes de réchauffeurs seulement si nécessaire : lire tcs.temp_battery (0x0407) et
        tcs.temp_obc (0x0406) dans le SID 3 ; EPS_POWER_ON(line_index=5) (S8.1 func 19) seulement si la
        batterie est sous +5 °C ; EPS_POWER_ON(line_index=6) seulement si la zone OBC est sous −10 °C
        (seuil de mise en marche de son réchauffeur)'
    hint:
      en: 'eps.pl_htr_bat (0x0115) / eps.pl_htr_obc (0x0116) = 1 within 5 s for each line commanded; the
        others still off. Log which lines this card energised: COM-002 reads it as its entry state'
      fr: 'eps.pl_htr_bat (0x0115) / eps.pl_htr_obc (0x0116) = 1 en 5 s pour chaque ligne commandée ;
        les autres toujours éteintes. Consigner les lignes alimentées par cette fiche : COM-002 s''en
        sert comme état d''entrée'
    step: '2'
    where:
