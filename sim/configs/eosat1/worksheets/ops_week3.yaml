- id: WB-5.4-N001
  title:
    en: NOM-001 Pass Startup (confirm each step)
    fr: NOM-001 Ouverture de passage (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - NOM-001
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. Ground Seg: Confirm the scheduled station is tracking'
      fr: '1. Segment sol : Confirmer que la station programmée est en poursuite'
    hint:
      en: station = TRACKING in MPS (five-station network)
      fr: station = TRACKING dans le MPS (réseau de cinq stations)
  - id: q2
    kind: check
    text:
      en: '2. TT&C: Verify the S-band chain is radiating'
      fr: '2. TT&C : Vérifier que la chaîne bande S émet'
    hint:
      en: ttc.pa_on (0x0516) = 1 and ttc.tx_active (0x0525) = 1 before AOS-2 min; if 0, read ttc.tx_gate_status
        (0x052B)
      fr: ttc.pa_on (0x0516) = 1 et ttc.tx_active (0x0525) = 1 avant AOS-2 min ; si 0, lire ttc.tx_gate_status
        (0x052B)
  - id: q3
    kind: check
    text:
      en: '3. TT&C: At AOS, verify link lock acquired'
      fr: '3. TT&C : À l''AOS, vérifier l''accrochage de la liaison'
    hint:
      en: ttc.link_status (0x0501) = 2 (LOCKED) within 30 s of AOS; ttc.carrier_lock (0x0510) = 1
      fr: ttc.link_status (0x0501) = 2 (LOCKED) dans les 30 s suivant l'AOS ; ttc.carrier_lock (0x0510)
        = 1
  - id: q4
    kind: check
    text:
      en: '4. SPACON: Issue CONNECTION_TEST (S17.1)'
      fr: '4. SPACON : Envoyer CONNECTION_TEST (S17.1)'
    hint:
      en: S1.1 ack + S17.2 report received
      fr: Acquittement S1.1 + rapport S17.2 reçus
  - id: q5
    kind: check
    text:
      en: '5. SPACON: Verify full HK reporting'
      fr: '5. SPACON : Vérifier que la HK complète est émise'
    hint:
      en: SIDs 1, 2, 3, 4, 5, 6 periodic (only 1 EPS and 11 Beacon are on at power-up — the rest need
        HK_ENABLE, S3.5); on-demand reads use HK_REQUEST, S3.27
      fr: SID 1, 2, 3, 4, 5, 6 périodiques (seuls 1 EPS et 11 balise sont actifs à la mise sous tension
        — les autres nécessitent HK_ENABLE, S3.5) ; les lectures à la demande utilisent HK_REQUEST, S3.27
  - id: q6
    kind: check
    text:
      en: '6. AOCS: Confirm AOCS mode and rates'
      fr: '6. AOCS : Confirmer le mode et les vitesses du SCAO'
    hint:
      en: aocs.mode (0x020F) = 4 (NOMINAL, nadir-tracking); aocs.rate_roll/rate_yaw (0x0204/0x0206) <
        0.05°/s, aocs.rate_pitch (0x0205) ≈ −0.063 ± 0.02°/s (nadir tracking rate)
      fr: aocs.mode (0x020F) = 4 (NOMINAL, suivi du nadir) ; aocs.rate_roll/rate_yaw (0x0204/0x0206) <
        0.05°/s, aocs.rate_pitch (0x0205) ≈ −0.063 ± 0.02°/s (vitesse de suivi du nadir)
  - id: q7
    kind: check
    text:
      en: '7. EPS: Confirm battery and bus state'
      fr: '7. EPS : Confirmer l''état de la batterie et du bus'
    hint:
      en: eps.bat_soc (0x0101) > 50 %, eps.bus_voltage (0x0105) > 27.0 V (nominal band 26–30 V; FDIR undervoltage
        at 24.5 V)
      fr: eps.bat_soc (0x0101) > 50 %, eps.bus_voltage (0x0105) > 27.0 V (plage nominale 26–30 V ; sous-tension
        FDIR à 24.5 V)
  - id: q8
    kind: check
    text:
      en: '8. Thermal: Confirm zones in band'
      fr: '8. Thermique : Confirmer que les zones sont dans la plage'
    hint:
      en: All zones green
      fr: Toutes les zones au vert
  - id: q9
    kind: check
    text:
      en: '9. Payload: Confirm payload state matches plan'
      fr: '9. Charge utile : Confirmer que l''état de la charge utile correspond au plan'
    hint:
      en: mode = per plan
      fr: mode = conforme au plan
  - id: q10
    kind: check
    text:
      en: '10. SPACON: Log pass start in shift log'
      fr: '10. SPACON : Consigner le début du passage dans la main courante'
    hint:
      en: Log entry created
      fr: Entrée créée
  - id: q11
    kind: text
    text:
      en: Off-nominal items observed
      fr: Éléments hors nominal observés
- id: WB-5.4-C003
  title:
    en: CTG-003 TTC Link Loss Recovery (confirm each step)
    fr: CTG-003 Rétablissement après perte de liaison TTC (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    - radio
    procedures:
    - CTG-003
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. TT&C: Confirm link loss on ttc.link_status (0x0501) and ttc.frame_sync (0x0512)'
      fr: '1. TT&C : Confirmer la perte de liaison sur ttc.link_status (0x0501) et ttc.frame_sync (0x0512)'
    hint:
      en: link_status ≠ 2, frame sync lost
      fr: link_status ≠ 2, synchronisation trame perdue
  - id: q2
    kind: check
    text:
      en: '2. Ground Seg: Verify ground station still tracking'
      fr: '2. Segment sol : Vérifier que la station sol est toujours en poursuite'
    hint:
      en: Antenna pointing correct, baseband nominal
      fr: Pointage de l'antenne correct, bande de base nominale
  - id: q3
    kind: check
    text:
      en: '3. SPACON: Open FDIR panel; identify the rule that fired'
      fr: '3. SPACON : Ouvrir le panneau FDIR ; identifier la règle déclenchée'
    hint:
      en: rule + fdir.level (0x0700) recorded
      fr: règle + fdir.level (0x0700) consignés
  - id: q4
    kind: check
    text:
      en: '4. TT&C: Blind HK_REQUEST(sid=6) (S3.27), then CONNECTION_TEST (S17.1)'
      fr: '4. TT&C : Envoyer en aveugle HK_REQUEST(sid=6) (S3.27), puis CONNECTION_TEST (S17.1)'
    hint:
      en: If it responds, go to step 8
      fr: S'il répond, aller à l'étape 8
  - id: q5
    kind: check
    text:
      en: '5. TT&C: If step 4 fails, blind TTC_SWITCH_REDUNDANT (S8 func 64), then TTC_SWITCH_PRIMARY
        (func 63)'
      fr: '5. TT&C : Si l''étape 4 échoue, envoyer en aveugle TTC_SWITCH_REDUNDANT (S8 func 64), puis
        TTC_SWITCH_PRIMARY (func 63)'
    hint:
      en: ttc.link_status = 2 within 45 s
      fr: ttc.link_status = 2 dans les 45 s
  - id: q6
    kind: check
    text:
      en: '6. TT&C: Once locked, verify link quality and subsystem health: HK_REQUEST(sid=6), HK_REQUEST(sid=1),
        HK_REQUEST(sid=4) (S3.27)'
      fr: '6. TT&C : Une fois accroché, vérifier la qualité de la liaison et la santé des sous-systèmes
        : HK_REQUEST(sid=6), HK_REQUEST(sid=1), HK_REQUEST(sid=4) (S3.27)'
    hint:
      en: RSSI (0x0502) > −90 dBm; margin (0x0503) > 3.0 dB; bus > 27.0 V; record the active transponder
        (ttc.mode 0x0500)
      fr: RSSI (0x0502) > −90 dBm ; marge (0x0503) > 3.0 dB ; bus > 27.0 V ; consigner le transpondeur
        actif (ttc.mode 0x0500)
  - id: q7
    kind: check
    text:
      en: '7. TT&C: If still silent after both transponders: log every blind command, notify the Mission
        Director and FDS, book the next pass'
      fr: '7. TT&C : Si le silence persiste après les deux transpondeurs : consigner chaque commande en
        aveugle, prévenir le directeur de mission et le FDS, réserver le passage suivant'
    hint:
      en: 24 h no-contact timer confirmed running
      fr: minuterie d'absence de contact de 24 h confirmée en marche
  - id: q8
    kind: check
    text:
      en: '8. SPACON: Acknowledge FDIR rule, log recovery actions'
      fr: '8. SPACON : Acquitter la règle FDIR, consigner les actions de reprise'
    hint:
      en: FDIR cleared, log entry
      fr: FDIR effacée, entrée au journal
  - id: q9
    kind: check
    text:
      en: '9. TT&C: File anomaly ticket. If no link after two consecutive passes, escalate EMG-004 Loss
        of Communication'
      fr: '9. TT&C : Remplir une fiche d''anomalie. Sans liaison après deux passages consécutifs, passer
        à EMG-004 Perte de communication'
    hint:
      en: Ticket logged
      fr: Fiche consignée
