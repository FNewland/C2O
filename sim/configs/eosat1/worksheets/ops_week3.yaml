  questions:
  - id: q1
    kind: check
    text:
      en: '1. AOCS to FINE_POINT: AOCS_FINE_READY_CHECK (func 89) — the mask must read 0, or mode 5 is
        refused TM(1,8) — then AOCS_SET_MODE(mode=5)'
      fr: '1. AOCS en FINE_POINT : AOCS_FINE_READY_CHECK (func 89) — le masque doit valoir 0, sinon le
        mode 5 est refusé en TM(1,8) — puis AOCS_SET_MODE(mode=5)'
    hint:
      en: aocs.mode (0x020F) = 5 within 30 s; aocs.total_pointing_err_3sig (0x02AA) < 0.05° within 300
        s (the capture gate); aocs.att_error (0x0217) < 0.1° within 180 s; aocs.rate_pitch (0x0205) ∈
        [0.053, 0.073]°/s (nadir orbit rate); aocs.rate_yaw (0x0206) < 0.01°/s
      fr: aocs.mode (0x020F) = 5 en 30 s ; aocs.total_pointing_err_3sig (0x02AA) < 0.05° en 300 s (le
        verrou de capture) ; aocs.att_error (0x0217) < 0.1° en 180 s ; aocs.rate_pitch (0x0205) ∈ [0.053,
        0.073]°/s (vitesse orbitale du suivi du nadir) ; aocs.rate_yaw (0x0206) < 0.01°/s
    step: '1'
    where:
    - tool: mcs
      page: aocs
      param: '0x020F'
      label:
        en: MCS › AOC › aocs.mode (0x020F)
        fr: MCS › AOC › aocs.mode (0x020F)
