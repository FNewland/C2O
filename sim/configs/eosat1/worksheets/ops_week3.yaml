  - id: q2
    kind: check
    text:
      en: 2. Sunlit profile — HK_REQUEST(sid=3) every 120 s for 30 min
      fr: 2. Profil en phase éclairée — HK_REQUEST(sid=3) toutes les 120 s pendant 30 min
    hint:
      en: tcs.temp_obc stable or rising slower than 1 °C/min; tcs.temp_battery stable
      fr: tcs.temp_obc stable ou en hausse de moins de 1 °C/min ; tcs.temp_battery stable
    step: '2'
    where:
    - tool: mcs
      page: trnd
      label: *id031
    - tool: mcs
      page: tcs
      param: '0x0406'
      label:
        en: MCS › TCS › tcs.temp_obc (0x0406)
        fr: MCS › TCS › tcs.temp_obc (0x0406)
    - tool: mcs
      page: tcs
      param: '0x0407'
      label:
        en: MCS › TCS › tcs.temp_battery (0x0407)
        fr: MCS › TCS › tcs.temp_battery (0x0407)
  - id: q3
    kind: check
    text:
      en: 3. Eclipse profile — HK_REQUEST(sid=3) at entry, mid-eclipse and exit
      fr: 3. Profil en éclipse — HK_REQUEST(sid=3) à l'entrée, à mi-éclipse et à la sortie
    hint:
      en: tcs.temp_obc above the OBC lower limit on the TCS page throughout; tcs.temp_battery > +5 °C
        throughout; drop rates recorded (OBC about 0.5 °C/min, battery buffered)
      fr: tcs.temp_obc au-dessus de la limite basse OBC de la page TCS pendant toute l'éclipse ; tcs.temp_battery
