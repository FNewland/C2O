    text:
      en: '4. Battery heater circuit, line first: record eps.pl_htr_bat (0x0115); EPS_POWER_ON(line_index=5)
        (S8.1 func 19); HEATER_BATTERY(on=1), then HEATER_BATTERY(on=0) (func 40); HEATER_AUTO_MODE(circuit=0)
