  form: debrief
  questions:
  - id: q1
    kind: text
    text:
      en: What is one decision you took during the shift that, in retrospect, you would not take again?
        Why?
      fr: Quelle décision avez-vous prise pendant le quart que, avec le recul, vous ne reprendriez pas
        ? Pourquoi ?
  - id: q2
    kind: text
    text:
      en: What is one decision that surprised you with how well it worked?
      fr: Quelle décision vous a surpris par son efficacité ?
  - id: q3
    kind: text
    text:
      en: Which voice callout did you most struggle to make in real time?
      fr: Quelle annonce vocale avez-vous eu le plus de mal à faire en temps réel ?
  - id: q4
    kind: text
    text:
      en: What is one thing the team did better as a unit than you expected?
      fr: Qu'est-ce que l'équipe a mieux fait collectivement que vous ne l'attendiez ?
  - id: q5
    kind: text
    text:
      en: What is one specific thing you will do differently tomorrow?
      fr: Quelle chose précise ferez-vous différemment demain ?
- id: WB-5.6-PB
  title:
    en: Day 4 Commissioning Pre-Pass-Set Briefing
    fr: 'Jour 4 : briefing avant la série de passages de recette en orbite'
  phase: prep
  applies:
    tools:
    - mcs
    - instructor
    procedures: []
    pages: []
    scenarios:
    - sequential_checkout
    context_keys: []
  form: briefing
  questions:
  - id: q1
    kind: check
    text:
      en: BP-3 commissioning_day_start.yaml scenario loaded (instructor-authored — see the Instructor
        Book; it is not in the shipped configs/eosat1/scenarios/ set)
      fr: Scénario BP-3 commissioning_day_start.yaml chargé (rédigé par l'enseignant — voir le guide de
        l'enseignant ; il ne fait pas partie du jeu livré configs/eosat1/scenarios/)
  - id: q2
    kind: check
    text:
      en: Spacecraft in phase 4 (LEOP), eps.spacecraft_phase (0x0129) = 4 — COMMISSIONING (5) is declared
        by LEOP-003 step 7
      fr: Satellite en phase 4 (LEOP), eps.spacecraft_phase (0x0129) = 4 — COMMISSIONING (5) est déclaré
        par LEOP-003 étape 7
  - id: q3
    kind: check
    text:
      en: Position assignments posted (different team from yesterday)
      fr: Affectations des postes affichées (équipe différente de la veille)
  - id: q4
    kind: check
    text:
      en: Pass-set timeline understood (4 sim passes in 2.5 h real time)
      fr: Chronologie de la série de passages comprise (4 passages simulés en 2,5 h de temps réel)
  - id: q5
    kind: check
    text:
      en: All 13 commissioning procedures (COM-001…COM-013) loaded in the procedure index
      fr: Les 13 procédures de recette en orbite (COM-001…COM-013) chargées dans l'index des procédures
  - id: q6
    kind: check
    text:
      en: EPS confirms SoC ~90 %, eps.pl_payload (0x0113) = 0
      fr: L'EPS confirme un SoC d'environ 90 %, eps.pl_payload (0x0113) = 0
  - id: q7
    kind: check
    text:
      en: Thermal confirms FPA at its uncooled equilibrium, payload.fpa_temp (0x0601) +8 to +14 °C
      fr: Le poste thermique confirme que le FPA est à son équilibre non refroidi, payload.fpa_temp (0x0601)
        de +8 à +14 °C
  - id: q8
    kind: check
    text:
      en: Payload Ops has reviewed COM-009/-010/-011/-012 in detail
      fr: Les opérations charge utile ont étudié en détail COM-009/-010/-011/-012
  - id: q9
    kind: check
    text:
      en: First Light target candidate selected (FDS)
      fr: Cible candidate pour la première lumière choisie (FDS)
  - id: q10
    kind: check
    text:
      en: Compressed-time speed multiplier set (instructor)
      fr: Multiplicateur de vitesse du temps compressé réglé (enseignant)
- id: WB-5.6-C001
  title:
    en: COM-001 EPS Checkout (confirm each step)
    fr: COM-001 Vérification de l'EPS (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - COM-001
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: 1. Baseline bus voltage — HK_REQUEST(sid=1) (S3.27)
      fr: 1. Tension de bus de référence — HK_REQUEST(sid=1) (S3.27)
    hint:
      en: eps.bus_voltage (0x0105) ∈ [27.0, 29.0] V (nominal regulation point 28.0 ± 0.5 V; a full battery
        sits near 29 V)
      fr: eps.bus_voltage (0x0105) ∈ [27.0, 29.0] V (point de régulation nominal 28.0 ± 0.5 V ; une batterie
        pleine se tient près de 29 V)
    step: '1'
  - id: q2
    kind: check
    text:
      en: 2. Battery V & SoC — GET_PARAM(param_id=0x0100), GET_PARAM(param_id=0x0101) (S20.3)
      fr: 2. Tension et SoC de la batterie — GET_PARAM(param_id=0x0100), GET_PARAM(param_id=0x0101) (S20.3)
    hint:
      en: 'eps.bat_voltage (0x0100) ∈ [21.5, 29.2] V (8S pack, 100 Wh: 21.5 V empty, 26.4 V nominal, 29.2
        V full); eps.bat_soc (0x0101) > 70 %'
      fr: 'eps.bat_voltage (0x0100) ∈ [21.5, 29.2] V (batterie 8S de 100 Wh : 21.5 V vide, 26.4 V nominal,
        29.2 V pleine) ; eps.bat_soc (0x0101) > 70 %'
    step: '2'
  - id: q3
    kind: check
    text:
      en: 3. Solar array sunlit performance — HK_REQUEST(sid=1), sunlit and sun-pointed
      fr: 3. Performances du générateur solaire au Soleil — HK_REQUEST(sid=1), éclairé et pointé vers
        le Soleil
    hint:
      en: eps.power_gen (0x0107) ∈ [40, 90] W (88.6 W is the whole-spacecraft peak; about 80 W is normal
        when sun-pointed)
      fr: eps.power_gen (0x0107) ∈ [40, 90] W (88.6 W est la crête de l'ensemble du satellite ; environ
        80 W est normal en pointage solaire)
    step: '3'
  - id: q4
    kind: check
    text:
      en: 4. Eclipse discharge — HK_REQUEST(sid=1) at entry and at mid-eclipse
      fr: 4. Décharge en éclipse — HK_REQUEST(sid=1) à l'entrée et à mi-éclipse
    hint:
      en: eps.power_gen ~0 W within 30 s of entry; eps.bat_soc falling < 1.5 %/min; eps.bus_voltage >
        27.0 V
      fr: eps.power_gen ~0 W dans les 30 s après l'entrée ; eps.bat_soc en baisse de moins de 1.5 %/min
        ; eps.bus_voltage > 27.0 V
    step: '4'
  - id: q5
    kind: check
    text:
      en: 5. Eclipse-exit charge recovery — HK_REQUEST(sid=1) at exit + 5 min
      fr: 5. Reprise de charge en sortie d'éclipse — HK_REQUEST(sid=1) à la sortie + 5 min
    hint:
      en: eps.power_gen > 35 W within 60 s of exit; eps.bat_soc rising within 120 s
      fr: eps.power_gen > 35 W dans les 60 s après la sortie ; eps.bat_soc en hausse dans les 120 s
    step: '5'
  - id: q6
    kind: check
    text:
      en: 6. Power budget — GET_PARAM(param_id=0x0108); orbit-average generation against consumption
      fr: 6. Bilan de puissance — GET_PARAM(param_id=0x0108) ; production moyenne sur l'orbite comparée
        à la consommation
    hint:
      en: orbit-average generation > consumption; end-of-eclipse SoC > 50 % under nominal load
      fr: production moyenne sur l'orbite > consommation ; SoC en fin d'éclipse > 50 % sous charge nominale
    step: '6'
  - id: q7
    kind: check
    text:
      en: '7. Bus regulation under a load transient — record eps.pl_htr_bat (0x0115) first, then EPS_POWER_ON(line_index=5)
        (S8.1 func_id 19), and EPS_POWER_OFF(line_index=5) (func 20) only if the line was off at entry.
        Not the payload: its line is OFF until COM-009'
      fr: '7. Régulation du bus lors d''un transitoire de charge — consigner d''abord eps.pl_htr_bat (0x0115),
        puis EPS_POWER_ON(line_index=5) (S8.1 func_id 19), et EPS_POWER_OFF(line_index=5) (func 20) seulement
        si la ligne était éteinte à l''entrée. Pas la charge utile : sa ligne est OFF jusqu''à COM-009'
    hint:
      en: eps.bus_voltage stays in [26.5, 29.5] V within 5 s and returns to [27.0, 29.0] V within 10 s;
        eps.pl_htr_bat back to its entry value
      fr: eps.bus_voltage reste dans [26.5, 29.5] V en 5 s et revient dans [27.0, 29.0] V en 10 s ; eps.pl_htr_bat
        revenu à sa valeur d'entrée
    step: '7'
  - id: q8
    kind: check
    text:
      en: GO COM-002
      fr: GO COM-002
- id: WB-5.6-C002
  title:
    en: COM-002 TCS Verification (confirm each step)
    fr: COM-002 Vérification du TCS (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - COM-002
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: 1. Thermal HK — HK_REQUEST(sid=3) (S3.27; SID 3 = TCS, 60 s cadence)
      fr: 1. HK thermique — HK_REQUEST(sid=3) (S3.27 ; SID 3 = TCS, cadence de 60 s)
    hint:
      en: tcs.temp_obc (0x0406) inside the OBC limits on the TCS page; tcs.temp_battery (0x0407) ∈ [+5,
        +35] °C; tcs.temp_fpa (0x0408) reported — payload off and uncooled, +8 to +14 °C
      fr: tcs.temp_obc (0x0406) dans les limites OBC de la page TCS ; tcs.temp_battery (0x0407) ∈ [+5,
        +35] °C ; tcs.temp_fpa (0x0408) remontée — charge utile éteinte et non refroidie, de +8 à +14
        °C
    step: '1'
  - id: q2
    kind: check
    text:
      en: 2. Sunlit profile — HK_REQUEST(sid=3) every 120 s for 30 min
      fr: 2. Profil en phase éclairée — HK_REQUEST(sid=3) toutes les 120 s pendant 30 min
    hint:
      en: tcs.temp_obc stable or rising slower than 1 °C/min; tcs.temp_battery stable
      fr: tcs.temp_obc stable ou en hausse de moins de 1 °C/min ; tcs.temp_battery stable
    step: '2'
  - id: q3
    kind: check
    text:
      en: 3. Eclipse profile — HK_REQUEST(sid=3) at entry, mid-eclipse and exit
      fr: 3. Profil en éclipse — HK_REQUEST(sid=3) à l'entrée, à mi-éclipse et à la sortie
    hint:
      en: tcs.temp_obc above the OBC lower limit on the TCS page throughout; tcs.temp_battery > +5 °C
        throughout; drop rates recorded (OBC about 0.5 °C/min, battery buffered)
      fr: tcs.temp_obc au-dessus de la limite basse OBC de la page TCS pendant toute l'éclipse ; tcs.temp_battery
        > +5 °C pendant toute l'éclipse ; vitesses de refroidissement consignées (OBC environ 0.5 °C/min,
        batterie tamponnée)
    step: '3'
  - id: q4
    kind: check
    text:
      en: '4. Battery heater circuit, line first: record eps.pl_htr_bat (0x0115); EPS_POWER_ON(line_index=5)
        (S8.1 func 19); HEATER_BATTERY(on=1), then HEATER_BATTERY(on=0) (func 40); HEATER_AUTO_MODE(circuit=0)
        (func 45)'
      fr: '4. Circuit du réchauffeur batterie, ligne d''abord : consigner eps.pl_htr_bat (0x0115) ; EPS_POWER_ON(line_index=5)
        (S8.1 func 19) ; HEATER_BATTERY(on=1), puis HEATER_BATTERY(on=0) (func 40) ; HEATER_AUTO_MODE(circuit=0)
        (func 45)'
    hint:
      en: eps.pl_htr_bat = 1 within 5 s; ON and OFF acknowledged; tcs.temp_battery (0x0407) rising or
        stable over 3 min; the line stays ON under thermostat control (ON below +5 °C, OFF above +10 °C)
      fr: eps.pl_htr_bat = 1 en 5 s ; ON et OFF acquittés ; tcs.temp_battery (0x0407) en hausse ou stable
        sur 3 min ; la ligne reste sur ON sous la régulation du thermostat (marche sous +5 °C, arrêt au-dessus
        de +10 °C)
    step: '4'
  - id: q5
    kind: check
    text:
      en: '5. OBC heater circuit, line first: record eps.pl_htr_obc (0x0116); EPS_POWER_ON(line_index=6);
        HEATER_OBC(on=1), then HEATER_OBC(on=0) (func 41 — not 42, the thruster catbed heater); HEATER_AUTO_MODE(circuit=1)'
      fr: '5. Circuit du réchauffeur OBC, ligne d''abord : consigner eps.pl_htr_obc (0x0116) ; EPS_POWER_ON(line_index=6)
        ; HEATER_OBC(on=1), puis HEATER_OBC(on=0) (func 41 — et non 42, le réchauffeur du lit catalytique
        du propulseur) ; HEATER_AUTO_MODE(circuit=1)'
    hint:
      en: eps.pl_htr_obc = 1 within 5 s; ON and OFF acknowledged; tcs.temp_obc (0x0406) stable or rising
        over 2 min; the line stays ON under its thermostat
      fr: eps.pl_htr_obc = 1 en 5 s ; ON et OFF acquittés ; tcs.temp_obc (0x0406) stable ou en hausse
        sur 2 min ; la ligne reste sur ON sous son thermostat
    step: '5'
  - id: q6
    kind: check
    text:
      en: 6. Read the battery thermostat thresholds — GET_PARAM(param_id=0x0410), GET_PARAM(param_id=0x0411)
        (S20.3)
      fr: 6. Lire les seuils du thermostat de la batterie — GET_PARAM(param_id=0x0410), GET_PARAM(param_id=0x0411)
        (S20.3)
    hint:
      en: ON at +5 °C, OFF at +10 °C; the card reads them, it does not change them
      fr: marche à +5 °C, arrêt à +10 °C ; la fiche les lit, elle ne les modifie pas
    step: '6'
  - id: q7
    kind: check
    text:
      en: 7. FPA cooler interface before activation — GET_PARAM(param_id=0x040C), GET_PARAM(param_id=0x0114)
      fr: 7. Interface du refroidisseur du FPA avant activation — GET_PARAM(param_id=0x040C), GET_PARAM(param_id=0x0114)
    hint:
      en: tcs.cooler_fpa (0x040C) = 0; eps.pl_fpa_cooler (0x0114) = 0; tcs.temp_fpa (0x0408) at the uncooled
        equilibrium, +8 to +14 °C — recorded for COM-010
      fr: tcs.cooler_fpa (0x040C) = 0 ; eps.pl_fpa_cooler (0x0114) = 0 ; tcs.temp_fpa (0x0408) à l'équilibre
        non refroidi, de +8 à +14 °C — consignée pour COM-010
    step: '7'
  - id: q8
    kind: check
    text:
      en: '8. Compile the thermal baseline report: minimum, maximum and mean of each zone over one orbit,
        against the thermal model'
      fr: '8. Établir le rapport thermique de référence : minimum, maximum et moyenne de chaque zone sur
        une orbite, comparés au modèle thermique'
    hint:
      en: within the model prediction ± 5 °C
      fr: conforme à la prédiction du modèle à ± 5 °C
    step: '8'
  - id: q9
    kind: check
    text:
      en: GO COM-005
      fr: GO COM-005
- id: WB-5.6-C005
  title:
    en: COM-005 AOCS Mode Transitions (confirm each step)
    fr: COM-005 Transitions de modes SCAO (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - COM-005
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. Latch the commanded mode: AOCS_SET_MODE(mode=4) — NOMINAL'
      fr: '1. Mémoriser le mode commandé : AOCS_SET_MODE(mode=4) — NOMINAL'
    hint:
      en: aocs.mode (0x020F) in {4, 8} within 300 s (8 = ECLIPSE, the automatic shadow-side handover);
        aocs.commanded_mode (0x0297) = 4 within 10 s; aocs.att_error (0x0217) < 1.0° within 600 s, sunlit
        side
      fr: aocs.mode (0x020F) dans {4, 8} en 300 s (8 = ECLIPSE, le passage automatique côté ombre) ; aocs.commanded_mode
        (0x0297) = 4 en 10 s ; aocs.att_error (0x0217) < 1.0° en 600 s, côté éclairé
    step: '1'
  - id: q2
    kind: check
    text:
      en: '2. Commanded NOMINAL → FINE_POINT through its gate: AOCS_FINE_READY_CHECK (S8.1 func 89), then
        AOCS_SET_MODE(mode=5)'
      fr: '2. Commandée NOMINAL → FINE_POINT par son verrou : AOCS_FINE_READY_CHECK (S8.1 func 89), puis
        AOCS_SET_MODE(mode=5)'
    hint:
      en: 'aocs.fine_ready (0x02C5) = 0, all seven legs green (in eclipse bit 5 holds it non-zero: wait
        for the sunlit arc); aocs.mode = 5 within 30 s; aocs.att_error < 0.1° within 300 s'
      fr: 'aocs.fine_ready (0x02C5) = 0, les sept conditions au vert (en éclipse, le bit 5 le maintient
        non nul : attendre l''arc éclairé) ; aocs.mode = 5 en 30 s ; aocs.att_error < 0.1° en 300 s'
    step: '2'
  - id: q3
    kind: check
    text:
      en: '3. Commanded FINE_POINT → NOMINAL: AOCS_SET_MODE(mode=4)'
      fr: '3. Commandée FINE_POINT → NOMINAL : AOCS_SET_MODE(mode=4)'
    hint:
      en: aocs.mode = 4 within 30 s; aocs.commanded_mode (0x0297) = 4 within 10 s
      fr: aocs.mode = 4 en 30 s ; aocs.commanded_mode (0x0297) = 4 en 10 s
    step: '3'
  - id: q4
    kind: check
    text:
      en: '4. Commanded NOMINAL → INERTIAL and back: AOCS_SET_MODE(mode=9), then AOCS_SET_MODE(mode=4)'
      fr: '4. Commandée NOMINAL → INERTIAL et retour : AOCS_SET_MODE(mode=9), puis AOCS_SET_MODE(mode=4)'
    hint:
      en: aocs.mode = 9, then 4, each within 30 s
      fr: aocs.mode = 9, puis 4, chacun en 30 s
    step: '4'
  - id: q5
    kind: check
    text:
      en: '5. COARSE_SUN is a hold, not a destination: AOCS_SET_MODE(mode=3), then wait — send nothing'
      fr: '5. COARSE_SUN est un maintien, pas une destination : AOCS_SET_MODE(mode=3), puis attendre —
        ne rien envoyer'
    hint:
      en: aocs.mode = 3 within 30 s and aocs.mode_demoted (0x0298) = 1; then aocs.mode = 4 by itself within
        3600 s (about 1850 s in full sun; add an eclipse arc if the hold spans the terminator) and 0x0298
        back to 0
      fr: aocs.mode = 3 en 30 s et aocs.mode_demoted (0x0298) = 1 ; puis aocs.mode = 4 de lui-même en
        3600 s (environ 1850 s en plein Soleil ; ajouter un arc d'éclipse si le maintien franchit le terminateur)
        et 0x0298 revenu à 0
    step: '5'
  - id: q6
    kind: check
    text:
      en: 6. Automatic eclipse handover, observed in passing — no command
      fr: 6. Passage automatique en éclipse, observé au passage — aucune commande
    hint:
      en: 'from the archive: aocs.mode in {4, 8} at every sample since step 3; NOMINAL → ECLIPSE (8) at
        entry and back at exit, aocs.commanded_mode (0x0297) = 4 throughout'
      fr: 'dans l''archive : aocs.mode dans {4, 8} à chaque échantillon depuis l''étape 3 ; NOMINAL →
        ECLIPSE (8) à l''entrée et retour à la sortie, aocs.commanded_mode (0x0297) = 4 tout du long'
    step: '6'
  - id: q7
    kind: check
    text:
      en: '7. Commanded with an automatic exit — desaturation: AOCS_DESATURATE (S8.1 func 1)'
      fr: '7. Commandée avec sortie automatique — désaturation : AOCS_DESATURATE (S8.1 func 1)'
    hint:
      en: aocs.mode = 7 (DESAT) within 30 s, then 4 within 900 s with no command; an ineffective desaturation
        times out (0x029C, event 0x020E)
      fr: aocs.mode = 7 (DESAT) en 30 s, puis 4 en 900 s sans commande ; une désaturation inefficace se
        termine sur temporisation (0x029C, événement 0x020E)
    step: '7'
  - id: q8
    kind: check
    text:
      en: '8. Document the transition matrix: commanded rows carry the TC and its verification, automatic
        rows the trigger and the observed time'
      fr: '8. Documenter la matrice des transitions : les lignes commandées portent la TC et sa vérification,
        les lignes automatiques le déclencheur et l''heure observée'
    hint:
      en: every row evidenced — AOCS mode management commissioned
      fr: chaque ligne justifiée — gestion des modes AOCS recettée
    step: '8'
- id: WB-5.6-C006
  title:
    en: COM-006 TTC Link Verification (confirm each step)
    fr: COM-006 Vérification de la liaison TTC (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    - radio
    procedures:
    - COM-006
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '0. Configure the S-band chain: EPS_POWER_ON(line_index=2) (func 19), TTC_PA_ON (func 66), TTC_SET_BEACON_MODE(on=0)
        (func 70), TTC_DEPLOY_ANTENNA (func 69), HK_REQUEST(sid=6)'
      fr: '0. Configurer la chaîne bande S : EPS_POWER_ON(line_index=2) (func 19), TTC_PA_ON (func 66),
        TTC_SET_BEACON_MODE(on=0) (func 70), TTC_DEPLOY_ANTENNA (func 69), HK_REQUEST(sid=6)'
    hint:
      en: eps.pl_ttc_tx (0x0112) = 1; ttc.pa_on (0x0516) = 1; ttc.beacon_mode (0x0521) = 0; ttc.antenna_deployed
        (0x0520) = 1 within 30 s; ttc.tx_active (0x0525) = 1 (if 0, ttc.tx_gate_status (0x052B) names
        the missing permission)
      fr: eps.pl_ttc_tx (0x0112) = 1 ; ttc.pa_on (0x0516) = 1 ; ttc.beacon_mode (0x0521) = 0 ; ttc.antenna_deployed
        (0x0520) = 1 en 30 s ; ttc.tx_active (0x0525) = 1 (si 0, ttc.tx_gate_status (0x052B) indique l'autorisation
        manquante)
    step: '0'
  - id: q2
    kind: check
    text:
      en: '1. Baseline the primary transponder: HK_REQUEST(sid=6)'
      fr: '1. Référence du transpondeur principal : HK_REQUEST(sid=6)'
    hint:
      en: 'ttc.link_status (0x0501) = 2 (LOCKED); TT&C page (ground): ttc.rssi (0x0502) > −126 dBm, ttc.link_margin
        (0x0503) > 6.0 dB; elevation and station recorded'
      fr: 'ttc.link_status (0x0501) = 2 (LOCKED) ; page TT&C (sol) : ttc.rssi (0x0502) > −126 dBm, ttc.link_margin
        (0x0503) > 6.0 dB ; élévation et station consignées'
    step: '1'
  - id: q3
    kind: check
    text:
      en: 2. RSSI vs elevation, read on the TT&C page at 10°, 30° and 60°+
      fr: 2. RSSI en fonction de l'élévation, lu sur la page TT&C à 10°, 30° et 60° et plus
    hint:
      en: ttc.rssi (0x0502) > −126 dBm low, > −118 dBm medium, > −114 dBm high; ttc.link_margin (0x0503)
        > 3.0 dB at low elevation; within ± 3 dB of the link budget
      fr: ttc.rssi (0x0502) > −126 dBm basse, > −118 dBm moyenne, > −114 dBm haute ; ttc.link_margin (0x0503)
        > 3.0 dB à basse élévation ; à ± 3 dB du bilan de liaison
    step: '2'
  - id: q4
    kind: check
    text:
      en: '2a. Baseline each rung, above 30°: TTC_SET_DATA_RATE(rate=0) (func 65) LOW; TTC_SET_DOWNLINK_MODE(on=1)
        (func 79); TTC_SET_DATA_RATE(rate=1) HIGH; then TTC_SET_DATA_RATE(rate=0) and TTC_SET_DOWNLINK_MODE(on=0)'
      fr: '2a. Référence de chaque palier, au-dessus de 30° : TTC_SET_DATA_RATE(rate=0) (func 65) LOW
        ; TTC_SET_DOWNLINK_MODE(on=1) (func 79) ; TTC_SET_DATA_RATE(rate=1) HIGH ; puis TTC_SET_DATA_RATE(rate=0)
        et TTC_SET_DOWNLINK_MODE(on=0)'
    hint:
      en: 'LOW: ttc.tm_data_rate (0x0506) = 16000 bps, ttc.tm_tier (0x0539) = 1, margin 55–59 dB at 30°.
        HIGH: ttc.downlink_mode (0x053C) = 1, 128000 bps, tier 2, ttc.tm_symbol_rate (0x053B) = 64000
        Bd (QPSK), margin 45–48 dB. Step margin(LOW) − margin(HIGH) = 10.5 ± 0.5 dB; back at 16000 bps
        with DOWNLINK mode 0'
      fr: 'LOW : ttc.tm_data_rate (0x0506) = 16000 bit/s, ttc.tm_tier (0x0539) = 1, marge 55–59 dB à 30°.
        HIGH : ttc.downlink_mode (0x053C) = 1, 128000 bit/s, palier 2, ttc.tm_symbol_rate (0x053B) = 64000
        Bd (QPSK), marge 45–48 dB. Écart marge(LOW) − marge(HIGH) = 10.5 ± 0.5 dB ; retour à 16000 bit/s
        avec le mode DOWNLINK à 0'
    step: 2a
  - id: q5
    kind: check
    text:
      en: '2b. Ground arm-through policy on HIGH (no on-board gate): below 10° elevation, try to arm HIGH
        in the MCS command panel without confirming the arm-through'
      fr: '2b. Politique d''autorisation sol sur HIGH (aucun verrou bord) : sous 10° d''élévation, tenter
        d''armer HIGH dans le panneau de commande du MCS sans confirmer l''autorisation'
    hint:
      en: the MCS raises its low-elevation warning and releases nothing; no telecommand reaches the spacecraft;
        the link stays at LOW
      fr: le MCS lève son avertissement de basse élévation et ne libère rien ; aucune télécommande n'atteint
        le satellite ; la liaison reste en LOW
    step: 2b
  - id: q6
    kind: check
    text:
      en: '3. Switch to the redundant transponder: TTC_SWITCH_REDUNDANT (func 64)'
      fr: '3. Basculer sur le transpondeur redondant : TTC_SWITCH_REDUNDANT (func 64)'
    hint:
      en: ttc.link_status = 2 within 60 s; ttc.rssi > −126 dBm (the station may need a brief re-acquisition)
      fr: ttc.link_status = 2 en 60 s ; ttc.rssi > −126 dBm (la station peut devoir réacquérir brièvement)
    step: '3'
  - id: q7
    kind: check
    text:
      en: '4. Redundant transponder performance: HK_REQUEST(sid=6)'
      fr: '4. Performances du transpondeur redondant : HK_REQUEST(sid=6)'
    hint:
      en: ttc.link_margin (0x0503) > 6.0 dB; RSSI within 2.0 dB of the primary at a similar elevation
      fr: ttc.link_margin (0x0503) > 6.0 dB ; RSSI à 2.0 dB près du principal à élévation comparable
    step: '4'
  - id: q8
    kind: check
    text:
      en: '5. Restore the primary: TTC_SWITCH_PRIMARY (func 63)'
      fr: '5. Rétablir le principal : TTC_SWITCH_PRIMARY (func 63)'
    hint:
      en: ttc.link_status = 2 within 60 s; ttc.rssi > −126 dBm
      fr: ttc.link_status = 2 en 60 s ; ttc.rssi > −126 dBm
    step: '5'
  - id: q9
    kind: check
    text:
      en: '6. Command throughput: six rapid GET_PARAM(param_id=0x0105) … GET_PARAM(param_id=0x010A) (S20.3),
        then GET_PARAM(param_id=0x0306)'
      fr: '6. Débit de commandes : six GET_PARAM(param_id=0x0105) … GET_PARAM(param_id=0x010A) rapprochées
        (S20.3), puis GET_PARAM(param_id=0x0306)'
    hint:
      en: all six responses within 30 s; obdh.tc_rej_count (0x0306) unchanged across the burst
      fr: les six réponses en 30 s ; obdh.tc_rej_count (0x0306) inchangé sur la rafale
    step: '6'
  - id: q10
    kind: check
    text:
      en: '7. Multi-station verification on later passes: repeat steps 1–2 over each station of the network'
      fr: '7. Vérification multistation aux passages suivants : répéter les étapes 1–2 sur chaque station
        du réseau'
    hint:
      en: margin > 3 dB at 10° elevation from every station
      fr: marge > 3 dB à 10° d'élévation depuis chaque station
    step: '7'
  - id: q11
    kind: check
    text:
      en: '8. Compile the link budget report: margin against elevation and against rate tier for each
        station, compared with the baseline table on the card'
      fr: '8. Établir le rapport de bilan de liaison : marge en fonction de l''élévation et du palier
        de débit pour chaque station, comparée au tableau de référence de la fiche'
    hint:
      en: discrepancies documented; minimum operational elevation per station established
      fr: écarts documentés ; élévation opérationnelle minimale établie pour chaque station
    step: '8'
  - id: q12
    kind: check
    text:
      en: '9. Safe the link: TTC_SET_DATA_RATE(rate=0), TTC_SET_DOWNLINK_MODE(on=0), TTC_SWITCH_PRIMARY,
        HK_REQUEST(sid=6)'
      fr: '9. Mettre la liaison en configuration sûre : TTC_SET_DATA_RATE(rate=0), TTC_SET_DOWNLINK_MODE(on=0),
        TTC_SWITCH_PRIMARY, HK_REQUEST(sid=6)'
    hint:
      en: ttc.tm_tier (0x0539) = 1 and ttc.tm_tier_cmd (0x053A) = 1; ttc.downlink_mode (0x053C) = 0; ttc.beacon_mode
        (0x0521) = 0; ttc.antenna_deployed (0x0520) = 1 and ttc.pa_on (0x0516) = 1 — both stay that way
        for nominal operations
      fr: ttc.tm_tier (0x0539) = 1 et ttc.tm_tier_cmd (0x053A) = 1 ; ttc.downlink_mode (0x053C) = 0 ;
        ttc.beacon_mode (0x0521) = 0 ; ttc.antenna_deployed (0x0520) = 1 et ttc.pa_on (0x0516) = 1 — les
        deux restent ainsi pour les opérations nominales
    step: '9'
- id: WB-5.6-C007
  title:
    en: COM-007 OBDH Checkout (confirm each step)
    fr: COM-007 Vérification de l'OBDH (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - COM-007
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. Verify the OBC mode: HK_REQUEST(sid=4) (S3.27)'
      fr: '1. Vérifier le mode de l''OBC : HK_REQUEST(sid=4) (S3.27)'
    hint:
      en: obdh.mode (0x0300) = 0 (NOMINAL; 1 SAFE, 2 EMERGENCY). SAFE here means an earlier card left
        an excursion unrestored — investigate before going on
      fr: obdh.mode (0x0300) = 0 (NOMINAL ; 1 SAFE, 2 EMERGENCY). SAFE ici signifie qu'une fiche précédente
        n'a pas rétabli une excursion — enquêter avant de poursuivre
    step: '1'
  - id: q2
    kind: check
    text:
      en: '2. CPU utilisation: GET_PARAM(param_id=0x0302) (S20.3)'
      fr: '2. Charge du processeur : GET_PARAM(param_id=0x0302) (S20.3)'
    hint:
      en: obdh.cpu_load (0x0302) ∈ [10, 50] % (idle is about 15–25 %)
      fr: obdh.cpu_load (0x0302) ∈ [10, 50] % (au repos, environ 15–25 %)
    step: '2'
  - id: q3
    kind: check
    text:
      en: '3. Memory status: GET_PARAM(param_id=0x0303) (obdh.mmm_used), GET_PARAM(param_id=0x031E) (obdh.mem_errors),
        GET_PARAM(param_id=0x0319) (obdh.seu_count)'
      fr: '3. État de la mémoire : GET_PARAM(param_id=0x0303) (obdh.mmm_used), GET_PARAM(param_id=0x031E)
        (obdh.mem_errors), GET_PARAM(param_id=0x0319) (obdh.seu_count)'
    hint:
      en: mass memory < 70 %; obdh.mem_errors (0x031E) and obdh.seu_count (0x0319) recorded as baselines
        and not incrementing between reads
      fr: mémoire de masse < 70 % ; obdh.mem_errors (0x031E) et obdh.seu_count (0x0319) consignés comme
        références et stables entre deux lectures
    step: '3'
  - id: q4
    kind: check
    text:
      en: '4. TC/TM packet counters: GET_PARAM(param_id=0x0304), GET_PARAM(param_id=0x0306), GET_PARAM(param_id=0x0307)'
      fr: '4. Compteurs de paquets TC/TM : GET_PARAM(param_id=0x0304), GET_PARAM(param_id=0x0306), GET_PARAM(param_id=0x0307)'
    hint:
      en: obdh.tc_rx_count > 0, matching the ground log; obdh.tc_rej_count = 0; obdh.tm_pkt_count > 0
        and incrementing
      fr: obdh.tc_rx_count > 0, conforme au journal sol ; obdh.tc_rej_count = 0 ; obdh.tm_pkt_count >
        0 et en hausse
    step: '4'
  - id: q5
    kind: check
    text:
      en: '5. Confirm NOMINAL-mode services — no mode command: commanding the mode you are in proves nothing'
      fr: '5. Confirmer les services du mode NOMINAL — aucune commande de mode : commander le mode où
        l''on est déjà ne prouve rien'
    hint:
      en: obdh.mode (0x0300) = 0; obdh.cpu_load (0x0302) < 60 % over 30 s
      fr: obdh.mode (0x0300) = 0 ; obdh.cpu_load (0x0302) < 60 % sur 30 s
    step: '5'
  - id: q6
    kind: check
    text:
      en: '6. Autonomous HK generation: GET_PARAM(param_id=0x0307), wait 60 s sending no TC, GET_PARAM(param_id=0x0307)
        again'
      fr: '6. Génération autonome des HK : GET_PARAM(param_id=0x0307), attendre 60 s sans envoyer de TC,
        GET_PARAM(param_id=0x0307) de nouveau'
    hint:
      en: obdh.tm_pkt_count has incremented
      fr: obdh.tm_pkt_count a augmenté
    step: '6'
  - id: q7
    kind: check
    text:
      en: '7. Watchdog: OBC_DIAGNOSTIC (S8.1 func 61), GET_PARAM(param_id=0x0316)'
      fr: '7. Chien de garde : OBC_DIAGNOSTIC (S8.1 func 61), GET_PARAM(param_id=0x0316)'
    hint:
      en: diagnostic reply byte 5 = 1 (watchdog armed — it is in this reply only, not a telemetry parameter);
        obdh.last_reboot_cause (0x0316) = 0
      fr: octet 5 de la réponse du diagnostic = 1 (chien de garde armé — il figure dans cette réponse
        seulement, pas dans un paramètre de télémesure) ; obdh.last_reboot_cause (0x0316) = 0
    step: '7'
  - id: q8
    kind: check
    text:
      en: '8. OBC mode excursion NOMINAL → SAFE → NOMINAL: OBC_SET_MODE(mode=1), then OBC_SET_MODE(mode=0)
        (S8.1 func 50)'
      fr: '8. Excursion de mode de l''OBC NOMINAL → SAFE → NOMINAL : OBC_SET_MODE(mode=1), puis OBC_SET_MODE(mode=0)
        (S8.1 func 50)'
    hint:
      en: obdh.mode = 1 within 15 s, then 0 within 15 s — the card must not end in SAFE; the MCS contingency
        banner is expected while SAFE
      fr: obdh.mode = 1 en 15 s, puis 0 en 15 s — la fiche ne doit pas se terminer en SAFE ; le bandeau
        de contingence du MCS est attendu pendant SAFE
    step: '8'
  - id: q9
    kind: check
    text:
      en: '9. Record the OBDH baseline: CPU load, memory usage, error and SEU counters, TC/TM statistics,
        watchdog status'
      fr: '9. Consigner la référence de l''OBDH : charge CPU, occupation mémoire, compteurs d''erreurs
        et de SEU, statistiques TC/TM, état du chien de garde'
    hint:
      en: OBDH Checkout Report filed — the reference for anomaly detection in nominal operations
      fr: rapport de vérification de l'OBDH déposé — la référence de la détection d'anomalies en opérations
        nominales
    step: '9'
- id: WB-5.6-C008
  title:
    en: COM-008 FDIR Configuration (confirm each step)
    fr: COM-008 Configuration de la FDIR (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - COM-008
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. Enable and inventory S12 monitoring: MON_ENABLE (S12.1), MON_REPORT_DEFS (S12.12)'
      fr: '1. Activer et inventorier la surveillance S12 : MON_ENABLE (S12.1), MON_REPORT_DEFS (S12.12)'
    hint:
      en: TM(12,13) definition report within 10 s; every shipped definition of monitoring/s12_defs present,
        none unexpected
      fr: rapport de définitions TM(12,13) en 10 s ; toutes les définitions livrées de monitoring/s12_defs
        présentes, aucune inattendue
    step: '1'
  - id: q2
    kind: check
    text:
      en: '2. Inventory the S19 event-action table: EA_REPORT_DEFS (S19.8)'
      fr: '2. Inventorier la table événements-actions S19 : EA_REPORT_DEFS (S19.8)'
    hint:
      en: TM(19,128) report within 10 s; shipped rules present and ENABLED — the momentum chain (S12 monitor
        on aocs.h_env_frac (0x02BA) → ea 2001 → S8 func 1, the desaturation) and the TCS over-temperature
        safing chain (ea 3003)
      fr: rapport TM(19,128) en 10 s ; règles livrées présentes et ACTIVÉES — la chaîne du moment cinétique
        (surveillance S12 de aocs.h_env_frac (0x02BA) → ea 2001 → S8 func 1, la désaturation) et la chaîne
        de mise en sécurité sur surchauffe TCS (ea 3003)
    step: '2'
  - id: q3
    kind: check
    text:
      en: '3. FDIR summary telemetry: GET_PARAM(param_id=0x0700), GET_PARAM(param_id=0x0701) (S20.3)'
      fr: '3. Télémesure de synthèse FDIR : GET_PARAM(param_id=0x0700), GET_PARAM(param_id=0x0701) (S20.3)'
    hint:
      en: 'fdir.level (0x0700) = 0; fdir.active_alarms (0x0701) = 0. Anything non-zero is a latched alarm:
        resolve it before step 4'
      fr: 'fdir.level (0x0700) = 0 ; fdir.active_alarms (0x0701) = 0. Toute valeur non nulle est une alarme
        verrouillée : la résoudre avant l''étape 4'
    step: '3'
  - id: q4
    kind: check
    text:
      en: '4. Functional test of the commanded load-shed latch: record eps.pl_payload (0x0113), eps.pl_fpa_cooler
        (0x0114), eps.pl_ttc_tx (0x0112); EPS_EMERGENCY_LOAD_SHED(stage=1) (S8.1 func 25), then EPS_EMERGENCY_LOAD_SHED(stage=0).
        Never stage 2 or 3 here'
      fr: '4. Essai fonctionnel du verrou de délestage commandé : consigner eps.pl_payload (0x0113), eps.pl_fpa_cooler
        (0x0114), eps.pl_ttc_tx (0x0112) ; EPS_EMERGENCY_LOAD_SHED(stage=1) (S8.1 func 25), puis EPS_EMERGENCY_LOAD_SHED(stage=0).
        Jamais l''étage 2 ou 3 ici'
    hint:
      en: 'stage 1: eps.load_shed_stage (0x0134) = 1 and latches, event LOAD_SHED_STAGE_1 (0x0106), eps.pl_payload
        = 0. Stage 0: back to 0 and every line flag unchanged — stage 0 re-powers nothing'
      fr: 'étage 1 : eps.load_shed_stage (0x0134) = 1 et se verrouille, événement LOAD_SHED_STAGE_1 (0x0106),
        eps.pl_payload = 0. Étage 0 : retour à 0 et chaque indicateur de ligne inchangé — l''étage 0 ne
        réalimente rien'
    step: '4'
  - id: q5
    kind: check
    text:
      en: '5. Confirm no residual protection state: GET_PARAM(param_id=0x0700), HK_REQUEST(sid=1), HK_REQUEST(sid=4)'
      fr: '5. Confirmer l''absence d''état de protection résiduel : GET_PARAM(param_id=0x0700), HK_REQUEST(sid=1),
        HK_REQUEST(sid=4)'
    hint:
      en: fdir.level = 0; eps.load_shed_stage = 0; obdh.mode (0x0300) = 0 — this card makes no OBC-mode
        excursion
      fr: fdir.level = 0 ; eps.load_shed_stage = 0 ; obdh.mode (0x0300) = 0 — cette fiche ne fait aucune
        excursion de mode de l'OBC
    step: '5'
- id: WB-5.6-C009
  title:
    en: COM-009 Payload Power-On (confirm each step)
    fr: COM-009 Mise sous tension de la charge utile (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - COM-009
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. Pre-power-on EPS baseline: HK_REQUEST(sid=1) (S3.27)'
      fr: '1. Référence EPS avant mise sous tension : HK_REQUEST(sid=1) (S3.27)'
    hint:
      en: eps.bus_voltage (0x0105) ∈ [27.0, 29.0] V; eps.bat_soc (0x0101) > 75 %; eps.power_gen (0x0107)
        > 40 W — all three recorded
      fr: eps.bus_voltage (0x0105) ∈ [27.0, 29.0] V ; eps.bat_soc (0x0101) > 75 % ; eps.power_gen (0x0107)
        > 40 W — les trois consignés
    step: '1'
  - id: q2
    kind: check
    text:
      en: '2. Verify the payload is OFF: HK_REQUEST(sid=5)'
      fr: '2. Vérifier que la charge utile est sur OFF : HK_REQUEST(sid=5)'
    hint:
      en: payload.mode (0x0600) = 0 (OFF)
      fr: payload.mode (0x0600) = 0 (OFF)
    step: '2'
  - id: q3
    kind: check
    text:
      en: '3. Energise the line, then STANDBY: EPS_POWER_ON(line_index=3) (S8.1 func_id 19), HK_REQUEST(sid=1),
        PAYLOAD_SET_MODE(mode=1) (func 26), HK_ENABLE(sid=5) (S3.5), HK_REQUEST(sid=5)'
      fr: '3. Alimenter la ligne, puis STANDBY : EPS_POWER_ON(line_index=3) (S8.1 func_id 19), HK_REQUEST(sid=1),
        PAYLOAD_SET_MODE(mode=1) (func 26), HK_ENABLE(sid=5) (S3.5), HK_REQUEST(sid=5)'
    hint:
      en: eps.pl_payload (0x0113) = 1 within 10 s; payload.mode = 1 (STANDBY) within 60 s, and still 1
        on a SID 5 re-request 60 s later — a mode that reverts to 0 means the line is dark
      fr: eps.pl_payload (0x0113) = 1 en 10 s ; payload.mode = 1 (STANDBY) en 60 s, et toujours 1 à une
        nouvelle demande du SID 5 60 s plus tard — un mode qui revient à 0 signifie que la ligne est coupée
    step: '3'
  - id: q4
    kind: check
    text:
      en: '4. Payload power draw: HK_REQUEST(sid=1), GET_PARAM(param_id=0x0106) (S20.3)'
      fr: '4. Consommation de la charge utile : HK_REQUEST(sid=1), GET_PARAM(param_id=0x0106) (S20.3)'
    hint:
      en: eps.bus_voltage > 27.0 V; eps.power_cons (0x0106) up 2–3 W on the baseline (STANDBY about 2.4
        W; the 15 W cooler is not on until COM-010)
      fr: eps.bus_voltage > 27.0 V ; eps.power_cons (0x0106) en hausse de 2–3 W sur la référence (STANDBY
        environ 2.4 W ; le refroidisseur de 15 W n'est pas en marche avant COM-010)
    step: '4'
  - id: q5
    kind: check
    text:
      en: '5. Electronics health: HK_REQUEST(sid=5), GET_PARAM(param_id=0x0611), GET_PARAM(param_id=0x0603)'
      fr: '5. Santé de l''électronique : HK_REQUEST(sid=5), GET_PARAM(param_id=0x0611), GET_PARAM(param_id=0x0603)'
    hint:
      en: payload.imager_status (0x0611) without fault bits; payload.imager_temp (0x0603) in its operating
        band
      fr: payload.imager_status (0x0611) sans bit de défaut ; payload.imager_temp (0x0603) dans sa plage
        de fonctionnement
    step: '5'
  - id: q6
    kind: check
    text:
      en: '6. FPA temperature before the cooler: GET_PARAM(param_id=0x0601)'
      fr: '6. Température du FPA avant le refroidisseur : GET_PARAM(param_id=0x0601)'
    hint:
      en: payload.fpa_temp (0x0601) ∈ [+5, +30] °C — recorded for COM-010
      fr: payload.fpa_temp (0x0601) ∈ [+5, +30] °C — consignée pour COM-010
    step: '6'
  - id: q7
    kind: check
    text:
      en: '7. Data interface: GET_PARAM(param_id=0x0604), GET_PARAM(param_id=0x0648), GET_PARAM(param_id=0x0647)'
      fr: '7. Interface de données : GET_PARAM(param_id=0x0604), GET_PARAM(param_id=0x0648), GET_PARAM(param_id=0x0647)'
    hint:
      en: 'payload.store_used (0x0604) about 20 % (pre-existing fill: the empty baseline, not a fault);
        payload.product_count (0x0648) = 0 and payload.product_mb (0x0647) = 0'
      fr: 'payload.store_used (0x0604) environ 20 % (remplissage préexistant : la référence à vide, pas
        un défaut) ; payload.product_count (0x0648) = 0 et payload.product_mb (0x0647) = 0'
    step: '7'
  - id: q8
    kind: check
    text:
      en: '8. Hold STANDBY 10 min for thermal stabilisation: HK_REQUEST(sid=3) at T+5 and T+10 min, HK_REQUEST(sid=5)'
      fr: '8. Maintenir STANDBY 10 min pour la stabilisation thermique : HK_REQUEST(sid=3) à T+5 et T+10
        min, HK_REQUEST(sid=5)'
    hint:
      en: tcs.temp_obc (0x0406) stable; payload.fpa_temp stable; payload.mode = 1 maintained
      fr: tcs.temp_obc (0x0406) stable ; payload.fpa_temp stable ; payload.mode = 1 maintenu
    step: '8'
  - id: q9
    kind: check
    text:
      en: '9. Log the Payload Power-On Report: timing, power draw, imager status word, imager and FPA
        temperatures, store baseline'
      fr: '9. Consigner le rapport de mise sous tension de la charge utile : chronologie, consommation,
        mot d''état de l''imageur, températures de l''imageur et du FPA, référence de la mémoire'
    hint:
      en: ready for COM-010
      fr: prêt pour COM-010
    step: '9'
  - id: q10
    kind: check
    text:
      en: GO COM-010
      fr: GO COM-010
- id: WB-5.6-C010
  title:
    en: COM-010 FPA Cooler Activation (confirm each step; spans eclipse)
    fr: COM-010 Activation du refroidisseur du FPA (confirmer chaque étape ; s'étend sur une éclipse)
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - COM-010
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. Record the pre-activation state, cooler OFF (cool-down T = 0): HK_REQUEST(sid=3), HK_REQUEST(sid=6),
        HK_REQUEST(sid=5) (S3.27)'
      fr: '1. Consigner l''état avant activation, refroidisseur sur OFF (mise en froid T = 0) : HK_REQUEST(sid=3),
        HK_REQUEST(sid=6), HK_REQUEST(sid=5) (S3.27)'
    hint:
      en: payload.fpa_temp (0x0601) ∈ [+8, +14] °C; tcs.temp_fpa (0x0408) consistent with it; payload.mode
        (0x0600) = 1
      fr: payload.fpa_temp (0x0601) ∈ [+8, +14] °C ; tcs.temp_fpa (0x0408) cohérente avec elle ; payload.mode
        (0x0600) = 1
    step: '1'
  - id: q2
    kind: check
    text:
      en: '2. Enable the cooler: FPA_COOLER(on=1) (S8.1 func_id 43), then GET_PARAM(param_id=0x040C),
        GET_PARAM(param_id=0x0114)'
      fr: '2. Activer le refroidisseur : FPA_COOLER(on=1) (S8.1 func_id 43), puis GET_PARAM(param_id=0x040C),
        GET_PARAM(param_id=0x0114)'
    hint:
      en: tcs.cooler_fpa (0x040C) = 1 and eps.pl_fpa_cooler (0x0114) = 1 — both, or the cooler is not
        actually running
      fr: tcs.cooler_fpa (0x040C) = 1 et eps.pl_fpa_cooler (0x0114) = 1 — les deux, sinon le refroidisseur
        ne fonctionne pas réellement
    step: '2'
  - id: q3
    kind: check
    text:
      en: '3. Cooler power draw: HK_REQUEST(sid=1), GET_PARAM(param_id=0x0106) (S20.3)'
      fr: '3. Consommation du refroidisseur : HK_REQUEST(sid=1), GET_PARAM(param_id=0x0106) (S20.3)'
    hint:
      en: eps.power_cons (0x0106) up 14–16 W on the pre-cooler baseline within 30 s; eps.bus_voltage (0x0105)
        > 27.0 V
      fr: eps.power_cons (0x0106) en hausse de 14–16 W sur la référence d'avant refroidissement en 30
        s ; eps.bus_voltage (0x0105) > 27.0 V
    step: '3'
  - id: q4
    kind: check
    text:
      en: '4. First 5 minutes: GET_PARAM(param_id=0x0601) at T+2 and T+5 min (every minute on WB-5.6-FPA)'
      fr: '4. 5 premières minutes : GET_PARAM(param_id=0x0601) à T+2 et T+5 min (chaque minute sur WB-5.6-FPA)'
    hint:
      en: 'payload.fpa_temp < +4 °C at T+2 and < −8 °C at T+5. The ramp is exponential: slower at T+5
        than at T+2 is expected'
      fr: 'payload.fpa_temp < +4 °C à T+2 et < −8 °C à T+5. La rampe est exponentielle : plus lente à
        T+5 qu''à T+2, c''est normal'
    step: '4'
  - id: q5
    kind: check
    text:
      en: '5. Settling: GET_PARAM(param_id=0x0601) at T+10 and T+15 min'
      fr: '5. Stabilisation : GET_PARAM(param_id=0x0601) à T+10 et T+15 min'
    hint:
      en: T+10 ∈ [−16.0, −14.0] °C; T+15 ∈ [−16.0, −15.0] °C. A reading below −16.5 °C is a control fault,
        not an over-performing cooler
      fr: T+10 ∈ [−16.0, −14.0] °C ; T+15 ∈ [−16.0, −15.0] °C. Une lecture sous −16.5 °C est un défaut
        de régulation, pas un refroidisseur plus performant que prévu
    step: '5'
  - id: q6
    kind: check
    text:
      en: '6. Operational temperature: GET_PARAM(param_id=0x0601), GET_PARAM(param_id=0x0610), GET_PARAM(param_id=0x0631),
        GET_PARAM(param_id=0x064A), GET_PARAM(param_id=0x064B)'
      fr: '6. Température opérationnelle : GET_PARAM(param_id=0x0601), GET_PARAM(param_id=0x0610), GET_PARAM(param_id=0x0631),
        GET_PARAM(param_id=0x064A), GET_PARAM(param_id=0x064B)'
    hint:
      en: payload.fpa_temp ∈ [−16.5, −14.5] °C; payload.fpa_ready (0x0610) = 1 within 60 s (hysteresis);
        payload.fpa_setpoint (0x0631) = −15.0; payload.cooler_margin_k (0x064B) > 0 (about +5 K); floor
        at payload.cooler_floor_c (0x064A)
      fr: payload.fpa_temp ∈ [−16.5, −14.5] °C ; payload.fpa_ready (0x0610) = 1 en 60 s (hystérésis) ;
        payload.fpa_setpoint (0x0631) = −15.0 ; payload.cooler_margin_k (0x064B) > 0 (environ +5 K) ;
        plancher indiqué par payload.cooler_floor_c (0x064A)
    step: '6'
  - id: q7
    kind: check
    text:
      en: '7. Stability: GET_PARAM(param_id=0x0601) at T+35, T+40 and T+45 min'
      fr: '7. Stabilité : GET_PARAM(param_id=0x0601) à T+35, T+40 et T+45 min'
    hint:
      en: payload.fpa_temp ∈ [−16.5, −14.5] °C at every sample; peak-to-peak < 1.0 °C over 10 min (below
        0.5 °C is normal control)
      fr: payload.fpa_temp ∈ [−16.5, −14.5] °C à chaque échantillon ; crête à crête < 1.0 °C sur 10 min
        (sous 0.5 °C, c'est la régulation normale)
    step: '7'
  - id: q8
    kind: check
    text:
      en: '8. Through eclipse, if the pass spans one: GET_PARAM(param_id=0x0601)'
      fr: '8. Pendant l''éclipse, si le passage en comporte une : GET_PARAM(param_id=0x0601)'
    hint:
      en: payload.fpa_temp ∈ [−16.5, −14.5] °C; eps.bus_voltage (0x0105) > 27.0 V with the cooler load
      fr: payload.fpa_temp ∈ [−16.5, −14.5] °C ; eps.bus_voltage (0x0105) > 27.0 V avec la charge du refroidisseur
    step: '8'
  - id: q9
    kind: check
    text:
      en: '9. Generate the Cooler Activation Report: cool-down curve, cooler power, stability and eclipse
        data'
      fr: '9. Établir le rapport d''activation du refroidisseur : courbe de mise en froid, puissance du
        refroidisseur, données de stabilité et d''éclipse'
    hint:
      en: ready for COM-011
      fr: prêt pour COM-011
    step: '9'
  - id: q10
    kind: check
    text:
      en: GO COM-011
      fr: GO COM-011
- id: WB-5.6-C011
  title:
    en: COM-011 Payload Calibration (confirm each step)
    fr: COM-011 Étalonnage de la charge utile (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - COM-011
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. Pre-calibration state: HK_REQUEST(sid=5) (S3.27), GET_PARAM(param_id=0x060B), GET_PARAM(param_id=0x060A)
        (S20.3)'
      fr: '1. État avant étalonnage : HK_REQUEST(sid=5) (S3.27), GET_PARAM(param_id=0x060B), GET_PARAM(param_id=0x060A)
        (S20.3)'
    hint:
      en: payload.mode (0x0600) = 1 (STANDBY); payload.fpa_temp (0x0601) ∈ [−16.5, −14.5] °C; payload.fpa_ready
        (0x0610) = 1; free store (total − used) > 1000 MB
      fr: payload.mode (0x0600) = 1 (STANDBY) ; payload.fpa_temp (0x0601) ∈ [−16.5, −14.5] °C ; payload.fpa_ready
        (0x0610) = 1 ; mémoire libre (total − occupé) > 1000 Mo
    step: '1'
  - id: q2
    kind: check
    text:
      en: '2. Close the shutter: PAYLOAD_SET_SHUTTER(position=0) (S8.1 func 119), GET_PARAM(param_id=0x063C)'
      fr: '2. Fermer l''obturateur : PAYLOAD_SET_SHUTTER(position=0) (S8.1 func 119), GET_PARAM(param_id=0x063C)'
    hint:
      en: payload.shutter_pos (0x063C) = 0 (CLOSED)
      fr: payload.shutter_pos (0x063C) = 0 (CLOSED)
    step: '2'
  - id: q3
    kind: check
    text:
      en: '3. Dark set: PAYLOAD_SET_MODE(mode=1) (func 26), PAYLOAD_CAL_LAMP(on=0) (func 95), PAYLOAD_START_CALIBRATION(mode=0)
        (func 37, 0 = DARK), HK_REQUEST(sid=5) twice, GET_PARAM(param_id=0x0642)'
      fr: '3. Jeu d''obscurité : PAYLOAD_SET_MODE(mode=1) (func 26), PAYLOAD_CAL_LAMP(on=0) (func 95),
        PAYLOAD_START_CALIBRATION(mode=0) (func 37, 0 = DARK), HK_REQUEST(sid=5) deux fois, GET_PARAM(param_id=0x0642)'
    hint:
      en: payload.mode = 3 (CALIBRATION) within 15 s; payload.calibration_active (0x062A) = 1, then 0
        within 120 s; payload.cal_abort_reason (0x0645) = 0; payload.dark_frame_cnt (0x0642) > 0
      fr: payload.mode = 3 (CALIBRATION) en 15 s ; payload.calibration_active (0x062A) = 1, puis 0 en
        120 s ; payload.cal_abort_reason (0x0645) = 0 ; payload.dark_frame_cnt (0x0642) > 0
    step: '3'
  - id: q4
    kind: check
    text:
      en: '3a. Flat-field set: PAYLOAD_SET_SHUTTER(position=1), PAYLOAD_CAL_LAMP(on=1), GET_PARAM(param_id=0x0615),
        GET_PARAM(param_id=0x063C), PAYLOAD_START_CALIBRATION(mode=1) (1 = FLAT), HK_REQUEST(sid=5), PAYLOAD_CAL_LAMP(on=0)'
      fr: '3a. Jeu de champs plats : PAYLOAD_SET_SHUTTER(position=1), PAYLOAD_CAL_LAMP(on=1), GET_PARAM(param_id=0x0615),
        GET_PARAM(param_id=0x063C), PAYLOAD_START_CALIBRATION(mode=1) (1 = FLAT), HK_REQUEST(sid=5), PAYLOAD_CAL_LAMP(on=0)'
    hint:
      en: payload.cal_lamp_on (0x0615) = 1; payload.shutter_pos = 1 (OPEN); payload.calibration_active
        = 0 within 120 s; payload.cal_abort_reason = 0; payload.cal_valid_mask (0x0646) = 15 — bias and
        gain on all four bands
      fr: payload.cal_lamp_on (0x0615) = 1 ; payload.shutter_pos = 1 (OPEN) ; payload.calibration_active
        = 0 en 120 s ; payload.cal_abort_reason = 0 ; payload.cal_valid_mask (0x0646) = 15 — biais et
        gain sur les quatre bandes
    step: 3a
  - id: q5
    kind: check
    text:
      en: '4. Dark-frame quality, on the ground from the downlinked frames: GET_PARAM(param_id=0x0642)'
      fr: '4. Qualité des images d''obscurité, au sol sur les images transmises : GET_PARAM(param_id=0x0642)'
    hint:
      en: mean dark signal < 100 DN (12-bit, 0–4095); standard deviation < 10 DN
      fr: signal d'obscurité moyen < 100 DN (12 bits, 0–4095) ; écart type < 10 DN
    step: '4'
  - id: q6
    kind: check
    text:
      en: '5. Open the shutter, back to STANDBY: PAYLOAD_SET_MODE(mode=1), PAYLOAD_SET_SHUTTER(position=1),
        HK_REQUEST(sid=5), GET_PARAM(param_id=0x063C)'
      fr: '5. Ouvrir l''obturateur, revenir en STANDBY : PAYLOAD_SET_MODE(mode=1), PAYLOAD_SET_SHUTTER(position=1),
        HK_REQUEST(sid=5), GET_PARAM(param_id=0x063C)'
    hint:
      en: payload.mode = 1 within 15 s; payload.shutter_pos (0x063C) = 1
      fr: payload.mode = 1 en 15 s ; payload.shutter_pos (0x063C) = 1
    step: '5'
  - id: q7
    kind: check
    text:
      en: '6. Calibration-site overpass: AOCS_FINE_READY_CHECK (func 89), then AOCS_SET_MODE(mode=5) (func
        0) — FINE_POINT is mode 5'
      fr: '6. Survol du site d''étalonnage : AOCS_FINE_READY_CHECK (func 89), puis AOCS_SET_MODE(mode=5)
        (func 0) — FINE_POINT est le mode 5'
    hint:
      en: aocs.fine_ready (0x02C5) = 0; aocs.mode (0x020F) = 5 within 30 s; aocs.att_error (0x0217) <
        0.1° within 300 s
      fr: aocs.fine_ready (0x02C5) = 0 ; aocs.mode (0x020F) = 5 en 30 s ; aocs.att_error (0x0217) < 0.1°
        en 300 s
    step: '6'
  - id: q8
    kind: check
    text:
      en: '7. Site image at the overpass: PAYLOAD_SET_MODE(mode=2) (IMAGING), PAYLOAD_CAPTURE(scene_id=0,
        lines=2048) (func 28)'
      fr: '7. Image du site au survol : PAYLOAD_SET_MODE(mode=2) (IMAGING), PAYLOAD_CAPTURE(scene_id=0,
        lines=2048) (func 28)'
    hint:
      en: payload.mode = 2 within 30 s; payload.last_scene_id (0x060C, by GET_PARAM) increments within
        30 s; time, GPS position, sun angle and view geometry recorded
      fr: payload.mode = 2 en 30 s ; payload.last_scene_id (0x060C, par GET_PARAM) incrémenté en 30 s
        ; heure, position GPS, angle solaire et géométrie de visée consignés
    step: '7'
  - id: q9
    kind: check
    text:
      en: '8. Linearity pair: PAYLOAD_SET_INTEGRATION_TIME(blue_ms=1.00, green_ms=1.00, red_ms=1.00, nir_ms=1.00)
        (func 34) and PAYLOAD_CAPTURE(scene_id=0, lines=2048); then PAYLOAD_SET_INTEGRATION_TIME(blue_ms=4.00,
        green_ms=4.00, red_ms=4.00, nir_ms=4.00) and a second capture'
      fr: '8. Paire de linéarité : PAYLOAD_SET_INTEGRATION_TIME(blue_ms=1.00, green_ms=1.00, red_ms=1.00,
        nir_ms=1.00) (func 34) et PAYLOAD_CAPTURE(scene_id=0, lines=2048) ; puis PAYLOAD_SET_INTEGRATION_TIME(blue_ms=4.00,
        green_ms=4.00, red_ms=4.00, nir_ms=4.00) et une deuxième capture'
    hint:
      en: 'on the ground: the half-integration mean is about half the nominal one; the double is about
        twice, not clipped at 4095 DN'
      fr: 'au sol : la moyenne à demi-intégration vaut environ la moitié de la nominale ; la double environ
        le double, sans écrêtage à 4095 DN'
    step: '8'
  - id: q10
    kind: check
    text:
      en: '9. Return to the standard configuration: PAYLOAD_SET_MODE(mode=1), PAYLOAD_SET_INTEGRATION_TIME(blue_ms=2.00,
        green_ms=2.00, red_ms=2.00, nir_ms=2.00), AOCS_SET_MODE(mode=4)'
      fr: '9. Revenir à la configuration standard : PAYLOAD_SET_MODE(mode=1), PAYLOAD_SET_INTEGRATION_TIME(blue_ms=2.00,
        green_ms=2.00, red_ms=2.00, nir_ms=2.00), AOCS_SET_MODE(mode=4)'
    hint:
      en: payload.mode = 1 within 15 s; integration time restored; aocs.mode = 4 within 30 s
      fr: payload.mode = 1 en 15 s ; temps d'intégration rétabli ; aocs.mode = 4 en 30 s
    step: '9'
  - id: q11
    kind: check
    text:
      en: '10. Data stored, downlink scheduled: GET_PARAM(param_id=0x0647), GET_PARAM(param_id=0x0648)'
      fr: '10. Données stockées, vidage programmé : GET_PARAM(param_id=0x0647), GET_PARAM(param_id=0x0648)'
    hint:
      en: storage consistent with about 13 frames (10 dark + 3 site images); full downlink booked for
        the next pass
      fr: stockage cohérent avec environ 13 images (10 d'obscurité + 3 du site) ; vidage complet réservé
        au passage suivant
    step: '10'
  - id: q12
    kind: check
    text:
      en: GO COM-012
      fr: GO COM-012
- id: WB-5.6-C012
  title:
    en: COM-012 First Light (confirm each step)
    fr: COM-012 Première lumière (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - COM-012
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. AOCS to FINE_POINT: AOCS_FINE_READY_CHECK (func 89) — the mask must read 0, or mode 5 is
        refused TM(1,8) — then AOCS_SET_MODE(mode=5)'
      fr: '1. AOCS en FINE_POINT : AOCS_FINE_READY_CHECK (func 89) — le masque doit valoir 0, sinon le
        mode 5 est refusé en TM(1,8) — puis AOCS_SET_MODE(mode=5)'
    hint:
      en: aocs.mode (0x020F) = 5 within 30 s; aocs.total_pointing_err_3sig (0x02AA) < 0.05° within 300
        s (the capture gate); aocs.att_error (0x0217) < 0.1° within 180 s; aocs.rate_pitch (0x0205) ∈
        [0.053, 0.073]°/s (nadir orbit rate); aocs.rate_yaw (0x0206) < 0.01°/s
      fr: aocs.mode (0x020F) = 5 en 30 s ; aocs.total_pointing_err_3sig (0x02AA) < 0.05° en 300 s (le
        verrou de capture) ; aocs.att_error (0x0217) < 0.1° en 180 s ; aocs.rate_pitch (0x0205) ∈ [0.053,
        0.073]°/s (vitesse orbitale du suivi du nadir) ; aocs.rate_yaw (0x0206) < 0.01°/s
    step: '1'
  - id: q2
    kind: check
    text:
      en: '2. FPA temperature: GET_PARAM(param_id=0x0601) (S20.3)'
      fr: '2. Température du FPA : GET_PARAM(param_id=0x0601) (S20.3)'
    hint:
      en: payload.fpa_temp (0x0601) ∈ [−16.5, −14.5] °C — payload.fpa_ready (0x0610) = 1 says the same
      fr: payload.fpa_temp (0x0601) ∈ [−16.5, −14.5] °C — payload.fpa_ready (0x0610) = 1 dit la même chose
    step: '2'
  - id: q3
    kind: check
    text:
      en: '3. Payload ready, baselines: HK_REQUEST(sid=5), GET_PARAM(param_id=0x0604), GET_PARAM(param_id=0x0605),
        GET_PARAM(param_id=0x060B)'
      fr: '3. Charge utile prête, références : HK_REQUEST(sid=5), GET_PARAM(param_id=0x0604), GET_PARAM(param_id=0x0605),
        GET_PARAM(param_id=0x060B)'
    hint:
      en: payload.mode (0x0600) = 1; payload.store_used (0x0604) < 97 %; payload.image_count (0x0605)
        and payload.mem_used_mb (0x060B) recorded
      fr: payload.mode (0x0600) = 1 ; payload.store_used (0x0604) < 97 % ; payload.image_count (0x0605)
        et payload.mem_used_mb (0x060B) consignés
    step: '3'
  - id: q4
    kind: check
    text:
      en: '4. IMAGING: PAYLOAD_SET_MODE(mode=2) (func 26)'
      fr: '4. IMAGING : PAYLOAD_SET_MODE(mode=2) (func 26)'
    hint:
      en: payload.mode = 2 (IMAGING) within 30 s
      fr: payload.mode = 2 (IMAGING) en 30 s
    step: '4'
  - id: q5
    kind: check
    text:
      en: '5. First capture: PAYLOAD_CAPTURE(scene_id=1, lines=2048) (S8.1 func 28)'
      fr: '5. Première capture : PAYLOAD_CAPTURE(scene_id=1, lines=2048) (S8.1 func 28)'
    hint:
      en: payload.last_scene_id (0x060C) = 1 within 30 s and payload.image_count (0x0605) = 1 within 10
        s, both by GET_PARAM. 2048 lines at 244 Hz = 8.4 s ≈ 59 km along-track
      fr: payload.last_scene_id (0x060C) = 1 en 30 s et payload.image_count (0x0605) = 1 en 10 s, tous
        deux par GET_PARAM. 2048 lignes à 244 Hz = 8.4 s ≈ 59 km le long de la trace
    step: '5'
  - id: q6
    kind: check
    text:
      en: '6. Image written: GET_PARAM(param_id=0x0604), GET_PARAM(param_id=0x060B)'
      fr: '6. Image écrite : GET_PARAM(param_id=0x0604), GET_PARAM(param_id=0x060B)'
    hint:
      en: 'payload.store_used (0x0604) up; payload.mem_used_mb (0x060B) up by 1.0–4.0 MB since step 3
        (one image: 4 MB raw, 1.0–2.7 MB compressed; 0x060B is the total, so only the difference counts)'
      fr: 'payload.store_used (0x0604) en hausse ; payload.mem_used_mb (0x060B) en hausse de 1.0–4.0 Mo
        depuis l''étape 3 (une image : 4 Mo brute, 1.0–2.7 Mo compressée ; 0x060B est le total, seule
        la différence compte)'
    step: '6'
  - id: q7
    kind: check
    text:
      en: '7. Back to STANDBY: PAYLOAD_SET_MODE(mode=1)'
      fr: '7. Retour en STANDBY : PAYLOAD_SET_MODE(mode=1)'
    hint:
      en: payload.mode = 1 within 15 s; the cooler keeps running
      fr: payload.mode = 1 en 15 s ; le refroidisseur reste en marche
    step: '7'
  - id: q8
    kind: check
    text:
      en: '8. Downlink over Service 13: TTC_SET_DOWNLINK_MODE(on=1), TTC_SET_DATA_RATE(rate=1) (HIGH),
        S13_CREATE_TRANSFER(scene_id=1, size_mb=0), S13_REPORT_STATUS(transfer_id=T), S13_END_TRANSFER(transfer_id=T),
        TTC_SET_DATA_RATE(rate=0), TTC_SET_DOWNLINK_MODE(on=0)'
      fr: '8. Vidage par le service 13 : TTC_SET_DOWNLINK_MODE(on=1), TTC_SET_DATA_RATE(rate=1) (HIGH),
        S13_CREATE_TRANSFER(scene_id=1, size_mb=0), S13_REPORT_STATUS(transfer_id=T), S13_END_TRANSFER(transfer_id=T),
        TTC_SET_DATA_RATE(rate=0), TTC_SET_DOWNLINK_MODE(on=0)'
    hint:
      en: ttc.tm_data_rate (0x0506) = 128000 bps; TM(13,2) open report — transfer id, block count and
        CRC-32 recorded; payload.transfer_active (0x062D) = 1, payload.transfer_progress (0x062E) rising,
        then 0x062D = 0; back at 16000 bps with ttc.downlink_mode (0x053C) = 0; CRC-32 OK on the ground
      fr: ttc.tm_data_rate (0x0506) = 128000 bit/s ; rapport d'ouverture TM(13,2) — identifiant du transfert,
        nombre de blocs et CRC-32 consignés ; payload.transfer_active (0x062D) = 1, payload.transfer_progress
        (0x062E) en hausse, puis 0x062D = 0 ; retour à 16000 bit/s avec ttc.downlink_mode (0x053C) = 0
        ; CRC-32 correct au sol
    step: '8'
  - id: q9
    kind: check
    text:
