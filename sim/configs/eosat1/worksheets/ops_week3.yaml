  - id: q3
    kind: check
    text:
      en: BP-2 (first_contact.yaml) loaded; spacecraft in phase 3 (BOOTLOADER)
      fr: BP-2 (first_contact.yaml) chargé ; satellite en phase 3 (BOOTLOADER)
  - id: q4
    kind: check
    text:
      en: A real Iqaluit pass is scheduled for first contact (pass override is an instructor control;
        no operator forces contact)
      fr: Un vrai passage d'Iqaluit est programmé pour le premier contact (le forçage de passage est une
        commande de l'enseignant ; aucun opérateur ne force le contact)
  - id: q5
    kind: check
    text:
      en: FD has loaded LEOP procedure pack into procedure panel
      fr: Le FD a chargé le jeu de procédures LEOP dans le panneau de procédures
  - id: q6
    kind: check
    text:
      en: SPACON has reviewed the FDIR rule set on the FDIR panel (there is no FDIR table-load telecommand
        — the rule set is subsystems/fdir.yaml + monitoring/)
      fr: SPACON a passé en revue le jeu de règles FDIR dans le panneau FDIR (il n'existe aucune télécommande
        de chargement de table FDIR — le jeu de règles est subsystems/fdir.yaml + monitoring/)
  - id: q7
    kind: check
    text:
      en: AOCS has reviewed residual tumble rates (~1–2 °/s per axis from the separation impulse)
      fr: L'AOCS a passé en revue les vitesses de culbutage résiduelles (environ 1–2 °/s par axe dues
        à l'impulsion de séparation)
  - id: q8
    kind: check
    text:
      en: EPS confirms SoC ~90 % (eps.bat_soc 0x0101); only the non-switchable obc (line 0) and ttc_rx
        (line 1) are ON — every switchable line defaults OFF
      fr: L'EPS confirme un SoC d'environ 90 % (eps.bat_soc 0x0101) ; seules les lignes non commutables
        obc (ligne 0) et ttc_rx (ligne 1) sont sur ON — toutes les lignes commutables sont sur OFF par
        défaut
  - id: q9
    kind: check
    text:
      en: TT&C has confirmed UHF beacon reception (ttc.beacon_active 0x0527 = 1); note the beacon is a
        separate radio from the S-band prime
      fr: Le TT&C a confirmé la réception de la balise UHF (ttc.beacon_active 0x0527 = 1) ; noter que
        la balise est une radio distincte de la chaîne principale bande S
  - id: q10
    kind: check
    text:
      en: Ground Seg has confirmed Iqaluit antenna on-target, demodulator on the SAFE rung (1 000 bps,
        BPSK, conv(7,1/2)+RS, 1 kBd)
      fr: Le segment sol a confirmé que l'antenne d'Iqaluit est sur la cible, démodulateur sur l'échelon
        SAFE (1 000 bit/s, BPSK, conv(7,1/2)+RS, 1 kBd)
  - id: q11
    kind: check
    text:
      en: FDS has produced 24-h pass schedule and handed to FD/TT&C/Ground Seg
      fr: La FDS a produit le planning des passages sur 24 h et l'a remis au FD, au TT&C et au segment
        sol
  - id: q12
    kind: check
    text:
      en: Anomaly ticket forms blank-printed and available at each console
      fr: Formulaires de fiche d'anomalie imprimés vierges et disponibles à chaque console
  - id: q13
    kind: check
    text:
      en: Voice-loop language declared (callouts in English)
      fr: Langue de la boucle vocale déclarée (annonces en anglais)
  - id: q14
    kind: text
    text:
      en: FD ready call (verbatim)
      fr: Annonce « prêt » du FD (mot pour mot)
- id: WB-5.5-L001
  title:
    en: LEOP-001 First Acquisition of Signal & OBC Boot (confirm each step)
    fr: LEOP-001 Première acquisition du signal et amorçage de l'OBC (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    - radio
    procedures:
    - LEOP-001
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. Ground Seg: Configure the Iqaluit receiver for the scheduled pass: point at the predicted
        AOS, auto-track, wide acquisition (±40 kHz), demodulator on the SAFE rung (1 kBd BPSK, conv(7,1/2)+RS)'
      fr: '1. Segment sol : Configurer le récepteur d''Iqaluit pour le passage programmé : pointage sur
        l''AOS prévue, poursuite automatique, acquisition large (±40 kHz), démodulateur sur le palier
        SAFE (1 kBd BPSK, conv(7,1/2)+RS)'
    hint:
      en: station TRACKING_READY at the predicted AOS; pass window open
      fr: station TRACKING_READY à l'AOS prévue ; fenêtre de passage ouverte
    step: '1'
  - id: q2
    kind: check
    text:
      en: '2. TT&C: First uplink, sent blind into the window: CONNECTION_TEST (S17.1)'
      fr: '2. TT&C : Première TC montante, envoyée en aveugle dans la fenêtre : CONNECTION_TEST (S17.1)'
    hint:
      en: S1.1 acceptance < 10 s; S17.2 report < 10 s; beacon SID 11 arriving < 30 s — the auto-TX hold-down
        has powered the ttc_tx line
      fr: acceptation S1.1 < 10 s ; rapport S17.2 < 10 s ; SID 11 de la balise reçu < 30 s — le maintien
        automatique de l'émetteur a alimenté la ligne ttc_tx
    step: '2'
  - id: q3
    kind: check
    text:
      en: '3. TT&C: Verify carrier lock and link quality'
      fr: '3. TT&C : Vérifier le verrouillage de la porteuse et la qualité de la liaison'
    hint:
      en: 'beacon frames decode continuously < 30 s; TT&C page (ground): ttc.rssi (0x0502) > −126 dBm,
        ttc.link_margin (0x0503) > 3.0 dB. ttc.link_status is in SID 6, which the bootloader does not
        emit: it is checked at step 5a'
      fr: 'trames de balise décodées en continu < 30 s ; page TT&C (sol) : ttc.rssi (0x0502) > −126 dBm,
        ttc.link_margin (0x0503) > 3.0 dB. ttc.link_status est dans le SID 6, que le chargeur d''amorçage
        n''émet pas : il est vérifié à l''étape 5a'
    step: '3'
  - id: q4
    kind: check
    text:
      en: '4. SPACON: Confirm the bootloader: HK_REQUEST(sid=11) (S3.27)'
      fr: '4. SPACON : Confirmer le chargeur d''amorçage : HK_REQUEST(sid=11) (S3.27)'
    hint:
      en: beacon packet received; obdh.sw_image (0x0311) = 0 (BOOTLOADER) < 10 s
      fr: paquet de balise reçu ; obdh.sw_image (0x0311) = 0 (BOOTLOADER) < 10 s
    step: '4'
  - id: q5
    kind: check
    text:
      en: '5. SPACON: Boot the application: OBC_BOOT_APP (S8.1 func 55); after its S1.7, HK_ENABLE(sid=3),
        HK_ENABLE(sid=4), HK_ENABLE(sid=6) (S3.5)'
      fr: '5. SPACON : Amorcer l''applicatif : OBC_BOOT_APP (S8.1 func 55) ; après son S1.7, HK_ENABLE(sid=3),
        HK_ENABLE(sid=4), HK_ENABLE(sid=6) (S3.5)'
    hint:
      en: S1.1 + S1.3 < 5 s; S1.7 < 15 s (event 0x0310 BOOT_COMPLETE; a CRC failure gives S1.8 and 0x0305
        BOOT_FAILURE); obdh.sw_image = 1 < 15 s; obdh.boot_state (0x0A15) = 2; only SIDs 1 and 11 stream
        after the boot, then SIDs 3 (60 s), 4 (8 s), 6 (8 s) appear
      fr: S1.1 + S1.3 < 5 s ; S1.7 < 15 s (événement 0x0310 BOOT_COMPLETE ; un échec de CRC donne un S1.8
        et 0x0305 BOOT_FAILURE) ; obdh.sw_image = 1 < 15 s ; obdh.boot_state (0x0A15) = 2 ; seuls les
        SID 1 et 11 sont émis après l'amorçage, puis les SID 3 (60 s), 4 (8 s) et 6 (8 s) apparaissent
    step: '5'
  - id: q6
    kind: check
    text:
      en: '5a. TT&C: Clear beacon mode, then select LOW: TTC_SET_BEACON_MODE(on=0) (S8.1 func 70), TTC_SET_DATA_RATE(rate=0)
        (func 65). Re-configure the ground demodulator to 16 kBd first'
      fr: '5a. TT&C : Lever le mode balise, puis sélectionner LOW : TTC_SET_BEACON_MODE(on=0) (S8.1 func
        70), TTC_SET_DATA_RATE(rate=0) (func 65). Reconfigurer d''abord le démodulateur sol à 16 kBd'
    hint:
      en: S1.1 + S1.7, not S1.8, < 5 s each; ttc.beacon_mode (0x0521) = 0; ttc.link_status (0x0501) =
        2 (LOCKED) < 15 s; ttc.tm_data_rate (0x0506) = 16000 bps, ttc.tm_tier (0x0539) = 1, ttc.tm_symbol_rate
        (0x053B) = 16000 Bd
      fr: S1.1 + S1.7, et non S1.8, < 5 s chacune ; ttc.beacon_mode (0x0521) = 0 ; ttc.link_status (0x0501)
        = 2 (LOCKED) < 15 s ; ttc.tm_data_rate (0x0506) = 16000 bit/s, ttc.tm_tier (0x0539) = 1, ttc.tm_symbol_rate
        (0x053B) = 16000 Bd
    step: 5a
  - id: q7
    kind: check
    text:
      en: '6. SPACON: Note the unset clock — do not sync here: time is LEOP-006''s job'
      fr: '6. SPACON : Noter que l''horloge n''est pas réglée — ne pas synchroniser ici : le temps relève
        de LEOP-006'
    hint:
      en: obdh.time_ref (0x0A13) = 0 (NONE); timestamps read year-2000 CUC — correct behaviour, not a
        fault
      fr: obdh.time_ref (0x0A13) = 0 (NONE) ; les horodatages indiquent l'an 2000 en CUC — comportement
        correct, pas un défaut
    step: '6'
  - id: q8
    kind: check
    text:
      en: '7. SPACON: Power sanity check: HK_REQUEST(sid=1) (S3.27)'
      fr: '7. SPACON : Contrôle de cohérence de l''alimentation : HK_REQUEST(sid=1) (S3.27)'
    hint:
      en: eps.bus_voltage (0x0105) 26.0–30.0 V; eps.bat_soc (0x0101) > 50 %; eps.pl_ttc_tx (0x0112) =
        1 (auto-TX hold-down); eps.power_gen (0x0107) reported, small while tumbling
      fr: eps.bus_voltage (0x0105) de 26.0 à 30.0 V ; eps.bat_soc (0x0101) > 50 % ; eps.pl_ttc_tx (0x0112)
        = 1 (maintien automatique de l'émetteur) ; eps.power_gen (0x0107) remontée, faible pendant le
        culbutage
    step: '7'
  - id: q9
    kind: check
    text:
      en: '8. TT&C: Log and report: AOS, first accepted TC, application boot, HK values; confirm the pass
        is long enough for LEOP-002 or book the next one'
      fr: '8. TT&C : Consigner et rendre compte : AOS, première TC acceptée, amorçage applicatif, valeurs
        HK ; confirmer que le passage suffit pour LEOP-002 ou réserver le suivant'
    hint:
      en: First Acquisition Report distributed; clear to LEOP-002
      fr: rapport de première acquisition diffusé ; feu vert pour LEOP-002
    step: '8'
  - id: q10
    kind: text
    text:
      en: AOS time (UTC)
      fr: Heure d'AOS (UTC)
  - id: q11
    kind: text
    text:
      en: First accepted TC
      fr: Première TC acceptée
  - id: q12
    kind: text
    text:
      en: App boot complete
      fr: Amorçage applicatif terminé
  - id: q13
    kind: text
    text:
      en: obdh.time_ref (expect 0)
      fr: 'obdh.time_ref (attendu : 0)'
  - id: q14
    kind: text
    text:
      en: eps.bus_voltage
      fr: eps.bus_voltage
- id: WB-5.5-L006
  title:
    en: LEOP-006 Time Synchronisation (confirm each step)
    fr: LEOP-006 Synchronisation temporelle (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - LEOP-006
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. Verify OBC status and the link: HK_REQUEST(sid=4), HK_REQUEST(sid=6) (S3.27)'
      fr: '1. Vérifier l''état de l''OBC et la liaison : HK_REQUEST(sid=4), HK_REQUEST(sid=6) (S3.27)'
    hint:
      en: 'obdh.mode (0x0300) ≤ 1 (NOMINAL or SAFE); obdh.cpu_load (0x0302) < 80 %; TT&C page (ground):
        ttc.link_margin (0x0503) > 3.0 dB'
      fr: 'obdh.mode (0x0300) ≤ 1 (NOMINAL ou SAFE) ; obdh.cpu_load (0x0302) < 80 % ; page TT&C (sol)
        : ttc.link_margin (0x0503) > 3.0 dB'
    step: '1'
  - id: q2
    kind: check
    text:
      en: '2. Read the clock, its reference and the slant range: REQUEST_TIME (S9.2), HK_REQUEST(sid=6),
        HK_REQUEST(sid=4)'
      fr: '2. Lire l''horloge, sa référence et la distance oblique : REQUEST_TIME (S9.2), HK_REQUEST(sid=6),
        HK_REQUEST(sid=4)'
    hint:
      en: TM(9,2) < 10 s. T_obc = obdh.obc_time (0x0309) + obdh.obc_time_fine (0x0A12) / 65536, CUC seconds
        since J2000; obdh.time_ref (0x0A13), expect 0 (NONE); obdh.time_since_sync_s (0x0A14), expect
        4294967295 (never synced); T_ground; OWLT = ttc.range_km (0x0509) / 299792.458 × 1000 ms, expect
        3–22 ms
      fr: TM(9,2) < 10 s. T_obc = obdh.obc_time (0x0309) + obdh.obc_time_fine (0x0A12) / 65536, en secondes
        CUC depuis J2000 ; obdh.time_ref (0x0A13), attendu 0 (NONE) ; obdh.time_since_sync_s (0x0A14),
        attendu 4294967295 (jamais synchronisée) ; T_sol ; OWLT = ttc.range_km (0x0509) / 299792.458 ×
        1000 ms, attendu 3–22 ms
    step: '2'
  - id: q3
    kind: check
    text:
      en: '3. Calculate the time delta: Δt = T_obc − (T_ground − OWLT)'
      fr: '3. Calculer l''écart de temps : Δt = T_obc − (T_sol − OWLT)'
    hint:
      en: a negative Δt of roughly the mission age is the expected LEOP signature; the FD approves the
        correction
      fr: un Δt négatif d'environ l'âge de la mission est la signature attendue en LEOP ; le FD approuve
        la correction
    step: '3'
  - id: q4
    kind: check
    text:
      en: '4. Send the time update: SET_TIME(cuc_seconds=T_corrected) (S9.1), with T_corrected = T_ground
        at send + OWLT + about 50 ms, on the J2000 epoch — a Unix time is about 9.5e8 s too large, and
        the argument goes inside the backticks: a bare SET_TIME sends cuc_seconds = 0'
      fr: '4. Envoyer la mise à l''heure : SET_TIME(cuc_seconds=T_corrected) (S9.1), avec T_corrected
        = T_sol à l''envoi + OWLT + environ 50 ms, sur l''époque J2000 — un temps Unix est trop grand
        d''environ 9.5e8 s, et l''argument se place à l''intérieur des backticks : un SET_TIME nu envoie
        cuc_seconds = 0'
    hint:
      en: S1.1 < 5 s; no S1.2 rejection
      fr: S1.1 < 5 s ; aucun rejet S1.2
    step: '4'
  - id: q5
    kind: check
    text:
      en: '5. Verify the time accuracy: REQUEST_TIME (S9.2), HK_REQUEST(sid=4)'
      fr: '5. Vérifier l''exactitude du temps : REQUEST_TIME (S9.2), HK_REQUEST(sid=4)'
    hint:
      en: obdh.time_ref = 1 (GROUND) < 15 s; obdh.mode = 0 < 10 s; residual = T_obc_new − (T_ground −
        OWLT) within ±1.0 s (LEOP threshold; NOM-008 tightens it)
      fr: obdh.time_ref = 1 (GROUND) < 15 s ; obdh.mode = 0 < 10 s ; résidu = T_obc_nouveau − (T_sol −
        OWLT) à ±1.0 s (seuil LEOP ; NOM-008 le resserre)
    step: '5'
  - id: q6
    kind: check
    text:
      en: '6. Validate the clock rate: a second time report (S9.2) and SID 4 sample after a known ground
        interval'
      fr: '6. Valider la dérive de l''horloge : un deuxième rapport de temps (S9.2) et un échantillon
        du SID 4 après un intervalle sol connu'
    hint:
      en: report < 10 s; drift = ((T_obc2 − T_obc1) − (T_gnd2 − T_gnd1)) / interval × 1e6 < 100 ppm
      fr: rapport < 10 s ; dérive = ((T_obc2 − T_obc1) − (T_sol2 − T_sol1)) / intervalle × 1e6 < 100 ppm
    step: '6'
  - id: q7
    kind: check
    text:
      en: '6a. Path B, GPS time discipline, once the receiver has a fix: HK_ENABLE(sid=12) (S3.5), then
        OBC_GPS_TIME_SYNC (S8.1 func 80) — ground set first, GPS second'
      fr: '6a. Voie B, asservissement temporel GPS, dès que le récepteur a un point : HK_ENABLE(sid=12)
        (S3.5), puis OBC_GPS_TIME_SYNC (S8.1 func 80) — réglage sol d''abord, GPS ensuite'
    hint:
      en: SID 12 periodic within 8 s; aocs.gps_fix (0x0274) ≥ 2 (TTFF up to 15 min from LEOP-007; no fix
        yet → sync on the next contact); S1.1 + S1.7 < 5 s; obdh.time_ref = 2 (GPS) < 15 s, 3 (HOLDOVER)
        acceptable; obdh.time_since_sync_s small
      fr: SID 12 périodique en 8 s ; aocs.gps_fix (0x0274) ≥ 2 (TTFF jusqu'à 15 min après LEOP-007 ; pas
        encore de point → synchroniser au contact suivant) ; S1.1 + S1.7 < 5 s ; obdh.time_ref = 2 (GPS)
        < 15 s, 3 (HOLDOVER) acceptable ; obdh.time_since_sync_s faible
    step: 6a
  - id: q8
    kind: check
    text:
      en: '7. Confirm time-stamping and log: HK_REQUEST(sid=4)'
      fr: '7. Confirmer l''horodatage et consigner : HK_REQUEST(sid=4)'
    hint:
      en: obdh.uptime (0x0308) > 0 (no reboot); obdh.time_ref in {1, 2, 3}; HK packets carry mission-date
        timestamps. Log Δt, the jump in event 0x030C, the residual and the drift
      fr: obdh.uptime (0x0308) > 0 (pas de redémarrage) ; obdh.time_ref dans {1, 2, 3} ; les paquets HK
        portent des horodatages à la date de la mission. Consigner Δt, le saut de l'événement 0x030C,
        le résidu et la dérive
    step: '7'
- id: WB-5.5-L002
  title:
    en: LEOP-002 Initial Health Check (confirm each step)
    fr: LEOP-002 Bilan de santé initial (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - LEOP-002
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. EPS: Full EPS housekeeping: HK_REQUEST(sid=1) (S3.27)'
      fr: '1. EPS : Données de servitude EPS complètes : HK_REQUEST(sid=1) (S3.27)'
    hint:
      en: 'eps.bus_voltage (0x0105) 26.0–30.0 V; eps.bat_voltage (0x0100) reported; eps.bat_soc (0x0101)
        > 50 %; eps.power_gen (0x0107) > 0 W in sunlight — 0 W is expected with eps.eclipse_flag (0x0108)
        = 1: re-check after eclipse exit'
      fr: 'eps.bus_voltage (0x0105) de 26.0 à 30.0 V ; eps.bat_voltage (0x0100) remontée ; eps.bat_soc
        (0x0101) > 50 % ; eps.power_gen (0x0107) > 0 W au Soleil — 0 W est attendu avec eps.eclipse_flag
        (0x0108) = 1 : contrôler de nouveau après la sortie d''éclipse'
    step: '1'
  - id: q2
    kind: check
    text:
      en: '2. EPS: Confirm the unpowered subsystems are dark (same SID 1 report)'
      fr: '2. EPS : Confirmer que les sous-systèmes non alimentés sont éteints (même rapport SID 1)'
    hint:
      en: eps.pl_aocs_wheels (0x0117) = 0 (until LEOP-007); eps.pl_payload (0x0113) = 0 (until COM-009);
        eps.pl_fpa_cooler (0x0114) = 0 (until COM-010); eps.pl_prop (0x014A) = 0
      fr: eps.pl_aocs_wheels (0x0117) = 0 (jusqu'à LEOP-007) ; eps.pl_payload (0x0113) = 0 (jusqu'à COM-009)
        ; eps.pl_fpa_cooler (0x0114) = 0 (jusqu'à COM-010) ; eps.pl_prop (0x014A) = 0
    step: '2'
  - id: q3
    kind: check
    text:
      en: '3. Thermal: Thermal housekeeping: HK_REQUEST(sid=3)'
      fr: '3. Thermique : Données de servitude thermiques : HK_REQUEST(sid=3)'
    hint:
      en: 'tcs.temp_obc (0x0406) inside the OBC limits on the TCS page; tcs.temp_battery (0x0407) 0 to
        +35 °C; tcs.temp_fpa (0x0408) reported (payload unpowered: ambient)'
      fr: 'tcs.temp_obc (0x0406) dans les limites OBC de la page TCS ; tcs.temp_battery (0x0407) de 0
        à +35 °C ; tcs.temp_fpa (0x0408) remontée (charge utile non alimentée : ambiante)'
    step: '3'
  - id: q4
    kind: check
    text:
      en: '4. SPACON: OBDH housekeeping: HK_REQUEST(sid=4)'
      fr: '4. SPACON : Données de servitude OBDH : HK_REQUEST(sid=4)'
    hint:
      en: obdh.mode (0x0300) = 0 (NOMINAL) or 1 (SAFE); obdh.cpu_load (0x0302) < 70 %
      fr: obdh.mode (0x0300) = 0 (NOMINAL) ou 1 (SAFE) ; obdh.cpu_load (0x0302) < 70 %
    step: '4'
  - id: q5
    kind: check
    text:
      en: '5. TT&C: TT&C housekeeping: HK_REQUEST(sid=6)'
      fr: '5. TT&C : Données de servitude TT&C : HK_REQUEST(sid=6)'
    hint:
      en: 'ttc.link_status (0x0501) = 2 (LOCKED); TT&C page (ground): ttc.rssi (0x0502) > −126 dBm, ttc.link_margin
        (0x0503) > 3.0 dB'
      fr: 'ttc.link_status (0x0501) = 2 (LOCKED) ; page TT&C (sol) : ttc.rssi (0x0502) > −126 dBm, ttc.link_margin
        (0x0503) > 3.0 dB'
    step: '5'
  - id: q6
    kind: check
    text:
      en: '6. SPACON: Compile the health assessment summary for the FD; flag any value outside its post-separation
        range'
      fr: '6. SPACON : Établir la synthèse du bilan de santé pour le FD ; signaler toute valeur hors de
        sa plage post-séparation'
    hint:
      en: all powered subsystems nominal → clear to LEOP-004
      fr: tous les sous-systèmes alimentés nominaux → feu vert pour LEOP-004
    step: '6'
  - id: q7
    kind: text
    text:
      en: Consolidated PASS / FAIL
      fr: Bilan consolidé PASS / FAIL
    hint:
      en: PASS / FAIL
      fr: PASS / FAIL
  - id: q8
    kind: text
    text:
      en: If FAIL, which contingency procedure invoked
      fr: En cas de FAIL, procédure de contingence déclenchée
- id: WB-5.5-L007
  title:
    en: LEOP-007 Sequential Power-On (confirm each step)
    fr: LEOP-007 Mise sous tension séquentielle (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - LEOP-007
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. EPS: Verify the EPS baseline: HK_REQUEST(sid=1) (S3.27)'
      fr: '1. EPS : Vérifier l''état de référence de l''EPS : HK_REQUEST(sid=1) (S3.27)'
    hint:
      en: eps.bus_voltage (0x0105) 26.0–30.0 V; eps.bat_soc (0x0101) > 60 %; eps.power_gen (0x0107) >
        20 W
      fr: eps.bus_voltage (0x0105) de 26.0 à 30.0 V ; eps.bat_soc (0x0101) > 60 % ; eps.power_gen (0x0107)
        > 20 W
    step: '1'
  - id: q2
    kind: check
    text:
      en: '2. EPS: Heater lines only as needed: read tcs.temp_battery (0x0407) and tcs.temp_obc (0x0406)
        from SID 3; EPS_POWER_ON(line_index=5) (S8.1 func 19) only if the battery is below +5 °C; EPS_POWER_ON(line_index=6)
        only if the OBC zone is below 0 °C'
      fr: '2. EPS : Lignes de réchauffeurs seulement si nécessaire : lire tcs.temp_battery (0x0407) et
        tcs.temp_obc (0x0406) dans le SID 3 ; EPS_POWER_ON(line_index=5) (S8.1 func 19) seulement si la
        batterie est sous +5 °C ; EPS_POWER_ON(line_index=6) seulement si la zone OBC est sous 0 °C'
    hint:
      en: 'eps.pl_htr_bat (0x0115) / eps.pl_htr_obc (0x0116) = 1 within 5 s for each line commanded; the
        others still off. Log which lines this card energised: COM-002 reads it as its entry state'
      fr: 'eps.pl_htr_bat (0x0115) / eps.pl_htr_obc (0x0116) = 1 en 5 s pour chaque ligne commandée ;
        les autres toujours éteintes. Consigner les lignes alimentées par cette fiche : COM-002 s''en
        sert comme état d''entrée'
    step: '2'
  - id: q3
    kind: check
    text:
      en: '3. EPS / AOCS: Energise the AOCS suite line and enable its HK: EPS_POWER_ON(line_index=7) (func
        19), then HK_ENABLE(sid=2) (S3.5)'
      fr: '3. EPS / AOCS : Alimenter la ligne de la suite AOCS et activer sa HK : EPS_POWER_ON(line_index=7)
        (func 19), puis HK_ENABLE(sid=2) (S3.5)'
    hint:
      en: eps.pl_aocs_wheels (0x0117) = 1 within 5 s; SID 2 periodic within one 4 s interval; the wheels
        stay disabled until COM-004
      fr: eps.pl_aocs_wheels (0x0117) = 1 en 5 s ; SID 2 périodique en un intervalle de 4 s ; les roues
        restent désactivées jusqu'à COM-004
    step: '3'
  - id: q4
    kind: check
    text:
      en: '4. AOCS: Both DETUMBLE legs first, and the GPS receiver: S2_AOCS_MAGNETOMETER(device_id=521,
        state=1), MTQ_ENABLE(enable=1) (S8.1 func_id 9), S2_AOCS_GPS_RECEIVER(device_id=527, state=1)'
      fr: '4. AOCS : Les deux éléments de DETUMBLE d''abord, et le récepteur GPS : S2_AOCS_MAGNETOMETER(device_id=521,
        state=1), MTQ_ENABLE(enable=1) (S8.1 func_id 9), S2_AOCS_GPS_RECEIVER(device_id=527, state=1)'
    hint:
      en: aocs.mtq_enabled (0x025E) = 1 within 10 s
      fr: aocs.mtq_enabled (0x025E) = 1 en 10 s
    step: '4'
  - id: q5
    kind: check
    text:
      en: '5. AOCS: Command DETUMBLE: AOCS_SET_MODE(mode=2) (S8.1 func_id 0) — mode 2 = DETUMBLE'
      fr: '5. AOCS : Commander DETUMBLE : AOCS_SET_MODE(mode=2) (S8.1 func_id 0) — mode 2 = DETUMBLE'
    hint:
      en: S1.1 + S1.7 < 5 s; aocs.mode (0x020F) = 2; aocs.mag_enabled (0x025C) = 1; aocs.mag_field_total
        (0x0277) 5000–70000 nT; aocs.rate_roll, aocs.rate_pitch, aocs.rate_yaw (0x0204–0x0206) trending
        down within 60 s
      fr: S1.1 + S1.7 < 5 s ; aocs.mode (0x020F) = 2 ; aocs.mag_enabled (0x025C) = 1 ; aocs.mag_field_total
        (0x0277) de 5000 à 70000 nT ; aocs.rate_roll, aocs.rate_pitch, aocs.rate_yaw (0x0204–0x0206) en
        baisse en 60 s
    step: '5'
  - id: q6
    kind: check
    text:
      en: '6. EPS: Confirm the exit power state: HK_REQUEST(sid=1), GET_PARAM(param_id=0x0260) (S20.3)'
      fr: '6. EPS : Confirmer l''état d''alimentation de sortie : HK_REQUEST(sid=1), GET_PARAM(param_id=0x0260)
        (S20.3)'
    hint:
      en: eps.pl_payload (0x0113), eps.pl_fpa_cooler (0x0114), eps.pl_prop (0x014A) = 0; aocs.wheels_enabled
        (0x0260) = 0; margin positive — eps.power_gen (0x0107) above eps.power_cons (0x0106), or SoC stable
        or rising
      fr: eps.pl_payload (0x0113), eps.pl_fpa_cooler (0x0114), eps.pl_prop (0x014A) = 0 ; aocs.wheels_enabled
        (0x0260) = 0 ; marge positive — eps.power_gen (0x0107) au-dessus de eps.power_cons (0x0106), ou
        SoC stable ou en hausse
    step: '6'
  - id: q7
    kind: text
    text:
      en: Phase (0x0129)
      fr: Phase (0x0129)
  - id: q8
    kind: text
    text:
      en: Wheels enabled (aocs.wheels_enabled 0x0260)
      fr: Roues activées (aocs.wheels_enabled 0x0260)
  - id: q9
    kind: text
    text:
      en: SoC
      fr: SoC
- id: WB-5.5-L005
  title:
    en: LEOP-005 Sun Acquisition (observe, confirm each step)
    fr: LEOP-005 Acquisition du Soleil (observer, confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - LEOP-005
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. Record the initial body rates: HK_REQUEST(sid=2) (S3.27)'
      fr: '1. Consigner les vitesses angulaires initiales : HK_REQUEST(sid=2) (S3.27)'
    hint:
      en: aocs.mode (0x020F) = 2 (DETUMBLE); aocs.rate_roll (0x0204), aocs.rate_pitch (0x0205), aocs.rate_yaw
        (0x0206) recorded — 0.5 to 5.0°/s per axis is typical
      fr: aocs.mode (0x020F) = 2 (DETUMBLE) ; aocs.rate_roll (0x0204), aocs.rate_pitch (0x0205), aocs.rate_yaw
        (0x0206) consignées — 0.5 à 5.0°/s par axe est typique
    step: '1'
  - id: q2
    kind: check
    text:
      en: '2. Monitor rate damping — command nothing: HK_REQUEST(sid=2) again at T+5 min'
      fr: '2. Surveiller l''amortissement — ne rien commander : HK_REQUEST(sid=2) de nouveau à T+5 min'
    hint:
      en: all three rates decreasing (B-dot roughly halves them every 10–15 min); aocs.mag_field_total
        (0x0277) non-zero — zero means the magnetometer dropped out and B-dot is blind
      fr: les trois vitesses en baisse (la loi B-dot les divise environ par deux toutes les 10–15 min)
        ; aocs.mag_field_total (0x0277) non nul — nul signifie que le magnétomètre a décroché et que la
        loi B-dot est aveugle
    step: '2'
  - id: q3
    kind: check
    text:
      en: '3. Observe the automatic transition to COARSE_SUN: body rates below 0.5°/s for 30 s → the AOCS
        hands itself over. Send no mode command'
      fr: '3. Observer la transition automatique vers COARSE_SUN : vitesses sous 0.5°/s pendant 30 s →
        l''AOCS bascule de lui-même. N''envoyer aucune commande de mode'
    hint:
      en: aocs.mode (0x020F) = 3 (COARSE_SUN) within 1800 s of the rates falling below 0.5°/s; event "AOCS
        mode change" DETUMBLE → COARSE_SUN in the event log
      fr: aocs.mode (0x020F) = 3 (COARSE_SUN) dans les 1800 s après le passage des vitesses sous 0.5°/s
        ; événement « AOCS mode change » DETUMBLE → COARSE_SUN dans le journal des événements
    step: '3'
  - id: q4
    kind: check
    text:
      en: '4. Verify the sun hold: HK_REQUEST(sid=2) every 60 s for 5 min, GET_PARAM(param_id=0x0215)
        (S20.3)'
      fr: '4. Vérifier le maintien au Soleil : HK_REQUEST(sid=2) toutes les 60 s pendant 5 min, GET_PARAM(param_id=0x0215)
        (S20.3)'
    hint:
      en: aocs.att_error (0x0217) < 15° within 600 s; aocs.css_sun_confidence (0x0215) > 0.5; aocs.rate_roll,
        aocs.rate_pitch, aocs.rate_yaw < 0.5°/s
      fr: aocs.att_error (0x0217) < 15° en 600 s ; aocs.css_sun_confidence (0x0215) > 0.5 ; aocs.rate_roll,
        aocs.rate_pitch, aocs.rate_yaw < 0.5°/s
    step: '4'
  - id: q5
    kind: check
    text:
      en: '5. Verify power generation in the hold: HK_REQUEST(sid=1)'
      fr: '5. Vérifier la production électrique pendant le maintien : HK_REQUEST(sid=1)'
    hint:
      en: eps.power_gen (0x0107) > 40 W in sunlight — with eps.eclipse_flag (0x0108) = 1, wait for eclipse
        exit (up to 35 min) and re-check; eps.bat_soc (0x0101) stable or rising
      fr: eps.power_gen (0x0107) > 40 W au Soleil — avec eps.eclipse_flag (0x0108) = 1, attendre la sortie
        d'éclipse (jusqu'à 35 min) et contrôler de nouveau ; eps.bat_soc (0x0101) stable ou en hausse
    step: '5'
  - id: q6
    kind: check
    text:
      en: '6. Log the final AOCS state: rates, attitude error, CSS confidence, power. The spacecraft stays
        in COARSE_SUN: with no star tracker powered (COM-003) the automatic promotion cannot fire — the
        intended LEOP parking state'
      fr: '6. Consigner l''état final de l''AOCS : vitesses, erreur d''attitude, confiance CSS, puissance.
        Le satellite reste en COARSE_SUN : sans senseur stellaire alimenté (COM-003), la promotion automatique
        ne peut pas se déclencher — c''est l''état de stationnement voulu en LEOP'
    hint:
      en: Sun Acquisition Report issued
      fr: rapport d'acquisition du Soleil diffusé
    step: '6'
- id: WB-5.5-L003
  title:
    en: LEOP-003 Initial Orbit Determination and End of LEOP (confirm each step)
    fr: LEOP-003 Restitution d'orbite initiale et fin de la LEOP (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    - orbit
    procedures:
    - LEOP-003
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. Verify the GPS navigation solution: HK_REQUEST(sid=12) (S3.27)'
      fr: '1. Vérifier la solution de navigation GPS : HK_REQUEST(sid=12) (S3.27)'
    hint:
      en: aocs.gps_fix (0x0274) ≥ 2 (3D); aocs.gps_num_sats (0x0276) ≥ 4; aocs.gps_pdop (0x0275) recorded
      fr: aocs.gps_fix (0x0274) ≥ 2 (3D) ; aocs.gps_num_sats (0x0276) ≥ 4 ; aocs.gps_pdop (0x0275) consigné
    step: '1'
  - id: q2
    kind: check
    text:
      en: '2. Read the position fix: GET_PARAM(param_id=0x0210), GET_PARAM(param_id=0x0211), GET_PARAM(param_id=0x0212)
        (S20.3)'
      fr: '2. Lire le point de position : GET_PARAM(param_id=0x0210), GET_PARAM(param_id=0x0211), GET_PARAM(param_id=0x0212)
        (S20.3)'
    hint:
      en: aocs.gps_lat (0x0210) in [−90, +90]°; aocs.gps_lon (0x0211) in [−180, +180]°; aocs.gps_alt (0x0212)
        in the 495–540 km check band
      fr: aocs.gps_lat (0x0210) dans [−90, +90]° ; aocs.gps_lon (0x0211) dans [−180, +180]° ; aocs.gps_alt
        (0x0212) dans la bande de contrôle de 495–540 km
    step: '2'
  - id: q3
    kind: check
    text:
      en: '3. Read the ECEF state vector: GET_PARAM(param_id=0x0231) … GET_PARAM(param_id=0x0236)'
      fr: '3. Lire le vecteur d''état ECEF : GET_PARAM(param_id=0x0231) … GET_PARAM(param_id=0x0236)'
    hint:
      en: position magnitude 6700–6950 km; velocity magnitude 7400–7900 m/s; vector and its GPS time recorded
        for Flight Dynamics
      fr: norme de la position de 6700 à 6950 km ; norme de la vitesse de 7400 à 7900 m/s ; vecteur et
        son heure GPS consignés pour la dynamique du vol
    step: '3'
  - id: q4
    kind: check
    text:
      en: 4. Flight Dynamics comparison with the launcher-predicted orbit — nothing is uploaded to the
        spacecraft
      fr: 4. Comparaison par la dynamique du vol avec l'orbite prédite par le lanceur — rien n'est envoyé
        au satellite
    hint:
      en: i within 0.2° of 97.39°; e < 0.01; LTAN within 15 min of the mission requirement; period agrees
        with the TLE mean motion
      fr: i à 0.2° près de 97.39° ; e < 0.01 ; LTAN à 15 min près de l'exigence de mission ; période conforme
        au mouvement moyen du TLE
    step: '4'
  - id: q5
    kind: check
    text:
      en: '5. Second fix consistency check, 10 min later: HK_REQUEST(sid=12)'
      fr: '5. Contrôle de cohérence d''un second point, 10 min plus tard : HK_REQUEST(sid=12)'
    hint:
      en: aocs.gps_alt (0x0212) within 20 km of step 2; aocs.gps_fix (0x0274) still ≥ 2; the position
        moved along-track as propagated
      fr: aocs.gps_alt (0x0212) à 20 km près de l'étape 2 ; aocs.gps_fix (0x0274) toujours ≥ 2 ; la position
        a avancé le long de la trace comme prévu par la propagation
    step: '5'
  - id: q6
    kind: check
    text:
      en: 6. Distribute the Orbit Determination Report and the refined TLE to the ground network (planner,
        FDS, stations)
      fr: 6. Diffuser le rapport de restitution d'orbite et le TLE affiné au réseau sol (planificateur,
        FDS, stations)
    hint:
      en: pass predictions refreshed
      fr: prédictions de passage rafraîchies
    step: '6'
  - id: q7
    kind: check
    text:
      en: '7. FD: GO/NO-GO poll of all positions, then declare COMMISSIONING by telecommand: SYS_SET_MISSION_PHASE(phase=5,
        flags=0) (S8.1 func 120) — the only card that sends it; nothing on board advances the phase past
        4'
      fr: '7. FD : tour de table GO/NO-GO de toutes les positions, puis déclarer COMMISSIONING par télécommande
        : SYS_SET_MISSION_PHASE(phase=5, flags=0) (S8.1 func 120) — la seule fiche qui l''envoie ; rien
        à bord ne fait avancer la phase au-delà de 4'
    hint:
      en: eps.spacecraft_phase (0x0129) = 5 within 5 s; event MISSION_PHASE_CHANGED (0x0055) 4 (LEOP)
        → 5 (COMMISSIONING)
      fr: eps.spacecraft_phase (0x0129) = 5 en 5 s ; événement MISSION_PHASE_CHANGED (0x0055) 4 (LEOP)
        → 5 (COMMISSIONING)
    step: '7'
