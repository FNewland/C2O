        en: MCS › PLD › payload.cooler_margin_k (0x064B)
        fr: MCS › PLD › payload.cooler_margin_k (0x064B)
- id: WB-5.6-C011
  title:
    en: COM-011 Payload Calibration (confirm each step)
    fr: COM-011 Étalonnage de la charge utile (confirmer chaque étape)
  phase: during
  applies:
    tools:
    - mcs
    procedures:
    - COM-011
    pages: []
    scenarios: []
    context_keys: []
  questions:
  - id: q1
    kind: check
    text:
      en: '1. Pre-calibration state, cooler ON first: FPA_COOLER(on=1) (S8.1 func 43), HK_REQUEST(sid=3),
        HK_REQUEST(sid=5) (S3.27), GET_PARAM(param_id=0x060B), GET_PARAM(param_id=0x060A) (S20.3)'
      fr: '1. État avant étalonnage, refroidisseur EN MARCHE d''abord : FPA_COOLER(on=1) (S8.1 func 43),
        HK_REQUEST(sid=3), HK_REQUEST(sid=5) (S3.27), GET_PARAM(param_id=0x060B), GET_PARAM(param_id=0x060A)
        (S20.3)'
    hint:
      en: tcs.cooler_fpa (0x040C) = 1 within 10 s; payload.mode (0x0600) = 1 (STANDBY); payload.fpa_ready
