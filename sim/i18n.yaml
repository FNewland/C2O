# i18n.yaml — what `python3 -m tools.i18n` keeps in EN/FR sync (SMO suite).
# See tools/i18n/README.md. Paths are relative to this file unless absolute; ${VAR}
# uses the environment, falling back to env_defaults. Missing roots are reported, not fatal.

glossary: tools/i18n/glossary.csv
style: tools/i18n/STYLE_FR.md

translate:
  model: claude-opus-5-5          # used by `translate --stale --api`

# ---------------------------------------------------------------- Markdown
docs:
  # Procedures: FR lives OUTSIDE procedures/ because the MCS loads procedures/**/*.md recursively.
  - group: procedures
    en_glob: configs/eosat1/procedures/**/*.md
    en_root: configs/eosat1/procedures
    fr_root: configs/eosat1/i18n/fr/procedures
    # STYLE_FR §13: French step-jump prose would bypass the English _PROSE_BRANCH safety gate.
    forbid_fr:
    # Ruling Q35 (2026-10-30): « passer à l'étape N » is allowed when the card declares a
    # **BRANCH:** whose GO/NO-GO target is step N (tools/i18n/docs.py forbidden_fr_wording).
    # The apostrophe may be typographic (’) as STYLE_FR prefers.
      - "(?:passer|aller|revenir|sauter|reprendre)\\s+(?:directement\\s+)?(?:à|a|aux?)\\s+(?:l['’]\\s*|la\\s+)?[ée]tape\\s+\\d+"

  - group: manual
    en_glob: configs/eosat1/manual/*.md
    en_root: configs/eosat1/manual
    fr_root: configs/eosat1/i18n/fr/manual
    exclude:
      - configs/eosat1/manual/09_command_reference.md   # GENERATED by tools/gen_command_reference.py from the TC catalog (+ FR overlay), never hand-translated

  # Operator docs → docs/fr/
  - {group: operator-docs, en: docs/OPERATIONS_GUIDE.md, fr: docs/fr/OPERATIONS_GUIDE.md}
  - {group: operator-docs, en: docs/INSTRUCTOR_GUIDE.md, fr: docs/fr/INSTRUCTOR_GUIDE.md}
  - {group: operator-docs, en: docs/PUS_SERVICE_REFERENCE.md, fr: docs/fr/PUS_SERVICE_REFERENCE.md}
  - {group: operator-docs, en: docs/OBCP_GUIDE.md, fr: docs/fr/OBCP_GUIDE.md}
  - {group: operator-docs, en: docs/PROPULSION_GUIDE.md, fr: docs/fr/PROPULSION_GUIDE.md}
  - {group: operator-docs, en: docs/LINK_BUDGET_AND_RATES.md, fr: docs/fr/LINK_BUDGET_AND_RATES.md}
  - {group: operator-docs, en: docs/VR_INTERFACE_ICD.md, fr: docs/fr/VR_INTERFACE_ICD.md}
  - {group: operator-docs, en: docs/README.md, fr: docs/fr/README.md}

# ---------------------------------------------------------------- UI catalogs
# i18next v4 JSON, FLAT, natural-language keys (key = English text; runtime keySeparator:false,
# nsSeparator:false), {{var}} placeholders, plurals key_one/key_other (key_many optional),
# context key_<ctx>. null = untranslated. Expected keys are scanned from `sources`.
catalogs:
  - name: smo-common
    fr: packages/smo-common/src/smo_common/ui/i18n/fr.json
    sources:
      - packages/smo-common/src/smo_common/ui/*.{js,html,svg}
      # pictorial displays (generated copies of shared/ui-viz; vendor/ is not scanned)
      - packages/smo-common/src/smo_common/ui/viz/*.{js,html}
  - name: tools
    fr: packages/smo-common/src/smo_common/ui/i18n/tools/fr.json
    fallback: [smo-common]
    functions: [t, T, tText, tHtml]
    # doc_viewer.CATEGORY_LABELS: category names come from the docs folders
    # and are rendered as data-i18n="{label}", which no scanner can resolve.
    keep:
      - '^(Overview|Manual|MCS|Procedures)$'
    sources:
      - tools/*.{py,html,js}
      - packages/smo-common/src/smo_common/ui/tool-page.js
  - name: mcs
    fr: packages/smo-mcs/src/smo_mcs/static/modern/i18n/fr.json
    fallback: [smo-common]
    sources:
      - packages/smo-mcs/src/smo_mcs/static/modern/*.{js,html,svg}
  - name: planner
    fr: packages/smo-planner/src/smo_planner/static/modern/i18n/fr.json
    fallback: [smo-common]
    sources:
      - packages/smo-planner/src/smo_planner/static/modern/*.{js,html,svg}
  - name: instructor
    fr: packages/smo-simulator/src/smo_simulator/instructor/static/modern/i18n/fr.json
    fallback: [smo-common]
    sources:
      - packages/smo-simulator/src/smo_simulator/instructor/static/modern/*.{js,html,svg}
  - name: rfsim
    fr: packages/smo-rfsim/src/smo_rfsim/static/modern/i18n/fr.json
    fallback: [smo-common]
    sources:
      - packages/smo-rfsim/src/smo_rfsim/static/modern/*.{js,html,svg}

# ---------------------------------------------------------------- YAML overlay
# Spacecraft-database prose → overlay keyed kind:id:field. The source YAML is never edited.
# `i18n build` writes the client file (key → fr, translated & non-stale only).
yaml_overlay:
  base: configs/eosat1
  output: configs/eosat1/i18n/fr/db.yaml
  client_json: packages/smo-common/src/smo_common/ui/i18n/fr.db.json
  rules:
    # telemetry
    - {kind: tm, files: telemetry/parameters.yaml, items: parameters.*, id: "{name}", fields: [description]}
    - {kind: tm, files: telemetry/derived.yaml, items: derived_parameters.*, id: "{name}", fields: [description]}
    # telecommands, their arguments, enum values and bit fields; quick commands
    - {kind: tc, files: commands/tc_catalog.yaml, items: commands.*, id: "{name}", fields: [description]}
    - {kind: tcarg, files: commands/tc_catalog.yaml, items: commands.*.fields.*, id: "{^name}.{name}", fields: [description]}
    - {kind: tcenum, files: commands/tc_catalog.yaml, items: commands.*.fields.*.enum.*, id: "{^^name}.{^name}.{label|value}", fields: [description]}
    - {kind: tcbit, files: commands/tc_catalog.yaml, items: commands.*.fields.*.bits.*, id: "{^^name}.{^name}.{name|bit}", fields: [description]}
    - {kind: qc, files: commands/tc_catalog.yaml, items: quick_commands.*, id: "{name|command}", fields: [label]}
    - {kind: qcgroup, files: commands/tc_catalog.yaml, items: quick_commands.*, id: "{group}", fields: [group]}
    # events and on-board monitoring
    - {kind: evt, files: events/event_catalog.yaml, items: events.*, id: "{name}", fields: [description]}
    - {kind: s12, files: monitoring/s12_definitions.yaml, items: s12_definitions.*, id: "{param_id}.{$key}", fields: [name, description]}
    - {kind: s19, files: monitoring/s19_rules.yaml, items: s19_rules.*, id: "{name}", fields: [description]}
    # FDIR
    - {kind: fdir, files: fdir/fault_propagation.yaml, items: fault_cascades.*, id: "{fault_id}", fields: [description]}
    - {kind: fdircascade, files: fdir/fault_propagation.yaml, items: fault_cascades.*.cascades.*, id: "{^fault_id}.{target_subsystem}.{action}", fields: [description]}
    - {kind: loadshed, files: fdir/fault_propagation.yaml, items: load_shedding_stages.*, id: "{$key}", fields: [name, description]}
    - {kind: fdirlevel, files: fdir/fault_propagation.yaml, items: recovery_escalation.escalation_delays.*, id: "{$key}", fields: [description]}
    - {kind: fdirproc, files: fdir/procedures/*.yaml, items: "", id: "{procedure_id|$file}", fields: [name, description]}
    - {kind: fdirstep, files: fdir/procedures/*.yaml, items: steps.*, id: "{^procedure_id|$file}.{step_id|$key}", fields: [name, description]}
    - {kind: aocsmode, files: aocs/aocs_mode_codes.yaml, items: modes.*, id: "{name}", fields: [description]}
    - {kind: obcp, files: obcp/*.yaml, items: procedure, id: "{name}", fields: [description]}
    # procedures index (titles + per-position role strings)
    - {kind: proc, files: procedures/procedure_index.yaml, items: procedures.*, id: "{id}", fields: [name, position_roles.*, advisory_reason]}
    # MCS display configuration
    - {kind: pos, files: mcs/positions.yaml, items: positions.*, id: "{$key}", fields: [display_name, label]}
    - {kind: gonogo, files: mcs/gonogo_matrix.yaml, items: gonogo_matrix.*, id: "{who_calls}.{$key}", fields: [situation, fd_decision, reason]}
    - {kind: gate, files: mcs/display_config.yaml, items: capture_gates.*, id: "{param}.{$key}", fields: [label]}
    - {kind: baseline, files: mcs/display_config.yaml, items: health_baselines.*, id: "{$key}", fields: [label]}
    - {kind: disp, files: mcs/displays.yaml, items: "*.*", id: "{^$key}.{$key}", fields: [label]}
    - {kind: disppage, files: mcs/displays.yaml, items: "*.*.pages.*", id: "{^^$key}.{^$key}.{$key}", fields: [name]}
    - {kind: dispwidget, files: mcs/displays.yaml, items: "*.*.pages.*.widgets.*", id: "{^^^$key}.{^^$key}.{^$key}.{$key}", fields: [label]}
    - {kind: pus, files: mcs/pus_services.yaml, items: services.*, id: "{$key}", fields: [label, description]}
    - {kind: pusstore, files: mcs/pus_services.yaml, items: services.*.stores.*, id: "{^$key}.{id|$key}", fields: [name]}
    # planning
    - {kind: activity, files: planning/activity_types.yaml, items: activity_types.*, id: "{name}", fields: [description, pre_conditions.*]}
    - {kind: activitystep, files: planning/activity_types.yaml, items: activity_types.*.command_sequence.*, id: "{^name}.{$key}", fields: [description]}
    - {kind: plan, files: planning/standard_plans.yaml, items: templates.*, id: "{id}", fields: [name, description]}
    - {kind: planstep, files: planning/standard_plans.yaml, items: templates.*.activities.*, id: "{^id}.{$key}", fields: [note]}
    - {kind: target, files: planning/imaging_targets.yaml, items: imaging_targets.*, id: "{id}", fields: [name, description]}
    - {kind: station, files: planning/planner.yaml, items: stations.*, id: "{name}", fields: [notes]}
    # instructor scenarios
    - {kind: scn, files: scenarios/*.yaml, items: "", id: "{$file}", fields: [name, briefing]}
    - {kind: scnresp, files: scenarios/*.yaml, items: expected_responses.*, id: "{^$key}.{$key}", fields: [description]}
    - {kind: scnevt, files: scenarios/*.yaml, items: events.*, id: "{^$key}.{$key}", fields: [note, params.text]}
    # report templates
    - {kind: report, files: reports/*.yaml, items: report, id: "{id|$file}", fields: [title, subtitle]}
    - {kind: reportsec, files: reports/*.yaml, items: sections.*, id: "{^$key}.{id|$key}", fields: [title, text]}
    - {kind: reportaxis, files: reports/*.yaml, items: sections.*.axes.*, id: "{^^$key}.{^id}.{$key}", fields: [label]}
    # memory map
    - {kind: mem, files: memory/memory_map.yaml, items: regions.*, id: "{name}", fields: [description]}
    # scenario scoring: why a command is harmful (scenario_scoring.py)
    - {kind: scnharm, files: scenarios/*.yaml, items: harmful_commands.*, id: "{^$key}.{$key}", fields: [reason]}
    # instructor inject form: the failure catalogue's text (GENERATED from the
    # models' FAILURE_SPECS by tools/gen_failure_strings.py)
    - {kind: failsub, files: i18n/en/failure_catalog.yaml, items: subsystems.*, id: "{name}", fields: [label]}
    - {kind: fail, files: i18n/en/failure_catalog.yaml, items: subsystems.*.failures.*, id: "{^name}.{name}", fields: [label, effect, notes]}
    - {kind: failparam, files: i18n/en/failure_catalog.yaml, items: subsystems.*.failures.*.params.*, id: "{^^name}.{^name}.{name}", fields: [label, description]}
    - {kind: failval, files: i18n/en/failure_catalog.yaml, items: subsystems.*.failures.*.params.*.values.*, id: "{^^^name}.{^^name}.{^name}.{value}", fields: [label]}
