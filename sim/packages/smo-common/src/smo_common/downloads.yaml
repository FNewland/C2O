# Course PDFs offered for download (smo_common/downloads.py).
#
# One list for every server that offers them:
#   * the documentation viewer (docs.c2o.live, students)   audience student
#   * the MCS operations-manual page (students)             audience student
#   * the instructor console (behind IAP, instructors)      every entry
#
# Why here and not in configs/eosat1/: that tree is the mission config, baked
# into the image and identified by docker/config-hash.sh. Course books are not
# mission config and must not change the config hash; smo_common is installed
# in every process that serves them.
#
# Fields
#   id        stable URL id ([a-z0-9-]); the ONLY thing a request can name
#   title     {en, fr}: shown in the interface language
#   lang      en | fr: the language of the PDF itself
#   audience  student | instructor (instructor = never on a student server)
#   category  textbook | workbook | reference | guide
#   source    repository-relative path (from the C2O root)
#   size      bytes; `python3 -m smo_common.downloads sizes` refreshes it
#   pair      id of the same document in the other language (both ways)
#   licence   optional, shown beside the title
#
# Every PDF tracked in the repository is either a document below or an
# `excluded:` entry with a reason (tests/test_common/test_downloads.py), so a
# new book cannot go missing silently and a stale one cannot leak.
# Inside the image the files sit under $SMO_DOWNLOADS_DIR/<source>
# (docker/Dockerfile copies exactly the listed files).

documents:
  # ── textbooks ───────────────────────────────────────────────────────
