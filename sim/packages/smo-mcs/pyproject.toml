[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smo-mcs"
version = "0.1.0"
description = "SMO Mission Control System"
requires-python = ">=3.10"
dependencies = [
    "smo-common",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
# Voice loops (smo_mcs/voice.py): LiveKit access tokens. Pinned; without it
# /voice says "token library not installed" and the console is unaffected.
voice = ["livekit-api==1.2.2"]

[project.scripts]
smo-mcs = "smo_mcs.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/smo_mcs"]
