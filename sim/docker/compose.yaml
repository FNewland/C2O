# SMO split deployment over smo-link (docs/web_2026-10/LINK_DESIGN.md §5).
#
# Run from the simulator root (sim/ in the C2O repository):
#   export SMO_CONFIG_HASH=$(docker/config-hash.sh)
#
#   space host (laptop / cloud-sim container):
#     cp docker/space.env.example docker/space.env      # fill URL/session/secret
#     docker compose --env-file docker/space.env -f docker/compose.yaml --profile space up -d --build
#
#   ground host (cloud VM, behind the GCP load balancer — C2O deploy/gcp/README.md):
#     cp docker/ground.env.example docker/ground.env    # same session/secret
#     docker compose --env-file docker/ground.env -f docker/compose.yaml --profile ground up -d --build
#
#   --env-file matters: `env_file:` below only passes variables INTO the
#   containers. The `ports:` lines are interpolated from the shell and the
#   --env-file, so SMO_PUBLISH_ADDR written only in ground.env would be
#   ignored and every port would stay on 127.0.0.1 (unreachable by the LB).
#     ... add `--profile rf` for the RF bridge and its radio view (8094). With
#         SMO_MCS_TM_PORT/TC_PORT left at 8002/8001 it is a tap beside the
#         MCS; 8012/8011 puts the MCS behind it (S-band only: the UHF beacon
#         telemetry of LEOP then never reaches the MCS).
#
#   everything on one host (also the cloud-simulator provider):
#     cp docker/ground.env.example docker/ground.env
#     docker compose -f docker/compose.yaml --profile local-demo up -d --build
#     (the agent dials ws://gsg:9100/link on the compose network)
#
# Networking model
# - Ground processes share the GSG's network namespace (network_mode
#   service:gsg), so the MCS, planner and RF bridge reach the GSG's TM/TC/HTTP
#   on 127.0.0.1:8002/8001/8080 exactly as they reach a simulator in start.sh
#   (rfsim's upstream is fixed in rfsim.yaml). The space agent shares the
#   simulator's namespace the same way.
# - The GSG's TM/TC listeners (8002/8001) bind 127.0.0.1 inside the shared
#   namespace (only the MCS, planner and RF bridge in it can reach them) and
#   are NEVER published. Listeners that must be published bind 0.0.0.0 inside
#   their container (a published port cannot reach a loopback-only socket).
# - Ports published on the ground host: MCS 9090, planner 9091, GSG HTTP 8080
#   (instructor proxy) and link 9100. NONE of them has its own login (MCS can
#   send TCs), so they publish on SMO_PUBLISH_ADDR, which DEFAULTS TO
#   127.0.0.1 (review H4). Only on the GCP VM set SMO_PUBLISH_ADDR to the VM's
#   INTERNAL IP (via --env-file or the shell, see above), with the VPC firewall
#   admitting only the Google load-balancer ranges and IAP (C2O
#   deploy/gcp/README.md); never 0.0.0.0 on a host with a
#   public or campus address (Docker-published ports bypass ufw).
#   The welcome page (8090), the tool viewers (delayed TM 8092, orbit 8093,
#   radio 8094, docs 8095) and,
#   on the space side, the scenario generator (8096) and ADCS failure viewer
#   (8097) publish on SMO_PUBLISH_ADDR too: 127.0.0.1 on a laptop, the VM's
#   internal IP on GCP, where each sits behind its own IAP-protected host
#   (the apex for the welcome page; tm., orbit., radio., docs.; scenarios.,
#   adcs. for instructors only).

# Participant logbooks (docs/plan_2026-11/LOGBOOK_SPEC.md): every screen
# serves /api/logbook from SMO_LOGBOOK_DIR. On the ground every service
# (and SpaceCDF) mounts ground-workspace, so one person's entries from every
# tool land in one private logbook; it is deleted 48 h after their last entry
# (SMO_LOGBOOK_RETENTION_H, 7-day cap SMO_LOGBOOK_MAX_AGE_H). SpaceCDF runs as
# another uid with the smo group added, hence SMO_LOGBOOK_SHARED_GROUP.
# The space side keeps only the instructor's own logbook (space-workspace);
# smo-link never carries logbook traffic.
x-logbook-env: &logbook-env
  SMO_LOGBOOK_DIR: /opt/smo/workspace/logbook
  SMO_LOGBOOK_SHARED_GROUP: "1"

name: smo

x-image: &image
  image: smo-suite:${SMO_CONFIG_HASH:-dev}
  build:
    context: ..
    dockerfile: docker/Dockerfile
    # Course PDFs listed in smo_common/downloads.yaml (copied by one
    # Dockerfile step; only the listed files enter the image).
    additional_contexts:
      course_pdfs: ../../design/docs/pdf
    args:
      SMO_CONFIG_HASH: ${SMO_CONFIG_HASH:-unknown}
      SMO_VERSION: ${SMO_VERSION:-dev}
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]

# Healthcheck probe (python:3.13-slim has no curl).
x-probe: &probe
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 30s

x-space-env: &space-env
  env_file:
    - path: ./space.env
      required: false

x-ground-env: &ground-env
  env_file:
    - path: ./ground.env
      required: false

services:

  # ───────────────────────────── space side ─────────────────────────────
  sim:
    <<: [*image, *space-env]
    profiles: [space, local-demo]
    command: >-
      smo-simulator --config configs/eosat1/ --host 0.0.0.0 --port 8080 --ui modern
    environment:
      SMO_BIND: 0.0.0.0
      SMO_SIM_HTTP_PORT: "8080"
      SMO_VR: "0"
      # Scenarios saved by the scenario generator (below) are loaded from
      # here as well as from the built-in folder, at simulator start.
      SMO_EXTRA_SCENARIO_DIR: /opt/smo/workspace/scenarios
      # the instructor's own logbook (instructor console on this host)
      SMO_LOGBOOK_DIR: /opt/smo/workspace/logbook
    volumes:
      - space-workspace:/opt/smo/workspace
      - space-dumps:/opt/smo/workspace/dumps
    ports:
      # Instructor console of the simulator itself, host loopback only. In
      # the ground profile the same console is reached via the GSG proxy.
      - "127.0.0.1:${SMO_SIM_PUBLISH_PORT:-8180}:8080"
    healthcheck:
      <<: *probe
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8080/api/state', timeout=4); sys.exit(0)"]

  # Space-link agent (space profile): dials SMO_LINK_URL from space.env.
  agent:
    <<: [*image, *space-env]
    profiles: [space]
    command: ["smo-link-agent"]
    network_mode: "service:sim"
    depends_on:
      sim:
        condition: service_healthy
    environment:
      SMO_SIM_HOST: 127.0.0.1
      SMO_SIM_TM_PORT: "8002"
      SMO_SIM_TC_PORT: "8001"
      SMO_SIM_HTTP_PORT: "8080"
    volumes:
      - space-workspace:/opt/smo/workspace

  # Same agent for local-demo: session/secret come from ground.env (both ends
  # must share them) and the link is the compose-network GSG.
  agent-demo:
    <<: [*image, *ground-env]
    profiles: [local-demo]
    command: ["smo-link-agent"]
    network_mode: "service:sim"
    depends_on:
      sim:
        condition: service_healthy
      gsg:
        condition: service_healthy
    environment:
      SMO_LINK_URL: ws://gsg:9100/link
      SMO_SIM_HOST: 127.0.0.1
      SMO_SIM_TM_PORT: "8002"
      SMO_SIM_TC_PORT: "8001"
      SMO_SIM_HTTP_PORT: "8080"
      # The agent refuses plaintext ws:// to a hostname. Here the "network" is
      # the compose bridge on one machine, so allow it explicitly.
      SMO_LINK_ALLOW_INSECURE: "1"
    volumes:
      - space-workspace:/opt/smo/workspace

  # ───────────────────────────── ground side ────────────────────────────
  gsg:
    <<: [*image, *ground-env]
    profiles: [ground, local-demo]
    command: ["smo-link-gateway"]
    environment:
      # TM/TC on loopback: reachable only from this shared namespace.
      SMO_GSG_BIND: 127.0.0.1
      # HTTP (instructor proxy) and link listen on the container interface
      # so they can be published (on SMO_PUBLISH_ADDR, see above).
      SMO_GSG_HTTP_BIND: 0.0.0.0
      SMO_GSG_TM_PORT: "8002"
      SMO_GSG_TC_PORT: "8001"
      SMO_GSG_HTTP_PORT: "8080"
      SMO_GSG_LINK_BIND: 0.0.0.0
      SMO_GSG_LINK_PORT: "9100"
      # the GSG serves /api/logbook for the instructor console it proxies
      <<: *logbook-env
    volumes:
      - ground-workspace:/opt/smo/workspace
      - ground-dumps:/opt/smo/workspace/dumps
    # Every ground process shares this namespace, so its ports are published
    # here. Behind the GCP LB: 9090, 9091, 8080 via IAP; 9100 (/link) IAP off.
    # Default 127.0.0.1: nothing is reachable from the network until you
    # deliberately set SMO_PUBLISH_ADDR (the VM's internal IP on GCP).
    ports:
      - "${SMO_PUBLISH_ADDR:-127.0.0.1}:9090:9090"     # MCS
      - "${SMO_PUBLISH_ADDR:-127.0.0.1}:9091:9091"     # planner
      - "${SMO_PUBLISH_ADDR:-127.0.0.1}:8080:8080"     # GSG HTTP: instructor proxy, /healthz, /link-status
      - "${SMO_PUBLISH_ADDR:-127.0.0.1}:9100:9100"     # GSG link (agent only)
      - "${SMO_PUBLISH_ADDR:-127.0.0.1}:8092:8092"     # delayed-TM viewer
      - "${SMO_PUBLISH_ADDR:-127.0.0.1}:8093:8093"     # orbit tools
      - "${SMO_PUBLISH_ADDR:-127.0.0.1}:8094:8094"     # radio status (rf profile)
      - "${SMO_PUBLISH_ADDR:-127.0.0.1}:8095:8095"     # documentation viewer
      - "${SMO_PUBLISH_ADDR:-127.0.0.1}:8090:8090"     # welcome page (portal)
    healthcheck:
      <<: *probe
      # /healthz AND the TM listener: rfsim connects to TM exactly once.
      test: ["CMD", "python", "-c", "import urllib.request,socket,sys; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4); socket.create_connection(('127.0.0.1', 8002), 2).close(); sys.exit(0)"]

  mcs:
    <<: [*image, *ground-env]
    # ground.env + voice.env: the LiveKit keys for /api/voice/token
    # (vm-bootstrap.sh writes voice.env from Secret Manager; absent = no voice).
    env_file:
      - path: ./ground.env
        required: false
      - path: ./voice.env
        required: false
    profiles: [ground, local-demo]
    network_mode: "service:gsg"
    depends_on:
      gsg:
        condition: service_healthy
    # SMO_MCS_TM_PORT / SMO_MCS_TC_PORT (ground.env): 8002/8001 = the GSG,
    # 8012/8011 = through the RF bridge (rf profile).
    command:
      - sh
      - -c
      - >-
        exec smo-mcs --config configs/eosat1/ --port 9090 --host 0.0.0.0
        --connect 127.0.0.1:$${SMO_MCS_TM_PORT:-8002} --tc-port $${SMO_MCS_TC_PORT:-8001}
        --time-source $${SMO_TIME_SOURCE:-sim} --ui $${SMO_UI:-modern}
    environment:
      SMO_BIND: 0.0.0.0
      SMO_SIM_STATE_URL: http://127.0.0.1:8080/api/state
      SMO_PLANNER_URL: http://127.0.0.1:9091
      # Station receiver monitoring data (finding M1): the RF bridge's radio
      # status when the rf profile runs. Without the bridge the poll is
      # refused and the MCS uses the simulator's link-model figures instead.
      SMO_RADIO_STATUS_URL: http://127.0.0.1:8094/api/status
      <<: *logbook-env
    volumes:
      - ground-workspace:/opt/smo/workspace
      - ground-dumps:/opt/smo/workspace/dumps
      - ground-archive:/var/lib/smo/archive
    healthcheck:
      <<: *probe
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:9090/', timeout=4); sys.exit(0)"]

  planner:
    <<: [*image, *ground-env]
    profiles: [ground, local-demo]
    network_mode: "service:gsg"
    depends_on:
      gsg:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        exec smo-planner --config configs/eosat1/ --port 9091 --host 0.0.0.0
        --connect-host 127.0.0.1 --time-source $${SMO_TIME_SOURCE:-sim} --ui $${SMO_UI:-modern}
    environment:
      SMO_BIND: 0.0.0.0
      SMO_SIM_STATE_URL: http://127.0.0.1:8080/api/state
      SMO_MCS_URL: http://127.0.0.1:9090
      <<: *logbook-env
    volumes:
      - ground-workspace:/opt/smo/workspace
    healthcheck:
      <<: *probe
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:9091/api/schedule', timeout=4); sys.exit(0)"]

  # RF bridge: only with `--profile rf` (plus ground or local-demo). Started
  # after the GSG is healthy, i.e. after its TM port is open (rfsim never
  # reconnects TM). Upstream comes from configs/eosat1/rfsim.yaml (127.0.0.1).
  rfsim:
    <<: [*image, *ground-env]
    profiles: [rf]
    network_mode: "service:gsg"
    depends_on:
      gsg:
        condition: service_healthy
    command:
      - sh
      - -c
      - exec smo-rfsim --config configs/eosat1/rfsim.yaml --mode $${SMO_RF_MODE:-FRAME} --radio-web
    environment:
      <<: *logbook-env
    volumes:
      - ground-workspace:/opt/smo/workspace

  dtm-viewer:
    <<: [*image, *ground-env]
    profiles: [ground, local-demo]
    network_mode: "service:gsg"
    depends_on:
      gsg:
        condition: service_healthy
    command: ["python", "tools/delayed_tm_viewer.py", "--port", "8092", "--dumps", "/opt/smo/workspace/dumps", "--public"]
    environment:
      <<: *logbook-env
    volumes:
      - ground-workspace:/opt/smo/workspace
      - ground-dumps:/opt/smo/workspace/dumps

  orbit-tools:
    <<: [*image, *ground-env]
    profiles: [ground, local-demo]
    network_mode: "service:gsg"
    depends_on:
      gsg:
        condition: service_started
    command: ["python", "tools/orbit_tools.py", "--serve", "--port", "8093"]
    environment:
      # Default epoch = sim time, the clock the MCS and planner show.
      SMO_SIM_STATE_URL: http://127.0.0.1:8080/api/state
      <<: *logbook-env
    volumes:
      - ground-workspace:/opt/smo/workspace      # logbook only

  doc-viewer:
    <<: [*image, *ground-env]
    profiles: [ground, local-demo]
    network_mode: "service:gsg"
    depends_on:
      gsg:
        condition: service_started
    command: ["python", "tools/doc_viewer.py", "--port", "8095", "--docs", "configs/eosat1"]
    environment:
      <<: *logbook-env
    volumes:
      - ground-workspace:/opt/smo/workspace      # logbook only

  # Welcome page (https://<domain> on GCP): every screen with a live status.
  # It probes the ground services on 127.0.0.1 (this namespace), SpaceCDF
  # and, in local-demo, the instructor tools by service name; on GCP the
  # instructor tools on the sim VM (SMO_PORTAL_SIM_HOST, default 10.20.0.11
  # once SMO_PORTAL_DOMAIN is set). SMO_PORTAL_DOMAIN (ground.env) switches
  # the links from http://<host>:<port> to https://<name>.<domain>.
  portal:
    <<: [*image, *ground-env]
    profiles: [ground, local-demo]
    network_mode: "service:gsg"
    depends_on:
      gsg:
        condition: service_started
    command: ["python", "tools/portal.py", "--host", "0.0.0.0", "--port", "8090"]
    environment:
      SMO_PORTAL_PROBE: ${SMO_PORTAL_PROBE:-design=spacecdf:8000,scenarios=scenario-gen:8096,adcs=adcs-viewer:8097}
      <<: *logbook-env
    volumes:
      - ground-workspace:/opt/smo/workspace      # logbook only
    healthcheck:
      <<: *probe
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=4); sys.exit(0)"]

  # Instructor tools next to the simulator (space profile). The scenario
  # generator saves into the space workspace volume, which the simulator
  # loads at start (SMO_EXTRA_SCENARIO_DIR above): restart the sim to see a
  # new scenario. Published on SMO_PUBLISH_ADDR (loopback on a laptop).
  scenario-gen:
    <<: [*image, *space-env]
    profiles: [space, local-demo]
    command: ["python", "tools/scenario_generator.py", "--host", "0.0.0.0", "--port", "8096"]
    environment:
      SMO_SCENARIO_DIR: /opt/smo/workspace/scenarios
    volumes:
      - space-workspace:/opt/smo/workspace
    ports:
      - "${SMO_PUBLISH_ADDR:-127.0.0.1}:8096:8096"

  adcs-viewer:
    <<: [*image, *space-env]
    profiles: [space, local-demo]
    command: ["python", "tools/adcs_sim_viewer.py", "--public", "--port", "8097"]
    environment:
      MPLCONFIGDIR: /tmp/matplotlib
    ports:
      - "${SMO_PUBLISH_ADDR:-127.0.0.1}:8097:8097"

  # SpaceCDF, the design tool (profile "design"; on GCP the ground VM runs it
  # for https://design.<domain>). Its own image, built from ../../design.
  # ANTHROPIC_API_KEY (optional, for the AI advisor) comes from design.env,
  # which vm-bootstrap.sh writes from Secret Manager; without it SpaceCDF
  # runs in manual mode.
  spacecdf:
    image: spacecdf-web:${SMO_CONFIG_HASH:-dev}
    build:
      context: ../../design
      dockerfile: Dockerfile.web
    profiles: [design]
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    env_file:
      - path: ./design.env
        required: false
    # The participant logbook is shared with the SMO screens (one logbook per
    # person): the ground workspace is mounted for workspace/logbook only.
    # SpaceCDF's uid (10002) joins the smo group (10001) to write there.
    group_add: ["10001"]
    environment:
      <<: *logbook-env
    volumes:
      - spacecdf-data:/data
      - ground-workspace:/opt/smo/workspace
    ports:
      - "${SMO_PUBLISH_ADDR:-127.0.0.1}:8000:8000"

  # Voice loops on a laptop (profile "voice"): LiveKit in dev mode, loopback
  # only. The MCS mints tokens for it with SMO_VOICE=dev (ground.env, or the
  # environment of sim/start.sh); the browser connects to ws://localhost:7880.
  #   docker compose -f docker/compose.yaml --profile voice up -d livekit
  # Signal 7880/tcp, ICE 7881/tcp and 7882/udp (dev mode multiplexes all UDP
  # on one port). --node-ip 127.0.0.1: the only address a laptop browser can
  # reach the container on through the published ports. Never on a VM: the
  # cloud voice server is deploy/gcp/voice-bootstrap.sh.
  livekit:
    image: livekit/livekit-server:v1.13.10@sha256:89ca9ce0791e18d6e03bf6e2c49ceb27e1c754eae8bd50c989386c1a5963791a
    profiles: [voice]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    command:
      - --dev
      - --bind
      - 0.0.0.0
      - --node-ip
      - 127.0.0.1
      - --keys
      - "c2odev: c2o-local-development-secret-not-for-production"
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"

volumes:
  spacecdf-data:       # SpaceCDF database and analysis runs
  space-workspace:     # sim breakpoints / config history, agent link state (dumps_acked.json), instructor logbook
  space-dumps:         # S15 dumps written by the simulator, shipped by the agent
  ground-workspace:    # reports, rfsim pass roll-ups, participant logbooks (logbook/)
  ground-dumps:        # dumps received by the GSG; read by MCS /dumps and the viewer
  ground-archive:      # MCS SQLite TM archive (SMO_TM_ARCHIVE)
