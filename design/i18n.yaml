# i18n.yaml — what `python3 -m tools.i18n` keeps in EN/FR sync (SpaceCDF + course materials).
# tools/i18n/ is a pinned copy of the canonical SMO package (SpaceMissionSimulation/tools/i18n).
# Paths are relative to this file unless absolute; ${VAR} uses the environment, falling back
# to env_defaults. Missing roots (e.g. Drive not mounted) are reported, not fatal.

env_defaults:
  # Course books: the repository copies (docs/course, FR in docs/course/fr) are the source of
  # truth since 2026-10-30 (copied from Drive). Set DRIVE_COURSE to check another copy instead.
  DRIVE_COURSE: "docs/course"

glossary: tools/i18n/glossary.csv
style: tools/i18n/STYLE_FR.md

translate:
  model: claude-opus-5-5          # used by `translate --stale --api`

# ---------------------------------------------------------------- Markdown
docs:
  # Facilitator book, ops book, learner/ops workbooks, instructor book, back cover
  - {group: course-books, en: "${DRIVE_COURSE}/facilitator_book_expanded.md", fr: "${DRIVE_COURSE}/fr/facilitator_book_expanded.md"}
  - {group: course-books, en: "${DRIVE_COURSE}/orbit_north_week3.md", fr: "${DRIVE_COURSE}/fr/orbit_north_week3.md"}
  - {group: course-books, en: "${DRIVE_COURSE}/learner_workbook_expanded.md", fr: "${DRIVE_COURSE}/fr/learner_workbook_expanded.md"}
  - {group: course-books, en: "${DRIVE_COURSE}/orbit_north_week3_workbook.md", fr: "${DRIVE_COURSE}/fr/orbit_north_week3_workbook.md"}
  - {group: course-books, en: "${DRIVE_COURSE}/instructor_book.md", fr: "${DRIVE_COURSE}/fr/instructor_book.md"}
  - {group: course-books, en: "${DRIVE_COURSE}/back_cover.md", fr: "${DRIVE_COURSE}/fr/back_cover.md"}

  # OER "Concurrent Spacecraft Design" — FR built with build_oer.py --lang fr
  - group: oer
    en_glob: docs/oer/chapters/*.md
    en_root: docs/oer/chapters
    fr_root: docs/oer/fr/chapters

  # ORBIT NORTH week-3 pack
  - group: week3
    en_glob: docs/orbit_north/week3/*.md
    en_root: docs/orbit_north/week3
    fr_root: docs/orbit_north/week3/fr

  # SpaceCDF docs → sibling fr/ dirs
  - {group: cdf-docs, en: docs/USER_GUIDE.md, fr: docs/fr/USER_GUIDE.md}
  - {group: cdf-docs, en: docs/user_guide_expanded.md, fr: docs/fr/user_guide_expanded.md}
  - {group: cdf-docs, en: docs/INSTALLATION_GUIDE.md, fr: docs/fr/INSTALLATION_GUIDE.md}
  - {group: cdf-docs, en: docs/RULES_AND_AI.md, fr: docs/fr/RULES_AND_AI.md}
  - {group: cdf-docs, en: docs/course/COURSE_PLAN.md, fr: docs/course/fr/COURSE_PLAN.md}
  - {group: cdf-docs, en: docs/course/course_plan_expanded.md, fr: docs/course/fr/course_plan_expanded.md}
  - {group: cdf-docs, en: docs/course/3_WEEK_SYLLABUS.md, fr: docs/course/fr/3_WEEK_SYLLABUS.md}
  - {group: cdf-docs, en: docs/course/3_week_syllabus_expanded.md, fr: docs/course/fr/3_week_syllabus_expanded.md}
  # Not tracked here: docs/course/facilitator_book_expanded.md and learner_workbook_expanded.md are
  # older copies of the Drive books (tracked above); docs/course/{facilitator,learner}/ are fragments;
  # *.math.md are generated by _render_math.py; API docs are developer-facing.

  # Pre-existing hand-made bilingual pairs (HOUSE French, not 1:1 mirrors): parity findings warn only.
  - {group: orbit-north-legacy, en: docs/orbit_north/syllabus_en.md, fr: docs/orbit_north/syllabus_fr.md, legacy: true}
  - {group: orbit-north-legacy, en: docs/orbit_north/recruitment_en.md, fr: docs/orbit_north/recruitment_fr.md, legacy: true}

# ---------------------------------------------------------------- UI catalog
# react-i18next, FLAT i18next-v4 JSON, natural-language keys (key = English text; keySeparator and
# nsSeparator off), {{var}}, plurals key_one/key_other (key_many optional; EN singular via
# defaultValue_one), context key_<ctx>, <Trans i18nKey="… <1>…</1> …">. "" or null = untranslated.
# fr.json (C0) plus the per-packet fr.c1–c4.json and fr.u1.json are merged at load time and checked as one catalog.
catalogs:
  - name: spacecdf
    fr:
      - frontend/src/i18n/locales/fr.json
      - frontend/src/i18n/locales/fr.c*.json
      - frontend/src/i18n/locales/fr.u*.json
    en: frontend/src/i18n/locales/en.json
    functions: [t]
    sources:
      - frontend/src/**/*.{ts,tsx}
