[project]
name = "spacecdf-server"
version = "2.0.0"
description = "FastAPI server for SpaceCDF concurrent design sessions"
requires-python = ">=3.11"
dependencies = [
    "spacecdf-common",
    "spacecdf-agents",
    "spacecdf-kb",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "simpleeval>=1.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
]

[project.optional-dependencies]
ai = ["spacecdf-ai"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spacecdf_server"]
