# On-Board Computer (OBC) Knowledge Base
# Flight computers for CubeSat and small satellite platforms
# Sources: manufacturer datasheets, cubesatshop.com

components:
  - id: obc-gom-nanomind-a3200
    name: NanoMind A3200
    manufacturer: GomSpace
    category: obc
    mass_kg: 0.024              # 24 g (datasheet)
    dimensions_mm: [65, 40, 7.1]
    form_factor: GomSpace 65x40 module   # mounts in a P60 dock slot (X3) or a NanoDock (PC/104)
    cost_keur: 12
    trl: 9
    heritage_missions: [GOMX-1, GOMX-3, OPS-SAT]
    performance:
      lead_time_weeks: [8, 18]      # research brief 8-18 weeks (not verified)
      export_control: {eccn: not listed (verify with vendor), origin: DK}
      processor: Atmel AT32UC3C (AVR32) with FPU
      clock_mhz: 64            # 8-64 MHz
      ram_mb: 32               # SDRAM
      flash_mb: 128            # NOR; plus 512 kB internal flash and 32 kB FRAM
      storage_gb: 0
      os: FreeRTOS
      onboard_sensors: [MPU-3300 gyro, HMC5843 magnetometer]
    power_w: 0.15             # 45 mA at 3.3 V typical, running ADCS at 32 MHz
    interfaces: [I2C, SPI, UART, CAN, PC/104, PPS input, PWM (3x magnetorquer drivers)]
    operating_temp_c: [-30, 85]
    notes: >-
      Proven CubeSat OBC, over 100 missions flown. Corrected from the 2025 datasheet (C2O equipment
      research 2026-11, bus): 65x40 mm module that needs a dock (P60 dock slot X3 or NanoDock);
      on-board gyro and magnetometer, three PWM magnetorquer drivers
    sources:
      - https://gomspace.com/wp-content/uploads/2025/09/gs-ds-nanomind-a3200_1006901-2.0.pdf

