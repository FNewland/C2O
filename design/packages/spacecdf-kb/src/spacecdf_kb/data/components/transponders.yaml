  # C2O equipment research 2026-11 (bus): sources per entry; '(est.)' in notes = estimated
  - id: txr-aac-spacequest-trx-u
    name: TRX-U UHF Transceiver
    manufacturer: AAC Clyde Space (SpaceQuest)
    category: transponder
    mass_kg: 0.125
    dimensions_mm: [83, 57, 16]
    cost_keur: 15          # (est.) not published
    trl: 9
    heritage_missions: [multiple SpaceQuest/AAC missions (unnamed in datasheet)]
    performance:
      frequency_mhz: 401.5     # 401-402 MHz downlink setting; tunable
      band: UHF
      tx_frequency_mhz: [370, 470]
      rx_frequency_mhz: [370, 470]
      channels: 20             # programmable, 1 kHz steps
      data_rate_bps: 19200
      tx_power_dbm: 37         # 5 W max (0.25-5 W adjustable)
      modulation: [FSK, GFSK]
      rx_power_w: 0.23
      encryption: none_stated
    power_w: 8.0             # TX, >5 W RF at 6 V input
    interfaces: [UART]        # (est.) interface not given on datasheet page
    operating_temp_c: [-35, 80]
    notes: Covers both 401/450 MHz bands (401-402 MHz TX, 449.75-450.25 MHz RX) on paper, but max 19.2 kbps (38.4 kbps targets need another unit). satsearch survey lists 390-450 MHz; AAC datasheet says 370-470 MHz (used here). Interface and cost (est.).
    sources:
      - https://www.aac-clyde.space/wp-content/uploads/2021/11/TRX-U-datasheet.pdf
      - https://blog.satsearch.co/2020-12-16-satellite-uhf-and-vhf-transceivers-and-transmitters

