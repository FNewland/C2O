  - id: bat-gom-nanopow-bp4
    name: NanoPower BP4
    manufacturer: GomSpace
    category: battery
    chemistry: Li-ion (18650)
    mass_kg: 0.258
    dimensions_mm: [94, 84, 23]
    cost_keur: 8
    trl: 9
    heritage_missions: [GOMX-3, GOMX-4, numerous CubeSats]
    performance:
      capacity_wh: 43.0          # both 2P-2S and 1P-4S
      specific_energy_wh_kg: 149
      cycle_life: 5000
      voltage_v: {nominal: 14.4, min: 12.0, max: 16.8}   # 1P-4S; 2P-2S is 6.0-8.4 V
      operating_temp_c: [-20, 50]
      configurations_v: {1P-4S: [12.0, 16.8], 2P-2S: [6.0, 8.4]}
      heater_w: 6               # 7 W max
    interfaces: [I2C]
    notes: >-
      4S1P configuration, ISS-approved ground breaker. Datasheet (NFI research 2026-11-10
      (bus.md)): 43 Wh in both configurations; heater 6 W typical, 7 W max; mass kept at 258 g
      (features list says 270 g)
    sources:
      - https://gomspace.com/UserFiles/Subsystems/datasheet/gs-ds-nanopower-bp4_(DS_-_1013024_-_1_-_31)_-_1.pdf

