  - id: sp-exa-dmsa-3u-a
    name: DMSA 3U/A Deployable Multifunction Solar Array
    manufacturer: EXA (Ecuadorian Space Agency)
    category: solar_panel
    mass_kg: 0.250                  # (est.) per wing; no 3U mass published
    dimensions_mm: [340, 98, 6.25]  # (est.) length/width; 6.25 mm folded thickness is published
    cost_keur: 13.6                 # (est.) published list range EUR 4.4-45k
    trl: 9                          # "TRL 9 since 2013, 40+ missions" (vendor)
    heritage_missions: []
    performance:
      lead_time_weeks: [6, 16]      # research brief 6-16 weeks (not verified)
      export_control: {eccn: not listed (verify with vendor), origin: EC}
      power_bol_w: null             # 3U figure not published; 1U >=3.75 W (low-cost) to >=12 W (3G30)
      power_eol_w: null
      cell_type: triple_junction_gaas   # AzurSpace 3G30 option (or low-cost Si)
      cell_efficiency_percent: 30       # (est.) 3G30 class
      area_m2: null
      deployment: deployable_multi_panel
      embedded_antennas: VHF to L-band, 2 monopoles or 1 dipole
      embedded_magnetorquer: true
    operating_temp_c: [-80, 130]
    notes: "Candidate 3U deployable array. Spring hinges with \"artificial muscle\" release within 5 s. Panels 1.5 mm thick. Mass, envelope and power (est./unknown): request the 3U datasheet."
    sources:
      - https://satsearch.co/products/exa-dmsa-3u-a-deployable-multifunction-solar-array
      - https://www.satnow.com/products/solar-panels/ecuadorian-space-agency/102-1595-dmsa-deployable-multifunction-solar-array
      - https://www.cubesatshop.com/?p=1359

