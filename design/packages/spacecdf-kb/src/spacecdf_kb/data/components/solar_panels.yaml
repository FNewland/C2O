  # C2O equipment research 2026-11 (bus): sources per entry; '(est.)' in notes = estimated
  - id: sp-endurosat-3u-body
    name: 3U Solar Panel (body-mounted)
    manufacturer: Endurosat
    category: solar_panel
    mass_kg: 0.147
    dimensions_mm: [326, 82, 2]     # (est.) 3U long-face panel envelope
    cost_keur: 5.9                  # USD 6,900 list
    trl: 9
    heritage_missions: []
    performance:
      power_bol_w: 8.4
      power_eol_w: 8.1              # (est.) from 30% BOL / 29% EOL cell efficiency
      cell_type: triple_junction_gaas
      cell_efficiency_percent: 30
      area_m2: 0.021                # (est.) 7 cells
      deployment: body_mounted
    notes: 7 TJ cells, 16.8-17.5 V, <=512 mA; up to 3 photodiodes plus temperature and sun sensors; optional magnetorquer connector. Lead time 1 week (listing). Dimensions, area and EOL (est.).
    sources:
      - https://www.endurosat.com/products/3u-solar-panel/
      - https://satsearch.co/products/endurosat-3u-cubesat-solar-panel

