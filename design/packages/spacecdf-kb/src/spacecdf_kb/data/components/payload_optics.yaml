# Payload optics: lenses and bandpass filters (category payload_optic, KB schema v2)
# Passive parts that mount on a camera (C-mount / filter thread); they add mass and cost to
# the payload but no power. performance: focal_length_mm, f_number_range, format,
# wavelength_nm, filter_thread; filters: center_nm, fwhm_nm, diameter_mm,
# transmission_min, blocking_od, blocking_range_nm.
# NFI research 2026-11-10 (nfi/research/payload.md). Every entry lists its `sources:`;
# `estimated:` lists the fields that are estimates. cost_keur conversions: 1 CAD = 0.66 EUR,
# 1 USD = 0.92 EUR, 1 GBP = 1.17 EUR, 1 TWD = 0.029 EUR (assumed rates).

components:
  - id: opt-kowa-lm35hc-sw
    name: LM35HC-SW 35 mm SWIR lens
    manufacturer: Kowa
    category: payload_optic
    mass_kg: 0.130
    dimensions_mm: [43, 43, 43]
    cost_keur: 2.5           # (est.) quote only
    trl: 4
    power_w: 0
    interfaces: [C-mount]
    operating_temp_c: [-10, 50]
    performance:
      focal_length_mm: 35
      f_number_range: [1.4, 16]
      format: 1 inch
      wavelength_nm: [1000, 2000]
      filter_thread: M35.5x0.5
    estimated: [cost_keur]
    notes: >-
      Recommended NFI SWIR lens; it covers the 11.4 mm IMX992 diagonal with margin. It has a
      manual iris and focus that must be staked and vented for vacuum. The 865 nm band is out of
      its design range.
    sources:
      - https://aegis-elec.com/kowa-lm35hc-sw-2-3-35-mm.html

