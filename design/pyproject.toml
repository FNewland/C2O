[project]
name = "spacecdf"
version = "0.1.0"
description = "AI-Supported Concurrent Design Facility for Space Missions"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"

# Test tooling (docs/TESTING.md). Install with `pip install --group dev`
# (pip >= 25.1) after the four packages install.sh installs; CI does this.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
skip-excluded-dirs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    # tests/test_level_workbench.py when SPACECDF_BASE_URL points it at a
    # running server; by default it runs in-process and is not marked.
    "live_server: runs against a live SpaceCDF server (SPACECDF_BASE_URL)",
]
