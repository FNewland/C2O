  - [{en: "Commissioning: checkout to first light", fr: "Mise en service : vérifications jusqu'à la première lumière"}, {en: "1–4 weeks", fr: "1 à 4 semaines"}, "COM-001 … 013"]
  - [{en: "Nominal operations", fr: "Exploitation nominale"}, {en: "Mission life", fr: "Durée de la mission"}, "NOM-001 … 014"]
  - [{en: "Contingency · emergency", fr: "Contingence · urgence"}, {en: "Any time", fr: "À tout moment"}, "CTG-… · EMG-…"]
- kind: table
  k: {en: "Passes", fr: "Passages"}
  h: {en: "The rhythm of a pass", fr: "Le rythme d'un passage"}
  header: [{en: "When", fr: "Quand"}, {en: "What", fr: "Quoi"}, {en: "Lead", fr: "Responsable"}]
  rows:
  - [{en: "AOS − 30 to − 15 min", fr: "AOS − 30 à − 15 min"}, {en: "Pre-pass briefing, plan and ticket review", fr: "Briefing avant passage, revue du plan et des fiches"}, "FD"]
  - [{en: "AOS − 10 to − 5 min", fr: "AOS − 10 à − 5 min"}, {en: "Station ready, antenna pre-positioned", fr: "Station prête, antenne prépositionnée"}, {en: "Ground", fr: "Sol"}]
  - ["AOS", {en: "Carrier lock; link status 2 = LOCKED (1 is only acquiring)", fr: "Accrochage de la porteuse ; état de liaison 2 = LOCKED (1 n'est qu'en acquisition)"}, "TT&C"]
  - [{en: "AOS + 1 min", fr: "AOS + 1 min"}, {en: "Connection test, health check, FDIR sweep", fr: "Test de connexion, bilan de santé, revue FDIR"}, "SPACON"]
  - [{en: "Mid-pass", fr: "En cours de passage"}, {en: "Planned activities: imaging, downlink", fr: "Activités planifiées : imagerie, vidage"}, {en: "Per plan", fr: "Selon le plan"}]
  - [{en: "LOS − 2 min to LOS + 15", fr: "LOS − 2 min à LOS + 15"}, {en: "Pre-LOS check, close-out, hot-wash debrief", fr: "Vérification avant LOS, clôture, débriefing à chaud"}, "SPACON · FD"]
- kind: statement
  k: {en: "Passes are short", fr: "Les passages sont courts"}
  text: {en: "About 7.5 minutes on average, nine at best.", fr: "Environ 7,5 minutes en moyenne, neuf au mieux."}
  sub: {en: "Five polar stations (Iqaluit, Inuvik, Svalbard, Troll, O'Higgins) give contact on most orbits. The plan is made before the pass; during the pass you execute it and respond to anomalies.", fr: "Cinq stations polaires (Iqaluit, Inuvik, Svalbard, Troll, O'Higgins) assurent un contact sur la plupart des orbites. Le plan se fait avant le passage ; pendant le passage, on l'exécute et on répond aux anomalies."}
- kind: table
  k: {en: "Packets and services", fr: "Paquets et services"}
  h: {en: "The PUS services you will meet most", fr: "Les services PUS que vous rencontrerez le plus"}
  header: [{en: "Service", fr: "Service"}, {en: "Purpose", fr: "Rôle"}, {en: "You see it as", fr: "Vous le voyez comme"}]
  rows:
  - [S1, {en: "Telecommand verification", fr: "Vérification des télécommandes"}, {en: "The acceptance and execution reports for every command", fr: "Les rapports d'acceptation et d'exécution de chaque commande"}]
  - [S3, {en: "Housekeeping", fr: "Données de servitude"}, {en: "HK packets TM(3,25), one structure ID per subsystem", fr: "Paquets HK TM(3,25), un identifiant de structure par sous-système"}]
  - [S5, {en: "Event reporting", fr: "Rapports d'événements"}, {en: "Events, whose subtype is the severity", fr: "Des événements, dont le sous-type est la gravité"}]
  - [S8, {en: "Function management", fr: "Gestion des fonctions"}, {en: "Most commands: a function ID with arguments", fr: "La plupart des commandes : un identifiant de fonction avec arguments"}]
  - [S12 · S19, {en: "Monitoring · event-action", fr: "Surveillance · événement-action"}, {en: "On-board limit checks and the autonomous FDIR rules", fr: "Contrôles de limites à bord et règles FDIR autonomes"}]
  - [S15 · S13, {en: "Storage · large data", fr: "Stockage · gros volumes"}, {en: "Packet stores and image downlink", fr: "Mémoires de paquets et vidage d'images"}]
- kind: steps
  k: {en: "A telecommand's life", fr: "La vie d'une télécommande"}
  h: {en: "Accepted is not done", fr: "Acceptée n'est pas terminée"}
  items:
  - {en: "**Built and sent** from the MCS; the ground sees it leave", fr: "**Construite et envoyée** depuis le MCS ; le sol la voit partir"}
  - {en: "**Accepted** on board: TM(1,1). The packet was valid; nothing has happened yet", fr: "**Acceptée** à bord : TM(1,1). Le paquet était valide ; rien ne s'est encore passé"}
  - {en: "**Executed**: TM(1,7). The function ran to completion; a failure is TM(1,8)", fr: "**Exécutée** : TM(1,7). La fonction s'est déroulée jusqu'au bout ; un échec donne TM(1,8)"}
  - {en: "**Verified in telemetry**: the parameter you meant to change has changed. Only now is it done", fr: "**Vérifiée en télémesure** : le paramètre visé a bien changé. Ce n'est qu'alors que c'est terminé"}
- kind: cards
  k: {en: "Your tools this week", fr: "Vos outils cette semaine"}
  h: {en: "Three web applications", fr: "Trois applications web"}
  cards:
  - {t: {en: "Mission control system", fr: "Système de contrôle de mission"}, d: {en: "One console per position: telemetry mosaic, commanding, procedures, FDIR panel", fr: "Une console par poste : mosaïque de télémesure, commande, procédures, panneau FDIR"}}
  - {t: {en: "Mission planning system", fr: "Système de planification de mission"}, d: {en: "Contact schedule, imaging targets, activity sequence and conflict check", fr: "Calendrier des contacts, cibles d'imagerie, séquence d'activités et contrôle des conflits"}}
  - {t: {en: "Procedure cards", fr: "Fiches de procédure"}, d: {en: "Every action you take comes from a card, step by step, with an FD GO", fr: "Chaque action provient d'une fiche, pas à pas, avec le GO du directeur de vol"}}
