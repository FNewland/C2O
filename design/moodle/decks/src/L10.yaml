  k: {en: "Operational life", fr: "Vie opérationnelle"}
  h: {en: "Phases, and the procedures for each", fr: "Les phases, et les procédures de chacune"}
  header: [{en: "Phase", fr: "Phase"}, {en: "Duration", fr: "Durée"}, {en: "Procedures", fr: "Procédures"}]
  rows:
