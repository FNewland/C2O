slot: {en: "Week 3 · Day 1", fr: "Semaine 3 · Jour 1"}
title: {en: "From design to operations: the ground segment and the mission control system", fr: "De la conception à l'exploitation : le segment sol et le système de contrôle de mission"}
subtitle: {en: "EOSAT-1, mission phases, passes, packets and services, and how a telecommand lives and dies", fr: "EOSAT-1, phases de mission, passages, paquets et services, et la vie d'une télécommande"}
slides:
- kind: objectives
  k: {en: "By the end of today", fr: "À la fin de la journée"}
  h: {en: "You will be able to", fr: "Vous saurez"}
  items:
  - {en: "Describe EOSAT-1 and the phases of its operational life", fr: "Décrire EOSAT-1 et les phases de sa vie opérationnelle"}
  - {en: "Lay out a pass from briefing to debrief", fr: "Dérouler un passage, du briefing au débriefing"}
  - {en: "Read a housekeeping packet and name the PUS services you will use", fr: "Lire un paquet de servitude et nommer les services PUS que vous utiliserez"}
  - {en: "Follow a telecommand through its verification stages", fr: "Suivre une télécommande à travers ses étapes de vérification"}
  - {en: "Plan a pass in the mission planning system", fr: "Planifier un passage dans le système de planification de mission"}
- kind: table
  k: {en: "What we are flying", fr: "Ce que nous pilotons"}
  h: {en: "EOSAT-1 at a glance", fr: "EOSAT-1 en bref"}
  header: [{en: "Item", fr: "Élément"}, {en: "Value", fr: "Valeur"}]
  rows:
  - [{en: "Mission", fr: "Mission"}, {en: "Ocean-current monitoring along Canadian coasts; four-band imager (443, 560, 665, 865 nm)", fr: "Suivi des courants océaniques le long des côtes canadiennes ; imageur à quatre bandes (443, 560, 665, 865 nm)"}]
  - [{en: "Orbit", fr: "Orbite"}, {en: "Sun-synchronous, 513 km, 97.39°, ascending node at 10:00 local time; eclipse every orbit", fr: "Héliosynchrone, 513 km, 97,39°, nœud ascendant à 10 h heure locale ; éclipse à chaque orbite"}]
  - [{en: "Platform", fr: "Plateforme"}, {en: "6U CubeSat, 12.0 kg dry; 100 Wh Li-ion battery; two deployable wings", fr: "CubeSat 6U, 12,0 kg à sec ; batterie Li-ion de 100 Wh ; deux ailes déployables"}]
  - [{en: "Radios", fr: "Radios"}, {en: "S-band prime chain for commands and telemetry; a separate UHF beacon", fr: "Chaîne principale en bande S pour commandes et télémesure ; une balise UHF distincte"}]
  - [{en: "Attitude", fr: "Attitude"}, {en: "Four-wheel pyramid, two star trackers, three gyros, magnetometer, sun sensors, magnetorquers", fr: "Pyramide de quatre roues, deux viseurs d'étoiles, trois gyromètres, magnétomètre, capteurs solaires, magnétocoupleurs"}]
