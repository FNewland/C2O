- id: IF-SG-01
  v1_id: IF-SG-01
  level: interface
  tool_level: interface
  category: interface
  subsystem: Northern Fire and Ice
  type: interface
  text: Space-to-ground data shall use CCSDS TM and TC space data link protocols with SDLS security, CCSDS space packets carrying
    PUS-C services, and file delivery with acknowledged retransmission of missing segments for payload products.
  rationale: Standard stack shared by the MCS and the simulator; CSP may still run on the internal CAN bus. File retransmission
    recovers frames lost at low elevation.
