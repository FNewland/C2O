  category: budgets
  subsystem: Northern Fire and Ice spacecraft
  type: performance
  text: At PDR the nominal mass plus equipment maturity margins (5 % off-the-shelf, 10 % modified or with a value estimated
    without a supplier datasheet, 20 % new) plus a 20 % system margin applied to that margined mass shall not exceed 6.0 kg.
  rationale: 'ECSS / ESA margin philosophy. v2 classes the EXA DMSA wings as category C, 10 % (mass estimated, datasheet still
    requested) instead of 5 %: 4.17 kg margined, 5.01 kg with the 20 % system margin [Calculated, budgets.yaml]. The course
    textbook ladder allows 15 % at PDR; 20 % is held, which meets both the textbook ladder and the skill reference (>= 20
    % at PDR).'
