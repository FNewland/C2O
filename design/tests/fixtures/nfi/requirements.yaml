# Northern Fire and Ice (NFI) teaching mission, 3U CubeSat - requirements baseline v2 (systems-engineering V pass)
# Same schema as v1 (script/requirements.yaml) plus the fields listed in schema_v2_additions.
# Generated by v2/build/build_all.py from v1 + build/defs_reqs.py. Do not edit by hand: change defs_reqs.py and rebuild.
# Hierarchy: stakeholder_needs -> objectives (OBJ-) -> mission (MIS-, REG-, MIS-IF-, MIS-VAL-) -> segment (SEG-, OPS-)
#   -> system (SYS-, SYS-IF-, VER-) -> subsystem (PAY EPS ADC OBD COM STR THM DIS HAR GNS) ; interface IF-* at any level.
# Verification methods T/A/I/R per ECSS-E-ST-10-02C; stages PRR SRR PDR CDR QR AR IOV.
schema_version: 2
baseline:
  mission: Northern Fire and Ice
  file_prefix: nfi
  status: teaching baseline v2 (SE V pass), functional baseline for SRR, allocated-baseline draft for PDR
  date: '2026-11-10'
  counts:
    requirements: 302
    level_interface: 12
    level_mission: 68
    level_segment: 40
    level_subsystem: 115
    level_system: 67
    v1_kept_ids: 216
    split: 14
    added: 72
    modified: 25
  v1_source: script/requirements.yaml (v1, unchanged)
  provenance: A teaching mission concept for northern fire and ice monitoring; numbers are a frozen teaching baseline (NUMBERS.yaml
    v2).
schema_v2_additions:
  function: function ids (functions.yaml) or enabling-process ids (PR-*) the requirement implements
  allocation: element ids (functions.yaml elements) that must be designed to meet it
  budget_ref: path in budgets.yaml for budget allocations and performance budgets
  verification_stage: same value as verification_phase (kept for the tool); stages PRR, SRR, PDR, CDR, QR, AR, IOV
  verification_level: 'right side of the V where the evidence is produced: unit | subsystem | system | segment | mission (in
    orbit)'
  verification_model: design (analysis or review of the design) | BB | EM | BB+EM | PFM | GS (ground segment) | flight
  verification_event: event id in vv_plan.yaml events
  acceptance: pass criterion
  v1_id: id in v1 (null for new)
  split_from: v1 id of the compound requirement it was split from
  open_item_note: why open_item is true (TBC in text, assumption to confirm, or carried from v1)
stakeholder_needs:
- id: SN-01
  stakeholder: Funding agency (student CubeSat programme)
  role: sponsor
  need: A student-built mission that flies, trains students and delivers its science within the programme budget and schedule,
    on a rideshare launch.
- id: SN-02
  stakeholder: Northern communities that select the sites
  role: user
  need: Seasonal ice-on/ice-off, break-up and burn-scar information for community-selected sites, openly published with a
    stated uncertainty.
- id: SN-03
  stakeholder: Science team (fire and ice)
  role: science_pi
  need: NIR and SWIR imagery at about 60 m, cross-calibrated against Sentinel-2 and Landsat, with enough clear scenes over
    burns and ice sites.
- id: SN-04
  stakeholder: Mission operations team (mission control, Ottawa)
  role: operator
  need: A reliable encrypted two-way UHF link, a spacecraft that runs a stored plan, organised housekeeping and a ground network
    that returns at least 13 MB of compressed science products per day.
- id: SN-05
  stakeholder: ISED Canada and Global Affairs Canada (RSSSA)
  role: regulator
  need: Licensable spectrum use at 401/450 MHz, disposal within 5 years with at least 90 % probability, collision risk below
    0.001, command and data protection.
- id: SN-06
  stakeholder: Student engineering team
  role: partner
  need: Clear interfaces, early breadboards and a schedule that fits teaching terms.
  traces_to:
  - SYS-IF-14
  - SYS-IF-15
  - VER-MOD-01
- id: SN-07
  stakeholder: Open-data users
  role: user
  need: Calibrated fire and ice products with a stated uncertainty that they can find, download without registration and cite.
- id: SN-08
  stakeholder: Launch provider
  role: partner
  need: A spacecraft that meets the deployer interface and safety requirements and is delivered with its data package on time.
  traces_to:
  - MIS-IF-01
  - MIS-IF-03
  - SEG-LS-01
  - SEG-LS-05
- id: SN-09
  stakeholder: Governance bodies of the site communities
  role: user
  need: Control over which of their sites are observed and how data and products about their lands are released, with their
    decisions recorded and honoured.
- id: SN-10
  stakeholder: Community land users
  role: user
  need: Ice and burn information in a form and language they can use, at the time of break-up, freeze-up and the fire season,
    and a way to ask for sites and say whether it helped.
- id: SN-11
  stakeholder: Other operators and the orbital environment
  role: affected
  need: 'No lasting debris or collision hazard: the spacecraft leaves orbit within 5 years of the end of operations and shares
    its ephemeris.'
- id: SN-12
  stakeholder: Ground-station host sites
  role: affected
  need: Stations that have local permission, respect land use and stay within RF exposure limits.
  traces_to:
  - REG-SPC-05
  - SEG-GS-02
  - SEG-GS-03
objectives:
- id: O1
  code: OBJ-O1
  priority: primary
  needs:
  - SN-02
  - SN-03
  - SN-09
  - SN-10
  text: Map burn scars and relative burn severity of boreal fires at landscape scale.
  measure: '>= 40 usable cloud-free scene pairs over >= 3 burns in the first year; burn-index bias vs the dNBR-calibrated
    reference within 0.08'
- id: O2
  code: OBJ-O2
  priority: secondary
  needs:
  - SN-02
  - SN-03
  text: Explore, as an exploratory test, whether overwintering fires can be detected with SWIR at night and in early spring.
  measure: '>= 10 night SWIR images over each of >= 2 previous-season burns (1 Mar - 31 May); detection or documented null
    result'
- id: O3
  code: OBJ-O3
  priority: primary
  needs:
  - SN-02
  - SN-03
  - SN-09
  - SN-10
  text: Measure river- and lake-ice phenology (freeze-up, break-up, ice-on, ice-off) at community-selected sites.
  measure: one complete break-up season at >= 3 community-selected sites; ice extent for channels wider than 175 m
- id: O4
  code: OBJ-O4
  priority: primary
  needs:
  - SN-01
  - SN-03
  - SN-07
  text: Quantify how well a low-cost student instrument reproduces Sentinel-2 and Landsat measurements and publish the uncertainty.
  measure: radiometric repeatability <= 5 %; geolocation <= 2 px after registration; >= 20 same-day matchups per product type
    per year; uncertainty published
- id: C1
  code: OBJ-C1
  priority: constraint
  needs:
  - SN-05
  - SN-01
  - SN-04
  - SN-11
  - SN-12
  text: Comply with ISED spectrum and debris conditions, the RSSSA licence, ITU procedures and export control.
  measure: all licences granted before launch; re-entry <= 5 years after end of operations with >= 90 % probability; collision
    probability < 0.001
requirements:
- id: MIS-SCI-01
  v1_id: MIS-SCI-01
  level: mission
  tool_level: mission
  category: science
  subsystem: Northern Fire and Ice
  type: performance
  text: The mission shall acquire at least 40 usable scene pairs, each with at most 20 % cloud over the region of interest,
    covering at least 3 distinct burn scars within 12 months of the end of commissioning.
  rationale: NFI brief year-1 fire target. Verified in orbit from the acquisition log and the cloud mask (in-orbit test).
  parents:
  - OBJ-O1
  objectives:
  - O1
  - O4
  function:
  - F1
  - F12.1
  allocation:
  - SSEG
  - GSEG
  verification_method: T
  verification_phase: IOV
  verification_stage: IOV
  verification_level: mission
  verification_model: flight
  verification_event: IOV-SCI
  acceptance: '>= 40 scene pairs, measured in IOV-SCI'
  owner_seat: customer
  priority: 1
  source: 'NFI brief (science targets); research: mission analysis §6.6'
  threshold:
    op: '>='
    value: 40
    unit: scene pairs
  status: draft
- id: MIS-SCI-02
  v1_id: MIS-SCI-02
  level: mission
  tool_level: mission
  category: science
  subsystem: Northern Fire and Ice
  type: performance
  text: The mission shall observe one complete river- or lake-ice break-up season, from the last fully ice-covered to the
    first ice-free acquisition, at each of at least 3 community-selected sites between 1 April and 15 June.
  rationale: 'NFI brief: one full break-up season at >= 3 sites. With ±30 deg roll there are 11-14 opportunities per site
    per month (research: mission analysis §1.4).'
  parents:
  - OBJ-O3
  objectives:
  - O3
  function:
  - F1
  - F12.1
  allocation:
  - SSEG
  - GSEG
  verification_method: T
  verification_phase: IOV
  verification_stage: IOV
  verification_level: mission
  verification_model: flight
  verification_event: IOV-SCI
  acceptance: '>= 3 sites, measured in IOV-SCI'
  owner_seat: customer
  priority: 1
  source: 'NFI brief; research: mission analysis §1.4'
  threshold:
    op: '>='
    value: 3
    unit: sites
  status: draft
- id: MIS-SCI-03
  v1_id: MIS-SCI-03
  level: mission
  tool_level: mission
  category: science
  subsystem: Northern Fire and Ice
  type: performance
  text: The mission shall attempt an acquisition at every opportunity within ±30 deg roll over each of at least 3 community-selected
    ice sites from 1 October until the sun elevation at overpass falls below 15 deg.
  rationale: 'O3 includes freeze-up. North of 60 N freeze-up after mid-November is not observable in the optical (sun elevation
    3-7 deg, research: mission analysis §1.5), so the season is bounded by sun elevation.'
  parents:
  - OBJ-O3
  objectives:
  - O3
  function:
  - F1
  - F12.1
  allocation:
  - SSEG
  - GSEG
  verification_method: T
  verification_phase: IOV
  verification_stage: IOV
  verification_level: mission
  verification_model: flight
  verification_event: IOV-SCI
  acceptance: '>= 3 sites, measured in IOV-SCI'
  owner_seat: customer
  priority: 2
  source: 'research: mission analysis §1.5, §6.3'
  threshold:
    op: '>='
    value: 3
    unit: sites
  status: draft
- id: MIS-SCI-04
  v1_id: MIS-SCI-04
  level: mission
  tool_level: mission
  category: science
  subsystem: Northern Fire and Ice
  type: performance
  text: The mission shall acquire at least 10 night-time SWIR images over each of at least 2 burn scars from the previous
    fire season between 1 March and 31 May.
  rationale: 'About 30 nadir and 140 roll-30 night looks per site per year (research: mission analysis §1.4). O2 is a test;
    a null result is an acceptable outcome (MIS-SCI-12).'
  parents:
  - OBJ-O2
  objectives:
