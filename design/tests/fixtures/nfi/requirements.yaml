  type: functional
  text: The science segment shall process every received acquisition through Level-0 (raw, time-tagged), Level-1A (decompressed,
    unpacked), Level-1B (radiometrically calibrated), Level-1C (geolocated, co-registered, 60 m grid) and Level-2 (burn and
    ice products).
  rationale: Defined product levels make the uncertainty chain auditable for O4.
