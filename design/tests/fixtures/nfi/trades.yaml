      Deployment risk: -1
      Cost: -1
    EnduroSat 3U double deployable x2 + body panels:
      EOL power margin (beta 15 deg): 2
      Mass: -2
      Ops simplicity (no sun-pointing): 2
      Deployment risk: -1
      Cost: -1
  expected_winner: EXA DMSA wings (+0.65); EnduroSat double deployable (+0.50) documented fallback
  evidence: 'Body-mounted 3.98 W EOL usable at beta 15 deg vs ~5.0 W need with margin; wings give ~12.2 W EOL (>2.5x margin)
    (research: bus §10.3). DMSA 3U mass/power not published: request datasheet.'
