architecture_trades:
- id: T-A01
  title: 'Payload architecture: one vs two cameras'
  level: System architecture
  gate: PDR
  seat: payload_lead
  decision: Select the imaging architecture that delivers simultaneous NIR and SWIR on the 60 m grid.
  must:
  - 'M1: simultaneous NIR and SWIR of the same scene (MIS-SCI-06)'
  options:
    A: 'Two cameras: SWIR C-530 (IMX992) + VNIR C-1620m (IMX542) on one bench (baseline)'
    B: One C-530 with a two-zone 865/1610 filter (push-frame)
    C: Two C-530 cameras (IMX992 in both bands), identical 35 mm f/1.4 lenses
    D: One SWIR camera; NIR taken from Sentinel-2
  datum: A
  screened:
    D: 'fails M1: NIR days apart from the SWIR'
  evidence:
    Band simultaneity and co-registration: 'Two-zone filter: zones 60 km / 8.6 s apart along track (research: payload §7);
      a cloud at 5 km height is displaced 5 km x tan(5.8 deg) = 0.51 km = 8.7 px between bands [Calculated], plus advection
      about 1.5 px. C: identical GSD 58.2 m and full-frame overlap 150.7 x 119.7 km vs 150.7 x 98.3 km for A [Calculated,
      2056 px x 58.2 m].'
    NIR SNR on the 60 m grid: 'October 52.5 N, burn 0.10 / water 0.02: IMX542 binned f/2.8 43 / 19; IMX992 at 865 nm, f/1.8,
      native 58 m 78 / 19 (research: payload §3.4); at f/1.4 x1.65 signal [Calculated]. Water stays read-noise limited, so
      the gain is on burns.'
    Technical risk (custom parts, TRL): 'C needs an 875/50 filter blocking OD >= 4 to 1700 nm because the InGaAs sensor sees
      the visible and SWIR (research: payload §2.4): a second custom filter. Snow at 865 nm needs exposures <= about 0.4 ms
      on the IMX992 [Calculated by scaling the IMX542 snow signal 10.7 ke- by QE, aperture, exposure and pixel area to 444
      ke- against 51 ke- full well].'
    Mass, power and volume: 'C: camera mass +0.06 kg (0.19 vs 0.13 kg) -> payload margined 0.81 kg, above the 0.76 kg allocation
      (needs 0.82 kg; system closure 5.39 kg still <= 6.0); power -1.1 W in imaging (2.7 vs 3.8 W) [Calculated, equipment.yaml].
      B saves a camera.'
    Full-frame data volume: 'Pair: A 32.3 MB, C 16.0 MB, B about 8 MB (NUMBERS frame sizes).'
    Cost: 'C: second C-530 17.0 k EUR (comparable list) instead of 1.57 k EUR, second SWIR lens +1.5 k EUR, custom NIR filter
      about 1.5 k EUR [Assumed, as the SWIR filter] -> about +18 k EUR (+8 % flight hardware).'
    Export-control exposure: InGaAs camera very likely 6A003 (RSK-013); C has two units on the permit.
    Calibration and verification effort: One sensor model, one lens model, one distortion model family for C.
  recommendation: 'C (two IMX992 cameras) scores highest and stays ahead under every +-20 % weight change. Do not change the
    baseline yet: raise ECP-01 for PDR, conditional on (1) a quote for an 875/50 filter with OD >= 4 over 400-1700 nm, (2)
    a breadboard measurement of IMX992 NIR response and minimum exposure over snow, (3) a payload allocation of 0.82 kg. v1
    trade T-02 scored the two-C-530 option -1 on mass and power; the power actually falls by 1.1 W.'
  dissent: 'Payload seat: A is the brief reference concept and its parts are cheaper; the team prefers to decide at PDR with
    the filter quote in hand. Recorded.'
  risks_of_selected:
  - RSK-035 (ECP-01 open)
  - RSK-005 (band-to-band)
  - RSK-013 (export)
  acceptance_conditions:
  - ECP-01 decided at PDR
  - registration budget SYS-BUD-13 holds for the selected option
  criteria:
  - name: Band simultaneity and co-registration
    weight: 0.25
    moe:
    - MOE-02
    - MOE-06
    scale: 5 same sensor and optics, full overlap; 3 simultaneous with resampling; 1 bands seconds apart
    weight_rationale: Burn index and ice/cloud class need the same pixel at the same time.
  - name: NIR SNR on the 60 m grid
    weight: 0.2
    moe:
    - MOE-03
    - MOE-05
    scale: 5 >= 2x baseline on burn and water; 4 >= 1.5x burn, >= 1x water; 3 meets requirement on the grid
    weight_rationale: Late-season water and repeatability.
  - name: Technical risk (custom parts, TRL)
    weight: 0.2
    moe:
    - MOE-11
    scale: 5 all COTS; 3 one custom filter; 1 custom stripe filter + push-frame
    weight_rationale: Student schedule.
  - name: Mass, power and volume
    weight: 0.1
    moe:
    - MOE-08
    scale: 5 saves both; 3 within or near allocation; 1 breaks allocation
    weight_rationale: Budgets close with margin.
  - name: Full-frame data volume
    weight: 0.05
    moe:
    - MOE-08
    scale: 5 <= 10 MB per pair; 2 > 30 MB
    weight_rationale: Full frames are on request only.
  - name: Cost
    weight: 0.1
    moe:
    - MOE-11
    scale: 5 lowest; 2 > +15 k EUR
    weight_rationale: Flight hardware about 231 k EUR.
  - name: Export-control exposure
    weight: 0.05
    moe:
    - MOE-09
    scale: 5 none; 3 one controlled unit; 2 two
    weight_rationale: RSK-013.
  - name: Calibration and verification effort
    weight: 0.05
    moe:
    - MOE-05
    scale: 5 one sensor type; 3 two sensor types
    weight_rationale: VER-CAL-01.
