- id: T-A02
  title: 'Avionics architecture: federated vs centralised'
  level: System architecture
  gate: PDR
  seat: systems_engineer
  decision: Select how on-board computing is split between the bus and the payload.
  must:
  - 'M1: two CSI-2 cameras supported (PAY-FUN-01)'
  - 'M2: disposal independent of the main computer (SYS-REL-01)'
  options:
    A: 'Federated: A3200 OBC + CM4 payload controller (powered for sessions) + ADCS processor (baseline)'
    B: 'Centralised: one Zynq-class OBC runs bus and payload; cameras on the OBC'
    C: Payload controller as the only computer (CM4 runs the bus)
    D: Federated with two cross-strapped A3200 OBCs
  datum: A
  screened: {}
  evidence:
    Orbit-average power: 'A3200 0.15 W; Z7000 2.3 W continuous (research: bus §4) replaces A3200 + CM4 sessions (0.57 W) ->
      +1.6 W orbit average (+38 %) [Calculated]; CM4 idle about 2 W (v1 T-03) -> +1.3 W for C; D +0.15 W.'
    Fault containment and reliability: 'A: payload reboots do not affect the bus; single OBC string, but disposal is independent
      (SYS-REL-01). D removes the OBC single point at the cost of cross-strapping.'
    Two CSI-2 camera ports: 'CM4 1x4 + 1x2 lanes native (v1 T-03); Z7000 has no CSI-2 interface listed (research: bus §4).'
    Software effort and team heritage: A3200 CSP/FreeRTOS heritage; Linux on the payload controller only.
    Radiation tolerance of the bus master: 'A3200 flown on several satellites (research: bus §4); CM4 has no radiation data
      and relies on power cycling.'
    Mass and volume: A3200 24 g in the P60 dock; Z7000 77 g with shield.
    Cost: A3200 12 k EUR [kb-est] each.
  recommendation: 'Keep A. D is the runner-up; its benefit is covered for the disposal function by the independent timer,
    and the OBC single point is accepted (FDIR: watchdog, golden image).'
  dissent: None recorded.
  risks_of_selected:
  - RSK-019 (CSI-2 driver)
  - RSK-014 (radiation on COTS units)
