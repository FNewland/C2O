- id: T-S01
  title: End-to-end data architecture
  level: System
  gate: SRR
  seat: comms_engineer
  decision: Select where products are made and how they reach the ground.
  must:
  - 'M1: L1 radiometric products reach the ground for cross-calibration (MIS-SCI-09, O4)'
  - 'M2: non-amateur licensed spectrum (REG-SPC-06)'
  options:
    A: On-board ROI and quicklook selection + lossless CCSDS 121 + UHF store-and-forward to 4 stations; L1/L2 on ground (baseline)
    B: On-board Level-2 index maps only (burn index, ice class), downlinked over UHF
    C: Full frames with on-board lossy compression (about 8:1) over UHF
    D: Full frames, lossless, over a new S-band downlink to 4 dishes
  datum: A
  screened:
    B: 'fails M1: no L1 radiances on the ground, so O4 (repeatability against Sentinel-2/Landsat) cannot be measured'
  evidence:
    Science volume delivered vs 13 MB/day: Baseline closes 13 MB/day with 38 % margin, 18 % with the worst site out (NUMBERS
      data_budget C1, C4).
    Radiometric fidelity for cross-calibration: Lossless keeps L1 radiometry; lossy wavelet compression at 8:1 adds artefacts
      that compete with the 5 % repeatability target [Estimated].
    Latency for community products: Quicklooks within 24 h for >= 80 % (MIS-DAT-03); 14 windows/day, longest gap 6.6 h.
    On-board resources (power, processing, storage): L2 on board needs continuous controller operation; S-band transmitter
      needs several W and a pointing law [Assumed until a unit is selected].
