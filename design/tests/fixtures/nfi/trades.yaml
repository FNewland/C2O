- id: T-M02
  title: Launch approach
  level: Mission
  gate: MDR
  seat: systems_engineer
  decision: Select how the spacecraft reaches the T-M01 orbit.
  must:
  - 'M1: reaches an SSO meeting T-M01 (MIS-COV-03)'
  options:
    A: SSO rideshare on a large launcher via an aggregator, 3U deployer (baseline)
    B: Shared cluster mission on a small dedicated launcher
    C: Space-station deployment (cargo flight + station deployer)
    D: Auxiliary payload on an agency Earth-observation launch to SSO
  datum: A
  screened:
    C: 'fails M1 (51.6 deg orbit, see T-M01 option F); scored below for teaching: it scores well on cost and schedule, which
      is exactly why the must-screen comes before weighting'
  evidence:
    Orbit fit to T-M01 (altitude, node, inclination tolerance 0.15 deg): 'Rideshare node set by the primary (research: mission
      analysis R14); dedicated cluster chooses its orbit; station orbit 51.6 deg.'
    Schedule robustness and re-booking: '[Assumed] frequent SSO rideshares; small launchers have had schedule slips; agency
      auxiliary slots are rare. MIS-IF-01 (two deployer designs) reduces re-booking cost.'
    Launch price: '[Assumed] no quotes yet. Action: two quotes (A and B) before PRR.'
    Environment and integration burden: Station cargo is soft-stowed; deployer ICDs are standard (CDS rev 14.1).
    Disposal and licensing (apogee and dispersion): Agency primaries to SSO often fly above 600 km [Assumed]; rideshare request
      can state apogee <= 600 km (SEG-LS-02).
    LEOP support (state vector within 24 h): Rideshare providers publish separation data [Assumed]; to be written into the
      launch ICD (MIS-IF-02/03).
  recommendation: Keep A; carry B as the documented backup. The ranking rests on assumed price and schedule scores, so obtain
    two quotes before PRR and re-run.
  dissent: None recorded.
  risks_of_selected:
  - RSK-028 (re-manifest)
  - RSK-007 (node not guaranteed)
  acceptance_conditions:
  - quote confirms the price order assumed here
  - launch request accepted with apogee <= 600 km and inclination tolerance 0.15 deg
  criteria:
  - name: Orbit fit to T-M01 (altitude, node, inclination tolerance 0.15 deg)
    weight: 0.25
    moe:
    - MOE-01
    - MOE-03
    - MOE-05
    scale: 5 orbit chosen by the mission; 4 set by a primary inside the T-M01 window; 1 outside
    weight_rationale: Science return depends on the orbit.
  - name: Schedule robustness and re-booking
    weight: 0.2
    moe:
    - MOE-11
    scale: 5 several flights a year to compatible orbits; 2 tied to one primary
    weight_rationale: A student schedule cannot absorb a lost slot.
  - name: Launch price
    weight: 0.2
    moe:
    - MOE-11
    scale: '[Assumed] 5 lowest; 1 highest'
    weight_rationale: Launch is not yet in the cost estimate (RSK-034).
  - name: Environment and integration burden
    weight: 0.1
    moe:
    - MOE-11
    scale: 5 benign and standard deployer ICD; 3 agency-specific ICD
    weight_rationale: Affects test levels (SEG-LS-03).
  - name: Disposal and licensing (apogee and dispersion)
    weight: 0.15
    moe:
    - MOE-09
    scale: 5 apogee controlled <= 600 km; 2 primary often above 600 km
    weight_rationale: Licence condition.
  - name: LEOP support (state vector within 24 h)
    weight: 0.1
    moe:
    - MOE-08
    scale: 5 contractual; 3 best effort
    weight_rationale: MIS-IF-02.
