trades:
- id: T-01
  title: 'SWIR filter centre: 1550 nm vs 1610 nm'
  seat: payload_lead
  level: 'Subsystem: Payload'
  datum: 1550/50 nm (Edmund 85-903, COTS)
  options:
  - 1550/50 nm (Edmund 85-903, COTS)
  - 1610/90 nm (custom, S2 B11-matched)
  criteria:
    Cross-calibration match: 0.35
    SNR: 0.2
    Index heritage (NDMI/B11): 0.2
    Availability / cost: 0.15
    Out-of-band blocking risk: 0.1
  scores:
    1610/90 nm (custom, S2 B11-matched):
      Cross-calibration match: 2
      SNR: -1
      Index heritage (NDMI/B11): 1
      Availability / cost: -1
      Out-of-band blocking risk: 0
  expected_winner: 1610/90 nm (weighted total +0.55; unweighted +1)
  evidence: S2 B11 1610-1614 nm/91-94 nm, OLI B6 1566-1651 nm; IMX992 QE falls from ~72 % at 1550 to lower values toward 1700
    nm and solar irradiance is ~10 % lower at 1610 nm (est.), hence SNR -1; custom filter needs a quote.
  decision_record: D-PAY-01
  trade_level: subsystem
- id: T-02
  title: 'Imaging architecture: two cameras vs one IMX992 with a two-zone filter'
  seat: payload_lead
  level: 'Subsystem: Payload'
  datum: Two cameras (C-530 VSWIR + C-1620m)
  options:
  - Two cameras (C-530 VSWIR + C-1620m)
  - One C-530 VSWIR with 865/1610 two-zone filter
  - Two C-530 VSWIR cameras
  criteria:
    NIR SNR: 0.2
    Band simultaneity / registration: 0.25
    Mass and power: 0.15
    Technical risk (custom parts): 0.25
    Cost: 0.15
  scores:
    One C-530 VSWIR with 865/1610 two-zone filter:
      NIR SNR: 2
      Band simultaneity / registration: -1
      Mass and power: 2
      Technical risk (custom parts): -2
      Cost: 1
    Two C-530 VSWIR cameras:
      NIR SNR: 2
      Band simultaneity / registration: 0
      Mass and power: -1
      Technical risk (custom parts): 0
      Cost: -2
  expected_winner: 'Near tie: single camera +0.10, two VSWIR -0.05 against the two-camera datum. Decision: keep two cameras
    for MCR, reopen at PDR'
  evidence: IMX992 QE 73 % at 865 nm vs 15 % for IMX542 (about 4x NIR SNR); two-zone filter puts bands 60 km / 8.6 s apart
    along track; a second C-530-class SWIR camera costs about 17 k EUR more (comparable list price, NUMBERS.yaml cost).
  note: With these weights both alternatives score slightly positive; the team keeps the baseline because the two-zone filter
    is a custom part at TRL 4 and the two-camera bench is the NFI brief reference concept. Record it as 'keep baseline, reopen
    at PDR'.
  decision_record: D-PAY-02
  trade_level: subsystem
  v2_note: Raised to system-architecture level as T-A01 (MOE-derived criteria, absolute scoring, sensitivity). T-02 scored
    the two-C-530 option -1 on mass and power; the imaging power actually falls by 1.1 W (mass +0.06 kg).
- id: T-03
  title: Payload controller (two CSI-2 cameras)
  seat: payload_lead
  level: 'Subsystem: Payload'
  datum: Raspberry Pi CM4 on custom carrier
  options:
  - Raspberry Pi CM4 on custom carrier
  - Raspberry Pi CM5 on custom carrier
  - NVIDIA Jetson Orin Nano 8GB
  - Xiphos Q8S + Q8 Camera Board
  criteria:
    Power: 0.25
    Dual CSI-2 support: 0.25
    Heritage / TRL: 0.2
    Mass: 0.1
    Cost: 0.2
  scores:
    Raspberry Pi CM5 on custom carrier:
      Power: 0
      Dual CSI-2 support: 1
      Heritage / TRL: -1
      Mass: 0
      Cost: 0
    NVIDIA Jetson Orin Nano 8GB:
      Power: -2
      Dual CSI-2 support: 1
      Heritage / TRL: 0
      Mass: 0
      Cost: -1
    Xiphos Q8S + Q8 Camera Board:
      Power: 0
      Dual CSI-2 support: -2
      Heritage / TRL: 2
      Mass: -1
      Cost: -2
  expected_winner: 'Tie between CM4 (datum) and CM5 (+0.05; the tool will star CM5); Jetson -0.45, Xiphos -0.60. Decision:
    CM4 baseline for its VERTECS heritage and TRL 5, CM5 accepted alternative if the driver breadboard works on it'
  evidence: 'CM4 1x4-lane + 1x2-lane CSI, ~2 W idle / ~7 W typical, VERTECS CCB heritage (TVAC, not flown); CM5 2x4-lane;
    Jetson 7-15 W; Q8S has no native CSI-2 (research: payload §4).'
  decision_record: D-PAY-03
  trade_level: subsystem
