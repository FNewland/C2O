# Northern Fire and Ice v2 - trade studies: system-level (T-M01 orbit, T-M02 launch at MDR; T-S01 data architecture at SRR),
# system-architecture (T-A01 payload, T-A02 avionics at PDR) and the 8 v1 subsystem trades (unchanged, under `trades`).
# Generated by v2/build/build_all.py from build/defs_trades.py.
method: 'references/methods/trade-studies.md: candidate set and must-screen, criteria from MOEs (stakeholders.yaml), weights
  fixed before scoring with rationale, absolute 1-5 scores with evidence, weighted totals, sensitivity x0.8/x1.2 per weight,
  break-even, decision record with dissent. pugh_vs_datum gives the -2..+2 form for the SpaceCDF Pugh widget.'
pi_ruling: 'System-level trades: orbit and launch at MDR; data architecture at SRR (not form factor, not ground network).
  The ground network choice stays as the v1 fourth-site analysis (NUMBERS ground_network.fourth_site_trade).'
system_trades:
- id: T-M01
  title: 'Operational orbit: altitude and local time of the node'
  level: Mission
  gate: MDR
  seat: mission_analyst
  decision: Select the operational orbit to request from the launch segment.
  must:
  - 'M1: reaches the community sites at 60-68 N (MIS-SCI-02, O3)'
  - 'M2: apogee <= 600 km including dispersion (MIS-COV-03, ISED propulsion threshold)'
  options:
    A: 590 km SSO, LTDN 10:30 (baseline)
    B: 550 km SSO, LTDN 10:30
    C: 500 km SSO, LTDN 10:30
    D: 590 km SSO, LTAN 13:30 (afternoon ascending)
    E: 590 km dawn-dusk SSO (LTAN 06:00)
    F: about 420 km, 51.6 deg (space-station orbit)
  datum: A
  screened:
    F: 'fails M1: ground track and +-30 deg roll reach only about 55 N at 420 km [Calculated: 51.6 deg + 2.2 deg roll reach
      + 1.2 deg half swath]; scored below for teaching only'
  evidence:
    Coverage of 45-68 N sites (roll +-30 deg): '590 km: 12.2-14.5 looks/month (calc/orbit4.py). Roll reach scales with altitude:
      341/318/289 km at 590/550/500 km [Calculated] -> B about 11.4-13.5, C about 10.4-12.3 [Estimated by reach scaling].
      F: see screening.'
    Illumination at overpass (sun elevation in break-up, fire, freeze-up): 'Sun elevation 43-57 deg (break-up), 46-60 (fire),
      17-32 (October) for LTDN 10:30; LTAN 13:30 within 2 deg (research: mission analysis §1.5); dawn-dusk near the terminator.'
    Same-morning matchups with Sentinel-2 / Landsat: 'Sentinel-2 mean local time 10:30 descending (ESA orbit description);
      Landsat 8/9 about 10:12-10:13 descending (Landsat 9 under-fly paper). 13:30 is 3 h later: cloud and ice change.'
    Data return (union contact time, four sites): 'Union minutes/day [Calculated, v2 calc/trade_calcs.py]: 590 km 125.7, 550
      km 117.6, 500 km 105.9, 590 km LTAN 13:30 125.7; dawn-dusk not run (contacts depend on altitude, the 13:30 run shows
      local time does not change them). F: Inuvik (68.4 N) never visible, Yellowknife/Iqaluit at the edge [Calculated visibility
      circle 12.5 deg].'
    Disposal robustness without the sail: 'Lifetime without sail, A_eff 0.08 m2, nominal / weak cycle, strong cycle at 0.12
      m2 [Calculated, v1 decay model, v2 run]: 590 km 14.7 / 20.7 / 5.0 y; 550 km 6.0 / 10.8 / 4.1 y; 500 km 4.1 / 4.8 / 3.1
      y. With the sail: 590 km 3.0/3.4 y (v1 3.0/3.4, reproduced).'
    Orbit life covers the 3-year design life: 'Shortest natural life (strong cycle, 0.12 m2): 590 km 5.0 y, 550 km 4.1 y,
      500 km 3.1 y [Calculated]: at 500 km the last months of a 3-year life fall below 400 km.'
    Launch availability: '[Assumed] SSO rideshares cluster at 500-600 km with late-morning nodes; afternoon and dawn-dusk
      slots are rarer; station deployment is frequent. Action: manifest survey before PRR.'
    Licensing margin (600 km apogee rule): 'ISED April 2026 condition (research: mission analysis R7): propulsion above 600
      km apogee; 590 km leaves 10 km for injection dispersion.'
  recommendation: 'Keep A (590 km, LTDN 10:30) as the nominal request. B (550 km) scores within 0.05: accept 550-600 km as
    the acceptable injection range in the launch request (proposed change ECP-02 to SEG-LS-02), which keeps data return >=
    117 min/day and halves the no-sail lifetime in a strong cycle. C (500 km) would make the sail almost unnecessary but cuts
    contact time by 16 % and shortens orbit life to about 3 y.'
  dissent: A disposal-first view would weight the no-sail lifetime above data return and select B; recorded, and covered by
    the 550-600 km acceptance range.
  risks_of_selected:
  - RSK-002 (sail is the compliance item at 590 km)
  - RSK-012 (apogee dispersion close to 600 km)
  - RSK-007 (node not guaranteed)
  acceptance_conditions:
  - injection apogee <= 600 km including dispersion
  - node within 09:30-13:30 for 24 months
  - sail deployment probability >= 0.95 (SYS-REL-02)
  criteria:
  - name: Coverage of 45-68 N sites (roll +-30 deg)
    weight: 0.15
    moe:
    - MOE-01
    - MOE-03
    scale: '5 >= 12 looks/site/month; 4: 10-12; 3: 8-10; 2: 5-8; 1: sites not reachable'
    weight_rationale: O1 and O3 scene counts are the primary MOEs; equal to the other science criteria.
  - name: Illumination at overpass (sun elevation in break-up, fire, freeze-up)
    weight: 0.1
    moe:
    - MOE-01
    - MOE-03
    scale: 5 > 45 deg in fire and break-up and > 20 deg in October; 1 terminator orbit
    weight_rationale: Optical-only payload; weighted lower than coverage because A-D differ by < 2 deg.
  - name: Same-morning matchups with Sentinel-2 / Landsat
    weight: 0.15
    moe:
    - MOE-05
    - MOE-06
    scale: '5 node within 30 min of S2 (10:30) and Landsat (about 10:12); 2: > 2 h apart; 1: no near-coincident looks'
    weight_rationale: O4 is the central question of the mission; cross-calibration quality depends on near-simultaneous references.
  - name: Data return (union contact time, four sites)
    weight: 0.15
    moe:
    - MOE-08
    scale: '5 >= 120 min/day; 4: 110-120; 3: 100-110; 2: 80-100; 1: < 80'
    weight_rationale: 'Data return is the binding constraint (research: mission analysis R2).'
  - name: Disposal robustness without the sail
    weight: 0.15
    moe:
    - MOE-09
    scale: '5 compliant without sail in all cycles; 4: all cycles with small margin; 3: strong cycle only; 2: borderline in
      strong cycle only; 1: never'
    weight_rationale: The sail is the single compliance item (RSK-002); an orbit that does not depend on it is worth as much
      as data return.
  - name: Orbit life covers the 3-year design life
    weight: 0.1
    moe:
    - MOE-01
    - MOE-03
    scale: '5 natural life > 4 y in a strong cycle; 3: about 3 y; 1: < 2 y'
    weight_rationale: Needed for 24 months of science after commissioning; lower weight because A, B, D, E all pass.
  - name: Launch availability
    weight: 0.1
    moe:
    - MOE-11
    scale: '5 frequent rideshares; 3 occasional; 1 rare  [Assumed: no manifest survey yet]'
    weight_rationale: Programmatic; weight limited because the scores are assumptions.
  - name: Licensing margin (600 km apogee rule)
    weight: 0.1
    moe:
    - MOE-09
    scale: '5 >= 40 km below 600 km; 4: 10-40 km; 1: above 600 km'
    weight_rationale: Licence condition; RSK-012.
  scores:
    A:
      Coverage of 45-68 N sites (roll +-30 deg): 5
