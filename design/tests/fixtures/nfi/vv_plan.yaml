# Northern Fire and Ice v2 - verification and validation plan: model philosophy, verification matrix by level and stage, events, validation plan.
note: Right side of the V. Verification per ECSS-E-ST-10-02C (methods T test, A analysis, I inspection, R review of design);
  validation per ISO 15288 Validation process. Generated from requirements.yaml v2.
v_levels:
- left: Stakeholder needs and MOEs (stakeholders.yaml)
  right: Validation V1-V7
  review: MDR/PRR (needs), CRR, FRR / mission results
- left: Mission requirements (MIS, REG, MIS-IF, MIS-VAL)
  right: Mission verification in orbit (IOV) and by analysis
  review: PRR -> CRR
- left: Segment requirements (SEG, OPS)
  right: 'Segment verification: ground segment acceptance, end-to-end'
  review: SRR -> ORR
- left: System requirements (SYS, SYS-IF, VER)
  right: System verification on the PFM
  review: SRR/PDR -> QR/AR
- left: Subsystem and interface requirements
  right: Subsystem verification on EM / PFM; interface tests
  review: PDR -> CDR/QR
- left: Unit specifications (procured and built units)
  right: Unit acceptance (supplier data, breadboard tests)
  review: CDR
model_philosophy:
- model: BB
  name: Breadboards
  month: 6
  purpose: 'Payload: both cameras on the controller (CSI-2 driver, trigger skew, compression on sample scenes); flatsat start
    (OBC, EPS, radio); disposal timer breadboard.'
  levels:
  - unit
  - subsystem
  trl_target: TRL 4 -> 5 for the payload chain and the timer
- model: EM
  name: Engineering model and flatsat
  month: 18
  purpose: Functional and interface tests of every subsystem; deployment tests of sail, antennas and wings; payload focus-in-vacuum
    method; software on the simulator (SVF).
  levels:
  - subsystem
  - system
  trl_target: TRL 6 for the payload bench and the timer before CDR
- model: PFM
  name: Protoflight model
  month: 30
  purpose: 'Qualification levels at acceptance durations: sine and random vibration, TVAC 4 cycles, functional before and
    after, EMC self-compatibility, end-to-end, 72 h day-in-the-life, mass properties and magnetic dipole, payload calibration.'
  levels:
  - system
  trl_target: TRL 7-8 at AR
- model: LV
  name: Launch provider final vibration in the deployer
  month: 34
  purpose: Acceptance vibration of the integrated deployer by the launch provider.
  levels:
  - system
  trl_target: '-'
- model: GS
  name: Ground segment integration
  month: 24
  purpose: Station acceptance at each site, VPN, scheduling, key store; end-to-end with the PFM.
  levels:
  - segment
  trl_target: '-'
- model: flight
  name: In-orbit verification and validation
  month: 36
  purpose: LEOP and commissioning tests; science validation in year 1.
  levels:
  - mission
  trl_target: TRL 9
independence: 'ECSS separates product assurance from design. In the student project the Instructor and Observer seats act
  as the independent reviewers: they witness PFM tests (QR/AR) and close anomalies; designers do not close their own NCRs.'
