validation_plan:
- id: V1
  name: Needs validation
  when: MDR to PRR
  who: each stakeholder group (communities through their governance bodies)
  method: Plain-language walkthrough of the need statement, objectives and MOEs; communities co-define MOE-04/MOE-10; record
    in a validation record per group.
  requirements:
  - MIS-VAL-01
  - MIS-SCI-14
  exit: every SN has a signed or recorded confirmation; changes fed into the requirements
- id: V2
  name: Requirements validation
  when: SRR
  who: operators, science team, community representatives
  method: Trace each ConOps scenario through the requirements ("if all were met, would the need be met?"); plain-language
    review of the mission-level and interface requirements.
  requirements:
  - MIS-VAL-02
  exit: every scenario covered; gaps raised as requirement changes
- id: V3
  name: Pre-launch product validation with simulated data
  when: CDR to AR
  who: science team and >= 3 site communities
  method: Simulated L1/L2 products from Sentinel-2/Landsat for every site (MIS-SCI-13) reviewed by the communities in their
    formats and languages.
  requirements:
  - MIS-SCI-13
  - MIS-VAL-03
  - MIS-IF-05
  exit: product definition confirmed or changed before AR
- id: V4
  name: Operational validation of the ground segment and operators
  when: QR to ORR/FRR
  who: certified operators
  method: 'Rehearsals on the simulator and the flight model: cold start, nominal day, Safe entry and recovery, station outage,
    ARM/FIRE of the sail with two operators.'
  requirements:
  - OPS-PRC-01
  - OPS-CRT-01
  - OPS-CRT-02
  - VER-E2E-01
  - VER-DIL-01
  exit: every contingency procedure run at least once
- id: V5
  name: In-orbit validation of products against reference imagery
  when: commissioning (CRR)
  who: science team
  method: '>= 5 same-day matchups with Sentinel-2/Landsat before closing commissioning; boresight map update; compression
    ratio on real scenes.'
  requirements:
  - MIS-VAL-04
  - MIS-SCI-09
  - MIS-SCI-10
  - SEG-US-05
  - SEG-US-06
  exit: PAY-RAD, SYS-BUD-13 and MIS-SCI-10 met on real data
- id: V6
  name: Operational validation with communities
  when: first break-up season and first fire season
  who: site communities
  method: Products delivered per site agreement; seasonal assessment recorded (SEG-US-10) against MOE-10 as co-defined; release
    record checked against agreements (MOE-13).
  requirements:
  - SEG-US-10
  - MIS-IF-05
  - MIS-IF-06
  - MIS-DAT-04
  exit: community assessment recorded; requirement changes raised where products did not help
- id: V7
  name: Mission results review
  when: end of year 1 (FRR-type results review) and end of mission
  who: sponsor, science team, communities
  method: MOEs measured against needs; lessons for the next mission.
  requirements:
  - MIS-SCI-01
  - MIS-SCI-02
  - MIS-SCI-05
  - MIS-SCI-12
  exit: need satisfaction stated per SN
need_validation:
- need: SN-01
  method: V1 sponsor review of the mission need and objectives; V7 mission results review
  stage: MDR, PRR, FRR
- need: SN-02
  method: V1 walkthrough with community representatives; V3 simulated products; V6 seasonal assessment
  stage: PRR, AR, Phase E
- need: SN-03
  method: V1 science requirements review; V3 simulated products; V5 in-orbit matchups
  stage: PRR, CDR, CRR
- need: SN-04
  method: V2 scenario tracing with operators; V4 operational rehearsals on the simulator
  stage: SRR, ORR
- need: SN-05
  method: V1 pre-consultation records; licences granted
  stage: PRR, launch - 12 months
- need: SN-06
  method: V1 team review of interfaces and schedule; seat retrospectives at each gate
  stage: PRR and each gate
- need: SN-07
  method: V3 catalogue test with an outside user; V7 usage statistics
  stage: AR, Phase E
- need: SN-08
  method: Launch ICD signed; acceptance data package accepted
  stage: CDR, AR
- need: SN-09
  method: V1 site agreements drafted with community governance; V6 record of releases against agreements
  stage: PRR, CDR, Phase E
- need: SN-10
  method: V3 simulated products reviewed in the community's language; V6 seasonal assessment (SEG-US-10)
  stage: AR, Phase E
- need: SN-11
  method: Disposal analysis (DRAMA/DAS) and conjunction-service registration
  stage: PDR, launch - 90 days
- need: SN-12
  method: Siting consultation records per station
  stage: launch - 12 months
