# Northern Fire and Ice v2 - budget ledger and allocations (mass, power per mode and orbit average, data, pointing, geolocation,
# registration, timing, thermal, link, cost) with ECSS margins per phase. Generated by v2/build/calc_budgets.py.
# Basis labels: Calculated | Estimated | [ASSUMPTION]. Consistent with NUMBERS.yaml v2.
margin_policy:
  adopted: hold 20 % system margin on mass and power through PDR; per-mode power margins; link >= 3 dB at 10 deg
  skill_reference_ecss_se:
    mass_pct:
      phase_A: 20
      PDR: 20
      CDR: 15
      AIV_start: 10
      launch: 5
    power_pct_per_mode:
      PDR: 20
      CDR: 15
      launch: 10
    link_db_min_at_CDR: 3
  course_textbook_ladder:
    source: ECSS-E-HB-10-02A §5.2 via the course textbook Table 8.3 (SpaceCDF margin_policy.yaml)
    MDR: 20
    PRR: 20
    SRR: 15
    PDR: 15
    CDR: 10
    phase_D: 5
  note: The two references differ at SRR/PDR (15 % vs 20 %). NFI holds 20 %, which satisfies both; teach the difference.
  maturity_margins_pct:
    off_the_shelf: 5
    modified_or_estimated: 10
    new_design: 20
  other:
    storage_used_max_pct: 50
    bus_utilisation_max_pct: 50
    thermal_uncertainty_degC_PDR: 10
