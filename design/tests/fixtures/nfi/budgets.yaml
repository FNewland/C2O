  distortion: 0.3
  resampling: 0.2
  rss_px: 0.592
  requirement_px: 1.0
  goal_px: 0.5
  requirement: SYS-BUD-13
  meets_requirement: true
  meets_goal: false
timing:
  basis: 'Calculated: worst-case linear sum (ms)'
  contributors:
  - contributor: GNSS PPS vs GPS time
    ms: 0.001
    requirement: GNS-PPS-01
  - contributor: PPS capture + camera exposure-start latency knowledge
    ms: 0.2
    requirement: PAY-FUN-06
  - contributor: inter-camera trigger skew
    ms: 0.1
    requirement: IF-PAY-CAM-01
  - contributor: time-code resolution (CUC 2 fine octets)
    ms: 0.015
    requirement: SYS-IF-06
  - contributor: GPS-UTC leap-second offset
    ms: 0.0
    requirement: MIS-IF-10 (applied exactly)
  sum_ms: 0.316
  requirement_ms: 1.0
  requirement: SYS-BUD-12
  latency: 0.2
  convention: mid-exposure time-tag (SYS-IF-07); tagging at the trigger would add 2.1 ms on the SWIR band
  precondition: GNSS fix at acquisition (GNS-OPS-02, OPS-PLN-02); without a fix OBD-TIM-02 allows 1 s/day drift
