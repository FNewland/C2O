    px_rms: 0.2
    requirement: STR-BEN-01
  - contributor: distortion model residual
    px_rms: 0.3
    requirement: PAY-GEO-04
  - contributor: L1C resampling to the 60 m grid
    px_rms: 0.2
    requirement: SEG-US-09
  - contributor: trigger skew 100 us (0.69 m)
    px_rms: 0.0119
    requirement: IF-PAY-CAM-01
  - contributor: mid-exposure offset 0.95 ms after time-tag correction (residual)
    px_rms: 0.02
    requirement: SYS-IF-07
  - contributor: attitude rate over the 0.95 ms offset
    px_rms: 0.0168
    requirement: ADC-STB-01
