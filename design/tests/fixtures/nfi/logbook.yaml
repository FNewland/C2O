# Northern Fire and Ice (NFI) teaching mission - logbook entries (decision records and notes).
# Author = the active seat (role, never a person). decision: the [data-decision] id or the RecordDecision
# context the entry is saved under. Frozen teaching baseline: every number is in ../NUMBERS.yaml.
entries:
  - {id: LB-01, seat: team_leader, decision: D-1.4-PROBLEM, title: "Problem statement",
     text: "Northern Fire and Ice addresses landscape-scale, seasonal observation of wildfire and river/lake ice for northern communities, and tests whether a low-cost student instrument reproduces Sentinel-2/Landsat measurements within known limits. Not emergency response; not active fire, FRP, smoke or ice thickness."}
  - {id: LB-02, seat: team_leader, decision: D-1.4-STAKEHOLDERS, title: "Stakeholders",
     text: "Sponsor: a funding agency's student CubeSat programme; users: the northern communities that select the sites; science PI team; operator: mission control in Ottawa; regulators ISED and Global Affairs Canada (RSSSA); partner: the student engineering team. Communities choose the sites."}
  - {id: LB-03, seat: team_leader, decision: D-1.4-OBJECTIVES, title: "Objectives",
     text: "Primary O1 burn scars, O3 ice phenology, O4 reproduction of reference measurements with published uncertainty; O2 overwintering fires is an exploratory test that may give a null result (a 10 m2 hotspot gives about 7 % of a daytime signal); constraint C1 regulatory compliance."}
  - {id: LB-04, seat: systems_engineer, decision: D-1.4-SPACE, title: "Space solution selected",
     text: "New dedicated CubeSat selected. Sentinel-2 and Landsat rank well and stay as the calibration reference, but cannot be tasked by communities, take no night SWIR and cannot answer O4."}
  - {id: LB-05, seat: mission_analyst, decision: "note", title: "Orbit and node time",
     text: "SSO 590 km, i = 97.75 deg, daylight node descending at 10:30 (LTDN 10:30, entered as LTAN 22:30). The brief's 'node 09:30-13:30' means the daylight pass. Period 96.6 min, eclipse 34-35 min, beta +16 to +26 deg. Apogee <= 590 km incl. dispersion requested (ISED 600 km propulsion threshold); inclination tolerance <= 0.15 deg (18 min/yr node drift per 0.1 deg)."}
  - {id: LB-06, seat: mission_analyst, decision: "decide:ground-trade", title: "Ground network",
     text: "Four generic sites: Ottawa (mission control + station), Yellowknife, Iqaluit and Inuvik. Union 125.7 min/day (sum of sites 177.7), 14.0 windows/day, mean 9.0 min, longest gap 6.6 h, 35.7 min/day above 30 deg. Fourth site chosen on contact time: Inuvik adds 32.3 min/day to Ottawa-Yellowknife-Iqaluit and cuts the longest gap from 8.2 to 6.6 h; Churchill would add only 0.9 min/day. Worst single-site loss (Inuvik) leaves 93.4 min/day."}
  - {id: LB-07, seat: systems_engineer, decision: D-2.4-MASS, title: "Mass allocation",
     text: "6.0 kg spacecraft allocation (CDS 3U). System margin 20 % at MCR/SRR (ECSS phase 0/A), 15 % at SRR/PDR, 10 % at CDR. Current estimate 3.87 kg nominal, 4.15 kg with maturity margins (5/10/20 %), 4.98 kg with 20 % system margin: 1.02 kg below the limit."}
  - {id: LB-08, seat: systems_engineer, decision: "note", title: "SMART check findings",
     text: "Functional, regulatory, interface and process requirements without a numeric threshold are flagged 'not measurable'; accepted because they are verified by test, inspection or review. Objective tracing set through the API."}
  - {id: LB-09, seat: payload_lead, decision: "decide:pugh T-01", title: "SWIR filter centre 1610 nm",
     text: "Pugh +0.55 for a 1610/90 nm filter over the COTS 1550/50 datum: matches Sentinel-2 B11 and Landsat OLI B6, so no spectral band adjustment is needed; small SNR loss; custom filter with OD >= 4 over 400-1700 nm (the InGaAs sensor sees the visible at about 70 % QE). PAY-OPT requirements updated."}
  - {id: LB-10, seat: payload_lead, decision: "decide:pugh T-02", title: "Two cameras kept for MCR",
     text: "Single IMX992 with a two-zone 865/1610 filter scores +0.10 (four times the NIR SNR, saves a camera, 3.8 W and a lens) but needs a custom striped filter at TRL 4 and puts the bands 60 km / 8.6 s apart. Near tie: keep the two-camera bench (two fixed cameras, one rigid bench, triggered together, GNSS time-stamped), reopen at PDR."}
  - {id: LB-11, seat: payload_lead, decision: "decide:pugh T-03", title: "Payload controller and payload power",
     text: "Raspberry Pi CM4 on a custom carrier kept (datum; CM5 +0.05 tie; Jetson -0.45; Xiphos -0.60) for its two CSI-2 ports, TRL 5 and third-party TVAC heritage; CM5 is the accepted alternative if the driver breadboard works on it. Controller budget 3-5 W, so the payload peak is 11.5 W (budgeted 12 W). Breadboard the mainline Alvium driver on the CM4 in months 1-3."}
  - {id: LB-12, seat: aocs_engineer, decision: "decide:pugh T-08", title: "ADCS with star tracker",
     text: "0.1 deg knowledge needs a star tracker (CubeStar 0.02/0.06 deg 3 sigma); sun sensor + magnetometer gives about 0.2 deg and nothing in eclipse. Gen 2 CubeADCS (+0.20) selected over Gen 1 (obsolescence), iADCS200 (+0.10, price not published) second source. List build about USD 62k (53.5 k EUR), the largest single cost."}
  - {id: LB-13, seat: power_engineer, decision: "decide:pugh T-04", title: "Deployable wings",
     text: "Body-mounted panels give 3.98 W EOL at beta 15 deg against 5.0 W needed with margin: they close only with sun-pointing between passes. EXA DMSA wings (+0.65) give about 12.2 W EOL; EnduroSat double deployable (+0.50) is the documented fallback. DMSA mass and power datasheet requested."}
  - {id: LB-14, seat: power_engineer, decision: "decide:pugh T-05", title: "BP4 instead of BPX",
     text: "BP4 (+0.95): 258 g and 23.5 mm vs 500 g and 41 mm; a typical eclipse needs 1.7 Wh (3.9 % DoD on 43 Wh), the worst eclipse with a downlink and an acquisition 3.8 Wh (8.8 %). Recovers 0.24 kg and restores about 10 % stack-height margin."}
  - {id: LB-15, seat: power_engineer, decision: D-2.4-POWER, title: "Power allocation",
     text: "Spacecraft allocation 12.2 W EOL orbit-average generation. Load 4.17 W orbit average from the mode mix (nominal 85 / imaging 5 / downlink 9 / night SWIR 1 %), 5.00 W with 20 %: margin ratio 2.4. The downlink share rose to 9 % with the four-site network (125.7 min/day of transmission, about 6.9 Wh/day of TX). Peak 15.7 W in Imaging is within the P60 battery limit (4 A at 14.4 V)."}
  - {id: LB-16, seat: propulsion_engineer, decision: "decide:pugh T-06", title: "Drag sail",
     text: "ARTICA kept conditionally (ADEO-P -0.40, ADEO-C -0.15, Terminator Tape -0.10). Allocation 0.35U / 0.30 kg (config A). Config A is rated 2 years, so the team adds its own timer and battery with two release circuits (+0.08 kg). Asked NPC for FUTURA SM1 deployment evidence. Lifetime with sail 3.0 y nominal / 3.4 y weak cycle from 590 km; without sail 14-42 y."}
  - {id: LB-17, seat: comms_engineer, decision: "decide:pugh T-07", title: "Radio",
     text: "No catalogue unit is confirmed for 401 MHz TX at 38.4 kbps plus 449.75-450.25 MHz RX. Murgas (1 W, 38.4 kbps, 400-402 TX, 420-450 MHz RX) selected conditionally on confirmation of 450.25 MHz receive; AX100UL + R0405 scores +0.30 while that is unconfirmed and is the fallback; TRX-U is limited to 19.2 kbps. Encryption in the OBC (SDLS). Antenna: AntS with two dipoles (401.5 and 450 MHz)."}
  - {id: LB-18, seat: comms_engineer, decision: "analyses:link_budget", title: "Link budget",
     text: "Downlink 10 deg, 38.4 kbps, RS(255,223), 13 dBic ground antenna assumed: 1 W urban (700 K) +0.4 dB, 1 W rural (300 K) +4.0 dB, 2 W urban +3.4 dB; uncoded -4.2 dB. By site: Yellowknife, Iqaluit, Inuvik rural +4.0 dB (+6.0 dB with the 15 dBic 400CP24); Ottawa +0.4 dB unless the antenna is sited away from the urban core (SEG-GS-03). Uplink 25 W at 9.6 kbps: +10.3 to +14.2 dB. 76.8 kbps closes above about 30 deg (+2.5 dB)."}
  - {id: LB-19, seat: mission_analyst, decision: "equipment:ground", title: "Ground RF chain",
     text: "Common station: 401 MHz CP Yagi (M2 400CP24, 15 dBic) + 450 MHz CP Yagi, az/el rotator, filtered 400-406 MHz masthead LNA, 50 W PA run at <= 25 W, USRP B210, GPSDO. Northern sites: SPID BIG-RAS rotator in a heated housing and a short 401CP14 Yagi as winter spare. Amateur 70 cm antennas and LNAs do not cover 401 or 450 MHz; reuse SatNOGS software only."}
  - {id: LB-20, seat: structures_engineer, decision: "equipment:structure", title: "Structure",
     text: "Commercial frame selected from the KB: ISISPACE 3U structure (struct-isis-3u, 0.304 kg, about 4.9 k EUR list, 4-6 weeks, flight heritage since 2013, 12 PC/104 slots). EnduroSat 3U Structure II (0.285 kg) is the alternative. Off-the-shelf maturity margin 5 %."}
  - {id: LB-21, seat: structures_engineer, decision: "spacecraft:stack", title: "Accommodation and stack",
     text: "Stack about 295 mm of about 328 mm with BP4 (about 10 % margin). +Z is contested by the AntS, ARTICA, the GNSS patch and CubeStar; -Z holds the payload apertures. Resolution: star tracker on a long face (anti-sun side), GNSS patch on the zenith-facing long face, antennas in the DMSA wings or a side face; +Z kept for the sail. Layout approved."}
  - {id: LB-22, seat: cost_engineer, decision: "note", title: "Cost",
     text: "Flight hardware about 231 k EUR from researched list prices (108 k EUR), comparable-product list prices (21 k EUR), KB estimates where no price is public (85 k EUR) and team estimates for custom parts (17 k EUR); four ground RF chains about 44 k EUR. The tool BOM sums KB list prices and differs; both recorded. Working target 0.5 M EUR for space + ground hardware and tests."}
  - {id: LB-23, seat: team_leader, decision: "gate:MCR go/no-go", title: "MCR decision",
     text: "GO. All must-pass criteria met. Actions: radio receive-band confirmation (Comms & OBDH), ADCS Gen 2 quote (AOCS), ISED pre-consultation on 450 MHz (Comms & OBDH), RSSSA preliminary consultation (Team leader), DMSA datasheet (Power), NPC sail evidence (Propulsion), camera ECCN (Payload), compression ratio on simulated scenes (Payload), Ottawa antenna siting and northern-site noise surveys (Mission analysis & ops), cost model reconciliation (Cost & risk)."}
  - {id: LB-24, seat: payload_lead, decision: "note", title: "VNIR binning to the 60 m grid",
     text: "IMX542 QE is about 15 % at 865 nm. At native 32 m the burn SNR >= 30 holds only in summer; binned 2x2 to the 60 m grid it is 42-85 (burns) and 19-37 (water). All VNIR products are binned to the 60 m grid; a seasonal exposure table (about 1-1.5 ms over snow in spring) avoids saturation."}
  - {id: LB-25, seat: payload_lead, decision: "note", title: "Burn index caveat",
     text: "(NIR - SWIR1)/(NIR + SWIR1) is the NDMI/NDII moisture index, not NBR (which uses 2.2 um). In boreal black spruce the 1.6 um change after fire is smaller, so the burn signal is about half the dNBR range. Products are severity classes calibrated against Landsat/Sentinel-2 dNBR; the 0.08 bias target is relatively tight."}
  - {id: LB-26, seat: mission_analyst, decision: "note", title: "Roll pointing for revisit",
     text: "Over generic test points at 48-64 N: nadir-only imaging gives 2.7-3.2 looks per site per month; roll +-15 deg 5.5-6.7; roll +-30 deg 12.2-14.5 (mean gap 1.6-2.5 d). Roll +-30 deg with 60 s settle adopted (SEG-SS-02, ADC-PNT-02, MIS-COV-01); GSD stays within 75 m up to about 25 deg."}
  - {id: LB-27, seat: comms_engineer, decision: "note", title: "Data return",
     text: "Capacity 25.3 MB/day of frame data (125.7 min/day union, 30 s acquisition per window, 90 % availability, frame efficiency 0.821 at 38.4 kbps). Demand with per-pass HK profiles: real-time HK 1.27 + stored HK 0.73 + 13.54 MB of science on the channel (13 MB/day after compression, CFDP 0.96) = 15.54 MB/day, margin 38.5 %. Lossless CCSDS 121 compression (>= 1.3:1, goal 1.5:1) is required to fit the planned 10 quicklooks + 80 ROI pairs (16.7 MB raw) into 13 MB. At the 19.2 kbps fallback the science volume drops to about 9 MB/day (60 ROI pairs). The 13 MB/day target is an open PI decision: up to about 19.9 MB/day would still close with 10 % margin."}
  - {id: LB-28, seat: comms_engineer, decision: "tmtc:settings", title: "Housekeeping organisation and rate",
     text: "HK organised in PUS-C SIDs with per-SID, per-mode intervals (script/hk_sids.yaml): 10 routine SIDs each with a stored copy (SID+100), a beacon SID and an ADCS diagnostic SID 20/120 off by default; thermal once per minute; ADCS routine SID carries outputs only. Real time during contact: FULL profile 3.75 kbit/s designed, 4.8 kbit/s allocated (reserve for S5 bursts and growth), LEAN 0.56 kbit/s on payload-dump passes, +1.2 kbit/s with ADCS diagnostics. Stored HK 66 bit/s in the nominal mix, 0.73 MB/day incl. events; 16 MB HK store holds 22 days. Per pass the operators choose delayed HK (VC1) or payload (VC2) after real-time HK (VC0). The tool default of 2000 bit/s constant HK (21.6 MB/day) is not used."}
