# Northern Fire and Ice (NFI) - key numbers, single source of truth
# =================================================================
# A teaching mission concept for northern fire and ice monitoring; numbers are a frozen teaching baseline.
# Use these values in the textbooks, the video narration and the SpaceCDF example project. If a number in any
# other NFI file disagrees with this file, this file wins and the other file is the error.
#
# Conventions: MB = 1e6 bytes; kbps / bit/s are channel or information rates as labelled; k EUR = thousand euro.
# `src` says where each number came from:
#   calc/<script>      recomputed for this teaching baseline (scripts in calc/, outputs *.json next to them)
#   research:<note>    carried from the research notes behind the baseline (mission analysis, bus, payload);
#                      the orbit, links and decay did not change, so these were not re-run unless stated
#   kb:<id>            SpaceCDF knowledge-base entry (design/packages/spacecdf-kb, components on main)
#   decision           a design decision of the teaching baseline (see script/logbook.yaml)
# frozen: 2026-11-10; v2 (systems-engineering V pass) 2026-11-10 - changes listed in v2_changes at the end

