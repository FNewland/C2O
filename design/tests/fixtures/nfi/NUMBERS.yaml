  node: {value: "LTDN 10:30 (daylight pass descending); entered in the tool as LTAN 22:30", window: "09:30-13:30", src: decision}
  period_keplerian_min: {value: 96.48, src: calc/orbit1.py}
  period_nodal_min: {value: 96.60, src: calc/orbit1.py}
  revs_per_day: {value: 14.907, src: calc/orbit1.py}
  equator_track_spacing: {value_deg: 24.15, value_km: 2688, src: calc/orbit1.py}
  nearest_exact_repeat: {value: "164 rev / 11 d at 589.2 km (no exact repeat is maintained)", src: research:mission analysis §1.1}
  beta_deg_2030: {min: 16.3, max: 26.3, src: calc/orbit2.py}
  eclipse_min: {min: 34.0, max: 35.0, fraction_pct: [35.2, 36.2], eclipse_free_days: 0, src: calc/orbit2.py}
  ground_speed_km_s: {value: 6.93, src: research:payload §3.4}
  node_drift_per_0p1deg_inclination_error: {value: "18.5 min per year", src: research:mission analysis §1.1}
  inclination_tolerance_requested_deg: {value: 0.15, src: decision}

