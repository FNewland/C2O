pass_classes:   # per-pass downlink allocation; VC0 first, then the operator-selected VC1 (delayed HK) or VC2 (payload), then the other
  - {name: OPS, rule: "highest-elevation window that includes the Ottawa station, morning and evening clusters (2 per day)", rt_profile: FULL, delayed_hk: since_last_dump, payload: remaining_time, max_tcs: 150}
  - {name: DUMP, rule: "every other window >= 3 min", rt_profile: LEAN, delayed_hk: on_operator_request, payload: "priority queue: quicklooks > flagged ROIs > routine ROIs > full frames on request", max_tcs: 15}
  - {name: SHORT, rule: "windows < 3 min (0.53/day, 1.1 min/day)", rt_profile: LEAN, delayed_hk: event_store_only, payload: if_time_remains, max_tcs: 0}
  - {name: ANOMALY_SAFE, rule: "any pass while FDIR level >= 2 or in Safe", rt_profile: "FULL (Safe 2.0 kbit/s) + ADCS_DIAG if AOCS is involved", delayed_hk: all_newest_first, payload: deferred}
  - {name: LEOP_COMMISSIONING, rule: "every pass until the end of commissioning", rt_profile: "FULL + ADCS_DIAG on calibration days", delayed_hk: all, payload: test_images_only}

