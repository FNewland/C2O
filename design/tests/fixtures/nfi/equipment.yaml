      items:
        - {kb: adcs-cubespace-cubeadcs-gen2-3u, category: adcs_integrated, name: "CubeADCS Gen 2 (Core + 3x CW0017 + CR torquers + CubeStar)", qty: 1, mass_kg: 0.50, power_w: 1.2, trl: 9, maturity: OTS, cost_keur: 53.5, cost_basis: "list: sum of CubeSpace list items (Core USD 21,000; 3x CW0017; 3x CR0002; CubeStar+Earth bundle; CubeSense Sun; CubeMag Compact), about USD 62k"}
        - {kb: ss-cubespace-cubesense, name: "CubeSense Sun (fine sun sensor)", qty: 1, mass_kg: 0.03, power_w: 0.1, kb_fix: "Gen 2 CubeSense Sun is 15 g / 0.10 W; KB 0.03 kg / 0.15 W kept for mass (conservative)", trl: 9, maturity: OTS, cost_keur: 0.0, cost_basis: "included in the ADCS build price above"}
