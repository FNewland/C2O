# Northern Fire and Ice (NFI) teaching mission - product tree and equipment selections
# (Blocks tab + level-3 Equipment Catalog). A teaching mission concept for northern fire and ice
# monitoring; numbers are a frozen teaching baseline (../NUMBERS.yaml).
#
# kb: KB component id. Every id below was checked against
#   design/packages/spacecdf-kb/src/spacecdf_kb/data/components/*.yaml on main (2026-11-10), including the
#   categories adcs_integrated, deorbit_device, payload_optic and payload_controller.
# kb_fix: the KB entry still carries a value the research corrected; type the corrected value inline
#   (Mass / Average power) after selection.
# custom: no KB entry -> "+ Add Element" (Type component) with the given mass/power; set TRL through the API.
# power_w is the unit's ON power (what the Average power field should hold); orbit averages come from the
#   Modes tab. qty -> "Quantity: n" inline control.
# The camera KB entries already include lens + filter mass, so the payload_optic elements are entered with
#   Mass 0 (traceability only) to avoid double counting.
# maturity: OTS (off-the-shelf, 5 %), MOD (modified, 10 %), NEW (new development, 20 %) - mass maturity margin.
# cost_keur and cost_basis: researched list prices only. "list" = public list price (source in the research
#   notes); "list-comparable" = no public price, the list price of the nearest comparable product is carried;
#   "kb-est" = the KB's own estimate (no public price, quote needed); "est" = team estimate for a custom part.
#   Only researched list prices or flagged estimates are used.

spacecraft:
  name: "Northern Fire and Ice spacecraft"      # rename "Spacecraft" from the single-leo preset
  properties: {form_factor: 3U, material: "Al 7075", deployables: "2 solar wings (EXA DMSA), UHF dipoles (2), drag sail (ARTICA)"}
  subsystems:
    - name: Payload
      domain: payload
      seat: payload_lead
      properties: {gsd_m: 58.2, fov_deg: 14.56, spectral_bands: "NIR 865 nm (875/50 filter, VNIR camera binned to 60 m); SWIR 1610/90 nm (C-530 VSWIR)", shutter_control: "no", data_format: "12-bit raw; L1 60 m common grid; ROI 250x250 px and quicklooks, CCSDS 121 lossless", data_rate_mbps: 18.2, data_volume_gb_per_day: 1.1, duty_cycle: 0.05}
      items:
        - {kb: pl-av-alvium-1800c-530-vswir, name: "Alvium 1800 C-530 VSWIR (SWIR camera, 35 mm f/1.4, 1610/90 filter)", qty: 1, mass_kg: 0.19, power_w: 2.7, trl: 4, maturity: MOD, cost_keur: 17.0, cost_basis: "list-comparable: no public price; LUCID Atlas10 IMX992 camera list USD 18,500"}
        - {kb: pl-av-alvium-1800c-1620m, name: "Alvium 1800 C-1620m (VNIR camera, 50 mm f/2.4, 875/50 filter)", qty: 1, mass_kg: 0.13, power_w: 3.8, trl: 4, maturity: MOD, cost_keur: 1.57, cost_basis: "list-comparable: CSI-2 version not public; USB3 sibling U-1620m list EUR 1,570"}
        - {kb: pc-rpi-cm4, name: "Payload controller (Raspberry Pi CM4 on custom carrier)", qty: 1, mass_kg: 0.08, power_w: 3.0, power_note: "KB 7.0 W typical; type 3.0 W (imaging-session average; budget 3-5 W); peak 5 W in the Modes matrix", trl: 5, maturity: NEW, cost_keur: 1.1, cost_basis: "list: CM4 module about USD 50-100; est: carrier board about 1.0 k EUR"}
        - {kb: opt-kowa-lm35hc-sw, name: "SWIR lens Kowa LM35HC-SW 35 mm f/1.4", qty: 1, mass_kg: 0.0, power_w: 0, note: "mass carried in the camera entry", cost_keur: 2.29, cost_basis: "list-comparable: Kowa price on quote; Edmund #68-689 35 mm f/1.4 SWIR list EUR 2,286"}
        - {kb: opt-kowa-lm50ec-ir, name: "NIR lens Kowa LM50EC-IR 50 mm (F2.4 plate)", qty: 1, mass_kg: 0.0, power_w: 0, note: "mass carried in the camera entry", cost_keur: 0.8, cost_basis: "kb-est"}
        - {kb: opt-edmund-86-958, name: "NIR filter 875/50 nm (Edmund 86-958)", qty: 1, mass_kg: 0.0, power_w: 0, cost_keur: 0.28, cost_basis: "list: GBP 236"}
        - {custom: true, name: "SWIR filter 1610/90 nm (custom, OD4 400-1700 nm)", qty: 1, mass_kg: 0.0, power_w: 0, trl: 4, maturity: NEW, cost_keur: 1.5, cost_basis: "est (custom coating, quote needed)", note: "No KB entry (KB has only the 1550/50 opt-edmund-85-903); trade T-01 selected 1610 nm for cross-calibration with Sentinel-2 B11 / Landsat OLI B6"}
        - {custom: true, name: "Optical bench and baffles (Al)", qty: 1, mass_kg: 0.20, power_w: 0, trl: 4, maturity: NEW, cost_keur: 3.0, cost_basis: "est"}
        - {custom: true, name: "Payload harness", qty: 1, mass_kg: 0.05, power_w: 0, trl: 5, maturity: NEW, cost_keur: 0.5, cost_basis: "est"}
      sanity: {mass_kg: 0.65, peak_w: 11.5}
    - name: EPS
      domain: power
      seat: power_engineer
      properties: {bus_voltage_v: 14.4, sa_type: dual-deploy, battery_chemistry: Li-ion, duty_cycle: 1}
