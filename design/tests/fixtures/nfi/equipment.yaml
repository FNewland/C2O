ground_segment:   # full detail, contact statistics and RF chains in ground_stations.yaml
  stations:
    - {name: "GS Ottawa", lat: 45.42, lon: -75.69, rf_chain: south, kb_station: null}
    - {name: "GS Yellowknife", lat: 62.45, lon: -114.37, rf_chain: north, kb_station: null}
    - {name: "GS Iqaluit", lat: 63.75, lon: -68.52, rf_chain: north, kb_station: null}
    - {name: "GS Inuvik", lat: 68.36, lon: -133.72, rf_chain: north, kb_station: null}
  properties_all: {antenna_diameter_m: 1.8, antenna_note: "equivalent aperture of a 15 dBic Yagi at 401 MHz (eta 0.55); the field expects a dish diameter", min_elevation_deg: 10, bands: "UHF RX 401-402 MHz; UHF TX 449.75-450.25 MHz (fallback VHF 148-149.9 MHz)"}
  rf_chain_ref: "ground_stations.yaml -> rf_chains (south: Yaesu G-5500DC rotator; north: SPID BIG-RAS in a heated housing; all: M2 400CP24 RX, M2 450 MHz CP TX, filtered LNA, 50 W PA run at <= 25 W, USRP B210, GPSDO)"

operations:
  - {name: "Mission control centre (Ottawa, VPN to the remote sites)", domain: ground, custom: true, note: "Yamcs mission control system; SatNOGS-derived scheduling and tracking client at each site; 24/7 conjunction contact point"}

launch_segment:
  - {name: "Rideshare launch and 3U deployer", in_scope: false, note: "final vibration in the deployer by the launch provider; launch request: apogee <= 590 km incl. dispersion, inclination tolerance <= 0.15 deg"}
