        - {kb: bat-gom-nanopow-bp4, name: "NanoPower BP4 43 Wh (1P-4S, 12-16.8 V)", qty: 1, mass_kg: 0.258, power_w: 0.3, power_note: "integrated heater, thermostat average 0.3 W", trl: 9, maturity: OTS, cost_keur: 8.0, cost_basis: "kb-est"}
        - {kb: sp-exa-dmsa-3u-a, name: "EXA DMSA 3U/A deployable wing", qty: 2, mass_kg: 0.25, power_w: 0, trl: 9, maturity: OTS, note: "mass est.; datasheet requested", cost_keur: 12.2, cost_basis: "list range EUR 4.4-20k (cubesatshop); mid-range per wing carried"}
