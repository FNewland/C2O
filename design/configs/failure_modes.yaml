# Failure-mode library for the FMECA skeleton (deterministic; services/fmeca_library.py)
# ======================================================================================
# The FMECA *method* follows ECSS-Q-ST-30-02C (FMEA/FMECA, 6 March 2009). The scales,
# the numbers below and the failure modes themselves are C2O defaults compiled from
# common CubeSat practice: the ECSS text was not available to check the scale
# definitions, so nothing here is presented as a quotation of the standard.
#
# Scales (C2O default, compatible with the existing SpaceCDF FMECA table):
#   severity S 1..5 (5 = catastrophic: loss of mission or hazard), occurrence O 1..5,
#   detection D 1..5 (5 = undetectable). RPN = S x O x D.
# Adjustments applied per element (C2O default, same as services/fmeca_closure.py):
#   redundancy (redundancy_type set or quantity > 1) -> S - 1
#   TRL < 6 (from the KB part)                        -> O + 1
#   a data interface to the element (telemetry)       -> D - 1

sources:
  ecss_q_30_02:
    kind: standard
    short: "ECSS-Q-ST-30-02C (method)"
    title: "ECSS-Q-ST-30-02C Failure modes, effects (and criticality) analysis (method only)"
    verified: true
  c2o_default:
    kind: c2o_default
    title: "C2O default failure-mode library and scales (not a standard citation)"
    verified: false

severity_categories:     # S value -> label, C2O default wording
  source: c2o_default
  5: {en: "Catastrophic (loss of mission or safety hazard)", fr: "Catastrophique (perte de mission ou danger)"}
  4: {en: "Critical (loss of a primary objective)", fr: "Critique (perte d’un objectif principal)"}
  3: {en: "Major (degraded mission)", fr: "Majeure (mission dégradée)"}
  2: {en: "Minor (workaround exists)", fr: "Mineure (contournement possible)"}
  1: {en: "Negligible", fr: "Négligeable"}

critical_rpn: 60          # C2O default: rows at or above this RPN are flagged
single_point_severity: 4  # C2O default: S >= this without redundancy -> single-point failure

# How an element is matched to a library type: KB category first, then name keywords,
# then the subsystem domain. First match wins.
