       en: "Pre-course readiness quiz", fr: "Quiz de préparation pré-cours"}
  A2: {large: true, weight: {GNG3100: 15, SYS5186: 15}, los: [LO1, LO2, LO7], rubrics: ["1.1", "4.1", "4.4"],
       en: "Mission Concept Review (MCR, informal)", fr: "Examen du concept de mission (MCR, informel)"}
  A3: {large: false, weight: {GNG3100: 10, SYS5186: 5}, los: [LO2, LO4, LO5], rubrics: ["2.4"],
       en: "CDF daily worksheets and participation", fr: "Cahiers d’exercices CDF et participation"}
  A4: {large: true, weight: {GNG3100: 20, SYS5186: 22}, los: [LO2, LO3, LO4, LO5, LOG1, LOG2],
       rubrics: ["1.2", "3.1", "3.2", "3.4", "2.4", "4.4"],
       en: "Preliminary Design Review (PDR-style)", fr: "Revue de conception préliminaire (type PDR)"}
  A5: {large: false, weight: {GNG3100: 5, SYS5186: 2}, los: [LO6], rubrics: ["6.1"],
       en: "Operations training quiz", fr: "Quiz de formation aux opérations"}
  A6: {large: true, weight: {GNG3100: 15, SYS5186: 18}, los: [LO6, LO7, LOG2], rubrics: ["1.4", "2.3", "4.2", "3.3"],
       en: "Simulation performance — operator shift", fr: "Performance en simulation — quart d’opérateur"}
  A7: {large: true, weight: {GNG3100: 10, SYS5186: 10}, los: [LO6, LO7, LOG3], rubrics: ["4.4", "4.2"],
       en: "Observer critique report", fr: "Rapport de critique d’observateur"}
  A8: {large: true, weight: {GNG3100: 10, SYS5186: 5}, los: [LO4, LO6, LOG2], rubrics: ["1.3", "4.4"],
       en: "Final mission review", fr: "Revue finale de mission"}
  A9: {large: true, weight: {GNG3100: 10, SYS5186: 20}, los: [LO8, LOG3, LOG4], rubrics: ["6.2", "6.3", "4.3"],
       en: "Individual reflective portfolio", fr: "Portfolio réflexif individuel"}

