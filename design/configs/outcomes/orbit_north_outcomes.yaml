# The syllabus outcomes, numbered (LO 1–8 both codes; LO G1–G4 SYS 5186 only).
course_outcomes:
  LO1:  {clos: ["7.4", "6.1"], en: "Describe the Canadian space ecosystem and situate a mission concept in it.",
         fr: "Décrire l’écosystème spatial canadien et y situer un concept de mission."}
  LO2:  {clos: ["1.1", "1.2", "3.1", "5.1"], en: "Apply the SE scaffolding of a CDF: scope, ConOps, functional architecture, preliminary budgets.",
         fr: "Appliquer l’échafaudage d’ingénierie des systèmes d’un CDF : portée, ConOps, architecture fonctionnelle, bilans préliminaires."}
  LO3:  {clos: ["5.4", "4.3"], en: "Navigate Canadian satellite regulation well enough to know when professional advice is required.",
         fr: "Naviguer la réglementation canadienne des satellites assez bien pour savoir quand un avis professionnel est requis."}
  LO4:  {clos: ["2.4", "3.2", "4.2", "7.1"], en: "Contribute to a CDF intensive in a discipline role, delivering a complete preliminary design.",
         fr: "Contribuer à un intensif en CDF dans un rôle disciplinaire et livrer une conception préliminaire complète."}
  LO5:  {clos: ["3.4", "3.1"], en: "Maintain a risk register and a planning baseline in the CDF tool.",
         fr: "Tenir un registre des risques et une base de planification dans l’outil CDF."}
  LO6:  {clos: ["1.4", "2.3", "6.1"], en: "Execute operations procedures in mission control: nominal, planning and anomaly response.",
         fr: "Exécuter des procédures d’opérations en contrôle de mission : nominal, planification et réponse aux anomalies."}
  LO7:  {clos: ["4.2", "4.4"], en: "Collaborate in interdisciplinary teams; give and receive structured technical critique.",
         fr: "Collaborer en équipes interdisciplinaires ; donner et recevoir une critique technique structurée."}
  LO8:  {clos: ["6.2", "6.3", "4.3"], en: "Reflect critically on your own learning and on the ethics of space activity.",
         fr: "Réfléchir de façon critique à son apprentissage et à l’éthique de l’activité spatiale."}
  LOG1: {grad: true, clos: ["3.2", "3.1", "4.4"], en: "Evaluate architecture trade-offs quantitatively and defend them in writing and in review.",
         fr: "Évaluer quantitativement les compromis d’architecture et les défendre par écrit et en revue."}
  LOG2: {grad: true, clos: ["3.3", "1.2"], en: "Lead a sub-area of design and operations, coordinating others and managing interfaces.",
         fr: "Diriger un sous-domaine de la conception et des opérations, en coordonnant les autres et en gérant les interfaces."}
  LOG3: {grad: true, clos: ["6.2", "7.1"], en: "Synthesise simulation lessons into an improvement proposal grounded in SE and human-factors literature.",
         fr: "Synthétiser les leçons de la simulation en une proposition d’amélioration ancrée dans la littérature."}
  LOG4: {grad: true, clos: ["6.1", "6.2"], en: "Situate the course experience in a strand of the scholarly literature.",
         fr: "Situer l’expérience du cours dans une mouvance de la littérature scientifique."}

# Assessments, in syllabus order. large: true = students see the rubric link and level.
# rubrics: the program CLO rubrics the marker uses (the PLO each one rolls up to is implied).
assessments:
