# ORBIT NORTH (GNG 3100 / SYS 5186) — course learning outcomes tied to the Master of
# Systems Engineering program outcomes, and every assessment, worksheet, decision record,
# video and embedded question tied to both.
#
# Source of the program side: "Master of Systems Engineering — Program Learning Outcomes",
# draft 7 November 2026 (F. Newland, GPD): Senate PLOs 1–5 + PLO 6 (MASc / MEng), the
# reflective-practice thread (CLO 6.2 → GDLE 6), 28 CLOs + R.1, R.2, one five-level scale:
#   1 Initial thoughts · 2 First engagement · 3 Deeper engagement · 4 First leadership ·
#   5 Deeper leadership.
#
# Who sees what (ruling 2026-11-07): students see the course outcomes, and for the LARGE
# assessments the PLO / CLO rubrics and the level they are marked against. Worksheets,
# decision records, videos and their questions carry tags for the instructor only.
#
# Generated from this file: docs/orbit_north/OUTCOMES_MAP.md (+ fr/), by
# `python3 tools/gen_outcomes.py` (it also checks every ID below exists).

version: "2026-11-07 draft"

levels:
  1: {en: "Initial thoughts", fr: "Premières réflexions"}
  2: {en: "First engagement", fr: "Premier engagement"}
  3: {en: "Deeper engagement", fr: "Engagement approfondi"}
  4: {en: "First leadership", fr: "Premier leadership"}
  5: {en: "Deeper leadership", fr: "Leadership approfondi"}

# Target levels for the large assessments (ruling 2026-11-07).
targets:
  GNG3100: {level: 3, en: "Level 3 (Deeper engagement) is the target for an A.",
            fr: "Le niveau 3 (engagement approfondi) est la cible d’un A."}
  SYS5186: {level: 3, a_grade: 4,
            en: "Level 3 (Deeper engagement) is the baseline; an A shows a substantial share of Level 4 (First leadership).",
            fr: "Le niveau 3 (engagement approfondi) est le niveau de base ; un A montre une part importante de niveau 4 (premier leadership)."}

plos:
  PLO1: {en: "SE principles", fr: "Principes d’ingénierie des systèmes", gdle: [1, 3]}
  PLO2: {en: "Design, V&V", fr: "Conception, V&V", gdle: [2, 3]}
  PLO3: {en: "Communication", fr: "Communication", gdle: [5]}
  PLO4: {en: "Professional practice", fr: "Pratique professionnelle", gdle: [4]}
  PLO5: {en: "Interdisciplinary & digital (MBSE)", fr: "Interdisciplinarité et numérique (MBSE)", gdle: [1]}
  PLO6-MEng: {en: "Applied project", fr: "Projet appliqué", gdle: [3]}
  PLO6-MASc: {en: "Original research", fr: "Recherche originale", gdle: [2]}
  GDLE6: {en: "Reflective practice thread (limits of knowledge)", fr: "Fil de la pratique réflexive (limites des connaissances)", gdle: [6]}

# The program CLOs this course uses, with their home PLO. on_label: on the draft
# SYS 5186 Learning Facts label of 7 Nov 2026; false = proposed addition.
