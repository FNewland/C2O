    text: {en: 'Part C: Nominal Procedure', fr: 'Partie C : Procédure nominale'}
    kind: text
    prompt: {en: 'Write one nominal procedure for your mission (science observation or data downlink):',
      fr: 'Rédigez une procédure nominale pour votre mission (observation scientifique ou transmission
        de données au sol) :'}
    points:
    - {en: 'Procedure ID:', fr: 'ID de la procédure :'}
    - {en: 'Preconditions:', fr: 'Préconditions :'}
    - {en: 'Post-conditions:', fr: 'Postconditions :'}
  - id: D
    text: {en: 'Part D: Contingency Procedure', fr: 'Partie D : Procédure de contingence'}
    kind: text
    prompt: {en: 'Write one contingency procedure (e.g., safe mode recovery, communication loss recovery):',
      fr: 'Rédigez une procédure de contingence (p. ex. reprise après passage en mode survie, rétablissement
        après perte de communication) :'}
    points:
    - {en: 'Procedure ID:', fr: 'ID de la procédure :'}
    - {en: 'Trigger condition:', fr: 'Condition de déclenchement :'}
    - {en: 'Severity level: Green / Yellow / Orange / Red', fr: 'Niveau de gravité : vert / jaune / orange
        / rouge'}
    - {en: 'Escalation: If this procedure fails, escalate to:', fr: 'Escalade : si cette procédure échoue,
        faites remonter à :'}
    - {en: 'Post-conditions:', fr: 'Postconditions :'}
  - id: E
    text: {en: 'Part E: Operations Staffing', fr: 'Partie E : Effectifs d''exploitation'}
    kind: text
    prompt: {en: 'Estimate the staffing requirements for each mission phase:', fr: 'Estimez les effectifs
        nécessaires pour chaque phase de la mission :'}
  - id: F
    text: {en: 'Part F: Anomaly Scenario', fr: 'Partie F : Scénario d''anomalie'}
    kind: text
    prompt: {en: 'Hypothetical scenario: Your satellite enters Safe Mode during a weekend. The next ground
        contact is Monday morning (40 hours away). Walk through your response:', fr: 'Scénario hypothétique
        : votre satellite passe en mode survie pendant un week-end. Le prochain contact sol a lieu lundi
        matin (dans 40 heures). Déroulez votre réponse :'}
    points:
    - {en: 'What is the spacecraft doing in Safe Mode?', fr: 'Que fait l''engin spatial en mode survie
        ?'}
    - {en: 'Will it survive 40 hours? (Check power and thermal)', fr: 'Survivra-t-il 40 heures ? (Vérifiez
        la puissance et la thermique.)'}
    - {en: 'What telemetry will you review first on Monday?', fr: 'Quelle télémesure examinerez-vous en
        premier lundi ?'}
    - {en: 'What is your recovery plan?', fr: 'Quel est votre plan de reprise ?'}
  - id: notes
    text: {en: Notes & Reflections, fr: Notes et réflexions}
    kind: text
    prompt: {en: 'How much autonomy should your spacecraft have? Where is the line between onboard decision-making
        and ground control?', fr: 'Quel degré d''autonomie votre engin spatial doit-il avoir ? Où se situe
        la frontière entre la prise de décision à bord et le contrôle depuis le sol ?'}
