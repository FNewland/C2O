- id: LW-5.4
  number: '5.4'
  title: {en: Final Review & Presentations, fr: Revue finale et présentations}
  phase: debrief
  applies:
    tools: [design]
    steps: []
    tabs: [vv]
    levels: []
    gates: [pdr]
  questions:
  - id: A
    text: {en: 'Part A: Final Design Summary', fr: 'Partie A : Synthèse de la conception finale'}
    kind: text
    prompt: {en: 'Record the final state of your design from the SpaceCDF Dashboard:', fr: 'Relevez l''état
        final de votre conception dans le Dashboard de SpaceCDF :'}
    points:
    - {en: 'Do all budgets close? Y / N If not, which fail?', fr: 'Tous les bilans sont-ils bouclés ?
        O / N Sinon, lesquels ne le sont pas ?'}
    - {en: 'Number of unresolved conflicts:', fr: 'Nombre de conflits non résolus :'}
  - id: B
    text: {en: 'Part B: Documentation Checklist', fr: 'Partie B : Liste de vérification de la documentation'}
    kind: text
    prompt: {en: 'Tick each document generated from SpaceCDF Exports tab:', fr: 'Cochez chaque document
        généré depuis l''onglet Exports de SpaceCDF :'}
    points:
    - {en: 'Total documents generated:', fr: 'Nombre total de documents générés :'}
  - id: C
    text: {en: 'Part C: Presentation Outline', fr: 'Partie C : Plan de la présentation'}
    kind: text
    prompt: {en: 'Prepare your 12-minute final design review presentation:', fr: 'Préparez votre présentation
        de revue de conception finale de 12 minutes :'}
    points:
    - {en: 'Presenter(s):', fr: 'Présentateur(s) ou présentatrice(s) :'}
    - {en: 'Backup slides prepared on:', fr: 'Diapositives de secours préparées sur :'}
  - id: D
    text: {en: 'Part D: Peer Review Evaluation', fr: 'Partie D : Évaluation par les pairs'}
    kind: text
    points:
    - {en: 'Team being reviewed:', fr: 'Équipe évaluée :'}
    - {en: 'Reviewers:', fr: 'Évaluateurs :'}
    - {en: 'Presentation quality:', fr: 'Qualité de la présentation :'}
    - {en: 'Board recommendation: GO / NO GO / GO WITH ACTIONS', fr: 'Recommandation du comité : GO /
        NO GO / GO AVEC ACTIONS'}
    - {en: 'Action items for the presenting team:', fr: 'Actions pour l''équipe qui présente :'}
    - {en: 'Strongest aspect of this team''s design:', fr: 'Point fort principal de la conception de cette
        équipe :'}
    - {en: 'Biggest area for improvement:', fr: 'Principal axe d''amélioration :'}
  - id: E
    text: {en: 'Part E: Lessons Learned', fr: 'Partie E : Retour d''expérience'}
    kind: text
    points:
    - {en: 'What was the most challenging design decision your team faced?', fr: 'Quelle a été la décision
        de conception la plus difficile pour votre équipe ?'}
    - {en: 'What would you do differently if starting the course over?', fr: 'Que feriez-vous différemment
        si vous recommenciez le cours ?'}
    - {en: 'What does the design need next (Phase B activities)?', fr: 'De quoi la conception a-t-elle
        besoin maintenant (activités de phase B) ?'}
    - {en: 'What was the most valuable SpaceCDF feature?', fr: 'Quelle fonctionnalité de SpaceCDF vous
        a été la plus utile ?'}
    - {en: 'What feature was missing that you needed?', fr: 'Quelle fonctionnalité vous a manqué ?'}
    - {en: 'What concept from this course will you apply in your future work?', fr: 'Quelle notion de
        ce cours appliquerez-vous dans votre travail futur ?'}
  - id: F
    text: {en: 'Part F: Self-Assessment Rubric', fr: 'Partie F : Grille d''autoévaluation'}
    kind: text
    prompt: {en: 'Rate your own learning across the three weeks of the course. Be honest – this is for
        your own reflection, not grading.', fr: Évaluez vos propres apprentissages au cours des trois
        semaines du cours. Soyez honnête – cette grille sert à votre propre réflexion et n'est pas notée.}
    points:
    - {en: 'Scale: 1 = No familiarity, 2 = Basic awareness, 3 = Can apply with guidance, 4 = Can apply
        independently, 5 = Can teach others', fr: 'Échelle : 1 = aucune connaissance, 2 = notions de base,
        3 = capable d''appliquer avec un accompagnement, 4 = capable d''appliquer en autonomie, 5 = capable
        d''enseigner à d''autres'}
    - {en: 'Overall self-assessment:', fr: 'Autoévaluation globale :'}
    - {en: 'One thing I am most proud of from this course:', fr: 'Ce dont je suis le plus fier ou la plus
        fière dans ce cours :'}
  - id: notes
    text: {en: Notes & Reflections, fr: Notes et réflexions}
    kind: text
    prompt: {en: 'Final thoughts on the course, the design process, and what comes next:', fr: 'Dernières
        réflexions sur le cours, sur le processus de conception et sur la suite :'}
