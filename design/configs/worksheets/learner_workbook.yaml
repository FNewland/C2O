worksheets:
- id: LW-1.1
  number: '1.1'
  title: {en: Introduction to Space Mission Design, fr: Introduction à la conception de missions spatiales}
  phase: prep
  applies:
    tools: [design]
    steps: ['wizard:home']
    tabs: [blocks]
    levels: [0]
    gates: [mdr]
  questions:
  - id: A
    text: {en: 'Part A: The 17 SE Processes – SpaceCDF Mapping', fr: 'Partie A : Les 17 processus d''ingénierie
        système – correspondance avec SpaceCDF'}
    kind: text
    prompt: {en: 'For each NASA SE process (NPR 7123.1D), identify which SpaceCDF feature implements it.
        Write the tab name, button, or panel. If the process requires human judgment that the tool cannot
        automate, mark "Manual" in the last column.', fr: 'Pour chaque processus d''ingénierie système
        de la NASA (NPR 7123.1D), identifiez la fonctionnalité de SpaceCDF qui le met en œuvre. Indiquez
        le nom de l''onglet, du bouton ou du panneau. Si le processus exige un jugement humain que l''outil
        ne peut pas automatiser, inscrivez « Manuel » dans la dernière colonne.'}
    points:
    - {en: 'Reflection: Which processes are well-supported by the tool? Which ones fundamentally require
        human judgment and cannot be fully automated? Write your answer below:', fr: 'Réflexion : quels
        processus l''outil prend-il bien en charge ? Lesquels exigent fondamentalement un jugement humain
        et ne peuvent pas être entièrement automatisés ? Rédigez votre réponse ci-dessous :'}
  - id: B
    text: {en: 'Part B: Lifecycle Phase Identification', fr: 'Partie B : Identification des phases du
        cycle de vie'}
    kind: text
    prompt: {en: 'For each activity below, identify which NASA lifecycle phase (Pre-A through F) it belongs
        to and which review gate marks the end of that phase:', fr: 'Pour chacune des activités ci-dessous,
        indiquez à quelle phase du cycle de vie NASA (de pré-A à F) elle appartient et quel jalon de revue
        marque la fin de cette phase :'}
  - id: C
    text: {en: 'Part C: CDF Position Interaction Analysis', fr: 'Partie C : Analyse des interactions entre
        postes du CDF'}
    kind: text
    prompt: {en: 'For each design conflict below, identify which engineering positions must interact to
        resolve it. Then briefly describe how you would approach the resolution.', fr: 'Pour chacun des
        conflits de conception ci-dessous, identifiez les postes d''ingénierie qui doivent interagir pour
        le résoudre. Décrivez ensuite brièvement comment vous aborderiez sa résolution.'}
    points:
    - {en: 'Conflict 1: The payload requires 50 W but the solar array can only provide 30 W.', fr: 'Conflit
        1 : la charge utile demande 50 W, mais le générateur solaire ne peut fournir que 30 W.'}
    - {en: 'Conflict 2: The reaction wheel vibration exceeds the payload''s pointing stability requirement.',
      fr: 'Conflit 2 : les vibrations des roues de réaction dépassent l''exigence de stabilité de pointage
        de la charge utile.'}
    - {en: 'Conflict 3: The selected orbit (700 km) requires a propulsive deorbit for debris compliance,
        but there is no mass budget remaining for a propulsion system.', fr: 'Conflit 3 : l''orbite retenue
        (700 km) impose une désorbitation propulsive pour respecter les règles relatives aux débris, mais
        il ne reste aucune marge dans le bilan de masse pour un système propulsif.'}
    - {en: 'Conflict 4: The X-band downlink antenna pattern interferes with the payload''s sensitive optical
        receiver.', fr: 'Conflit 4 : le diagramme de rayonnement de l''antenne de liaison descendante
        en bande X interfère avec le récepteur optique sensible de la charge utile.'}
  - id: D
    text: {en: 'Part D: SpaceCDF Tool Exploration', fr: 'Partie D : Exploration de l''outil SpaceCDF'}
    kind: text
    prompt: {en: 'Navigate through the SpaceCDF tool and answer each question:', fr: 'Parcourez l''outil
        SpaceCDF et répondez à chaque question :'}
    points:
    - {en: 'How many KPI cards are shown on the Design Dashboard? List them by name:', fr: 'Combien de
        cartes d''indicateurs clés (KPI) le tableau de bord de conception (Design Dashboard) affiche-t-il
        ? Citez-les par leur nom :'}
    - {en: 'In the Gate Review tab, what are the MCR exit criteria? Which are auto-evaluated?', fr: 'Dans
        l''onglet Gate Review, quels sont les critères de sortie de la MCR ? Lesquels sont évalués automatiquement
        ?'}
    - {en: 'What engineering positions are available when starting a collaborative session?', fr: 'Quels
        postes d''ingénierie sont proposés au lancement d''une séance collaborative ?'}
    - {en: 'What workflow steps does SpaceCDF guide you through (from left to right)?', fr: 'Par quelles
        étapes du flux de travail SpaceCDF vous guide-t-il (de gauche à droite) ?'}
    - {en: 'In the Positions tab, find your assigned position. What key questions does it list?', fr: 'Dans
        l''onglet Positions, trouvez le poste qui vous est attribué. Quelles questions clés y sont énumérées
        ?'}
  - id: E
    text: {en: 'Part E: V-Model Sketch', fr: 'Partie E : Esquisse du cycle en V'}
    kind: text
    prompt: {en: 'In the space below, sketch the System-V model from memory. Label each level on both
        the left side (decomposition) and right side (integration). Draw the horizontal traceability arrows
        and label them.', fr: 'Dans l''espace ci-dessous, esquissez de mémoire le cycle en V. Nommez chaque
        niveau sur la branche gauche (décomposition) et sur la branche droite (intégration). Tracez les
        flèches de traçabilité horizontale et nommez-les.'}
  - id: notes
    text: {en: Notes & Reflections, fr: Notes et réflexions}
    kind: text
    prompt: {en: 'Record key points below, questions you want to follow up on, and connections to your
        mission concept:', fr: 'Notez ci-dessous les points clés, les questions que vous souhaitez approfondir
        et les liens avec votre concept de mission :'}
- id: LW-1.2
  number: '1.2'
  title: {en: Canadian Space Ecosystem & Regulatory Environment, fr: Écosystème spatial canadien et environnement
      réglementaire}
  phase: exercise
  applies:
    tools: [design]
    steps: []
    tabs: [requirements]
    levels: [0]
    gates: []
  questions:
  - id: A
    text: {en: 'Part A: Canadian Space Industry Mapping', fr: 'Partie A : Cartographie de l''industrie
        spatiale canadienne'}
    kind: text
    prompt: {en: 'For your team''s mission concept, identify potential Canadian industry partners at each
        tier. If no Canadian supplier exists for a capability, note what country you would source from
        and why.', fr: 'Pour le concept de mission de votre équipe, identifiez des partenaires industriels
        canadiens potentiels à chaque niveau. S''il n''existe aucun fournisseur canadien pour une capacité
        donnée, indiquez de quel pays vous vous approvisionneriez et pourquoi.'}
    points:
    - {en: 'Question: What CSA funding program(s) might support your mission? Why?', fr: 'Question : quel(s)
        programme(s) de financement de l''Agence spatiale canadienne (ASC) pourrai(en)t soutenir votre
        mission ? Pourquoi ?'}
  - id: B
    text: {en: 'Part B: RSSSA Compliance Assessment', fr: 'Partie B : Évaluation de la conformité à la
        LSTS'}
    kind: text
    prompt: {en: 'Answer the following questions for your team''s mission concept:', fr: 'Répondez aux
        questions suivantes pour le concept de mission de votre équipe :'}
    points:
    - {en: 'Does your mission involve any remote sensing of Earth (imaging, SAR, radiometry, etc.)?',
      fr: 'Votre mission comporte-t-elle une forme de télédétection de la Terre (imagerie, SAR, radiométrie,
        etc.) ?'}
    - {en: 'If yes, will the satellite be operated from Canada?', fr: 'Si oui, le satellite sera-t-il
        exploité depuis le Canada ?'}
    - {en: 'What RSSSA conditions might apply? (Check all that apply)', fr: 'Quelles conditions de la
        Loi sur les systèmes de télédétection spatiale (LSTS ; RSSSA en anglais) pourraient s''appliquer
        ? (Cochez toutes celles qui s''appliquent.)'}
    - {en: 'If your mission does NOT involve remote sensing, what other regulatory requirements apply?
        (e.g., spectrum licensing, export control)', fr: 'Si votre mission ne comporte PAS de télédétection,
        quelles autres exigences réglementaires s''appliquent ? (p. ex. attribution de licences de spectre,
        contrôle des exportations)'}
  - id: C
    text: {en: 'Part C: Spectrum Licensing Plan', fr: 'Partie C : Plan d''attribution des licences de
        spectre'}
    kind: text
    prompt: {en: 'Identify the frequency bands your mission will use and the licensing path for each:',
      fr: 'Identifiez les bandes de fréquences que votre mission utilisera et la démarche d''obtention
        de licence pour chacune :'}
    points:
    - {en: 'Question: How early in your project should you begin the spectrum licensing process? Why?',
      fr: 'Question : à quel stade de votre projet devez-vous engager la démarche de licence de spectre
        ? Pourquoi ?'}
  - id: D
    text: {en: 'Part D: Export Control Classification', fr: 'Partie D : Classification au titre du contrôle
        des exportations'}
    kind: text
    prompt: {en: 'List the 3 most critical components in your preliminary mission concept. For each, identify
        the likely export control classification:', fr: 'Énumérez les 3 composants les plus critiques
        de votre concept de mission préliminaire. Pour chacun, identifiez la classification probable au
        titre du contrôle des exportations :'}
    points:
    - {en: 'Question: If your mission includes a US-origin star tracker and you plan to launch on an Indian
        PSLV, what export control issues arise?', fr: 'Question : si votre mission comprend un senseur
        stellaire d''origine américaine et que vous prévoyez un lancement sur un PSLV indien, quels problèmes
        de contrôle des exportations se posent ?'}
  - id: E
    text: {en: 'Part E: Regulatory Timeline', fr: 'Partie E : Calendrier réglementaire'}
    kind: text
    prompt: {en: 'Based on your mission concept, estimate when each regulatory activity should begin and
        how long it will take. Mark the activities on the timeline below:', fr: 'À partir de votre concept
        de mission, estimez quand chaque activité réglementaire doit commencer et combien de temps elle
        prendra. Reportez les activités sur le calendrier ci-dessous :'}
    points:
    - {en: 'Question: Which regulatory activity is most likely to be on the critical path for your mission?
        Why?', fr: 'Question : quelle activité réglementaire a le plus de chances de se trouver sur le
        chemin critique de votre mission ? Pourquoi ?'}
  - id: notes
    text: {en: Notes & Reflections, fr: Notes et réflexions}
    kind: text
    prompt: {en: 'Record key points below, regulatory questions you need to research further, and implications
        for your mission design:', fr: 'Notez ci-dessous les points clés, les questions réglementaires
        que vous devez approfondir et leurs conséquences sur la conception de votre mission :'}
- id: LW-1.3
  number: '1.3'
  title: {en: International Standards for Space Systems, fr: Normes internationales pour les systèmes
      spatiaux}
  phase: exercise
  applies:
    tools: [design]
    steps: []
    tabs: [requirements, vv]
    levels: [0, 1, 4]
    gates: []
  questions:
  - id: A
    text: {en: 'Part A: Standard Applicability Matrix', fr: 'Partie A : Matrice d''applicabilité des normes'}
    kind: text
    prompt: {en: 'For your team''s mission concept, determine which ECSS and NASA standards apply. For
        each standard, decide whether it is fully applicable, partially applicable (with tailoring), or
        not applicable. Justify your decision.', fr: 'Pour le concept de mission de votre équipe, déterminez
        quelles normes ECSS et NASA s''appliquent. Pour chaque norme, décidez si elle est entièrement
        applicable, partiellement applicable (avec adaptation) ou non applicable. Justifiez votre décision.'}
    points:
    - {en: 'Question: What is the minimum set of standards your mission MUST comply with regardless of
        mission class?', fr: 'Question : quel est l''ensemble minimal de normes que votre mission DOIT
        respecter, quelle que soit sa classe ?'}
  - id: B
    text: {en: 'Part B: CDS Rev 14 Compliance Checklist', fr: 'Partie B : Liste de vérification de conformité
        à la CDS rév. 14'}
    kind: text
    prompt: {en: 'If your mission uses a CubeSat form factor, complete this compliance checklist. If not,
        skip to Part C.', fr: 'Si votre mission utilise un format CubeSat, remplissez cette liste de vérification
        de conformité. Sinon, passez à la partie C.'}
  - id: C
    text: {en: 'Part C: Debris Mitigation Compliance', fr: 'Partie C : Conformité en matière d''atténuation
        des débris'}
    kind: text
    prompt: {en: 'Complete the following debris mitigation assessment for your mission orbit:', fr: 'Effectuez
        l''évaluation suivante de l''atténuation des débris pour l''orbite de votre mission :'}
    points:
    - {en: 'Planned orbit altitude:', fr: 'Altitude d''orbite prévue :'}
    - {en: 'Estimated natural orbital lifetime (without propulsion):', fr: 'Durée de vie orbitale naturelle
        estimée (sans propulsion) :'}
    - {en: 'Compliance assessment:', fr: 'Évaluation de la conformité :'}
    - {en: 'If non-compliant with the 5-year FCC rule, what options exist?', fr: 'Si la mission n''est
        pas conforme à la règle FCC des 5 ans, quelles options s''offrent à vous ?'}
    - {en: 'Passivation plan (list all stored energy sources and how you will deplete them at end of life):',
      fr: 'Plan de passivation (énumérez toutes les sources d''énergie stockée et la manière dont vous
        les épuiserez en fin de vie) :'}
  - id: D
    text: {en: 'Part D: Structural Design Margins', fr: 'Partie D : Marges de dimensionnement structural'}
    kind: text
    prompt: {en: 'If your mission has preliminary structural design information, calculate the margin
        of safety:', fr: 'Si vous disposez d''informations préliminaires sur la conception structurale
        de votre mission, calculez la marge de sécurité :'}
    points:
    - {en: 'Worked example: For Al 7075-T6 ($\sigma_{yield}$ = 503 MPa), applied stress = 200 MPa, FoS
        (yield) = 1.25:', fr: 'Exemple résolu : pour l''Al 7075-T6 ($\sigma_{yield}$ = 503 MPa), contrainte
        appliquée = 200 MPa, FoS (limite d''élasticité) = 1,25 :'}
    - {en: 'Your calculation:', fr: 'Votre calcul :'}
  - id: E
    text: {en: 'Part E: SpaceCDF Compliance Panel', fr: 'Partie E : Panneau Compliance de SpaceCDF'}
    kind: text
    prompt: {en: 'Navigate to the Compliance panel in SpaceCDF and answer:', fr: 'Ouvrez le panneau Compliance
        de SpaceCDF et répondez :'}
    points:
    - {en: 'What is the debris mitigation compliance status for your mission?', fr: 'Quel est l''état
        de conformité de votre mission en matière d''atténuation des débris ?'}
    - {en: 'What orbital altitude would be needed to comply with the FCC 5-year rule WITHOUT propulsion?
        (Use the tool''s orbital lifetime calculator)', fr: 'Quelle altitude orbitale faudrait-il pour
        respecter la règle FCC des 5 ans SANS propulsion ? (Utilisez le calculateur de durée de vie orbitale
        de l''outil.)'}
    - {en: 'What standards has the tool automatically suggested for your mission type?', fr: 'Quelles
        normes l''outil a-t-il suggérées automatiquement pour votre type de mission ?'}
    - {en: 'Are there any compliance flags (warnings or errors) on your current design?', fr: 'Votre conception
        actuelle présente-t-elle des signalements de conformité (avertissements ou erreurs) ?'}
  - id: notes
    text: {en: Notes & Reflections, fr: Notes et réflexions}
    kind: text
    prompt: {en: 'Record key points about standards applicability, compliance challenges, and design implications
        for your mission:', fr: 'Notez les points clés concernant l''applicabilité des normes, les difficultés
        de conformité et les conséquences sur la conception de votre mission :'}
- id: LW-1.4
  number: '1.4'
  title: {en: 'Mission Needs, Trade Studies & Concept of Operations', fr: 'Besoins de mission, études
      de compromis et concept d''opérations'}
  phase: exercise
  applies:
    tools: [design]
    steps: ['wizard:problem', 'wizard:stakeholders', 'wizard:alternatives']
    tabs: [decide]
    levels: [0]
    gates: [mdr]
  questions:
  - id: A
    text: {en: 'Part A: Stakeholder Analysis Matrix', fr: 'Partie A : Matrice d''analyse des parties prenantes'}
    kind: text
    prompt: {en: 'Identify at least 4 stakeholders for your team''s mission. For each, capture their needs,
        constraints, priority, and influence level.', fr: 'Identifiez au moins 4 parties prenantes de
        la mission de votre équipe. Pour chacune, relevez ses besoins, ses contraintes, sa priorité et
        son niveau d''influence.'}
    points:
    - {en: 'Question: Which stakeholder has the most influence over your mission? Do any stakeholders
        have conflicting needs? If so, how might you resolve the conflict?', fr: 'Question : quelle partie
        prenante a le plus d''influence sur votre mission ? Certaines parties prenantes ont-elles des
        besoins contradictoires ? Si oui, comment pourriez-vous résoudre ce conflit ?'}
  - id: B
    text: {en: 'Part B: Problem Statement', fr: 'Partie B : Énoncé du problème'}
    kind: text
    prompt: {en: 'Write your team''s mission problem statement. It must answer all four questions: What
        is the problem? Who is affected? What is the impact? What constraints exist?', fr: 'Rédigez l''énoncé
        du problème de la mission de votre équipe. Il doit répondre aux quatre questions suivantes : quel
        est le problème ? Qui est concerné ? Quel est l''impact ? Quelles contraintes existent ?'}
    points:
    - {en: 'Problem Statement:', fr: 'Énoncé du problème :'}
    - {en: 'Peer Review Checklist (exchange with another team):', fr: 'Liste de vérification pour l''évaluation
        par les pairs (à échanger avec une autre équipe) :'}
  - id: C
    text: {en: 'Part C: Mission Objectives', fr: 'Partie C : Objectifs de mission'}
    kind: text
    prompt: {en: Write 2–3 mission objectives. Score each against the quality checklist., fr: Rédigez
        2 à 3 objectifs de mission. Évaluez chacun d'eux au regard de la liste de critères de qualité.}
    points:
    - {en: 'Objective 1:', fr: 'Objectif 1 :'}
    - {en: 'Objective 2:', fr: 'Objectif 2 :'}
    - {en: 'Objective 3 (optional):', fr: 'Objectif 3 (facultatif) :'}
  - id: D
    text: {en: 'Part D: MoE / MoP / TPM Trace', fr: 'Partie D : Traçabilité MoE / MoP / TPM'}
    kind: text
    prompt: {en: 'For your primary objective, trace the measurement hierarchy:', fr: 'Pour votre objectif
        primaire, retracez la hiérarchie des mesures :'}
    points:
    - {en: 'Objective:', fr: 'Objectif :'}
    - {en: 'MoE (Measure of Effectiveness – operational effectiveness from user perspective):', fr: 'MoE
        (mesure d''efficacité – efficacité opérationnelle du point de vue de l''utilisateur) :'}
    - {en: 'MoP (Measure of Performance – technical performance of the system):', fr: 'MoP (mesure de
        performance – performances techniques du système) :'}
    - {en: 'TPM (Technical Performance Measure – design parameter tracked during development):', fr: 'TPM
        (indicateur de performance technique – paramètre de conception suivi pendant le développement)
        :'}
  - id: E
    text: {en: 'Part E: Trade Study – Space vs Non-Space', fr: 'Partie E : Étude de compromis – solution
        spatiale ou non spatiale'}
    kind: text
    prompt: {en: Complete a trade study evaluating whether a dedicated satellite is the right solution
        for your mission need., fr: Réalisez une étude de compromis pour déterminer si un satellite dédié
        est la bonne solution au besoin de votre mission.}
    points:
    - {en: 'Decision statement:', fr: 'Énoncé de la décision :'}
    - {en: 'Alternatives:', fr: 'Solutions envisagées :'}
    - {en: 'Criteria and Weights (must sum to 1.0):', fr: 'Critères et pondérations (leur somme doit valoir
        1,0) :'}
    - {en: 'Scoring Matrix (normalised 0–1):', fr: 'Matrice de notation (normalisée de 0 à 1) :'}
    - {en: 'Result: The highest-scoring alternative is:', fr: 'Résultat : la solution qui obtient le meilleur
        score est :'}
    - {en: 'Decision statement (1 paragraph – include top 2 alternatives and why one was selected over
        the other):', fr: 'Énoncé de la décision (1 paragraphe – présentez les 2 meilleures solutions
        et expliquez pourquoi l''une a été préférée à l''autre) :'}
    - {en: 'Sensitivity check: If you increase the weight of your second-most-important criterion by 20%
        (and re-normalise), does the ranking change?', fr: 'Contrôle de sensibilité : si vous augmentez
        de 20 % la pondération de votre deuxième critère le plus important (puis renormalisez), le classement
        change-t-il ?'}
  - id: F
    text: {en: 'Part F: Concept of Operations Outline', fr: 'Partie F : Plan du concept d''opérations'}
    kind: text
    prompt: {en: 'Document your preliminary ConOps following the NASA SEH Appendix S structure:', fr: 'Documentez
        votre ConOps préliminaire en suivant la structure de l''annexe S du NASA SEH :'}
    points:
    - {en: '1. Mission Architecture:', fr: '1. Architecture de la mission :'}
    - {en: '2. Orbit-Average Power Budget:', fr: '2. Bilan de puissance moyenne sur l''orbite :'}
    - {en: '3. Data Budget:', fr: '3. Bilan de données :'}
  - id: G
    text: {en: 'Part G: SpaceCDF Tool Entry', fr: 'Partie G : Saisie dans l''outil SpaceCDF'}
    kind: text
    prompt: {en: 'In SpaceCDF, enter your mission need (Step 1) and concept (Step 2). Then answer:', fr: 'Dans
        SpaceCDF, saisissez votre besoin de mission (étape 1) et votre concept (étape 2). Répondez ensuite
        aux questions suivantes :'}
    points:
    - {en: 'In Step 1, did the tool auto-detect your mission type from the objective text? What type did
        it suggest?', fr: 'À l''étape 1, l''outil a-t-il détecté automatiquement votre type de mission
        à partir du texte de l''objectif ? Quel type a-t-il proposé ?'}
    - {en: 'In Step 2, run the mission trade analysis. Does the tool''s recommendation match your manual
        trade study result from Part E?', fr: 'À l''étape 2, lancez l''analyse de compromis de mission.
        La recommandation de l''outil correspond-elle au résultat de l''étude de compromis manuelle de
        la partie E ?'}
    - {en: 'In the ConOps tab, build your architecture diagram. How many systems did you define?', fr: 'Dans
        l''onglet ConOps, construisez votre schéma d''architecture. Combien de systèmes avez-vous définis
        ?'}
    - {en: 'In the Trade Studies tab, run an orbit selection trade with at least 3 orbit options. What
        orbit did it recommend?', fr: 'Dans l''onglet Trade Studies, lancez une étude de compromis de
        choix d''orbite comportant au moins 3 options d''orbite. Quelle orbite l''outil a-t-il recommandée
        ?'}
  - id: notes
    text: {en: Notes & Reflections, fr: Notes et réflexions}
    kind: text
    prompt: {en: 'Record key decisions made today, open questions, and what you want to investigate further:',
      fr: 'Notez les décisions clés prises aujourd''hui, les questions en suspens et ce que vous souhaitez
        approfondir :'}
- id: LW-2.1
  number: '2.1'
  title: {en: The System-V and Requirements Engineering, fr: Le cycle en V et l'ingénierie des exigences}
  phase: exercise
  applies:
    tools: [design]
    steps: []
    tabs: [requirements, trace]
    levels: []
    gates: [srr]
  questions:
  - id: A
    text: {en: 'Part A: System-V Mapping', fr: 'Partie A : Correspondance avec le cycle en V'}
    kind: text
    prompt: {en: 'For your mission, identify one element at each level of the V-model:', fr: 'Pour votre
        mission, identifiez un élément à chaque niveau du cycle en V :'}
  - id: B
    text: {en: 'Part B: Requirement Quality Assessment', fr: 'Partie B : Évaluation de la qualité des
        exigences'}
    kind: text
    prompt: {en: Evaluate each requirement using the SMART checklist and NASA Appendix C criteria. Mark
        Pass (P) or Fail (F). Rewrite any failures., fr: Évaluez chaque exigence à l'aide de la liste
        SMART et des critères de l'annexe C de la NASA. Indiquez Conforme (C) ou Non conforme (N). Réécrivez
        toute exigence non conforme.}
  - id: C
    text: {en: 'Part C: Requirement Hierarchy and Traceability', fr: 'Partie C : Hiérarchie et traçabilité
        des exigences'}
    kind: text
    prompt: {en: 'For your mission, write one requirement at each level. Draw the traceability chain.',
      fr: 'Pour votre mission, rédigez une exigence à chaque niveau. Tracez la chaîne de traçabilité.'}
    points:
    - {en: 'Stakeholder Objective (traces FROM):', fr: 'Objectif des parties prenantes (origine de la
        traçabilité) :'}
    - {en: Mission Requirement (MR-, fr: Exigence de mission (MR-}
