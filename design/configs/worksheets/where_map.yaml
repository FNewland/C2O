reverse:
  # Screens that ask for input no learner-workbook worksheet prepares the student for.
  - {screen: "Electrical (rails, power lines, LCL trip, on at separation / boot, inhibits)", target: electrical, prepared_by: "Worksheet 4.1 Part E touches bus voltage only", status: deferred, reason: "CDR-level electrical design; decision D-CDR-LOADSHED records it. A worksheet part belongs in a CDR extension of the workbook."}
  - {screen: "Data (buses, protocol, addresses, bit rate, redundancy)", target: databus, prepared_by: "Worksheet 4.1 Part E (protocol) only", status: deferred, reason: "CDR-level data-handling design; the textbook covers OBDH in §12.3."}
  - {screen: "TM/TC (APIDs, PUS services, housekeeping, telecommands, events, rate ladder)", target: tmtc.db, prepared_by: "Worksheet 3.3 Part E (modulation and coding) only", status: deferred, reason: "CDR model; decisions D-CDR-TMTCDB and D-3.3-LADDER record it. The ORBIT NORTH week-3 ops workbook uses the resulting database."}
  - {screen: "FDIR (monitors, event-actions, levels, ground limits)", target: fdir.monitors, prepared_by: "Worksheet 5.2 Part B (FDIR rules)", status: covered}
  - {screen: "AOCS modes (sensors, actuators, ωn, ζ, deadband, transitions)", target: aocs, prepared_by: "none", status: deferred, reason: "CDR-level AOCS design (D-CDR-AOCSMODES); textbook §10.3–10.5 gives the background."}
  - {screen: "Operations (console positions, GO/NO-GO matrix, flight rules)", target: ops, prepared_by: "Worksheet 5.2 Parts D–E", status: covered}
  - {screen: "Functions › Arcadia layers (OA/SA/LA/PA), ports and functional exchanges", target: functions, prepared_by: "Worksheet 2.2 covers the tree and allocation, not the layers or exchanges", status: deferred, reason: "MBSE extension beyond the three-week course; the textbook does not teach Arcadia layers."}
  - {screen: "Interfaces › Accept / Edit / Reject proposed links (ECSS-E-ST-10-24C natures)", target: interfaces, prepared_by: "Worksheet 2.4 Part C and decision D-2.4-INTERFACES", status: covered}
  - {screen: "ICD › exchange items (+ item)", target: icd, prepared_by: "none", status: deferred, reason: "Detail of the interface definition; Worksheet 2.4 Part C asks for interface requirements, which the ICD feeds."}
  - {screen: "Option (Baseline / branch) and Analyses › Compare options", target: analyses.design_loop, prepared_by: "Worksheet 2.3 Part E could use it", status: covered, note: "Worksheet 2.3 Part E now links the orbit trade; an option branch is the tool's way to try +100 km."}
  - {screen: "V&V › Review Gates › gate profile (Full ECSS, ESA IOD, C2O, NASA) and Start / Record go-no-go / Finish review", target: vv.gates, prepared_by: "Worksheet 4.4 Part E and decisions D-GATE-*", status: covered}
  - {screen: "Modes › share of orbit, pointing, daylight only, initial mode, transition guards", target: modes.machine, prepared_by: "Worksheet 5.2 Part A", status: covered}
  - {screen: "Blocks › In scope / Frozen / quantity / margin %", target: blocks.l0, prepared_by: "Worksheet 2.4 Part A (margins); freezing is a readiness check", status: covered}
  - {screen: "Decide › Decision Categorization (obvious / trade / design space)", target: decide.categorize, prepared_by: "none (read-only guidance)", status: covered, note: "Read-only; no input asked."}
  - {screen: "Analyses › Physics placement (positions, CoM, CP–CG offset)", target: analyses.physics, prepared_by: "none", status: deferred, reason: "Configuration and mass-properties work is PDR detail; textbook §12.1 covers CDS centre-of-mass limits."}
  - {screen: "Export › model exchange (Capella, ECSS-E-TM-10-25, ReqIF, SysML v2) and simulator configuration", target: export, prepared_by: "Worksheet 5.4 Part B lists documents only", status: deferred, reason: "Tool interoperability is outside the learner workbook; the simulator configuration is used in ORBIT NORTH week 3."}
