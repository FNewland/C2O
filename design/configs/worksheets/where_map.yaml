# Where each learner-workbook question and each catalogue decision is answered (Nov 2026 audit,
# docs/plan_2026-11/WORKSHEET_SCREEN_AUDIT_DESIGN.md). HAND-MAINTAINED.
#
#   targets    the SpaceCDF places a "where" link can open (a view, tab, level, section or anchor),
#              with the label the logbook shows. Labels use the screen's own words (EN and FR UI
#              strings); tests/test_logbook/test_where_map.py checks every tab, section, anchor and
#              label against the frontend.
#   links      external open-access references (https only; hosts on the allow-list in
#              frontend/src/where/links.ts). Each was opened and checked on `checked`.
#              docs/plan_2026-11/EXTERNAL_LINKS_DESIGN.md is generated from this list.
#   parts      one entry per worksheet question (learner_workbook.yaml id "LW-x.y/q"):
#                before   audit status before the Nov 2026 fixes
#                status   audit status now
#                where    target ids (shown as "Where in SpaceCDF" links, in this order)
#                book     sections of the open textbook "Concurrent Spacecraft Design" (docs/oer)
#                links    external link ids
#                gap/fix  what was missing and what was done; reason: why an item stays deferred
#   decisions  per catalogue decision: where (defaults to its workbook part's where), links.
#   reverse    screens that ask for input no worksheet prepares the student for.
#
# Status vocabulary:
#   screen        answerable from SpaceCDF screens          (needs where)
#   screen+book   screens plus the textbook / hand work     (needs where and book)
#   book          textbook and hand calculation only        (needs book)
#   team          team or personal work, no tool needed (sketch, presentation, review, reflection)
#   ops           answered in the ORBIT NORTH ops simulator, not in SpaceCDF
#   partial       (before only) part answerable, part not
#   gap           (before only) the question names a screen or value SpaceCDF does not have
#   deferred      still not answerable from the tool; `reason` says why
#
# scripts/gen_worksheets.py copies where/book/links into learner_workbook.yaml (generated);
# scripts/gen_ws_audit.py writes the two docs/plan_2026-11 tables from this file.

