parts:
  # ── 1.1 Introduction ─────────────────────────────────────────────────────────
  LW-1.1/A:
    before: partial
    status: screen+book
    where: [guide, requirements.l0, functions, interfaces, decide.pugh, analyses.design_loop, vv.gates, vv.risks]
    book: ["1.3", "1.6"]
    links: [nasa-seh]
    gap: Nothing maps the 17 processes to SpaceCDF; students had to explore blind.
    fix: Where-links to the screens that carry most processes; textbook §1.6 walks the lifecycle in the tool.
  LW-1.1/B:
    before: book
    status: screen+book
    where: [vv.gates]
    book: ["1.4"]
    links: [nasa-seh]
    fix: V&V › Review Gates shows the gate sequence of the study's profile (MDR → PRR → SRR → PDR → CDR, NASA names selectable).
  LW-1.1/C:
    before: book
    status: book
    book: ["1.5", "21"]
    links: [esa-cdf]
    fix: Textbook §1.5 and the position reference (chapter 21); ESA CDF page for the real facility.
  LW-1.1/D:
    before: gap
    status: screen
    where: [readiness, vv.gates, wizard.architecture, guide]
    gap: Asked for a "Design Dashboard" with KPI cards, a "Gate Review tab" with MCR criteria, a "Positions tab"; none exist under those names.
    fix: Reworded (EN+FR) to the readiness checklist, V&V › Review Gates (MDR), Team size (seats) and the Guide.
