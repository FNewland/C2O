# Gate Review Exit Criteria
#
# Each canonical gate (ECSS-M-ST-10C Rev.1 project reviews up to PDR) has structured exit
# criteria with specific questions, required evidence, and auto-evaluation rules. Aligned
# with NASA SEH §3.3-3.5 and ECSS-M-ST-10C Rev.1. Which gates a study actually holds, and
# what they are called, is set by its gate profile (configs/gate_profiles.yaml): full ECSS
# (default), ESA IOD CubeSat, C2O three-gate, or the NASA vocabulary skin.
#
# Nov 2026 (REDESIGN_DECISIONS.md ruling 3): the Phase 0 gate is the MDR (Mission Definition
# Review). It was called "MCR" (NASA vocabulary; in ECSS, MCR is the Phase F close-out
# review). Criterion ids MCR-EC-nn became MDR-EC-nn; `aliases` keeps the old ids and gate
# name working for stored data and old links.
#
# Status modes:
#   auto   — SpaceCDF can evaluate from the data model
#   manual — Requires human assessment / sign-off
#   hybrid — Auto-evaluated with human override
#
# Per criterion (Nov 2026, WP6):
#   owner_seat  the seat that closes it (seat ids of configs/worksheets/decision_catalogue.yaml)
#   step        the workflow step that produces the evidence (gate_profiles.yaml `steps`)
#   fix         where the "Fix" link opens in today's workbench: a panel id
#               (blocks, budget, requirements, functions, interfaces, decide, analyses)
#               or vv:<section> (vv:risks); omitted when no screen can change it yet

aliases:
  gates: {MCR: MDR}
  phases: {pre_phase_a: phase_0}
  criteria_prefix: {MCR-EC-: MDR-EC-}

phases:
  phase_0:
    gate: MDR
    gate_name: "Mission Definition Review"
    purpose: >
      Validate the mission need, the stakeholders and objectives, and that a feasible
      mission concept has been selected against its alternatives (end of Phase 0).
    authority: "Customer / Programme Manager"
    exit_criteria:
      # --- Mission Need ---
      - id: MDR-EC-01
        question: "Is the mission need clearly defined and justified?"
        category: mission_need
        evidence: "mission_need.problem_statement is not empty"
        status: auto
        priority: must_pass
        owner_seat: team_leader
        step: S1

      - id: MDR-EC-02
        question: "Are the key stakeholders identified with their needs and constraints?"
        category: mission_need
        evidence: "mission_need.stakeholders has >= 1 entry"
        status: auto
        priority: must_pass
        owner_seat: team_leader
        step: S2

      - id: MDR-EC-03
        question: "Are mission objectives defined with measurable success criteria?"
        category: mission_need
        evidence: "mission_need.objectives has >= 1 primary objective with measurable_criterion"
        status: auto
        priority: must_pass
        owner_seat: team_leader
        step: S3

      # --- Alternatives ---
      - id: MDR-EC-04
        question: "Have alternative solutions been considered, including non-space options?"
        category: alternatives
        evidence: "mission_need.alternatives_considered has >= 2 entries including at least one non-space type"
        status: auto
        priority: must_pass
        owner_seat: systems_engineer
        step: S4

      - id: MDR-EC-05
        question: "Is the selected concept justified against the alternatives?"
        category: alternatives
        evidence: "mission_need.selected_alternative_id is set and selection_rationale is not empty"
        status: auto
        priority: must_pass
        owner_seat: systems_engineer
        step: S4

      # --- ConOps ---
      - id: MDR-EC-06
        question: "Is a preliminary Concept of Operations documented?"
        category: conops
        evidence: "mission_need.conops_summary is not empty"
        status: auto
        priority: should_pass
        owner_seat: mission_analyst
        step: S5

      # --- Feasibility ---
      - id: MDR-EC-07
        question: "Has a feasible system concept been identified?"
        category: feasibility
        evidence: "Design converges with positive mass and power margins"
        status: auto
        priority: must_pass
        owner_seat: systems_engineer
        step: S4
        fix: analyses

      - id: MDR-EC-08
        question: "Are preliminary cost and schedule estimates within constraints?"
        category: feasibility
        evidence: "cost.total_meur <= target_cost_meur (if target set)"
        status: auto
        priority: should_pass
        owner_seat: team_leader
        step: S6
        fix: analyses

      # --- Risk ---
      - id: MDR-EC-09
        question: "Have initial technical risks been identified?"
        category: risk
        evidence: ">= 1 risk in the study's risk register (or found by the risk analysis)"
        status: auto
        priority: should_pass
        owner_seat: team_leader
        step: S6
        fix: vv:risks

      - id: MDR-EC-10
        question: "Is the mission concept compatible with debris mitigation requirements?"
        category: sustainability
        evidence: "debris.compliance_score >= 50"
        status: auto
        priority: should_pass
        owner_seat: mission_analyst
        step: S1
        fix: analyses

      # wave 3 (3.R4): the SE deliverables of the phase (services/se_deliverables, agent S); a
      # warning by default (PI ruling), blocking when the instructor sets the deliverable checks to
      # block; the instructor may sign it off
      - id: MDR-SE-01
        question: "Are the systems-engineering deliverables of this phase ready?"
        category: se_process
        evidence: "Every deliverable the SE protocol (configs/se_protocol.yaml) asks of the phase is ready (state ok)"
        status: hybrid
        priority: should_pass
        owner_seat: systems_engineer
        step: S6

  phase_a:
    gate: PRR
    gate_name: "Preliminary Requirements Review"
    purpose: >
      Confirm one mission concept, its preliminary technical requirements, the product and
      function trees, budgets that close with the Phase A margins, and the ground segment
      (end of Phase A).
    authority: "Customer / Project Manager"
    exit_criteria:
      - id: PRR-EC-01
        question: "Is one system concept selected and justified against at least two alternatives?"
        category: alternatives
        evidence: "selected_alternative_id and selection_rationale set; >= 2 alternatives_considered"
        status: auto
        priority: must_pass
        owner_seat: systems_engineer
        step: S4

      - id: PRR-EC-02
        question: "Is the mission analysis baselined (orbit, lifetime)?"
        category: mission_analysis
        evidence: "study.requirements.orbit has an orbit type, an altitude > 0 and a mission duration"
        status: auto
        priority: must_pass
        owner_seat: mission_analyst
        step: A1
        fix: decide

      - id: PRR-EC-03
        question: "Is the function tree defined?"
        category: functions
        evidence: ">= 1 function in the study's function tree, and every leaf function allocated to an element"
        status: auto
        priority: should_pass
        owner_seat: systems_engineer
        step: B2
        fix: functions

      - id: PRR-EC-04
        question: "Is the product tree defined down to subsystems?"
        category: product_tree
        evidence: "the space segment has >= 1 system and >= 1 subsystem"
        status: auto
        priority: must_pass
        owner_seat: systems_engineer
        step: A3
        fix: blocks

      - id: PRR-EC-05
        question: "Do the mass and power budgets close with the Phase A system margin?"
        category: budgets
        evidence: "dry mass × (1 + PRR system margin) <= mass target AND power demand × (1 + PRR system margin) <= EOL array power (margin_policy.yaml system_margin_ladder)"
        status: auto
        priority: must_pass
        owner_seat: systems_engineer
        step: A6
        fix: budget

      - id: PRR-EC-06
        question: "Are the preliminary technical requirements written, with a verification method each?"
        category: requirements
        evidence: ">= 1 mission and >= 1 system requirement; every requirement has a verification method"
        status: auto
        priority: must_pass
        owner_seat: systems_engineer
        step: B1
        fix: requirements

      - id: PRR-EC-07
        question: "Is the technology readiness of the selected equipment listed?"
        category: technology
        evidence: "every selected component has a TRL"
        status: hybrid
        priority: should_pass
        owner_seat: systems_engineer
        step: C1
        fix: blocks

      - id: PRR-EC-08
        question: "Is the model philosophy and verification approach defined?"
        category: verification
        evidence: "Manual: model philosophy (protoflight by default for IOD CubeSats) and AIV approach drafted"
        status: manual
        priority: should_pass
        owner_seat: systems_engineer
        step: C3

      - id: PRR-EC-09
        question: "Is the ground segment identified?"
        category: ground_segment
        evidence: ">= 1 ground station in the study or a ground segment element"
        status: auto
        priority: should_pass
        owner_seat: mission_analyst
        step: A5
        fix: blocks

      - id: PRR-EC-10
        question: "Is the risk register updated for the selected concept?"
        category: risk
        evidence: ">= 1 risk in the study's risk register"
        status: auto
        priority: should_pass
        owner_seat: team_leader
        step: S6
        fix: vv:risks

      - id: PRR-EC-11
        question: "Is the cost estimate within the target?"
        category: cost
        evidence: "cost.total_meur <= target_cost_meur (if target set)"
        status: auto
        priority: should_pass
        owner_seat: team_leader
        step: A6
        fix: analyses

      - id: PRR-EC-12
        question: "Does the orbit meet the debris-mitigation lifetime rules?"
        category: sustainability
        evidence: "debris.compliance_score >= 50"
        status: auto
        priority: should_pass
        owner_seat: mission_analyst
        step: A1
        fix: analyses

      # wave 3 (3.R4): the SE deliverables of the phase (services/se_deliverables, agent S); a
      # warning by default (PI ruling), blocking when the instructor sets the deliverable checks to
      # block; the instructor may sign it off
      - id: PRR-SE-01
        question: "Are the systems-engineering deliverables of this phase ready?"
        category: se_process
        evidence: "Every deliverable the SE protocol (configs/se_protocol.yaml) asks of the phase is ready (state ok)"
        status: hybrid
        priority: should_pass
        owner_seat: systems_engineer
        step: S6

  phase_b1:
    gate: SRR
    gate_name: "System Requirements Review"
    purpose: >
      Evaluate whether the functional and performance requirements are complete,
      feasible, and traceable to mission objectives. Confirm readiness to
      proceed to preliminary design.
    authority: "Project Manager / Chief Engineer"
    exit_criteria:
      - id: SRR-EC-01
        question: "Are all mission objectives traced to system requirements?"
        category: traceability
        evidence: "Every objective has at least one traced_to_requirement"
        status: auto
        priority: must_pass
        owner_seat: systems_engineer
        step: B1
        fix: requirements

      - id: SRR-EC-02
        question: "Are system requirements complete, verifiable, and non-conflicting?"
        category: requirements
        evidence: "Every requirement (below the objectives; interface requirements apart) has a verification_method and a threshold (number, range or date) or an acceptance criterion (test, inspection or review of the statement; analysis of a pass/fail statement)"
        status: auto
        priority: must_pass
        owner_seat: systems_engineer
        step: B1
        fix: requirements

      - id: SRR-EC-03
        question: "Is the requirements compliance matrix populated?"
        category: verification
        evidence: "Compliance matrix has >= 80% verified or marginal"
        status: auto
        priority: must_pass
        owner_seat: systems_engineer
        step: B1
        fix: requirements

      - id: SRR-EC-04
        question: "Have all engineering positions answered their key questions?"
        category: positions
        evidence: "Every seat decision the decision catalogue makes due at the SRR is recorded in a logbook of the team (Record decision); without a logbook, the must-answer position questions"
        status: auto
        priority: should_pass
        owner_seat: team_leader
        step: B1

      - id: SRR-EC-05
        question: "Are cross-position conflicts identified and resolved or accepted?"
        category: conflicts
        evidence: "No critical conflicts unresolved"
        status: auto
        priority: must_pass
        owner_seat: systems_engineer
        step: A4
        fix: analyses

      - id: SRR-EC-06
        question: "Does the design close within mass, power, and cost budgets?"
        category: budgets
        evidence: "dry mass × (1 + SRR system margin) <= mass target AND power demand × (1 + SRR system margin) <= EOL array power (margin_policy.yaml system_margin_ladder)"
        status: auto
        priority: must_pass
        owner_seat: systems_engineer
        step: A6
        fix: budget

      - id: SRR-EC-07
        question: "Is the Verification and Validation approach defined?"
        category: verification
        evidence: "VP document can be generated (compliance pipeline operational)"
        status: auto
        priority: should_pass
        owner_seat: systems_engineer
        step: C3

      - id: SRR-EC-08
        question: "Are technology readiness levels acceptable for the target phase?"
        category: technology
        evidence: "No subsystem below TRL 4 for Phase B entry"
        status: hybrid
        priority: should_pass
        owner_seat: systems_engineer
        step: C1
        fix: blocks

      - id: SRR-EC-09
        question: "Has the Systems Engineering Management Plan been baselined?"
        category: management
        # wave 3 (PI addendum): the SEMP generated from the study (X 3.X3) and issued by the team
        # (POST /studies/{sid}/semp/issue); content ready but not issued stays manual (sign-off)
        evidence: "SEMP generated from the study (organisation, life cycle and gates, technical processes, configuration management, tailoring) and issued"
        status: hybrid
        priority: must_pass
        owner_seat: team_leader
        step: S0.1

      - id: SRR-EC-10
        question: "Is the mission sustainable (debris, EOL, casualty risk)?"
        category: sustainability
        # wave 3 (PI addendum): the debris assessment run in the tool and accepted (L 3.L8) when
        # the study has the evidence collection; the design-loop scores otherwise
        evidence: "Debris assessment (lifetime, casualty risk, collision probability) run on the current design and accepted at or before the SRR; else sustainability.score >= 55 AND debris.casualty_compliant == 1"
        status: auto
        priority: must_pass
        owner_seat: mission_analyst
        step: A1
        fix: analyses

      - id: SRR-EC-11
        question: "Does every requirement below mission level flow down from a parent requirement?"
        category: traceability
        evidence: "Every segment, system and subsystem requirement has a parent (parent_id or a derives relation)"
        status: auto
        priority: should_pass
        owner_seat: systems_engineer
        step: B1
        fix: requirements

      # wave 3 (3.R4, SE-04a): function ↔ requirement coverage (GET …/requirements/function-coverage)
      - id: SRR-EC-12
        question: "Is every leaf function covered by a requirement, and does every space subsystem have requirements?"
        category: functions
        evidence: "Every leaf function has a requirement (satisfies relation) and every space subsystem has at least one requirement allocated to it"
        status: auto
        priority: should_pass
        owner_seat: systems_engineer
        step: B2
        fix: requirements

      # wave 3 (3.R4, SE-07a): validation planned with the stakeholders (agent S, validation coverage)
      - id: SRR-EC-13
        question: "Does every primary objective have a validation activity performed by a stakeholder?"
        category: validation
        evidence: "Every primary objective of the mission need has at least one validation activity whose performer is a stakeholder"
        status: auto
        priority: should_pass
        owner_seat: team_leader
        step: B1

      # wave 3 (3.R4): the SE deliverables of the phase (services/se_deliverables, agent S); a
      # warning by default (PI ruling), blocking when the instructor sets the deliverable checks to
      # block; the instructor may sign it off
      - id: SRR-SE-01
        question: "Are the systems-engineering deliverables of this phase ready?"
        category: se_process
        evidence: "Every deliverable the SE protocol (configs/se_protocol.yaml) asks of the phase is ready (state ok)"
        status: hybrid
        priority: should_pass
        owner_seat: systems_engineer
        step: B1

  phase_b:
    gate: PDR
    gate_name: "Preliminary Design Review"
    purpose: >
      Evaluate whether the preliminary design meets requirements and can
      proceed to detailed design. Confirm the design baseline is adequate.
    authority: "Project Manager / Standing Review Board"
    exit_criteria:
      - id: PDR-EC-01
        question: "Does the preliminary design satisfy all system requirements?"
        category: design
        evidence: "All requirements compliant or marginal with plan to close"
        status: auto
        priority: must_pass
        owner_seat: systems_engineer
        step: C2
        fix: requirements

      - id: PDR-EC-02
        question: "Are interface requirements defined between all subsystems?"
        category: interfaces
        evidence: "Every subsystem has its expected power, data, mechanical and thermal links (configs/interface_rules.yaml coverage) and no suggested link is left unreviewed; then every ICD under issue control is at Issue A or later and signed by both owning seats (wave 3, ICD issue control), or, with no ICD under issue control, every accepted link has an approved interface requirement agreed by both parties"
        status: auto
        priority: must_pass
        owner_seat: systems_engineer
        step: B3
        fix: interfaces

      - id: PDR-EC-03
        question: "Are all subsystem mass, power, and data margins positive?"
        category: budgets
        evidence: "dry mass × (1 + PDR system margin) <= mass target AND power demand × (1 + PDR system margin) <= EOL array power (margin_policy.yaml system_margin_ladder)"
        status: auto
        priority: must_pass
        owner_seat: systems_engineer
        step: A6
        fix: budget

      - id: PDR-EC-04
        question: "Has equipment been selected for all critical subsystems?"
        category: equipment
        evidence: "At least one KB component selected in each subsystem"
        status: hybrid
        priority: should_pass
        owner_seat: systems_engineer
        step: C1
        fix: blocks

      - id: PDR-EC-05
        question: "Is the reliability analysis acceptable?"
        category: reliability
        evidence: "reliability.mission_reliability >= reliability_target, over the mission-success horizon of the reliability analysis; FMEA covering every space subsystem, critical rows linked to FDIR, a risk or a mitigation"
        status: auto
        priority: must_pass
        owner_seat: systems_engineer
        step: C2
        fix: analyses

      # W3.05 (HK §8.5): the data return is a PDR driver for a store-and-forward mission
      - id: PDR-EC-06
        question: "Does the daily data budget (housekeeping + science) close with margin, and do the stores hold the required days?"
        category: budgets
        evidence: "Daily closure, diagnostics-campaign case (C2, else the baseline): capacity of the union of the passes against real-time HK + stored HK + science on the channel, margin >= the gate's daily margin (cdr_rules.yaml daily_margin_percent); every sized HK store holds min_store_days at its worst sizing rate with the storage margin (services/data_budget.gate_check, C2O default)"
        status: auto
        priority: must_pass
        owner_seat: mission_analyst
        step: A6
        fix: tmtc

      # wave 3 (3.R4, SE-05): the allocated baseline (allocation ledger, agent A; rule AR-01, agent R)
      - id: PDR-EC-07
        question: "Are the mass and power allocations agreed by their owners, covered by requirements and within the limits with the system margin?"
        category: budgets
        evidence: "Every space subsystem (a harness carried as an allowance apart) has a mass and an orbit-average power line agreed by its owner seat; the sum of the allocations × (1 + system margin) is within the limit (the system closure requirement, else the mass limit and EOL generation); every line is covered by a requirement"
        status: auto
        priority: must_pass
        owner_seat: systems_engineer
        step: A6
        fix: budget

      # wave 3 (3.R4, SE-04a): function ↔ requirement coverage (GET …/requirements/function-coverage)
      - id: PDR-EC-08
        question: "Is every leaf function covered by a requirement, and does every space subsystem have requirements?"
        category: functions
        evidence: "Every leaf function has a requirement (satisfies relation) and every space subsystem has at least one requirement allocated to it"
        status: auto
        priority: must_pass
        owner_seat: systems_engineer
        step: B2
        fix: requirements

      # wave 3 (3.R4): the SE deliverables of the phase (services/se_deliverables, agent S); a
      # warning by default (PI ruling), blocking when the instructor sets the deliverable checks to
      # block; the instructor may sign it off
      - id: PDR-SE-01
        question: "Are the systems-engineering deliverables of this phase ready?"
        category: se_process
        evidence: "Every deliverable the SE protocol (configs/se_protocol.yaml) asks of the phase is ready (state ok)"
        status: hybrid
        priority: should_pass
        owner_seat: systems_engineer
        step: C3

  # Nov 2026 (phase 2): the Critical Design Review, the last gate of the full ECSS profile.
  # Expectations after ECSS-E-ST-10C Annex A / ECSS-M-ST-10C Rev.1 §4.4.3.4.5 (clause numbers
  # to verify): the detailed design is justified and meets the requirements, the ICDs are
  # baselined, the TM/TC database, FDIR design and AOCS design are complete and consistent, the
  # operations products exist in draft, the AIV programme is ready and the budgets close with the
  # CDR system margin (10 %, C2O ladder). The CDR products live in the CDR model (routers/cdr.py);
  # the evidence thresholds are C2O defaults (configs/cdr_rules.yaml cdr_gate).
  phase_c:
    gate: CDR
    gate_name: "Critical Design Review"
    purpose: >
      Confirm that the detailed design is complete, justified and meets the requirements, that
      the interfaces and the TM/TC database are baselined, that failures are detected and
      recovered, and that the operations and AIV products are ready for manufacturing and test.
    authority: "Project Manager / Standing Review Board"
    exit_criteria:
      - id: CDR-EC-01
        question: "Does the detailed design meet every requirement, with its justification?"
        category: design
        evidence: "All checkable requirement thresholds met (design justification file; ECSS-E-ST-10C Annex A, to verify)"
        status: auto
        priority: must_pass
        owner_seat: systems_engineer
        step: C2
        fix: requirements

      - id: CDR-EC-02
        question: "Are the interface control documents baselined?"
        category: interfaces
        evidence: "Every accepted link has approved interface requirements agreed by both parties and no suggested link is left (ECSS-E-ST-10-24C ICD, to verify)"
        status: auto
        priority: must_pass
        owner_seat: systems_engineer
        step: B3
        fix: interfaces

      - id: CDR-EC-03
        question: "Is the TM/TC database complete and consistent?"
        category: tmtc
        evidence: "CDR model: parameters for every subsystem, HK structures, telecommands and events present, every row reviewed (no suggestion left) and no TM/TC alarm finding (ECSS-E-ST-70-41C / 70-31C, to verify)"
        status: auto
        priority: must_pass
        owner_seat: comms_engineer
        step: D1
        fix: tmtc

      - id: CDR-EC-04
        question: "Does the housekeeping fit the downlink in every mode, does the daily budget close with margin and do the stores hold the required days?"
        category: tmtc
        evidence: "HK bit rate ≤ HK share of the rate tier in the bootloader, safe, nominal and downlink regimes (cdr_rules.yaml downlink_budget, C2O default); the daily closure of the diagnostics-campaign case (C2) keeps the CDR daily margin and every sized HK store holds min_store_days (W3.05, services/data_budget.gate_check)"
        status: auto
        priority: must_pass
        owner_seat: comms_engineer
        step: D1
        fix: tmtc

      - id: CDR-EC-05
        question: "Is every critical failure mode detected and recovered on board?"
        category: fdir
        evidence: "Each FMECA failure mode with severity ≥ 4 has an accepted monitor and an event-action; no FDIR alarm finding (ECSS-E-ST-70-11C, ECSS-Q-ST-30-02C, to verify)"
        status: auto
        priority: must_pass
        owner_seat: systems_engineer
        step: D2
        fix: fdir

      - id: CDR-EC-06
        question: "Are the safe mode and the load-shed table defined?"
        category: fdir
        evidence: "Safe mode with entry triggers, AOCS mode, rate tier and exit; load-shed stages on named bus-protection levels; line states per mode consistent"
        status: auto
        priority: must_pass
        owner_seat: systems_engineer
        step: D2
        fix: fdir

      - id: CDR-EC-07
        question: "Are the AOCS mode machine and control parameters defined?"
        category: aocs
        evidence: "Every AOCS mode reachable, gains on every wheel mode, no AOCS alarm finding (ECSS-E-ST-60-30C, to verify)"
        status: auto
        priority: must_pass
        owner_seat: aocs_engineer
        step: D3
        fix: aocs

      - id: CDR-EC-08
        question: "Are the TT&C rate ladder, beacon and command-loss recovery defined?"
        category: ttc
        evidence: "Default, beacon and safe tiers exist in the ladder; command-loss timer and action set; no TT&C alarm finding"
        status: auto
        priority: must_pass
        owner_seat: comms_engineer
        step: D1
        fix: tmtc

      - id: CDR-EC-09
        question: "Are the operations products drafted (organisation, GO/NO-GO, flight rules)?"
        category: operations
        evidence: "Console positions, a GO/NO-GO matrix covering the critical telecommands and flight rules exist (ECSS-E-ST-70C, to verify); the flight operations plan is checked by the board"
        status: hybrid
        priority: should_pass
        owner_seat: mission_analyst
        step: D4
        fix: ops

      - id: CDR-EC-10
        question: "Do the budgets close with the CDR system margin?"
        category: budgets
        evidence: "dry mass × (1 + CDR system margin) <= mass target AND power demand × (1 + CDR system margin) <= EOL array power (margin_policy.yaml system_margin_ladder: 10 %)"
        status: auto
        priority: must_pass
        owner_seat: systems_engineer
        step: A6
        fix: budget

      - id: CDR-EC-11
        question: "Is the AIV programme ready (test specifications, facilities, model philosophy)?"
        category: verification
        evidence: "Manual: AIV plan and test specifications baselined; every requirement has a verification method"
        status: hybrid
        priority: should_pass
        owner_seat: systems_engineer
        step: C3
        fix: vv:risks

      # wave 3 (3.R4): the SE deliverables of the phase (services/se_deliverables, agent S); a
      # warning by default (PI ruling), blocking when the instructor sets the deliverable checks to
      # block; the instructor may sign it off
      - id: CDR-SE-01
        question: "Are the systems-engineering deliverables of this phase ready?"
        category: se_process
        evidence: "Every deliverable the SE protocol (configs/se_protocol.yaml) asks of the phase is ready (state ok)"
        status: hybrid
        priority: should_pass
        owner_seat: systems_engineer
        step: C3

  # ─────────────────────────────────────────────────────────── after CDR (wave 2, W4.09)
  # The reviews after CDR (ECSS-M-ST-10C Rev.1 §4.4; clause numbers and wording to verify):
  # * QR, end of qualification: the verification record shows the design meets the
  #   requirements, the qualification is complete and the deviations and waivers are acceptable.
  # * AR, acceptance of the flight model: the product is free of workmanship errors, its
  #   acceptance tests are passed and the acceptance data package (as built) is complete.
  # * FRR, flight readiness. In ECSS the FRR is held before launch, once the spacecraft is on
  #   the launcher. Canadian-agency CubeSat practice holds a flight readiness review before the
  #   spacecraft is delivered to the launch provider (it is integrated in the deployer by others
  #   and cannot be touched after delivery), so the FRR here also checks the delivery: launch
  #   provider documents accepted and the delivery configuration recorded.
  #
  # ``evaluated_by: review_record`` items are evaluated by services/gate_reviews.py
  # (post_cdr_criteria) with the RID log of the study: ``auto: rids_closed`` passes when every
  # RID and action of the earlier gates is closed or rejected; the others are board evidence
  # that the instructor signs off (manual, "Missing evidence: …" until then, so an unsigned FRR
  # is not ready and names what is missing). gate_evaluator.evaluate_gate leaves them to it and
  # evaluates the other items itself (QR-EC-01 from the requirement store). These replace the
  # interim gate_reviews.POST_CDR_CRITERIA table (same ids, questions and behaviour).
  phase_d_qr:
    gate: QR
    gate_name: "Qualification Review"
    purpose: >
      Confirm that the verification record shows the design meets every requirement, that the
      qualification campaign is complete and its non-conformances closed, and that the
      deviations and waivers are acceptable.
    authority: "Project Manager / Customer"
    exit_criteria:
      - id: QR-RR-01
        question: "Are the RIDs and actions of the earlier reviews closed?"
        category: review
        evidence: "Every RID and action of the earlier reviews closed or rejected"
        status: auto
        evaluated_by: review_record
        auto: rids_closed
        priority: must_pass
        owner_seat: systems_engineer
        step: C3

      - id: QR-RR-02
        question: "Have the qualification test results been reviewed and accepted by the board?"
        category: verification
        evidence: "Qualification test reports and the verification control document at qualification"
        status: manual
        evaluated_by: review_record
        priority: must_pass
        owner_seat: systems_engineer
        step: C3

      - id: QR-RR-03
        question: "Are the non-conformances of the qualification campaign closed or waived?"
        category: verification
        evidence: "NCR log with closure or waiver for every item"
        status: manual
        evaluated_by: review_record
        priority: must_pass
        owner_seat: systems_engineer
        step: C3

      - id: QR-RR-04
        question: "Are the deviations and waivers against the requirements accepted?"
        category: verification
        evidence: "Request-for-deviation and request-for-waiver log, each accepted by the customer (ECSS-M-ST-40C, to verify)"
        status: manual
        evaluated_by: review_record
        priority: must_pass
        owner_seat: team_leader
        step: C3

      - id: QR-EC-01
        question: "Does every requirement have a verification method and a close-out stage?"
        category: verification
        evidence: "Every live requirement other than a stakeholder need has a verification method and a close-out stage (verification control document, ECSS-E-ST-10-02C, to verify)"
        status: auto
        priority: must_pass
        owner_seat: systems_engineer
        step: C3
        fix: requirements

  phase_d_ar:
    gate: AR
    gate_name: "Acceptance Review"
    purpose: >
      Confirm that the flight model is free of workmanship errors, has passed its acceptance
      tests, and that its acceptance data package (as-built configuration, logbook, waivers) is
      complete.
    authority: "Customer"
    exit_criteria:
      - id: AR-RR-01
        question: "Are the RIDs and actions of the earlier reviews closed?"
        category: review
        evidence: "Every RID and action of the earlier reviews closed or rejected"
        status: auto
        evaluated_by: review_record
        auto: rids_closed
        priority: must_pass
        owner_seat: systems_engineer
        step: C3

      - id: AR-RR-02
        question: "Has the flight model passed its acceptance tests?"
        category: verification
        evidence: "Acceptance test reports of the flight (protoflight) model"
        status: manual
        evaluated_by: review_record
        priority: must_pass
        owner_seat: systems_engineer
        step: C3

      - id: AR-RR-03
        question: "Is the acceptance data package complete (as-built configuration, logbook, waivers)?"
        category: programmatic
        evidence: "Acceptance data package"
        status: manual
        evaluated_by: review_record
        priority: must_pass
        owner_seat: team_leader
        step: C3

      - id: AR-RR-04
        question: "Are the non-conformances of the acceptance campaign closed or waived?"
        category: verification
        evidence: "NCR log of the flight model with closure or waiver for every item"
        status: manual
        evaluated_by: review_record
        priority: must_pass
        owner_seat: systems_engineer
        step: C3

  phase_e_frr:
    gate: FRR
    gate_name: "Flight Readiness Review"
    purpose: >
      Confirm, before the spacecraft is delivered to the launch provider, that it is verified,
      licensed and ready to fly, that operations are ready, and that the delivery configuration
      and the launch provider's documents are accepted.
    authority: "Customer / Launch provider"
    exit_criteria:
      - id: FRR-RR-01
        question: "Are the RIDs and actions of the earlier reviews closed?"
        category: review
        evidence: "Every RID and action of the earlier reviews closed or rejected"
        status: auto
        evaluated_by: review_record
        auto: rids_closed
        priority: must_pass
        owner_seat: systems_engineer
        step: C3

      - id: FRR-RR-02
        question: "Is every verification item closed, or waived with a recorded justification?"
        category: verification
        evidence: "Verification control document with every item closed or waived"
        status: manual
        evaluated_by: review_record
        priority: must_pass
        owner_seat: systems_engineer
        step: C3

      - id: FRR-RR-03
        question: "Are the licences granted (spectrum, space station, earth stations, remote sensing)?"
        category: regulatory
        evidence: "Licences and their conditions"
        status: manual
        evaluated_by: review_record
        priority: must_pass
        owner_seat: team_leader
        step: C3

      - id: FRR-RR-04
        question: "Are operations ready (procedures validated, team trained, ground segment tested end to end)?"
        category: operations
        evidence: "Operations readiness: validated procedures, training records, end-to-end test report"
        status: manual
        evaluated_by: review_record
        priority: must_pass
        owner_seat: mission_analyst
        step: D4

      - id: FRR-RR-05
        question: "Are the as-built mass properties within the launch interface limits?"
        category: launch
        evidence: "Measured mass, centre of mass and the launch ICD limits"
        status: manual
        evaluated_by: review_record
        priority: must_pass
        owner_seat: structures_engineer
        step: A6

      - id: FRR-RR-06
        question: "Is the spacecraft ready for delivery (launch provider documents accepted, delivery configuration recorded)?"
        category: launch
        evidence: "Launch provider compliance checklist and ICD verification accepted; delivery configuration (remove-before-flight pin fitted, battery state of charge, storage limits) recorded"
        status: manual
        evaluated_by: review_record
        priority: must_pass
        owner_seat: team_leader
        step: C3


      # wave 3 (3.R4, SE-07a): in-orbit validation planned (agent S, validation coverage)
      - id: FRR-EC-01
        question: "Are the in-orbit validation activities planned?"
        category: validation
        evidence: "Every primary objective has an in-orbit (IOV or commissioning) validation activity planned"
        status: auto
        priority: must_pass
        owner_seat: mission_analyst
        step: D4