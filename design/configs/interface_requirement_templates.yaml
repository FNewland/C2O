# interface_requirement_templates.yaml — interface requirements (IRD content) generated from
# accepted interfaces (design rules IF-01; spacecdf_design_rules.md §1.2).
#
# ECSS-E-ST-10-24C separates the interface requirements document (IRD: what each side shall
# do) from the interface control document (ICD: the agreed definition). In SpaceCDF the
# accepted link + its properties + exchange items are the ICD content; the requirements made
# from these templates are the IRD content (requirement level "interface", relation
# "allocates" requirement → interface). EARS style, EN + FR.
#
# Template fields
#   id         unique; also the requirement's template_id
#   type       canonical interface type; subtypes: list (null = no subtype), omitted = any
#   subject    from | to: the element the requirement is placed on (and whose seat owns it)
#   method     verification method (ECSS-E-ST-10-02C: A, T, I, R; IF-08)
#   phase      verification phase
#   text       {en, fr} with {placeholders}; a missing value renders "TBD" and the
#              requirement stays draft (C2O-TBD check in requirement_rules.yaml)
#   values     placeholders the generator must resolve (beyond {from} {to})
#   subtypes_except  (wave 2) any subtype but these
#   trace_words      (wave 2) words that find the generated row's parent requirement: the
#              requirement on either end (or its subsystem) whose text holds most of them
#              ("word*" = prefix; default per interface type in interface_requirements.py)
#   trace_domains    (wave 2) subsystems also searched for the parent (thermal rows: Thermal)
#
# Wave 2 (agent R): a template row is written only when at least half of its values are known;
# otherwise it is a suggestion (fill the link, then sync). A subsystem-boundary row takes a
# value it lacks from the unit links it covers when they all agree on it (the OBC → EPS link
# takes the CAN bus, address and rate of the OBC → P60 node).
#
# Placeholders the generator resolves (services/interface_requirements.py `_values`):
#   from, to, rail_voltage, line, lcl_limit_a, current_peak_a, v_min, v_max, p_eol, protocol,
#   bus, address, rate, band, frequency_mhz, connector, mount_type, envelope_mm, t_min, t_max,
#   conductance_w_k, heater_power_w, accuracy_us, fov_deg, inhibit_count, delay_min, signal,
#   fitting

schema_version: 1
# W2.07: "boundary" = one IRD row set per subsystem boundary (the unit links under it are
# covered, links inside a subsystem get none); "link" = one row set per accepted link.
ird_scope: boundary
standard_ref: "ECSS-E-ST-10-24C (interface management: IRD/ICD); EARS; C2O default templates"

templates:
  # ── power ────────────────────────────────────────────────────────────────
  - id: IRT-PWR-SUPPLY
    type: power
    subtypes: [regulated, switched, null]
    subject: from
    method: T
    phase: CDR
    text:
      en: "The {from} shall supply the {to} with {rail_voltage} V on power line {line}, protected at {lcl_limit_a} A."
      fr: "L'élément {from} doit alimenter l'élément {to} en {rail_voltage} V sur la ligne d'alimentation {line}, protégée à {lcl_limit_a} A."
    values: [rail_voltage, line, lcl_limit_a]
  - id: IRT-PWR-DRAW
    type: power
    subtypes: [regulated, switched, null]
    subject: to
    method: T
    phase: CDR
    text:
      en: "The {to} shall draw no more than {current_peak_a} A from the {rail_voltage} V line."
      fr: "L'élément {to} ne doit pas consommer plus de {current_peak_a} A sur la ligne de {rail_voltage} V."
    values: [current_peak_a, rail_voltage]
  - id: IRT-PWR-BATTERY
    type: power
    subtypes: [battery_bus]
    subject: from
    method: T
    phase: CDR
    text:
      en: "The {from} shall supply the {to} with {v_min}–{v_max} V over the full state-of-charge range."
      fr: "L'élément {from} doit alimenter l'élément {to} entre {v_min} et {v_max} V sur toute la plage d'état de charge."
    values: [v_min, v_max]
  - id: IRT-PWR-ARRAY
    type: power
    subtypes: [array_input]
    subject: from
    method: A
    phase: PDR
    text:
      en: "The {from} shall deliver at least {p_eol} W at end of life to the {to} power-point tracker inputs."
      fr: "L'élément {from} doit fournir au moins {p_eol} W en fin de vie aux entrées des suiveurs de point de puissance de l'élément {to}."
    values: [p_eol]

  # ── data ─────────────────────────────────────────────────────────────────
  # W2.07: no ``null`` here any more: a data link without a subtype (a PPS line, a CSI-2 camera
  # link) is not a TM/TC bus, and the template rendered "on TBD bus TBD at address TBD"
  - id: IRT-DATA-BUS
    type: data
    subtypes: [tm_tc, bus]
    subject: to
    method: T
    phase: CDR
    text:
      en: "The {to} shall respond to telemetry and telecommand on {protocol} bus {bus} at address {address} at {rate} bit/s."
      fr: "L'élément {to} doit répondre aux demandes de télémesure et aux télécommandes sur le bus {protocol} {bus} à l'adresse {address}, à {rate} bit/s."
    values: [protocol, bus, address, rate]
  - id: IRT-DATA-PAYLOAD
    type: data
    subtypes: [payload_data]
    subject: from
    method: T
    phase: CDR
    text:
      en: "The {from} shall transfer payload data to the {to} over {protocol} at no less than {rate} bit/s."
      fr: "L'élément {from} doit transférer les données de charge utile à l'élément {to} par {protocol} à au moins {rate} bit/s."
    values: [protocol, rate]

  - id: IRT-DATA-CSI2
    type: data
    subtypes: [csi2]
    subject: from
    method: T
    phase: CDR
    text:
      en: "The {from} shall stream image data to the {to} over a MIPI CSI-2 link of {lanes} lanes at no less than {rate} bit/s."
      fr: "L'élément {from} doit transmettre les données d'image à l'élément {to} par une liaison MIPI CSI-2 de {lanes} voies à au moins {rate} bit/s."
    values: [lanes, rate]
  - id: IRT-DATA-TIMING
    type: data
    subtypes: [timing]
    subject: from
    method: T
    phase: CDR
    text:
      en: "The {from} shall send the {to} a time signal with an error of no more than {accuracy_us} µs."
      fr: "L'élément {from} doit envoyer à l'élément {to} un signal de temps avec une erreur d'au plus {accuracy_us} µs."
    values: [accuracy_us]

  # ── RF ───────────────────────────────────────────────────────────────────
  - id: IRT-RF-LINK
    type: rf
    subtypes: [space_ground]
    subject: from
    method: T
    phase: CDR
    text:
      en: "When in contact, the {from} shall exchange telemetry and telecommand with the {to} in {band}-band at {rate} bit/s with at least 3 dB link margin."
      fr: "Pendant un contact, l'élément {from} doit échanger télémesure et télécommande avec l'élément {to} en bande {band} à {rate} bit/s avec une marge de liaison d'au moins 3 dB."
    values: [band, rate]
  - id: IRT-RF-COAX
    type: rf
    subtypes: [coax, null]
    subject: from
    method: T
    phase: CDR
    text:
      en: "The {from} RF port shall connect to the {to} in {band}-band through a {connector} connector."
      fr: "Le port RF de l'élément {from} doit être relié à l'élément {to} en bande {band} par un connecteur {connector}."
    values: [band, connector]

  # ── mechanical ───────────────────────────────────────────────────────────
  - id: IRT-MECH-MOUNT
    type: mechanical
    subject: to
    method: I
    phase: CDR
    trace_words: [configuration, "accommodat*", mount, bracket, "fasten*"]
    trace_domains: [structure]
    text:
      en: "The {to} shall mount to the {from} by {mount_type}."
      fr: "L'élément {to} doit être fixé à l'élément {from} par {mount_type}."
    values: [mount_type]

  # ── thermal ──────────────────────────────────────────────────────────────
  - id: IRT-THERM-COND
    type: thermal
    subtypes: [conductive, null]
    subject: to
    method: A
    phase: PDR
    trace_words: [operating limits, every unit, stay within, temperature]
    trace_domains: [thermal]
    text:
      en: "The {to} interface with the {from} shall stay within {t_min} to {t_max} °C."
      fr: "L'interface de l'élément {to} avec l'élément {from} doit rester entre {t_min} et {t_max} °C."
    values: [t_min, t_max]
  - id: IRT-THERM-RAD
    type: thermal
    subtypes: [radiative]
    subject: to
    method: A
    phase: PDR
    trace_words: ["radiat*", heat, operating limits, every unit]
    trace_domains: [thermal]
    text:
      en: "The {to} shall reject the heat conducted from the {from} to space through its radiating surface."
      fr: "L'élément {to} doit évacuer vers l'espace, par sa surface rayonnante, la chaleur conduite depuis l'élément {from}."
    values: []
  - id: IRT-THERM-HEATER
    type: thermal
    subtypes: [heater]
    subject: from
    method: T
    phase: CDR
    trace_words: ["heater*", survival, minimum operating temperature, operating limits]
    trace_domains: [thermal]
    text:
      en: "When the {to} is below its minimum operating temperature, the {from} shall deliver {heater_power_w} W to it."
      fr: "Lorsque l'élément {to} est sous sa température minimale de fonctionnement, l'élément {from} doit lui fournir {heater_power_w} W."
    values: [heater_power_w]

  # ── timing ───────────────────────────────────────────────────────────────
  - id: IRT-TIME-PPS
    type: timing
    subject: from
    method: T
    phase: CDR
    text:
      en: "The {from} shall deliver a time reference to the {to} with an error of no more than {accuracy_us} µs."
      fr: "L'élément {from} doit fournir une référence de temps à l'élément {to} avec une erreur d'au plus {accuracy_us} µs."
    values: [accuracy_us]

  # ── optical ──────────────────────────────────────────────────────────────
  - id: IRT-OPT-FOV
    type: optical
    subject: to
    method: I
    phase: CDR
    text:
      en: "The {to} {fov_deg}° field of view shall be free of obstruction by the {from}."
      fr: "Le champ de vue de {fov_deg}° de l'élément {to} ne doit pas être obstrué par l'élément {from}."
    values: [fov_deg]

  # ── electrical signals (CubeSat Design Specification rev 14.1 §2.3) ────────
  # Wave 2 (agent R): one template per kind of signal. The single "provide the {to} with
  # {signal} through at least {inhibit_count} independent inhibits" template rendered
  # "provide the Space Segment with umbilical through at least TBD independent inhibits" and
  # asked a deployment switch for an inhibit count it does not have.
  - id: IRT-SIG-INHIBIT
    type: electrical_signal
    subtypes: [inhibit]
    subject: from
    method: T
    phase: CDR
    trace_words: ["inhibit*", "transmi*", silent, separation]
    text:
      en: "The {from} shall hold every transmitter of the {to} behind at least {inhibit_count} independent inhibits and keep it silent for at least {delay_min} min after deployment."
      fr: "L’élément {from} doit maintenir tout émetteur de l’élément {to} derrière au moins {inhibit_count} inhibitions indépendantes et le garder silencieux pendant au moins {delay_min} min après le déploiement."
    values: [inhibit_count, delay_min]
  - id: IRT-SIG-RELEASE
    type: electrical_signal
    subtypes: [release]
    subject: from
    method: T
    phase: CDR
    trace_words: [release, "deploy*", separation, "inhibit*"]
    text:
      en: "The {from} shall command the release of the {to} only through at least {inhibit_count} independent inhibits and not earlier than {delay_min} min after deployment."
      fr: "L’élément {from} ne doit commander le déploiement de l’élément {to} qu’au travers d’au moins {inhibit_count} inhibitions indépendantes et pas avant {delay_min} min après le déploiement."
    values: [inhibit_count, delay_min]
  - id: IRT-SIG-POWER-PATH
    type: electrical_signal
    subtypes: [deployment_switch, rbf]
    subject: from
    method: T
    phase: CDR
    trace_words: [deployment switch*, remove-before-flight, rbf, unpowered, "inhibit*"]
    text:
      en: "The {from} shall provide the {to} with the {signal}, so that no load is powered while the spacecraft is in the deployer."
      fr: "L’élément {from} doit fournir à l’élément {to} le dispositif suivant : {signal}, de sorte qu’aucune charge ne soit alimentée tant que le satellite est dans le déployeur."
    values: [signal]
  - id: IRT-SIG-SEPARATION
    type: electrical_signal
    subtypes: [umbilical, separation]
    subject: from
    method: T
    phase: CDR
    trace_words: [deployer, separation, deployment switch, cubesat design specification, launch]
    text:
      en: "The {from} shall signal separation to the {to} by releasing its deployment switches, or through an umbilical where the launch ICD provides one."
      fr: "L’élément {from} doit signaler la séparation à l’élément {to} en libérant ses interrupteurs de déploiement, ou par un ombilical si l’ICD de lancement en prévoit un."
    values: []
  - id: IRT-SIG-GENERIC
    type: electrical_signal
    subtypes_except: [inhibit, release, deployment_switch, rbf, umbilical, separation]
    subject: from
    method: T
    phase: CDR
    trace_words: [signal, "inhibit*"]
    text:
      en: "The {from} shall provide the {to} with {signal} through at least {inhibit_count} independent inhibits."
      fr: "L’élément {from} doit fournir à l’élément {to} le signal {signal} par au moins {inhibit_count} inhibitions indépendantes."
    values: [signal, inhibit_count]

  # ── fluid ────────────────────────────────────────────────────────────────
  - id: IRT-FLUID-FEED
    type: fluid
    subject: from
    method: T
    phase: CDR
    text:
      en: "The {from} shall feed the {to} through a {fitting} fitting."
      fr: "L'élément {from} doit alimenter l'élément {to} par un raccord {fitting}."
    values: [fitting]
