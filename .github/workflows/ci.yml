# C2O continuous integration: the fast tiers, on every push and PR.
# Tiers and how to run them locally: docs/TESTING.md.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sim-fast:
    name: sim · fast tier
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"          # sim/docker/Dockerfile
          cache: pip
          cache-dependency-path: |
            sim/pyproject.toml
            sim/packages/*/pyproject.toml
      - uses: actions/setup-node@v4       # JS-harness tests (tests/test_mcs, test_common)
        with:
          node-version: "20"
      - name: Install SMO packages (as sim/start.sh) and test tooling
        run: |
          python -m pip install --upgrade "pip>=25.1"
          pip install -e packages/smo-common
          pip install -e packages/smo-simulator -e "packages/smo-mcs[voice,iap]" \
                      -e packages/smo-planner -e packages/smo-rfsim \
                      -e packages/smo-link -e packages/smo-gateway
          pip install --group dev
      - name: Fast tier (parallel)
        run: >
          python -m pytest -n auto -m "not slow and not e2e"
          --timeout=300 --durations=25 -q -p no:cacheprovider

  design-fast:
    name: design · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: design
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # design/Dockerfile
          cache: pip
          cache-dependency-path: |
            design/pyproject.toml
            design/packages/*/pyproject.toml
      - name: Install SpaceCDF packages (as design/install.sh) and test tooling
        run: |
          python -m pip install --upgrade "pip>=25.1" setuptools wheel
          pip install -e packages/spacecdf-common
          pip install -e packages/spacecdf-kb
          pip install -e packages/spacecdf-agents
          pip install -e packages/spacecdf-server
          pip install --group dev
      - name: pytest (parallel, in-process; no live server)
        run: >
          python -m pytest -n auto -m "not live_server" --durations=15 -q -p no:cacheprovider
          --deselect tests/test_level_workbench.py --deselect tests/test_level_workbench_unit.py
      - name: "pytest (stepwise workbench files, serial: their steps share one study in order)"
        run: python -m pytest -m "not live_server" -q -p no:cacheprovider tests/test_level_workbench.py tests/test_level_workbench_unit.py

  frontend:
    name: design · frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: design/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: design/frontend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc -b
      - name: Build
        run: npx vite build

  i18n:
    name: i18n · ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [sim, design]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                  # the checker reads EN sources at earlier revisions
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/pyproject.toml
      - run: python -m pip install PyYAML
      - name: EN/FR parity check
        run: python3 -m tools.i18n check
